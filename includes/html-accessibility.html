<script>
(() => {
  "use strict";

  const normalizeEditorialMeta = () => {
    document.querySelectorAll(".callout-title-container").forEach((title) => {
      const text = title.textContent.replace(/\s+/g, " ").trim();
      if (text === "Naputak") {
        title.textContent = "Smjernica";
      } else if (text.includes("Razrada koraka")) {
        title.textContent = "Postupak rješenja";
      }
    });

    document
      .querySelectorAll(".mf1-priprema, .mf1-samoprovjera")
      .forEach((block) => {
        const heading = block.previousElementSibling;
        if (heading?.matches("h1, h2, h3, h4, h5, h6")) {
          heading.hidden = true;
        }
      });
  };

  const enhanceCollapsibleCallouts = () => {
    const headers = document.querySelectorAll(
      '.callout-header[data-bs-toggle="collapse"]'
    );

    for (const header of headers) {
      if (header.dataset.mf1KeyboardReady === "true") continue;

      const titleCopy = header
        .querySelector(".callout-title-container")
        ?.cloneNode(true);
      titleCopy
        ?.querySelectorAll(".screen-reader-only")
        .forEach((element) => element.remove());
      const title = titleCopy?.textContent.replace(/\s+/g, " ").trim();
      header.setAttribute("role", "button");
      header.setAttribute("tabindex", "0");
      header.setAttribute(
        "aria-label",
        title
          ? `Prikaži ili sakrij odjeljak: ${title}`
          : "Prikaži ili sakrij odjeljak"
      );
      header.dataset.mf1KeyboardReady = "true";

      header.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        event.preventDefault();
        header.click();
      });
    }
  };

  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded",
      () => {
        normalizeEditorialMeta();
        enhanceCollapsibleCallouts();
      },
      { once: true }
    );
  } else {
    normalizeEditorialMeta();
    enhanceCollapsibleCallouts();
  }
})();
</script>
