format:
  typst:
    font-paths:
      - assets/fonts/liberation-sans
    toc: true
    toc-depth: 2
    number-sections: true
    section-numbering: '1.1'
    colorlinks: true
    page-numbering: '1'
    theorem-appearance: simple
    include-in-header:
      - assets/typst/mf1-tokens.typ
      - assets/typst/mf1-author-blocks.typ
      - assets/typst/mf1-figures.typ
      - assets/typst/mf1-reading.typ
    template-partials:
      - assets/typst/typst-show.typ
      - assets/typst/biblio.typ
    keep-typ: false
    papersize: a4
    margin:
      x: 26mm
      y: 22mm
    fontsize: 11pt
    mainfont: Libertinus Serif
    linestretch: 1.08
    linkcolor: '#8e4519'
    citecolor: '#536577'
    filters:
      - at: post-quarto
        path: filters/mf1-typst-author-blocks.lua
