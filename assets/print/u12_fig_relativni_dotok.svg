<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" role="img" aria-labelledby="u14p2_title u14p2_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:920px;height:auto;">
<title id="u14p2_title">Relativni dotok i pokretna ploča</title><desc id="u14p2_desc">Otvorena sapnica dovodi slobodni mlaz do prednje strane nepropusne ploče. Voda se razlijeva prema dva otvorena ruba i ne prolazi kroz ploču. Ploča se giba u smjeru mlaza; relativni dotok c1 minus u ulazi u pokretni kontrolni volumen. Izlazne apsolutne strelice sadrže komponentu u. Kota d poprečna je mjera mlaza.</desc>
<defs>
<linearGradient id="u14p2_water" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#aed6f1"/><stop offset="100%" stop-color="#5b9ec9"/></linearGradient>
<linearGradient id="u14p2_oil" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#c8a000"/></linearGradient>
<linearGradient id="u14p2_hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1a2e42"/><stop offset="100%" stop-color="#1a3a52"/></linearGradient>
<pattern id="u14p2_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.8"/></pattern>
<marker id="u14p2_v" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#1e8449"/></marker>
<marker id="u14p2_dim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse"><path d="M0 0 L6 2.5 L0 5 Z" fill="#b7600c"/></marker>
<marker id="u14p2_dimSmall" markerWidth="3" markerHeight="3" refX="3" refY="1.5" orient="auto-start-reverse"><path d="M0 0 L3 1.5 L0 3 Z" fill="#b7600c"/></marker>
</defs>
<rect width="920" height="540" fill="white"/>
<g font-family="'Segoe UI',Arial,sans-serif" fill="#1a2530">
<!-- Zadržane neutralne boje i zaglavlja iz postojećih panela.
Jedna prostorna ispuna predstavlja isti fluid; nije mapa tlaka ili brzine.
Strelice imaju značenje iz oznake; izdvojeni vektori sila ne određuju hvatište. -->
<defs>
<marker id="u14p2_forceMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#c0392b"/></marker>
<marker id="u14p2_pressureMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#1565c0"/></marker>
<marker id="u14p2_reactionMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#1e8449"/></marker>
<marker id="u14p2_axisMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#3a4a56"/></marker>
</defs>
<defs><marker id="u14p2_motionMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#b7600c"/></marker></defs>
<rect x="20" y="20" width="480" height="490" rx="10" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.2"/>
<text x="39" y="47" font-size="14" fill="#1a2530" text-anchor="start" font-weight="700">Fiksna sapnica → mlaz → jedna pokretna ploča</text>
<text x="39" y="70" font-size="11" fill="#1a2530" text-anchor="start">KV prati ploču; presudna je relativna ulazna brzina.</text>
<path id="u14p2_inletTriangleu" d="M92.0000000 111.0000000 L132.0000000 111.0000000" fill="none" stroke="#b7600c" stroke-width="2.3" marker-end="url(#u14p2_motionMarker)"/>
<text x="112.0" y="102" font-size="12" fill="#b7600c" text-anchor="middle">u</text>
<path id="u14p2_inletTrianglew" d="M132.0000000 111.0000000 L202.0000000 111.0000000" fill="none" stroke="#1e8449" stroke-width="2.3" marker-end="url(#u14p2_reactionMarker)"/>
<text x="167.0" y="102" font-size="12" fill="#1e8449" text-anchor="middle">w</text>
<path id="u14p2_inletTrianglec" d="M92.0000000 141.0000000 L202.0000000 141.0000000" fill="none" stroke="#1565c0" stroke-width="2.3" marker-end="url(#u14p2_pressureMarker)"/>
<text x="147.0" y="159" font-size="12" fill="#1565c0" text-anchor="middle">c</text>
<line x1="92" y1="105" x2="92" y2="145" stroke="#7a8a96" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="202" y1="105" x2="202" y2="145" stroke="#7a8a96" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="318" y="115" font-size="11" fill="#1a2530" text-anchor="start">c₁ = 22; u = 8; w₁ = 14 m/s</text>
<defs><linearGradient id="u14p2_jetfield" gradientUnits="userSpaceOnUse" x1="0" y1="187" x2="0" y2="369"><stop offset="0%" stop-color="#aed6f1"/><stop offset="100%" stop-color="#5b9ec9"/></linearGradient></defs>
<path id="u14p2_jetfluid" d="M71 257.0 H295 Q314 257.0 314 238.0 V187 H321 V369 H314 V318.0 Q314 299.0 295 299.0 H71 Z" fill="url(#u14p2_jetfield)" stroke="none" stroke-width="1.8" />
<line id="u14p2_jettop" x1="71" y1="257.0" x2="123" y2="257.0" stroke="#3a4a56" stroke-width="2"/>
<line id="u14p2_jetbottom" x1="71" y1="299.0" x2="123" y2="299.0" stroke="#3a4a56" stroke-width="2"/>
<rect id="u14p2_jetplate" x="321" y="195" width="12" height="166" rx="0" fill="url(#u14p2_hatch)" stroke="#3a4a56" stroke-width="1.2"/>
<path id="u14p2_movingCV" d="M274 184 H345 V373 H274 Z" fill="none" stroke="#b7600c" stroke-width="1.2" stroke-dasharray="5 4"/>
<path id="u14p2_inflow" d="M135.0000000 278.0000000 L230.0000000 278.0000000" fill="none" stroke="#1565c0" stroke-width="2.3" marker-end="url(#u14p2_pressureMarker)"/>
<text x="182.5" y="263" font-size="12" fill="#1565c0" text-anchor="middle">c₁ = 22 m/s</text>
<line x1="54" y1="257.0" x2="64" y2="257.0" stroke="#b7600c" stroke-width="1.2"/>
<line x1="54" y1="299.0" x2="64" y2="299.0" stroke="#b7600c" stroke-width="1.2"/>
<path id="u14p2_d" d="M59 257.0 L59 299.0" fill="none" stroke="#b7600c" stroke-width="1.4" marker-start="url(#u14p2_dim)" marker-end="url(#u14p2_dim)"/>
<text x="46" y="245" font-size="11" fill="#b7600c" text-anchor="start">d = 38 mm</text>
<path id="u14p2_outTop" d="M317.5000000 187.0000000 L341.5000000 145.0000000" fill="none" stroke="#1565c0" stroke-width="2.3" marker-end="url(#u14p2_pressureMarker)"/>
<text x="372" y="168" font-size="12" fill="#1565c0" text-anchor="middle">c₂</text>
<path id="u14p2_outBottom" d="M317.5000000 369.0000000 L341.5000000 411.0000000" fill="none" stroke="#1565c0" stroke-width="2.3" marker-end="url(#u14p2_pressureMarker)"/>
<text x="372" y="413" font-size="12" fill="#1565c0" text-anchor="middle">c₂</text>
<path id="u14p2_motion" d="M347.0000000 278.0000000 L427.0000000 278.0000000" fill="none" stroke="#b7600c" stroke-width="2.3" marker-end="url(#u14p2_motionMarker)"/>
<text x="387.0" y="263" font-size="12" fill="#b7600c" text-anchor="middle">u = 8 m/s</text>
<text x="45" y="427" font-size="11" fill="#1a2530" text-anchor="start">c₂x = u; relativni izlaz prati prednju stranu ploče.</text>
<text x="45" y="449" font-size="11" fill="#1a2530" text-anchor="start">Debljina razlijevanja je shematska.</text>
<text x="45" y="477" font-size="11" fill="#1a2530" text-anchor="start">c: apsolutna; w: relativna; u: brzina ploče.</text>
<text x="45" y="496" font-size="10" fill="#1a2530" text-anchor="start">Trokut ulaza: 5 px za 1 m/s.</text>
<rect x="529" y="31" width="363" height="34" rx="8" fill="#1565c0" stroke="none" stroke-width="1.2"/>
<text x="710.5" y="54" font-size="15" fill="white" text-anchor="middle" font-weight="700">Rješenje — pokretni kontrolni volumen</text>
<rect x="529" y="79" width="363" height="73" rx="7" fill="#f4f9fd" stroke="#d4e3f0" stroke-width="1.2"/>
<rect x="529" y="79" width="4" height="73" rx="0" fill="#1565c0" stroke="none" stroke-width="1.2"/>
<text x="543" y="99" font-size="12" fill="#1565c0" text-anchor="start" font-weight="700">Ulazni presjek</text>
<text x="544" y="121" font-size="13" fill="#1a2530" text-anchor="start">d = 38 mm; ρ = 998 kg/m³</text>
<text x="544" y="142" font-size="13" fill="#1a2530" text-anchor="start">A = πd²/4</text>
<rect x="529" y="162" width="363" height="73" rx="7" fill="#f4f9fd" stroke="#d4e3f0" stroke-width="1.2"/>
<rect x="529" y="162" width="4" height="73" rx="0" fill="#1565c0" stroke="none" stroke-width="1.2"/>
<text x="543" y="182" font-size="12" fill="#1565c0" text-anchor="start" font-weight="700">Relativni ulaz</text>
<text x="544" y="204" font-size="13" fill="#1a2530" text-anchor="start">w₁ = c₁ − u = 14 m/s</text>
<text x="544" y="225" font-size="13" fill="#1a2530" text-anchor="start">ṁrel = ρA(c₁ − u)</text>
<rect x="529" y="245" width="363" height="73" rx="7" fill="#f4f9fd" stroke="#d4e3f0" stroke-width="1.2"/>
<rect x="529" y="245" width="4" height="73" rx="0" fill="#1e8449" stroke="none" stroke-width="1.2"/>
<text x="543" y="265" font-size="12" fill="#1e8449" text-anchor="start" font-weight="700">Protok kroz pokretni KV</text>
<text x="544" y="287" font-size="13" fill="#1a2530" text-anchor="start">ṁrel ≈ 15,85 kg/s</text>
<text x="544" y="308" font-size="13" fill="#1a2530" text-anchor="start">ṁsapnica ≈ 24,90 kg/s</text>
<rect x="529" y="328" width="363" height="73" rx="7" fill="#f4f9fd" stroke="#d4e3f0" stroke-width="1.2"/>
<rect x="529" y="328" width="4" height="73" rx="0" fill="#1e8449" stroke="none" stroke-width="1.2"/>
<text x="543" y="348" font-size="12" fill="#1e8449" text-anchor="start" font-weight="700">Usporedba</text>
<text x="544" y="370" font-size="13" fill="#1a2530" text-anchor="start">ṁrel / ṁsapnica = 14/22 ≈ 0,636</text>
<text x="544" y="391" font-size="13" fill="#1a2530" text-anchor="start">oko 63,6 % sapničkog protoka</text>
</g>
</svg>
