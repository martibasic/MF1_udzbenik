<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" role="img" aria-labelledby="u12frd_title u12frd_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:880px;height:auto;">
  <title id="u12frd_title">Relativni dotok na pokretnu lopaticu</title>
  <desc id="u12frd_desc">Mlaz iz fiksne sapnice promjera 38 mm izlazi apsolutnom brzinom c1 = 22 m/s i pogadja lopaticu koja se giba u istom smjeru brzinom u = 8 m/s. U pokretnom kontrolnom volumenu lopatice mlaz ulazi relativnom brzinom w1 = c1 - u = 14 m/s, pa kroz lopaticu prolazi samo 63,7 posto sapnickog masenog protoka, tj. m_tocka_rel = 15,85 kg/s.</desc>

  <defs>
    <!-- Strelica c1 (apsolutna brzina, plava) -->
    <marker id="u12frd_aC" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1565c0" />
    </marker>
    <!-- Strelica w1 (relativna brzina, zelena/teal) -->
    <marker id="u12frd_aW" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#0f766e" />
    </marker>
    <!-- Strelica u (transport, narandzasta) -->
    <marker id="u12frd_aU" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#b45309" />
    </marker>
    <!-- Strelica kote -->
    <marker id="u12frd_aDim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L6,2.5 z" fill="#b7600c" />
    </marker>
    <marker id="u12frd_aDimR" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse">
      <path d="M0,0 L0,5 L6,2.5 z" fill="#b7600c" />
    </marker>

    <!-- Voda (mlaz) - horizontalni gradient za vizualnu duljinu mlaza -->
    <linearGradient id="u12frd_voda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aed6f1" />
      <stop offset="100%" stop-color="#5b9ec9" />
    </linearGradient>
    <!-- Mlaz koji "izmice" lopatici - blago izblijedi prema desno -->
    <linearGradient id="u12frd_mlazRel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#aed6f1" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#5b9ec9" stop-opacity="0.95" />
    </linearGradient>
    <!-- Hatch za sapnicu i tlo -->
    <pattern id="u12frd_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.1" />
    </pattern>
  </defs>

  <!-- Pozadina + okvir -->
  <rect width="920" height="540" fill="#ffffff" />
  <!-- Vertikalni separator izmedju panela -->
  <line x1="556" y1="36" x2="556" y2="504" stroke="#dce7f0" stroke-width="1.2" stroke-dasharray="4,5" />

  <!-- ==================== LIJEVI PANEL: FIZIKALNI MODEL ==================== -->

  <!-- Sapnica (fiksna, na tlu) - hatched konus -->
  <!-- Tijelo sapnice: trapezoidno (sira straga, suzava se prema vrhu) -->
  <path d="M 38,178 L 78,178 L 78,228 L 108,228 L 108,300 L 78,300 L 78,350 L 38,350 Z" fill="url(#u12frd_hatch)" stroke="#3a4a56" stroke-width="1.4" />
  <!-- Otvor sapnice (tamni) -->
  <rect x="106" y="240" width="6" height="48" fill="#2d3a40" />
  <!-- Sapnica label -->
  <!-- Kota d sapnice: vertikalna kota IZNAD i ispod mlaza s ekstenzijama (offset desno od sapnice) -->
  <!-- Ekstenzijske linije od rubova mlaza vode IZNAD/IZPOD mlaza, dim linija ide IZVAN mlaza -->
  <!-- Stavi kotu pod kutem prema desno-dolje gdje je prazan prostor -->
  <!-- Pomocne linije: gornji rub mlaza (x=112,y=240) i donji rub (x=112,y=288) protezu se prema dolje-desno -->
  <!-- Tik-crte na koncu pomocnih linija (perpendikularno na dim liniju) -->
  <!-- Dim linija je vertikalna na x=142 izmedju y=304 i y=324 -->
  <!-- Labela desno od dim linije -->
  <!-- ==================== MLAZ ==================== -->
  <!-- Cijeli sapnicki mlaz: od izlaza sapnice (x=112) do polozaja lopatice. -->
  <!-- Visina mlaza = promjer d = 48 px (od y=240 do y=288) -->
  <!-- Puni sapnicki mlaz (svjetlo plav) - prikazuje sto bi proteklo da lopatica miruje -->
  <rect x="112" y="240" width="280" height="48" fill="url(#u12frd_voda)" opacity="0.45" />

  <!-- Relativni dotok - dio koji STVARNO ulazi u KV lopatice: 63,7% duljine -->
  <!-- Pocetak istocan sapnici, kraj kod lopatice (x=112 do x=290 => 178 px = 63,7% od 280) -->
  <rect x="112" y="240" width="178" height="48" fill="url(#u12frd_mlazRel)" />
  <!-- Gornji i donji rub mlaza (relativni dio, jasna granica) -->
  <line x1="112" y1="240" x2="290" y2="240" stroke="#1565c0" stroke-width="1.4" />
  <line x1="112" y1="288" x2="290" y2="288" stroke="#1565c0" stroke-width="1.4" />

  <!-- Granica izmedju "relativni" i "preostali, izmaknuti" dio mlaza -->
  <line x1="290" y1="240" x2="290" y2="288" stroke="#1565c0" stroke-width="1" stroke-dasharray="3,3" />

  <!-- ==================== POKRETNA LOPATICA ==================== -->
  <!-- Lopatica polukruzna sa konkavom okrenutom prema mlazu (lijevo) -->
  <!-- Stoji na kotacima, pozicija: lijevi rub plostine kontakta na x=290 -->
  <!-- Tijelo lopatice -->
  <path d="M 290,228 C 350,228 380,248 380,264 C 380,280 350,300 290,300 Z" fill="#cfd8de" stroke="#3a4a56" stroke-width="1.6" />
  <!-- Konkavna povrsina (gdje mlaz udara) - tamniji teal akcent -->
  <path d="M 290,232 C 304,232 314,242 316,264 C 314,286 304,296 290,296" fill="none" stroke="#0f766e" stroke-width="1.6" />
  <!-- Voda u uvali lopatice -->
  <path d="M 290,240 C 300,240 308,250 310,264 C 308,278 300,288 290,288 Z" fill="url(#u12frd_voda)" opacity="0.85" />

  <!-- Sasija/nosac do kotaca -->
  <rect x="298" y="300" width="74" height="14" fill="#5d6d7e" stroke="#3a4a56" stroke-width="1" />
  <!-- Kotaci (na vozilu, na tlu) -->
  <circle cx="312" cy="324" r="10" fill="#909fa8" stroke="#2d3a40" stroke-width="1.6" />
  <circle cx="358" cy="324" r="10" fill="#909fa8" stroke="#2d3a40" stroke-width="1.6" />
  <circle cx="312" cy="324" r="3" fill="#2d3a40" />
  <circle cx="358" cy="324" r="3" fill="#2d3a40" />

  <!-- Lopatica label (desno od lopatice, ne preko mlaza) -->
  <!-- Tlo / sina (cijela siroka linija) -->
  <line x1="20" y1="335" x2="546" y2="335" stroke="#3a4a56" stroke-width="1.5" />
  <rect x="20" y="335" width="526" height="6" fill="url(#u12frd_hatch)" />

  <!-- ==================== STRELICE BRZINA ==================== -->
  <!-- Skala: 1 m/s = 7 px. c1=22=>154 px, u=8=>56 px, w1=14=>98 px -->

  <!-- c1: apsolutna brzina mlaza (plava), iznad mlaza, od sapnice prema desno -->
  <line x1="118" y1="200" x2="272" y2="200" stroke="#1565c0" stroke-width="2.8" marker-end="url(#u12frd_aC)" />
  <!-- u: brzina lopatice (narandzasta), ISPOD lopatice na visini kotaca -->
  <line x1="298" y1="370" x2="354" y2="370" stroke="#b45309" stroke-width="2.8" marker-end="url(#u12frd_aU)" />
  <!-- w1: relativna brzina ULAZA U KV (zelena/teal), iznad mlaza neposredno uz lopaticu, krace od c1 -->
  <!-- Pozicionirana tako da gornji rub poklapa lijevi rub c1 strelice za jasnu usporedbu duljina -->
  <line x1="118" y1="166" x2="216" y2="166" stroke="#0f766e" stroke-width="2.8" marker-end="url(#u12frd_aW)" />
  <!-- u kao komplement na razini w1: pokazuje "preostatak" do c1 -->
  <line x1="216" y1="166" x2="272" y2="166" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#u12frd_aU)" />
  <!-- Tankisi vertikalni indikatori usporedbe duljine -->
  <line x1="118" y1="174" x2="118" y2="206" stroke="#5a6a78" stroke-width="0.5" stroke-dasharray="2,2" />
  <line x1="272" y1="174" x2="272" y2="206" stroke="#5a6a78" stroke-width="0.5" stroke-dasharray="2,2" />

  <!-- Legenda boja (donji lijevi kut) -->
  <rect x="32" y="438" width="500" height="58" rx="6" fill="#f4f9fd" stroke="#cfe0ee" stroke-width="1" />
  <line x1="44" y1="468" x2="68" y2="468" stroke="#1565c0" stroke-width="2.8" />
  <line x1="44" y1="484" x2="68" y2="484" stroke="#0f766e" stroke-width="2.8" />
  <line x1="260" y1="468" x2="284" y2="468" stroke="#b45309" stroke-width="2.8" />
  <!-- ==================== DESNI PANEL: FORMULE + REZULTATI ==================== -->

  <!-- Header bar (plava tema = procesni rezultat) -->
  <rect x="578" y="44" width="312" height="332" rx="10" fill="#f4f9fd" stroke="#1565c0" stroke-width="1.4" />
  <rect x="578" y="44" width="312" height="30" rx="10" fill="#1565c0" />
  <rect x="578" y="60" width="312" height="14" fill="#1565c0" />
  <!-- Blok 1: A (povrsina sapnice) -->
  <line x1="600" y1="154" x2="868" y2="154" stroke="#c8d6e4" stroke-width="1" />

  <!-- Blok 2: w1 -->
  <line x1="600" y1="230" x2="868" y2="230" stroke="#c8d6e4" stroke-width="1" />

  <!-- Blok 3: m_rel -->
  <line x1="600" y1="306" x2="868" y2="306" stroke="#c8d6e4" stroke-width="1" />

  <!-- Blok 4: omjer -->
  <!-- REZULTATI badge -->
  <rect x="578" y="394" width="312" height="78" rx="8" fill="#e8f5e9" stroke="#1e8449" stroke-width="1.5" />
  <!-- Italic foot -->
  <!-- Donja zajednicka napomena (lijevo, ispod legende) -->
  <line x1="112" y1="240" x2="142" y2="304" stroke="#b7600c" stroke-width="0.7" />
  <line x1="112" y1="288" x2="142" y2="324" stroke="#b7600c" stroke-width="0.7" />
  <line x1="138" y1="304" x2="146" y2="304" stroke="#b7600c" stroke-width="1.2" />
  <line x1="138" y1="324" x2="146" y2="324" stroke="#b7600c" stroke-width="1.2" />
  <line x1="142" y1="306" x2="142" y2="322" stroke="#b7600c" stroke-width="1.2" marker-start="url(#u12frd_aDimR)" marker-end="url(#u12frd_aDim)" />
  <text x="36" y="56" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#1a2530">Fizikalni model</text>
  <text x="36" y="75" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#5a6a78">fiksna sapnica → mlaz → pokretna lopatica</text>

  <text x="58" y="395" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1a2530">sapnica</text>
  <text x="58" y="411" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#5a6a78">(fiksna)</text>

  <text x="394" y="258" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1a2530">pokretna</text>
  <text x="394" y="274" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1a2530">lopatica</text>
  <text x="394" y="290" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-style="italic" fill="#5a6a78">(pokretni KV)</text>

  <text x="195" y="190" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="#1565c0"><tspan font-weight="700">c</tspan>₁ = 22 m/s</text>

  <text x="326" y="388" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="#b45309"><tspan font-weight="700">u</tspan> = 8 m/s</text>

  <text x="167" y="156" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="#0f766e"><tspan font-weight="700">w</tspan>₁ = 14 m/s</text>

  <text x="244" y="157" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#b45309"><tspan font-weight="700">u</tspan> (lopatica izmiče)</text>
  <text x="44" y="456" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#1a2530">Brzine</text>
  <text x="74" y="472" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a2530"><tspan font-weight="700" font-style="italic">c</tspan>₁ apsolutna (mlaz)</text>
  <text x="74" y="488" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a2530"><tspan font-weight="700" font-style="italic">w</tspan>₁ relativna (ulaz u KV)</text>
  <text x="290" y="472" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a2530"><tspan font-weight="700" font-style="italic">u</tspan> transport (lopatica)</text>
  <text x="290" y="488" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" fill="#5a6a78">Pokretni KV: ulazi samo ṁ<tspan baseline-shift="sub" font-size="0.7em">rel</tspan> = ρ A w₁</text>

  <text x="734" y="64" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Rjesenje — relativni dotok</text>

  <text x="734" y="98" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">površina sapnice</text>
  <text x="734" y="120" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">A</tspan> = π <tspan font-style="italic">d</tspan>² / 4</text>
  <text x="734" y="140" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">≈ 1,134·10⁻³ m²</text>
  <text x="734" y="174" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">relativna ulazna brzina</text>
  <text x="734" y="196" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">w</tspan>₁ = <tspan font-style="italic">c</tspan>₁ − <tspan font-style="italic">u</tspan> = 22 − 8</text>
  <text x="734" y="216" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0f766e">= 14 m/s</text>
  <text x="734" y="250" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">relativni maseni protok</text>
  <text x="734" y="272" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">ṁ</tspan><tspan baseline-shift="sub" font-size="0.7em">rel</tspan> = ρ <tspan font-style="italic">A</tspan> <tspan font-style="italic">w</tspan>₁</text>
  <text x="734" y="292" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1e8449">≈ 15,85 kg/s</text>
  <text x="734" y="326" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">omjer relativnog i sapničkog protoka</text>
  <text x="734" y="348" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">ṁ</tspan><tspan baseline-shift="sub" font-size="0.7em">rel</tspan> / <tspan font-style="italic">ṁ</tspan> = <tspan font-style="italic">w</tspan>₁ / <tspan font-style="italic">c</tspan>₁</text>
  <text x="734" y="368" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b">= 14 / 22 ≈ 0,637</text>

  <text x="734" y="414" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#5a6a78">REZULTATI</text>
  <text x="734" y="436" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1e8449"><tspan font-style="italic">ṁ</tspan><tspan baseline-shift="sub" font-size="0.7em">rel</tspan> ≈ 15,85 kg/s</text>
  <text x="734" y="458" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b">relativni protok ≈ 63,7 % sapničkog</text>

  <text x="734" y="494" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" text-anchor="middle" fill="#5a6a78">Lopatica izmiče mlazu → u njezin KV ulazi samo razlika brzina.</text>

  <text x="32" y="518" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" fill="#5a6a78">ρ = 998 kg/m³, <tspan font-style="italic">d</tspan> = 38 mm. Skala strelica: 1 m/s ≈ 7 px (<tspan font-style="italic">c</tspan>₁ 154 px, <tspan font-style="italic">w</tspan>₁ 98 px, <tspan font-style="italic">u</tspan> 56 px).</text>
<text x="148" y="319" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b7600c"><tspan font-style="italic">d</tspan> = 38 mm</text>

  </svg>