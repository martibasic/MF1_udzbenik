      <line x1="54" y1="299.0" x2="64" y2="299.0" stroke="#657781" stroke-width="1.2" />
      <path id="u14p2_d" d="M59 257.0 L59 299.0" fill="none" stroke="#657781" stroke-width="1.4" marker-start="url(#u14p2_dim)" marker-end="url(#u14p2_dim)" />
      <text x="46" y="245" font-size="11" fill="#263746" text-anchor="start">d = 38 mm</text>
