  <text x="232" y="46" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#1a2530" text-anchor="middle">Zatvoreni vodeni spremnik</text>
  <text x="232" y="64" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#5a6a78" text-anchor="middle">plinski pretlak iznad mirne razine, priključak A na dubini h</text>
  <text x="232" y="113" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-style="italic" fill="#8b6914" text-anchor="middle" font-weight="700">plin (zrak): <tspan font-style="italic">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">G,m</tspan> = 18 kPa</text>
  <text x="46" y="295" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" font-style="italic" fill="#c0392b" text-anchor="middle">A</text>
  <text x="272" y="232" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#1565c0" font-weight="700">+ρ g h</text>
  <text x="272" y="248" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#1565c0">hidrostatski</text>
  <text x="272" y="260" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#1565c0">doprinos</text>
  <text x="180" y="372" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-style="italic" fill="#0d47a1">voda</text>
  <text x="180" y="389" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a2530">ρ = 998 kg/m³</text>
  <text x="232" y="80" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78" text-anchor="middle">
    <tspan font-style="italic">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">atm</tspan> = 100,8 kPa (okolina)</text>
  <text x="232" y="446" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78" text-anchor="middle">Hod kroz fluid: kreni od plinskog prostora dolje za dubinu <tspan font-style="italic">h</tspan>
  </text>
  <text x="232" y="462" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78" text-anchor="middle">u priključku A vrijedi: <tspan font-style="italic">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">A</tspan> = <tspan font-style="italic">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">G</tspan> + ρ g h</text>
  <text x="665" y="46" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#1a2530" text-anchor="middle">Postupak: tri koraka</text>
  <text x="665" y="64" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#5a6a78" text-anchor="middle">apsolutni i manometarski tlak u priključku A</text>
  <text x="504" y="132" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#5a6a78">
    <tspan font-style="italic">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">G</tspan> = <tspan font-style="italic">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">atm</tspan> + <tspan font-style="italic">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">G,m</tspan> = 100,8 + 18,0 kPa</text>
  <text x="504" y="158" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1565c0">
    <tspan font-style="italic">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">G</tspan> = 118,8 kPa = 118 800 Pa</text>
  <text x="504" y="210" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1565c0">2. Apsolutni tlak u točki A</text>
  <text x="504" y="234" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#5a6a78">
    <tspan font-style="italic">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">A</tspan> = <tspan font-style="italic">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">G</tspan> + ρ g h</text>
  <text x="504" y="258" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">= 118 800 + 998 · 9,81 · 1,40</text>
  <text x="504" y="282" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1565c0">
    <tspan font-style="italic">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">A</tspan> ≈ 132 507 Pa ≈ 132,5 kPa</text>
  <text x="504" y="336" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1e8449">3. Manometarski tlak u točki A</text>
  <text x="504" y="360" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#5a6a78">
    <tspan font-style="italic">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">A,m</tspan> = <tspan font-style="italic">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">A</tspan> − <tspan font-style="italic">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">atm</tspan> = 132 507 − 100 800</text>
  <text x="504" y="386" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e8449">
    <tspan font-style="italic">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">A,m</tspan> ≈ 31 707 Pa ≈ 31,7 kPa</text>
  <text x="665" y="434" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#5a6a78">REZULTATI</text>
  <text x="545" y="458" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1565c0">
    <tspan font-style="italic">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">G</tspan> ≈ 118,8 kPa</text>
  <text x="665" y="458" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1565c0">
    <tspan font-style="italic">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">A</tspan> ≈ 132,5 kPa</text>
  <text x="790" y="458" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e8449">
    <tspan font-style="italic">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">A,m</tspan> ≈ 31,7 kPa</text>
  <text x="414" y="236" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" font-style="italic" fill="#b7600c">h</text>
  <text x="414.0" y="252.0" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b7600c">= 1,4 m</text>
  <text x="504" y="108" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#b7600c">1. Apsolutni tlak u plinskom prostoru</text>
