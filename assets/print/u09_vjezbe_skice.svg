<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="u09vs_title u09vs_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:960px;height:auto;">
  <title id="u09vs_title">Skice šest vježbi energijske bilance</title>
  <desc id="u09vs_desc">Otvorena sapnica, konfuzor, silazno suženje, izdignuti Pitotov senzor, izbor grla te napunjen sifon s izlaznim mlazom. Kote visina odnose se na osi i površine; promjeri su poprečne mjere. Debljine cijevi sifona i sapnice uvećane su za čitljivost.</desc>
