<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440" role="img" aria-labelledby="u10c1-title u10c1-sub">
  <defs>
    <linearGradient id="u10c1-wg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4eef8"/>
      <stop offset="100%" stop-color="#7ec8e8"/>
    </linearGradient>
    <linearGradient id="u10c1-hg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0b0b8"/>
      <stop offset="100%" stop-color="#808090"/>
    </linearGradient>
    <linearGradient id="u10c1-gas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="100%" stop-color="#fff9c4"/>
    </linearGradient>
    <pattern id="u10c1-sraf" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#8090a0"/>
      <line x1="0" y1="8" x2="8" y2="0" stroke="#546e7a" stroke-width="1.8"/>
    </pattern>
    <marker id="u10c1-arrG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#0f766e"/>
    </marker>
    <marker id="u10c1-arrO" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#c49a0a"/>
    </marker>
    <marker id="u10c1-arrOrev" markerWidth="10" markerHeight="10" refX="4" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L6,3 z" fill="#c49a0a"/>
    </marker>
    <marker id="u10c1-arrR" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#b42318"/>
    </marker>
    <marker id="u10c1-arrRrev" markerWidth="10" markerHeight="10" refX="4" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L6,3 z" fill="#b42318"/>
    </marker>
  </defs>
  <rect width="940" height="440" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="392" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>
  <title id="u10c1-title">U10 CH 1 – Tlačni spremnik s Pitot kontrolom</title>
  <desc id="u10c1-desc">Zatvoreni tlačni spremnik A potiskuje vodu kroz horizontalnu cijev D=80 mm. Pitot sonda u presjeku C mjeri v=3,34 m/s. Realni Bernoulli A→B daje potrebni pretlak p_MA=80,9 kPa.</desc>
  <!-- Titles -->
  <text x="54" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#173043">U10 · CH 1 – Tlačni spremnik, Pitot kontrola, realni Bernoulli</text>
  <text x="54" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#516677">D=80 mm, L=32 m, λ=0,025, Σξ=3,5, Δh_Hg=45 mm → v=3,34 m/s, p_MA=80,9 kPa</text>
  <!-- === TANK A (pressurized, closed) === -->
  <!-- Tank at x=44..174, y=120..310 -->
  <rect x="44" y="118" width="132" height="198" rx="8" fill="#fffef6" stroke="#546e7a" stroke-width="2.5"/>
  <!-- Gas (pressure) space: y=118..218 -->
  <rect x="46" y="120" width="128" height="100" rx="6" fill="url(#u10c1-gas)" stroke="none"/>
  <!-- Water in tank: y=218..308 -->
  <rect x="46" y="218" width="128" height="98" rx="0" fill="url(#u10c1-wg)" stroke="none"/>
  <!-- Water surface in tank -->
  <line x1="44" y1="218" x2="176" y2="218" stroke="#546e7a" stroke-width="2"/>
  <!-- Gas pressure label -->
  <text x="110" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c49a0a" text-anchor="middle">p_MA</text>
  <text x="110" y="173" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#c49a0a" text-anchor="middle">=80,9 kPa</text>
  <text x="110" y="191" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#516677" text-anchor="middle">(nadtlak)</text>
  <!-- Tank A label -->
  <circle cx="84" cy="130" r="12" fill="#173043"/>
  <text x="84" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="700">A</text>
  <!-- Entry pipe from tank to horizontal pipe -->
  <rect x="174" y="248" width="18" height="20" fill="url(#u10c1-wg)" stroke="#546e7a" stroke-width="1.5"/>
  <!-- === HORIZONTAL PIPE A→B === -->
  <!-- Pipe: x=188..738, y=242..272 (horizontal, z_A = z_B = pipe centerline) -->
  <!-- Srafura walls -->
  <rect x="188" y="210" width="552" height="32" fill="url(#u10c1-sraf)"/>
  <rect x="188" y="274" width="552" height="32" fill="url(#u10c1-sraf)"/>
  <!-- Water body -->
  <rect x="188" y="242" width="552" height="32" fill="url(#u10c1-wg)" stroke="#546e7a" stroke-width="1.5"/>
  <!-- Flow arrow in pipe -->
  <line x1="210" y1="258" x2="290" y2="258" stroke="#0f766e" stroke-width="3" marker-end="url(#u10c1-arrG)"/>
  <line x1="580" y1="258" x2="660" y2="258" stroke="#0f766e" stroke-width="3" marker-end="url(#u10c1-arrG)"/>
  <text x="308" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0f766e">v=3,34 m/s</text>
  <!-- Free exit B -->
  <circle cx="740" cy="258" r="6" fill="#173043"/>
  <line x1="740" y1="258" x2="810" y2="258" stroke="#0f766e" stroke-width="4" marker-end="url(#u10c1-arrG)"/>
  <circle cx="840" cy="258" r="12" fill="#173043"/>
  <text x="840" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="700">B</text>
  <!-- === PITOT AT SECTION C (x=460) === -->
  <circle cx="460" cy="242" r="5" fill="#be123c"/>
  <rect x="454" y="138" width="12" height="106" fill="#ddd" stroke="#546e7a" stroke-width="1.5"/>
  <!-- Pitot pointed upstream -->
  <polygon points="420,254 460,242 420,230" fill="#173043"/>
  <!-- Pitot static port at x=510 -->
  <circle cx="510" cy="242" r="5" fill="#0f766e"/>
  <!-- U-tube manometer at right of Pitot -->
  <!-- Connections: Pitot (p₀) → right arm; Static (p) → left arm -->
  <path d="M460,138 L590,138 L590,155" fill="none" stroke="#be123c" stroke-width="1.8" stroke-dasharray="4 3"/>
  <path d="M510,242 L510,160 L558,160 L558,155" fill="none" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="4 3"/>
  <!-- Manometer U-tube: left arm x=546..568, right arm x=580..602, bottom y=234 -->
  <rect x="545" y="155" width="24" height="80" rx="3" fill="none" stroke="#546e7a" stroke-width="2"/>
  <rect x="579" y="155" width="24" height="80" rx="3" fill="none" stroke="#546e7a" stroke-width="2"/>
  <rect x="545" y="227" width="58" height="14" rx="3" fill="none" stroke="#546e7a" stroke-width="2"/>
  <!-- Water in left arm: y=155..186 -->
  <rect x="547" y="157" width="20" height="28" fill="url(#u10c1-wg)" opacity="0.9"/>
  <!-- Water in right arm: y=155..198 -->
  <rect x="581" y="157" width="20" height="42" fill="url(#u10c1-wg)" opacity="0.9"/>
  <!-- Hg fill left arm: y=186..227 -->
  <rect x="547" y="185" width="20" height="42" fill="url(#u10c1-hg)"/>
  <!-- Hg fill right arm: y=198..227 (lower - stagnation pushes down) -->
  <rect x="581" y="199" width="20" height="28" fill="url(#u10c1-hg)"/>
  <!-- Hg bottom -->
  <rect x="547" y="228" width="56" height="12" fill="url(#u10c1-hg)"/>
  <!-- Δh_Hg arrow: left top (186) to right top (199), 13px ≈ 45mm visual at 3px/mm -->
  <!-- Actually: left=186, right=199, Δ=13px at 3px/mm = 43mm ≈ 45mm; good enough -->
  <line x1="614" y1="185" x2="614" y2="199" stroke="#c49a0a" stroke-width="2.5" marker-start="url(#u10c1-arrOrev)" marker-end="url(#u10c1-arrO)"/>
  <rect x="618" y="183" width="92" height="22" rx="6" fill="#fffef6" stroke="#c49a0a" stroke-width="1.5"/>
  <text x="664" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#c49a0a" text-anchor="middle">Δh_Hg=45 mm</text>
  <!-- Pitot C label -->
  <text x="435" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#be123c" text-anchor="end">C (Pitot)</text>
  <!-- EGL annotation -->
  <!-- EGL drops: from A surface to B exit -->
  <!-- EGL at A: p_MA/ρg + z_A + 0 (big tank, v≈0) = 80900/9810 + z_A = 8.25 + z_A -->
  <!-- Taking pipe centerline as z=0: z_A = z_pipe, so EGL_A = 8.25m above pipe -->
  <!-- Scale: 8.25m at maybe 10px/m = 82.5px above pipe y=258 → EGL at y=258-82=176 -->
  <!-- EGL at B: z_B + 0 + v²/2g = 0 + 0 + 0.569 = 0.569m → y = 258-5.7 ≈ 252 -->
  <!-- Total EGL drop = 8.25 - 0.569 = 7.68m ≈ h_w (7.68m) → EGL drops 76.8px at 10px/m -->
  <!-- Draw EGL from (192,176) to (738,253), dark red dashed -->
  <line x1="192" y1="175" x2="738" y2="253" stroke="#b42318" stroke-width="2.5" stroke-dasharray="9 5"/>
  <!-- HGL: EGL - v²/2g=0.569m → 5.7px below EGL -->
  <line x1="192" y1="181" x2="738" y2="259" stroke="#6d2694" stroke-width="2" stroke-dasharray="7 4"/>
  <!-- EGL/HGL labels -->
  <text x="180" y="173" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#b42318" text-anchor="end">EGL</text>
  <text x="180" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#6d2694" text-anchor="end">HGL</text>
  <!-- h_w annotation -->
  <line x1="756" y1="175" x2="756" y2="253" stroke="#b42318" stroke-width="1.5" marker-start="url(#u10c1-arrRrev)" marker-end="url(#u10c1-arrR)"/>
  <rect x="762" y="200" width="62" height="22" rx="4" fill="#fff5f5" stroke="#b42318" stroke-width="1.2"/>
  <text x="793" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#b42318" text-anchor="middle">h_w=7,68 m</text>
  <!-- L pipe dimension -->
  <line x1="188" y1="314" x2="740" y2="314" stroke="#546e7a" stroke-width="1.2"/>
  <line x1="188" y1="309" x2="188" y2="319" stroke="#546e7a" stroke-width="1.2"/>
  <line x1="740" y1="309" x2="740" y2="319" stroke="#546e7a" stroke-width="1.2"/>
  <text x="464" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#546e7a" text-anchor="middle">L=32 m,  D=80 mm</text>
  <!-- Formula box - Rješenje -->
  <rect x="44" y="345" width="580" height="68" rx="10" fill="#fffef6" stroke="#c49a0a" stroke-width="1.8"/>
  <text x="334" y="368" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#173043" text-anchor="middle">Rješenje</text>
  <text x="56" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#173043">① Pitot: v=√(2·(ρHg-ρ)gΔh/ρ) = 3,34 m/s   ② Q=Av = 16,8 L/s</text>
  <text x="56" y="406" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#173043">③ h_l=5,69 m, Σh_loc=1,99 m, h_w=7,68 m   ④ p_MA=ρg(v²/2g+h_w) = 80,9 kPa</text>
  <!-- Step labels -->
  <rect x="640" y="345" width="262" height="68" rx="10" fill="#f0f6fb" stroke="#d3d9de" stroke-width="1.5"/>
  <text x="771" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#173043" text-anchor="middle">Redoslijed</text>
  <text x="651" y="383" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#173043">Pitot → v → Q, h_l, h_loc</text>
  <text x="651" y="401" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#173043">Bernoulli A→B → p_MA</text>
</svg>