<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="u12rt_title u12rt_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:960px;height:auto;">
<title id="u12rt_title">Lokalna bilanca, granični sloj i fluktuacije brzine</title><desc id="u12rt_desc">Na zamišljenom elementu prikazane su x-komponente tlačnih i smičnih naprezanja. Jedna vodena ispuna leži iznad nepropusne ravne ploče; isprekidana unutarnja crta označuje rast debljine laminarnog sloja kao korijen iz x pri nultom gradijentu tlaka. Okomito mjerilo je uvećano. Sintetička vremenska shema ima točno srednju vrijednost 8 metara u sekundi tijekom prikazane sekunde; nije mjerenje turbulencije.</desc>
<defs>
<linearGradient id="u12rt_water" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#aed6f1"/><stop offset="100%" stop-color="#5b9ec9"/></linearGradient>
