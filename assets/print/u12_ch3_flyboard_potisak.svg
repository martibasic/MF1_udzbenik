<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460" viewBox="0 0 940 460" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
<defs>
  <marker id="u12c3fp_u12c3-ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0f766e"/></marker>
  <marker id="u12c3fp_u12c3-ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#b42318"/></marker>
  <marker id="u12c3fp_u12c3-ap" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6d2694"/></marker>
  <marker id="u12c3fp_u12c3-ao" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#b45309"/></marker>
  <marker id="u12c3fp_u12c3-agr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#546e7a"/></marker>
  <linearGradient id="u12c3fp_u12c3-jet" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d4eef8"/><stop offset="100%" stop-color="#7ec8e8" stop-opacity="0.3"/></linearGradient>
  <pattern id="u12c3fp_u12c3-hatch" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#8090a0"/>
    <line x1="0" y1="8" x2="8" y2="0" stroke="#546e7a" stroke-width="1.8"/>
  </pattern>
</defs>
<rect width="940" height="460" fill="#ffffff"/>
<rect x="24" y="24" width="892" height="412" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>
<text x="54" y="55" font-family="'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#173043">Mlazna platforma — potisak i ubrzanje (4 sapnice)</text>
<text x="54" y="76" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#516677">m = 150 kg · 4 × d = 50 mm · v = 15 m/s · ρ = 1000 kg/m³</text>

<!-- ===== PLATFORM DIAGRAM ===== -->

<!-- Height scale on left -->
<line x1="58" y1="102" x2="58" y2="410" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="3,4"/>
<text x="45" y="106" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#9aabb5">h</text>

<!-- Platform body (horizontal board) -->
<rect x="130" y="218" width="170" height="18" rx="3" fill="url(#u12c3fp_u12c3-hatch)"/>

<!-- Person simplified silhouette (stick-like figure above platform) -->
<!-- Head -->
<circle cx="215" cy="175" r="16" fill="#c8d6df" stroke="#2d3a40" stroke-width="1.5"/>
<!-- Body/torso rectangle -->
<rect x="200" y="192" width="30" height="26" rx="4" fill="#c8d6df" stroke="#2d3a40" stroke-width="1.5"/>
<!-- Arms not shown for simplicity -->

<!-- 4 nozzles at bottom of platform -->
<!-- Nozzle 1: x=150 -->
<rect x="144" y="236" width="12" height="8" rx="1" fill="#2d3a40"/>
<!-- Nozzle 2: x=175 -->
<rect x="169" y="236" width="12" height="8" rx="1" fill="#2d3a40"/>
<!-- Nozzle 3: x=248 -->
<rect x="246" y="236" width="12" height="8" rx="1" fill="#2d3a40"/>
<!-- Nozzle 4: x=278 -->
<rect x="274" y="236" width="12" height="8" rx="1" fill="#2d3a40"/>

<!-- Water jets flowing down from nozzles (tapered, spreading) -->
<path d="M 144,244 L 141,360 L 157,360 L 156,244 Z" fill="url(#u12c3fp_u12c3-jet)"/>
<path d="M 169,244 L 166,360 L 182,360 L 181,244 Z" fill="url(#u12c3fp_u12c3-jet)"/>
<path d="M 246,244 L 243,360 L 259,360 L 258,244 Z" fill="url(#u12c3fp_u12c3-jet)"/>
<path d="M 274,244 L 271,360 L 287,360 L 286,244 Z" fill="url(#u12c3fp_u12c3-jet)"/>

<!-- Water jet velocity arrows on one nozzle (representative) -->
<line x1="150" y1="270" x2="150" y2="335" stroke="#1d4ed8" stroke-width="2" marker-end="url(#u12c3fp_u12c3-agr)"/>
<text x="155" y="316" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1d4ed8">v = 15 m/s</text>

<!-- Fp (thrust/potisak) arrow: from platform center going UP (large green) -->
<line x1="215" y1="218" x2="215" y2="122" stroke="#0f766e" stroke-width="4" marker-end="url(#u12c3fp_u12c3-ag)"/>
<text x="220" y="170" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#0f766e">Fp = 1767 N ↑</text>

<!-- G (gravity/težina) arrow: from platform center going DOWN (large red) -->
<line x1="215" y1="236" x2="215" y2="344" stroke="#b42318" stroke-width="4" marker-end="url(#u12c3fp_u12c3-ar)"/>
<text x="220" y="314" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#b42318">G = 1472 N ↓</text>

<!-- FR (net force) = Fp - G: small purple arrow near top -->
<line x1="350" y1="218" x2="350" y2="162" stroke="#6d2694" stroke-width="2.8" marker-end="url(#u12c3fp_u12c3-ap)"/>
<text x="356" y="195" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#6d2694">FR = 295 N ↑</text>
<text x="356" y="210" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#6d2694">a = 1,97 m/s²</text>

<!-- v_min label (hover condition) -->
<line x1="82" y1="218" x2="128" y2="218" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="60" y="215" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#b45309">hover</text>
<text x="60" y="227" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#b45309">h₀</text>

<!-- dashed horizontal line for ground (bottom of trajectory) -->
<line x1="82" y1="410" x2="420" y2="410" stroke="#888" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="86" y="422" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#888">h = 0 (ravnina vode)</text>

<!-- Height marker h=10m on scale -->
<line x1="53" y1="218" x2="63" y2="218" stroke="#b45309" stroke-width="1.5"/>
<text x="35" y="222" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#b45309">10 m</text>

<!-- Nozzle labels -->
<text x="132" y="250" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#173043">4×</text>
<text x="144" y="248" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#173043">d=50mm</text>

<!-- ===== INFO PANEL (right) ===== -->
<rect x="455" y="88" width="460" height="348" rx="10" fill="#fffef6" stroke="#c49a0a" stroke-width="1.8"/>
<text x="471" y="114" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">Zadano</text>
<text x="471" y="134" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">Masa platforme s osobom:  m = 150 kg</text>
<text x="471" y="153" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">4 sapnice:  d = 50 mm,  v = 15 m/s,  ρ = 1000 kg/m³</text>
<line x1="471" y1="165" x2="903" y2="165" stroke="#e2e8f0" stroke-width="1"/>
<text x="471" y="184" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">Potisna sila</text>
<text x="471" y="203" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">A₁ = π d²/4 = 1,964 · 10⁻³ m² ;  A_uk = 4 A₁ = 7,854 · 10⁻³ m²</text>
<text x="471" y="222" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">Fp = ρ A_uk v² = 1000 · 7,854·10⁻³ · 15² = <tspan font-weight="700" fill="#0f766e">1767 N</tspan></text>
<line x1="471" y1="234" x2="903" y2="234" stroke="#e2e8f0" stroke-width="1"/>
<text x="471" y="253" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">Uvjet lebdenja (v_min)</text>
<text x="471" y="272" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">G = m g = 150 · 9,81 = 1471,5 N</text>
<text x="471" y="291" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">Fp = G  →  v_min = √(G / ρA_uk) = √(1471,5 / 7,854) = <tspan font-weight="700">13,7 m/s</tspan></text>
<line x1="471" y1="303" x2="903" y2="303" stroke="#e2e8f0" stroke-width="1"/>
<text x="471" y="322" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">Ubrzanje pri v = 15 m/s</text>
<text x="471" y="341" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">FR = Fp − G = 1767 − 1471,5 = 295,5 N</text>
<text x="471" y="360" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">a = FR / m = 295,5 / 150 = <tspan font-weight="700" fill="#6d2694">1,97 m/s²</tspan></text>
<line x1="471" y1="372" x2="903" y2="372" stroke="#e2e8f0" stroke-width="1"/>
<text x="471" y="391" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">Dizanje do h = 10 m  (a = konst.)</text>
<text x="471" y="410" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">h = ½ a t²  →  t = √(2h/a) = √(20/1,97) = 3,19 s</text>
<text x="471" y="429" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">v_h10 = a·t = 1,97·3,19 = 6,29 m/s  (brzina pri h=10 m)</text>
</svg>