<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" role="img" aria-labelledby="u12c3fp_title u12c3fp_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:900px;height:auto;">
  <title id="u12c3fp_title">Mlazna platforma s cetiri sapnice nad vodom</title>
  <desc id="u12c3fp_desc">Lijevo: scena mlazne platforme na visini h iznad vode, vozac stoji na platformi, ispod platforme cetiri okomite sapnice promjera d s mlazovima vode brzine v. Potisak F_p prema gore (zelena), tezina G prema dolje (crvena), referencne razine h i h max. Desno: petblokovni panel s formulama A, v_min, F_p i a, kinematika do h, slobodni let nakon prekida dotoka, te badge s rezultatima.</desc>

  <defs>
    <linearGradient id="u12c3fp_voda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aed6f1" />
      <stop offset="1" stop-color="#5b9ec9" />
    </linearGradient>
    <linearGradient id="u12c3fp_jet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aed6f1" stop-opacity="0.95" />
      <stop offset="1" stop-color="#5b9ec9" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="u12c3fp_morE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aed6f1" />
      <stop offset="1" stop-color="#3a7aa5" />
    </linearGradient>
    <pattern id="u12c3fp_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#909fa8" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#5d6d7e" stroke-width="1.1" />
    </pattern>
    <marker id="u12c3fp_force" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="context-stroke" />
    </marker>
    <marker id="u12c3fp_forceG" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1e8449" />
    </marker>
    <marker id="u12c3fp_forceR" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#c0392b" />
    </marker>
    <marker id="u12c3fp_vjet" markerWidth="6" markerHeight="4" refX="5.5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#1565c0" />
    </marker>
    <marker id="u12c3fp_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u12c3fp_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
  </defs>

  <!-- okvirni paneli -->
  <rect x="14" y="14" width="912" height="492" rx="14" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.4" />
  <line x1="392" y1="34" x2="392" y2="486" stroke="#dce7f0" stroke-width="1.2" stroke-dasharray="4,5" />

  <!-- ===================== LIJEVI PANEL: SCENA ===================== -->

  <!-- Naslov scene -->
  <!-- Skala visine s tik-crtama za h=0 i h=10 m -->
  <!-- pomocna os (siva isprekidana) -->
  <line x1="74" y1="120" x2="74" y2="416" stroke="#b7c1c9" stroke-width="1.1" stroke-dasharray="4,4" />

  <!-- Razina vode (mora ostati ispod) -->
  <!-- Glavni vodeni resurs (povrsina + dubina) -->
  <rect x="44" y="416" width="334" height="60" fill="url(#u12c3fp_morE)" />
  <line x1="44" y1="416" x2="378" y2="416" stroke="#1565c0" stroke-width="2.2" />
  <!-- referentna razina h=0 oznaka -->
  <!-- referentna razina h_max iscrtkana (12,02 m) - vrh leta nakon prekida dotoka -->
  <line x1="80" y1="120" x2="386" y2="120" stroke="#8e44ad" stroke-width="1" stroke-dasharray="6,4" opacity="0.85" />
  <!-- referentna razina h=10 m (razina platforme) - samo isprekidana linija, oznaceno smedom kotom h -->
  <!-- Tik-crte na osi za h-skalu -->
  <line x1="70" y1="120" x2="78" y2="120" stroke="#1e8449" stroke-width="1.2" />

  <!-- Kota h = 10 m (lijevo od platforme) -->
  <!-- pomocne linije -->
  <!-- dimenzijska linija -->
  <!-- Platforma (mlazna ploca) na razini h=10 m -->
  <!-- Glavna ploca -->
  <rect x="138" y="146" width="170" height="14" rx="2" fill="url(#u12c3fp_hatch)" stroke="#3a4a56" stroke-width="1.2" />
  <!-- Tamniji rub ispod (vizualna debljina) -->
  <rect x="138" y="160" width="170" height="4" fill="#3a4a56" />

  <!-- Vozac (simbolicna silueta) -->
  <!-- glava -->
  <circle cx="223" cy="98" r="10" fill="#c8d6df" stroke="#2d3a40" stroke-width="1.3" />
  <!-- vrat -->
  <line x1="223" y1="108" x2="223" y2="116" stroke="#2d3a40" stroke-width="1.3" />
  <!-- torzo (T-oblik) -->
  <path d="M223,116 L223,138 M203,124 L243,124" stroke="#2d3a40" stroke-width="1.6" stroke-linecap="round" />
  <!-- noge na platformi -->
  <line x1="223" y1="138" x2="213" y2="146" stroke="#2d3a40" stroke-width="1.6" stroke-linecap="round" />
  <line x1="223" y1="138" x2="233" y2="146" stroke="#2d3a40" stroke-width="1.6" stroke-linecap="round" />
  <!-- vest oznaka (vodoodbojna) -->
  <rect x="215" y="119" width="16" height="14" rx="2" fill="#fde68a" stroke="#c8a000" stroke-width="0.8" />

  <!-- 4 sapnice ispod platforme -->
  <!-- nozzle: visible cilindricni tijelo -->
  <!-- pozicije: 158, 198, 248, 288 (po dvije bliske u parovima ne, neka su ravnomjerne) -->
  <!-- ravnomjerno: 158, 198, 248, 288 -->
  <g>
    <!-- sapnica 1 -->
    <rect x="153" y="164" width="14" height="14" rx="1.5" fill="#3a4a56" />
    <rect x="155" y="166" width="10" height="3" fill="#5d6d7e" />
    <!-- sapnica 2 -->
    <rect x="193" y="164" width="14" height="14" rx="1.5" fill="#3a4a56" />
    <rect x="195" y="166" width="10" height="3" fill="#5d6d7e" />
    <!-- sapnica 3 -->
    <rect x="239" y="164" width="14" height="14" rx="1.5" fill="#3a4a56" />
    <rect x="241" y="166" width="10" height="3" fill="#5d6d7e" />
    <!-- sapnica 4 -->
    <rect x="279" y="164" width="14" height="14" rx="1.5" fill="#3a4a56" />
    <rect x="281" y="166" width="10" height="3" fill="#5d6d7e" />
  </g>

  <!-- Mlazovi vode (suzeni stupci od sapnice do vode) -->
  <!-- Mlaz 1 -->
  <path d="M154,178 L150,416 L170,416 L166,178 Z" fill="url(#u12c3fp_jet)" stroke="#5b9ec9" stroke-width="0.7" opacity="0.92" />
  <!-- Mlaz 2 -->
  <path d="M194,178 L190,416 L210,416 L206,178 Z" fill="url(#u12c3fp_jet)" stroke="#5b9ec9" stroke-width="0.7" opacity="0.92" />
  <!-- Mlaz 3 -->
  <path d="M240,178 L236,416 L256,416 L252,178 Z" fill="url(#u12c3fp_jet)" stroke="#5b9ec9" stroke-width="0.7" opacity="0.92" />
  <!-- Mlaz 4 -->
  <path d="M280,178 L276,416 L296,416 L292,178 Z" fill="url(#u12c3fp_jet)" stroke="#5b9ec9" stroke-width="0.7" opacity="0.92" />

  <!-- Brzina mlaza v (na sapnici 4 - desnoj) - plava strelica nadolje -->
  <line x1="319" y1="220" x2="319" y2="296" stroke="#1565c0" stroke-width="2.2" marker-end="url(#u12c3fp_vjet)" />
  <!-- Promjer sapnice d=50 mm (kota na sapnici 1) -->
  <!-- Sile na platformu - F_p (gore, zelena, velika) i G (dolje, crvena) -->
  <!-- Skala: 1 kN ~ 38 px -> F_p = 1,767 kN ~ 68 px ; G = 1,4715 kN ~ 56 px ; F_R = 0,2955 kN ~ 11 px -->
  <line x1="155" y1="146" x2="155" y2="78" stroke="#1e8449" stroke-width="3" marker-end="url(#u12c3fp_forceG)" />
  <!-- F_R rezultanta (mala, ljubicasta) iznad platforme, blizu F_p (vizualno razlika F_p - G) -->
  <line x1="178" y1="146" x2="178" y2="134" stroke="#8e44ad" stroke-width="2.4" marker-end="url(#u12c3fp_force)" />
  <!-- G tezina - crvena strelica prema dolje s desne strane platforme -->
  <line x1="293" y1="146" x2="293" y2="206" stroke="#c0392b" stroke-width="3" marker-end="url(#u12c3fp_forceR)" />
  <!-- Bilance sila legenda preko vode (bijela podloga za citljivost) -->
  <rect x="50" y="450" width="318" height="38" rx="5" fill="#ffffff" stroke="#cfdce6" stroke-width="0.8" opacity="0.94" />
  <!-- ===================== DESNI PANEL: FORMULE ===================== -->

  <!-- Header bar (zelena tematska boja - izlazna sila/rezultat) -->
  <rect x="408" y="34" width="504" height="36" rx="8" fill="#1e8449" />
  <!-- Blok 1: Povrsine sapnica - plavi akcent -->
  <rect x="408" y="80" width="504" height="66" rx="7" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.1" />
  <rect x="408" y="80" width="5" height="66" rx="2" fill="#1565c0" />
  <!-- Blok 2: Prag lebdenja - plavi akcent -->
  <rect x="408" y="152" width="504" height="66" rx="7" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.1" />
  <rect x="408" y="152" width="5" height="66" rx="2" fill="#1565c0" />
  <!-- Blok 3: Potisak i ubrzanje pri v=15 - zeleni akcent (krajnji rezultat radne tocke) -->
  <rect x="408" y="224" width="504" height="78" rx="7" fill="#f1f9f3" stroke="#cce7d4" stroke-width="1.1" />
  <rect x="408" y="224" width="5" height="78" rx="2" fill="#1e8449" />
  <!-- Blok 4: Kinematika do h=10 m - smedi akcent (kote / vrijeme) -->
  <rect x="408" y="308" width="504" height="66" rx="7" fill="#fdf8f2" stroke="#ecd9c2" stroke-width="1.1" />
  <!-- Blok 5: Slobodni let nakon prekida dotoka - ljubicasti akcent (slobodno polje) -->
  <rect x="408" y="380" width="504" height="66" rx="7" fill="#f7f3fa" stroke="#dccceb" stroke-width="1.1" />
  <rect x="408" y="380" width="5" height="66" rx="2" fill="#8e44ad" />
  <!-- REZULTATI badge -->
  <rect x="408" y="456" width="504" height="34" rx="7" fill="#e8f5e9" stroke="#1e8449" stroke-width="1.3" />
  <line x1="80" y1="156" x2="138" y2="156" stroke="#b7600c" stroke-width="1.1" stroke-dasharray="6,4" />
  <line x1="308" y1="156" x2="386" y2="156" stroke="#b7600c" stroke-width="1.1" stroke-dasharray="6,4" />

  <line x1="70" y1="156" x2="78" y2="156" stroke="#b7600c" stroke-width="1.4" />
  <line x1="70" y1="416" x2="78" y2="416" stroke="#b7600c" stroke-width="1.4" />
  <line x1="74" y1="156" x2="38" y2="156" stroke="#b7600c" stroke-width="0.7" />
  <line x1="74" y1="416" x2="38" y2="416" stroke="#b7600c" stroke-width="0.7" />
  <line x1="42" y1="158" x2="42" y2="414" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u12c3fp_dimL)" marker-end="url(#u12c3fp_dim)" />
  <line x1="153" y1="184" x2="153" y2="208" stroke="#b7600c" stroke-width="0.7" />
  <line x1="167" y1="184" x2="167" y2="208" stroke="#b7600c" stroke-width="0.7" />
  <line x1="153" y1="210" x2="153" y2="200" stroke="#b7600c" stroke-width="1.2" />
  <line x1="167" y1="210" x2="167" y2="200" stroke="#b7600c" stroke-width="1.2" />
  <line x1="156" y1="205" x2="164" y2="205" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u12c3fp_dimL)" marker-end="url(#u12c3fp_dim)" />
  <rect x="408" y="308" width="5" height="66" rx="2" fill="#b7600c" />
  <text x="50" y="50" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1a2530">Mlazna platforma iznad vode</text>
  <text x="50" y="66" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78">m = 150 kg · 4 sapnice, d = 50 mm · v = 15 m/s</text>

  <text x="362" y="435" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-style="italic" text-anchor="end" fill="#0d47a1">voda (ρ = 1000 kg/m³)</text>
  <text x="80" y="412" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a6a78">h = 0  (površina vode)</text>

  <text x="386" y="112" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="end" fill="#8e44ad">h<tspan baseline-shift="sub" font-size="0.7em">max</tspan> ≈ 12,0 m  (vrh leta)</text>

  <text x="323" y="260" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#1565c0"><tspan font-weight="700">v</tspan> = 15 m/s</text>

  <text x="105" y="221" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5a6a78">(4 sapnice)</text>

  <text x="148" y="92" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="end" fill="#1e8449"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">p</tspan> = 1767 N</text>

  <text x="184" y="142" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#8e44ad"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">R</tspan></text>

  <text x="301" y="180" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#c0392b"><tspan font-style="italic">G</tspan> = 1471,5 N</text>

  <text x="58" y="466" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#1a2530"><tspan font-weight="700">Bilanca:</tspan>  F<tspan baseline-shift="sub" font-size="0.7em">p</tspan> &gt; G → F<tspan baseline-shift="sub" font-size="0.7em">R</tspan> ubrzava platformu prema gore.</text>
  <text x="58" y="481" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a6a78">Mlaz dolje, reakcija na platformu gore (zakon količine gibanja).</text>

  <text x="660" y="58" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">Rješenje — mlazna platforma (F<tspan baseline-shift="sub" font-size="0.7em">p</tspan> = ρ A v²)</text>

  <text x="424" y="100" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#1565c0">1.  Izlazna površina sapnica</text>
  <text x="424" y="120" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">A<tspan baseline-shift="sub" font-size="0.7em">1</tspan> = πd²/4 = π·(0,050)²/4 = 1,964·10⁻³ m²</text>
  <text x="424" y="138" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1565c0">A = 4 A<tspan baseline-shift="sub" font-size="0.7em">1</tspan> = 7,854·10⁻³ m²</text>

  <text x="424" y="172" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#1565c0">2.  Prag lebdenja  (F<tspan baseline-shift="sub" font-size="0.7em">p</tspan> = G)</text>
  <text x="424" y="192" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">ρ A v<tspan baseline-shift="sub" font-size="0.7em">min</tspan>² = mg  →  v<tspan baseline-shift="sub" font-size="0.7em">min</tspan> = √(mg / ρA)</text>
  <text x="424" y="210" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1565c0">v<tspan baseline-shift="sub" font-size="0.7em">min</tspan> = √(150·9,81 / 1000·7,854·10⁻³) = 13,69 m/s</text>

  <text x="424" y="244" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#1e8449">3.  Potisak i vertikalno ubrzanje pri v = 15 m/s</text>
  <text x="424" y="264" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">F<tspan baseline-shift="sub" font-size="0.7em">p</tspan> = ρ A v² = 1000·7,854·10⁻³·15² = <tspan font-weight="700" fill="#1e8449">1767 N</tspan></text>
  <text x="424" y="282" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">F<tspan baseline-shift="sub" font-size="0.7em">R</tspan> = F<tspan baseline-shift="sub" font-size="0.7em">p</tspan> − G = 1767 − 1471,5 = 295,5 N</text>
  <text x="424" y="298" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#8e44ad">a = F<tspan baseline-shift="sub" font-size="0.7em">R</tspan> / m = 295,5 / 150 = 1,97 m/s²</text>

  <text x="424" y="348" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">t = √(2h / a) = √(20 / 1,97) = <tspan font-weight="700" fill="#b7600c">3,19 s</tspan></text>
  <text x="424" y="366" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">v<tspan baseline-shift="sub" font-size="0.7em">10</tspan> = a·t = 1,97·3,19 = <tspan font-weight="700" fill="#b7600c">6,29 m/s</tspan></text>

  <text x="424" y="400" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#8e44ad">5.  Slobodni let nakon prekida dotoka  (samo G)</text>
  <text x="424" y="420" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">Δh = v<tspan baseline-shift="sub" font-size="0.7em">10</tspan>² / 2g = 6,29² / 19,62 = <tspan font-weight="700" fill="#8e44ad">2,02 m</tspan>  →  h<tspan baseline-shift="sub" font-size="0.7em">max</tspan> ≈ 12,0 m</text>
  <text x="424" y="438" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">t<tspan baseline-shift="sub" font-size="0.7em">iznad 10</tspan> = 2·v<tspan baseline-shift="sub" font-size="0.7em">10</tspan>/g = 2·6,29/9,81 = <tspan font-weight="700" fill="#8e44ad">1,28 s</tspan></text>

  <text x="420" y="478" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#5a6a78">REZULTATI</text>
  <text x="498" y="478" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1565c0">v<tspan baseline-shift="sub" font-size="0.7em">min</tspan> = 13,69 m/s</text>
  <text x="618" y="478" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1e8449">F<tspan baseline-shift="sub" font-size="0.7em">p</tspan> = 1767 N</text>
  <text x="804" y="478" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#8e44ad">h<tspan baseline-shift="sub" font-size="0.7em">max</tspan> ≈ 12,0 m</text>
<text x="34" y="290" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#b7600c" transform="rotate(-90 34 290)"><tspan font-style="italic">h</tspan> = 10 m</text>

  <text x="105" y="208" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#b7600c"><tspan font-style="italic">d</tspan> = 50 mm</text>
  <text x="424" y="328" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#b7600c">4.  Dizanje do ciljne visine  (h = ½ a t², a = konst.)</text>
  <text x="720" y="478" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#b7600c">t = 3,19 s</text>
  </svg>