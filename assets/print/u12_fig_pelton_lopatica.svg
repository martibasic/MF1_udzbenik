<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
<defs>
  <marker id="u12fpl_u12pl-ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0f766e"/></marker>
  <marker id="u12fpl_u12pl-ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#b42318"/></marker>
  <marker id="u12fpl_u12pl-ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#1d4ed8"/></marker>
  <marker id="u12fpl_u12pl-ao" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#b45309"/></marker>
  <linearGradient id="u12fpl_u12pl-wat" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#d4eef8"/><stop offset="100%" stop-color="#7ec8e8"/></linearGradient>
  <pattern id="u12fpl_u12pl-hatch" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#8090a0"/>
    <line x1="0" y1="8" x2="8" y2="0" stroke="#546e7a" stroke-width="1.8"/>
  </pattern>
</defs>
<rect width="940" height="420" fill="#ffffff"/>
<rect x="24" y="24" width="892" height="372" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>
<text x="54" y="55" font-family="'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#173043">Peltonova lopatica — trokut brzina i potisna sila</text>
<text x="54" y="76" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#516677">d = 60 mm · c₁ = 40 m/s · u = 18 m/s · w₁ = 22 m/s · β₂ = 165° · k = 1 (idealna lopatica)</text>

<!-- Vertical divider -->
<line x1="480" y1="92" x2="480" y2="398" stroke="#d3d9de" stroke-width="1.5"/>

<!-- ===== LEFT: Pelton bucket diagram ===== -->

<!-- Nozzle (left) pointing right toward bucket -->
<polygon points="50,222 50,298 100,284 100,236" fill="url(#u12fpl_u12pl-hatch)"/>
<rect x="95" y="244" width="5" height="32" fill="#2d3a40"/>
<!-- Jet stream (wide, c1=40 m/s) -->
<rect x="100" y="244" width="150" height="32" fill="url(#u12fpl_u12pl-wat)" opacity="0.88"/>

<!-- Pelton bucket: U-shape cross-section in elevation view -->
<!-- Outer shell -->
<path d="M 250,228 C 250,218 340,218 340,228 L 340,296 C 340,318 250,318 250,296 Z" fill="url(#u12fpl_u12pl-hatch)"/>
<!-- Inner concave surface (bucket cavity) -->
<path d="M 255,232 C 255,224 335,224 335,232 L 335,290 C 335,308 255,308 255,290 Z" fill="url(#u12fpl_u12pl-wat)" opacity="0.82"/>
<!-- Centerline ridge -->
<line x1="295" y1="226" x2="295" y2="316" stroke="#2d3a40" stroke-width="1.8"/>
<!-- Bucket label -->
<text x="356" y="262" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#546e7a">Peltonova</text>
<text x="356" y="276" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#546e7a">lopatica</text>

<!-- c1 arrow (absolute velocity of jet) -->
<line x1="112" y1="232" x2="244" y2="232" stroke="#0f766e" stroke-width="3" marker-end="url(#u12fpl_u12pl-ag)"/>
<text x="148" y="223" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#0f766e">c₁ = 40 m/s</text>

<!-- u arrow (blade velocity, rightward, shorter) -->
<!-- u/c1 = 18/40 = 0.45 of c1 arrow length (132px): 59px -->
<line x1="112" y1="215" x2="171" y2="215" stroke="#b45309" stroke-width="2.8" marker-end="url(#u12fpl_u12pl-ao)"/>
<text x="116" y="208" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#b45309">u = 18 m/s</text>

<!-- w1 = c1 - u arrow (relative velocity, blue dashed) -->
<!-- w1 = 22 m/s, (22/40)*132 = 72.6px, from x=171 -->
<line x1="171" y1="248" x2="243" y2="248" stroke="#1d4ed8" stroke-width="2.2" stroke-dasharray="5,2" marker-end="url(#u12fpl_u12pl-ab)"/>
<text x="175" y="265" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1d4ed8">w₁ = 22 m/s</text>

<!-- β2 = 165° label on bucket interior: at exit side the relative velocity deflects to 165° -->
<!-- β2 = 165° means almost fully reversed: (cos165°, sin165°)=(−0.966, +0.259) in physics -->
<!-- Exit direction in SVG: (−0.966, −0.259) = mainly leftward and slightly upward -->
<!-- Show exit arrows (relative w2) from left side of bucket, going left and up -->
<!-- w2 = 0.92*22 = 20.24 m/s. From (255,250) going (−0.966,−0.259) for 55px: (255-53.1,250-14.2)=(201.9,235.8) -->
<line x1="255" y1="252" x2="202" y2="238" stroke="#1d4ed8" stroke-width="2.2" stroke-dasharray="4,2" marker-end="url(#u12fpl_u12pl-ab)"/>
<text x="162" y="248" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1d4ed8">w₂ (izlaz)</text>
<!-- c2 exit (absolute): from (255,252) c2 = u + w2 = (18-20.26, -5.24)=(−2.26,−5.24) very small -->
<!-- β2 angle arc -->
<path d="M 270,270 A 30,30 0 0,1 265,244" fill="none" stroke="#173043" stroke-width="1.4"/>
<text x="276" y="265" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043" font-style="italic">β₂ = 165°</text>

<!-- ===== RIGHT: Velocity triangle + results ===== -->
<text x="496" y="110" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#173043">Trokut brzina na ulazu</text>

<!-- Velocity triangle (1D for inlet since all vectors horizontal) -->
<!-- Scale: 1 m/s = 8px. c1=320px, u=144px, w1=176px -->
<rect x="492" y="118" width="430" height="90" rx="6" fill="#f0f7ff"/>
<!-- c1: from x=510 to x=510+320=830 -->
<line x1="510" y1="175" x2="828" y2="175" stroke="#0f766e" stroke-width="3" marker-end="url(#u12fpl_u12pl-ag)"/>
<text x="645" y="192" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#0f766e" font-weight="700">c₁ = 40 m/s</text>
<!-- u: from x=510 to x=510+144=654 -->
<line x1="510" y1="162" x2="652" y2="162" stroke="#b45309" stroke-width="2.5" marker-end="url(#u12fpl_u12pl-ao)"/>
<text x="548" y="155" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#b45309" font-weight="700">u = 18</text>
<!-- w1: from x=654 to x=654+176=830 -->
<line x1="654" y1="162" x2="828" y2="162" stroke="#1d4ed8" stroke-width="2.2" stroke-dasharray="5,2" marker-end="url(#u12fpl_u12pl-ab)"/>
<text x="718" y="155" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1d4ed8" font-weight="700">w₁ = 22</text>
<text x="510" y="135" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677" font-style="italic">c₁ = u + w₁  (vektori na ulazu)</text>

<!-- Results box -->
<rect x="492" y="218" width="430" height="174" rx="10" fill="#fffef6" stroke="#c49a0a" stroke-width="1.8"/>
<text x="508" y="242" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">Izračun  (d = 60 mm, ρ = 998 kg/m³, k = 1)</text>
<text x="508" y="263" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">A = π·(0,060)²/4 = 2,827 · 10⁻³ m²</text>
<text x="508" y="282" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">w₁ = c₁ − u = 40 − 18 = 22 m/s</text>
<text x="508" y="301" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">ṁ_rel = 998 · 2,827·10⁻³ · 22 = <tspan font-weight="700" fill="#0f766e">62,05 kg/s</tspan></text>
<text x="508" y="320" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">Ft = ṁ_rel · (w₁ + w₂ · cos 15°)</text>
<text x="508" y="339" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">Ft = 62,05 · (22 + 22 · 0,966) = 62,05 · 43,25</text>
<text x="508" y="358" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#b42318">Ft = 2683 N</text>
<text x="508" y="381" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#6d2694">P = Ft · u = 2683 · 18 = 48,3 kW</text>
</svg>
