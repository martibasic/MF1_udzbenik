<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="u12v2ul_title u12v2ul_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:900px;height:auto;">
  <title id="u12v2ul_title">Ukljestena zakrivljena lopatica - reakcije i moment u osloncu</title>
  <desc id="u12v2ul_desc">Tlocrt: vodoravni mlaz vode promjera 39,1 mm i brzine 12,5 m/s ulazi u zakrivljenu lopaticu ukljestenu na desnoj stijenci u tocki O. Lopatica skrece mlaz pod 60 stupnjeva iznad negativne osi x. Na desnoj strani: izvod masenog protoka, komponenti reakcije Rx i Ry te momenta MO oko tocke O.</desc>

  <defs>
    <linearGradient id="u12v2ul_voda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aed6f1" />
      <stop offset="1" stop-color="#5b9ec9" />
    </linearGradient>
    <pattern id="u12v2ul_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.1" />
    </pattern>
    <marker id="u12v2ul_vg" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1e8449" />
    </marker>
    <marker id="u12v2ul_fr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#c0392b" />
    </marker>
    <marker id="u12v2ul_mp" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#8e44ad" />
    </marker>
    <marker id="u12v2ul_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u12v2ul_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
  </defs>

  <!-- pozadina i paneli -->
  <line x1="510" y1="36" x2="510" y2="464" stroke="#dce7f0" stroke-width="1.2" stroke-dasharray="4,5" />

  <!-- =============================================================== -->
  <!-- LIJEVI PANEL: fizicki model (tlocrt)                             -->
  <!-- =============================================================== -->

  <!-- naslov lijevog panela -->
  <!-- ukljestena stijenka (desna strana) -->
  <rect x="390" y="60" width="34" height="380" fill="url(#u12v2ul_hatch)" stroke="#3a4a56" stroke-width="1.5" />
  <line x1="390" y1="60" x2="390" y2="440" stroke="#3a4a56" stroke-width="1.8" />

  <!-- ulazni mlaz (vodoravni, dolazi s lijeva) -->
  <!-- mlaz centriran na y=285, promjer ~28 px -->
  <rect x="40" y="271" width="232" height="28" fill="url(#u12v2ul_voda)" />
  <!-- rubovi mlaza (gornji svjetliji, donji tamniji) -->
  <line x1="40" y1="271" x2="272" y2="271" stroke="#5b9ec9" stroke-width="1.2" />
  <line x1="40" y1="299" x2="272" y2="299" stroke="#3d7aa0" stroke-width="1.2" />

  <!-- LOPATICA: zakrivljeno tijelo (sivkasta povrsina), -->
  <!-- ulaz vodoravan (y=285), izlaz u smjeru (-cos60, +sin60) fizika -->
  <!-- = (-0.5, +0.866) fizika = (-0.5, -0.866) SVG (y dolje) -->

  <!-- donji rub lopatice (konveksni izvana) - vodi fluid -->
  <path d="M 272,299 C 322,299 360,290 365,250 C 368,224 350,200 320,180 L 305,170" fill="none" stroke="#3a4a56" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  <!-- gornji rub lopatice (konkavni iznutra) - kanal -->
  <path d="M 272,271 C 312,271 338,266 340,242 C 342,224 330,210 305,194 L 290,184" fill="none" stroke="#3a4a56" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- voda u kanalu lopatice (kontinuirana s ulazom) -->
  <path d="M 272,271 C 312,271 338,266 340,242 C 342,224 330,210 305,194 L 290,184 L 305,170 L 320,180 C 350,200 368,224 365,250 C 360,290 322,299 272,299 Z" fill="url(#u12v2ul_voda)" opacity="0.95" />

  <!-- tijelo lopatice (debela materijalna stijenka iza vode, samo radi vizualne potpore) -->
  <path d="M 268,299 L 268,271 L 270,271 C 312,271 338,266 340,242 C 342,224 330,210 305,194 L 285,179 L 280,184 L 298,196 C 322,212 333,225 331,242 C 329,261 308,265 270,265 L 268,265" fill="none" stroke="#3a4a56" stroke-width="0.8" opacity="0.0" />

  <!-- izlazni mlaz: iz tocke (~298,177) u smjeru (-0.5, -0.866) -->
  <!-- centralna os: prolazi kroz (298, 177); za simulaciju mlaza nacrtati par paralelnih linija sirine 28 px perpendicular -->
  <!-- normalni vektor (perpendicular) na (-0.5,-0.866) = (-0.866, +0.5) (i suprotni) -->
  <!-- Rub 1 (gornji): centar + 14*(-0.866, 0.5) = (298-12.12, 177+7) = (285.9, 184) - to je tocka na donjem rubu lopatice -->
  <!-- Rub 2 (donji): centar + 14*(0.866, -0.5) = (298+12.12, 177-7) = (310.1, 170) - to je tocka na gornjem rubu lopatice -->
  <!-- Izduzenje mlaza za ~95 px u smjeru (-0.5, -0.866): -->
  <!-- Gornji rub start (285.9, 184), end = (285.9 - 47.5, 184 - 82.3) = (238.4, 101.7) -->
  <!-- Donji rub start (310.1, 170), end = (310.1 - 47.5, 170 - 82.3) = (262.6, 87.7) -->
  <polygon points="285.9,184 310.1,170 262.6,87.7 238.4,101.7" fill="url(#u12v2ul_voda)" />
  <line x1="285.9" y1="184" x2="238.4" y2="101.7" stroke="#3d7aa0" stroke-width="1.2" />
  <line x1="310.1" y1="170" x2="262.6" y2="87.7" stroke="#5b9ec9" stroke-width="1.2" />

  <!-- TOCKA O (oslonac/ukljestenje) na stijenci -->
  <circle cx="390" cy="200" r="5.5" fill="#1a2530" stroke="#ffffff" stroke-width="1.4" />
  <!-- BRZINE -->
  <!-- v1 zelena, kratko unutar mlaza -->
  <line x1="100" y1="285" x2="180" y2="285" stroke="#1e8449" stroke-width="2.6" marker-end="url(#u12v2ul_vg)" />
  <!-- v2 zelena, uzduz izlaznog mlaza -->
  <!-- centar (298,177), smjer (-0.5,-0.866), duljina 70 px -->
  <!-- start: (298 + 8, 177 + 14) = (306, 191) -> blizu izlaza unutar mlaza; ali bolje iznad lopatice -->
  <!-- start (270, 130), kraj (270 - 35, 130 - 60.6) = (235, 69.4) -->
  <line x1="280" y1="142" x2="245" y2="81" stroke="#1e8449" stroke-width="2.6" marker-end="url(#u12v2ul_vg)" />
  <!-- KUT alpha izmedju izlazne osi i osi -x (negativni smjer x) -->
  <!-- vrh kuta na nekoj tocki izlazne osi, npr (260, 200); luk od smjera -x do smjera izlaza -->
  <!-- Pomocna isprekidana linija u smjeru -x kroz (260, 200) -->
  <line x1="260" y1="200" x2="200" y2="200" stroke="#7a8a96" stroke-width="1" stroke-dasharray="4,3" />
  <!-- Pomocna isprekidana linija u smjeru izlazne osi kroz (260, 200) -->
  <line x1="260" y1="200" x2="225" y2="139.4" stroke="#7a8a96" stroke-width="1" stroke-dasharray="4,3" />
  <!-- Luk kuta alpha (od smjera -x na pomocnu izlaznu os) - radius 28 -->
  <!-- KOTA h: vertikalna od inlet axis (y=285) do tocke O (y=200) -->
  <!-- Pomocne linije: od inlet axis i od O do osi kote -->
  <!-- Tik-crte -->
  <!-- Dim line -->
  <!-- KOTA l: vodoravna udaljenost od ukljestenja do sjecista izlazne osi s osi y=200 (kroz O) -->
  <!-- Izlazna os, ekstrapolirana, sijeca y=200 u tocki: parametriziraj izlaznu os iz (298,177) u smjeru (-0.5,-0.866) i suprotnom -->
  <!-- Trazimo s takav da 177 + 0.866 s = 200 -> s = 26.56; x = 298 + 0.5*26.56 = 311.28; ali to je iznad tocke O ne ispod -->
  <!-- Bolje: koristim ekstrapolaciju izlazne osi (suprotni smjer) prema (260,200). Sjeciste je tocka (260, 200) jer smo gore postavili pomocnu liniju -->
  <!-- Onda je l udaljenost od (260,200) do (390,200) = 130 px. Pri scale 130 px / 0.7 m = 186 px/m. h kota: 85 px / 0.45 m = 189 px/m. Dobro slaganje. -->
  <!-- Sjeciste oznaceno malim krizicem -->
  <!-- Pomocne linije od sjecista i od O do razine kote -->
  <!-- Tik-crte -->
  <!-- Dim line -->
  <!-- REAKCIJE U OSLONCU O (crvene) -->
  <!-- Rx = -281 N (smjer -x, lijevo). Skala: 281 N -> 36 px -->
  <line x1="390" y1="200" x2="354" y2="200" stroke="#c0392b" stroke-width="2.6" marker-end="url(#u12v2ul_fr)" />
  <!-- Ry = +162 N (smjer +y fizika = -y SVG = gore). Skala: 162 N -> 22 px -->
  <line x1="390" y1="200" x2="390" y2="178" stroke="#c0392b" stroke-width="2.6" marker-end="url(#u12v2ul_fr)" />
  <!-- Moment Mo - ljubicasti CW luk oko zasebne tocke (offset od O da bude vidljiv) -->
  <!-- Centar arc u (358,158), r=15. Start gornje-lijevo (343,158), CW preko vrha (358,143) do desno (373,158). -->
  <!-- Sweep-flag=1 CW visual. End tangent na (373,158) pokazuje prema dolje (DOWN), sto CW prikazuje. -->
  <path d="M 343,158 A 15,15 0 0,1 373,158" fill="none" stroke="#8e44ad" stroke-width="2.4" marker-end="url(#u12v2ul_mp)" />
  <!-- leader linija od luka prema tocki O da se vidi da je to moment u O -->
  <line x1="372" y1="170" x2="386" y2="196" stroke="#8e44ad" stroke-width="0.8" stroke-dasharray="3,2" />

  <!-- Koordinatni sustav (lijevi donji kut, mali) -->
  <g transform="translate(40,415)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#5a6a78" stroke-width="1.4" marker-end="url(#u12v2ul_dim)" />
    <line x1="0" y1="0" x2="0" y2="-34" stroke="#5a6a78" stroke-width="1.4" marker-end="url(#u12v2ul_dim)" />
    <text x="38" y="4" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#5a6a78">x</text>
    <text x="-4" y="-38" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="end" fill="#5a6a78">y</text>
    <text x="56" y="-14" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5a6a78">(tlocrt)</text>
  </g>

  <!-- Oznake presjeka 1 i 2 -->
  <line x1="175" y1="83" x2="252" y2="100" stroke="#a8b4bc" stroke-width="0.6" />

  <!-- =============================================================== -->
  <!-- DESNI PANEL: formule i rezultati                                 -->
  <!-- =============================================================== -->

  <!-- glavni panel -->
  <rect x="530" y="50" width="400" height="328" rx="10" fill="#ffffff" stroke="#1565c0" stroke-width="1.4" />
  <!-- header bar -->
  <rect x="530" y="50" width="400" height="32" rx="10" fill="#1565c0" />
  <rect x="530" y="66" width="400" height="16" fill="#1565c0" />
  <!-- Blok 1: Promjer mlaza -->
  <line x1="550" y1="152" x2="910" y2="152" stroke="#c8d6e4" stroke-width="1" />

  <!-- Blok 2: Maseni protok i komponente brzine -->
  <line x1="550" y1="221" x2="910" y2="221" stroke="#c8d6e4" stroke-width="1" />

  <!-- Blok 3: Komponente reakcije -->
  <line x1="550" y1="289" x2="910" y2="289" stroke="#c8d6e4" stroke-width="1" />

  <!-- Blok 4: Moment -->
  <!-- REZULTATI badge -->
  <rect x="530" y="394" width="400" height="58" rx="8" fill="#e8f5e9" stroke="#1e8449" stroke-width="1.4" />
  <!-- Footer s ulaznim podacima -->
  <path d="M 232,200 A 28,28 0 0,0 235.76,175.76" fill="none" stroke="#b7600c" stroke-width="1.4" />
  <line x1="262" y1="285" x2="450" y2="285" stroke="#b7600c" stroke-width="0.7" stroke-dasharray="3,3" />
  <line x1="390" y1="200" x2="450" y2="200" stroke="#b7600c" stroke-width="0.7" stroke-dasharray="3,3" />
  <line x1="442" y1="285" x2="458" y2="285" stroke="#b7600c" stroke-width="1.3" />
  <line x1="442" y1="200" x2="458" y2="200" stroke="#b7600c" stroke-width="1.3" />
  <line x1="450" y1="203" x2="450" y2="282" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u12v2ul_dimL)" marker-end="url(#u12v2ul_dim)" />
  <circle cx="260" cy="200" r="3" fill="#b7600c" />
  <line x1="260" y1="200" x2="260" y2="465" stroke="#b7600c" stroke-width="0.7" stroke-dasharray="3,3" />
  <line x1="390" y1="200" x2="390" y2="465" stroke="#b7600c" stroke-width="0.7" stroke-dasharray="3,3" />
  <line x1="260" y1="457" x2="260" y2="473" stroke="#b7600c" stroke-width="1.3" />
  <line x1="390" y1="457" x2="390" y2="473" stroke="#b7600c" stroke-width="1.3" />
  <line x1="263" y1="465" x2="387" y2="465" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u12v2ul_dimL)" marker-end="url(#u12v2ul_dim)" />
  <text x="40" y="50" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1a2530">Tlocrt: zakrivljena lopatica ukljestena na konstrukciju</text>

  <text x="398" y="195" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">O</text>

  <text x="100" y="263" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e8449"><tspan font-style="italic" font-weight="700">v</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> = 12,5 m/s</text>

  <text x="180" y="80" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e8449"><tspan font-style="italic" font-weight="700">v</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 12,5 m/s</text>

  <text x="324" y="216" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#c0392b"><tspan font-style="italic" font-weight="700">R</tspan><tspan baseline-shift="sub" font-size="0.7em">x</tspan> = −281 N</text>

  <text x="396" y="160" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#c0392b"><tspan font-style="italic" font-weight="700">R</tspan><tspan baseline-shift="sub" font-size="0.7em">y</tspan> = +162 N</text>

  <text x="358" y="138" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#8e44ad"><tspan font-style="italic" font-weight="700">M</tspan><tspan baseline-shift="sub" font-size="0.7em">O</tspan> ≈ −198 Nm</text>
  <text x="143" y="320" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">presjek 1</text>
  <text x="135" y="85" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">presjek 2</text>
  <text x="730" y="71" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Jednadzba kolicine gibanja i moment oko O</text>

  <text x="730" y="103" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Promjer mlaza iz kontinuiteta</text>
  <text x="730" y="124" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">d</tspan> = √(4<tspan font-style="italic">Q</tspan> / π<tspan font-style="italic">v</tspan>)</text>
  <text x="730" y="142" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">≈ 0,0391 m = 39,1 mm</text>
  <text x="730" y="170" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Maseni protok i komponente izlazne brzine</text>
  <text x="730" y="190" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">ṁ</tspan> = ρ<tspan font-style="italic">Q</tspan> = 998 · 0,015 ≈ 14,97 kg/s</text>
  <text x="730" y="209" font-family="'Segoe UI',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">v₂ₓ</tspan> = −<tspan font-style="italic">v</tspan> cosα = −6,25 m/s,  <tspan font-style="italic">v₂ᵢ</tspan> = <tspan font-style="italic">v</tspan> sinα = +10,83 m/s</text>
  <text x="730" y="239" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Reakcija ukljestenja (II. Newtonov zakon)</text>
  <text x="730" y="259" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">Rₓ</tspan> = −<tspan font-style="italic">ṁ</tspan>(<tspan font-style="italic">v₂ₓ</tspan> − <tspan font-style="italic">v₁</tspan>) = −14,97 · (−18,75) ≈ <tspan fill="#c0392b">−281 N</tspan></text>
  <text x="730" y="278" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">Rᵢ</tspan> = −<tspan font-style="italic">ṁ</tspan> · <tspan font-style="italic">v₂ᵢ</tspan> = −14,97 · 10,83 ≈ <tspan fill="#c0392b">+162 N</tspan></text>
  <text x="730" y="307" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Moment reakcije u tocki O (CCW pozitivan)</text>
  <text x="730" y="327" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">M</tspan><tspan baseline-shift="sub" font-size="0.7em">O</tspan> = −<tspan font-style="italic">ṁ</tspan> <tspan font-style="italic">v</tspan> (<tspan font-style="italic">h</tspan> + <tspan font-style="italic">l</tspan> sinα)</text>
  <text x="730" y="346" font-family="'Segoe UI',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a2530">= −14,97 · 12,5 · (0,45 + 0,70 · sin 60°)</text>
  <text x="730" y="365" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#8e44ad">≈ −198 Nm  (smjer kazaljke na satu)</text>

  <text x="730" y="411" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#5a6a78">REZULTATI</text>
  <text x="600" y="434" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b"><tspan font-style="italic">Rₓ</tspan> ≈ −281 N</text>
  <text x="730" y="434" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b"><tspan font-style="italic">Rᵢ</tspan> ≈ +162 N</text>
  <text x="860" y="434" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#8e44ad"><tspan font-style="italic">M</tspan><tspan baseline-shift="sub" font-size="0.7em">O</tspan> ≈ −198 Nm</text>
  <text x="730" y="448" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" text-anchor="middle" fill="#5a6a78">ukljestenje preuzima silu (Rₓ,Rᵢ) i moment savijanja Mₒ oko O</text>

  <text x="40" y="438" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78">ρ = 998 kg/m³,  <tspan font-style="italic">Q</tspan> = 15 L/s,  <tspan font-style="italic">v</tspan> = 12,5 m/s,  <tspan font-style="italic">h</tspan> = 0,45 m,  <tspan font-style="italic">l</tspan> = 0,70 m,  α = 60°</text>
<text x="208" y="192" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#b7600c"><tspan font-style="italic">α</tspan> = 60°</text>

  <text x="464" y="248" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#b7600c"><tspan font-style="italic" font-weight="700">h</tspan> = 0,45 m</text>

  <text x="325" y="481" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#b7600c"><tspan font-style="italic" font-weight="700">l</tspan> = 0,70 m</text>

  </svg>