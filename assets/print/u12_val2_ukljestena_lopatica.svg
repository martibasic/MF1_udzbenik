<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="title">U12 Val 2 - ukljestena zakrivljena lopatica</title>
  <desc id="desc">Skica zakrivljene lopatice ukljestene u točki O s ulaznim mlazom, izlaznim mlazom pod kutom alfa, reakcijama Rx i Ry, momentom MO te geometrijskim oznakama h i l.</desc>
  <rect width="980" height="420" fill="#fffdf8"/>
  <rect x="32" y="32" width="916" height="356" rx="22" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>

  <text x="70" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#173043">U12 - Ukljestena zakrivljena lopatica</text>
  <text x="70" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#587183">Tangencijalni ulaz mlaza daje reakcije u dvije osi i moment u točki ukljestenja.</text>

  <text x="86" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#173043">Skica sustava</text>

  <rect x="772" y="106" width="18" height="238" fill="#cfd8dc" stroke="#173043" stroke-width="4"/>
  <circle cx="738" cy="258" r="6" fill="#173043"/>

  <path d="M188 302 C302 302 398 292 492 248 C566 214 620 178 650 206 C675 228 695 242 724 252" fill="none" stroke="#173043" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M650 206 L572 80" fill="none" stroke="#173043" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M724 252 Q732 255 738 258" fill="none" stroke="#173043" stroke-width="24" stroke-linecap="round"/>

  <line x1="110" y1="302" x2="186" y2="302" stroke="#3a87ad" stroke-width="10" marker-end="url(#arrowBlueLarge)"/>
  <text x="122" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#173043">Q, v</text>
  <text x="118" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#173043">d = ?</text>

  <line x1="612" y1="146" x2="590" y2="112" stroke="#3a87ad" stroke-width="6" marker-end="url(#arrowBlueSmall)"/>
  <text x="624" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#173043">v_2</text>

  <line x1="188" y1="302" x2="738" y2="302" stroke="#6f7f89" stroke-width="2.5" stroke-dasharray="7 6"/>
  <line x1="160" y1="258" x2="738" y2="258" stroke="#6f7f89" stroke-width="2.5" stroke-dasharray="7 6"/>
  <line x1="572" y1="80" x2="676" y2="258" stroke="#6f7f89" stroke-width="2.5" stroke-dasharray="7 6"/>

  <line x1="166" y1="258" x2="166" y2="302" stroke="#c96c35" stroke-width="3" marker-start="url(#arrowOrangeSmall)" marker-end="url(#arrowOrange)"/>
  <text x="132" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#173043">h</text>

  <line x1="676" y1="244" x2="738" y2="244" stroke="#c96c35" stroke-width="3" marker-start="url(#arrowOrangeSmall)" marker-end="url(#arrowOrange)"/>
  <text x="704" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#173043">l</text>

  <path d="M704 258 A28 28 0 0 0 691 233" fill="none" stroke="#c96c35" stroke-width="3"/>
  <text x="688" y="226" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#173043">a</text>

  <line x1="738" y1="296" x2="664" y2="296" stroke="#2e7d32" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <text x="676" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#173043">R_x</text>

  <line x1="738" y1="258" x2="738" y2="180" stroke="#2e7d32" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <text x="748" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#173043">R_y</text>

  <path d="M706 288 A42 42 0 1 1 742 220" fill="none" stroke="#c23b22" stroke-width="4" marker-end="url(#arrowRed)"/>
  <text x="690" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#173043">M_O</text>

  <text x="748" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#173043">O</text>
  <text x="787" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#173043">zidni nosac</text>
  <text x="204" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#173043">p_a</text>
  <text x="622" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#173043">p_a</text>

  <line x1="852" y1="292" x2="902" y2="292" stroke="#173043" stroke-width="3" marker-end="url(#arrowGray)"/>
  <line x1="852" y1="292" x2="852" y2="242" stroke="#173043" stroke-width="3" marker-end="url(#arrowGray)"/>
  <text x="908" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#173043">x</text>
  <text x="844" y="234" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#173043">y</text>

  <rect x="812" y="142" width="108" height="96" rx="14" fill="#f7fafb" stroke="#d3d9de" stroke-width="2"/>
  <text x="828" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#173043">Redoslijed</text>
  <text x="828" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#587183">1. Q i v -> d</text>
  <text x="828" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#587183">2. R_x, R_y</text>
  <text x="828" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#587183">3. moment M_O</text>

