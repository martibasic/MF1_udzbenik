<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" role="img" aria-labelledby="u02fkue_title u02fkue_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:800px;height:auto;">
  <title id="u02fkue_title">Kapilarni uspon etanola u staklenoj kapilari</title>
  <desc id="u02fkue_desc">Lijevo: staklena kapilara promjera 1,0 mm uronjena u etanol, s konkavnim meniskusom, kontaktnim kutom 18 stupnjeva, povrsinskom napetoscu sigma prema gore uz stijenke na meniskusu i tezinom stupca G prema dolje, te kapilarnim usponom h. Desno: panel s izvodom h iz ravnoteze i rezultatom 1,08 cm.</desc>

  <defs>
    <linearGradient id="u02fkue_eta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6eef7" />
      <stop offset="1" stop-color="#8fc0d6" />
    </linearGradient>
    <pattern id="u02fkue_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.1" />
    </pattern>
    <marker id="u02fkue_sig" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1565c0" />
    </marker>
    <marker id="u02fkue_g" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#c0392b" />
    </marker>
    <marker id="u02fkue_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u02fkue_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
  </defs>

  <line x1="430" y1="40" x2="430" y2="420" stroke="#dce7f0" stroke-width="1.2" stroke-dasharray="4,5" />

  <!-- ===================== LIJEVO: kapilara u etanolu ===================== -->
  <!-- posuda (dno + bocne stijenke, otvorena) -->
  <rect x="70" y="316" width="8" height="92" fill="url(#u02fkue_hatch)" stroke="#3a4a56" stroke-width="1.2" />
  <rect x="352" y="316" width="8" height="92" fill="url(#u02fkue_hatch)" stroke="#3a4a56" stroke-width="1.2" />
  <rect x="70" y="400" width="290" height="8" fill="url(#u02fkue_hatch)" stroke="#3a4a56" stroke-width="1.2" />
  <!-- etanol u posudi -->
  <rect x="78" y="320" width="274" height="80" fill="url(#u02fkue_eta)" />
  <!-- slobodna povrsina u posudi -->
  <line x1="78" y1="320" x2="352" y2="320" stroke="#1565c0" stroke-width="1.8" />

  <!-- kapilara: staklene stijenke (vanjski 204..226) + etanol (unutarnji 207..223) -->
  <rect x="204" y="120" width="22" height="270" fill="#eaf1f6" stroke="#9fb3c0" stroke-width="1.2" />
  <rect x="207" y="200" width="16" height="190" fill="url(#u02fkue_eta)" />
  <!-- konkavni meniskus: kontaktne tocke (207,202) i (223,202), sredina spustena na 214 -->
  <path d="M207,202 Q215,214 223,202" fill="none" stroke="#0d47a1" stroke-width="1.6" />

  <!-- povrsinska napetost sigma: strelice TOCNO na meniskusu, uz stijenke (kontaktne tocke), prema gore -->
  <line x1="207" y1="202" x2="207" y2="174" stroke="#1565c0" stroke-width="2.2" marker-end="url(#u02fkue_sig)" />
  <line x1="223" y1="202" x2="223" y2="174" stroke="#1565c0" stroke-width="2.2" marker-end="url(#u02fkue_sig)" />

  <!-- kontaktni kut theta na lijevoj kontaktnoj tocki -->
  <path d="M207,202 A11,11 0 0,1 213,212" fill="none" stroke="#b7600c" stroke-width="1.2" />

  <!-- tezina stupca G (crvena, prema dolje) -->
  <line x1="215" y1="244" x2="215" y2="304" stroke="#c0392b" stroke-width="2.4" marker-end="url(#u02fkue_g)" />

  <!-- ===== KOTE ===== -->
  <!-- kota d (promjer): premali raspon -> strelice IZVANA prema unutra (tehnicko crtanje) -->
  <line x1="207" y1="200" x2="207" y2="96" stroke="#b7600c" stroke-width="0.7" />
  <line x1="223" y1="200" x2="223" y2="96" stroke="#b7600c" stroke-width="0.7" />
  <line x1="183" y1="104" x2="207" y2="104" stroke="#b7600c" stroke-width="1.3" marker-end="url(#u02fkue_dim)" />
  <line x1="247" y1="104" x2="223" y2="104" stroke="#b7600c" stroke-width="1.3" marker-end="url(#u02fkue_dim)" />

  <!-- kota h (uspon): od slobodne povrsine (y=320) do meniskusa (y=202), desno -->
  <line x1="223" y1="202" x2="306" y2="202" stroke="#b7600c" stroke-width="0.7" />
  <line x1="226" y1="320" x2="306" y2="320" stroke="#b7600c" stroke-width="0.7" />
  <line x1="306" y1="202" x2="306" y2="320" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u02fkue_dimL)" marker-end="url(#u02fkue_dim)" />

  <!-- ===================== DESNO: PANEL S IZVODOM ===================== -->
  <rect x="448" y="70" width="392" height="360" rx="10" fill="#f4f9fd" stroke="#1565c0" stroke-width="1.4" />
  <rect x="448" y="70" width="392" height="30" rx="10" fill="#1565c0" />
  <rect x="448" y="86" width="392" height="14" fill="#1565c0" />
  <!-- glavna formula (highlight) -->
  <rect x="470" y="170" width="348" height="42" rx="8" fill="#eaf3fb" stroke="#1565c0" stroke-width="1.3" />
  <!-- rezultat badge -->
  <rect x="470" y="272" width="348" height="44" rx="9" fill="#eaf6ee" stroke="#1e8449" stroke-width="1.6" />
  <!-- separatori -->
  <line x1="470" y1="158" x2="818" y2="158" stroke="#c8d6e4" stroke-width="1" />
  <line x1="470" y1="334" x2="818" y2="334" stroke="#e2e8ee" stroke-width="1" />

  <!-- ===== TEKST (na vrhu) ===== -->
  <text x="44" y="58" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Kapilara u etanolu</text>

  <!-- sigma labela -->
  <text x="238" y="182" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" fill="#1565c0">σ</text>
  <line x1="236" y1="184" x2="225" y2="184" stroke="#1565c0" stroke-width="0.7" />

  <!-- theta labela -->
  <text x="150" y="214" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#b7600c">θ = 18°</text>
  <line x1="178" y1="210" x2="206" y2="206" stroke="#b7600c" stroke-width="0.8" />

  <!-- G labela -->
  <text x="186" y="278" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" text-anchor="end" fill="#c0392b"><tspan font-weight="700">G</tspan></text>
  <text x="186" y="293" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" text-anchor="end" fill="#a04030">težina stupca</text>

  <!-- d labela -->
  <text x="215" y="90" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">d</tspan> = 1,0 mm</text>

  <!-- h labela -->
  <text x="314" y="256" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#b7600c"><tspan font-style="italic">h</tspan> ≈ 10,8 mm</text>

  <!-- etanol oznake -->
  <text x="110" y="352" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#0d47a1">etanol</text>
  <text x="110" y="372" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#1a2530">ρ = 790 kg/m³</text>
  <text x="110" y="387" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#1a2530">σ = 0,022 N/m</text>

  <!-- ===== DESNI PANEL TEKST ===== -->
  <text x="644" y="91" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Izvod kapilarnog uspona</text>

  <text x="644" y="124" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Ravnoteža: površinska sila (gore) = težina stupca (dolje)</text>
  <text x="644" y="147" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530">π d σ cosθ = ρ g (π d² / 4) h</text>

  <text x="644" y="197" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1565c0">h = 4σ cosθ / (ρ g d)</text>

  <text x="644" y="240" font-family="'Segoe UI',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a2530">h = 4·0,022·0,951 / (790·9,81·1,0·10⁻³)</text>
  <text x="644" y="258" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">(cos 18° = 0,951)</text>

  <text x="644" y="300" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1e8449">h ≈ 0,0108 m ≈ 1,08 cm</text>

  <text x="470" y="356" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1a2530">• θ &lt; 90° (cosθ &gt; 0) → razina raste</text>
  <text x="470" y="378" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1a2530">• tanja kapilara → veći uspon (h ∝ 1/d)</text>
  <text x="470" y="400" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1a2530">• cosθ &lt; 1 → manje od potpunog kvašenja</text>
</svg>