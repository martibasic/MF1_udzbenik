<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" role="img" aria-labelledby="u02fku_title u02fku_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:880px;height:auto;">
<title id="u02fku_title">Kapilarni uspon etanola uz kontaktni kut 18 stupnjeva</title><desc id="u02fku_desc">Jedna povezana količina etanola u spremniku i otvorenoj uronjenoj kapilari. Konkavni meniskus, tangentne površinske sile, kota uspona od slobodne površine i uvećani detalj stvarnog kontaktnog kuta kroz tekućinu.</desc>
