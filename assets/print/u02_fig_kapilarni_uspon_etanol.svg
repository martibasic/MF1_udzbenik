<text x="650.5" y="81" font-size="13" fill="#1565c0" text-anchor="middle" font-weight="700">Ravnoteža kapilarnog uspona</text>
<text x="650" y="125" font-size="12" fill="#1565c0" text-anchor="middle">Vertikalna sila duž oboda = težina stupca</text>
<text x="650" y="169" font-size="20" fill="#1565c0" text-anchor="middle" font-weight="700">πdσ cosθ = ρg (πd²/4)h</text>
<text x="650" y="220" font-size="21" fill="#1565c0" text-anchor="middle" font-weight="700">h = 4σ cosθ/(ρgd)</text>
<text x="650" y="270" font-size="19" fill="#1e8449" text-anchor="middle" font-weight="700">h ≈ 0,0108 m = 1,08 cm</text>
<text x="650" y="316" font-size="12" fill="#1565c0" text-anchor="middle">θ &lt; 90°: uspon; uža kapilara: veći h</text>
<text x="650" y="347" font-size="12" fill="#1565c0" text-anchor="middle">Zanemaren volumen meniskusa.</text>
<text x="650" y="375" font-size="11" fill="#1565c0" text-anchor="middle">Promjer i visina nisu u istom mjerilu.</text>
</g>
</svg>
