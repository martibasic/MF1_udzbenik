  <text x="58" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#516677">Isti idealni Bernoulli ovdje mora zatvoriti brzinu ispusta, tlak u suzenju pri vrhu i domet slobodnog mlaza.</text>

