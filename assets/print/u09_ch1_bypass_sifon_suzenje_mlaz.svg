      <rect id="u09ch1_platform" x="405" y="140" width="130" height="8" rx="0" fill="url(#u09ch1_hatch)" stroke="#3a4a56" stroke-width="1.2" />
      <circle id="u09ch1_pump" cx="446" cy="110" r="24" fill="#d7dee3" stroke="#3a4a56" stroke-width="1.6" />
      <text x="446" y="114" font-size="11" fill="#263746" text-anchor="middle">crpka</text>
      <path d="M472 110 L512 110" fill="none" stroke="#356b83" stroke-width="1.6" marker-end="url(#u09ch1_vopen)" data-mf1-vector="velocity" />
      <text x="572" y="106" font-size="11" fill="#263746" text-anchor="start">Q = 180 m³/h</text>
      <text x="572" y="122" font-size="11" fill="#263746" text-anchor="start">u rashladni sustav</text>
      <text x="405" y="162" font-size="11" fill="#263746" text-anchor="start">platforma strojarnice</text>
      <path d="M340 416 L340 372" fill="none" stroke="#356b83" stroke-width="1.6" marker-end="url(#u09ch1_vopen)" data-mf1-vector="velocity" />
      <text x="359" y="398" font-size="11" fill="#263746" text-anchor="start"><tspan font-weight="700">v</tspan></text>
      <path d="M262 460 L296 460" fill="none" stroke="#356b83" stroke-width="1.6" marker-end="url(#u09ch1_vopen)" data-mf1-vector="velocity" />
      <circle id="u09ch1_A" cx="120" cy="250" r="3" fill="#356b83" />
      <text x="120" y="236" font-size="13" fill="#263746" text-anchor="middle" font-weight="700">A</text>
      <text x="50" y="275" font-size="11" fill="#263746" text-anchor="start">mirna površina: p<tspan baseline-shift="sub" font-size="0.7em">A</tspan> = p<tspan baseline-shift="sub" font-size="0.7em">atm</tspan>, v<tspan baseline-shift="sub" font-size="0.7em">A</tspan> ≈ 0, z = 0</text>
      <text x="50" y="348" font-size="11" fill="#263746" text-anchor="start">vodna linija u balastu, 1,5 m niže</text>
      <text x="50" y="540" font-size="11" fill="#263746" text-anchor="start">more, ρ = 1025 kg/m³</text>
      <circle id="u09ch1_P" cx="420" cy="110" r="3" fill="#356b83" />
      <text x="420" y="92" font-size="13" fill="#263746" text-anchor="middle" font-weight="700">P</text>
      <text x="372" y="76" font-size="11" fill="#263746" text-anchor="start">ulaz u crpku: p<tspan baseline-shift="sub" font-size="0.7em">aps,P</tspan> = ?</text>
      <circle id="u09ch1_U" cx="305" cy="460" r="3" fill="#356b83" />
      <text x="318" y="520" font-size="11" fill="#263746" text-anchor="start">usisna košara (sea chest)</text>
      <text x="318" y="536" font-size="11" fill="#263746" text-anchor="start">s rešetkom, otvorena prema moru</text>
      <text x="200" y="196" font-size="11" fill="#263746" text-anchor="start">oplata boka</text>
      <line x1="262" y1="200" x2="298" y2="214" stroke="#657781" stroke-width="1" />
      <line x1="300" y1="250" x2="310" y2="250" stroke="#657781" stroke-width="1" stroke-dasharray="3 3" />
      <line x1="310" y1="250" x2="580" y2="250" stroke="#657781" stroke-width="1" stroke-dasharray="5 5" />
      <text x="366" y="244" font-size="11" fill="#263746" text-anchor="start">referenca z = 0 (vodna linija)</text>
      <line x1="195" y1="250" x2="205" y2="250" stroke="#657781" stroke-width="1.2" />
      <line x1="195" y1="460" x2="205" y2="460" stroke="#657781" stroke-width="1.2" />
      <path id="u09ch1_heightU" d="M200 250 L200 460" fill="none" stroke="#657781" stroke-width="1.4" marker-start="url(#u09ch1_dim)" marker-end="url(#u09ch1_dim)" data-mf1-role="dimension" />
