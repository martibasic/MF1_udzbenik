<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" role="img" aria-labelledby="u09c1bssm_u9c1-title u09c1bssm_u9c1-sub" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <defs>
    <linearGradient id="u09c1bssm_u9c1-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4eef8"/>
      <stop offset="100%" stop-color="#7ec8e8"/>
    </linearGradient>
    <pattern id="u09c1bssm_u9c1-sraf" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#8090a0"/>
      <line x1="0" y1="8" x2="8" y2="0" stroke="#546e7a" stroke-width="1.8"/>
    </pattern>
    <marker id="u09c1bssm_u9c1-arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#0f766e"/>
    </marker>
    <marker id="u09c1bssm_u9c1-arrGr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 z" fill="#546e7a"/>
    </marker>
    <marker id="u09c1bssm_u9c1-arrGrR" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto">
      <path d="M7,0 L0,4 L7,8 z" fill="#546e7a"/>
    </marker>
    <marker id="u09c1bssm_u9c1-arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="940" height="430" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="382" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>
  <text id="u09c1bssm_u9c1-title" x="54" y="55" font-family="'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#173043">Idealni bypass-sifon sa su&#x17E;enjem u vrhu i mlaznim ispustom</text>
  <text id="u09c1bssm_u9c1-sub" x="54" y="76" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#516677">D=100&#x202F;mm, d&#x2C;=80&#x202F;mm, z&#x2090;=4,2&#x202F;m, z&#x1D2E;=1,4&#x202F;m, z&#x2C;=4,2+1,5=5,7&#x202F;m iznad tla; skala&#x202F;40&#x202F;px/m</text>

  <!-- Ground line at y=400 -->
  <line x1="50" y1="400" x2="890" y2="400" stroke="#546e7a" stroke-width="2.5"/>
  <text x="830" y="396" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#546e7a">tlo / z=0</text>

  <!-- ===== Basin A ===== -->
  <!-- z_A=4.2m, scale 40px/m. Ground at y=400. A surface at y=400-168=232. -->
  <!-- Basin A: x=56..200, walls, water inside -->
  <rect x="66" y="232" width="134" height="168" fill="url(#u09c1bssm_u9c1-water)" opacity="0.85"/>
  <!-- Walls (srafura) -->
  <rect x="50" y="190" width="16" height="210" fill="url(#u09c1bssm_u9c1-sraf)"/>
  <rect x="200" y="232" width="16" height="168" fill="url(#u09c1bssm_u9c1-sraf)"/>
  <rect x="50" y="400" width="166" height="10" fill="url(#u09c1bssm_u9c1-sraf)"/>
  <!-- Basin outline -->
  <polyline points="50,190 50,400 216,400 216,232" fill="none" stroke="#2d3a40" stroke-width="2.5"/>
  <!-- Free surface A (dashed blue) -->
  <line x1="50" y1="232" x2="216" y2="232" stroke="#1565c0" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="56" y="226" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1565c0">A&#x202F;&#x2014;&#x202F;slobodna povrn&#x161;ina</text>
  <circle cx="216" cy="232" r="5" fill="#b42318"/>
  <text x="222" y="228" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#b42318">A</text>

  <!-- ===== Siphon pipe ===== -->
  <!-- C peak: z=5.7m above ground = 400-228=172; at x=430 -->
  <!-- B exit: z=1.4m = 400-56=344; at x=660 horizontal -->
  <!-- Path: enter from A right wall at (216,320) -> up to C(430,172) -> down to B(660,344) -> horizontal to (726,344) -->
  <!-- Main pipe (D=100mm) outer -->
  <path d="M 216,320 C 310,320 380,172 430,172 C 490,172 560,300 660,344 L 726,344"
        fill="none" stroke="#2d3a40" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Main pipe inner (fluid) -->
  <path d="M 216,320 C 310,320 380,172 430,172 C 490,172 560,300 660,344 L 726,344"
        fill="none" stroke="#7ec8e8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Constriction at C: narrower segment highlight -->
  <!-- Show C with slightly thinner segment and label -->
  <ellipse cx="430" cy="172" rx="18" ry="8" fill="#fef2f2" stroke="#b42318" stroke-width="1.5"/>

  <!-- Flow arrows -->
  <!-- Rising limb -->
  <line x1="288" y1="278" x2="310" y2="250" stroke="#0f766e" stroke-width="2.8" marker-end="url(#u09c1bssm_u9c1-arrG)"/>
  <!-- Descending limb -->
  <line x1="554" y1="280" x2="584" y2="316" stroke="#0f766e" stroke-width="2.8" marker-end="url(#u09c1bssm_u9c1-arrG)"/>
  <!-- At exit B (horizontal) -->
  <line x1="666" y1="344" x2="718" y2="344" stroke="#0f766e" stroke-width="2.8" marker-end="url(#u09c1bssm_u9c1-arrG)"/>

  <!-- Point labels -->
  <circle cx="430" cy="172" r="6" fill="#b42318"/>
  <text x="440" y="168" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#b42318">C</text>
  <!-- C info box -->
  <rect x="460" y="148" width="194" height="56" rx="8" fill="#fef2f2" stroke="#b42318" stroke-width="1.5"/>
  <text x="470" y="168" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#173043">d&#x2C;=80&#x202F;mm, v&#x2C;=11,58&#x202F;m/s</text>
  <text x="470" y="186" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#173043">p&#x2C;/&#x3B3;=&#x2212;8,34&#x202F;m (man.)</text>
  <text x="470" y="198" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#173043">p&#x2C;,abs=1,86&#x202F;m, sigurn.=1,61&#x202F;m</text>

  <!-- Point B: exit -->
  <circle cx="726" cy="344" r="6" fill="#b42318"/>
  <text x="734" y="340" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#b42318">B</text>
  <!-- B level line -->
  <line x1="50" y1="344" x2="726" y2="344" stroke="#1565c0" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="56" y="339" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1565c0">z&#x1D2E;=1,4&#x202F;m</text>

  <!-- ===== Jet trajectory from B ===== -->
  <!-- v_B=7.41 m/s, h_B=1.4m above ground, t=0.534s, x=3.96m=158px at 40px/m -->
  <!-- Start: (726,344), end: (726+158, 400) = (884,400) -->
  <path d="M 726,344 Q 810,374 884,400" fill="none" stroke="#1565c0" stroke-width="2.4" stroke-dasharray="7 4"/>
  <circle cx="884" cy="400" r="4" fill="#1565c0"/>
  <!-- Domet annotation -->
  <line x1="726" y1="412" x2="884" y2="412" stroke="#546e7a" stroke-width="1.6" marker-start="url(#u09c1bssm_u9c1-arrGrR)" marker-end="url(#u09c1bssm_u9c1-arrGr)"/>
  <text x="776" y="424" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1565c0">x=3,96&#x202F;m</text>

  <!-- ===== Dimension lines ===== -->
  <!-- z_A = 4.2m: from ground y=400 to A surface y=232, at x=40 -->
  <line x1="36" y1="232" x2="36" y2="400" stroke="#546e7a" stroke-width="1.8" marker-start="url(#u09c1bssm_u9c1-arrGrR)" marker-end="url(#u09c1bssm_u9c1-arrGr)"/>
  <text x="38" y="318" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#546e7a" transform="rotate(-90,38,318)">z&#x2090;=4,2&#x202F;m</text>

  <!-- z_C above A: from A surface y=232 to C y=172, dimension on left of siphon -->
  <line x1="380" y1="172" x2="380" y2="232" stroke="#546e7a" stroke-width="1.8" marker-start="url(#u09c1bssm_u9c1-arrGrR)" marker-end="url(#u09c1bssm_u9c1-arrGr)"/>
  <text x="344" y="206" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#546e7a">z&#x2C;=1,5&#x202F;m</text>
  <text x="344" y="218" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#546e7a">nad A</text>

  <!-- ===== Formula box (right side) ===== -->
  <rect x="56" y="92" width="236" height="128" rx="10" fill="#fffef6" stroke="#c49a0a" stroke-width="1.8"/>
  <text x="70" y="113" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#173043">A&#x2192;B: &#x394;z&#x1D2C;&#x1D2E;=4,2&#x2212;1,4=2,8&#x202F;m</text>
  <line x1="70" y1="122" x2="284" y2="122" stroke="#e8d89a" stroke-width="1"/>
  <text x="70" y="140" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043">v&#x1D2E; = &#x221A;(2g&#x22C52;,8)</text>
  <text x="70" y="158" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#0f766e">v&#x1D2E; = 7,41&#x202F;m/s, Q=58,2&#x202F;L/s</text>
  <line x1="70" y1="168" x2="284" y2="168" stroke="#e8d89a" stroke-width="1"/>
  <text x="70" y="184" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043">kontinuitet: v&#x2C; = v&#x1D2E;(A/A&#x2C;)</text>
  <text x="70" y="202" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#0f766e">v&#x2C; = 11,58&#x202F;m/s</text>

  <!-- Step labels below -->
  <rect x="56" y="230" width="152" height="24" rx="6" fill="#f0f8f4" stroke="#c8dcd4"/>
  <text x="66" y="246" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#173043">&#x2460;&#x202F;A&#x2192;B: v&#x1D2E; i Q</text>
  <rect x="216" y="230" width="152" height="24" rx="6" fill="#f0f8f4" stroke="#c8dcd4"/>
  <text x="226" y="246" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#173043">&#x2461;&#x202F;kontinuitet: v&#x2C;</text>
  <rect x="56" y="260" width="312" height="24" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="66" y="276" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#173043">&#x2462;&#x202F;A&#x2192;C: p&#x2C;/&#x3B3; = &#x2212;(v&#x2C;&#xB2;/2g + z&#x2C;) = &#x2212;8,34&#x202F;m (man.)</text>
  <rect x="56" y="290" width="312" height="24" rx="6" fill="#f0f8f4" stroke="#c8dcd4"/>
  <text x="66" y="306" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#173043">&#x2463;&#x202F;mlaz iz B: x = v&#x1D2E;&#x22C5;t = 7,41&#x22C50;,534 = 3,96&#x202F;m</text>
</svg>