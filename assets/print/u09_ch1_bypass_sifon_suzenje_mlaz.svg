      <text x="208" y="400" font-size="11" fill="#263746" text-anchor="start">z<tspan baseline-shift="sub" font-size="0.7em">u</tspan> = 3,0 m</text>
      <line x1="555" y1="110" x2="565" y2="110" stroke="#657781" stroke-width="1.2" />
      <line x1="555" y1="250" x2="565" y2="250" stroke="#657781" stroke-width="1.2" />
      <path id="u09ch1_heightP" d="M560 110 L560 250" fill="none" stroke="#657781" stroke-width="1.4" marker-start="url(#u09ch1_dim)" marker-end="url(#u09ch1_dim)" data-mf1-role="dimension" />
      <line x1="518" y1="110" x2="555" y2="110" stroke="#657781" stroke-width="1" stroke-dasharray="3 3" />
      <text x="568" y="184" font-size="11" fill="#263746" text-anchor="start">z<tspan baseline-shift="sub" font-size="0.7em">P</tspan> = 2,0 m</text>
      <line x1="615" y1="250" x2="625" y2="250" stroke="#657781" stroke-width="1.2" />
      <line x1="615" y1="355" x2="625" y2="355" stroke="#657781" stroke-width="1.2" />
      <path id="u09ch1_ballast" d="M620 250 L620 355" fill="none" stroke="#657781" stroke-width="1.4" marker-start="url(#u09ch1_dim)" marker-end="url(#u09ch1_dim)" data-mf1-role="dimension" />
      <line x1="300" y1="355" x2="615" y2="355" stroke="#657781" stroke-width="1" stroke-dasharray="3 3" />
      <text x="628" y="306" font-size="11" fill="#263746" text-anchor="start">1,5 m (balast)</text>
      <line x1="331" y1="300" x2="331" y2="310" stroke="#657781" stroke-width="1.2" />
      <line x1="349" y1="300" x2="349" y2="310" stroke="#657781" stroke-width="1.2" />
      <path id="u09ch1_D" d="M331 305 L349 305" fill="none" stroke="#657781" stroke-width="1.4" marker-start="url(#u09ch1_dimSmall)" marker-end="url(#u09ch1_dimSmall)" data-mf1-role="dimension" />
      <line x1="352" y1="305" x2="392" y2="290" stroke="#657781" stroke-width="1" />
      <text x="396" y="288" font-size="11" fill="#263746" text-anchor="start">D = 150 mm (uvećano)</text>
      <text x="396" y="400" font-size="11" fill="#263746" text-anchor="start">gubitak voda h<tspan baseline-shift="sub" font-size="0.7em">g</tspan> = 1,2 m</text>
      <text x="396" y="416" font-size="11" fill="#263746" text-anchor="start">(rešetka, ventil, filtar, koljena)</text>
      <rect id="u09ch1_bottom" x="300" y="560" width="260" height="8" rx="0" fill="url(#u09ch1_hatch)" stroke="#3a4a56" stroke-width="1.2" />
      <text x="400" y="553" font-size="11" fill="#263746" text-anchor="start">dno trupa</text>
    </g>
  </g>
</svg>
