<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 809 594" role="img" aria-labelledby="u09ch1_title u09ch1_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:809px;height:auto;">
  <title id="u09ch1_title">Sifon sa suženjem i slobodnim mlazom</title>
  <desc id="u09ch1_desc">Uronjeni otvor nalazi se unutar bazena; sifon prolazi iznad njegova ruba. Glavna cijev i grlo imaju promjere u omjeru 100:80. Vrh C je 1,5 m iznad površine A; izlaz B 2,8 m ispod A i 1,4 m iznad tla. Putanja ima vodoravnu početnu tangentu i isti prostorni omjer kao kote visina.</desc>
