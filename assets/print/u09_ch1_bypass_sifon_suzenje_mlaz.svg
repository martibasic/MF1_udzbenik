<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="title">U09 CH 1 - idealni bypass sifon sa suženjem i mlaznim ispustom</title>
  <desc id="desc">Otvoreni bazen prazni se idealnim sifonom koji ima suženje u vrhu i vodoravni mlazni ispust, uz jasno odvojene oznake za brzine, tlak u vrhu i domet mlaza.</desc>
