<text x="553" y="414" font-size="11" fill="#1e8449" text-anchor="start">vB = 7,41 m/s</text>
<text x="381" y="155" font-size="11" fill="#1e8449" text-anchor="start">vC = 11,58 m/s</text>
<text x="561" y="468" font-size="11" fill="#1565c0" text-anchor="start">putanja osi mlaza</text>
<rect x="824" y="60" width="288" height="87" rx="7" fill="white" stroke="#1565c0" stroke-width="1" stroke-opacity="0.65" />
<text x="836" y="80" font-size="13" fill="#1565c0" text-anchor="start" font-weight="700">1. A → B: brzina i protok</text>
<text x="836" y="103" font-size="12" fill="#1a2530" text-anchor="start">vB²/(2g) = 4,2 − 1,4 = 2,8 m</text>
<text x="836" y="122" font-size="12" fill="#1a2530" text-anchor="start">vB = 7,41 m/s; Q = 58,2 L/s</text>
<rect x="824" y="159" width="288" height="87" rx="7" fill="white" stroke="#1565c0" stroke-width="1" stroke-opacity="0.65" />
<text x="836" y="179" font-size="13" fill="#1565c0" text-anchor="start" font-weight="700">2. Kontinuitet u suženju</text>
<text x="836" y="202" font-size="12" fill="#1a2530" text-anchor="start">vC = vB(D/dC)² = 11,58 m/s</text>
<text x="836" y="221" font-size="12" fill="#1a2530" text-anchor="start">vC²/(2g) = 6,836 m</text>
<rect x="824" y="258" width="288" height="106" rx="7" fill="white" stroke="#c0392b" stroke-width="1" stroke-opacity="0.65" />
<text x="836" y="278" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">3. A → C: tlak u vrhu</text>
<text x="836" y="301" font-size="12" fill="#1a2530" text-anchor="start">pC,man/(ρg) = −1,5 − 6,836</text>
<text x="836" y="320" font-size="12" fill="#1a2530" text-anchor="start">pC,man ≈ −81,78 kPa</text>
<text x="836" y="339" font-size="12" fill="#1a2530" text-anchor="start">pC,abs/(ρg) = 1,864 m</text>
<rect x="824" y="376" width="288" height="87" rx="7" fill="white" stroke="#1e8449" stroke-width="1" stroke-opacity="0.65" />
<text x="836" y="396" font-size="13" fill="#1e8449" text-anchor="start" font-weight="700">4. Idealni kriterij tlaka pare</text>
<text x="836" y="419" font-size="12" fill="#1a2530" text-anchor="start">1,864 − 0,25 = 1,614 m</text>
<text x="836" y="438" font-size="12" fill="#1a2530" text-anchor="start">Nije potvrda rada stvarnog sifona.</text>
<rect x="824" y="475" width="288" height="88" rx="7" fill="white" stroke="#1565c0" stroke-width="1" stroke-opacity="0.65" />
<text x="836" y="495" font-size="13" fill="#1565c0" text-anchor="start" font-weight="700">5. Mlaz nakon izlaza B</text>
<text x="836" y="518" font-size="12" fill="#1a2530" text-anchor="start">t = √(2·1,4/g) = 0,534 s</text>
<text x="836" y="537" font-size="12" fill="#1a2530" text-anchor="start">x = vB t = 3,96 m</text>
</g>
</svg>
