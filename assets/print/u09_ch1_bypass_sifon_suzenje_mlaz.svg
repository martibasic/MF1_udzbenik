<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 809 594" role="img" aria-labelledby="u09ch1_title u09ch1_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:809px;height:auto;">
  <title id="u09ch1_title">Usisni vod rashladne crpke morske vode</title>
  <desc id="u09ch1_desc">Presjek boka broda. Lijevo je more s mirnom vodnom linijom A; usisna košara otvorena je prema moru kroz oplatu boka 3,0 m ispod vodne linije, a usisni vod se uspinje do crpke P 2,0 m iznad vodne linije. Isprekidana crta označuje vodnu liniju broda u balastu, 1,5 m niže. Kote visina imaju zajedničko mjerilo; promjer voda je uvećan. Rešetka košare prikazana je shematski i ne zatvara otvor. Oplata boka i dna omeđuje unutrašnjost broda; more je s vanjske strane boka i ispod dna.</desc>
  <defs>
    <marker id="u09ch1_vopen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#356b83" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <pattern id="u09ch1_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="7" height="7" fill="#d7dee3" stroke="none" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.1" />
    </pattern>
    <marker id="u09ch1_v" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
    </marker>
    <marker id="u09ch1_dim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse">
      <path d="M0 0 L6 2.5 L0 5 Z" fill="#657781" />
    </marker>
    <marker id="u09ch1_dimSmall" markerWidth="3" markerHeight="3" refX="3" refY="1.5" orient="auto-start-reverse">
      <path d="M0 0 L3 1.5 L0 3 Z" fill="#657781" />
    </marker>
  </defs>
  <g id="u09ch1_title-scene-1" transform="translate(0.0000 0.0000)">
    <g font-family="Arial, Liberation Sans, sans-serif" fill="#3a4a56">
      <text x="35" y="38" font-size="16" fill="#263746" text-anchor="start" font-weight="700">Usisni vod rashladne crpke: košara ispod vodne linije, crpka iznad nje</text>
      <rect id="u09ch1_sea" x="40" y="250" width="260" height="330" rx="0" fill="#dcebf1" stroke="none" />
      <rect id="u09ch1_opening" x="300" y="440" width="10" height="40" rx="0" fill="#dcebf1" stroke="none" />
      <rect id="u09ch1_chamber" x="310" y="432" width="60" height="56" rx="0" fill="#dcebf1" stroke="none" />
      <line id="u09ch1_waterline" x1="40" y1="250" x2="300" y2="250" stroke="#356b83" stroke-width="2" />
      <line id="u09ch1_ballastline" x1="40" y1="355" x2="300" y2="355" stroke="#356b83" stroke-width="1.2" stroke-dasharray="6 4" />
      <rect id="u09ch1_plating-upper" x="300" y="120" width="10" height="320" rx="0" fill="url(#u09ch1_hatch)" stroke="#3a4a56" stroke-width="1.2" />
      <rect id="u09ch1_sea-under-bottom" x="300" y="568" width="260" height="12" rx="0" fill="#dcebf1" stroke="none" />
      <rect id="u09ch1_plating-lower" x="300" y="480" width="10" height="88" rx="0" fill="url(#u09ch1_hatch)" stroke="#3a4a56" stroke-width="1.2" />
      <rect id="u09ch1_chamber-top-left" x="310" y="426" width="18" height="6" rx="0" fill="url(#u09ch1_hatch)" stroke="#3a4a56" stroke-width="1.2" />
      <rect id="u09ch1_chamber-top-right" x="352" y="426" width="24" height="6" rx="0" fill="url(#u09ch1_hatch)" stroke="#3a4a56" stroke-width="1.2" />
      <rect id="u09ch1_chamber-bottom" x="310" y="488" width="66" height="6" rx="0" fill="url(#u09ch1_hatch)" stroke="#3a4a56" stroke-width="1.2" />
      <rect id="u09ch1_chamber-right" x="370" y="426" width="6" height="68" rx="0" fill="url(#u09ch1_hatch)" stroke="#3a4a56" stroke-width="1.2" />
      <line id="u09ch1_grating-1" x1="302" y1="448" x2="308" y2="448" stroke="#3a4a56" stroke-width="1.4" />
      <line id="u09ch1_grating-2" x1="302" y1="460" x2="308" y2="460" stroke="#3a4a56" stroke-width="1.4" />
      <line id="u09ch1_grating-3" x1="302" y1="472" x2="308" y2="472" stroke="#3a4a56" stroke-width="1.4" />
