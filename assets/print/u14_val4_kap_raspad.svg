<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" role="img" aria-labelledby="u14drop_title u14drop_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:820px;height:auto;">
  <title id="u14drop_title">Početna kap u relativnoj struji zraka</title>
  <desc id="u14drop_desc">Početna kuglasta kap promjera tri milimetra. Oznaka površinske napetosti upućuje na sučelje i nije radijalni vektor sile. Kriterij raspada ne određuje veličine ili broj nastalih kapljica.</desc>
  <defs>
    <pattern id="u14drop_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.8" />
    </pattern>
    <marker id="u14drop_v" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
    </marker>
    <marker id="u14drop_dim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse">
      <path d="M0 0 L6 2.5 L0 5 Z" fill="#657781" />
    </marker>
    <marker id="u14drop_dimSmall" markerWidth="3" markerHeight="3" refX="3" refY="1.5" orient="auto-start-reverse">
      <path d="M0 0 L3 1.5 L0 3 Z" fill="#356b83" />
    </marker>
  </defs>
  <g font-family="Arial, Liberation Sans, sans-serif" fill="#3a4a56">
    <defs>
      <marker id="u14drop_forceMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
        <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
      </marker>
      <marker id="u14drop_pressureMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
        <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
      </marker>
      <marker id="u14drop_reactionMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
        <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
      </marker>
      <marker id="u14drop_axisMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
        <path d="M0 0 L7 3 L0 6 Z" fill="#3a4a56" />
      </marker>
    </defs>
    <text x="410" y="32" font-size="19" fill="#263746" text-anchor="middle" font-weight="700">Kap vode u struji zraka · zadani kriterij Weₖᵣ = 12</text>
    <defs />
    <circle id="u14drop_drop" cx="245" cy="193" r="50" fill="#dcebf1" stroke="#356b83" stroke-width="1.5" />
    <path id="u14drop_air0" d="M44 161 L163 161" fill="none" stroke="#356b83" stroke-width="2.3" marker-end="url(#u14drop_v)" />
    <path id="u14drop_air1" d="M44 193 L163 193" fill="none" stroke="#356b83" stroke-width="2.3" marker-end="url(#u14drop_v)" />
    <path id="u14drop_air2" d="M44 225 L163 225" fill="none" stroke="#356b83" stroke-width="2.3" marker-end="url(#u14drop_v)" />
    <text x="45" y="124" font-size="13" fill="#263746" text-anchor="start">vᵣₑₗ = 25 m/s</text>
    <line x1="309" y1="143" x2="319" y2="143" stroke="#657781" stroke-width="1.2" />
    <line x1="309" y1="243" x2="319" y2="243" stroke="#657781" stroke-width="1.2" />
    <path id="u14drop_diameter" d="M314 143 L314 243" fill="none" stroke="#657781" stroke-width="1.4" marker-start="url(#u14drop_dim)" marker-end="url(#u14drop_dim)" />
    <line x1="249" y1="143" x2="320" y2="143" stroke="#657781" stroke-width="1" />
    <line x1="249" y1="243" x2="320" y2="243" stroke="#657781" stroke-width="1" />
    <text x="333" y="198" font-size="13" fill="#263746" text-anchor="start">d = 3 mm</text>
    <line x1="232" y1="145" x2="207" y2="105" stroke="#356b83" stroke-width="1.2" />
    <text x="197" y="87" font-size="13" fill="#263746" text-anchor="middle">σ = 0,072 N/m</text>
    <text x="197" y="105" font-size="11" fill="#263746" text-anchor="middle">oznaka sučelja</text>
    <path d="M93 296 L93 354" fill="none" stroke="#3a4a56" stroke-width="2.3" marker-end="url(#u14drop_axisMarker)" />
    <text x="113" y="331" font-size="13" fill="#263746" text-anchor="middle">g</text>
    <text x="245" y="272" font-size="13" fill="#263746" text-anchor="middle">Početna kuglasta kap</text>
    <text x="472" y="105" font-size="15" fill="#263746" text-anchor="start">We = 31,3 &gt; 12</text>
    <text x="472" y="134" font-size="15" fill="#263746" text-anchor="start">Bo = 1,22; Δρ = ρᵥ − ρ<tspan baseline-shift="sub" font-size="0.75em">zr</tspan>
    </text>
    <text x="472" y="163" font-size="15" fill="#263746" text-anchor="start">L꜀ = 2,71 mm</text>
    <text x="472" y="192" font-size="15" fill="#263746" text-anchor="start">vₖᵣ ≈ 15,5 m/s (zadani kriterij)</text>
    <text x="472" y="268" font-size="13" fill="#263746" text-anchor="start">Kriterij upućuje na raspad.</text>
    <text x="472" y="292" font-size="13" fill="#263746" text-anchor="start">Broj, raspodjela veličina i putanje</text>
    <text x="472" y="316" font-size="13" fill="#263746" text-anchor="start">nastalih kapljica ovim računom</text>
    <text x="472" y="340" font-size="13" fill="#263746" text-anchor="start">nisu određeni.</text>
    <text x="410" y="410" font-size="12" fill="#263746" text-anchor="middle">Relativna brzina odnosi se na zrak i kap; početni promjer ulazi u We i Bo.</text>
  </g>
</svg>
