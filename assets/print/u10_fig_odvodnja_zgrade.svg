<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" role="img" aria-labelledby="u10oz-title u10oz-desc">
  <defs>
    <linearGradient id="u10oz-wg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4eef8"/>
      <stop offset="100%" stop-color="#7ec8e8"/>
    </linearGradient>
    <pattern id="u10oz-sraf" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#8090a0"/>
      <line x1="0" y1="8" x2="8" y2="0" stroke="#546e7a" stroke-width="1.8"/>
    </pattern>
    <marker id="u10oz-arrG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#0f766e"/>
    </marker>
    <marker id="u10oz-arrR" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#b42318"/>
    </marker>
    <marker id="u10oz-arrRrev" markerWidth="10" markerHeight="10" refX="4" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L6,3 z" fill="#b42318"/>
    </marker>
    <marker id="u10oz-arrD" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#546e7a"/>
    </marker>
    <marker id="u10oz-arrDrev" markerWidth="10" markerHeight="10" refX="4" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L6,3 z" fill="#546e7a"/>
    </marker>
  </defs>
  <rect width="940" height="420" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="372" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>
  <title id="u10oz-title">U10 T2 – Gravitacijska odvodnja zgrade</title>
  <desc id="u10oz-desc">Gravitacijska odvodnja: D=110 mm, L=18 m, Δz=3,50 m, Σξ=6,5 (ulaz+3 koljena+izlaz), λ=0,025 → v=2,545 m/s, Q=24,2 L/s.</desc>
  <!-- Titles -->
  <text x="54" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#173043">U10 · T2 – Gravitacijska odvodnja zgrade</text>
  <text x="54" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#516677">D=110 mm, L=18 m, Δz=3,50 m, Σξ=6,5, λ=0,025 → v=2,545 m/s, Q=24,2 L/s</text>
  <!-- === BUILDING SCHEMATIC === -->
  <!-- Building outline -->
  <rect x="64" y="96" width="240" height="244" rx="6" fill="#f5f5f5" stroke="#546e7a" stroke-width="2.5"/>
  <text x="184" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#173043" text-anchor="middle">Zgrada</text>
  <!-- Roof drain (inlet top) at x=184,y=96 -->
  <rect x="164" y="80" width="40" height="20" rx="4" fill="url(#u10oz-wg)" stroke="#546e7a" stroke-width="1.5"/>
  <text x="220" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#173043">ulaz ξ=0,5</text>
  <!-- Vertical pipe down left side of building: x=96, from y=100 to y=280 -->
  <rect x="86" y="100" width="18" height="180" fill="url(#u10oz-wg)" stroke="#546e7a" stroke-width="1.5"/>
  <!-- Horizontal pipe at bottom: x=96..340, y=278..300 -->
  <rect x="86" y="280" width="20" height="70" fill="url(#u10oz-sraf)"/>
  <rect x="64" y="298" width="360" height="14" fill="url(#u10oz-sraf)"/>
  <!-- Ground level slab -->
  <rect x="64" y="340" width="576" height="12" fill="url(#u10oz-sraf)"/>
  <!-- Horizontal pipe at ground level: x=86..640 -->
  <rect x="86" y="298" width="18" height="40" fill="url(#u10oz-wg)" stroke="#546e7a" stroke-width="1.5"/>
  <!-- Horiz ground pipe from building to sewer pit -->
  <rect x="100" y="318" width="540" height="18" fill="url(#u10oz-wg)" stroke="#546e7a" stroke-width="1.5"/>
  <!-- Sewer pit / exit at right x=640,y=318 -->
  <rect x="636" y="318" width="10" height="18" fill="url(#u10oz-wg)" stroke="#546e7a" stroke-width="1.5"/>
  <line x1="640" y1="327" x2="720" y2="327" stroke="#0f766e" stroke-width="4" marker-end="url(#u10oz-arrG)"/>
  <text x="728" y="331" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0f766e">izlaz</text>
  <text x="728" y="347" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#c49a0a">ξ=1,0</text>
  <!-- Elbows at 3 bends -->
  <!-- Bend 1: roof → vertical at (184,100) → but pipe is at x=96, so elbow at top of vertical -->
  <circle cx="95" cy="100" r="10" fill="#c49a0a" opacity="0.8"/>
  <text x="115" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#c49a0a">koljeno ξ=0,9</text>
  <!-- Bend 2: vertical → horizontal at building base (95,282) -->
  <circle cx="95" cy="316" r="10" fill="#c49a0a" opacity="0.8"/>
  <text x="115" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#c49a0a">koljeno ξ=0,9</text>
  <!-- Bend 3: another fitting mid-run x=400 -->
  <circle cx="400" cy="327" r="10" fill="#c49a0a" opacity="0.8"/>
  <text x="416" y="319" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#c49a0a">koljeno ξ=0,9</text>
  <!-- Δz dimension: from roof inlet (y=88) to ground pipe (y=327) -->
  <line x1="790" y1="88" x2="790" y2="327" stroke="#b42318" stroke-width="2" marker-start="url(#u10oz-arrRrev)" marker-end="url(#u10oz-arrR)"/>
  <line x1="300" y1="88" x2="792" y2="88" stroke="#b42318" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="640" y1="327" x2="792" y2="327" stroke="#b42318" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="796" y="192" width="72" height="26" rx="4" fill="#fff5f5" stroke="#b42318" stroke-width="1.2"/>
  <text x="832" y="209" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#b42318" text-anchor="middle">Δz=3,50 m</text>
  <!-- Flow direction arrows in pipe -->
  <line x1="95" y1="180" x2="95" y2="240" stroke="#0f766e" stroke-width="2.5" marker-end="url(#u10oz-arrG)"/>
  <line x1="240" y1="327" x2="320" y2="327" stroke="#0f766e" stroke-width="2.5" marker-end="url(#u10oz-arrG)"/>
  <!-- L annotation -->
  <text x="370" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#546e7a" text-anchor="middle">L=18 m total, D=110 mm</text>
  <!-- v annotation -->
  <text x="490" y="315" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0f766e">v=2,545 m/s</text>
  <!-- === FORMULA BOX === -->
  <rect x="44" y="360" width="840" height="44" rx="10" fill="#fffef6" stroke="#c49a0a" stroke-width="1.8"/>
  <text x="54" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#173043">K = λL/D + Σξ = 0,025·18/0,110 + 6,5 = 4,09 + 6,5 = 10,59    v = √(2gΔz/K) = √(68,67/10,59) = 2,545 m/s</text>
  <text x="54" y="397" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f766e">Q = A·v = π(0,110)²/4 · 2,545 = 24,18 L/s</text>
</svg>