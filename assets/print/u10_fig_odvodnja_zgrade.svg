<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="u10foz_title u10foz_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:900px;height:auto;">
  <title id="u10foz_title">Gravitacijska odvodnja zgrade - vertikalna cijev krov-revizijski sahta</title>
  <desc id="u10foz_desc">Lijevo: zgrada s krovnim slivnikom, vertikalnom PVC cijevi D=110 mm i kosim odvodom L=18 m do revizijskog sahta, s geodetskom razlikom dz=3,50 m. Tri koljena u trasi nose lokalne gubitke sum xi=6,5. Desno: cetiri koraka rjesenja - jednadzba Bernoullija izmedju slobodnih povrsina, koeficijent K, brzina v=2,545 m/s i protok Q=24,18 L/s.</desc>

  <defs>
    <linearGradient id="u10foz_voda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aed6f1" />
      <stop offset="100%" stop-color="#5b9ec9" />
    </linearGradient>
    <linearGradient id="u10foz_pvc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eef2" />
      <stop offset="100%" stop-color="#c0ccd4" />
    </linearGradient>
    <linearGradient id="u10foz_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f8fb" />
      <stop offset="100%" stop-color="#e6eef3" />
    </linearGradient>
    <pattern id="u10foz_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.1" />
    </pattern>
    <pattern id="u10foz_ground" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="9" height="9" fill="#e7ddc8" />
      <line x1="0" y1="0" x2="0" y2="9" stroke="#b59866" stroke-width="0.9" />
    </pattern>
    <pattern id="u10foz_brick" width="22" height="11" patternUnits="userSpaceOnUse">
      <rect width="22" height="11" fill="#f0e2cc" />
      <line x1="0" y1="0" x2="22" y2="0" stroke="#c8b390" stroke-width="0.7" />
      <line x1="0" y1="11" x2="22" y2="11" stroke="#c8b390" stroke-width="0.7" />
      <line x1="11" y1="0" x2="11" y2="11" stroke="#c8b390" stroke-width="0.7" />
    </pattern>
    <!-- Strelica vode (plava, tlak/strujanje) -->
    <marker id="u10foz_flow" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1565c0" />
    </marker>
    <!-- Kote -->
    <marker id="u10foz_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u10foz_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <!-- Leader bez markera, samo linije za poziv -->
  </defs>

  <!-- ===================== POZADINA ===================== -->
  <line x1="480" y1="40" x2="480" y2="486" stroke="#dce7f0" stroke-width="1.2" stroke-dasharray="4,5" />

  <!-- ===================== LIJEVI PANEL: ZGRADA ===================== -->
  <!-- Nebo iznad zgrade -->
  <rect x="30" y="60" width="430" height="40" fill="url(#u10foz_sky)" />

  <!-- Tlo (zemlja) -->
  <rect x="30" y="396" width="430" height="68" fill="url(#u10foz_ground)" stroke="#a89060" stroke-width="0.8" />
  <line x1="30" y1="396" x2="460" y2="396" stroke="#7a6440" stroke-width="1.4" />

  <!-- Zgrada (krov + zid) -->
  <!-- Zid zgrade -->
  <rect x="62" y="120" width="178" height="276" fill="url(#u10foz_brick)" stroke="#8a7050" stroke-width="1.4" />
  <!-- Krov (kosi) -->
  <polygon points="50,120 152,80 254,120" fill="#a85a3d" stroke="#5a3020" stroke-width="1.4" />
  <!-- Prozor -->
  <rect x="92" y="170" width="42" height="44" fill="#cde0ea" stroke="#3a4a56" stroke-width="1.2" />
  <line x1="113" y1="170" x2="113" y2="214" stroke="#3a4a56" stroke-width="0.8" />
  <line x1="92" y1="192" x2="134" y2="192" stroke="#3a4a56" stroke-width="0.8" />
  <!-- Vrata -->
  <rect x="100" y="320" width="38" height="76" fill="#6b4a30" stroke="#3a2010" stroke-width="1.2" />
  <circle cx="132" cy="358" r="1.6" fill="#d4af37" />

  <!-- ============================================================
       CIJEVNI SUSTAV - kontinuirana voda kroz cijevi
       Trasa: krovni slivnik (152,108) -> oluk -> vertikalna cijev
              (170 do y=380) -> koljeno -> kosa cijev do sahta (420,380)
  ============================================================ -->

  <!-- Krovni slivnik / oluk uz krov -->
  <rect x="165" y="106" width="80" height="14" rx="3" fill="url(#u10foz_pvc)" stroke="#5a6a78" stroke-width="1.2" />
  <!-- voda u olcku -->
  <rect x="168" y="112" width="74" height="6" fill="url(#u10foz_voda)" />
  <!-- slobodna povrsina 1 -->
  <line x1="168" y1="112" x2="242" y2="112" stroke="#1565c0" stroke-width="1.6" />

  <!-- Vertikalna cijev (PVC) na desnoj fasadi - vanjska stijenka -->
  <rect x="232" y="120" width="22" height="220" fill="url(#u10foz_pvc)" stroke="#5a6a78" stroke-width="1.2" />
  <!-- Voda u vertikalnoj cijevi -->
  <rect x="236" y="120" width="14" height="218" fill="url(#u10foz_voda)" />

  <!-- Koljeno (90 deg) na dnu vertikale - prelaz u kosu cijev -->
  <!-- ulazni koljeno blok -->
  <path d="M232,338 Q232,360 254,360 L254,372 Q232,372 232,360 L232,338 Z" fill="url(#u10foz_pvc)" stroke="#5a6a78" stroke-width="1.2" />
  <!-- voda kroz koljeno (mali patch) -->
  <path d="M236,338 Q236,356 254,356 L254,366 Q240,366 240,356 L240,338 Z" fill="url(#u10foz_voda)" />

  <!-- Kosa cijev (L = 18 m) od koljena na dnu zgrade do revizijskog sahta -->
  <!-- Pocetak: (254,356-372), Kraj: kod sahta (404,398-414) -->
  <!-- Geometrija: kut blagog pada -->
  <polygon points="254,356 404,396 404,416 254,376" fill="url(#u10foz_pvc)" stroke="#5a6a78" stroke-width="1.2" />
  <!-- Voda u kosoj cijevi -->
  <polygon points="254,360 404,400 404,412 254,372" fill="url(#u10foz_voda)" />

  <!-- Revizijski sahta -->
  <rect x="404" y="370" width="44" height="94" fill="url(#u10foz_hatch)" stroke="#3a4a56" stroke-width="1.4" />
  <rect x="408" y="384" width="36" height="76" fill="#ffffff" />
  <!-- voda u sahtu (mali bazen na dnu) -->
  <rect x="408" y="430" width="36" height="30" fill="url(#u10foz_voda)" />
  <!-- slobodna povrsina 2 u sahtu -->
  <line x1="408" y1="430" x2="444" y2="430" stroke="#1565c0" stroke-width="1.6" />
  <!-- poklopac sahta -->
  <rect x="400" y="394" width="52" height="6" rx="2" fill="#5d6d7e" stroke="#3a4a56" stroke-width="1" />
  <!-- ============================================================
       KOLJENA - 3 koljena oznacena zutom tockom + popis lokalnih
       Po tekstu: ulaz (krovni slivnik) + 3 koljena + izlaz = sum xi
  ============================================================ -->
  <!-- Koljeno 1: krov u vertikalu -->
  <!-- Koljeno 2: dno vertikale -->
  <!-- Koljeno 3: ulaz u sahta -->
  <!-- ============================================================
       STRELICE STRUJANJA (plave, smjer vode)
  ============================================================ -->
  <!-- u olku (kratka) -->
  <line x1="190" y1="115" x2="232" y2="115" stroke="#1565c0" stroke-width="2.2" marker-end="url(#u10foz_flow)" />
  <!-- vertikalna -->
  <line x1="243" y1="180" x2="243" y2="240" stroke="#1565c0" stroke-width="2.2" marker-end="url(#u10foz_flow)" />
  <line x1="243" y1="270" x2="243" y2="320" stroke="#1565c0" stroke-width="2.2" marker-end="url(#u10foz_flow)" />
  <!-- u kosoj cijevi (sredina trase) -->
  <line x1="294" y1="378" x2="364" y2="397" stroke="#1565c0" stroke-width="2.2" marker-end="url(#u10foz_flow)" />

  <!-- v oznaka -->
  <!-- ============================================================
       OZNAKE SLOBODNIH POVRSINA (1) i (2)
  ============================================================ -->
  <!-- Tocka 1 (krov / oluk) -->
  <circle cx="158" cy="112" r="8" fill="#ffffff" stroke="#1565c0" stroke-width="1.4" />
  <!-- caption uz tocku 1: kutija desno od slivnika, u nebu -->
  <rect x="262" y="62" width="190" height="30" rx="5" fill="#ffffff" stroke="#5a6a78" stroke-width="1" />
  <line x1="262" y1="86" x2="170" y2="112" stroke="#5a6a78" stroke-width="0.7" />

  <!-- Tocka 2 (sahta) -->
  <circle cx="426" cy="430" r="7" fill="#ffffff" stroke="#1565c0" stroke-width="1.4" />
  <!-- caption u sahtu, ispod slobodne povrsine 2 -->
  <!-- ============================================================
       KOTA DELTA Z (vertikalna, smedja, lijevo od slobodnih povrsina)
       Od y=112 (povr. 1) do y=430 (povr. 2)
  ============================================================ -->
  <!-- pomocne linije (extension) -->
  <!-- tik-crte -->
  <!-- dim line -->
  <!-- label u kutiji -->
  <!-- ============================================================
       OZNAKA D (promjer cijevi) - leader
  ============================================================ -->
  <line x1="254" y1="200" x2="328" y2="180" stroke="#5a6a78" stroke-width="0.7" />
  <rect x="328" y="166" width="118" height="28" rx="5" fill="#ffffff" stroke="#5a6a78" stroke-width="1" />
  <!-- ============================================================
       KOTA L (duljina cijevi) - paralelna kota uz kosu cijev
       Cijev gornja ivica: (254,356) -> (404,396); pomak okomito gore-desno
       Smjer cijevi: dx=150, dy=40; duljina ~155 px; normala (gore-desno) (40,-150)/155 = (0.258,-0.968)
       Offset 36 px -> pocetak kote: (254+9.3,356-34.8)=(263,321); kraj: (404+9.3,396-34.8)=(413,361)
  ============================================================ -->
  <!-- pomocne linije (extension) od cijevi okomito na os cijevi -->
  <!-- dim line uz cijev -->
  <!-- label u kutiji centriran na dim liniji s belom pozadinom da se line ne vidi kroz -->
  <!-- ============================================================
       LEGENDA LOKALNIH GUBITAKA (sum xi = 6,5)
  ============================================================ -->
  <!-- ===================== DESNI PANEL: 4 KORAKA ===================== -->
  <!-- Korak 1: Bernoulli izmedju slobodnih povrsina -->
  <rect x="500" y="62" width="396" height="86" rx="9" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="500" y="62" width="6" height="86" rx="3" fill="#1565c0" />
  <!-- Korak 2: koeficijent K -->
  <rect x="500" y="158" width="396" height="86" rx="9" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="500" y="158" width="6" height="86" rx="3" fill="#1565c0" />
  <!-- Korak 3: brzina v -->
  <rect x="500" y="254" width="396" height="86" rx="9" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="500" y="254" width="6" height="86" rx="3" fill="#1565c0" />
  <!-- Korak 4: protok Q -->
  <rect x="500" y="350" width="396" height="86" rx="9" fill="#f1f9f3" stroke="#cce7d4" stroke-width="1.2" />
  <rect x="500" y="350" width="6" height="86" rx="3" fill="#1e8449" />
  <!-- REZULTATI badge -->
  <rect x="500" y="446" width="396" height="42" rx="8" fill="#e8f5e9" stroke="#1e8449" stroke-width="1.4" />
  <circle cx="243" cy="118" r="6" fill="#fff3cd" stroke="#b7600c" stroke-width="1.4" />
  <circle cx="242" cy="356" r="6" fill="#fff3cd" stroke="#b7600c" stroke-width="1.4" />
  <circle cx="404" cy="406" r="6" fill="#fff3cd" stroke="#b7600c" stroke-width="1.4" />
  <line x1="158" y1="112" x2="34" y2="112" stroke="#b7600c" stroke-width="0.7" stroke-dasharray="3,3" />
  <line x1="426" y1="430" x2="34" y2="430" stroke="#b7600c" stroke-width="0.7" stroke-dasharray="3,3" />
  <line x1="34" y1="112" x2="46" y2="112" stroke="#b7600c" stroke-width="1.3" />
  <line x1="34" y1="430" x2="46" y2="430" stroke="#b7600c" stroke-width="1.3" />
  <line x1="40" y1="116" x2="40" y2="426" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u10foz_dimL)" marker-end="url(#u10foz_dim)" />
  <rect x="50" y="258" width="62" height="34" rx="6" fill="#fff5e8" stroke="#b7600c" stroke-width="1.2" />
  <line x1="254" y1="356" x2="263" y2="321" stroke="#b7600c" stroke-width="0.7" />
  <line x1="404" y1="396" x2="413" y2="361" stroke="#b7600c" stroke-width="0.7" />
  <line x1="263" y1="321" x2="413" y2="361" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u10foz_dimL)" marker-end="url(#u10foz_dim)" />
  <rect x="306" y="326" width="68" height="22" rx="5" fill="#fff5e8" stroke="#b7600c" stroke-width="1.1" />
  <rect x="30" y="466" width="430" height="32" rx="5" fill="#fffaf0" stroke="#b7600c" stroke-width="1" />
  <text x="40" y="46" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Gravitacijski odvod krov → revizijski šaht</text>

  <text x="426" y="412" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#5a6a78">šaht</text>

  <text x="262" y="232" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#1565c0">v</text>
  <text x="262.0" y="248.0" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1565c0">= 2,545 m/s</text>

  <text x="158" y="115" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#1565c0">1</text>
  <text x="357" y="74" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#1a2530">slobodna površina 1 (krovni slivnik)</text>
  <text x="357" y="86" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">p</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> = p<tspan baseline-shift="sub" font-size="0.7em">atm</tspan>,  v<tspan baseline-shift="sub" font-size="0.7em">1</tspan> ≈ 0</text>
  <text x="426" y="433" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#1565c0">2</text>
  <text x="426" y="448" font-family="'Segoe UI',Arial,sans-serif" font-size="9" text-anchor="middle" fill="#0d47a1"><tspan font-style="italic">p</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan>=p<tspan baseline-shift="sub" font-size="0.7em">atm</tspan></text>

  <text x="387" y="178" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">D</tspan> = 110 mm (PVC)</text>
  <text x="387" y="190" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#5a6a78">A = πD²/4 ≈ 9,503·10⁻³ m²</text>

  <text x="40" y="480" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a2530"><tspan font-weight="700" fill="#b7600c">Lokalni:</tspan> ulaz ξ = 0,5  +  3× koljeno ξ = 1,7  +  izlaz ξ = 1,0</text>
  <text x="40" y="494" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a2530">              Σξ = 0,5 + 3·1,7 + 1,0 = <tspan font-weight="700" fill="#b7600c">6,5</tspan>    λ = 0,025    ρ = 998 kg/m³</text>

  <text x="500" y="46" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Rješenje (Bernoulli izmedju 1 i 2)</text>

  <text x="516" y="82" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1565c0">1. Bernoulli: 1 → 2 (v₁ ≈ 0, v₂ ≈ 0)</text>
  <text x="698" y="106" font-family="'Segoe UI',Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1a2530">Δz = h<tspan baseline-shift="sub" font-size="0.7em">w</tspan> = (λ L/D + Σξ) v²/(2g)</text>
  <text x="698" y="134" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">sva visinska razlika ide u gubitke (linijski + lokalni)</text>

  <text x="516" y="178" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1565c0">2. Koeficijent ukupnih gubitaka K</text>
  <text x="698" y="202" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#1a2530">K = λ L/D + Σξ = 0,025·18/0,110 + 6,5</text>
  <text x="698" y="226" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1565c0">K = 4,091 + 6,5 = 10,591</text>

  <text x="516" y="274" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1565c0">3. Srednja brzina v</text>
  <text x="698" y="298" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#1a2530">v = √(2g Δz / K) = √(2·9,81·3,50 / 10,591)</text>
  <text x="698" y="322" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1565c0">v = √6,476 ≈ 2,545 m/s</text>

  <text x="516" y="370" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1e8449">4. Volumenski protok Q</text>
  <text x="698" y="394" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#1a2530">Q = A·v = π(0,110)²/4 · 2,545</text>
  <text x="698" y="418" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1e8449">Q = 9,503·10⁻³ · 2,545 ≈ 24,18 L/s</text>

  <text x="540" y="461" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#5a6a78">REZULTATI</text>
  <text x="630" y="476" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">v ≈ 2,545 m/s</text>
  <text x="810" y="476" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1e8449">Q ≈ 24,18 L/s</text>
<text x="243" y="121" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#b7600c">1</text>
  <text x="242" y="359" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#b7600c">2</text>
  <text x="404" y="409" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#b7600c">3</text>

  <text x="81" y="274" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#b7600c">Δz</text>
  <text x="81.0" y="290.0" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#b7600c">= 3,50 m</text>

  <text x="340" y="342" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#b7600c"><tspan font-style="italic" font-weight="700">L</tspan> = 18 m</text>

  </svg>
