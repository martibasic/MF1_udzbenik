<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" role="img" aria-labelledby="u04v3ks_title u04v3ks_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u04v3ks_title">Zatvoreni servisni modul s kosom inspekcijskom stijenkom</title>
  <desc id="u04v3ks_desc">Zatvoreni modul s plinskim pretlakom i nepropusnom kosom vanjskom stijenkom AB. S druge strane stijenke je atmosferski tlak. Slobodna površina završava u A; rezultanta neto tlaka djeluje okomito na AB, u točki određenoj udaljenošću y_R od A.</desc>
