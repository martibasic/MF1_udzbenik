<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" role="img"
     aria-labelledby="u04v3ks_u4v3T u04v3ks_u4v3D" preserveAspectRatio="xMidYMid meet"
     style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u04v3ks_u4v3T">U04 Val 3 – Zatvoreni modul s kosom inspekcijskom stijenkom</title>
  <desc id="u04v3ks_u4v3D">Zatvoreni transportni modul s pretlakom p₀=16 kPa iznad fluida. Ubrzanje a=3,4 m/s² naginje slobodnu površinu. Inspekcijska stijenka AB okomita je na slobodnu površinu (α≈71°). F_R≈11,0 kN/m, y_R≈0,31 m od A.</desc>
  <defs>
    <pattern id="u04v3ks_u4v3H" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#8090a0"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#546e7a" stroke-width="1.8"/>
    </pattern>
    <linearGradient id="u04v3ks_u4v3Wg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4eef8"/>
      <stop offset="100%" stop-color="#7ec8e8"/>
    </linearGradient>
    <marker id="u04v3ks_u4v3aGr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#546e7a"/>
    </marker>
    <marker id="u04v3ks_u4v3aGrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L0,8 L8,4 z" fill="#546e7a"/>
    </marker>
    <marker id="u04v3ks_u4v3aB" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#1565c0"/>
    </marker>
    <marker id="u04v3ks_u4v3aR" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#b42318"/>
    </marker>
    <marker id="u04v3ks_u4v3aDk" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#173043"/>
    </marker>
  </defs>

  <!-- Background + border -->
  <rect width="940" height="420" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="372" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>

  <!-- Title + subtitle -->

  <!-- === MODULE BOX (srafura walls, closed module) === -->
  <!-- Inner module: x=95..530, y=118..340 (scale ~200 px/m, H_inner≈1,11 m) -->
  <!-- Module walls (srafura, 25 px thick) -->
  <!-- Top wall -->
  <rect x="70" y="93" width="485" height="25" fill="url(#u04v3ks_u4v3H)"/>
  <rect x="70" y="93" width="485" height="25" fill="none" stroke="#546e7a" stroke-width="1.2"/>
  <!-- Bottom wall -->
  <rect x="70" y="340" width="485" height="25" fill="url(#u04v3ks_u4v3H)"/>
  <rect x="70" y="340" width="485" height="25" fill="none" stroke="#546e7a" stroke-width="1.2"/>
  <!-- Left wall -->
  <rect x="70" y="93" width="25" height="272" fill="url(#u04v3ks_u4v3H)"/>
  <rect x="70" y="93" width="25" height="272" fill="none" stroke="#546e7a" stroke-width="1.2"/>
  <!-- Right wall -->
  <rect x="530" y="93" width="25" height="272" fill="url(#u04v3ks_u4v3H)"/>
  <rect x="530" y="93" width="25" height="272" fill="none" stroke="#546e7a" stroke-width="1.2"/>

  <!-- Module inner outline -->
  <rect x="95" y="118" width="435" height="222" fill="none" stroke="#2d3a40" stroke-width="2"/>

  <!-- === FREE SURFACE AND REGIONS === -->
  <!-- Scale 200 px/m. A=(280,228), B=(318,338) -->
  <!-- Free surface through A=(280,228), slope dy/dx = a/g = 3.4/9.81 = 0.347 -->
  <!-- At x=95:  y=228+(95-280)*0.347=228-64.2=163.8≈164 -->
  <!-- At x=530: y=228+(530-280)*0.347=228+86.8=314.8≈315 -->

  <!-- Gas region (above free surface) — light cream -->
  <path d="M95,118 L530,118 L530,315 L95,164 Z" fill="#fef9ec" opacity="0.95"/>
  <!-- Fluid region (below free surface) — water gradient -->
  <path d="M95,164 L530,315 L530,340 L95,340 Z" fill="url(#u04v3ks_u4v3Wg)" opacity="0.85"/>

  <!-- Free surface line -->
  <line x1="95" y1="164" x2="530" y2="315" stroke="#3a87ad" stroke-width="2.5"/>

  <!-- θ label near the free surface -->
  <!-- Horizontal ref at left, near x=135, y=164+(135-95)*0.347=164+13.9=178 -->
  <line x1="135" y1="178" x2="195" y2="178" stroke="#546e7a" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- arc at (135,178) from horizontal to surface direction: angle 19.1°, radius 40 -->
  <!-- end point: (135+40*cos(-19.1°), 178+40*sin(-19.1°)) (going left on surface = up-left) -->
  <!-- Actually show angle at the RIGHT going direction: arc from (175,178) going right-up at 19.1° above horizontal -->
  <!-- In image coords: going right on free surface, y decreases (surface goes UP to right). Angle = 19.1° above horizontal. -->
  <path d="M175,178 A40,40 0 0 0 177.3,164.9" fill="none" stroke="#546e7a" stroke-width="1.2"/>
  <text x="170" y="162" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#546e7a">θ=19°</text>

  <!-- === INSPECTION WALL AB === -->
  <!-- A=(280,228), B=(318,338) — along g_eff direction: (sin19.1°, cos19.1°) = (0.327, 0.945) -->
  <!-- B = A + 110*(0.327,0.945) = A+(36,104) = (316,332) — let's use exact math: -->
  <!-- H=0,55m → 110px. dx=110*sin(19.1°)=110*0.327=35.97≈36, dy=110*cos(19.1°)=110*0.945=103.9≈104 -->
  <!-- So B=(280+36, 228+104)=(316,332) -->

  <!-- Wall AB — thick line -->
  <line x1="280" y1="228" x2="316" y2="332" stroke="#173043" stroke-width="5" stroke-linecap="round"/>

  <!-- Right-angle symbol at A: wall AB ⊥ free surface -->
  <!-- AB direction: (0.327, 0.945) -->
  <!-- Free surface direction from A: (0.945, -0.327) -->
  <!-- Right angle box: 8px from A along each direction, then the corner -->
  <!-- Corner = A + 8*(0.327,0.945) + 8*(0.945,-0.327) = (280+2.6+7.6, 228+7.6-2.6) = (290.2,233) -->
  <path d="M282.6,235.6 L290.1,232.9 L287.6,225.4" fill="none" stroke="#173043" stroke-width="1.5"/>

  <!-- Point A (circle, labeled) -->
  <circle cx="280" cy="228" r="5" fill="#173043"/>
  <rect x="260" y="213" width="20" height="18" rx="4" fill="#fff" stroke="#c9d2d8" stroke-width="1"/>
  <text x="270" y="225" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#173043" text-anchor="middle">A</text>

  <!-- Point B (circle, labeled) -->
  <circle cx="316" cy="332" r="5" fill="#173043"/>
  <rect x="322" y="324" width="20" height="18" rx="4" fill="#fff" stroke="#c9d2d8" stroke-width="1"/>
  <text x="332" y="337" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#173043" text-anchor="middle">B</text>

  <!-- Angle α at B (between wall AB and horizontal floor) -->
  <!-- Floor direction from B: rightward (1,0) -->
  <!-- Wall direction from B toward A: (-0.327, -0.945) -->
  <!-- Arc at B, radius 28px: from horizontal (B+28*(1,0)=(344,332)) counterclockwise to wall direction -->
  <!-- Wall endpoint: B + 28*(-0.327,-0.945) = (316-9.2, 332-26.5) = (306.8,305.5) ≈ (307,306) -->
  <path d="M344,332 A28,28 0 0 0 307,306" fill="none" stroke="#546e7a" stroke-width="1.5"/>
  <text x="344" y="322" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#546e7a">α≈71°</text>

  <!-- F_R resultant arrow on AB: at y_R=0,31m→62px from A along wall -->
  <!-- Position: A + 62*(0.327,0.945) = (280+20.3, 228+58.6) = (300.3,286.6) ≈ (300,287) -->
  <!-- Direction: perpendicular to AB pointing toward gas (right-up = (0.945,-0.327)) -->
  <!-- Arrow: from (300,287) to (300+0.945*52, 287-0.327*52) = (349.1, 269.9) ≈ (349,270) -->
  <line x1="300" y1="287" x2="349" y2="270" stroke="#b42318" stroke-width="4" marker-end="url(#u04v3ks_u4v3aR)"/>
  <rect x="352" y="260" width="46" height="20" rx="5" fill="#fff8f8" stroke="#d8c7c4" stroke-width="1.2"/>
  <text x="375" y="274" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#b42318" text-anchor="middle">F_R</text>

  <!-- p_M0 label in gas region (upper-left area of gas region) -->
  <text x="115" y="145" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043" font-weight="700">p₀ = 16 kPa</text>
  <text x="115" y="159" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677">(pretlak plina)</text>

  <!-- Uniform pressure arrows from gas side on AB -->
  <!-- Short arrows perpendicular to AB pointing from gas to wall (from right-up direction) -->
  <!-- Direction from gas to wall = -(0.945,-0.327) = (-0.945,0.327) -->
  <!-- Three arrows along AB, spaced 25px from A: at t=15,40,65 from A -->
  <!-- t=15: (280+4.9,228+14.2)=(284.9,242.2) → (284.9-0.945*18, 242.2+0.327*18)=(268,248.1) to (285,242) -->
  <!-- t=35: (280+11.4,228+33.1)=(291.4,261.1) → arrow from (274.4,267) to (291,261) -->
  <!-- t=55: (280+18.0,228+52)=(298,280) → arrow from (281.6,279) to (298,280)... -->
  <!-- These arrows show p₀ + triangular pressure on the wall -->
  <!-- Simplified: just a few small arrows -->
  <line x1="268" y1="248" x2="283" y2="243" stroke="#1565c0" stroke-width="1.5" marker-end="url(#u04v3ks_u4v3aB)"/>
  <line x1="263" y1="265" x2="278" y2="260" stroke="#1565c0" stroke-width="1.5" marker-end="url(#u04v3ks_u4v3aB)"/>
  <line x1="259" y1="283" x2="274" y2="278" stroke="#1565c0" stroke-width="1.8" marker-end="url(#u04v3ks_u4v3aB)"/>
  <line x1="255" y1="302" x2="270" y2="297" stroke="#1565c0" stroke-width="2.2" marker-end="url(#u04v3ks_u4v3aB)"/>
  <line x1="251" y1="321" x2="266" y2="316" stroke="#1565c0" stroke-width="2.5" marker-end="url(#u04v3ks_u4v3aB)"/>
  <!-- Arrow labels for pressure distribution -->
  <text x="228" y="262" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#1565c0">p↗</text>

  <!-- Acceleration arrow (above module, pointing right) -->
  <line x1="162" y1="82" x2="345" y2="82" stroke="#1565c0" stroke-width="3.5" marker-end="url(#u04v3ks_u4v3aB)"/>
  <rect x="178" y="65" width="112" height="19" rx="5" fill="#eef4ff" stroke="#c5d5e8" stroke-width="1"/>
  <text x="234" y="78" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1565c0" font-weight="700" text-anchor="middle">a = 3,4 m/s²</text>

  <!-- === DIMENSION LINES === -->

  <!-- H dimension (vertical projection of AB) -->
  <!-- From A_y=228 to B_y=332, at x=365 (right of B) -->
  <!-- Horizontal guide lines: A to (365,228), B to (365,332) -->
  <line x1="280" y1="228" x2="370" y2="228" stroke="#546e7a" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="316" y1="332" x2="370" y2="332" stroke="#546e7a" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- Vertical dim arrow at x=366, y=228..332 -->
  <line x1="366" y1="228" x2="366" y2="332" stroke="#546e7a" stroke-width="1.8" marker-start="url(#u04v3ks_u4v3aGrL)" marker-end="url(#u04v3ks_u4v3aGr)"/>
  <rect x="372" y="268" width="56" height="34" rx="5" fill="#fff" stroke="#c9d2d8" stroke-width="1"/>
  <text x="400" y="283" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043" text-anchor="middle">H</text>
  <text x="400" y="297" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677" text-anchor="middle">0,55 m</text>

  <!-- s label (along wall midpoint) -->
  <!-- Midpoint of AB: (298,280). Put text to the left of the wall. -->
  <rect x="224" y="272" width="54" height="20" rx="4" fill="#fff" stroke="#c9d2d8" stroke-width="1"/>
  <text x="251" y="286" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043" text-anchor="middle">s=0,58 m</text>
  <!-- Small arrow from text toward midpoint of AB -->
  <line x1="278" y1="281" x2="293" y2="280" stroke="#546e7a" stroke-width="1" marker-end="url(#u04v3ks_u4v3aGr)"/>

  <!-- === g_eff VECTOR INSET === -->
  <rect x="555" y="86" width="88" height="90" rx="8" fill="#f8fafb" stroke="#d3d9de" stroke-width="1.2"/>
  <!-- origin -->
  <circle cx="585" cy="120" r="3" fill="#173043"/>
  <!-- g arrow: down -->
  <line x1="585" y1="123" x2="585" y2="155" stroke="#173043" stroke-width="2.5" marker-end="url(#u04v3ks_u4v3aDk)"/>
  <text x="590" y="145" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#173043">g</text>
  <!-- a arrow: right -->
  <line x1="588" y1="120" x2="620" y2="120" stroke="#1565c0" stroke-width="2.5" marker-end="url(#u04v3ks_u4v3aB)"/>
  <text x="600" y="113" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#1565c0">a</text>
  <!-- g_eff arrow: diagonal -->
  <line x1="585" y1="120" x2="620" y2="155" stroke="#173043" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#u04v3ks_u4v3aDk)"/>
  <text x="615" y="163" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#173043">g_eff</text>
  <!-- θ label -->
  <path d="M585,132 A12,12 0 0 1 591.5,122.5" fill="none" stroke="#546e7a" stroke-width="1"/>
  <text x="558" y="172" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#516677">tan θ = a/g</text>

  <!-- === RIGHT PANEL: Formula box === -->
  <rect x="554" y="186" width="356" height="218" rx="10" fill="#fffef6" stroke="#c49a0a" stroke-width="1.8"/>
  <text x="574" y="210" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">Ključne jednadžbe</text>
  <line x1="574" y1="217" x2="895" y2="217" stroke="#e8d89a" stroke-width="1"/>

  <text x="574" y="234" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043">θ = arctan(a/g) = arctan(0,347) ≈ 19,1°</text>
  <text x="574" y="251" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043">α = 90° − θ ≈ 70,9°   (stijenka ⊥ površini)</text>
  <text x="574" y="268" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043">s = H/sin α = 0,55/sin 70,9°</text>
  <text x="574" y="284" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#173043">  s ≈ 0,582 m</text>
  <line x1="574" y1="292" x2="895" y2="292" stroke="#e8d89a" stroke-width="1"/>

  <text x="574" y="308" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043">g_eff = √(g²+a²) ≈ 10,38 m/s²</text>
  <text x="574" y="324" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043">F₀ = p₀·s = 16 000·0,582 ≈ 9,31 kN/m</text>
  <text x="574" y="340" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043">Fₕ = ½ρg_eff·s² ≈ 1,69 kN/m</text>
  <line x1="574" y1="348" x2="895" y2="348" stroke="#e8d89a" stroke-width="1"/>

  <text x="574" y="365" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#b42318">F_R = F₀+Fₕ ≈ 11,0 kN/m  →</text>
  <text x="574" y="381" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043">y_R = (F₀·s/2 + Fₕ·2s/3) / F_R ≈ 0,31 m od A</text>
  <text x="574" y="396" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677">ρ=960 kg/m³, p₀=16 kPa, a=3,4 m/s², H=0,55 m</text>

</svg>