  <text x="135" y="422" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#8e44ad">Efektivno polje sila</text>
  <text x="93" y="478" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="end" fill="#3a4a56">
    <tspan font-weight="700">g</tspan>
  </text>
  <text x="82" y="434" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="end" fill="#8e44ad">−<tspan font-weight="700">a</tspan>
  </text>
  <text x="68" y="495" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#8e44ad">
    <tspan font-weight="700">g</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">eff</tspan>
  </text>
  <text x="111" y="465" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-style="italic" fill="#7a8a96">θ</text>
  <text x="155" y="446" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a2530">tan θ = a/g</text>
  <text x="155" y="461" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a2530">θ ≈ 19,1°</text>
  <text x="155" y="481" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a6a78">|<tspan font-style="italic">g</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">eff</tspan>| ≈</text>
  <text x="155" y="495" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a6a78">10,38 m/s²</text>
  <text x="705" y="122" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Rješenje u četiri koraka</text>
  <text x="516" y="158" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#8e44ad">1.  Kut stijenke α</text>
  <text x="516" y="178" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1a2530">tan θ = a/g = 3,4/9,81 = 0,347   →   θ ≈ 19,1°</text>
  <text x="516" y="196" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#8e44ad">α = 90° − θ ≈ 70,9°</text>
  <text x="516" y="258" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1a2530">
    <tspan font-style="italic">s</tspan> = H / sin α = 0,55 / sin 70,9°   →   <tspan font-weight="700" fill="#b7600c">s ≈ 0,582 m</tspan>
  </text>
  <text x="516" y="302" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#1e8449">3.  Rezultanta sile fluida po jediničnoj širini</text>
  <text x="516" y="322" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530">F₀/b = p<tspan baseline-shift="sub" font-size="0.7em">M0</tspan> · s ≈ 9314 N/m</text>
  <text x="516" y="340" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530">F<tspan baseline-shift="sub" font-size="0.7em">h</tspan>/b = ½ ρ g<tspan baseline-shift="sub" font-size="0.7em">eff</tspan> s² ≈ 1689 N/m</text>
  <text x="516" y="358" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e8449">F<tspan baseline-shift="sub" font-size="0.7em">R</tspan>/b ≈ 11,00 kN/m</text>
  <text x="516" y="394" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#c0392b">4.  Hvatište od ruba A (mjereno po stijenci)</text>
  <text x="516" y="412" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1a2530">
    <tspan font-style="italic">y</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">R</tspan> = [F<tspan baseline-shift="sub" font-size="0.7em">0</tspan>(s/2) + F<tspan baseline-shift="sub" font-size="0.7em">h</tspan>(2s/3)] / F<tspan baseline-shift="sub" font-size="0.7em">R</tspan>   →   <tspan font-weight="700" fill="#c0392b">y<tspan baseline-shift="sub" font-size="0.7em">R</tspan> ≈ 0,31 m</tspan>
  </text>
  <text x="705" y="432" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">stijenka okomita na slobodnu površinu → jednolika + trokutasta raspodjela tlaka</text>
  <text x="705" y="470" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#5a6a78">REZULTATI</text>
  <text x="553" y="494" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#8e44ad">α ≈ 70,9°</text>
  <text x="765" y="494" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1e8449">F<tspan baseline-shift="sub" font-size="0.7em">R</tspan>/b ≈ 11,0 kN/m</text>
  <text x="870" y="494" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">y<tspan baseline-shift="sub" font-size="0.7em">R</tspan> ≈ 0,31 m</text>
  <text x="364" y="422" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1a2530">Legenda</text>
  <text x="276" y="443" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#3a4a56">tekućina (ρ = 960 kg/m³)</text>
  <text x="276" y="459" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#3a4a56">plin s pretlakom p<tspan baseline-shift="sub" font-size="0.7em">M0</tspan>
  </text>
  <text x="276" y="475" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#3a4a56">tlak na stijenku</text>
  <text x="280" y="490" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#3a4a56">rezultanta F<tspan baseline-shift="sub" font-size="0.7em">R</tspan>
  </text>
  <text x="396" y="475" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#3a4a56">ubrzanje a / g<tspan baseline-shift="sub" font-size="0.7em">eff</tspan>
  </text>
  <text x="396" y="490" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#3a4a56">kote</text>
  <text x="364" y="510" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#5a6a78">b = 1 m (jedinična širina modula)</text>
  <text x="516" y="238" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#b7600c">2.  Duljina stijenke AB</text>
  <text x="655" y="494" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#b7600c">s ≈ 0,582 m</text>
