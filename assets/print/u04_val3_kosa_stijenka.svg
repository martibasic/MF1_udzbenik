<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="u04v3ks_title u04v3ks_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="u04v3ks_title">U04 Val 3 - zatvoreni servisni modul s kosom inspekcijskom stijenkom</title>
  <desc id="u04v3ks_desc">Zatvoreni modul u relativnom mirovanju s pretlakom, kosom stijenkom AB, slobodnom površinom i ubrzanjem udesno.</desc>
  <rect width="980" height="420" fill="#fffdf8"/>
  <rect x="32" y="32" width="916" height="356" rx="22" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>

  <text x="90" y="150" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#173043">Bocni pogled modula</text>

  <rect x="150" y="170" width="340" height="170" rx="8" fill="none" stroke="#173043" stroke-width="6"/>

  <polygon points="230,180 450,255 450,340 290,340" fill="#9ed0e6" opacity="0.95"/>
  <line x1="230" y1="180" x2="450" y2="255" stroke="#ffffff" stroke-width="5"/>
  <line x1="230" y1="180" x2="290" y2="340" stroke="#173043" stroke-width="6"/>

  <text x="216" y="172" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#173043">A</text>
  <text x="300" y="358" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#173043">B</text>

  <line x1="348" y1="156" x2="438" y2="156" stroke="#1976d2" stroke-width="5" marker-end="url(#u04v3ks_arrowBlue)"/>
  <text x="390" y="144" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#173043">a</text>

  <text x="326" y="198" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#173043">p_M0</text>
  <text x="318" y="220" font-family="'Segoe UI',Arial,sans-serif" font-size="16" fill="#587183">jednolik pretlak plina</text>

  <line x1="188" y1="180" x2="188" y2="340" stroke="#c96c35" stroke-width="3" marker-start="url(#u04v3ks_arrowOrangeSmall)" marker-end="url(#u04v3ks_arrowOrange)"/>
  <text x="132" y="270" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#173043">H</text>

  <path d="M308 325 A42 42 0 0 1 346 340" fill="none" stroke="#6f7f89" stroke-width="3"/>
  <text x="346" y="327" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#173043">alpha</text>

  <line x1="246" y1="270" x2="196" y2="252" stroke="#c23b22" stroke-width="5" marker-end="url(#u04v3ks_arrowRed)"/>
  <text x="160" y="244" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#173043">F_R</text>

  <text x="565" y="150" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#173043">Citaj prvo geometriju</text>
  <rect x="560" y="175" width="300" height="150" rx="14" fill="#f7fafb" stroke="#d3d9de" stroke-width="2"/>
  <line x1="610" y1="230" x2="780" y2="288" stroke="#173043" stroke-width="5"/>
  <line x1="700" y1="208" x2="745" y2="329" stroke="#2e7d32" stroke-width="5" marker-end="url(#u04v3ks_arrowGreen)"/>
  <text x="754" y="312" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#173043">g_eff</text>
  <text x="578" y="302" font-family="'Segoe UI',Arial,sans-serif" font-size="17" fill="#587183">Slobodna površina je okomita na stijenku AB,</text>
  <text x="578" y="324" font-family="'Segoe UI',Arial,sans-serif" font-size="17" fill="#587183">a stijenka AB paralelna s g_eff.</text>

  <defs>
    <marker id="u04v3ks_arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#1976d2"/>
    </marker>
    <marker id="u04v3ks_arrowOrange" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#c96c35"/>
    </marker>
    <marker id="u04v3ks_arrowOrangeSmall" markerWidth="10" markerHeight="10" refX="4" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L6,3 z" fill="#c96c35"/>
    </marker>
    <marker id="u04v3ks_arrowGreen" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#2e7d32"/>
    </marker>
    <marker id="u04v3ks_arrowRed" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#c23b22"/>
    </marker>
  </defs>
</svg>