<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 474 495" role="img" aria-labelledby="u04v3ks_title u04v3ks_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:474px;height:auto;">
  <title id="u04v3ks_title">Zatvoreni servisni modul s kosom inspekcijskom stijenkom</title>
  <desc id="u04v3ks_desc">Zatvoreni modul s plinskim pretlakom i nepropusnom kosom vanjskom stijenkom AB. S druge strane stijenke je atmosferski tlak. Slobodna površina završava u A; manometarski tlak uzduž AB raste linearno od plinskog pretlaka u A do p_M,B u B, a strelice tlaka okomite su na stijenku. Sila i hvatište obrađuju se u poglavlju o silama na plohe. Umetak crta g, -a i g_eff u pravom omjeru a/g; strelica ubrzanja modula samo pokazuje smjer.</desc>
