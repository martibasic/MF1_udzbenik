<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" role="img"
     aria-labelledby="u01fgs_gsT u01fgs_gsD" preserveAspectRatio="xMidYMid meet"
     style="display:block;width:100%;max-width:820px;height:auto;">
  <title id="u01fgs_gsT">Gustoća, specifična težina i relativna gustoća ulja (ρ = 860 kg/m³)</title>
  <desc id="u01fgs_gsD">Lijevo: ulje u posudi s oznakama ρ, γ, sr. Desno: usporedba isti volumen – ulje vs voda.</desc>
  <defs>
    <marker id="u01fgs_gsaR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#c0392b"/>
    </marker>
    <marker id="u01fgs_gsaO" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#b7600c"/>
    </marker>
    <marker id="u01fgs_gsaOR" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L0,8 L8,4 z" fill="#b7600c"/>
    </marker>
    <linearGradient id="u01fgs_gsOil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8e090"/>
      <stop offset="100%" stop-color="#d4a020"/>
    </linearGradient>
    <linearGradient id="u01fgs_gsWt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aed6f1"/>
      <stop offset="100%" stop-color="#5b9ec9"/>
    </linearGradient>
    <pattern id="u01fgs_gsHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8a9aa6" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="820" height="450" fill="#f8f9fa"/>

  <!-- ════════════════════════════════════════════
       LEFT PANEL – ulje u posudi
  ════════════════════════════════════════════ -->
  <rect x="20" y="20" width="380" height="422" rx="10" fill="#ffffff" stroke="#dde3ea" stroke-width="1.5"/>
  <text x="210" y="47" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530" text-anchor="middle">Ulje u posudi</text>

  <!-- Container walls (hatched) -->
  <rect x="56" y="72" width="18" height="248" fill="url(#u01fgs_gsHatch)" stroke="#4a6070" stroke-width="1.2"/>
  <rect x="346" y="72" width="18" height="248" fill="url(#u01fgs_gsHatch)" stroke="#4a6070" stroke-width="1.2"/>
  <rect x="56" y="318" width="308" height="18" fill="url(#u01fgs_gsHatch)" stroke="#4a6070" stroke-width="1.2"/>

  <!-- Oil fluid (fills from y=138 to y=318 = 180 px) -->
  <rect x="74" y="138" width="272" height="180" fill="url(#u01fgs_gsOil)"/>

  <!-- Fluid level dashed -->
  <line x1="56" y1="138" x2="364" y2="138" stroke="#c8860a" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="369" y="143" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#c8860a">nivo</text>

  <!-- V label inside fluid -->
  <text x="210" y="238" font-family="'Segoe UI',Arial,sans-serif" font-size="28" font-weight="700" fill="#7d4e00" text-anchor="middle" opacity="0.5">V</text>

  <!-- m label (above fluid, inside empty space of container) -->
  <text x="210" y="118" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-style="italic" fill="#1a2530" text-anchor="middle">m</text>

  <!-- G arrow downward below container floor -->
  <line x1="210" y1="328" x2="210" y2="360" stroke="#c0392b" stroke-width="3" marker-end="url(#u01fgs_gsaR)"/>
  <text x="220" y="349" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#c0392b">G = mg</text>

  <!-- h kota (left side) -->
  <line x1="42" y1="138" x2="42" y2="318" stroke="#b7600c" stroke-width="1.6" marker-start="url(#u01fgs_gsaOR)" marker-end="url(#u01fgs_gsaO)"/>
  <text x="30" y="233" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#b7600c" text-anchor="middle">h</text>

  <!-- Result labels -->
  <rect x="46" y="374" width="308" height="56" rx="7" fill="#fafbfc" stroke="#dde3ea" stroke-width="1.2"/>
  <text x="200" y="393" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530" text-anchor="middle">&#961; = m/V = <tspan font-weight="700">860 kg/m&#xB3;</tspan></text>
  <text x="200" y="411" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1e8449" text-anchor="middle">&#947; = &#961;g &#8776; <tspan font-weight="700">8,44 kN/m&#xB3;</tspan></text>
  <text x="200" y="425" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#7d3c98" text-anchor="middle">s<tspan font-size="9" dy="3">r</tspan><tspan dy="-3"> = &#961;/&#961;</tspan><tspan font-size="9" dy="3">H&#x2082;O</tspan><tspan dy="-3"> = </tspan><tspan font-weight="700">0,86</tspan></text>

  <!-- ════════════════════════════════════════════
       RIGHT PANEL – usporedba ulje vs voda
  ════════════════════════════════════════════ -->
  <rect x="420" y="20" width="380" height="422" rx="10" fill="#ffffff" stroke="#dde3ea" stroke-width="1.5"/>
  <text x="610" y="47" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530" text-anchor="middle">Usporedba: isti volumen V = 1 L</text>
  <text x="610" y="63" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78" text-anchor="middle">Razli&#269;ita gustо&#263;a &#8594; razli&#269;ita te&#382;ina G</text>

  <!-- Oil container (left) -->
  <rect x="452" y="72" width="12" height="248" fill="url(#u01fgs_gsHatch)" stroke="#4a6070" stroke-width="1.2"/>
  <rect x="544" y="72" width="12" height="248" fill="url(#u01fgs_gsHatch)" stroke="#4a6070" stroke-width="1.2"/>
  <rect x="452" y="318" width="104" height="12" fill="url(#u01fgs_gsHatch)" stroke="#4a6070" stroke-width="1.2"/>
  <!-- Oil fluid: h = round(0.86 * 246) = 212px → top y = 318-212 = 106 -->
  <rect x="464" y="106" width="80" height="212" fill="url(#u01fgs_gsOil)"/>
  <line x1="452" y1="106" x2="556" y2="106" stroke="#c8860a" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="498" y="100" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#1a2530" text-anchor="middle">&#961; = 860</text>
  <text x="498" y="348" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530" text-anchor="middle" font-weight="700">ulje</text>
  <!-- Labels inside oil fluid -->
  <text x="504" y="218" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#7d4e00" text-anchor="middle">m = 860 g</text>
  <text x="504" y="234" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#7d4e00" text-anchor="middle">G &#8776; 8,44 N</text>

  <!-- Water container (right) -->
  <rect x="640" y="72" width="12" height="248" fill="url(#u01fgs_gsHatch)" stroke="#4a6070" stroke-width="1.2"/>
  <rect x="732" y="72" width="12" height="248" fill="url(#u01fgs_gsHatch)" stroke="#4a6070" stroke-width="1.2"/>
  <rect x="640" y="318" width="104" height="12" fill="url(#u01fgs_gsHatch)" stroke="#4a6070" stroke-width="1.2"/>
  <!-- Water: full 246px, top y=72 -->
  <rect x="652" y="72" width="80" height="246" fill="url(#u01fgs_gsWt)"/>
  <text x="690" y="66" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#1a2530" text-anchor="middle">&#961; = 1000</text>
  <text x="690" y="348" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530" text-anchor="middle" font-weight="700">voda</text>
  <text x="696" y="200" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1565c0" text-anchor="middle">m = 1000 g</text>
  <text x="696" y="216" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1565c0" text-anchor="middle">G &#8776; 9,81 N</text>

  <!-- ΔG bracket between containers (x=604-614, from y=72 to y=106) -->
  <line x1="608" y1="72" x2="608" y2="106" stroke="#c0392b" stroke-width="2"/>
  <line x1="604" y1="72" x2="612" y2="72" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="604" y1="106" x2="612" y2="106" stroke="#c0392b" stroke-width="1.8"/>
  <text x="618" y="85" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#c0392b" font-weight="700">&#916;G</text>
  <text x="618" y="100" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#c0392b">&#8776; 14%</text>

  <!-- Footer explanation box -->
  <rect x="432" y="374" width="356" height="56" rx="7" fill="#fafbfc" stroke="#dde3ea" stroke-width="1.2"/>
  <text x="610" y="393" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78" text-anchor="middle">Isti V = 1 L &#8594; G<tspan font-size="9" dy="3">ulje</tspan><tspan dy="-3"> = s</tspan><tspan font-size="9" dy="3">r</tspan><tspan dy="-3"> &#183; G</tspan><tspan font-size="9" dy="3">voda</tspan><tspan dy="-3"> = 0,86 &#215; 9,81 &#8776; 8,44 N</tspan></text>
  <text x="610" y="411" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#7d3c98" text-anchor="middle">s<tspan font-size="9" dy="3">r</tspan><tspan dy="-3"> = &#961;</tspan><tspan font-size="9" dy="3">ulje</tspan><tspan dy="-3">/&#961;</tspan><tspan font-size="9" dy="3">H&#x2082;O</tspan><tspan dy="-3"> = 860/1000 = 0,86  &#8594;  ulje je 14% lakše od vode</tspan></text>
  <text x="610" y="427" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78" text-anchor="middle">(za isti volumen; ulje bi plutalo na vodi jer s<tspan font-size="8" dy="3">r</tspan><tspan dy="-3"> &lt; 1)</tspan></text>
</svg>
