<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" role="img" aria-labelledby="u01fgs_title u01fgs_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="u01fgs_title">Gustoća i specifična težina ulja</title>
  <desc id="u01fgs_desc">Isti volumen ulja i vode ima različitu masu i težinu. Težina ulja nacrtana je kroz njegovo težište; nije sila na dno posude. Kota dubine završava na unutarnjem dnu i slobodnoj površini.</desc>
  <defs>
    <pattern id="u01fgs_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.8" />
    </pattern>
    <marker id="u01fgs_v" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
    </marker>
    <marker id="u01fgs_dim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse">
      <path d="M0 0 L6 2.5 L0 5 Z" fill="#657781" />
    </marker>
    <marker id="u01fgs_dimSmall" markerWidth="3" markerHeight="3" refX="3" refY="1.5" orient="auto-start-reverse">
      <path d="M0 0 L3 1.5 L0 3 Z" fill="#356b83" />
    </marker>
  </defs>
  <g font-family="Arial, Liberation Sans, sans-serif" fill="#3a4a56">
    <defs>
      <marker id="u01fgs_forceMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
        <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
      </marker>
      <marker id="u01fgs_pressureMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
        <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
      </marker>
      <marker id="u01fgs_reactionMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
        <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
      </marker>
      <marker id="u01fgs_axisMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
        <path d="M0 0 L7 3 L0 6 Z" fill="#3a4a56" />
      </marker>
    </defs>
    <defs />
    <g id="u01fgs_oilPanel" transform="translate(30 30)">
      <text x="215.0" y="21" font-size="14" fill="#263746" text-anchor="middle" font-weight="700">Ulje u posudi</text>
      <defs />
      <rect x="144" y="110" width="146" height="180" rx="0" fill="#eadfc5" stroke="none" stroke-width="1.2" />
      <line x1="144" y1="110" x2="290" y2="110" stroke="#356b83" stroke-width="2" />
      <rect x="136" y="70" width="8" height="228" rx="0" fill="url(#u01fgs_hatch)" stroke="#3a4a56" stroke-width="1.2" />
      <rect x="290" y="70" width="8" height="228" rx="0" fill="url(#u01fgs_hatch)" stroke="#3a4a56" stroke-width="1.2" />
      <rect x="136" y="290" width="162" height="8" rx="0" fill="url(#u01fgs_hatch)" stroke="#3a4a56" stroke-width="1.2" />
      <line x1="106" y1="110" x2="116" y2="110" stroke="#657781" stroke-width="1.2" />
      <line x1="106" y1="290" x2="116" y2="290" stroke="#657781" stroke-width="1.2" />
      <path id="u01fgs_h" d="M111 110 L111 290" fill="none" stroke="#657781" stroke-width="1.4" marker-start="url(#u01fgs_dim)" marker-end="url(#u01fgs_dim)" />
      <text x="88" y="206" font-size="14" fill="#263746" text-anchor="middle">h</text>
      <line x1="111" y1="110" x2="137" y2="110" stroke="#657781" stroke-width="1" />
      <line x1="111" y1="290" x2="137" y2="290" stroke="#657781" stroke-width="1" />
      <text x="217" y="151" font-size="20" fill="#263746" text-anchor="middle" font-weight="700">V</text>
      <text x="217" y="176" font-size="14" fill="#263746" text-anchor="middle">m, ρ</text>
      <circle id="u01fgs_centerOfMass" cx="217" cy="200" r="3" fill="#356b83" />
      <text x="217" y="188" font-size="13" fill="#263746" text-anchor="middle" font-weight="700" />
      <path id="u01fgs_weight" d="M217 200 L217 264" fill="none" stroke="#356b83" stroke-width="2.3" marker-end="url(#u01fgs_forceMarker)" />
      <text x="233" y="240" font-size="13" fill="#263746" text-anchor="start">G = mg</text>
      <text x="217" y="318" font-size="11" fill="#263746" text-anchor="middle">G: težina samo ulja</text>
      <text x="215" y="361" font-size="12" fill="#263746" text-anchor="middle">ρ = 860 kg/m³; γ ≈ 8,44 kN/m³; sᵣ = 0,86</text>
    </g>
    <g id="u01fgs_comparison" transform="translate(490 30)">
      <text x="230.0" y="21" font-size="14" fill="#263746" text-anchor="middle" font-weight="700">Usporedba pri istom volumenu V = 1 L</text>
      <text x="230" y="51" font-size="11" fill="#263746" text-anchor="middle">Različita gustoća → različita masa i težina</text>
      <defs />
      <rect x="62" y="110" width="88" height="180" rx="0" fill="#eadfc5" stroke="none" stroke-width="1.2" />
      <line x1="62" y1="110" x2="150" y2="110" stroke="#356b83" stroke-width="2" />
      <rect x="54" y="90" width="8" height="208" rx="0" fill="url(#u01fgs_hatch)" stroke="#3a4a56" stroke-width="1.2" />
      <rect x="150" y="90" width="8" height="208" rx="0" fill="url(#u01fgs_hatch)" stroke="#3a4a56" stroke-width="1.2" />
      <rect x="54" y="290" width="104" height="8" rx="0" fill="url(#u01fgs_hatch)" stroke="#3a4a56" stroke-width="1.2" />
      <text x="106" y="174" font-size="14" fill="#263746" text-anchor="middle">ulje</text>
      <text x="106" y="215" font-size="12" fill="#263746" text-anchor="middle" font-weight="700">m = 860 g</text>
      <text x="106" y="239" font-size="12" fill="#263746" text-anchor="middle">G ≈ 8,44 N</text>
      <text x="106" y="318" font-size="11" fill="#263746" text-anchor="middle">ρ = 860 kg/m³</text>
      <defs />
      <rect x="302" y="110" width="88" height="180" rx="0" fill="#dcebf1" stroke="none" stroke-width="1.2" />
      <line x1="302" y1="110" x2="390" y2="110" stroke="#356b83" stroke-width="2" />
      <rect x="294" y="90" width="8" height="208" rx="0" fill="url(#u01fgs_hatch)" stroke="#3a4a56" stroke-width="1.2" />
      <rect x="390" y="90" width="8" height="208" rx="0" fill="url(#u01fgs_hatch)" stroke="#3a4a56" stroke-width="1.2" />
      <rect x="294" y="290" width="104" height="8" rx="0" fill="url(#u01fgs_hatch)" stroke="#3a4a56" stroke-width="1.2" />
      <text x="346" y="174" font-size="14" fill="#263746" text-anchor="middle">voda</text>
      <text x="346" y="215" font-size="12" fill="#263746" text-anchor="middle" font-weight="700">m = 1000 g</text>
      <text x="346" y="239" font-size="12" fill="#263746" text-anchor="middle">G ≈ 9,81 N</text>
      <text x="346" y="318" font-size="11" fill="#263746" text-anchor="middle">ρ = 1000 kg/m³</text>
      <text x="230" y="160" font-size="12" fill="#263746" text-anchor="middle">ΔG ≈ 1,37 N</text>
      <text x="230" y="181" font-size="11" fill="#263746" text-anchor="middle">ulje je 14 % lakše</text>
      <text x="230" y="361" font-size="13" fill="#263746" text-anchor="middle" font-weight="700">sᵣ = ρᵤₗⱼₑ / ρᵥ = 0,86</text>
    </g>
  </g>
</svg>
