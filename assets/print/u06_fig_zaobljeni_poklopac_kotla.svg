<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" role="img"
     aria-labelledby="u06fzpk_u6zpkT u06fzpk_u6zpkD" preserveAspectRatio="xMidYMid meet"
     style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u06fzpk_u6zpkT">U06 – Zaobljeni poklopac procesnog kotla</title>
  <desc id="u06fzpk_u6zpkD">Cetvrtkružni segment (R=0,60 m, b=1,50 m) na poklopcu kotla s gornjim rubom na dubini h1=1,20 m. Prikazane su komponente F_H=13,22 kN (horizontalna, na vertikalnu projekciju) i F_V=14,74 kN (vertikalna, imaginarni volumen V*), te rezultanta F_R≈19,8 kN.</desc>
  <defs>
    <marker id="u06fzpk_u6zpkaR" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#c0392b"/>
    </marker>
    <marker id="u06fzpk_u6zpkaV" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#7d3c98"/>
    </marker>
    <marker id="u06fzpk_u6zpkaDim" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#c96c35"/>
    </marker>
    <marker id="u06fzpk_u6zpkaDimL" markerWidth="10" markerHeight="10" refX="4" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L6,3 z" fill="#c96c35"/>
    </marker>
    <pattern id="u06fzpk_u6zpkwall" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#8a9aa6" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="940" height="400" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="352" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>

  <!-- ── Slobodna površina ── -->
  <!-- Scale: 1 m = 100 px. h1=1.20m→120px; R=0.60m→60px -->
  <!-- Arc centre: (370, 340), R=60. Top of arc: (370, 280). Right of arc: (430, 340). -->
  <!-- Free surface: y = 280 - 120 = 160. Wall: x=365..375, y=160..280. Floor: y=336..344, x=370..500. -->
  <line x1="80" y1="160" x2="490" y2="160" stroke="#3a87ad" stroke-width="3.5"/>
  <text x="495" y="164" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#173043">slobodna površina</text>

  <!-- Fluid (left of wall) -->
  <rect x="80" y="160" width="286" height="180" fill="#aed6f1" fill-opacity="0.55"/>

  <!-- V* imaginary volume (green dashed) -->
  <!-- Path: (370,160)→(430,160)→(430,340) arc-CCW→(370,280)→close -->
  <path d="M 370,160 L 430,160 L 430,340 A 60,60 0 0,0 370,280 Z"
        fill="#d5f5e3" fill-opacity="0.8" stroke="#27ae60" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="413" y="215" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" font-weight="700" text-anchor="middle" fill="#1e8449">V*</text>

  <!-- Wall (vertical) -->
  <rect x="364" y="160" width="12" height="120" fill="#909fa8" stroke="#5d6d7e" stroke-width="1.8"/>
  <rect x="364" y="160" width="12" height="120" fill="url(#u06fzpk_u6zpkwall)" opacity="0.5"/>

  <!-- Floor (horizontal) -->
  <rect x="364" y="334" width="96" height="10" fill="#909fa8" stroke="#5d6d7e" stroke-width="1.8"/>
  <rect x="364" y="334" width="96" height="10" fill="url(#u06fzpk_u6zpkwall)" opacity="0.5"/>

  <!-- Quarter circle arc (curved surface) -->
  <path d="M 370,280 A 60,60 0 0,1 430,340" fill="none" stroke="#5d6d7e" stroke-width="4"/>

  <!-- h₁ dimension (surface → top of arc) -->
  <line x1="314" y1="160" x2="318" y2="160" stroke="#c96c35" stroke-width="1.5"/>
  <line x1="314" y1="280" x2="318" y2="280" stroke="#c96c35" stroke-width="1.5"/>
  <line x1="316" y1="162" x2="316" y2="278" stroke="#c96c35" stroke-width="2"
        marker-start="url(#u06fzpk_u6zpkaDimL)" marker-end="url(#u06fzpk_u6zpkaDim)"/>
  <text x="304" y="225" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#92400e" text-anchor="end">h₁ = 1,20 m</text>

  <!-- R dimension (arc radius) -->
  <line x1="370" y1="348" x2="370" y2="353" stroke="#c96c35" stroke-width="1.5"/>
  <line x1="430" y1="348" x2="430" y2="353" stroke="#c96c35" stroke-width="1.5"/>
  <line x1="372" y1="351" x2="428" y2="351" stroke="#c96c35" stroke-width="2"
        marker-start="url(#u06fzpk_u6zpkaDimL)" marker-end="url(#u06fzpk_u6zpkaDim)"/>
  <text x="400" y="366" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#92400e" text-anchor="middle">R = 0,60 m</text>

  <!-- F_H arrow (horizontal, rightward, mid-height of arc = 280+60/2=310) -->
  <line x1="430" y1="310" x2="560" y2="310" stroke="#c0392b" stroke-width="3.5" marker-end="url(#u06fzpk_u6zpkaR)"/>
  <text x="564" y="308" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" font-style="italic" fill="#c0392b">F_H = 13,22 kN</text>

  <!-- F_V arrow (downward, mid-width = 370+30=400; arc at x=400: y=340-sqrt(60²-30²)=340-52=288) -->
  <line x1="400" y1="340" x2="400" y2="382" stroke="#7d3c98" stroke-width="3.5" marker-end="url(#u06fzpk_u6zpkaV)"/>
  <text x="408" y="395" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" font-style="italic" fill="#7d3c98">F_V = 14,74 kN</text>

  <!-- Note at bottom -->
  <text x="54" y="352" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#516677">Rezultanta: F_R = √(13,22² + 14,74²) ≈ 19,8 kN · Kut: θ = arctan(14,74/13,22) ≈ 48° od horizontale</text>
</svg>
