<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" role="img" aria-labelledby="u9fb-title u9fb-subtitle">
  <defs>
    <linearGradient id="u9fb-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4eef8"/>
      <stop offset="100%" stop-color="#7ec8e8"/>
    </linearGradient>
    <marker id="u9fb-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#0f766e"/>
    </marker>
    <marker id="u9fb-gray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#546e7a"/>
    </marker>
  </defs>
  <rect x="24" y="24" width="892" height="382" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>
  <text font-family="Segoe UI, Arial, sans-serif" id="u9fb-title" x="54" y="55" font-size="19" font-weight="700" fill="#173043">Istjecanje kroz propust u brani</text>
  <text font-family="Segoe UI, Arial, sans-serif" id="u9fb-subtitle" x="54" y="76" font-size="13" fill="#516677">Torricelli: H = 8.5 m, d = 0.40 m, idealni model bez gubitaka</text>

  <rect x="250" y="64" width="110" height="292" fill="#95a5a6" stroke="#546e7a" stroke-width="2.2"/>
  <rect x="78" y="64" width="172" height="260" fill="url(#u9fb-water)" opacity="0.8"/>
  <line x1="78" y1="64" x2="250" y2="64" stroke="#1565c0" stroke-width="2.2"/>
  <text font-family="Segoe UI, Arial, sans-serif" x="82" y="58" font-size="12" fill="#1565c0">p.p.</text>

  <rect x="250" y="252" width="110" height="32" fill="#ffffff" stroke="#546e7a" stroke-width="1.8"/>
  <rect x="360" y="252" width="174" height="32" fill="url(#u9fb-water)" opacity="0.8"/>
  <line x1="365" y1="268" x2="542" y2="268" stroke="#0f766e" stroke-width="3" marker-end="url(#u9fb-green)"/>
  <text font-family="Segoe UI, Arial, sans-serif" x="555" y="272" font-size="13" fill="#173043">v = sqrt(2gH) ≈ 12.9 m/s</text>

  <line x1="78" y1="64" x2="78" y2="252" stroke="#546e7a" stroke-width="1.4" marker-end="url(#u9fb-gray)"/>
  <text font-family="Segoe UI, Arial, sans-serif" x="54" y="160" font-size="13" fill="#173043">H = 8.5 m</text>

  <line x1="250" y1="304" x2="360" y2="304" stroke="#546e7a" stroke-width="1.4" marker-end="url(#u9fb-gray)"/>
  <text font-family="Segoe UI, Arial, sans-serif" x="284" y="325" font-size="13" fill="#173043">d = 0.40 m</text>

  <circle cx="158" cy="78" r="4.5" fill="#b42318"/>
  <text font-family="Segoe UI, Arial, sans-serif" x="170" y="82" font-size="12" fill="#173043">1</text>
  <circle cx="414" cy="268" r="4.5" fill="#b42318"/>
  <text font-family="Segoe UI, Arial, sans-serif" x="426" y="272" font-size="12" fill="#173043">2</text>

  <rect x="642" y="110" width="224" height="164" rx="10" fill="#fffef6" stroke="#c49a0a" stroke-width="1.8"/>
  <text font-family="Segoe UI, Arial, sans-serif" x="656" y="136" font-size="13" fill="#173043">Bernoulli između 1 i 2</text>
  <text font-family="Segoe UI, Arial, sans-serif" x="656" y="161" font-size="12" fill="#173043">p1 = patm, v1 ≈ 0, z1 = H</text>
  <text font-family="Segoe UI, Arial, sans-serif" x="656" y="181" font-size="12" fill="#173043">p2 = patm, z2 = 0</text>
  <line x1="656" y1="193" x2="842" y2="193" stroke="#e8d89a" stroke-width="1.2"/>
  <text font-family="Segoe UI, Arial, sans-serif" x="656" y="214" font-size="12" fill="#516677">Q = A v = 1.62 m3/s</text>
  <text font-family="Segoe UI, Arial, sans-serif" x="656" y="236" font-size="12" fill="#516677">stvarni Q je manji zbog gubitaka</text>
</svg>
