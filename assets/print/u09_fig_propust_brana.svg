<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-labelledby="u09fpb_title u09fpb_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:860px;height:auto;">
  <title id="u09fpb_title">Istjecanje kroz propust u brani — Torricelli</title>
  <desc id="u09fpb_desc">Mala brana s rezervoarom vode dubine 8,50 m iznad osi cijevnog propusta promjera 0,40 m. Atmosferski tlak djeluje na slobodnoj povrsini (tocka 1) i na izlazu propusta (tocka 2). Iz Bernoullijeve jednadzbe izmedu 1 i 2 slijedi Torricellijeva brzina v ≈ 12,91 m/s i volumenski protok Q ≈ 1,622 m^3/s. Desni panel prikazuje izvod i konacne rezultate.</desc>

  <defs>
    <linearGradient id="u09fpb_voda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aed6f1" />
      <stop offset="1" stop-color="#5b9ec9" />
    </linearGradient>
    <linearGradient id="u09fpb_mlaz" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b9ec9" />
      <stop offset="1" stop-color="#aed6f1" stop-opacity="0.55" />
    </linearGradient>
    <pattern id="u09fpb_beton" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.1" />
    </pattern>
    <pattern id="u09fpb_tlo" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <rect width="9" height="9" fill="#e8d8b8" />
      <line x1="0" y1="0" x2="0" y2="9" stroke="#a78b5a" stroke-width="0.9" />
    </pattern>
    <marker id="u09fpb_av" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1e8449" />
    </marker>
    <marker id="u09fpb_ap" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#1565c0" />
    </marker>
    <marker id="u09fpb_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u09fpb_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
  </defs>

  <!-- ============================================================
       OKVIRI PANELA
  ============================================================ -->
  <rect x="14" y="14" width="500" height="472" rx="14" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.4" />
  <rect x="528" y="14" width="338" height="472" rx="14" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.4" />

  <!-- ============================================================
       LIJEVI PANEL — FIZIKALNI MODEL
       Geometrija (referentne y koordinate):
         y=70   horizont neba / vrh brane (kruna)
         y=92   slobodna povrsina vode (tocka 1)
         y=372  os propusta (tocka 2)  -> H = 280 px (= 8,50 m)
         y=352  vrh propusta (otvor radius 20 px ≈ d=0,40 m)
         y=392  dno propusta
         y=440  povrsina tla
         x=44   lijevi rub rezervoara (uzvodna strana)
         x=300  uzvodno lice brane
         x=370  nizvodno lice brane
         x=514  desni rub panela
       Skala: 1 m ≈ 33 px (H=8,50 m -> 280 px), d=0,40 m -> ~13 px na vertikali; cijev nacrtana dijagramskom debljinom 40 px za citljivost (s komentarom u tekstu).
  ============================================================ -->
  <!-- nebo (neutralna pozadina) -->
  <rect x="20" y="22" width="488" height="418" fill="#f3f7fb" />

  <!-- TLO (pozadina, podloga brane) -->
  <rect x="20" y="430" width="488" height="50" fill="url(#u09fpb_tlo)" stroke="#a78b5a" stroke-width="0.8" />

  <!-- BRANA (betonska, hatched) — trapezni presjek -->
  <polygon points="300,70 370,70 392,440 278,440" fill="url(#u09fpb_beton)" stroke="#3a4a56" stroke-width="1.6" />

  <!-- ============================================================
       VODA U REZERVOARU (uzvodno od brane)
       Kontinuirano povezana s mlazom kroz tijelo brane (kroz propust)
  ============================================================ -->
  <rect x="44" y="92" width="256" height="348" fill="url(#u09fpb_voda)" />
  <!-- Slobodna povrsina -->
  <line x1="44" y1="92" x2="300" y2="92" stroke="#1565c0" stroke-width="2.2" />
  <!-- Mali "valovi" na povrsini (suptilno) -->
  <path d="M60,90 q8,-4 16,0 t16,0 t16,0 t16,0 t16,0 t16,0 t16,0 t16,0 t16,0 t16,0 t16,0 t16,0 t16,0 t16,0 t16,0" fill="none" stroke="#1565c0" stroke-width="0.7" opacity="0.5" />

  <!-- ============================================================
       PROPUST — cilindricna cijev kroz branu
       Os na y=372. Visina otvora 40 px (dijagramski).
  ============================================================ -->
  <!-- voda u propustu (povezuje rezervoar i mlaz) -->
  <rect x="300" y="352" width="92" height="40" fill="url(#u09fpb_voda)" />
  <!-- gornja i donja stijenka propusta (kroz tijelo brane) -->
  <line x1="300" y1="352" x2="392" y2="352" stroke="#3a4a56" stroke-width="1.4" />
  <line x1="300" y1="392" x2="392" y2="392" stroke="#3a4a56" stroke-width="1.4" />

  <!-- IZLAZNI MLAZ — pravac uz blagi pad zbog mlaza, ali pretezno horizontalan -->
  <path d="M392,352 L490,358 L490,386 L392,392 Z" fill="url(#u09fpb_mlaz)" stroke="#1565c0" stroke-width="1.4" opacity="0.9" />
  <!-- raspad mlaza u kapljice (dekorativno, kratke crtice) -->
  <circle cx="496" cy="362" r="1.6" fill="#5b9ec9" />
  <circle cx="502" cy="372" r="1.4" fill="#5b9ec9" />
  <circle cx="498" cy="382" r="1.6" fill="#5b9ec9" />

  <!-- ============================================================
       TOCKE 1 i 2 — referentne tocke Bernoullija
  ============================================================ -->
  <!-- Tocka 1 na slobodnoj povrsini -->
  <circle cx="160" cy="92" r="6" fill="#ffffff" stroke="#c0392b" stroke-width="2" />
  <!-- Tocka 2 u presjeku izlaza propusta (os, na nizvodnom licu brane) -->
  <circle cx="392" cy="372" r="5" fill="#ffffff" stroke="#c0392b" stroke-width="2" />
  <!-- ============================================================
       ATMOSFERSKE TLACNE STRELICE
  ============================================================ -->
  <!-- na slobodnoj povrsini (3 male strelice prema dolje) -->
  <line x1="80" y1="74" x2="80" y2="88" stroke="#1565c0" stroke-width="1.4" marker-end="url(#u09fpb_ap)" />
  <line x1="120" y1="74" x2="120" y2="88" stroke="#1565c0" stroke-width="1.4" marker-end="url(#u09fpb_ap)" />
  <line x1="200" y1="74" x2="200" y2="88" stroke="#1565c0" stroke-width="1.4" marker-end="url(#u09fpb_ap)" />
  <line x1="240" y1="74" x2="240" y2="88" stroke="#1565c0" stroke-width="1.4" marker-end="url(#u09fpb_ap)" />
  <line x1="280" y1="74" x2="280" y2="88" stroke="#1565c0" stroke-width="1.4" marker-end="url(#u09fpb_ap)" />
  <!-- ============================================================
       BRZINA v NA IZLAZU — proporcionalna strelica
       Vodoravna, prema desno; duzina ≈ 78 px (vidljivo, citljivo)
  ============================================================ -->
  <line x1="404" y1="372" x2="482" y2="372" stroke="#1e8449" stroke-width="3" marker-end="url(#u09fpb_av)" />
  <!-- ============================================================
       KOTA H — vertikalna, od slobodne povrsine do osi propusta
       Pomocne linije: od povrsine (y=92) i od osi propusta (y=372) prema lijevo
       Dim os: x=28 (lijevo od rezervoara)
  ============================================================ -->
  <!-- isprekidana referentna linija osi propusta unutar rezervoara (suptilno) -->
  <line x1="44" y1="372" x2="300" y2="372" stroke="#7a8a96" stroke-width="0.8" stroke-dasharray="5,4" opacity="0.6" />
  <!-- dim linija -->
  <!-- tik-crte -->
  <!-- label H -->
  <!-- ============================================================
       KOTA d — vertikalna na desnoj strani brane (otvor propusta)
       Pomocne linije: od y=352 i y=392 prema desno do x=510
  ============================================================ -->
  <!-- ============================================================
       OZNAKE: voda, brana, tlo (legende u prostoru)
  ============================================================ -->
  <!-- Komentar o promjeru u skici -->
  <!-- ============================================================
       DESNI PANEL — FORMULE + REZULTATI
       Sirina: x=528..866 (338 px), centar x_c = 697
  ============================================================ -->
  <!-- Header bar -->
  <rect x="528" y="14" width="338" height="34" rx="14" fill="#1565c0" />
  <rect x="528" y="32" width="338" height="16" fill="#1565c0" />
  <!-- Blok 1: Bernoulli (y=56..134) -->
  <line x1="552" y1="138" x2="842" y2="138" stroke="#c8d6e4" stroke-width="1" />

  <!-- Blok 2: Torricelli (y=138..220) -->
  <line x1="552" y1="234" x2="842" y2="234" stroke="#c8d6e4" stroke-width="1" />

  <!-- Blok 3: Povrsina presjeka A (y=234..302) -->
  <line x1="552" y1="312" x2="842" y2="312" stroke="#c8d6e4" stroke-width="1" />

  <!-- Blok 4: Q (y=312..390) -->
  <line x1="552" y1="396" x2="842" y2="396" stroke="#c8d6e4" stroke-width="1" />

  <!-- Sazetak (italic) -->
  <!-- REZULTATI badge -->
  <rect x="538" y="440" width="318" height="40" rx="8" fill="#e8f5e9" stroke="#1e8449" stroke-width="1.4" />
  <line x1="44" y1="92" x2="28" y2="92" stroke="#b7600c" stroke-width="0.7" />
  <line x1="44" y1="372" x2="28" y2="372" stroke="#b7600c" stroke-width="0.7" stroke-dasharray="3,3" />
  <line x1="28" y1="96" x2="28" y2="368" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u09fpb_dimL)" marker-end="url(#u09fpb_dim)" />
  <line x1="24" y1="92" x2="32" y2="92" stroke="#b7600c" stroke-width="1.2" />
  <line x1="24" y1="372" x2="32" y2="372" stroke="#b7600c" stroke-width="1.2" />
  <line x1="394" y1="352" x2="510" y2="352" stroke="#b7600c" stroke-width="0.7" />
  <line x1="394" y1="392" x2="510" y2="392" stroke="#b7600c" stroke-width="0.7" />
  <line x1="500" y1="354" x2="500" y2="390" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u09fpb_dimL)" marker-end="url(#u09fpb_dim)" />
  <line x1="496" y1="352" x2="504" y2="352" stroke="#b7600c" stroke-width="1.2" />
  <line x1="496" y1="392" x2="504" y2="392" stroke="#b7600c" stroke-width="1.2" />
  <text x="160" y="96" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#c0392b">1</text>
  <text x="172" y="106" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#0d47a1">v<tspan baseline-shift="sub" font-size="0.75em">1</tspan> ≈ 0</text>

  <text x="392" y="376" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#c0392b">2</text>
  <text x="402" y="346" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#1565c0">p<tspan baseline-shift="sub" font-size="0.75em">atm</tspan></text>

  <text x="148" y="68" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#1565c0">p<tspan baseline-shift="sub" font-size="0.75em">atm</tspan> (atmosfera)</text>

  <text x="442" y="364" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" text-anchor="middle" fill="#1e8449"><tspan font-weight="700">v</tspan> ≈ 12,91 m/s</text>

  <text x="172" y="240" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#0d47a1">voda (rezervoar)</text>
  <text x="335" y="246" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#3a4a56" transform="rotate(86 335 246)">brana</text>
  <text x="60" y="466" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#7a5a2a">tlo</text>

  <text x="266" y="475" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#5a6a78">otvor propusta i mlaz prikazani simbolicki uvecano radi citljivosti</text>

  <text x="697" y="36" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Bernoulli (1 → 2): idealan fluid</text>

  <text x="697" y="74" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Polazna jednadzba (tocke 1 i 2)</text>
  <text x="697" y="98" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530">p<tspan baseline-shift="sub" font-size="0.7em">atm</tspan>/(ρg) + 0 + H</text>
  <text x="697" y="118" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530">= p<tspan baseline-shift="sub" font-size="0.7em">atm</tspan>/(ρg) + v²/(2g) + 0</text>
  <text x="697" y="158" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Torricellijeva brzina istjecanja</text>
  <text x="697" y="182" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">v</tspan> = √(2gH)</text>
  <text x="697" y="202" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1a2530">= √(2·9,81·8,50) = √166,77</text>
  <text x="697" y="220" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1e8449">≈ 12,91 m/s</text>
  <text x="697" y="254" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Povrsina presjeka propusta</text>
  <text x="697" y="278" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">A</tspan> = πd²/4 = π·0,40²/4</text>
  <text x="697" y="298" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">≈ 0,1257 m²</text>
  <text x="697" y="332" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Volumenski protok</text>
  <text x="697" y="356" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">Q</tspan> = <tspan font-style="italic">A</tspan>·<tspan font-style="italic">v</tspan> = 0,1257·12,91</text>
  <text x="697" y="378" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1e8449">≈ 1,622 m³/s</text>
  <text x="697" y="416" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">Atmosfera s obje strane → p-clanovi se ponistavaju</text>
  <text x="697" y="430" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">brzina ovisi samo o visini stupca H</text>

  <text x="697" y="455" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#5a6a78">REZULTATI (idealni model)</text>
  <text x="618" y="473" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1e8449"><tspan font-style="italic">v</tspan> ≈ 12,91 m/s</text>
  <text x="776" y="473" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1e8449"><tspan font-style="italic">Q</tspan> ≈ 1,622 m³/s</text>
<text x="20" y="226" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#b7600c" transform="rotate(-90 20 226)"><tspan font-style="italic">H</tspan> = 8,50 m</text>

  <text x="494" y="416" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">d</tspan> = 0,40 m</text>

  </svg>