<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" role="img"
     aria-labelledby="u5v2T u5v2D" preserveAspectRatio="xMidYMid meet"
     style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u5v2T">U05 Val 2 – Vertikalna stijenka s tri vodoravne ukrute</title>
  <desc id="u5v2D">b=1,20 m, H=2,40 m, voda ρ=998 kg/m³. Četiri jednako opterećena polja: y₁=1,20 m, y₂=1,70 m, y₃=2,08 m. F_p≈8,46 kN po polju; y_CP,4=2,244 m.</desc>
  <defs>
    <marker id="u5v2aR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#c0392b"/>
    </marker>
    <marker id="u5v2aDim" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#c96c35"/>
    </marker>
    <marker id="u5v2aDimL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L0,8 L8,4 z" fill="#c96c35"/>
    </marker>
    <linearGradient id="u5v2fl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8e8f6"/><stop offset="100%" stop-color="#5baece"/>
    </linearGradient>
    <linearGradient id="u5v2pr" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#e74c3c" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#e74c3c" stop-opacity="0.06"/>
    </linearGradient>
    <pattern id="u5v2wall" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.8"/>
    </pattern>
  </defs>

  <rect width="940" height="420" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="372" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>

  <!-- Naslov -->
  <text x="54" y="62" font-family="'Segoe UI',Arial,sans-serif" font-size="21" font-weight="700" fill="#173043">U05 Val 2 – Vertikalna stijenka s tri vodoravne ukrute</text>
  <text x="54" y="87" font-family="'Segoe UI',Arial,sans-serif" font-size="14.5" fill="#516677">b = 1,20 m · H = 2,40 m · ρ = 998 kg/m³ → četiri jednaka polja, F_p ≈ 8,46 kN po polju</text>

  <!-- Mjerilo: 100 px/m; slobodna površina y=115; dno y=355 -->

  <!-- Tijelo fluida -->
  <rect x="82" y="115" width="186" height="243" fill="url(#u5v2fl)" opacity="0.85"/>

  <!-- Lijeva stijenka rezervoara (tanka) -->
  <rect x="80" y="108" width="4" height="255" fill="#909fa8"/>

  <!-- Dno rezervoara -->
  <rect x="80" y="356" width="194" height="8" fill="#909fa8" stroke="#5d6d7e" stroke-width="1"/>

  <!-- Slobodna površina -->
  <line x1="80" y1="115" x2="272" y2="115" stroke="#1565c0" stroke-width="2.8"/>
  <text x="84" y="108" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1565c0">slobodna površina  (p = 0)</text>

  <!-- Stijenka s hatching -->
  <rect x="268" y="100" width="42" height="268" fill="#909fa8" stroke="#5d6d7e" stroke-width="1.8"/>
  <rect x="268" y="100" width="42" height="268" fill="url(#u5v2wall)" opacity="0.50"/>

  <!-- Dijagram tlaka (trokut na lijevoj stijenci x=268) -->
  <!-- Max width 72 px pri dnu (H=2,40m): skala 72/240=0,3 px/px no — scale=30px/m -->
  <!-- At y=355: width=72px → (268-72,355)=(196,355) -->
  <polygon points="268,115 196,355 268,355" fill="url(#u5v2pr)"/>
  <line x1="268" y1="115" x2="196" y2="355" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="192" y="368" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#c0392b" text-anchor="end">p_max = ρgH</text>

  <!-- Vodoravne linije pri ukrutama (dijele trokut na 4 jednakapovršinska polja) -->
  <!-- y₁=1,20m→y=235; y₂=1,70m→y=285; y₃=2,08m→y=323 -->
  <!-- Širine trokuta pri tim dubinama: w(y) = 72*(y-115)/240 -->
  <!-- w(235)=72*120/240=36px; w(285)=72*170/240=51px; w(323)=72*208/240=62px -->
  <line x1="268" y1="235" x2="232" y2="235" stroke="white" stroke-width="2.0" stroke-dasharray="8,5" opacity="0.90"/>
  <line x1="268" y1="285" x2="217" y2="285" stroke="white" stroke-width="2.0" stroke-dasharray="8,5" opacity="0.90"/>
  <line x1="268" y1="323" x2="206" y2="323" stroke="white" stroke-width="2.0" stroke-dasharray="8,5" opacity="0.90"/>

  <!-- Ukrute (strukturni pojasevi) – žuto-smeđe vodoravne ploče -->
  <rect x="252" y="231" width="58" height="8" fill="#c8a84a" stroke="#8b6914" stroke-width="1.4"/>
  <rect x="252" y="281" width="58" height="8" fill="#c8a84a" stroke="#8b6914" stroke-width="1.4"/>
  <rect x="252" y="319" width="58" height="8" fill="#c8a84a" stroke="#8b6914" stroke-width="1.4"/>

  <!-- Oznake polja unutar dijagrama tlaka -->
  <!-- Dubine sredina polja: F₁→(115+235)/2=175; F₂→(235+285)/2=260; F₃→(285+323)/2=304; F₄→(323+355)/2=339 -->
  <text x="263" y="179" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#c0392b" text-anchor="end">F₁</text>
  <text x="263" y="264" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#c0392b" text-anchor="end">F₂</text>
  <text x="263" y="308" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#c0392b" text-anchor="end">F₃</text>
  <text x="263" y="343" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#c0392b" text-anchor="end">F₄</text>

  <!-- y_CP,4 = 2,244m → y = 115+224 = 339; unutar polja 4 (323..355) -->
  <circle cx="268" cy="339" r="5.5" fill="#c0392b" stroke="white" stroke-width="1.5"/>
  <line x1="268" y1="339" x2="320" y2="339" stroke="#c0392b" stroke-width="0.9" stroke-dasharray="3,3"/>
  <text x="323" y="343" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#c0392b">CP₄</text>

  <!-- Kota H (desno od stijenke) -->
  <line x1="310" y1="115" x2="336" y2="115" stroke="#c96c35" stroke-width="1.0"/>
  <line x1="310" y1="355" x2="336" y2="355" stroke="#c96c35" stroke-width="1.0"/>
  <line x1="333" y1="117" x2="333" y2="353" stroke="#c96c35" stroke-width="1.8"
        marker-start="url(#u5v2aDimL)" marker-end="url(#u5v2aDim)"/>
  <text x="340" y="241" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#92400e" font-style="italic">H = 2,40 m</text>

  <!-- Tick oznake na koti H za y₁,y₂,y₃ -->
  <line x1="326" y1="235" x2="338" y2="235" stroke="#c96c35" stroke-width="1.2"/>
  <line x1="326" y1="285" x2="338" y2="285" stroke="#c96c35" stroke-width="1.2"/>
  <line x1="326" y1="323" x2="338" y2="323" stroke="#c96c35" stroke-width="1.2"/>

  <!-- Labele za y₁,y₂,y₃ desno od kote -->
  <text x="342" y="238" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#92400e">y₁ = 1,20 m</text>
  <text x="342" y="288" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#92400e">y₂ = 1,70 m</text>
  <text x="342" y="326" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#92400e">y₃ = 2,08 m</text>

  <!-- Kutija rješenja (desno) -->
  <rect x="430" y="108" width="478" height="282" rx="10" fill="#f8fafc" stroke="#cbd5e0" stroke-width="1.8"/>

  <text x="448" y="133" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1a2530">Projektni kriterij: F₁ = F₂ = F₃ = F₄ = F_uk / 4</text>
  <line x1="448" y1="141" x2="894" y2="141" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Ukupna sila i F_p -->
  <text x="448" y="160" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">F_uk = ½ρgbH² = ½·998·9,81·1,20·2,40² = 33 836 N</text>
  <text x="448" y="179" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#c0392b">F_p = F_uk / 4 = 33 836 / 4 ≈ 8 459 N ≈ 8,46 kN</text>
  <line x1="448" y1="187" x2="894" y2="187" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Položaji ukruta -->
  <text x="448" y="207" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">Iz uvjeta jednakih polja:  y_i² = i · H²/4</text>
  <text x="448" y="227" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">y₁ = H/2         = 1,200 m</text>
  <text x="448" y="246" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">y₂ = H/√2        = 1,697 m  ≈ 1,70 m</text>
  <text x="448" y="265" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">y₃ = H·√3/2      = 2,078 m  ≈ 2,08 m</text>
  <line x1="448" y1="273" x2="894" y2="273" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Hvatište 4. polja -->
  <text x="448" y="292" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">Hvatište 4. polja:</text>
  <text x="448" y="311" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">y_CP,4 = 2·(H³−y₃³) / [3·(H²−y₃²)] = 2,244 m</text>
  <text x="448" y="330" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#516677">(tj. 0,16 m iznad dna — ukruta D mora biti viša od ovog mjesta)</text>
  <line x1="448" y1="338" x2="894" y2="338" stroke="#e2e8f0" stroke-width="1"/>
  <text x="448" y="356" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#516677">Ukrute su gušće pri dnu jer tlak raste s dubinom. Gornji razmak (y₁=H/2)</text>
  <text x="448" y="373" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#516677">je znatno veći od donjeg razmaka (y₃→H = 2,08→2,40 m).</text>

  <!-- Napomena na dnu -->
  <text x="54" y="403" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#516677">Bijele iscrtkane linije u dijagramu tlaka dijele trokut na 4 zone jednakih površina — svaka nosi isti udio ukupne hidrostatske sile F_uk.</text>
</svg>