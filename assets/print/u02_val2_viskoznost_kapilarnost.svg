<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 387" role="img" aria-labelledby="u02v2vk_title u02v2vk_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:450px;height:auto;">
  <title id="u02v2vk_title">Smično naprezanje u tankom uljnom sloju</title>
  <desc id="u02v2vk_desc">Ulje između nepomične donje i pokretne gornje ploče. Linearni profil poštuje prianjanje na obje ploče. Vučna sila i otpor ulja djeluju na gornju ploču; osnovne relacije povezuju gradijent brzine, naprezanje i silu.</desc>
