    <marker id="u02v2vk_v2aD" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#b7600c" />
    </marker>
    <marker id="u02v2vk_v2aDR" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto-start-reverse">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#b7600c" />
    </marker>
    <marker id="u02v2vk_v2aG" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#3a3a3a" />
    </marker>
    <marker id="u02v2vk_v2aGR" markerWidth="10" markerHeight="10" refX="1" refY="3.5" orient="auto-start-reverse">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#3a3a3a" />
    </marker>
    <marker id="u02v2vk_v2aSig" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
