  <line x1="248" y1="148" x2="238" y2="158" stroke="#6a7a86" stroke-width="1.2" />
  <line x1="268" y1="148" x2="258" y2="158" stroke="#6a7a86" stroke-width="1.2" />
  <line x1="288" y1="148" x2="278" y2="158" stroke="#6a7a86" stroke-width="1.2" />
  <line x1="308" y1="148" x2="298" y2="158" stroke="#6a7a86" stroke-width="1.2" />
  <line x1="328" y1="148" x2="318" y2="158" stroke="#6a7a86" stroke-width="1.2" />
  <line x1="348" y1="148" x2="338" y2="158" stroke="#6a7a86" stroke-width="1.2" />
  <line x1="368" y1="148" x2="358" y2="158" stroke="#6a7a86" stroke-width="1.2" />
  <line x1="388" y1="148" x2="378" y2="158" stroke="#6a7a86" stroke-width="1.2" />
  <line x1="408" y1="148" x2="398" y2="158" stroke="#6a7a86" stroke-width="1.2" />

  <!-- v strelica iznad gornje ploče (desni dio, da ne preklapa naslov) -->
  <line x1="244" y1="119" x2="330" y2="119" stroke="#1565c0" stroke-width="3.5" marker-end="url(#u02v2vk_v2aV)" />
  <!-- fluid zona: y=150..290 -->
  <rect x="68" y="150" width="352" height="140" fill="url(#u02v2vk_v2fl)" stroke="none" />

  <!-- profil brzine (trokutni linearni profil) -->
  <!-- os nulte brzine -->
  <line x1="68" y1="150" x2="68" y2="290" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4 3" />
  <!-- linija profila -->
  <line x1="68" y1="290" x2="352" y2="150" stroke="#0d47a1" stroke-width="2.5" />
  <!-- trokutna ispuna profila -->
  <polygon points="68,150 68,290 352,150" fill="#1565c0" fill-opacity="0.12" />

  <!-- strelice brzine u fluidu (6 slojeva) -->
  <line x1="68" y1="267" x2="117" y2="267" stroke="#1565c0" stroke-width="2" marker-end="url(#u02v2vk_v2aV)" />
  <line x1="68" y1="244" x2="164" y2="244" stroke="#1565c0" stroke-width="2" marker-end="url(#u02v2vk_v2aV)" />
  <line x1="68" y1="221" x2="211" y2="221" stroke="#1565c0" stroke-width="2" marker-end="url(#u02v2vk_v2aV)" />
  <line x1="68" y1="198" x2="258" y2="198" stroke="#1565c0" stroke-width="2" marker-end="url(#u02v2vk_v2aV)" />
  <line x1="68" y1="175" x2="305" y2="175" stroke="#1565c0" stroke-width="2" marker-end="url(#u02v2vk_v2aV)" />
  <!-- u(y) labela -->
  <!-- τ strelica horizontalno (smično naprezanje) -->
  <line x1="362" y1="220" x2="426" y2="220" stroke="#1e8449" stroke-width="4" marker-end="url(#u02v2vk_v2aT)" />
  <!-- donja ploča (nepomična): y=290..310 x=68..420 -->
  <rect x="68" y="290" width="352" height="22" rx="4" fill="url(#u02v2vk_v2pl)" stroke="#4a5a66" stroke-width="2" />
  <!-- hatching donje ploče (dolje lijevo) -->
  <line x1="88" y1="290" x2="78" y2="300" stroke="#6a7a86" stroke-width="1.2" />
  <line x1="108" y1="290" x2="98" y2="300" stroke="#6a7a86" stroke-width="1.2" />
  <line x1="128" y1="290" x2="118" y2="300" stroke="#6a7a86" stroke-width="1.2" />
  <line x1="148" y1="290" x2="138" y2="300" stroke="#6a7a86" stroke-width="1.2" />
  <line x1="168" y1="290" x2="158" y2="300" stroke="#6a7a86" stroke-width="1.2" />
  <line x1="188" y1="290" x2="178" y2="300" stroke="#6a7a86" stroke-width="1.2" />
  <line x1="208" y1="290" x2="198" y2="300" stroke="#6a7a86" stroke-width="1.2" />
  <line x1="228" y1="290" x2="218" y2="300" stroke="#6a7a86" stroke-width="1.2" />
  <line x1="248" y1="290" x2="238" y2="300" stroke="#6a7a86" stroke-width="1.2" />
  <line x1="268" y1="290" x2="258" y2="300" stroke="#6a7a86" stroke-width="1.2" />
  <line x1="288" y1="290" x2="278" y2="300" stroke="#6a7a86" stroke-width="1.2" />
  <line x1="308" y1="290" x2="298" y2="300" stroke="#6a7a86" stroke-width="1.2" />
  <line x1="328" y1="290" x2="318" y2="300" stroke="#6a7a86" stroke-width="1.2" />
  <line x1="348" y1="290" x2="338" y2="300" stroke="#6a7a86" stroke-width="1.2" />
  <line x1="368" y1="290" x2="358" y2="300" stroke="#6a7a86" stroke-width="1.2" />
  <line x1="388" y1="290" x2="378" y2="300" stroke="#6a7a86" stroke-width="1.2" />
  <line x1="408" y1="290" x2="398" y2="300" stroke="#6a7a86" stroke-width="1.2" />

  <!-- labele ploča (unutar panela, kratko) -->
  <!-- δ kota: lijevo, x=46, y=150..290 -->
  <!-- formula box -->
  <rect x="56" y="322" width="408" height="76" rx="10" fill="#eaf4fb" stroke="#1565c0" stroke-width="1.5" />
  <!-- divider -->
  <line x1="490" y1="88" x2="490" y2="402" stroke="#d0d8e4" stroke-width="1.8" stroke-dasharray="6 4" />

  <!-- === DESNI PANEL: kapilarni uspon x=504..944 === -->
  <rect x="504" y="90" width="436" height="320" rx="12" fill="#f8fafc" stroke="#d0d8e4" stroke-width="1.6" />
  <!-- posuda: x=520..700, y=200..370 -->
  <rect x="520" y="200" width="180" height="170" rx="4" fill="none" stroke="#5a6a76" stroke-width="2.5" />
  <!-- tekućina u posudi -->
  <rect x="522" y="258" width="176" height="110" fill="url(#u02v2vk_v2flCap)" opacity="0.9" />
  <!-- razina u posudi -->
  <line x1="522" y1="258" x2="700" y2="258" stroke="#1565c0" stroke-width="2.5" />
  <!-- kapilara: stijenke x=616..628 i x=652..664; od y=130 do y=370 -->
  <!-- lijeva stijenka kapilare -->
  <rect x="614" y="130" width="14" height="240" fill="none" stroke="#5a6a76" stroke-width="2.5" />
  <!-- desna stijenka kapilare -->
  <rect x="650" y="130" width="14" height="240" fill="none" stroke="#5a6a76" stroke-width="2.5" />
  <!-- tekućina u kapilari (uspon do y=194 ≈ 64px iznad razine=258, h≈10.8mm→plot scale~64px) -->
  <rect x="628" y="194" width="22" height="64" fill="#aed6f1" opacity="0.95" />
  <!-- tekućina u kapilari unutar posude -->
  <rect x="628" y="258" width="22" height="112" fill="#5b9ec9" opacity="0.95" />
  <!-- meniskus konkavan gore: θ=18° → blago zakrivljen -->
  <path d="M628,196 Q639,183 650,196" fill="#aed6f1" stroke="#1565c0" stroke-width="2.2" />
  <!-- iscrtkana linija razine -->
  <line x1="528" y1="258" x2="615" y2="258" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4 3" />
  <line x1="663" y1="258" x2="698" y2="258" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- σ strelice na meniskusu (površinska napetost) -->
  <line x1="618" y1="196" x2="604" y2="180" stroke="#1565c0" stroke-width="2.2" marker-end="url(#u02v2vk_v2aSig)" />
  <line x1="650" y1="196" x2="664" y2="180" stroke="#1565c0" stroke-width="2.2" marker-end="url(#u02v2vk_v2aSig)" />
  <!-- θ kut oznaka -->
  <!-- h kota: desno, x=678, od y=194 do y=258 -->
  <!-- d kota: iznad cijevi, ext linije od y=130 (vrh stijenki) do y=126 -->
  <!-- formula box desno -->
  <rect x="520" y="322" width="408" height="76" rx="10" fill="#eaf4fb" stroke="#1565c0" stroke-width="1.5" />
  <line x1="46" y1="150" x2="46" y2="290" stroke="#b7600c" stroke-width="2" marker-start="url(#u02v2vk_v2aDR)" marker-end="url(#u02v2vk_v2aD)" />
  <line x1="672" y1="194" x2="672" y2="258" stroke="#b7600c" stroke-width="2" marker-start="url(#u02v2vk_v2aDR)" marker-end="url(#u02v2vk_v2aD)" />
  <line x1="628" y1="130" x2="628" y2="126" stroke="#b7600c" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="650" y1="130" x2="650" y2="126" stroke="#b7600c" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="628" y1="126" x2="650" y2="126" stroke="#b7600c" stroke-width="1.8" marker-start="url(#u02v2vk_v2aDR)" marker-end="url(#u02v2vk_v2aD)" />
  <text x="56" y="114" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Smicanje između paralelnih ploča</text>

  <text x="336" y="123" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#1565c0"><tspan font-weight="700">v</tspan> = 0,90 m/s</text>

  <text x="76" y="236" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#0d47a1">u(y)</text>

  <text x="432" y="225" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-style="italic" fill="#1e8449">τ</text>

  <text x="414" y="143" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="end" fill="#5a6a78">pomična</text>
  <text x="414" y="305" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="end" fill="#5a6a78">nepomična</text>

  <text x="72" y="343" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#3a5a78">Newtonov zakon viskoznosti:</text>
  <text x="72" y="366" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#1a2530">τ = μ · dv/dy = μ · v/δ = 0,42 · 300 = 126 Pa</text>
  <text x="72" y="387" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#3a5a78">F = τ · A = 126 · 0,18 ≈ 22,7 N · ν = μ/ρ = 4,83·10⁻⁴ m²/s</text>

  <text x="522" y="114" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Kapilarni uspon etanola u staklenoj kapilari</text>

  <text x="528" y="252" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1565c0">slobodna površina</text>
  <text x="565" y="300" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#0d47a1">etanol</text>
  <text x="528" y="340" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a2530">ρ = 790 kg/m³</text>
  <text x="528" y="356" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a2530">σ = 0,022 N/m</text>

  <text x="639" y="174" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" text-anchor="middle" fill="#1565c0">σ</text>

  <text x="602" y="197" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1565c0" text-anchor="end">θ=18°</text>

  <text x="536" y="343" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#3a5a78">Kapilarni uspon (ravnoteža σ i težine stupca):</text>
  <text x="536" y="366" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#1a2530">h = 4σ cosθ / (ρgd)</text>
  <text x="536" y="387" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#3a5a78">= 4·0,022·0,951 / (790·9,81·0,001) ≈ 10,8 mm</text>
<text x="52" y="225" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-style="italic" font-weight="700" fill="#b7600c">δ</text>
  <text x="52.0" y="241.0" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#b7600c">= 3 mm</text>

  <text x="679" y="228" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-style="italic" font-weight="700" fill="#b7600c">h</text>
  <text x="679.0" y="244.0" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#b7600c">= 10,8 mm</text>

  <text x="620" y="130" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" text-anchor="end" fill="#b7600c">d</text>
  <text x="670" y="130" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#b7600c">= 1,0 mm</text>

  </svg>