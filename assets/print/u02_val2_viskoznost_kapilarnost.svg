<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" role="img" aria-labelledby="u02v2vk_v2t u02v2vk_v2d" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="u02v2vk_v2t">U02 Val 2 – Smicanje između ploča i kapilarni uspon</title>
  <desc id="u02v2vk_v2d">Lijevo: Newtonov fluid između dviju paralelnih ploča – linearni profil brzine, τ = μ·v/δ, F = τ·A. Desno: kapilarni uspon etanola u staklenoj kapilari, h = 4σcosθ/(ρgd).</desc>

  <defs>
    <linearGradient id="u02v2vk_v2fl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aed6f1" />
      <stop offset="100%" stop-color="#5b9ec9" />
    </linearGradient>
    <linearGradient id="u02v2vk_v2flCap" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#5b9ec9" />
      <stop offset="100%" stop-color="#aed6f1" />
    </linearGradient>
    <linearGradient id="u02v2vk_v2pl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#909fa8" />
      <stop offset="100%" stop-color="#5d6d7e" />
    </linearGradient>
    <!-- arrows -->
    <marker id="u02v2vk_v2aV" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#1565c0" />
    </marker>
    <marker id="u02v2vk_v2aT" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
