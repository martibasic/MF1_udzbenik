  <title id="u02v2vk_title">Smicanje ulja i odvojeni kapilarni pokus</title>
  <desc id="u02v2vk_desc">Lijevo uljni sloj 3 mm, brzina 0,90 m/s, sila otpora na pokretnoj ploči ulijevo. Desno odvojeni etanol u kapilari 1 mm s kontaktnim kutom 18 stupnjeva, otvorenim ulazom i usponom 10,8 mm.</desc>
