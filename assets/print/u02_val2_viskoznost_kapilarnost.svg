<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" role="img"
     aria-labelledby="v2t v2d" preserveAspectRatio="xMidYMid meet"
     style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="v2t">U02 Val 2 – Smicanje između ploča i kapilarni uspon</title>
  <desc id="v2d">Lijevo: Newtonov fluid između dviju paralelnih ploča – linearni profil brzine, τ = μ·v/δ, F = τ·A. Desno: kapilarni uspon etanola u staklenoj kapilari, h = 4σcosθ/(ρgd).</desc>

  <defs>
    <linearGradient id="v2fl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aed6f1"/>
      <stop offset="100%" stop-color="#7fb3d3"/>
    </linearGradient>
    <linearGradient id="v2flCap" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7fb3d3"/>
      <stop offset="100%" stop-color="#aed6f1"/>
    </linearGradient>
    <linearGradient id="v2pl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#909fa8"/>
      <stop offset="100%" stop-color="#5d6d7e"/>
    </linearGradient>
    <!-- arrows -->
    <marker id="v2aV" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#1565c0"/>
    </marker>
    <marker id="v2aT" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#1e8449"/>
    </marker>
    <marker id="v2aD" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#b7600c"/>
    </marker>
    <marker id="v2aDR" markerWidth="10" markerHeight="10" refX="1" refY="3.5" orient="auto-start-reverse">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#b7600c"/>
    </marker>
    <marker id="v2aG" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#3a3a3a"/>
    </marker>
    <marker id="v2aGR" markerWidth="10" markerHeight="10" refX="1" refY="3.5" orient="auto-start-reverse">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#3a3a3a"/>
    </marker>
    <marker id="v2aSig" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#c0392b"/>
    </marker>
    <marker id="v2aSigR" markerWidth="10" markerHeight="10" refX="1" refY="3.5" orient="auto-start-reverse">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="980" height="440" fill="#f4f6f8"/>
  <rect x="18" y="18" width="944" height="404" rx="14" fill="#ffffff" stroke="#d0d6de" stroke-width="2"/>

  <!-- header -->
  <text x="48" y="52" font-family="'Segoe UI',Arial,sans-serif" font-size="21" font-weight="700" fill="#1a2530">U02 – Smicanje između ploča i kapilarni uspon</text>
  <text x="48" y="73" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#5a6a78">Lijevo: Newtonov fluid δ=3 mm, v=0,90 m/s, μ=0,42 Pa·s → τ=126 Pa, F≈22,7 N · Desno: etanol d=1,0 mm, θ=18°, h≈10,8 mm</text>

  <!-- === LIJEVI PANEL: smicanje x=38..474 === -->
  <rect x="38" y="90" width="436" height="320" rx="12" fill="#f8fafc" stroke="#d0d8e4" stroke-width="1.6"/>

  <!-- panel title -->
  <text x="56" y="114" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Smicanje između paralelnih ploča</text>

  <!-- gornja ploča (pomična): y=128..148 x=68..420 -->
  <rect x="68" y="128" width="352" height="22" rx="4" fill="url(#v2pl)" stroke="#4a5a66" stroke-width="2"/>
  <!-- hatching gornje ploče -->
  <line x1="88"  y1="148" x2="78"  y2="158" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="108" y1="148" x2="98"  y2="158" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="128" y1="148" x2="118" y2="158" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="148" y1="148" x2="138" y2="158" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="168" y1="148" x2="158" y2="158" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="188" y1="148" x2="178" y2="158" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="208" y1="148" x2="198" y2="158" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="228" y1="148" x2="218" y2="158" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="248" y1="148" x2="238" y2="158" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="268" y1="148" x2="258" y2="158" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="288" y1="148" x2="278" y2="158" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="308" y1="148" x2="298" y2="158" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="328" y1="148" x2="318" y2="158" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="348" y1="148" x2="338" y2="158" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="368" y1="148" x2="358" y2="158" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="388" y1="148" x2="378" y2="158" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="408" y1="148" x2="398" y2="158" stroke="#6a7a86" stroke-width="1.2"/>

  <!-- v strelica iznad gornje ploče -->
  <line x1="130" y1="116" x2="260" y2="116" stroke="#1565c0" stroke-width="3.5" marker-end="url(#v2aV)"/>
  <text x="118" y="112" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-style="italic" font-weight="700" fill="#1565c0">v</text>
  <text x="272" y="112" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1565c0">= 0,90 m/s</text>

  <!-- fluid zona: y=150..290 -->
  <rect x="68" y="150" width="352" height="140" fill="url(#v2fl)" stroke="none"/>

  <!-- profil brzine (trokutni linearni profil) -->
  <!-- os nulte brzine -->
  <line x1="68" y1="150" x2="68" y2="290" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- linija profila -->
  <line x1="68" y1="290" x2="352" y2="150" stroke="#0d47a1" stroke-width="2.5"/>
  <!-- trokutna ispuna profila -->
  <polygon points="68,150 68,290 352,150" fill="#1565c0" fill-opacity="0.12"/>

  <!-- strelice brzine u fluidu (6 slojeva) -->
  <line x1="68" y1="267" x2="117" y2="267" stroke="#1565c0" stroke-width="2" marker-end="url(#v2aV)"/>
  <line x1="68" y1="244" x2="164" y2="244" stroke="#1565c0" stroke-width="2" marker-end="url(#v2aV)"/>
  <line x1="68" y1="221" x2="211" y2="221" stroke="#1565c0" stroke-width="2" marker-end="url(#v2aV)"/>
  <line x1="68" y1="198" x2="258" y2="198" stroke="#1565c0" stroke-width="2" marker-end="url(#v2aV)"/>
  <line x1="68" y1="175" x2="305" y2="175" stroke="#1565c0" stroke-width="2" marker-end="url(#v2aV)"/>
  <!-- u(y) labela -->
  <text x="76" y="236" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#0d47a1">u(y)</text>

  <!-- τ strelica horizontalno (smično naprezanje) -->
  <line x1="362" y1="220" x2="426" y2="220" stroke="#1e8449" stroke-width="4" marker-end="url(#v2aT)"/>
  <text x="432" y="225" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-style="italic" fill="#1e8449">τ</text>

  <!-- donja ploča (nepomična): y=290..310 x=68..420 -->
  <rect x="68" y="290" width="352" height="22" rx="4" fill="url(#v2pl)" stroke="#4a5a66" stroke-width="2"/>
  <!-- hatching donje ploče (dolje lijevo) -->
  <line x1="88"  y1="290" x2="78"  y2="300" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="108" y1="290" x2="98"  y2="300" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="128" y1="290" x2="118" y2="300" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="148" y1="290" x2="138" y2="300" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="168" y1="290" x2="158" y2="300" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="188" y1="290" x2="178" y2="300" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="208" y1="290" x2="198" y2="300" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="228" y1="290" x2="218" y2="300" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="248" y1="290" x2="238" y2="300" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="268" y1="290" x2="258" y2="300" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="288" y1="290" x2="278" y2="300" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="308" y1="290" x2="298" y2="300" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="328" y1="290" x2="318" y2="300" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="348" y1="290" x2="338" y2="300" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="368" y1="290" x2="358" y2="300" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="388" y1="290" x2="378" y2="300" stroke="#6a7a86" stroke-width="1.2"/>
  <line x1="408" y1="290" x2="398" y2="300" stroke="#6a7a86" stroke-width="1.2"/>

  <!-- labele ploča -->
  <text x="432" y="142" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#5a6a78">gornja (giba se)</text>
  <text x="432" y="303" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#5a6a78">donja (miruje)</text>

  <!-- δ kota: lijevo, x=46, y=150..290 -->
  <line x1="46" y1="150" x2="46" y2="290" stroke="#b7600c" stroke-width="2" marker-start="url(#v2aDR)" marker-end="url(#v2aD)"/>
  <text x="52" y="225" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-style="italic" font-weight="700" fill="#b7600c">δ</text>
  <text x="52" y="242" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#b7600c">3 mm</text>

  <!-- formula box -->
  <rect x="56" y="322" width="408" height="76" rx="10" fill="#eaf4fb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="72" y="343" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#3a5a78">Newtonov zakon viskoznosti:</text>
  <text x="72" y="366" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#1a2530">τ = μ · dv/dy = μ · v/δ = 0,42 · 300 = 126 Pa</text>
  <text x="72" y="387" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#3a5a78">F = τ · A = 126 · 0,18 ≈ 22,7 N · ν = μ/ρ = 4,83·10⁻⁴ m²/s</text>

  <!-- divider -->
  <line x1="490" y1="88" x2="490" y2="402" stroke="#d0d8e4" stroke-width="1.8" stroke-dasharray="6 4"/>

  <!-- === DESNI PANEL: kapilarni uspon x=504..944 === -->
  <rect x="504" y="90" width="436" height="320" rx="12" fill="#f8fafc" stroke="#d0d8e4" stroke-width="1.6"/>
  <text x="522" y="114" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Kapilarni uspon etanola u staklenoj kapilari</text>

  <!-- posuda: x=520..700, y=200..370 -->
  <rect x="520" y="200" width="180" height="170" rx="4" fill="none" stroke="#5a6a76" stroke-width="2.5"/>
  <!-- tekućina u posudi -->
  <rect x="522" y="258" width="176" height="110" fill="url(#v2flCap)" opacity="0.9"/>
  <!-- razina u posudi -->
  <line x1="522" y1="258" x2="700" y2="258" stroke="#1565c0" stroke-width="2.5"/>
  <text x="528" y="252" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1565c0">slobodna površina</text>
  <text x="575" y="294" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#0d47a1">etanol</text>
  <text x="560" y="316" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a2530">ρ=790 kg/m³, σ=0,022 N/m</text>

  <!-- kapilara: stijenke x=616..628 i x=652..664; od y=130 do y=370 -->
  <!-- lijeva stijenka kapilare -->
  <rect x="614" y="130" width="14" height="240" fill="none" stroke="#5a6a76" stroke-width="2.5"/>
  <!-- desna stijenka kapilare -->
  <rect x="650" y="130" width="14" height="240" fill="none" stroke="#5a6a76" stroke-width="2.5"/>
  <!-- tekućina u kapilari (uspon do y=194 ≈ 64px iznad razine=258, h≈10.8mm→plot scale~64px) -->
  <rect x="628" y="194" width="22" height="64" fill="#aed6f1" opacity="0.95"/>
  <!-- tekućina u kapilari unutar posude -->
  <rect x="628" y="258" width="22" height="112" fill="#7fb3d3" opacity="0.95"/>
  <!-- meniskus konkavan gore: θ=18° → blago zakrivljen -->
  <path d="M628,196 Q639,183 650,196" fill="#aed6f1" stroke="#1565c0" stroke-width="2.2"/>
  <!-- iscrtkana linija razine -->
  <line x1="528" y1="258" x2="615" y2="258" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="663" y1="258" x2="698" y2="258" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- σ strelice na meniskusu (površinska napetost) -->
  <line x1="618" y1="196" x2="604" y2="180" stroke="#c0392b" stroke-width="2.2" marker-end="url(#v2aSig)"/>
  <line x1="650" y1="196" x2="664" y2="180" stroke="#c0392b" stroke-width="2.2" marker-end="url(#v2aSig)"/>
  <text x="639" y="174" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" text-anchor="middle" fill="#c0392b">σ</text>

  <!-- θ kut oznaka -->
  <text x="602" y="197" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#c0392b" text-anchor="end">θ=18°</text>

  <!-- h kota: desno, x=678, od y=194 do y=258 -->
  <line x1="672" y1="194" x2="672" y2="258" stroke="#b7600c" stroke-width="2" marker-start="url(#v2aDR)" marker-end="url(#v2aD)"/>
  <text x="679" y="228" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-style="italic" font-weight="700" fill="#b7600c">h</text>
  <text x="679" y="245" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#b7600c">10,8 mm</text>

  <!-- d kota: gore, x=614..664, y=132 -->
  <line x1="628" y1="136" x2="650" y2="136" stroke="#3a3a3a" stroke-width="1.8" marker-start="url(#v2aGR)" marker-end="url(#v2aG)"/>
  <text x="639" y="128" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" text-anchor="middle" fill="#3a3a3a">d</text>
  <text x="639" y="148" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#3a3a3a">1,0 mm</text>

  <!-- formula box desno -->
  <rect x="520" y="322" width="408" height="76" rx="10" fill="#eaf4fb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="536" y="343" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#3a5a78">Kapilarni uspon (ravnoteža σ i težine stupca):</text>
  <text x="536" y="366" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#1a2530">h = 4σ cosθ / (ρgd)</text>
  <text x="536" y="387" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#3a5a78">= 4·0,022·0,951 / (790·9,81·0,001) ≈ 10,8 mm</text>
</svg>
