<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="u08ftkh-title u08ftkh-desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:900px;height:auto;">
  <title id="u08ftkh-title">Razvod ulja kroz T-komad</title>
  <desc id="u08ftkh-desc">Jedno kontinuirano područje ulja povezuje ulaz D1 s gornjim izlazom D2 i donjim izlazom D3. Rubovi krutih stijenki završavaju uz otvore; nema čepova ni stijenke preko protoka. Unutarnje širine presjeka slijede omjer 32:20:24,8. Isprekidana granica KV presijeca sva tri voda. Strelice pokazuju smjer srednje brzine, nisu u mjerilu.</desc>
  <defs>
    <linearGradient id="u08ftkh-oil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a" />
      <stop offset="1" stop-color="#c8a000" />
    </linearGradient>
    <pattern id="u08ftkh-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.1" />
    </pattern>
    <marker id="u08ftkh-flow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#b7791f" />
    </marker>
    <marker id="u08ftkh-flow2" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1e8449" />
    </marker>
    <marker id="u08ftkh-flow3" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#e67e22" />
    </marker>
    <marker id="u08ftkh-dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u08ftkh-dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u08ftkh_fix_force" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0 0 L0 5 L6 2.5 Z" fill="#c0392b" stroke="none" stroke-width="1.2" />
    </marker>
    <marker id="u08ftkh_fix_green" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0 0 L0 5 L6 2.5 Z" fill="#1e8449" stroke="none" stroke-width="1.2" />
    </marker>
    <marker id="u08ftkh_fix_normal" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0 0 L0 5 L6 2.5 Z" fill="#1565c0" stroke="none" stroke-width="1.2" />
    </marker>
    <marker id="u08ftkh_fix_axis" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0 0 L0 5 L6 2.5 Z" fill="#3a4a56" stroke="none" stroke-width="1.2" />
    </marker>
    <marker id="u08ftkh_fix_dim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0 0 L0 5 L6 2.5 Z" fill="#b7600c" stroke="none" stroke-width="1.2" />
    </marker>
    <marker id="u08ftkh_fix_dimL" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse">
      <path d="M0 0 L0 5 L6 2.5 Z" fill="#b7600c" stroke="none" stroke-width="1.2" />
    </marker>
    <linearGradient id="u08ftkh_fix_water" x1="0" y1="120" x2="0" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#c8a000" />
    </linearGradient>
    <pattern id="u08ftkh_fix_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="7" height="7" fill="#d7dee3" stroke="none" stroke-width="1.2" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.1" />
    </pattern>
  </defs>
  <rect x="498" y="96" width="430" height="84" rx="9" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="498" y="96" width="6" height="84" rx="3" fill="#1565c0" />
  <rect x="498" y="188" width="430" height="84" rx="9" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="498" y="188" width="6" height="84" rx="3" fill="#1565c0" />
  <rect x="498" y="280" width="430" height="84" rx="9" fill="#f1f9f3" stroke="#cce7d4" stroke-width="1.2" />
  <rect x="498" y="280" width="6" height="84" rx="3" fill="#1e8449" />
  <rect x="498" y="372" width="430" height="84" rx="9" fill="#fdf5ec" stroke="#ecd2b3" stroke-width="1.2" />
  <rect x="498" y="372" width="6" height="84" rx="3" fill="#e67e22" />
  <text x="500" y="60" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Tijek rješenja</text>
  <text x="500" y="78" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">kontinuitet i geometrija presjeka korak po korak</text>
  <text x="516" y="118" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1565c0">1. Ulazni presjek i protok</text>
  <text x="516" y="141" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1a2530">
    <tspan font-style="italic">A</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">1</tspan> = π <tspan font-style="italic">D</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">1</tspan>² / 4 = 8,042 · 10⁻⁴ m²</text>
  <text x="516" y="166" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1565c0">
    <tspan font-style="italic">Q</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">1</tspan> = <tspan font-style="italic">A</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">1</tspan>
    <tspan font-style="italic">v</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">1</tspan> = 3,62 L/s</text>
  <text x="516" y="210" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1565c0">2. Podjela protoka (60 % / 40 %)</text>
  <text x="516" y="234" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1a2530">
    <tspan font-style="italic">Q</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 0,60 <tspan font-style="italic">Q</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">1</tspan> = 2,17 L/s</text>
  <text x="516" y="258" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1a2530">
    <tspan font-style="italic">Q</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">3</tspan> = 0,40 <tspan font-style="italic">Q</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">1</tspan> = 1,45 L/s</text>
  <text x="516" y="302" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1e8449">3. Brzina u ogranku 1 (radni cilindar)</text>
  <text x="516" y="325" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1a2530">
    <tspan font-style="italic">A</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">2</tspan> = π <tspan font-style="italic">D</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">2</tspan>² / 4 = 3,142 · 10⁻⁴ m²</text>
  <text x="516" y="350" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1e8449">
    <tspan font-style="italic">v</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">2</tspan> = <tspan font-style="italic">Q</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">2</tspan> / <tspan font-style="italic">A</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 6,9 m/s</text>
  <text x="516" y="394" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#b85f10">4. Potrebni promjer ogranka 2 (hladnjak), <tspan font-style="italic">v</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">3</tspan> = 3,0 m/s</text>
  <text x="516" y="417" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1a2530">
    <tspan font-style="italic">A</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">3</tspan> = <tspan font-style="italic">Q</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">3</tspan> / <tspan font-style="italic">v</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">3</tspan> = 4,83 · 10⁻⁴ m²</text>
  <text x="516" y="442" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#b85f10">
    <tspan font-style="italic">D</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">3</tspan> = √(4<tspan font-style="italic">A</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">3</tspan>/π) ≈ 24,8 mm</text>
  <text x="713" y="478" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">Provjera: <tspan font-style="italic">Q</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">2</tspan> + <tspan font-style="italic">Q</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">3</tspan> = 2,17 + 1,45 = 3,62 L/s = <tspan font-style="italic">Q</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">1</tspan> ✓</text>
  <g font-family="'Segoe UI',Arial,sans-serif" />
