    <text x="139" y="220" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#3a4a56" text-anchor="middle">Q₁ = 3,62 L/s</text>
    <text x="139" y="235" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#3a4a56" text-anchor="middle">v₁ = 4,5 m/s</text>
    <text x="326" y="153" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1e8449" text-anchor="start">Q₂ = 2,17 L/s</text>
    <text x="326" y="171" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1e8449" text-anchor="start">v₂ = 6,9 m/s</text>
    <text x="326" y="355" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1565c0" text-anchor="start">Q₃ = 1,45 L/s</text>
    <text x="326" y="373" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1565c0" text-anchor="start">v₃ = 3,0 m/s</text>
    <line x1="40" y1="246" x2="50" y2="246" stroke="#b7600c" stroke-width="0.8" />
    <line x1="40" y1="294" x2="50" y2="294" stroke="#b7600c" stroke-width="0.8" />
    <line x1="45" y1="246" x2="45" y2="294" stroke="#b7600c" stroke-width="1.2" marker-start="url(#u08ftkh_fix_dimL)" marker-end="url(#u08ftkh_fix_dim)" />
    <text x="15" y="274.0" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b7600c" text-anchor="start">D₁</text>
    <text x="85" y="331" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b7600c" text-anchor="middle">D₁ = 32 mm</text>
    <line x1="273" y1="96" x2="273" y2="106" stroke="#b7600c" stroke-width="0.8" />
    <line x1="303" y1="96" x2="303" y2="106" stroke="#b7600c" stroke-width="0.8" />
    <line x1="273" y1="101" x2="303" y2="101" stroke="#b7600c" stroke-width="1.2" marker-start="url(#u08ftkh_fix_dimL)" marker-end="url(#u08ftkh_fix_dim)" />
    <text x="288.0" y="119" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b7600c" text-anchor="middle">D₂ = 20 mm</text>
    <line x1="265.8" y1="438" x2="265.8" y2="448" stroke="#b7600c" stroke-width="0.8" />
    <line x1="303" y1="438" x2="303" y2="448" stroke="#b7600c" stroke-width="0.8" />
