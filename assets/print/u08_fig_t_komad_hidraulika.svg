    <text x="230" y="55" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#3a4a56" text-anchor="middle" font-weight="700">Razvod ulja kroz otvoreni T-komad</text>
    <text x="234" y="492" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#3a4a56" text-anchor="middle">Tri otvorena presjeka; jedna neprekinuta domena ulja.</text>
