<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 417 469" role="img" aria-labelledby="u08ftkh-title u08ftkh-desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:420px;height:auto;">
  <title id="u08ftkh-title">Razvod ulja kroz T-komad</title>
  <desc id="u08ftkh-desc">Jedno kontinuirano područje ulja povezuje ulaz D1 s gornjim izlazom D2 i donjim izlazom D3. Rubovi krutih stijenki završavaju uz otvore; nema čepova ni stijenke preko protoka. Unutarnje širine presjeka slijede omjer 32:20:24,8. Isprekidana granica KV presijeca sva tri voda. Strelice srednjih brzina imaju zajedničko mjerilo: v1 = 4,5 m/s, v2 = 6,9 m/s (rezultat primjera) i v3 = 3,0 m/s.</desc>
