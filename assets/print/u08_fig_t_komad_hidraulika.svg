<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" role="img" aria-labelledby="u8ft-title u8ft-desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u8ft-title">U08 – razvodni T-komad hidraulicnog sustava</title>
  <desc id="u8ft-desc">T-komad: D1=32mm v1=4,5 m/s, Q1=3,62 L/s. Grana 2 (radni cilindar): D2=20mm, 60% Q, v2=6,9 m/s. Grana 3 (hladnjak): D3=25mm, 40% Q, v3=3,0 m/s.</desc>
  <defs>
    <linearGradient id="u8ft-oil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0b8"/>
      <stop offset="100%" stop-color="#d4960a"/>
    </linearGradient>
    <pattern id="u8ft-sraf" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#8090a0"/>
      <line x1="0" y1="4" x2="8" y2="4" stroke="#546e7a" stroke-width="1.8"/>
    </pattern>
    <marker id="u8ft-arrG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#0f766e"/>
    </marker>
    <marker id="u8ft-arrR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#b42318"/>
    </marker>
    <marker id="u8ft-arrGr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#546e7a"/>
    </marker>
    <marker id="u8ft-arrGrRev" markerWidth="9" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <path d="M9,0 L9,7 L0,3.5 z" fill="#546e7a"/>
    </marker>
  </defs>
  <!-- Canvas -->
  <rect width="940" height="390" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="342" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>
  <!-- Title -->
  <text x="54" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#173043">Razvodni T-komad — hidraulični sustav</text>
  <text x="54" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#516677">D₁ = 32 mm, v₁ = 4,5 m/s → 60 % u radni cilindar (D₂ = 20 mm), 40 % u hladnjak (D₃ ≈ 25 mm)</text>

  <!-- ===== T-JUNCTION GEOMETRY ===== -->
  <!-- Inlet pipe: horizontal, from left to junction center at (460,210) -->
  <!-- D1=32mm → scaled 40px diameter (20px half-height) -->
  <!-- Inlet walls (srafura) -->
  <rect x="90" y="190" width="370" height="40" fill="url(#u8ft-sraf)" stroke="none"/>
  <!-- Inlet fluid -->
  <rect x="102" y="202" width="358" height="16" fill="url(#u8ft-oil)" stroke="none"/>
  <!-- Inlet wall lines -->
  <line x1="90" y1="190" x2="460" y2="190" stroke="#3d4f5a" stroke-width="2.5"/>
  <line x1="90" y1="230" x2="460" y2="230" stroke="#3d4f5a" stroke-width="2.5"/>
  <line x1="90" y1="190" x2="90" y2="230" stroke="#3d4f5a" stroke-width="2.5"/>

  <!-- Junction body (rect at center) -->
  <rect x="460" y="160" width="40" height="270" fill="url(#u8ft-sraf)" stroke="none"/>
  <rect x="474" y="172" width="12" height="246" fill="url(#u8ft-oil)" stroke="none"/>
  <line x1="460" y1="160" x2="460" y2="430" stroke="none"/>
  <!-- Junction outline (partial) -->
  <line x1="460" y1="160" x2="500" y2="160" stroke="#3d4f5a" stroke-width="2.5"/>
  <line x1="460" y1="430" x2="500" y2="430" stroke="none"/>

  <!-- Upper branch to radni cilindar: D2=20mm → 25px diameter (12.5px half) -->
  <rect x="460" y="116" width="40" height="74" fill="url(#u8ft-sraf)" stroke="none"/>
  <rect x="474" y="128" width="12" height="50" fill="url(#u8ft-oil)" stroke="none"/>
  <line x1="460" y1="116" x2="500" y2="116" stroke="#3d4f5a" stroke-width="2.5"/>
  <line x1="460" y1="190" x2="500" y2="190" stroke="#3d4f5a" stroke-width="2.5"/>
  <!-- Upper branch horizontal (to radni cilindar) -->
  <rect x="500" y="129" width="200" height="48" fill="url(#u8ft-sraf)" stroke="none"/>
  <rect x="500" y="141" width="200" height="24" fill="url(#u8ft-oil)" stroke="none"/>
  <line x1="500" y1="129" x2="700" y2="129" stroke="#3d4f5a" stroke-width="2.5"/>
  <line x1="500" y1="177" x2="700" y2="177" stroke="#3d4f5a" stroke-width="2.5"/>
  <line x1="700" y1="129" x2="700" y2="177" stroke="#3d4f5a" stroke-width="2.5"/>
  <!-- Flow arrow upper -->
  <line x1="700" y1="153" x2="752" y2="153" stroke="#0f766e" stroke-width="3.5" marker-end="url(#u8ft-arrG)"/>
  <text x="756" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f766e">Q₂ = 60%</text>
  <text x="756" y="161" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f766e">2,17 L/s</text>
  <text x="756" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f766e">v₂ = 6,9 m/s</text>
  <!-- Radni cilindar label -->
  <text x="560" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#516677" font-style="italic">→ radni cilindar</text>

  <!-- Lower branch to hladnjak: D3=25mm → 31px diameter (15.5px half) -->
  <rect x="460" y="230" width="40" height="74" fill="url(#u8ft-sraf)" stroke="none"/>
  <rect x="473" y="242" width="14" height="50" fill="url(#u8ft-oil)" stroke="none"/>
  <line x1="460" y1="230" x2="500" y2="230" stroke="#3d4f5a" stroke-width="2.5"/>
  <line x1="460" y1="304" x2="500" y2="304" stroke="#3d4f5a" stroke-width="2.5"/>
  <!-- Lower branch horizontal (to hladnjak) -->
  <rect x="500" y="243" width="180" height="48" fill="url(#u8ft-sraf)" stroke="none"/>
  <rect x="500" y="255" width="180" height="24" fill="url(#u8ft-oil)" stroke="none"/>
  <line x1="500" y1="243" x2="680" y2="243" stroke="#3d4f5a" stroke-width="2.5"/>
  <line x1="500" y1="291" x2="680" y2="291" stroke="#3d4f5a" stroke-width="2.5"/>
  <line x1="680" y1="243" x2="680" y2="291" stroke="#3d4f5a" stroke-width="2.5"/>
  <!-- Flow arrow lower -->
  <line x1="680" y1="267" x2="732" y2="267" stroke="#b42318" stroke-width="3.5" marker-end="url(#u8ft-arrR)"/>
  <text x="736" y="259" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#b42318">Q₃ = 40%</text>
  <text x="736" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#b42318">1,45 L/s</text>
  <text x="736" y="289" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#b42318">v₃ = 3,0 m/s</text>
  <!-- Hladnjak label -->
  <text x="550" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#516677" font-style="italic">→ hladnjak ulja</text>

  <!-- Inlet arrow and label -->
  <line x1="40" y1="210" x2="88" y2="210" stroke="#0f766e" stroke-width="3.5" marker-end="url(#u8ft-arrG)"/>
  <text x="36" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f766e">Q₁</text>
  <text x="30" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f766e">3,62 L/s</text>
  <text x="32" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f766e">v₁=4,5 m/s</text>

  <!-- D1 dim annotation -->
  <line x1="90" y1="244" x2="460" y2="244" stroke="#546e7a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="260" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#546e7a" text-anchor="middle">D₁ = 32 mm</text>

  <!-- D2 dim -->
  <text x="544" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#546e7a">D₂ = 20 mm</text>

  <!-- D3 dim -->
  <text x="536" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#546e7a">D₃ ≈ 25 mm</text>

  <!-- ===== FORMULA BOX ===== -->
  <rect x="54" y="320" width="740" height="60" rx="10" fill="#fffef6" stroke="#c49a0a" stroke-width="1.8"/>
  <text x="70" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#173043">Kontinuitet:</text>
  <text x="70" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#173043">Q₁ = Q₂ + Q₃     →     3,62 = 2,17 + 1,45 L/s  ✓</text>
  <text x="400" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#516677">v₂ = Q₂/A₂ = 6,9 m/s   |   D₃ = √(4Q₃/πv₃) = 24,8 mm ≈ 25 mm</text>
</svg>