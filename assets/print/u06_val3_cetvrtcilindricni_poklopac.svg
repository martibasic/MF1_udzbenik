    <text x="250" y="393" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#3a4a56" text-anchor="middle">Sile vode na poklopac: F<tspan baseline-shift="sub" font-size="0.7em">H</tspan> →, F<tspan baseline-shift="sub" font-size="0.7em">V</tspan> ↓.</text>
    <text x="250" y="413" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#3a4a56" text-anchor="middle">V* = πR²b/4; ovdje ga ispunjava stvarna voda.</text>
