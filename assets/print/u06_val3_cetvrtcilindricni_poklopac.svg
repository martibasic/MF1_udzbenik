<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 451 376" role="img" aria-labelledby="u06v3cp_title u06v3cp_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:451px;height:auto;">
  <title id="u06v3cp_title">Četvrtcilindrični poklopac uz slobodnu površinu u zatvorenom spremniku s nadtlakom plina</title>
  <desc id="u06v3cp_desc">Zatvoreni spremnik s poklopcem gore; ispod poklopca plin s manometarskim nadtlakom 20,0 kPa, ispod njega voda. Pravi četvrtkružni luk sa središtem O gore lijevo na slobodnoj površini; gornji kraj luka je desno na slobodnoj površini, donji ispod O. Stvarna voda ispunjava četvrtinu valjka iznad luka (V* = stvarna voda), a s druge strane luka je zrak na atmosferskom tlaku. Komponente sile na poklopac nacrtane su iz fluida do plohe: FH udesno na dubini hH, FV prema dolje na xV od lijeve stijenke; zbog jednolikog nadtlaka oba su hvatišta bliže težištima projekcija nego u otvorenom spremniku. Rezultanta FR prolazi kroz O; duljine su u omjeru iznosa.</desc>
