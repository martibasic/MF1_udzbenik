  <text x="520" y="58" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Rastav i rezultanta sile</text>
  <text x="540" y="96" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#c0392b">1. Horizontalna komponenta</text>
  <text x="540" y="118" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">
    <tspan font-style="italic">A</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">x</tspan> = R·b = 1,08 m²,  <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">Cx</tspan> = R/2 = 0,45 m</text>
  <text x="540" y="138" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">H</tspan> = ρ g <tspan font-style="italic">A</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">x</tspan>
    <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">Cx</tspan> = 998·9,81·1,08·0,45</text>
  <text x="540" y="158" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#c0392b">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">H</tspan> ≈ 4,76 kN  (<tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">H</tspan> = 2R/3 = 0,60 m)</text>
  <text x="540" y="198" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#c0392b">2. Vertikalna komponenta (težina V*)</text>
  <text x="540" y="220" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">V* = πR²b/4 = π·0,81·1,20/4 ≈ 0,763 m³</text>
  <text x="540" y="240" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">V</tspan> = ρ g V* = 998·9,81·0,763</text>
  <text x="540" y="260" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#c0392b">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">V</tspan> ≈ 7,47 kN  (<tspan font-style="italic">x</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">V</tspan> = 4R/(3π) = 0,382 m)</text>
  <text x="540" y="300" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1e8449">3. Rezultanta i kut</text>
  <text x="540" y="322" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">R</tspan> = √(<tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">H</tspan>² + <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">V</tspan>²) = √(4,76² + 7,47²)</text>
  <text x="540" y="342" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">α = arctan(<tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">V</tspan>/<tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">H</tspan>) = arctan(7,47/4,76)</text>
  <text x="540" y="362" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1e8449">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">R</tspan> ≈ 8,86 kN,  α ≈ 57,5° ispod horizontale</text>
  <text x="535" y="406" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#5a6a78">REZULTATI</text>
  <text x="620" y="406" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#c0392b">F<tspan baseline-shift="sub" font-size="0.7em">H</tspan> = 4,76 kN</text>
  <text x="730" y="406" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#c0392b">F<tspan baseline-shift="sub" font-size="0.7em">V</tspan> = 7,47 kN</text>
  <text x="840" y="406" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1e8449">F<tspan baseline-shift="sub" font-size="0.7em">R</tspan> = 8,86 kN</text>
