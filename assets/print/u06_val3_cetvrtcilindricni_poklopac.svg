<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 451 376" role="img" aria-labelledby="u06v3cp_title u06v3cp_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:451px;height:auto;">
  <title id="u06v3cp_title">Četvrtcilindrični revizijski poklopac uz slobodnu površinu</title>
  <desc id="u06v3cp_desc">Pravi četvrtkružni luk sa središtem O gore lijevo, A desno na slobodnoj površini i B ispod O. Stvarna voda ispunjava četvrtinu valjka iznad luka. Sile vode na poklopac su desno i dolje. FH djeluje na dubini 2R/3, a FV na xV=4R/(3π) od lijeve stijenke. Rezultanta je usmjerena ispod horizontale.</desc>
