<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 451 376" role="img" aria-labelledby="u06v3cp_title u06v3cp_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:451px;height:auto;">
  <title id="u06v3cp_title">Četvrtcilindrični revizijski poklopac uz slobodnu površinu</title>
  <desc id="u06v3cp_desc">Pravi četvrtkružni luk sa središtem O gore lijevo na slobodnoj površini; gornji kraj luka je desno na slobodnoj površini, donji ispod O. Stvarna voda ispunjava četvrtinu valjka iznad luka (V* = stvarna voda). Komponente sile vode na poklopac nacrtane su iz vode do plohe: FH udesno na dubini hH = 2R/3, FV prema dolje na xV = 4R/(3π) od lijeve stijenke. Rezultanta FR prolazi kroz O i djeluje na plohu ispod horizontale; duljine su u omjeru iznosa.</desc>
