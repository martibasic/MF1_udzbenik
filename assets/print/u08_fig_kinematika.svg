  <defs>
    <title id="u08kin-title">Strujnica i trajektorija</title>
    <desc id="u08kin-desc">Lijevo: strujnica kao krivulja tangentna na vektore brzine u istom trenutku. Desno: trajektorija jedne cestice fluida kroz vrijeme, s polozajima u cetiri trenutka. U stacionarnom strujanju strujnica i trajektorija imaju isti oblik.</desc>
