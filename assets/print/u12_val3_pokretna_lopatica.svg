<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
<defs>
  <marker id="u12v3pl_u12v3-ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0f766e"/></marker>
  <marker id="u12v3pl_u12v3-ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#b42318"/></marker>
  <marker id="u12v3pl_u12v3-ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#1d4ed8"/></marker>
  <marker id="u12v3pl_u12v3-ao" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#b45309"/></marker>
  <marker id="u12v3pl_u12v3-agr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#546e7a"/></marker>
  <linearGradient id="u12v3pl_u12v3-wat" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#d4eef8"/><stop offset="100%" stop-color="#7ec8e8"/></linearGradient>
  <pattern id="u12v3pl_u12v3-hatch" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#8090a0"/>
    <line x1="0" y1="8" x2="8" y2="0" stroke="#546e7a" stroke-width="1.8"/>
  </pattern>
</defs>
<rect width="940" height="420" fill="#ffffff"/>
<rect x="24" y="24" width="892" height="372" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>
<text x="54" y="55" font-family="'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#173043">Pokretna ravna ploča — sila i snaga</text>
<text x="54" y="76" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#516677">Ploča giba u smjeru mlaza · relativni kontrolni volumen · w₁ = c₁ − u</text>

<!-- ===== PHYSICAL DIAGRAM (left) ===== -->

<!-- Nozzle body -->
<rect x="44" y="168" width="70" height="86" rx="4" fill="url(#u12v3pl_u12v3-hatch)"/>
<!-- Nozzle orifice highlight -->
<rect x="108" y="192" width="5" height="38" fill="#2d3a40"/>
<!-- Nozzle exit annotation: d = 40 mm -->
<line x1="113" y1="192" x2="125" y2="185" stroke="#546e7a" stroke-width="1"/>
<text x="127" y="183" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#546e7a">d = 40 mm</text>

<!-- Water jet -->
<rect x="113" y="192" width="128" height="38" fill="url(#u12v3pl_u12v3-wat)" opacity="0.88"/>

<!-- Flat plate (vertical, moving right) -->
<rect x="241" y="148" width="22" height="126" rx="2" fill="url(#u12v3pl_u12v3-hatch)"/>

<!-- Plate velocity arrow u (orange, from center of plate going right) -->
<line x1="252" y1="290" x2="316" y2="290" stroke="#b45309" stroke-width="2.8" marker-end="url(#u12v3pl_u12v3-ao)"/>
<text x="252" y="310" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#b45309">u = 9 m/s</text>

<!-- c1 arrow (green, absolute jet velocity, from nozzle exit going right) -->
<line x1="126" y1="175" x2="230" y2="175" stroke="#0f766e" stroke-width="2.8" marker-end="url(#u12v3pl_u12v3-ag)"/>
<text x="128" y="169" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#0f766e">c₁ = 24 m/s</text>

<!-- w1 arrow (blue, relative velocity = c1 - u, dashed, starting at same point as c1 but scaled) -->
<!-- w1 = c1 - u = 15 m/s; proportional to c1: (15/24)*104 = 65px -->
<line x1="126" y1="155" x2="191" y2="155" stroke="#1d4ed8" stroke-width="2.2" stroke-dasharray="6,3" marker-end="url(#u12v3pl_u12v3-ab)"/>
<text x="128" y="148" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">w₁ = c₁ − u = 15 m/s</text>

<!-- Force F on plate (red, pointing LEFT = reaction from fluid on plate) -->
<line x1="241" y1="211" x2="166" y2="211" stroke="#b42318" stroke-width="2.8" marker-end="url(#u12v3pl_u12v3-ar)"/>
<text x="159" y="230" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#b42318">F = 282 N</text>

<!-- Key equation label -->
<text x="355" y="168" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043" font-style="italic">ṁ_rel = ρ A w₁</text>
<text x="355" y="185" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043" font-style="italic">F = ṁ_rel · w₁</text>

<!-- ===== VELOCITY TRIANGLE PANEL (lower-left box) ===== -->
<rect x="44" y="330" width="390" height="68" rx="6" fill="#f0f6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="60" y="347" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#173043">Dijagram brzina (relativni sustav):</text>
<!-- Scale: 1 m/s = 8px, c1=24 → 192px, u=9 → 72px, w1=15 → 120px -->
<!-- Reference point at x=70, y=365 -->
<line x1="68" y1="366" x2="258" y2="366" stroke="#0f766e" stroke-width="3" marker-end="url(#u12v3pl_u12v3-ag)"/>
<text x="148" y="382" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#0f766e">c₁ = 24 m/s</text>
<!-- u arrow: same start, goes to 72px -->
<line x1="68" y1="358" x2="136" y2="358" stroke="#b45309" stroke-width="2.2" marker-end="url(#u12v3pl_u12v3-ao)"/>
<text x="72" y="353" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b45309">u=9</text>
<!-- w1 arrow from 72px to 192px -->
<line x1="140" y1="358" x2="258" y2="358" stroke="#1d4ed8" stroke-width="2.2" stroke-dasharray="5,2" marker-end="url(#u12v3pl_u12v3-ab)"/>
<text x="178" y="352" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1d4ed8">w₁=15</text>

<!-- ===== INFO PANEL (right) ===== -->
<rect x="455" y="88" width="460" height="298" rx="10" fill="#fffef6" stroke="#c49a0a" stroke-width="1.8"/>
<text x="471" y="114" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">Zadano</text>
<text x="471" y="134" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">Promjer sapnice:  d = 40 mm</text>
<text x="471" y="153" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">Apsolutna brzina mlaza:  c₁ = 24 m/s</text>
<text x="471" y="172" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">Brzina ploče (isti smjer):  u = 9 m/s</text>
<line x1="471" y1="183" x2="903" y2="183" stroke="#e2e8f0" stroke-width="1"/>
<text x="471" y="202" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">Relativni protok kroz pokretni KV</text>
<text x="471" y="221" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">w₁ = c₁ − u = 24 − 9 = 15 m/s</text>
<text x="471" y="240" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">A = π d²/4 = 1,257 · 10⁻³ m²</text>
<text x="471" y="259" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">ṁ_rel = ρ A w₁ = 1000·1,257·10⁻³·15 = <tspan font-weight="700" fill="#0f766e">18,85 kg/s</tspan></text>
<line x1="471" y1="270" x2="903" y2="270" stroke="#e2e8f0" stroke-width="1"/>
<text x="471" y="289" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">Sila i snaga</text>
<text x="471" y="309" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">Na ravnoj ploči: izlazna brzina fluida u rel. okviru ⊥ na mlaz.</text>
<text x="471" y="327" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">F = ṁ_rel · w₁ = 18,85 · 15 = <tspan font-weight="700" fill="#b42318">282 N</tspan></text>
<text x="471" y="346" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">P = F · u = 282 · 9 = <tspan font-weight="700" fill="#b42318">2541 W = 2,54 kW</tspan></text>
<text x="471" y="370" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#516677" font-style="italic">Napomena: na ravnu ploču samo relativni tok udara.</text>
<text x="471" y="385" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#516677" font-style="italic">Fluid koji "drži korak" s pločom ne ulazi u KV.</text>
</svg>