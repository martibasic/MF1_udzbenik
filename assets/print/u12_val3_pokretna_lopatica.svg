<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 47 438 402" role="img" aria-labelledby="u14p3_title u14p3_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:438px;height:auto;">
  <title id="u14p3_title">Radijalno kolo crpke i trokuti brzina</title>
  <desc id="u14p3_desc">Lijevo je presjek radijalnog kola: oko kola polumjera r1 (aksijalni ulaz vode, oko male šrafirane glavine na vratilu), vanjski rub polumjera r2 i šest unatrag zakrivljenih lopatica čiji su ulazni i izlazni kutovi beta1 i beta2 nacrtani iz podataka; kružna strelica daje smjer vrtnje. Desno su ulazni i izlazni trokut brzina u istom mjerilu: obodna brzina u, relativna w uz lopaticu i apsolutna c kao njihov zbroj; na ulazu je c radijalna.</desc>
