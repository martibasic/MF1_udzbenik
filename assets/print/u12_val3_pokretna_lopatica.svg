<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" role="img" aria-labelledby="u14p3_title u14p3_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="u14p3_title">Relativni dotok i pokretna ploča</title>
  <desc id="u14p3_desc">Otvorena sapnica dovodi slobodni mlaz do prednje strane nepropusne ploče. Voda se razlijeva prema dva otvorena ruba i ne prolazi kroz ploču. Ploča se giba u smjeru mlaza; relativni dotok c1 minus u ulazi u pokretni kontrolni volumen. Izlazne apsolutne strelice sadrže komponentu u. Kota d poprečna je mjera mlaza.</desc>
  <defs>
    <pattern id="u14p3_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.8" />
    </pattern>
    <marker id="u14p3_v" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
    </marker>
    <marker id="u14p3_dim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse">
      <path d="M0 0 L6 2.5 L0 5 Z" fill="#657781" />
    </marker>
    <marker id="u14p3_dimSmall" markerWidth="3" markerHeight="3" refX="3" refY="1.5" orient="auto-start-reverse">
      <path d="M0 0 L3 1.5 L0 3 Z" fill="#356b83" />
    </marker>
  </defs>
  <g font-family="Arial, Liberation Sans, sans-serif" fill="#3a4a56">
    <defs>
      <marker id="u14p3_forceMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
        <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
      </marker>
      <marker id="u14p3_pressureMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
        <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
      </marker>
      <marker id="u14p3_reactionMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
        <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
      </marker>
      <marker id="u14p3_axisMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
        <path d="M0 0 L7 3 L0 6 Z" fill="#3a4a56" />
      </marker>
    </defs>
    <defs>
      <marker id="u14p3_motionMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
        <path d="M0 0 L7 3 L0 6 Z" fill="#657781" />
      </marker>
    </defs>
    <text x="39" y="47" font-size="14" fill="#263746" text-anchor="start" font-weight="700">Fiksna sapnica → mlaz → jedna pokretna ploča</text>
    <text x="39" y="70" font-size="11" fill="#263746" text-anchor="start">KV prati ploču; presudna je relativna ulazna brzina.</text>
    <path id="u14p3_inletTriangleu" d="M92.0000000 111.0000000 L137.0000000 111.0000000" fill="none" stroke="#657781" stroke-width="2.3" marker-end="url(#u14p3_motionMarker)" />
    <text x="114.5" y="102" font-size="12" fill="#263746" text-anchor="middle">u</text>
    <path id="u14p3_inletTrianglew" d="M137.0000000 111.0000000 L212.0000000 111.0000000" fill="none" stroke="#356b83" stroke-width="2.3" marker-end="url(#u14p3_reactionMarker)" />
    <text x="174.5" y="102" font-size="12" fill="#263746" text-anchor="middle">c<tspan baseline-shift="sub" font-size="0.75em">r</tspan>
    </text>
    <path id="u14p3_inletTrianglec" d="M92.0000000 141.0000000 L212.0000000 141.0000000" fill="none" stroke="#356b83" stroke-width="2.3" marker-end="url(#u14p3_pressureMarker)" />
    <text x="152.0" y="159" font-size="12" fill="#263746" text-anchor="middle">c</text>
    <line x1="92" y1="105" x2="92" y2="145" stroke="#657781" stroke-width="0.8" stroke-dasharray="3 3" />
    <line x1="212" y1="105" x2="212" y2="145" stroke="#657781" stroke-width="0.8" stroke-dasharray="3 3" />
    <text x="318" y="115" font-size="11" fill="#263746" text-anchor="start">c₁ = 24; u = 9; c<tspan baseline-shift="sub" font-size="0.75em">r</tspan> = 15 m/s</text>
    <defs />
    <path id="u14p3_jetfluid" d="M71 257.0 H295 Q314 257.0 314 238.0 V187 H321 V369 H314 V318.0 Q314 299.0 295 299.0 H71 Z" fill="#dcebf1" stroke="none" stroke-width="1.8" />
    <line id="u14p3_jettop" x1="71" y1="257.0" x2="123" y2="257.0" stroke="#3a4a56" stroke-width="2" />
    <line id="u14p3_jetbottom" x1="71" y1="299.0" x2="123" y2="299.0" stroke="#3a4a56" stroke-width="2" />
    <rect id="u14p3_jetplate" x="321" y="195" width="12" height="166" rx="0" fill="url(#u14p3_hatch)" stroke="#3a4a56" stroke-width="1.2" />
    <path id="u14p3_movingCV" d="M274 184 H345 V373 H274 Z" fill="none" stroke="#263746" stroke-width="1.8" stroke-dasharray="6 4" data-mf1-role="control-volume" />
    <path id="u14p3_inflow" d="M135.0000000 278.0000000 L230.0000000 278.0000000" fill="none" stroke="#356b83" stroke-width="2.3" marker-end="url(#u14p3_pressureMarker)" />
    <text x="182.5" y="263" font-size="12" fill="#263746" text-anchor="middle">c₁ = 24 m/s</text>
    <line x1="54" y1="257.0" x2="64" y2="257.0" stroke="#657781" stroke-width="1.2" />
    <line x1="54" y1="299.0" x2="64" y2="299.0" stroke="#657781" stroke-width="1.2" />
    <path id="u14p3_d" d="M59 257.0 L59 299.0" fill="none" stroke="#657781" stroke-width="1.4" marker-start="url(#u14p3_dim)" marker-end="url(#u14p3_dim)" />
    <text x="46" y="245" font-size="11" fill="#263746" text-anchor="start">d = 40 mm</text>
    <path id="u14p3_outTop" d="M317.5000000 187.0000000 L344.5000000 142.0000000" fill="none" stroke="#356b83" stroke-width="2.3" marker-end="url(#u14p3_pressureMarker)" />
    <text x="372" y="168" font-size="12" fill="#263746" text-anchor="middle">c₂</text>
    <path id="u14p3_outBottom" d="M317.5000000 369.0000000 L344.5000000 414.0000000" fill="none" stroke="#356b83" stroke-width="2.3" marker-end="url(#u14p3_pressureMarker)" />
    <text x="372" y="413" font-size="12" fill="#263746" text-anchor="middle">c₂</text>
    <path id="u14p3_motion" d="M347.0000000 278.0000000 L427.0000000 278.0000000" fill="none" stroke="#657781" stroke-width="2.3" marker-end="url(#u14p3_motionMarker)" />
    <text x="387.0" y="263" font-size="12" fill="#263746" text-anchor="middle">u = 9 m/s</text>
    <path id="u14p3_forceX" d="M347 329 L427 329" fill="none" stroke="#356b83" stroke-width="2.3" marker-end="url(#u14p3_forceMarker)" />
    <text x="394" y="351" font-size="13" fill="#263746" text-anchor="middle">Fₓ ≈ 282 N</text>
    <text x="45" y="427" font-size="11" fill="#263746" text-anchor="start">c₂x = u; relativni izlaz prati prednju stranu ploče.</text>
    <text x="45" y="449" font-size="11" fill="#263746" text-anchor="start">Debljina razlijevanja je shematska.</text>
    <text x="45" y="477" font-size="11" fill="#263746" text-anchor="start">c: apsolutna; c<tspan baseline-shift="sub" font-size="0.75em">r</tspan>: relativna; u: brzina ploče.</text>
    <text x="45" y="496" font-size="10" fill="#263746" text-anchor="start">Trokut ulaza: 5 px za 1 m/s.</text>
    <text x="739.5" y="54" font-size="15" fill="#263746" text-anchor="middle" font-weight="700">Rješenje — pokretni kontrolni volumen</text>
    <text x="540" y="99" font-size="12" fill="#263746" text-anchor="start" font-weight="700">Ulazni presjek</text>
    <text x="541" y="121" font-size="13" fill="#263746" text-anchor="start">d = 40 mm; ρ = 998 kg/m³</text>
    <text x="541" y="142" font-size="13" fill="#263746" text-anchor="start">A = πd²/4</text>
    <text x="540" y="182" font-size="12" fill="#263746" text-anchor="start" font-weight="700">Relativni ulaz</text>
    <text x="541" y="204" font-size="13" fill="#263746" text-anchor="start">c<tspan baseline-shift="sub" font-size="0.75em">r</tspan> = c₁ − u = 15 m/s</text>
    <text x="541" y="225" font-size="13" fill="#263746" text-anchor="start">ṁrel = ρA(c₁ − u)</text>
    <text x="540" y="265" font-size="12" fill="#263746" text-anchor="start" font-weight="700">Sila fluida i snaga</text>
    <text x="541" y="287" font-size="13" fill="#263746" text-anchor="start">ṁrel ≈ 18,81 kg/s</text>
    <text x="541" y="308" font-size="13" fill="#263746" text-anchor="start">Fₓ = ṁrel(c₁ − u) ≈ 282 N</text>
    <text x="540" y="348" font-size="12" fill="#263746" text-anchor="start" font-weight="700">Rad samo u smjeru gibanja</text>
    <text x="541" y="370" font-size="13" fill="#263746" text-anchor="start">P = Fₓu ≈ 2,540 kW</text>
    <text x="541" y="391" font-size="13" fill="#263746" text-anchor="start">Usporedi granice u = 0 i u = c₁.</text>
  </g>
</svg>
