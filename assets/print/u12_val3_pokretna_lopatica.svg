<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="title">U12 Val 3 - pokretna ravna lopatica</title>
  <desc id="desc">Mlaz iz sapnice udara u ravnu lopaticu koja se giba u istom smjeru, s jasno označenim brzinama mlaza, brzinom lopatice i silom koju mlaz predaje lopatici.</desc>
  <rect width="980" height="420" fill="#ffffff"/>
  <rect x="28" y="28" width="924" height="364" rx="18" fill="#ffffff" stroke="#c9d2d8" stroke-width="2"/>

  <text x="58" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#173043">U12 - Pokretna ravna lopatica u mlazu</text>
  <text x="58" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#516677">Pokretni element čita se preko relativnog dotoka $c_1-u$, ne preko punog protoka sapnice.</text>

  <rect x="108" y="190" width="88" height="42" rx="10" fill="#d9e3ea" stroke="#5b6770" stroke-width="2.5"/>
  <rect x="86" y="202" width="22" height="18" fill="#b9c8d3" stroke="#5b6770" stroke-width="2"/>
  <rect x="196" y="202" width="18" height="18" fill="#b9c8d3" stroke="#5b6770" stroke-width="2"/>
  <line x1="214" y1="211" x2="356" y2="211" stroke="#1565c0" stroke-width="18" stroke-linecap="round"/>
  <line x1="214" y1="211" x2="356" y2="211" stroke="#d9edf4" stroke-width="10" stroke-linecap="round"/>
  <line x1="214" y1="211" x2="356" y2="211" stroke="#5b6770" stroke-width="2" stroke-linecap="round"/>

  <rect x="254" y="160" width="70" height="26" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="277" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">d</text>
  <line x1="240" y1="190" x2="240" y2="232" stroke="#8b5e3c" stroke-width="3" marker-start="url(#arrowBrown)" marker-end="url(#arrowBrown)"/>

  <line x1="246" y1="144" x2="340" y2="144" stroke="#1565c0" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <rect x="262" y="112" width="94" height="26" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="280" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">c_1</text>

  <rect x="620" y="156" width="18" height="120" fill="#d9e3ea" stroke="#5b6770" stroke-width="2.5"/>
  <rect x="612" y="276" width="34" height="18" fill="#b9c8d3" stroke="#5b6770" stroke-width="2"/>
  <line x1="638" y1="292" x2="690" y2="292" stroke="#5b6770" stroke-width="2"/>
  <line x1="692" y1="292" x2="708" y2="292" stroke="#5b6770" stroke-width="2"/>

  <rect x="574" y="116" width="82" height="26" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="606" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">u</text>
  <line x1="570" y1="144" x2="668" y2="144" stroke="#b42318" stroke-width="5" marker-end="url(#arrowRed)"/>

  <rect x="472" y="174" width="118" height="28" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="488" y="193" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">pokretni CV</text>
  <rect x="420" y="150" width="260" height="136" rx="10" fill="none" stroke="#8b5e3c" stroke-width="3" stroke-dasharray="10 7"/>

  <line x1="356" y1="211" x2="620" y2="211" stroke="#1565c0" stroke-width="6" marker-end="url(#arrowBlue)"/>
  <rect x="430" y="240" width="100" height="28" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="448" y="259" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">c_1 - u</text>

  <line x1="620" y1="211" x2="760" y2="211" stroke="#8e24aa" stroke-width="5" marker-end="url(#arrowMagenta)"/>
  <rect x="676" y="178" width="66" height="26" rx="6" fill="#ffffff" stroke="#d8c7e2" stroke-width="1.5"/>
  <text x="694" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#8e24aa">F</text>

  <rect x="708" y="108" width="194" height="176" rx="12" fill="#f8fafb" stroke="#d6dde2" stroke-width="1.5"/>
  <text x="730" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#173043">Čitanje skice</text>
  <text x="730" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">1. U pokretni CV ulazi samo relativni dotok</text>
  <text x="730" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">2. Izlazna brzina po osi x pada na u</text>
  <text x="730" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">3. Sila i snaga slijede iz te razlike</text>
  <text x="730" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#516677">Vektori brzine i gibanja lopatice odvojeni su od</text>
  <text x="730" y="276" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#516677">same geometrije da bi relativni tok ostao čitljiv.</text>

  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#1565c0"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#b42318"/>
    </marker>
    <marker id="arrowMagenta" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#8e24aa"/>
    </marker>
    <marker id="arrowBrown" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L0,8 L8,4 z" fill="#8b5e3c"/>
    </marker>
  </defs>
</svg>