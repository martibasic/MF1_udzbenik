<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 32 462 302" role="img" aria-labelledby="u13hc_title u13hc_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:462px;height:auto;">
  <title id="u13hc_title">Petlja gradske vodovodne mreže A–B–C–D</title>
  <desc id="u13hc_desc">Četiri čvora spojena cijevima u zatvorenu petlju. U čvor A ulazi 40 L/s, u čvorovima B, C i D izlaze potrošnje 12, 16 i 12 L/s. Duljine strelica dotoka i potrošnji razmjerne su protocima 40 : 12 : 16 : 12. Uz svaku cijev navedeni su unutarnji promjer i duljina; širine provrta nacrtane su razmjerno promjerima 150, 100, 125 i 150 mm (uvećano prema duljinama), a duljine cijevi nisu u mjerilu. Kružna strelica u sredini označuje obilazni smjer A–B–C–D u kojem se protoci broje pozitivno. Promjeri cijevi uvećani su prema duljinama; nije prikazan rezultat.</desc>
  <defs>
    <marker id="u13hc_vopen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#356b83" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <pattern id="u13hc_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.8" />
    </pattern>
    <marker id="u13hc_v" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
    </marker>
    <marker id="u13hc_loop" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#657781" />
    </marker>
  </defs>
  <g id="u13hc_title-scene-1" transform="translate(0 0)">
    <g font-family="Arial, Liberation Sans, sans-serif" fill="#3a4a56">
      <g id="u13hc_networkouter" fill="none" stroke="#3a4a56" stroke-linecap="butt">
        <path id="u13hc_outerAB" d="M178.5 90 L349.1667 90" stroke-width="23" />
        <path id="u13hc_outerBC" d="M340 78.5 L340 280.3333" stroke-width="18.3333" />
        <path id="u13hc_outerCD" d="M349.1667 270 L178.5 270" stroke-width="20.6667" />
        <path id="u13hc_outerDA" d="M190 280.3333 L190 78.5" stroke-width="23" />
      </g>
      <g fill="none" stroke="url(#u13hc_hatch)" stroke-linecap="butt">
        <path d="M179.5 90 L348.1667 90" stroke-width="21" />
        <path d="M340 79.5 L340 279.3333" stroke-width="16.3333" />
        <path d="M348.1667 270 L179.5 270" stroke-width="18.6667" />
        <path d="M190 279.3333 L190 79.5" stroke-width="21" />
      </g>
      <g id="u13hc_networkfluid" fill="none" stroke="#dcebf1" stroke-linecap="butt">
        <path id="u13hc_fluidAB" d="M183 90 L344.6667 90" stroke="#dcebf1" stroke-width="14" />
        <path id="u13hc_fluidBC" d="M340 83 L340 275.8333" stroke="#dcebf1" stroke-width="9.3333" />
        <path id="u13hc_fluidCD" d="M344.6667 270 L183 270" stroke="#dcebf1" stroke-width="11.6667" />
        <path id="u13hc_fluidDA" d="M190 275.8333 L190 83" stroke="#dcebf1" stroke-width="14" />
      </g>
      <circle id="u13hc_nodeA" cx="190" cy="90" r="4" fill="#356b83" />
      <circle id="u13hc_nodeB" cx="340" cy="90" r="4" fill="#356b83" />
      <circle id="u13hc_nodeC" cx="340" cy="270" r="4" fill="#356b83" />
      <circle id="u13hc_nodeD" cx="190" cy="270" r="4" fill="#356b83" />
      <text x="174" y="76" font-size="13" fill="#263746" text-anchor="middle" font-weight="700">A</text>
      <text x="356" y="76" font-size="13" fill="#263746" text-anchor="middle" font-weight="700">B</text>
      <text x="356" y="292" font-size="13" fill="#263746" text-anchor="middle" font-weight="700">C</text>
      <text x="174" y="292" font-size="13" fill="#263746" text-anchor="middle" font-weight="700">D</text>
      <path id="u13hc_inflowA" d="M50 90 L174 90" fill="none" stroke="#356b83" stroke-width="1.6" marker-end="url(#u13hc_vopen)" data-mf1-vector="velocity" />
      <text x="40" y="80" font-size="11" fill="#263746" text-anchor="start"><tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.75em">A</tspan> = 40 L/s</text>
      <path id="u13hc_outflowB" d="M356 90 L393 90" fill="none" stroke="#356b83" stroke-width="1.6" marker-end="url(#u13hc_vopen)" data-mf1-vector="velocity" />
      <text x="364" y="110" font-size="11" fill="#263746" text-anchor="start"><tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.75em">B</tspan> = 12 L/s</text>
      <path id="u13hc_outflowC" d="M356 270 L406 270" fill="none" stroke="#356b83" stroke-width="1.6" marker-end="url(#u13hc_vopen)" data-mf1-vector="velocity" />
      <text x="364" y="254" font-size="11" fill="#263746" text-anchor="start"><tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.75em">C</tspan> = 16 L/s</text>
      <path id="u13hc_outflowD" d="M174 270 L137 270" fill="none" stroke="#356b83" stroke-width="1.6" marker-end="url(#u13hc_vopen)" data-mf1-vector="velocity" />
      <text x="166" y="254" font-size="11" fill="#263746" text-anchor="end"><tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.75em">D</tspan> = 12 L/s</text>
      <text x="265" y="64" font-size="11" fill="#263746" text-anchor="middle">AB: <tspan font-style="italic">D</tspan> = 150 mm, <tspan font-style="italic">L</tspan> = 300 m</text>
      <text x="376" y="180" font-size="11" fill="#263746" text-anchor="start">BC: <tspan font-style="italic">D</tspan> = 100 mm</text>
      <text x="376" y="195" font-size="11" fill="#263746" text-anchor="start"><tspan font-style="italic">L</tspan> = 250 m</text>
      <text x="265" y="310" font-size="11" fill="#263746" text-anchor="middle">CD: <tspan font-style="italic">D</tspan> = 125 mm, <tspan font-style="italic">L</tspan> = 200 m</text>
      <text x="152" y="180" font-size="11" fill="#263746" text-anchor="end">DA: <tspan font-style="italic">D</tspan> = 150 mm</text>
      <text x="152" y="195" font-size="11" fill="#263746" text-anchor="end"><tspan font-style="italic">L</tspan> = 350 m</text>
      <path id="u13hc_loopDirection" d="M241 180 Q241 150 265 150 Q289 150 289 180" fill="none" stroke="#657781" stroke-width="1.6" marker-end="url(#u13hc_loop)" data-mf1-role="path" />
      <text x="265" y="202" font-size="11" fill="#263746" text-anchor="middle">obilazni smjer</text>
      <text x="265" y="218" font-size="11" fill="#263746" text-anchor="middle"><tspan font-style="italic">Q</tspan> &gt; 0</text>
    </g>
