<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
<defs>
  <marker id="u13c1spm_u13c1-ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0f766e"/></marker>
  <marker id="u13c1spm_u13c1-ao" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#b45309"/></marker>
  <marker id="u13c1spm_u13c1-ao2" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0,0 3,8 6" fill="#b45309"/></marker>
  <linearGradient id="u13c1spm_u13c1-waterA" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d4eef8"/><stop offset="100%" stop-color="#7ec8e8"/></linearGradient>
  <linearGradient id="u13c1spm_u13c1-waterB" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c5e8f5"/><stop offset="100%" stop-color="#6ab8d6"/></linearGradient>
</defs>
<rect width="940" height="430" fill="#ffffff"/>
<rect x="24" y="24" width="892" height="382" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>
<text x="54" y="55" font-family="'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#173043">Serijsko-paralelna mreža između dvaju spremnika</text>
<text x="54" y="76" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#516677">H = h_{w,0} + h_{w,p} + h_{w,3}  ·  Q = Q₁ + Q₂  ·  h_{w,1} = h_{w,2}</text>

<!-- Tank A (left, high level z_A): x=40..112, y=100..320 -->
<rect x="40" y="100" width="72" height="220" rx="6" fill="none" stroke="#2d3a40" stroke-width="2.5"/>
<rect x="42" y="124" width="68" height="194" fill="url(#u13c1spm_u13c1-waterA)"/>
<line x1="40" y1="124" x2="112" y2="124" stroke="#1565c0" stroke-width="2"/>
<text x="76" y="115" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#173043" text-anchor="middle">A</text>

<!-- Tank B (right, lower level z_B): x=828..900, y=168..320 -->
<rect x="828" y="168" width="72" height="152" rx="6" fill="none" stroke="#2d3a40" stroke-width="2.5"/>
<rect x="830" y="200" width="68" height="118" fill="url(#u13c1spm_u13c1-waterB)"/>
<line x1="828" y1="200" x2="900" y2="200" stroke="#1565c0" stroke-width="2"/>
<text x="864" y="188" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#173043" text-anchor="middle">B</text>

<!-- Node C (left junction, x=264): circle -->
<circle cx="264" cy="248" r="9" fill="#f59e0b" stroke="#92400e" stroke-width="2"/>
<text x="248" y="236" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#173043">C</text>

<!-- Node D (right junction, x=676): circle -->
<circle cx="676" cy="248" r="9" fill="#f59e0b" stroke="#92400e" stroke-width="2"/>
<text x="682" y="236" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#173043">D</text>

<!-- Entry pipe A→C: y=241..255, x=112..255 -->
<rect x="112" y="241" width="144" height="22" fill="url(#u13c1spm_u13c1-waterA)" stroke="#2d3a40" stroke-width="2.5"/>
<!-- Q arrow in entry pipe -->
<line x1="144" y1="252" x2="196" y2="252" stroke="#0f766e" stroke-width="2.5" marker-end="url(#u13c1spm_u13c1-ag)"/>
<text x="155" y="235" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#0f766e">Q</text>
<text x="188" y="270" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#173043" text-anchor="middle">L₀, D₀</text>

<!-- Pipe 1 (upper, C→D): y=204..226, x=273..667 -->
<rect x="273" y="206" width="394" height="20" fill="url(#u13c1spm_u13c1-waterA)" stroke="#2d3a40" stroke-width="2.5"/>
<!-- Q1 arrow in pipe 1 -->
<line x1="380" y1="216" x2="460" y2="216" stroke="#0f766e" stroke-width="2.5" marker-end="url(#u13c1spm_u13c1-ag)"/>
<text x="420" y="198" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">Q₁</text>
<text x="420" y="186" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#173043" text-anchor="middle">L₁, D₁</text>

<!-- Pipe 2 (lower, C→D): y=258..284, x=273..667 -->
<rect x="273" y="258" width="394" height="24" fill="url(#u13c1spm_u13c1-waterB)" stroke="#2d3a40" stroke-width="2.5"/>
<!-- Q2 arrow in pipe 2 -->
<line x1="380" y1="270" x2="460" y2="270" stroke="#0f766e" stroke-width="2.5" marker-end="url(#u13c1spm_u13c1-ag)"/>
<text x="420" y="302" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">Q₂</text>
<text x="420" y="316" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#173043" text-anchor="middle">L₂, D₂</text>

<!-- Exit pipe D→B: y=241..255, x=685..828 -->
<rect x="685" y="241" width="143" height="22" fill="url(#u13c1spm_u13c1-waterA)" stroke="#2d3a40" stroke-width="2.5"/>
<!-- Q arrow in exit pipe -->
<line x1="726" y1="252" x2="800" y2="252" stroke="#0f766e" stroke-width="2.5" marker-end="url(#u13c1spm_u13c1-ag)"/>
<text x="756" y="235" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#0f766e">Q</text>
<text x="756" y="270" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#173043" text-anchor="middle">L₃, D₃</text>

<!-- H level difference -->
<line x1="127" y1="124" x2="127" y2="200" stroke="#b45309" stroke-width="2.5" marker-start="url(#u13c1spm_u13c1-ao2)" marker-end="url(#u13c1spm_u13c1-ao)"/>
<text x="139" y="166" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#b45309">H</text>

<!-- h_0 label (series entry loss) -->
<text x="188" y="224" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b42318" text-anchor="middle" font-style="italic">h_{w,0}</text>

<!-- h_p label (parallel loss) -->
<text x="470" y="248" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#b42318" text-anchor="middle" font-style="italic">h_{w,1} = h_{w,2} = h_{w,p}</text>

<!-- h_3 label (series exit loss) -->
<text x="756" y="224" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b42318" text-anchor="middle" font-style="italic">h_{w,3}</text>

<!-- Info panel right -->
<rect x="44" y="340" width="860" height="74" rx="8" fill="#fffef6" stroke="#c49a0a" stroke-width="1.5"/>
<text x="60" y="362" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#173043">Redoslijed rješavanja:</text>
<text x="60" y="382" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1e293b">(1) Pretpostavi Q₁ : Q₂ → (2) Izjednači h_{w,1} = h_{w,2} → (3) Nađi h_{w,p} → (4) Provjeri H = h_{w,0} + h_{w,p} + h_{w,3}</text>
<text x="60" y="402" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677" font-style="italic">Q_tot = Q₁ + Q₂  i  h_{w,1} = K₁Q₁² = K₂Q₂²  →  omjer Q₁/Q₂ = √(K₂/K₁)</text>
</svg>