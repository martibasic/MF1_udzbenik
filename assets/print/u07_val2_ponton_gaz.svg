    <text x="252.0" y="142" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#c0392b" text-anchor="start">G<tspan baseline-shift="sub" font-size="0.7em">uk</tspan>
    </text>
    <line x1="60" y1="239.41269205076821" x2="70" y2="239.41269205076821" stroke="#b7600c" stroke-width="0.8" />
    <line x1="60" y1="313.0126920507682" x2="70" y2="313.0126920507682" stroke="#b7600c" stroke-width="0.8" />
