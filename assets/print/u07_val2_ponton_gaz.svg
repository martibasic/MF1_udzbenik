    <text x="432" y="293.0063460253841" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b7600c" text-anchor="start">h</text>
    <line x1="102.0" y1="425" x2="102.0" y2="435" stroke="#b7600c" stroke-width="0.8" />
    <line x1="378.0" y1="425" x2="378.0" y2="435" stroke="#b7600c" stroke-width="0.8" />
    <line x1="102.0" y1="430" x2="378.0" y2="430" stroke="#b7600c" stroke-width="1.2" marker-start="url(#u07v2pg_fix_dimL)" marker-end="url(#u07v2pg_fix_dim)" />
    <text x="240.0" y="448" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b7600c" text-anchor="middle">B = 1,20 m</text>
    <text x="240" y="50" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#3a4a56" text-anchor="middle" font-weight="700">Ponton s opremom; poprečni presjek</text>
    <text x="240" y="463" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#3a4a56" text-anchor="middle">L = 2,40 m; isti pravac ukupne težine i uzgona.</text>
