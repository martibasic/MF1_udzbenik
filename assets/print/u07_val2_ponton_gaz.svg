<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380" role="img" aria-labelledby="u07v2pg_u7v2T" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u07v2pg_u7v2T">U07 Val 2 – Ponton i gaz pri simetričnom opterećenju</title>
  <defs>
    <linearGradient id="u07v2pg_u7v2Wg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4eef8"/>
      <stop offset="100%" stop-color="#7ec8e8"/>
    </linearGradient>
    <marker id="u07v2pg_u7v2AG" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
    </marker>
    <marker id="u07v2pg_u7v2AR" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#b42318"/>
    </marker>
    <marker id="u07v2pg_u7v2AD" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#546e7a"/>
    </marker>
    <marker id="u07v2pg_u7v2ADR" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L8,3 z" fill="#546e7a"/>
    </marker>
  </defs>
  <rect width="940" height="380" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="332" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>

  <!-- ── LEFT PANEL: cross-section ── -->
  <!-- Water background (below waterline y=190) -->
  <rect x="40" y="190" width="480" height="160" fill="url(#u07v2pg_u7v2Wg)" opacity="0.6"/>
  <!-- Waterline -->
  <line x1="40" y1="190" x2="520" y2="190" stroke="#1565c0" stroke-width="2"/>
  <text x="44" y="185" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1565c0">p.p.</text>
  <!-- Ponton body: B=200px (1.20m×167px/m), centered at x=280 -->
  <!-- H=53px (0.32m×167px/m), gaz h=35px (0.209m), free board 18px -->
  <!-- Ponton top y=190-18=172, bottom y=190+35=225 -->
  <rect x="180" y="172" width="200" height="53" rx="3" fill="#b0bec5" stroke="#37474f" stroke-width="2.5"/>
  <!-- Equipment on top (symmetric) -->
  <rect x="255" y="152" width="50" height="20" rx="3" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <text x="261" y="165" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#173043">m_o</text>
  <!-- G arrow (red, downward) — from above load to waterline level -->
  <line x1="280" y1="140" x2="280" y2="195" stroke="#b42318" stroke-width="3.5" marker-end="url(#u07v2pg_u7v2AR)"/>
  <text x="286" y="158" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#b42318">G</text>
  <!-- F_U arrow (green, upward) — from ponton bottom upward -->
  <line x1="280" y1="238" x2="280" y2="184" stroke="#0f766e" stroke-width="3.5" marker-end="url(#u07v2pg_u7v2AG)"/>
  <text x="286" y="238" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#0f766e">F_U</text>

  <!-- ── DIMENSION LINES ── -->
  <!-- H total (right side) -->
  <line x1="392" y1="172" x2="392" y2="225" stroke="#546e7a" stroke-width="1.5" marker-start="url(#u07v2pg_u7v2ADR)" marker-end="url(#u07v2pg_u7v2AD)"/>
  <text x="398" y="202" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#546e7a">H = 0,32 m</text>
  <!-- h gaz (right side, further out) -->
  <line x1="416" y1="190" x2="416" y2="225" stroke="#546e7a" stroke-width="1.5" marker-start="url(#u07v2pg_u7v2ADR)" marker-end="url(#u07v2pg_u7v2AD)"/>
  <text x="422" y="212" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#546e7a">h=0,209 m</text>
  <!-- Free board (left side) -->
  <line x1="168" y1="172" x2="168" y2="190" stroke="#546e7a" stroke-width="1.5" marker-start="url(#u07v2pg_u7v2ADR)" marker-end="url(#u07v2pg_u7v2AD)"/>
  <text x="100" y="184" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#546e7a">H−h=0,111m</text>
  <!-- B width (bottom) -->
  <line x1="180" y1="246" x2="380" y2="246" stroke="#546e7a" stroke-width="1.5" marker-start="url(#u07v2pg_u7v2ADR)" marker-end="url(#u07v2pg_u7v2AD)"/>
  <text x="254" y="260" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#546e7a">B = 1,20 m</text>
  <!-- L note -->
  <text x="100" y="280" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#8090a0">L = 2,40 m (⊥ na skicu)</text>

  <!-- ── FORMULA BOX (right panel) ── -->
  <rect x="532" y="95" width="354" height="245" rx="10" fill="#fffef6" stroke="#c49a0a" stroke-width="1.8"/>
  <text x="554" y="120" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">Ključni rezultati</text>
  <line x1="554" y1="128" x2="878" y2="128" stroke="#e8d89a" stroke-width="1"/>
  <text x="554" y="148" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#516677">m_p = 420 kg,  m_o = 180 kg</text>
  <text x="554" y="167" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">m_uk = 600 kg</text>
  <line x1="554" y1="177" x2="878" y2="177" stroke="#e8d89a" stroke-width="1"/>
  <text x="554" y="197" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">V = m / ρ = 0,601 m³</text>
  <text x="554" y="217" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">h = V / (L·B) = 0,209 m</text>
  <text x="554" y="237" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">H − h = 0,111 m  (slobodni bok)</text>
  <line x1="554" y1="247" x2="878" y2="247" stroke="#e8d89a" stroke-width="1"/>
  <text x="554" y="267" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">Δm_max = ρ · L · B · (H−h)</text>
  <text x="554" y="287" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">Δm_max ≈ 320 kg</text>
  <text x="554" y="325" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677">Simetričan slučaj: nema nagiba,</text>
  <text x="554" y="341" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677">G i F_U djeluju na istoj osi.</text>
</svg>