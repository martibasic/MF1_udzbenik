<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="u07v2pg_title u07v2pg_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:880px;height:auto;">
  <title id="u07v2pg_title">Ponton i gaz pri simetričnom opterećenju</title>
  <desc id="u07v2pg_desc">Lijevo: poprečni presjek pravokutnog pontona širine B = 1,20 m i visine boka H = 0,32 m koji pliva na vodi sa simetričnim teretom m_o = 180 kg na palubi; gaz h = 0,209 m, slobodni bok H−h = 0,111 m, težina G prema dolje i uzgon F_U prema gore. Desno: četiri koraka rješenja s ukupnom masom, istisnutim volumenom, srednjim gazom i dodatnom dopuštenom masom prije zalijevanja.</desc>

  <defs>
    <linearGradient id="u07v2pg_voda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aed6f1" />
      <stop offset="1" stop-color="#5b9ec9" />
    </linearGradient>
    <pattern id="u07v2pg_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.1" />
    </pattern>
    <marker id="u07v2pg_g" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#c0392b" />
    </marker>
    <marker id="u07v2pg_fu" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1e8449" />
    </marker>
    <marker id="u07v2pg_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u07v2pg_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
  </defs>

  <!-- pozadina + dva panela -->
  <rect x="16" y="16" width="868" height="438" rx="14" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.4" />
  <line x1="438" y1="40" x2="438" y2="430" stroke="#dce7f0" stroke-width="1.2" stroke-dasharray="4,5" />

  <!-- ===================== LIJEVO: popre&#269;ni presjek pontona ===================== -->
  <!-- Koordinatne reference (mental model):
       waterline y = 270
       ponton dno (bottom) y = 270 + 73 = 343  (gaz h = 0,209 m -> 73 px)
       ponton vrh (top)    y = 343 - 112 = 231  (visina H = 0,32 m -> 112 px)
       slobodni bok H-h    = 231..270 = 39 px (= 0,111 m)
       ponton lijevo x = 138, desno x = 360  (sirina B = 1,20 m -> 222 px)
       skala: 1 m = 350 px (priblizno); ali se gaz/H mjere konzistentno (1 m = 350 px) -->

  <!-- vodena masa (lijevo i desno + ispod pontona, kontinuirana) -->
  <rect x="40" y="270" width="98" height="120" fill="url(#u07v2pg_voda)" />
  <rect x="360" y="270" width="58" height="120" fill="url(#u07v2pg_voda)" />
  <rect x="40" y="343" width="378" height="47" fill="url(#u07v2pg_voda)" />

  <!-- slobodna povrsina (mirna razina vode) -->
  <line x1="40" y1="270" x2="138" y2="270" stroke="#1565c0" stroke-width="2" />
  <line x1="360" y1="270" x2="418" y2="270" stroke="#1565c0" stroke-width="2" />
  <!-- (povrsinske valovite oznake izostavljene radi citljivosti) -->

  <!-- dno bazena (referentna povrsina za vodu) -->
  <rect x="40" y="390" width="378" height="10" fill="url(#u07v2pg_hatch)" stroke="#3a4a56" stroke-width="1" />

  <!-- oznaka razine vode (p.p.) -->
  <!-- PONTON (kutija s tankim stijenkama, otvoren odozgo za teret) -->
  <!-- vanjska stijenka -->
  <rect x="138" y="231" width="222" height="112" fill="#eef2f5" stroke="#3a4a56" stroke-width="1.8" />
  <!-- unutrasnja "supljina" pontona (osvjetljava da je to plovak, ne puni blok) -->
  <rect x="146" y="239" width="206" height="96" fill="#ffffff" stroke="#909fa8" stroke-width="0.8" />
  <!-- vodoravne rebraste linije po palubi za teksturu (dno boka iznad gaza) -->
  <line x1="146" y1="270" x2="352" y2="270" stroke="#7a8a96" stroke-width="0.6" stroke-dasharray="3,3" opacity="0.5" />

  <!-- TERET m_o na palubi pontona (simetri&#269;no centriran) -->
  <!-- sanduk -->
  <rect x="206" y="186" width="86" height="45" fill="#c8a063" stroke="#7a4f1c" stroke-width="1.4" />
  <line x1="206" y1="200" x2="292" y2="200" stroke="#7a4f1c" stroke-width="0.8" />
  <line x1="249" y1="186" x2="249" y2="231" stroke="#7a4f1c" stroke-width="0.8" />
  <!-- TEZINA G (crvena, prema dolje); jednaka po iznosu kao F_U pa neka i strelica bude jednake duljine ~60 px -->
  <line x1="249" y1="120" x2="249" y2="180" stroke="#c0392b" stroke-width="2.6" marker-end="url(#u07v2pg_g)" />
  <!-- UZGON F_U (zelena, prema gore, ispod pontona); ista duljina kao G strelica (~60 px) -->
  <line x1="249" y1="392" x2="249" y2="358" stroke="#1e8449" stroke-width="2.6" marker-end="url(#u07v2pg_fu)" />
  <!-- os simetrije (referenta isprekidana unutar pontona) -->
  <line x1="249" y1="240" x2="249" y2="335" stroke="#7a8a96" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.6" />

  <!-- TEZINA pontona m_p oznaka na boku -->
  <!-- ===== KOTE ===== -->

  <!-- Kota H (visina boka) - lijevo od pontona -->
  <!-- Kota h (gaz) - desno od pontona, blize -->
  <!-- Kota H-h (slobodni bok) - desno od pontona, stack u uskom prostoru -->
  <!-- Kota B (sirina pontona) - ispod -->
  <!-- napomena o L (perpendikularno na presjek) -->
  <!-- ===================== DESNO: PANEL S RJESENJEM ===================== -->

  <!-- header bar -->
  <rect x="456" y="50" width="412" height="32" rx="8" fill="#1565c0" />
  <!-- Korak 1: ukupna masa -->
  <rect x="456" y="92" width="412" height="72" rx="9" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="456" y="92" width="6" height="72" rx="3" fill="#1565c0" />
  <!-- Korak 2: istisnuti volumen -->
  <rect x="456" y="172" width="412" height="72" rx="9" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="456" y="172" width="6" height="72" rx="3" fill="#1565c0" />
  <!-- Korak 3: srednji gaz -->
  <rect x="456" y="252" width="412" height="72" rx="9" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="456" y="252" width="6" height="72" rx="3" fill="#1565c0" />
  <!-- Korak 4: dodatna masa -->
  <rect x="456" y="332" width="412" height="72" rx="9" fill="#fdf8f2" stroke="#ecd9c2" stroke-width="1.2" />
  <!-- Sazetak / komentar -->
  <!-- Rezultati badge -->
  <rect x="456" y="436" width="412" height="14" rx="4" fill="#e8f5e9" stroke="#1e8449" stroke-width="1.2" />
  <line x1="138" y1="231" x2="92" y2="231" stroke="#b7600c" stroke-width="0.7" />
  <line x1="138" y1="343" x2="92" y2="343" stroke="#b7600c" stroke-width="0.7" />
  <line x1="95" y1="231" x2="95" y2="343" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u07v2pg_dimL)" marker-end="url(#u07v2pg_dim)" />
  <line x1="360" y1="270" x2="402" y2="270" stroke="#b7600c" stroke-width="0.7" />
  <line x1="360" y1="343" x2="402" y2="343" stroke="#b7600c" stroke-width="0.7" />
  <line x1="399" y1="270" x2="399" y2="343" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u07v2pg_dimL)" marker-end="url(#u07v2pg_dim)" />
  <line x1="360" y1="231" x2="424" y2="231" stroke="#b7600c" stroke-width="0.7" />
  <line x1="360" y1="270" x2="424" y2="270" stroke="#b7600c" stroke-width="0.7" />
  <line x1="421" y1="231" x2="421" y2="270" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u07v2pg_dimL)" marker-end="url(#u07v2pg_dim)" />
  <line x1="138" y1="343" x2="138" y2="412" stroke="#b7600c" stroke-width="0.7" />
  <line x1="360" y1="343" x2="360" y2="412" stroke="#b7600c" stroke-width="0.7" />
  <line x1="141" y1="409" x2="357" y2="409" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u07v2pg_dimL)" marker-end="url(#u07v2pg_dim)" />
  <rect x="456" y="332" width="6" height="72" rx="3" fill="#b7600c" />
  <text x="40" y="58" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Poprečni presjek pontona (simetričan teret)</text>

  <text x="46" y="263" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-style="italic" fill="#1565c0">slobodna površina</text>
  <text x="68" y="386" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-style="italic" fill="#0d47a1">voda  ρ = 998 kg/m³</text>

  <text x="249" y="213" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#3a2810"><tspan font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="0.7em">o</tspan> = 180 kg</text>

  <text x="257" y="138" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#c0392b"><tspan font-style="italic" font-weight="700">G</tspan> = (<tspan font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="0.7em">p</tspan>+<tspan font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="0.7em">o</tspan>)<tspan font-style="italic">g</tspan></text>
  <text x="257" y="156" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#c0392b">≈ 5,886 kN</text>

  <text x="257" y="376" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#1e8449"><tspan font-style="italic" font-weight="700">F</tspan><tspan baseline-shift="sub" font-size="0.7em">U</tspan> = ρ<tspan font-style="italic">gV</tspan> ≈ 5,886 kN</text>

  <text x="158" y="320" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#3a4a56"><tspan font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="0.7em">p</tspan> = 420 kg</text>

  <text x="40" y="446" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" fill="#5a6a78"><tspan font-style="italic">L</tspan> = 2,40 m (okomito na ravninu skice)</text>

  <text x="662" y="71" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#ffffff">Vertikalna ravnoteža: <tspan font-style="italic">G</tspan> = <tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">U</tspan> → ρ<tspan font-style="italic">gV</tspan> = <tspan font-style="italic">mg</tspan></text>

  <text x="662" y="111" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">1. Ukupna masa sustava</text>
  <text x="662" y="133" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">m</tspan> = <tspan font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="0.7em">p</tspan> + <tspan font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="0.7em">o</tspan> = 420 + 180</text>
  <text x="662" y="154" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0"><tspan font-style="italic">m</tspan> = 600 kg</text>

  <text x="662" y="191" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">2. Istisnuti volumen</text>
  <text x="662" y="213" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">V</tspan> = <tspan font-style="italic">m</tspan> / ρ = 600 / 998</text>
  <text x="662" y="234" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0"><tspan font-style="italic">V</tspan> ≈ 0,601 m³</text>

  <text x="662" y="271" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">3. Srednji gaz pontona</text>
  <text x="662" y="293" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">h</tspan> = <tspan font-style="italic">V</tspan> / (<tspan font-style="italic">L</tspan>·<tspan font-style="italic">B</tspan>) = 0,601 / (2,40·1,20)</text>
  <text x="662" y="314" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0"><tspan font-style="italic">h</tspan> ≈ 0,209 m ≈ 20,9 cm</text>

  <text x="662" y="351" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">4. Dodatna masa do zalijevanja (uron <tspan font-style="italic">h</tspan> = <tspan font-style="italic">H</tspan>)</text>
  <text x="662" y="373" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530">Δ<tspan font-style="italic">m</tspan> = ρ<tspan font-style="italic">LB</tspan>(<tspan font-style="italic">H</tspan>−<tspan font-style="italic">h</tspan>) = 920 − 600</text>
  <text x="662" y="394" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b">Δ<tspan font-style="italic">m</tspan> ≈ 320 kg ≈ 3,2·10² kg</text>

  <text x="662" y="424" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">Simetrično opterećenje → nema nagiba; <tspan font-style="italic">G</tspan> i <tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">U</tspan> djeluju na istoj vertikalnoj osi.</text>

  <text x="492" y="447" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#1e8449">REZULTATI</text>
  <text x="588" y="447" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1565c0"><tspan font-style="italic">V</tspan> ≈ 0,601 m³</text>
  <text x="688" y="447" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1565c0"><tspan font-style="italic">h</tspan> ≈ 0,209 m</text>
  <text x="800" y="447" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#c0392b">Δ<tspan font-style="italic">m</tspan> ≈ 320 kg</text>
<text x="84" y="290" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="end" fill="#b7600c"><tspan font-style="italic">H</tspan></text>
  <text x="84.0" y="306.0" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="end" fill="#b7600c">= 0,32 m</text>

  <text x="408" y="306" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#b7600c"><tspan font-style="italic">h</tspan></text>
  <text x="408.0" y="322.0" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b7600c">= 0,209 m</text>

  <text x="416" y="247" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="end" fill="#b7600c"><tspan font-style="italic">H</tspan>−<tspan font-style="italic">h</tspan></text>
  <text x="416" y="259" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" text-anchor="end" fill="#b7600c">0,111 m</text>

  <text x="249" y="427" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">B</tspan> = 1,20 m</text>

  </svg>