  <rect x="456" y="50" width="412" height="32" rx="8" fill="#1565c0" />
  <rect x="456" y="92" width="412" height="72" rx="9" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="456" y="92" width="6" height="72" rx="3" fill="#1565c0" />
