<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 461" role="img" aria-labelledby="u07v2pg_title u07v2pg_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:442px;height:auto;">
  <title id="u07v2pg_title">Ponton s opremom: gaz i vertikalna ravnoteža</title>
  <desc id="u07v2pg_desc">Zatvoren ponton pluta u jednom kontinuiranom području vode. Voda je samo izvan nepropusne ovojnice. Uzgon F-U djeluje kroz centroid istisnutog volumena B unutar trupa, ukupna težina mg (m = m-p + m-o) na istom vertikalnom pravcu i jednakog iznosa. Gaz T je traženi, visina boka H = 0,32 m, širina b = 1,20 m, a duljina L = 2,40 m okomita je na presjek; voda rho = 998 kg/m3.</desc>
  <defs>
