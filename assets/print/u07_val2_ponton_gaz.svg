  <text x="662" y="71" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#ffffff">Vertikalna ravnoteža: <tspan font-style="italic">G</tspan> = <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">U</tspan> → ρ<tspan font-style="italic">gV</tspan> = <tspan font-style="italic">mg</tspan>
  </text>
  <text x="662" y="111" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">1. Ukupna masa sustava</text>
  <text x="662" y="133" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530">
    <tspan font-style="italic">m</tspan> = <tspan font-style="italic">m</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">p</tspan> + <tspan font-style="italic">m</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">o</tspan> = 420 + 180</text>
  <text x="662" y="154" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">
    <tspan font-style="italic">m</tspan> = 600 kg</text>
  <text x="662" y="191" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">2. Istisnuti volumen</text>
  <text x="662" y="213" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530">
    <tspan font-style="italic">V</tspan> = <tspan font-style="italic">m</tspan> / ρ = 600 / 998</text>
  <text x="662" y="234" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">
    <tspan font-style="italic">V</tspan> ≈ 0,601 m³</text>
  <text x="662" y="271" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">3. Srednji gaz pontona</text>
  <text x="662" y="293" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530">
    <tspan font-style="italic">h</tspan> = <tspan font-style="italic">V</tspan> / (<tspan font-style="italic">L</tspan>·<tspan font-style="italic">B</tspan>) = 0,601 / (2,40·1,20)</text>
  <text x="662" y="314" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">
    <tspan font-style="italic">h</tspan> ≈ 0,209 m ≈ 20,9 cm</text>
  <text x="662" y="351" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">4. Dodatna masa do zalijevanja (uron <tspan font-style="italic">h</tspan> = <tspan font-style="italic">H</tspan>)</text>
  <text x="662" y="373" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530">Δ<tspan font-style="italic">m</tspan> = ρ<tspan font-style="italic">LB</tspan>(<tspan font-style="italic">H</tspan>−<tspan font-style="italic">h</tspan>) = 920 − 600</text>
  <text x="662" y="394" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b">Δ<tspan font-style="italic">m</tspan> ≈ 320 kg ≈ 3,2·10² kg</text>
  <text x="662" y="424" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">Simetrično opterećenje → nema nagiba; <tspan font-style="italic">G</tspan> i <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">U</tspan> djeluju na istoj vertikalnoj osi.</text>
  <text x="492" y="447" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#1e8449">REZULTATI</text>
  <text x="588" y="447" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1565c0">
    <tspan font-style="italic">V</tspan> ≈ 0,601 m³</text>
  <text x="688" y="447" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1565c0">
    <tspan font-style="italic">h</tspan> ≈ 0,209 m</text>
  <text x="800" y="447" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#c0392b">Δ<tspan font-style="italic">m</tspan> ≈ 320 kg</text>
  <g font-family="'Segoe UI',Arial,sans-serif" />
