    <text x="45" y="354" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b7600c" text-anchor="start">H = 0,32 m</text>
    <line x1="420" y1="265" x2="430" y2="265" stroke="#b7600c" stroke-width="0.8" />
