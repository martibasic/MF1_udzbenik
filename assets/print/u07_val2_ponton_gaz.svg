<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="u07v2pg_title u07v2pg_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:880px;height:auto;">
  <title id="u07v2pg_title">Ponton s opremom: gaz i vertikalna ravnoteža</title>
  <desc id="u07v2pg_desc">Zatvoren ponton pluta u jednom kontinuiranom području vode. Voda je samo izvan nepropusne ovojnice. Uzgon djeluje kroz centroid istisnutog volumena unutar trupa, ukupna težina na istom vertikalnom pravcu. Srednji gaz 0,209 m, visina boka 0,32 m; duljina je okomita na presjek.</desc>
  <defs>
    <pattern id="u07v2pg_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.1" />
    </pattern>
    <marker id="u07v2pg_g" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#356b83" />
    </marker>
    <marker id="u07v2pg_fu" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#356b83" />
    </marker>
    <marker id="u07v2pg_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#356b83" />
    </marker>
    <marker id="u07v2pg_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#356b83" />
    </marker>
    <marker id="u07v2pg_fix_force" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0 0 L0 5 L6 2.5 Z" fill="#356b83" stroke="none" stroke-width="1.2" />
    </marker>
    <marker id="u07v2pg_fix_green" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0 0 L0 5 L6 2.5 Z" fill="#356b83" stroke="none" stroke-width="1.2" />
    </marker>
    <marker id="u07v2pg_fix_normal" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0 0 L0 5 L6 2.5 Z" fill="#356b83" stroke="none" stroke-width="1.2" />
    </marker>
    <marker id="u07v2pg_fix_axis" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0 0 L0 5 L6 2.5 Z" fill="#3a4a56" stroke="none" stroke-width="1.2" />
    </marker>
    <marker id="u07v2pg_fix_dim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0 0 L0 5 L6 2.5 Z" fill="#657781" stroke="none" stroke-width="1.2" />
    </marker>
    <marker id="u07v2pg_fix_dimL" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse">
      <path d="M0 0 L0 5 L6 2.5 Z" fill="#657781" stroke="none" stroke-width="1.2" />
    </marker>
    <pattern id="u07v2pg_fix_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="7" height="7" fill="#d7dee3" stroke="none" stroke-width="1.2" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.1" />
    </pattern>
  </defs>
  <text x="662" y="71" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#263746">Vertikalna ravnoteža: <tspan font-style="italic">G</tspan> = <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">U</tspan> → ρ<tspan font-style="italic">gV</tspan> = <tspan font-style="italic">mg</tspan>
  </text>
  <text x="662" y="111" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">1. Ukupna masa sustava</text>
  <text x="662" y="133" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">m</tspan> = <tspan font-style="italic">m</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">p</tspan> + <tspan font-style="italic">m</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">o</tspan> = 420 + 180</text>
  <text x="662" y="154" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">m</tspan> = 600 kg</text>
  <text x="662" y="191" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">2. Istisnuti volumen</text>
  <text x="662" y="213" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">V</tspan> = <tspan font-style="italic">m</tspan> / ρ = 600 / 998</text>
  <text x="662" y="234" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">V</tspan> ≈ 0,601 m³</text>
  <text x="662" y="271" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">3. Srednji gaz pontona</text>
  <text x="662" y="293" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">h</tspan> = <tspan font-style="italic">V</tspan> / (<tspan font-style="italic">L</tspan>·<tspan font-style="italic">B</tspan>) = 0,601 / (2,40·1,20)</text>
  <text x="662" y="314" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">h</tspan> ≈ 0,209 m ≈ 20,9 cm</text>
  <text x="662" y="351" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">4. Dodatna masa do zalijevanja (uron <tspan font-style="italic">h</tspan> = <tspan font-style="italic">H</tspan>)</text>
  <text x="662" y="373" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">Δ<tspan font-style="italic">m</tspan> = ρ<tspan font-style="italic">LB</tspan>(<tspan font-style="italic">H</tspan>−<tspan font-style="italic">h</tspan>) = 920 − 600</text>
  <text x="662" y="394" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">Δ<tspan font-style="italic">m</tspan> ≈ 320 kg ≈ 3,2·10² kg</text>
  <text x="662" y="424" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#263746">Simetrično opterećenje → nema nagiba; <tspan font-style="italic">G</tspan> i <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">U</tspan> djeluju na istoj vertikalnoj osi.</text>
  <text x="492" y="447" font-family="Arial, Liberation Sans, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#263746">REZULTATI</text>
  <text x="588" y="447" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">V</tspan> ≈ 0,601 m³</text>
  <text x="688" y="447" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">h</tspan> ≈ 0,209 m</text>
  <text x="800" y="447" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#263746">Δ<tspan font-style="italic">m</tspan> ≈ 320 kg</text>
  <g font-family="Arial, Liberation Sans, sans-serif" />
  <g id="u07v2pg_fix_scene">
    <rect x="45" y="265" width="375" height="145" fill="#dcebf1" stroke="none" stroke-width="1.2" />
    <line x1="45" y1="265" x2="420" y2="265" stroke="#356b83" stroke-width="2" id="u07v2pg_fix_free-surface" />
    <polygon points="102.000000,313.012692 378.000000,313.012692 378.000000,239.412692 102.000000,239.412692" fill="#dcebf1" stroke="#3a4a56" stroke-width="2" id="u07v2pg_fix_hull" />
    <polygon points="105.450000,309.562692 374.550000,309.562692 374.550000,242.862692 105.450000,242.862692" fill="#ffffff" stroke="#3a4a56" stroke-width="0.8" />
    <circle cx="240.0" cy="289.00634602538406" r="3.7" fill="#356b83" id="u07v2pg_fix_buoyancy-center" />
    <text x="250.0" y="293.00634602538406" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="start">B</text>
    <polygon points="198.600000,239.412692 281.400000,239.412692 281.400000,209.512692 198.600000,209.512692" fill="#eadfc5" stroke="#356b83" stroke-width="1.4" />
    <text x="240" y="227.91269205076821" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="middle">m<tspan baseline-shift="sub" font-size="0.7em">o</tspan> = 180 kg</text>
    <text x="167" y="291" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="middle">m<tspan baseline-shift="sub" font-size="0.7em">p</tspan> = 420 kg</text>
    <line x1="240.0" y1="289.00634602538406" x2="240.0" y2="247.00634602538406" stroke="#356b83" stroke-width="2.2" marker-end="url(#u07v2pg_fix_green)" />
    <text x="253.0" y="263.00634602538406" font-family="Arial, Liberation Sans, sans-serif" font-size="12" fill="#263746" text-anchor="start">F<tspan baseline-shift="sub" font-size="0.7em">U</tspan>
    </text>
    <line x1="240.0" y1="125" x2="240.0" y2="165" stroke="#356b83" stroke-width="2.2" marker-end="url(#u07v2pg_fix_force)" />
    <text x="252.0" y="142" font-family="Arial, Liberation Sans, sans-serif" font-size="12" fill="#263746" text-anchor="start">G<tspan baseline-shift="sub" font-size="0.7em">uk</tspan>
    </text>
    <line x1="60" y1="239.41269205076821" x2="70" y2="239.41269205076821" stroke="#657781" stroke-width="0.8" />
    <line x1="60" y1="313.0126920507682" x2="70" y2="313.0126920507682" stroke="#657781" stroke-width="0.8" />
    <line x1="65" y1="239.41269205076821" x2="65" y2="313.0126920507682" stroke="#657781" stroke-width="1.2" marker-start="url(#u07v2pg_fix_dimL)" marker-end="url(#u07v2pg_fix_dim)" />
    <text x="45" y="354" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="start">H = 0,32 m</text>
    <line x1="420" y1="265" x2="430" y2="265" stroke="#657781" stroke-width="0.8" />
    <line x1="420" y1="313.0126920507682" x2="430" y2="313.0126920507682" stroke="#657781" stroke-width="0.8" />
    <line x1="425" y1="265" x2="425" y2="313.0126920507682" stroke="#657781" stroke-width="1.2" marker-start="url(#u07v2pg_fix_dimL)" marker-end="url(#u07v2pg_fix_dim)" />
    <text x="432" y="293.0063460253841" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="start">h</text>
    <line x1="102.0" y1="425" x2="102.0" y2="435" stroke="#657781" stroke-width="0.8" />
    <line x1="378.0" y1="425" x2="378.0" y2="435" stroke="#657781" stroke-width="0.8" />
    <line x1="102.0" y1="430" x2="378.0" y2="430" stroke="#657781" stroke-width="1.2" marker-start="url(#u07v2pg_fix_dimL)" marker-end="url(#u07v2pg_fix_dim)" />
    <text x="240.0" y="448" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="middle">B = 1,20 m</text>
    <text x="240" y="50" font-family="Arial, Liberation Sans, sans-serif" font-size="14" fill="#263746" text-anchor="middle" font-weight="700">Ponton s opremom; poprečni presjek</text>
    <text x="240" y="463" font-family="Arial, Liberation Sans, sans-serif" font-size="10" fill="#263746" text-anchor="middle">L = 2,40 m; isti pravac ukupne težine i uzgona.</text>
  </g>
</svg>
