      <text x="240" y="390" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="middle"><tspan font-style="italic">L</tspan> = 2,40 m (okomito na presjek)</text>
      <line x1="420" y1="265" x2="430" y2="265" stroke="#657781" stroke-width="0.8" />
