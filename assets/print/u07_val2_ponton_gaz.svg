<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" role="img" aria-labelledby="u07v2pg_title u07v2pg_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u07v2pg_title">U07 Val 2 - ponton i gaz pri simetričnom opterećenju</title>
  <desc id="u07v2pg_desc">Minimalna tehnička skica pravokutnog pontona s označenim gazom h, visinom boka H, uzgonom i ukupnom težinom pri simetričnom opterećenju.</desc>
  <rect width="940" height="320" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="272" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>

  <line x1="120" y1="168" x2="820" y2="168" stroke="#3a87ad" stroke-width="4"/>
  <text x="830" y="173" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">razina vode</text>

  <rect x="250" y="132" width="400" height="96" rx="10" fill="#dff1f8" stroke="#173043" stroke-width="3"/>
  <rect x="392" y="96" width="116" height="28" rx="6" fill="#f7d8c4" stroke="#c96c35" stroke-width="2"/>
  <text x="414" y="115" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#173043">oprema</text>

  <line x1="674" y1="132" x2="674" y2="228" stroke="#c96c35" stroke-width="3" marker-start="url(#u07v2pg_arrowOrangeSmall)" marker-end="url(#u07v2pg_arrowOrange)"/>
  <text x="686" y="184" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">H</text>

  <line x1="708" y1="168" x2="708" y2="228" stroke="#0f766e" stroke-width="3" marker-start="url(#u07v2pg_arrowGreenSmall)" marker-end="url(#u07v2pg_arrowGreen)"/>
  <text x="720" y="204" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">h</text>

  <line x1="450" y1="82" x2="450" y2="120" stroke="#be123c" stroke-width="4" marker-end="url(#u07v2pg_arrowRed)"/>
  <text x="462" y="104" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">G = mg</text>

  <line x1="450" y1="286" x2="450" y2="242" stroke="#0f766e" stroke-width="4" marker-end="url(#u07v2pg_arrowGreen)"/>
  <text x="462" y="270" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">F_U</text>

  <line x1="250" y1="250" x2="650" y2="250" stroke="#6b7280" stroke-width="2" marker-start="url(#u07v2pg_arrowGray)" marker-end="url(#u07v2pg_arrowGray)"/>
  <text x="444" y="268" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">L</text>

  <text x="316" y="288" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#516677">Za simetrični teret nema nagiba: gaz dolazi iz V = LBh i uvjeta rho g V = mg.</text>

  <defs>
    <marker id="u07v2pg_arrowOrange" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#c96c35"/>
    </marker>
    <marker id="u07v2pg_arrowOrangeSmall" markerWidth="10" markerHeight="10" refX="4" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L6,3 z" fill="#c96c35"/>
    </marker>
    <marker id="u07v2pg_arrowGreen" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#0f766e"/>
    </marker>
    <marker id="u07v2pg_arrowGreenSmall" markerWidth="10" markerHeight="10" refX="4" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L6,3 z" fill="#0f766e"/>
    </marker>
    <marker id="u07v2pg_arrowRed" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#be123c"/>
    </marker>
    <marker id="u07v2pg_arrowGray" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L6,3 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>