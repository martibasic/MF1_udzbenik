      <line x1="425" y1="265" x2="425" y2="313.0126920507682" stroke="#657781" stroke-width="1.2" marker-start="url(#u07v2pg_fix_dimL)" marker-end="url(#u07v2pg_fix_dim)" data-mf1-role="dimension" />
      <text x="432" y="293.0063460253841" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="start">T</text>
