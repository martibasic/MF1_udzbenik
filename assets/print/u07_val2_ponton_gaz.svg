<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="u07v2pg_title u07v2pg_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:880px;height:auto;">
  <title id="u07v2pg_title">Ponton s opremom: gaz i vertikalna ravnoteža</title>
  <desc id="u07v2pg_desc">Zatvoren ponton pluta u jednom kontinuiranom području vode. Voda je samo izvan nepropusne ovojnice. Uzgon djeluje kroz centroid istisnutog volumena unutar trupa, ukupna težina na istom vertikalnom pravcu. Srednji gaz 0,209 m, visina boka 0,32 m; duljina je okomita na presjek.</desc>
  <defs>
