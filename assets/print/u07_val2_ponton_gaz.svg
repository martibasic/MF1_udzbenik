    </marker>
    <marker id="u07v2pg_fix_dimL" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse">
      <path d="M0 0 L0 5 L6 2.5 Z" fill="#b7600c" stroke="none" stroke-width="1.2" />
    </marker>
    <linearGradient id="u07v2pg_fix_water" x1="0" y1="265" x2="0" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#aed6f1" />
      <stop offset="100%" stop-color="#5b9ec9" />
    </linearGradient>
    <pattern id="u07v2pg_fix_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
