<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="u06v1ck_title u06v1ck_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:900px;height:auto;">
  <title id="u06v1ck_title">Potopljena četvrtina kruga AB - rastav hidrostatske sile</title>
  <desc id="u06v1ck_desc">Četvrtcilindrična ploha s pravim kružnim lukom oko O. Voda je lijevo i ispod luka, a sile vode na plohu su desno i gore. Pomoćni volumen V1+V2 na suhoj strani omeđen je isprekidanim linijama. xV se mjeri ulijevo od okomice kroz O; FH djeluje na dubini 3,091 m.</desc>
  <defs>
