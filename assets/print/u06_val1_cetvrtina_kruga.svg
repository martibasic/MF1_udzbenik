      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.1" />
    </pattern>
    <pattern id="u06v1ck_imag" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#dcebf1" />
      <line x1="0" y1="0" x2="0" y2="6" stroke="#356b83" stroke-width="0.8" />
    </pattern>
