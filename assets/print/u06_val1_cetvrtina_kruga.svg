  <title id="u06v1ck_title">Potopljena četvrtina kruga AB - rastav hidrostatske sile</title>
  <desc id="u06v1ck_desc">Četvrtcilindrična ploha s pravim kružnim lukom oko O. Voda je lijevo i ispod luka, a sile vode na plohu su desno i gore. Pomoćni volumen V1+V2 na suhoj strani omeđen je isprekidanim linijama. xV se mjeri ulijevo od okomice kroz O; FH djeluje u centru tlaka vertikalne projekcije.</desc>
