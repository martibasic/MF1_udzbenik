  <text x="720" y="72" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">Ključne jednadžbe rastava sile</text>
  <text x="720" y="106" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">1. Horizontalna komponenta</text>
  <text x="720" y="130" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">H</tspan> = ρ <tspan font-style="italic">g</tspan>
    <tspan font-style="italic">A</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">x</tspan>
    <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">Cx</tspan>
  </text>
  <text x="720" y="152" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">A</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">x</tspan> = <tspan font-style="italic">Rb</tspan> = 2,233 m²    <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">Cx</tspan> = <tspan font-style="italic">h</tspan>₁ + <tspan font-style="italic">R</tspan>/2 = 3,05 m</text>
  <text x="720" y="176" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">H</tspan> ≈ 66,7 kN  (→)</text>
  <text x="720" y="212" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">2. Vertikalna komponenta</text>
  <text x="720" y="236" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">V</tspan> = ρ <tspan font-style="italic">g V*</tspan>
  </text>
  <text x="720" y="258" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">V*</tspan> = <tspan font-style="italic">h</tspan>₁<tspan font-style="italic">Rb</tspan> + π<tspan font-style="italic">R</tspan>²<tspan font-style="italic">b</tspan>/4 = 5,448 + 2,139 = 7,587 m³</text>
  <text x="720" y="282" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">V</tspan> ≈ 74,3 kN  (↑)</text>
  <text x="720" y="318" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">3. Rezultanta</text>
  <text x="720" y="342" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">R</tspan> = √(<tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">H</tspan>² + <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">V</tspan>²)</text>
  <text x="720" y="364" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">tanα = <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">V</tspan> / <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">H</tspan> = 74,3 / 66,7 → α ≈ 48°</text>
  <text x="720" y="388" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">R</tspan> ≈ 99,8 kN</text>
  <text x="720" y="420" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" font-style="italic" text-anchor="middle" fill="#263746">F<tspan baseline-shift="sub" font-size="0.75em">V</tspan> je prema gore: voda kvasi donju stranu.</text>
  <text x="720" y="462" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#263746">REZULTATI</text>
  <text x="610" y="482" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">H</tspan> = 66,7 kN</text>
  <text x="720" y="482" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">V</tspan> = 74,3 kN</text>
  <text x="830" y="482" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">R</tspan> = 99,8 kN</text>
  <g font-family="Arial, Liberation Sans, sans-serif" />
