<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 382" role="img" aria-labelledby="u14ship_title u14ship_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:784px;height:auto;">
  <title id="u14ship_title">Brod i geometrijski sličan model</title>
  <desc id="u14ship_desc">Dva trupa istog normiranog oblika prikazana u različitim grafičkim mjerilima. Duljine i brzine dane su kotama. Voda ispod trupa je povezana, a slobodna površina ne prolazi kroz kruti trup.</desc>
  <defs>
