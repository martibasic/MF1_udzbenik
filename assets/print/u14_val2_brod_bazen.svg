<text x="440" y="97" font-size="14" fill="#3a4a56" text-anchor="middle">Prikazi su u različitim grafičkim mjerilima; podatci su u kotama.</text>
<text x="226" y="399" font-size="11" fill="#3a4a56" text-anchor="middle">Neprikazani valovi; shema uronjenog trupa.</text>
<text x="654" y="399" font-size="11" fill="#3a4a56" text-anchor="middle">Bazen je otvoren; voda prolazi ispod trupa.</text>
