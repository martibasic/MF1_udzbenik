<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" role="img" aria-labelledby="u02fup_title u02fup_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="u02fup_title">Pregled poglavlja 2 - viskoznost, površinska napetost i kapilarnost</title>
  <desc id="u02fup_desc">Tropanelni uvodni blok. Lijevo: Couetteov tok između dviju paralelnih ploča - linearni profil brzine, smično naprezanje tau na gornjoj ploči, razmak delta. Gore desno: kapilara s konkavnim meniskusom - površinska napetost sigma uz stijenku, težina stupca G, kontaktni kut theta, uspon h. Dolje desno: ključne jednadžbe poglavlja - Newtonov zakon viskoznosti, kinematička viskoznost, ravnoteža na kontaktnoj liniji i izraz za kapilarni uspon.</desc>

  <defs>
    <!-- Gradijenti fluida -->
    <linearGradient id="u02fup_oil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a" />
      <stop offset="1" stop-color="#c8a000" />
    </linearGradient>
    <linearGradient id="u02fup_voda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aed6f1" />
      <stop offset="1" stop-color="#5b9ec9" />
    </linearGradient>
    <linearGradient id="u02fup_hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d2538" />
      <stop offset="1" stop-color="#1a3a52" />
    </linearGradient>

    <!-- Hatching za stijenke -->
    <pattern id="u02fup_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.1" />
    </pattern>

    <!-- Markeri -->
    <marker id="u02fup_aR" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#c0392b" />
    </marker>
    <marker id="u02fup_aG" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1e8449" />
    </marker>
    <marker id="u02fup_aB" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1565c0" />
    </marker>
    <marker id="u02fup_aW" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#ffffff" />
    </marker>
    <marker id="u02fup_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u02fup_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
  </defs>

  <!-- Pozadina -->
  <rect width="980" height="580" fill="#f4f6f9" />

  <!-- ============== HEADER BAR ============== -->
  <rect x="0" y="0" width="980" height="48" fill="url(#u02fup_hdr)" />
  <!-- Bridge tagline ispod headera -->
  <!-- ============== LIJEVI PANEL: VISKOZNOST  x=18 w=470 ============== -->
  <rect x="18" y="84" width="470" height="478" rx="10" fill="#fbfdff" stroke="#1565c0" stroke-width="1.6" />
  <rect x="18" y="84" width="470" height="32" rx="10" fill="#1565c0" />
  <rect x="18" y="100" width="470" height="16" fill="#1565c0" />
  <!-- === Geometrija Couettea ===
       Gornja ploca:  x=70..420, y=158..174   (giba se brzinom U)
       Fluid (ulje):  x=70..420, y=174..330   (debljina 156 px reprezentira delta)
       Donja ploca:   x=70..420, y=330..346   (miruje)
  -->

  <!-- Strelica U iznad gornje ploce -->
  <line x1="218" y1="145" x2="318" y2="145" stroke="#1e8449" stroke-width="2.8" marker-end="url(#u02fup_aG)" />
  <!-- Gornja ploca -->
  <rect x="70" y="158" width="350" height="16" fill="url(#u02fup_hatch)" stroke="#3a4a56" stroke-width="1.4" />

  <!-- Fluid (ulje) -->
  <rect x="70" y="174" width="350" height="156" fill="url(#u02fup_oil)" />

  <!-- Profil brzine - 7 bijelih strelica linearno opadajucih
       y od 184 (gornja) do 320 (donja), max duljina 200 px
       l = 200 * (320 - y) / 136 -->
  <line x1="72" y1="184" x2="270" y2="184" stroke="#ffffff" stroke-width="2.2" marker-end="url(#u02fup_aW)" />
  <line x1="72" y1="204" x2="241" y2="204" stroke="#ffffff" stroke-width="2.1" marker-end="url(#u02fup_aW)" />
  <line x1="72" y1="224" x2="213" y2="224" stroke="#ffffff" stroke-width="2.0" marker-end="url(#u02fup_aW)" />
  <line x1="72" y1="244" x2="184" y2="244" stroke="#ffffff" stroke-width="1.9" marker-end="url(#u02fup_aW)" />
  <line x1="72" y1="264" x2="156" y2="264" stroke="#ffffff" stroke-width="1.8" marker-end="url(#u02fup_aW)" />
  <line x1="72" y1="284" x2="127" y2="284" stroke="#ffffff" stroke-width="1.7" marker-end="url(#u02fup_aW)" />
  <line x1="72" y1="304" x2="99" y2="304" stroke="#ffffff" stroke-width="1.6" marker-end="url(#u02fup_aW)" />

  <!-- Hipotenuza profila (kosa linija) (72,320) -> (272,184) -->
  <line x1="72" y1="320" x2="272" y2="184" stroke="#ffffff" stroke-width="1.4" stroke-dasharray="4,3" opacity="0.85" />

  <!-- v(y) oznaka u fluidu (desno od profila) -->
  <!-- Strelica smicnog naprezanja tau na gornjoj plohi (u smjeru gibanja, na fluid) -->
  <line x1="340" y1="167" x2="404" y2="167" stroke="#c0392b" stroke-width="2.6" marker-end="url(#u02fup_aR)" />
  <!-- Donja ploca -->
  <rect x="70" y="330" width="350" height="16" fill="url(#u02fup_hatch)" stroke="#3a4a56" stroke-width="1.4" />

  <!-- Donja ploca - oznaka v=0 -->
  <!-- Kota delta (lijevo od ploca) -->
  <!-- y os strelica (sluzi za smjer gradijenta) -->
  <line x1="448" y1="320" x2="448" y2="186" stroke="#5a6a78" stroke-width="1.3" />
  <polygon points="448,178 443,188 453,188" fill="#5a6a78" />
  <!-- Donji info-bar lijevog panela -->
  <rect x="34" y="386" width="438" height="68" rx="7" fill="#eaf4fb" stroke="#bcd6ec" stroke-width="1.2" />
  <!-- Primjena - kratki tekst dolje -->
  <!-- ============== DESNI GORNJI PANEL: POVRSINSKA NAPETOST + KAPILARNOST x=502 w=460 ============== -->
  <!-- === Geometrija kapilare ===
       Posuda dno y=292..300 (x=540..924)
       Posuda bocne stijenke y=216..292 (lijeva x=540..548, desna x=916..924)
       Razina tekucine u posudi: y=240 (x=548..916)
       Kapilara: centar x=732, unutarnji 28 (x=718..746), stijenke debljina 8: x=710..718 i x=746..754, visina od y=160 do y=292
       Fluid u kapilari uspon do y=190
  -->

  <!-- Dno posude -->
  <rect x="540" y="292" width="384" height="8" fill="url(#u02fup_hatch)" stroke="#3a4a56" stroke-width="1.2" />
  <!-- Lijeva stijenka posude -->
  <rect x="540" y="216" width="8" height="76" fill="url(#u02fup_hatch)" stroke="#3a4a56" stroke-width="1.2" />
  <!-- Desna stijenka posude -->
  <rect x="916" y="216" width="8" height="76" fill="url(#u02fup_hatch)" stroke="#3a4a56" stroke-width="1.2" />
  <!-- Voda u posudi (od y=240 do dna y=292) -->
  <rect x="548" y="240" width="368" height="52" fill="url(#u02fup_voda)" />
  <!-- Slobodna povrsina vode u posudi -->
  <line x1="548" y1="240" x2="710" y2="240" stroke="#1565c0" stroke-width="1.8" />
  <line x1="754" y1="240" x2="916" y2="240" stroke="#1565c0" stroke-width="1.8" />

  <!-- Kapilara - stijenke -->
  <rect x="710" y="160" width="8" height="132" fill="#eaf1f6" stroke="#9fb3c0" stroke-width="1.0" />
  <rect x="746" y="160" width="8" height="132" fill="#eaf1f6" stroke="#9fb3c0" stroke-width="1.0" />
  <!-- Voda u kapilari (uspon od y=190 do dna y=292) -->
  <rect x="718" y="190" width="28" height="102" fill="url(#u02fup_voda)" />
  <!-- Konkavni meniskus -->
  <path d="M718,192 Q732,178 746,192 L746,190 L718,190 Z" fill="url(#u02fup_voda)" />
  <path d="M718,192 Q732,178 746,192" fill="none" stroke="#1565c0" stroke-width="2.0" />

  <!-- Sigma - povrsinska napetost (plave, uz unutarnju stijenku kapilare, prema gore) -->
  <line x1="722" y1="200" x2="722" y2="174" stroke="#1565c0" stroke-width="2.4" marker-end="url(#u02fup_aB)" />
  <line x1="742" y1="200" x2="742" y2="174" stroke="#1565c0" stroke-width="2.4" marker-end="url(#u02fup_aB)" />
  <line x1="767" y1="180" x2="746" y2="186" stroke="#1565c0" stroke-width="0.8" />

  <!-- Tezina stupca G (crvena, dolje, u sredini kapilare) -->
  <line x1="732" y1="220" x2="732" y2="270" stroke="#c0392b" stroke-width="2.6" marker-end="url(#u02fup_aR)" />
  <!-- Kontaktni kut theta (luk pri lijevom kontaktu meniskusa i stijenke) -->
  <!-- Kota h (uspon - desno od kapilare) -->
  <!-- Kota d (vrh kapilare) -->
  <!-- Voda oznaka -->
  <!-- Primjena - kratki tekst dolje -->
  <!-- ============== DESNI DONJI PANEL: KLJUCNE JEDNADZBE x=502 w=460 ============== -->
  <rect x="502" y="324" width="460" height="238" rx="10" fill="#fbfdff" stroke="#1e8449" stroke-width="1.6" />
  <rect x="502" y="324" width="460" height="32" rx="10" fill="#1e8449" />
  <rect x="502" y="340" width="460" height="16" fill="#1e8449" />
  <!-- Blok 1: Newtonov zakon viskoznosti (y=366..414) -->
  <rect x="514" y="366" width="6" height="48" rx="3" fill="#1565c0" />
  <line x1="514" y1="416" x2="950" y2="416" stroke="#dce7f0" stroke-width="1" />

  <!-- Blok 2: Kinematicka viskoznost (y=418..464) -->
  <rect x="514" y="420" width="6" height="44" rx="3" fill="#1565c0" />
  <line x1="514" y1="468" x2="950" y2="468" stroke="#dce7f0" stroke-width="1" />

  <!-- Blok 3: Ravnoteza na kontaktnoj liniji (y=470..504) -->
  <rect x="514" y="472" width="6" height="34" rx="3" fill="#1e8449" />
  <line x1="514" y1="510" x2="950" y2="510" stroke="#dce7f0" stroke-width="1" />

  <!-- Blok 4: Kapilarni uspon (y=510..550) -->
  <rect x="514" y="514" width="6" height="38" rx="3" fill="#1e8449" />
  <line x1="70" y1="174" x2="44" y2="174" stroke="#b7600c" stroke-width="0.7" />
  <line x1="70" y1="330" x2="44" y2="330" stroke="#b7600c" stroke-width="0.7" />
  <line x1="50" y1="172" x2="50" y2="176" stroke="#b7600c" stroke-width="1.2" />
  <line x1="50" y1="328" x2="50" y2="332" stroke="#b7600c" stroke-width="1.2" />
  <line x1="50" y1="176" x2="50" y2="328" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u02fup_dimL)" marker-end="url(#u02fup_dim)" />
  <rect x="502" y="84" width="460" height="230" rx="10" fill="#fbfdff" stroke="#b7600c" stroke-width="1.6" />
  <rect x="502" y="84" width="460" height="32" rx="10" fill="#b7600c" />
  <rect x="502" y="100" width="460" height="16" fill="#b7600c" />
  <path d="M718,206 A14,14 0 0 1 706,196" fill="none" stroke="#b7600c" stroke-width="1.4" />
  <line x1="718" y1="192" x2="718" y2="208" stroke="#b7600c" stroke-width="1.0" stroke-dasharray="3,2" />
  <line x1="754" y1="190" x2="800" y2="190" stroke="#b7600c" stroke-width="0.7" />
  <line x1="754" y1="240" x2="800" y2="240" stroke="#b7600c" stroke-width="0.7" />
  <line x1="794" y1="188" x2="794" y2="192" stroke="#b7600c" stroke-width="1.2" />
  <line x1="794" y1="238" x2="794" y2="242" stroke="#b7600c" stroke-width="1.2" />
  <line x1="794" y1="192" x2="794" y2="238" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u02fup_dimL)" marker-end="url(#u02fup_dim)" />
  <line x1="710" y1="160" x2="710" y2="144" stroke="#b7600c" stroke-width="0.7" />
  <line x1="754" y1="160" x2="754" y2="144" stroke="#b7600c" stroke-width="0.7" />
  <line x1="708" y1="150" x2="712" y2="150" stroke="#b7600c" stroke-width="1.2" />
  <line x1="752" y1="150" x2="756" y2="150" stroke="#b7600c" stroke-width="1.2" />
  <line x1="712" y1="150" x2="752" y2="150" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u02fup_dimL)" marker-end="url(#u02fup_dim)" />
  <text x="490" y="31" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">Pog. 2 - Viskoznost · Površinska napetost · Kapilarnost</text>

  <text x="490" y="68" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-style="italic" fill="#3a4a56" text-anchor="middle">Pog. 1 je dao tlak u mirujućem fluidu. Pog. 2 dodaje otpor gibanju (u volumenu) i učinke slobodne površine (na granici faza).</text>

  <text x="253" y="105" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">VISKOZNOST  -  otpor u volumenu fluida</text>
  <text x="253" y="134" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#3a5a7a" text-anchor="middle">Couetteov tok između paralelnih ploča: linearni profil brzine</text>

  <text x="324" y="150" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" font-style="italic" fill="#1e8449">U</text>

  <text x="345" y="232" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#5a4a00" text-anchor="middle">v(y)</text>
  <text x="345" y="248" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a4a00" text-anchor="middle">linearno</text>

  <text x="380" y="158" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" font-style="italic" fill="#c0392b" text-anchor="middle">τ</text>

  <text x="245" y="362" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#3a4a56" text-anchor="middle">donja ploča miruje  (v = 0)</text>

  <text x="456" y="190" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#5a6a78">y</text>
  <text x="456" y="324" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a6a78">0</text>

  <text x="253" y="406" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1a3a52" text-anchor="middle">Što se čita iz crteža</text>
  <text x="253" y="424" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a2530" text-anchor="middle">Razmak slojeva po brzini  (dv/dy)  traži smično naprezanje  (τ).</text>
  <text x="253" y="442" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a2530" text-anchor="middle">Konstanta proporcionalnosti je dinamička viskoznost  μ  [Pa·s].</text>

  <text x="253" y="478" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#1565c0" text-anchor="middle">Primjena u strojarstvu</text>
  <text x="253" y="494" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#3a4a56" text-anchor="middle">klizni ležaji i vodilice - uljni film odvaja površine</text>
  <text x="253" y="509" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#3a4a56" text-anchor="middle">motorno i hidraulično ulje - hladan start vs. topli rad</text>
  <text x="253" y="524" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#3a4a56" text-anchor="middle">Reynoldsov broj  Re = v·L/ν  -  laminarno ili turbulentno</text>
  <text x="253" y="548" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-style="italic" fill="#5a6a78" text-anchor="middle">Newtonski fluid: τ je linearno s dv/dy. Ne-Newtonski: krv, beton, polimeri.</text>

  <text x="732" y="105" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">POVRŠINSKA NAPETOST &amp; KAPILARNOST - granice faza</text>
  <text x="732" y="134" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#5a4020" text-anchor="middle">ravnoteža na kontaktnoj liniji: σπd cosθ (gore)  =  G (dolje)</text>

  <text x="770" y="178" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" font-style="italic" fill="#1565c0">σ</text>
  <text x="715" y="248" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" font-style="italic" fill="#c0392b" text-anchor="end">G</text>

  <text x="610" y="276" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#0d47a1" text-anchor="middle">voda  -  kvasi staklo  (θ &lt; 90°)</text>

  <text x="732" y="304" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" fill="#5a4020" text-anchor="middle">Primjena: raspršivači, premazi, zavarivačke kupke, vlaga u poroznoj cigli.</text>

  <text x="732" y="345" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">KLJUČNE JEDNADŽBE POGLAVLJA</text>

  <text x="528" y="382" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#1565c0">1. Newtonov zakon viskoznosti</text>
  <text x="528" y="404" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" font-style="italic" fill="#1a2530">τ = μ · dv/dy</text>
  <text x="876" y="404" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" fill="#5a6a78" text-anchor="end">[Pa]</text>
  <text x="528" y="436" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#1565c0">2. Kinematička viskoznost</text>
  <text x="528" y="456" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" font-style="italic" fill="#1a2530">ν = μ / ρ</text>
  <text x="876" y="456" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" fill="#5a6a78" text-anchor="end">[m²/s]</text>
  <text x="528" y="486" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#1e8449">3. Ravnoteža sila na kontaktnoj liniji</text>
  <text x="528" y="503" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" font-style="italic" fill="#1a2530">σπd cosθ = ρg(πd²/4)h</text>
  <text x="528" y="529" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#1e8449">4. Kapilarni uspon</text>
  <text x="528" y="548" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" font-style="italic" fill="#1a2530">h = 4σ cosθ / (ρg d)</text>
  <text x="876" y="548" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" fill="#5a6a78" text-anchor="end">θ &lt; 90° uspon · θ &gt; 90° pad</text>
<text x="36" y="256" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" font-style="italic" fill="#b7600c" text-anchor="middle">δ</text>

  <text x="694" y="208" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#b7600c" text-anchor="end">θ</text>

  <text x="810" y="220" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" font-style="italic" fill="#b7600c">h</text>

  <text x="732" y="142" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" font-style="italic" fill="#b7600c" text-anchor="middle">d</text>

  </svg>