<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
<defs>
  <marker id="u13vs-ag" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,9 3,0 6" fill="#0f766e"/></marker>
  <marker id="u13vs-ao" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#b45309"/></marker>
  <marker id="u13vs-ao2" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0,0 3,8 6" fill="#b45309"/></marker>
  <linearGradient id="u13vs-wt" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d4eef8"/><stop offset="100%" stop-color="#7ec8e8"/></linearGradient>
  <linearGradient id="u13vs-wb" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c5e8f5"/><stop offset="100%" stop-color="#6ab8d6"/></linearGradient>
</defs>
<rect width="940" height="700" fill="#ffffff"/>
<rect x="24" y="24" width="892" height="652" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>

<!-- ═══ T1 (top-left): Single pipe section ═══ -->
<g transform="translate(44,96)">
<rect x="0" y="0" width="420" height="180" rx="12" fill="#f8fbfd" stroke="#d3d9de" stroke-width="1.5"/>
<rect x="12" y="12" width="38" height="22" rx="5" fill="#e0f0f8" stroke="#93c5fd" stroke-width="1.2"/>
<text x="31" y="27" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#173043" text-anchor="middle">T1</text>
<text x="62" y="27" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">Jedna cijevna dionica</text>
<!-- pipe -->
<rect x="30" y="82" width="290" height="28" rx="0" fill="url(#u13vs-wt)" stroke="#2d3a40" stroke-width="2"/>
<!-- Q arrow -->
<line x1="14" y1="96" x2="30" y2="96" stroke="#0f766e" stroke-width="2.5" marker-end="url(#u13vs-ag)"/>
<text x="4" y="89" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#0f766e">Q</text>
<!-- Flow arrow inside -->
<line x1="65" y1="96" x2="130" y2="96" stroke="#0f766e" stroke-width="1.8" marker-end="url(#u13vs-ag)"/>
<!-- valve symbols -->
<circle cx="200" cy="96" r="9" fill="#fffef6" stroke="#2d3a40" stroke-width="1.5"/>
<line x1="193" y1="89" x2="207" y2="103" stroke="#2d3a40" stroke-width="1.3"/>
<line x1="207" y1="89" x2="193" y2="103" stroke="#2d3a40" stroke-width="1.3"/>
<text x="196" y="81" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#173043">ξ</text>
<!-- D arrow -->
<line x1="334" y1="82" x2="334" y2="110" stroke="#b45309" stroke-width="2" marker-start="url(#u13vs-ao2)" marker-end="url(#u13vs-ao)"/>
<text x="344" y="100" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b45309">D</text>
<!-- L span -->
<line x1="30" y1="68" x2="320" y2="68" stroke="#546e7a" stroke-width="1.2"/>
<line x1="30" y1="63" x2="30" y2="73" stroke="#546e7a" stroke-width="1.2"/>
<line x1="320" y1="63" x2="320" y2="73" stroke="#546e7a" stroke-width="1.2"/>
<text x="175" y="62" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677" text-anchor="middle">L, ε</text>
<!-- labels -->
<text x="38" y="130" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677">Traži: h_w = h_f + h_loc</text>
<text x="38" y="146" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677">h_f = λ(L/D)(v²/2g),  h_loc = Σξ(v²/2g)</text>
<text x="38" y="165" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677" font-style="italic">Re &lt; 2300: λ=64/Re  |  turbulentno: Moody</text>
</g>

<!-- ═══ T2 (top-right): Laminar flow ═══ -->
<g transform="translate(476,96)">
<rect x="0" y="0" width="420" height="180" rx="12" fill="#f8fbfd" stroke="#d3d9de" stroke-width="1.5"/>
<rect x="12" y="12" width="38" height="22" rx="5" fill="#e0f0f8" stroke="#93c5fd" stroke-width="1.2"/>
<text x="31" y="27" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#173043" text-anchor="middle">T2</text>
<text x="62" y="27" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">Laminarni tok (Re &lt; 2300)</text>
<!-- pipe -->
<rect x="30" y="70" width="320" height="40" rx="0" fill="url(#u13vs-wt)" stroke="#2d3a40" stroke-width="2"/>
<!-- parabolic velocity profile (3 arrows of different lengths) -->
<line x1="100" y1="90" x2="136" y2="90" stroke="#0f766e" stroke-width="2" marker-end="url(#u13vs-ag)"/>
<line x1="100" y1="78" x2="118" y2="78" stroke="#0f766e" stroke-width="1.5" marker-end="url(#u13vs-ag)"/>
<line x1="100" y1="102" x2="118" y2="102" stroke="#0f766e" stroke-width="1.5" marker-end="url(#u13vs-ag)"/>
<text x="100" y="65" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#0f766e">profil v(r)</text>
<!-- Q arrow -->
<line x1="14" y1="90" x2="30" y2="90" stroke="#0f766e" stroke-width="2.5" marker-end="url(#u13vs-ag)"/>
<text x="4" y="83" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#0f766e">Q</text>
<!-- D label -->
<line x1="362" y1="70" x2="362" y2="110" stroke="#b45309" stroke-width="2" marker-start="url(#u13vs-ao2)" marker-end="url(#u13vs-ao)"/>
<text x="372" y="94" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b45309">D</text>
<!-- formulas -->
<text x="38" y="130" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677">Re = vD/ν &lt; 2300  →  λ = 64/Re</text>
<text x="38" y="146" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677">v_max = 2·v_sred (parabolični profil)</text>
<text x="38" y="165" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677" font-style="italic">Hagen-Poiseuille: Δp = 128μLQ/(πD⁴)</text>
</g>

<!-- ═══ T3 (mid-left): Two sections in series ═══ -->
<g transform="translate(44,294)">
<rect x="0" y="0" width="420" height="180" rx="12" fill="#f8fbfd" stroke="#d3d9de" stroke-width="1.5"/>
<rect x="12" y="12" width="38" height="22" rx="5" fill="#e0f0f8" stroke="#93c5fd" stroke-width="1.2"/>
<text x="31" y="27" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#173043" text-anchor="middle">T3</text>
<text x="62" y="27" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">Dvije dionice u seriji</text>
<!-- pipe 1 (wider): y=80..110, x=30..200 -->
<rect x="30" y="80" width="170" height="30" fill="url(#u13vs-wt)" stroke="#2d3a40" stroke-width="2.5"/>
<!-- pipe 2 (narrower): y=88..102, x=200..360 -->
<rect x="200" y="88" width="160" height="16" fill="url(#u13vs-wt)" stroke="#2d3a40" stroke-width="2"/>
<!-- Q arrows -->
<line x1="14" y1="95" x2="30" y2="95" stroke="#0f766e" stroke-width="2.5" marker-end="url(#u13vs-ag)"/>
<line x1="240" y1="96" x2="290" y2="96" stroke="#0f766e" stroke-width="2" marker-end="url(#u13vs-ag)"/>
<text x="4" y="89" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#0f766e">Q</text>
<!-- D labels -->
<text x="36" y="75" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b45309">D₁, L₁</text>
<text x="206" y="84" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b45309">D₂, L₂</text>
<!-- notes -->
<text x="38" y="130" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677">Isti Q kroz obje dionice: Q₁ = Q₂ = Q</text>
<text x="38" y="146" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677">v₂ = v₁·(D₁/D₂)²  (kontinuitet)</text>
<text x="38" y="165" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677" font-style="italic">Ukupni pad: h_w = h_{w,1} + h_{w,2}</text>
</g>

<!-- ═══ T4 (mid-right): Given K and h_w ═══ -->
<g transform="translate(476,294)">
<rect x="0" y="0" width="420" height="180" rx="12" fill="#f8fbfd" stroke="#d3d9de" stroke-width="1.5"/>
<rect x="12" y="12" width="38" height="22" rx="5" fill="#e0f0f8" stroke="#93c5fd" stroke-width="1.2"/>
<text x="31" y="27" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#173043" text-anchor="middle">T4</text>
<text x="62" y="27" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">Cjevovod s koeficijentom K</text>
<!-- pipe with K symbol -->
<rect x="30" y="82" width="300" height="26" fill="url(#u13vs-wt)" stroke="#2d3a40" stroke-width="2"/>
<!-- K box inside pipe -->
<rect x="150" y="84" width="40" height="22" rx="4" fill="#fffef6" stroke="#c49a0a" stroke-width="1.5"/>
<text x="170" y="99" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#c49a0a" text-anchor="middle">K</text>
<!-- Q arrow -->
<line x1="14" y1="95" x2="30" y2="95" stroke="#0f766e" stroke-width="2.5" marker-end="url(#u13vs-ag)"/>
<text x="4" y="89" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#0f766e">Q</text>
<!-- h_w bracket right side -->
<line x1="342" y1="68" x2="342" y2="122" stroke="#b45309" stroke-width="2" marker-start="url(#u13vs-ao2)" marker-end="url(#u13vs-ao)"/>
<text x="353" y="98" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#b45309">h_w</text>
<!-- D label -->
<text x="36" y="78" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b45309">D</text>
<!-- notes -->
<text x="38" y="130" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677">h_w = K · Q²  (kvadratni otpor)</text>
<text x="38" y="146" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677">K = λ(L/D)(1/2gA²) + Σξ(1/2gA²)</text>
<text x="38" y="165" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677" font-style="italic">Zadano K i h_w → Q = √(h_w/K)</text>
</g>

<!-- ═══ T5 (bottom-left): Parallel branches ═══ -->
<g transform="translate(44,492)">
<rect x="0" y="0" width="420" height="180" rx="12" fill="#f8fbfd" stroke="#d3d9de" stroke-width="1.5"/>
<rect x="12" y="12" width="38" height="22" rx="5" fill="#e0f0f8" stroke="#93c5fd" stroke-width="1.2"/>
<text x="31" y="27" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#173043" text-anchor="middle">T5</text>
<text x="62" y="27" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">Paralelne grane</text>
<!-- entry pipe: y=89..99 -->
<rect x="20" y="88" width="84" height="16" fill="url(#u13vs-wt)" stroke="#2d3a40" stroke-width="2"/>
<!-- Node C -->
<circle cx="110" cy="96" r="7" fill="#f59e0b" stroke="#92400e" stroke-width="1.8"/>
<text x="103" y="85" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#173043">C</text>
<!-- Branch 1 (upper): y=60..74, x=117..283 -->
<rect x="117" y="62" width="166" height="14" fill="url(#u13vs-wt)" stroke="#2d3a40" stroke-width="1.8"/>
<!-- Branch 2 (lower): y=108..122, x=117..283 -->
<rect x="117" y="108" width="166" height="16" fill="url(#u13vs-wt)" stroke="#2d3a40" stroke-width="1.8"/>
<!-- Node D -->
<circle cx="290" cy="96" r="7" fill="#f59e0b" stroke="#92400e" stroke-width="1.8"/>
<text x="298" y="85" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#173043">D</text>
<!-- exit pipe: y=89..99 -->
<rect x="297" y="88" width="84" height="16" fill="url(#u13vs-wt)" stroke="#2d3a40" stroke-width="2"/>
<!-- labels -->
<text x="160" y="58" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#173043" text-anchor="middle">Q₁, D₁, L₁</text>
<text x="160" y="138" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#173043" text-anchor="middle">Q₂, D₂, L₂</text>
<text x="4" y="90" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#0f766e">Q</text>
<!-- Q arrows -->
<line x1="40" y1="96" x2="68" y2="96" stroke="#0f766e" stroke-width="1.8" marker-end="url(#u13vs-ag)"/>
<line x1="155" y1="69" x2="195" y2="69" stroke="#0f766e" stroke-width="1.5" marker-end="url(#u13vs-ag)"/>
<line x1="155" y1="116" x2="195" y2="116" stroke="#0f766e" stroke-width="1.5" marker-end="url(#u13vs-ag)"/>
<line x1="323" y1="96" x2="362" y2="96" stroke="#0f766e" stroke-width="1.8" marker-end="url(#u13vs-ag)"/>
<!-- note -->
<text x="38" y="155" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677">Q = Q₁ + Q₂   ·   h_{w,1} = h_{w,2}</text>
<text x="38" y="171" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677" font-style="italic">K₁Q₁² = K₂Q₂²  →  Q₁/Q₂ = √(K₂/K₁)</text>
</g>

<!-- ═══ T6 (bottom-right): Series-parallel network ═══ -->
<g transform="translate(476,492)">
<rect x="0" y="0" width="420" height="180" rx="12" fill="#f8fbfd" stroke="#d3d9de" stroke-width="1.5"/>
<rect x="12" y="12" width="38" height="22" rx="5" fill="#e0f0f8" stroke="#93c5fd" stroke-width="1.2"/>
<text x="31" y="27" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#173043" text-anchor="middle">T6</text>
<text x="62" y="27" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">Serijsko-paralelna mreža</text>
<!-- Tank A (left) -->
<rect x="14" y="54" width="24" height="80" rx="3" fill="none" stroke="#2d3a40" stroke-width="1.8"/>
<rect x="16" y="64" width="20" height="68" fill="url(#u13vs-wt)"/>
<text x="26" y="50" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#173043" text-anchor="middle">A</text>
<!-- Tank B (right) -->
<rect x="378" y="66" width="24" height="68" rx="3" fill="none" stroke="#2d3a40" stroke-width="1.8"/>
<rect x="380" y="78" width="20" height="54" fill="url(#u13vs-wb)"/>
<text x="390" y="62" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#173043" text-anchor="middle">B</text>
<!-- entry pipe A→C: y=91..99 -->
<rect x="38" y="90" width="66" height="14" fill="url(#u13vs-wt)" stroke="#2d3a40" stroke-width="1.8"/>
<!-- node C -->
<circle cx="110" cy="97" r="6" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>
<text x="103" y="86" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#173043">C</text>
<!-- branch 1 (upper, thinner): y=68..78, x=116..284 -->
<rect x="116" y="66" width="168" height="12" fill="url(#u13vs-wt)" stroke="#2d3a40" stroke-width="1.5"/>
<!-- branch 2 (lower, thicker): y=102..116, x=116..284 -->
<rect x="116" y="104" width="168" height="16" fill="url(#u13vs-wb)" stroke="#2d3a40" stroke-width="2"/>
<!-- node D -->
<circle cx="290" cy="97" r="6" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>
<text x="298" y="86" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#173043">D</text>
<!-- exit pipe D→B: y=91..99 -->
<rect x="296" y="90" width="82" height="14" fill="url(#u13vs-wt)" stroke="#2d3a40" stroke-width="1.8"/>
<!-- Q arrow in entry -->
<line x1="50" y1="97" x2="82" y2="97" stroke="#0f766e" stroke-width="1.8" marker-end="url(#u13vs-ag)"/>
<!-- Q arrows in branches -->
<line x1="160" y1="72" x2="200" y2="72" stroke="#0f766e" stroke-width="1.5" marker-end="url(#u13vs-ag)"/>
<line x1="160" y1="112" x2="200" y2="112" stroke="#0f766e" stroke-width="1.5" marker-end="url(#u13vs-ag)"/>
<!-- labels -->
<text x="200" y="58" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#173043" text-anchor="middle">Q₁, D₁, L₁</text>
<text x="200" y="133" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#173043" text-anchor="middle">Q₂, D₂, L₂</text>
<!-- notes -->
<text x="38" y="155" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677">H = h_{w,0} + h_{w,p} + h_{w,3}</text>
<text x="38" y="171" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677" font-style="italic">Iteracija: pretpostavi omjer Q₁:Q₂, izjednači h_w</text>
</g>
</svg>