    <text x="310" y="548" font-size="11" fill="#263746" text-anchor="middle">Sile su sile tekućine na klipove; tlak nije vektor.</text>
    <text x="310" y="568" font-size="10" fill="#263746" text-anchor="middle">Četiri aktuatora; diskovi i kontakti nisu dio ove hidrauličke sheme.</text>
    <g id="u01fkv_formulas" transform="translate(610 30)">
      <text x="175.0" y="21" font-size="14" fill="#263746" text-anchor="middle" font-weight="700">Pet koraka rješenja</text>
      <text x="175.0" y="55" font-size="11" fill="#263746" text-anchor="middle">1. Sila na klip glavnog cilindra</text>
      <text x="175.0" y="79" font-size="15" fill="#263746" text-anchor="middle" font-weight="700">F<tspan baseline-shift="-3.3" font-size="11.25">M</tspan> = iFₙ = 5 · 300</text>
      <text x="175.0" y="100" font-size="13" fill="#263746" text-anchor="middle" font-weight="700">= 1500 N</text>
      <text x="175.0" y="133" font-size="11" fill="#263746" text-anchor="middle">2. Manometarski tlak</text>
      <text x="175.0" y="157" font-size="15" fill="#263746" text-anchor="middle" font-weight="700">p = F<tspan baseline-shift="-3.3" font-size="11.25">M</tspan> / A<tspan baseline-shift="-3.3" font-size="11.25">M</tspan>
      </text>
      <text x="175.0" y="178" font-size="13" fill="#263746" text-anchor="middle" font-weight="700">≈ 4,77 MPa</text>
      <text x="175.0" y="211" font-size="11" fill="#263746" text-anchor="middle">3. Sila po prednjem cilindru</text>
      <text x="175.0" y="235" font-size="15" fill="#263746" text-anchor="middle" font-weight="700">F<tspan baseline-shift="-3.3" font-size="11.25">f</tspan> = pπd<tspan baseline-shift="-3.3" font-size="11.25">f</tspan>²/4</text>
      <text x="175.0" y="256" font-size="13" fill="#263746" text-anchor="middle" font-weight="700">≈ 4,59 kN</text>
      <text x="175.0" y="289" font-size="11" fill="#263746" text-anchor="middle">4. Sila po stražnjem cilindru</text>
      <text x="175.0" y="313" font-size="15" fill="#263746" text-anchor="middle" font-weight="700">F<tspan baseline-shift="-3.3" font-size="11.25">r</tspan> = pπd<tspan baseline-shift="-3.3" font-size="11.25">r</tspan>²/4</text>
      <text x="175.0" y="334" font-size="13" fill="#263746" text-anchor="middle" font-weight="700">≈ 3,38 kN</text>
      <text x="175.0" y="367" font-size="11" fill="#263746" text-anchor="middle">5. Zbroj iznosa, ne rezultantni vektor</text>
      <text x="175.0" y="391" font-size="15" fill="#263746" text-anchor="middle" font-weight="700">F<tspan baseline-shift="-3.3" font-size="11.25">uk</tspan> = 2F<tspan baseline-shift="-3.3" font-size="11.25">f</tspan> + 2F<tspan baseline-shift="-3.3" font-size="11.25">r</tspan> ≈ 15,94 kN</text>
      <text x="175.0" y="412" font-size="13" fill="#263746" text-anchor="middle" font-weight="700">F<tspan baseline-shift="-2.86" font-size="9.75">uk</tspan> / Fₙ ≈ 53</text>
    </g>
    <text x="784" y="560" font-size="11" fill="#263746" text-anchor="middle">Omjer promjera provrta jest u mjerilu.</text>
    <text x="784" y="578" font-size="11" fill="#263746" text-anchor="middle">Duljine vodova i sila su shematske.</text>
  </g>
</svg>
