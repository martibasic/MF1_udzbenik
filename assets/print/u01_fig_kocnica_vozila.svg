<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" role="img" aria-labelledby="u01fkv_title u01fkv_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="u01fkv_title">Hidraulična kočnica: sile klipova</title>
  <desc id="u01fkv_desc">Papučica ima okomite krakove a i 5a od istoga zgloba. Kota glavnog promjera mjeri njegov provrt. Otvoreni vod razdvaja se u četiri radne komore s promjerima 35,30,30,35 mm. Sile tekućine djeluju prema pripadnim klipovima. Diskovi i kontakti nisu modelirani.</desc>
