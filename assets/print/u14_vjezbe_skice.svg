<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" role="img" aria-labelledby="u14vs_title u14vs_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="u14vs_title">U14 - Minimalne skice uz zadatke za vjezbu</title>
  <desc id="u14vs_desc">Sest grayscale skica uz zadatke: arteriola i vodovod (Re), preljev brane (Fr), usis crpke (kavitacijski broj), mlaznica i kap (We), vod zraka (Ma) te dionica cijevi s padom tlaka (Eu, lambda, Re).</desc>
  <defs>
    <marker id="u14vs_aG" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#5d6d7e" />
    </marker>
    <marker id="u14vs_aDim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L6,2.5 z" fill="#5d6d7e" />
    </marker>
    <marker id="u14vs_aDimR" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse">
      <path d="M0,0 L0,5 L6,2.5 z" fill="#5d6d7e" />
    </marker>
    <pattern id="u14vs_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#aab4bc" stroke-width="1.4" />
    </pattern>
  </defs>

  <rect width="980" height="640" fill="#ffffff" />

  <!-- ===== Z1 ===== -->
  <rect x="24" y="28" width="292" height="282" rx="8" fill="#fbfcfd" stroke="#90a4b4" stroke-width="1.2" />
  <circle cx="46" cy="50" r="13" fill="#5d6d7e" /><text x="46" y="55" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
  <circle cx="120" cy="160" r="14" fill="#e5e9ec" stroke="#5d6d7e" stroke-width="1.4" />
  <circle cx="220" cy="160" r="56" fill="#e5e9ec" stroke="#5d6d7e" stroke-width="1.6" />
  <text x="120" y="200" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#3a4a56">arteriola</text>
  <text x="220" y="234" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#3a4a56">vodovod</text>
  <text x="170" y="284" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#3a4a56">D, v → Re = vD/ν</text>

  <!-- ===== Z2 ===== -->
  <rect x="344" y="28" width="292" height="282" rx="8" fill="#fbfcfd" stroke="#90a4b4" stroke-width="1.2" />
  <circle cx="366" cy="50" r="13" fill="#5d6d7e" /><text x="366" y="55" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
  <path d="M376,150 L470,150 L470,210 L600,210" fill="none" stroke="#5d6d7e" stroke-width="2" />
  <path d="M376,138 q16,-8 32,0 t32,0 t32,0" fill="none" stroke="#90a4b4" stroke-width="1.4" />
  <path d="M486,200 q14,10 28,0 t28,0 t28,0" fill="none" stroke="#90a4b4" stroke-width="1.4" />
  <text x="500" y="270" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#3a4a56">preljev, λ = 20 → Fr</text>
  <text x="500" y="290" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">v_m, Q_m iz Fr_m = Fr_s</text>

  <!-- ===== Z3 ===== -->
  <rect x="664" y="28" width="292" height="282" rx="8" fill="#fbfcfd" stroke="#90a4b4" stroke-width="1.2" />
  <circle cx="686" cy="50" r="13" fill="#5d6d7e" /><text x="686" y="55" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
  <rect x="700" y="150" width="200" height="40" fill="url(#u14vs_hatch)" stroke="#5d6d7e" stroke-width="1.4" />
  <rect x="704" y="154" width="192" height="32" fill="#eef3f6" />
  <line x1="720" y1="170" x2="800" y2="170" stroke="#5d6d7e" stroke-width="2.2" marker-end="url(#u14vs_aG)" />
  <circle cx="850" cy="130" r="16" fill="#ffffff" stroke="#5d6d7e" stroke-width="1.4" />
  <line x1="850" y1="130" x2="858" y2="120" stroke="#5d6d7e" stroke-width="1.4" />
  <text x="800" y="240" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#3a4a56">usis crpke: p, v</text>
  <text x="800" y="262" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#3a4a56">σ = (p − p_v)/(½ρv²)</text>

  <!-- ===== Z4 ===== -->
  <rect x="24" y="338" width="292" height="282" rx="8" fill="#fbfcfd" stroke="#90a4b4" stroke-width="1.2" />
  <circle cx="46" cy="360" r="13" fill="#5d6d7e" /><text x="46" y="365" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
  <path d="M70,450 L130,450 L150,468 L150,492 L130,510 L70,510 Z" fill="#e5e9ec" stroke="#5d6d7e" stroke-width="1.5" />
  <line x1="150" y1="480" x2="210" y2="480" stroke="#5d6d7e" stroke-width="2.2" marker-end="url(#u14vs_aG)" />
  <circle cx="240" cy="480" r="10" fill="#e5e9ec" stroke="#5d6d7e" stroke-width="1.4" />
  <circle cx="262" cy="468" r="5" fill="#e5e9ec" stroke="#5d6d7e" stroke-width="1.2" />
  <circle cx="266" cy="492" r="4" fill="#e5e9ec" stroke="#5d6d7e" stroke-width="1.2" />
  <text x="170" y="560" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#3a4a56">mlaznica: d, v → We</text>

  <!-- ===== Z5 ===== -->
  <rect x="344" y="338" width="292" height="282" rx="8" fill="#fbfcfd" stroke="#90a4b4" stroke-width="1.2" />
  <circle cx="366" cy="360" r="13" fill="#5d6d7e" /><text x="366" y="365" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
  <rect x="376" y="450" width="220" height="44" fill="url(#u14vs_hatch)" stroke="#5d6d7e" stroke-width="1.4" />
  <rect x="380" y="454" width="212" height="36" fill="#eef3f6" />
  <line x1="400" y1="472" x2="500" y2="472" stroke="#5d6d7e" stroke-width="2.4" marker-end="url(#u14vs_aG)" />
  <text x="486" y="540" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#3a4a56">vod zraka: D, Q → Ma</text>
  <text x="486" y="562" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Ma = v/a, granica 0,3</text>

  <!-- ===== Z6 ===== -->
  <rect x="664" y="338" width="292" height="282" rx="8" fill="#fbfcfd" stroke="#90a4b4" stroke-width="1.2" />
  <circle cx="686" cy="360" r="13" fill="#5d6d7e" /><text x="686" y="365" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>
  <rect x="700" y="446" width="220" height="14" fill="url(#u14vs_hatch)" stroke="#5d6d7e" stroke-width="1.3" />
  <rect x="700" y="500" width="220" height="14" fill="url(#u14vs_hatch)" stroke="#5d6d7e" stroke-width="1.3" />
  <rect x="700" y="460" width="220" height="40" fill="#eef3f6" />
  <line x1="716" y1="480" x2="800" y2="480" stroke="#5d6d7e" stroke-width="2.2" marker-end="url(#u14vs_aG)" />
  <line x1="700" y1="534" x2="920" y2="534" stroke="#5d6d7e" stroke-width="1.3" marker-start="url(#u14vs_aDimR)" marker-end="url(#u14vs_aDim)" />
  <text x="810" y="528" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5d6d7e">L</text>
  <text x="810" y="566" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#3a4a56">cijev: D, L, Δp → Eu, λ, Re</text>
</svg>
