<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" role="img" aria-labelledby="u08kvs_u8ks-title u08kvs_u8ks-desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u08kvs_u8ks-title">U08 – tri jezgrene scene kontrolnog volumena</title>
  <desc id="u08kvs_u8ks-desc">Tri usporedne scene: suzenje cijevi (v raste), difuzor (v pada), komora za mijesanje s KV granicom i akumulacijom.</desc>
  <defs>
    <linearGradient id="u08kvs_u8ks-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4eef8"/>
      <stop offset="100%" stop-color="#7ec8e8"/>
    </linearGradient>
    <linearGradient id="u08kvs_u8ks-oil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0b8"/>
      <stop offset="100%" stop-color="#d4960a"/>
    </linearGradient>
    <pattern id="u08kvs_u8ks-sraf" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#8090a0"/>
      <line x1="0" y1="4" x2="8" y2="4" stroke="#546e7a" stroke-width="1.8"/>
    </pattern>
    <marker id="u08kvs_u8ks-arrG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#0f766e"/>
    </marker>
    <marker id="u08kvs_u8ks-arrG2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#0f766e"/>
    </marker>
    <marker id="u08kvs_u8ks-arrR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#b42318"/>
    </marker>
    <marker id="u08kvs_u8ks-arrUp" markerWidth="10" markerHeight="8" refX="5" refY="0" orient="auto">
      <path d="M0,8 L10,8 L5,0 z" fill="#c96c35"/>
    </marker>
  </defs>
  <!-- Canvas -->
  <rect width="940" height="420" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="372" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>
  <!-- Title -->
  <text x="54" y="55" font-family="'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#173043">Kontrolni volumen — tri jezgrene scene</text>
  <text x="54" y="76" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#516677">Suženje, difuzor i komora za miješanje — svaki zahtijeva drugačije čitanje kontinuiteta.</text>

  <!-- ===== SCENE 1: Suženje (cijev se sužava, v raste) ===== -->
  <rect x="42" y="92" width="270" height="300" rx="12" fill="#f4f8fb" stroke="#d0dde8" stroke-width="1.5"/>
  <text x="58" y="114" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">Suženje</text>
  <text x="58" y="130" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#516677">D₁ > D₂  →  v₁ &lt; v₂</text>
  <!-- Pipe converges from wide (left) to narrow (right) -->
  <!-- Top wall: (68,160) → (220,188) upper convergence -->
  <!-- Bot wall: (68,224) → (220,196) lower convergence -->
  <polygon points="68,154 68,230 220,204 220,170" fill="url(#u08kvs_u8ks-sraf)"/>
  <polygon points="68,166 220,180 220,194 68,218" fill="url(#u08kvs_u8ks-water)"/>
  <line x1="68" y1="154" x2="220" y2="170" stroke="#3d4f5a" stroke-width="2.5"/>
  <line x1="68" y1="230" x2="220" y2="204" stroke="#3d4f5a" stroke-width="2.5"/>
  <line x1="68" y1="154" x2="68" y2="230" stroke="#3d4f5a" stroke-width="2.5"/>
  <line x1="220" y1="170" x2="220" y2="204" stroke="#3d4f5a" stroke-width="2.5"/>
  <!-- v1 arrow (short → slow) -->
  <line x1="46" y1="192" x2="66" y2="192" stroke="#0f766e" stroke-width="3" marker-end="url(#u08kvs_u8ks-arrG)"/>
  <text x="44" y="184" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#0f766e">v₁</text>
  <!-- v2 arrow (long → fast) -->
  <line x1="220" y1="187" x2="286" y2="187" stroke="#0f766e" stroke-width="3" marker-end="url(#u08kvs_u8ks-arrG)"/>
  <text x="272" y="178" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#0f766e">v₂</text>
  <!-- D1, D2 braces -->
  <line x1="58" y1="158" x2="58" y2="226" stroke="#546e7a" stroke-width="1.5"/>
  <text x="46" y="196" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#546e7a">D₁</text>
  <line x1="232" y1="172" x2="232" y2="202" stroke="#546e7a" stroke-width="1.5"/>
  <text x="236" y="192" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#546e7a">D₂</text>
  <!-- Formula -->
  <rect x="56" y="252" width="238" height="52" rx="8" fill="#fffef6" stroke="#c49a0a" stroke-width="1.5"/>
  <text x="68" y="270" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">A₁v₁ = A₂v₂</text>
  <text x="68" y="288" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#516677">Q ostaje isti kroz oba presjeka</text>
  <!-- KV -->
  <rect x="56" y="148" width="192" height="92" rx="6" fill="none" stroke="#c96c35" stroke-width="1.8" stroke-dasharray="8,5"/>

  <!-- ===== SCENE 2: Difuzor (cijev se širi, v pada) ===== -->
  <rect x="334" y="92" width="272" height="300" rx="12" fill="#f4f8fb" stroke="#d0dde8" stroke-width="1.5"/>
  <text x="350" y="114" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">Difuzor</text>
  <text x="350" y="130" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#516677">D₁ &lt; D₂  →  v₁ > v₂</text>
  <!-- Pipe diverges from narrow (left) to wide (right) -->
  <polygon points="358,170 358,204 510,228 510,146" fill="url(#u08kvs_u8ks-sraf)"/>
  <polygon points="358,180 510,158 510,216 358,194" fill="url(#u08kvs_u8ks-water)"/>
  <line x1="358" y1="170" x2="510" y2="146" stroke="#3d4f5a" stroke-width="2.5"/>
  <line x1="358" y1="204" x2="510" y2="228" stroke="#3d4f5a" stroke-width="2.5"/>
  <line x1="358" y1="170" x2="358" y2="204" stroke="#3d4f5a" stroke-width="2.5"/>
  <line x1="510" y1="146" x2="510" y2="228" stroke="#3d4f5a" stroke-width="2.5"/>
  <!-- v1 arrow (long → fast) -->
  <line x1="330" y1="187" x2="356" y2="187" stroke="#0f766e" stroke-width="3.5" marker-end="url(#u08kvs_u8ks-arrG)"/>
  <text x="316" y="180" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#0f766e">v₁</text>
  <!-- v2 arrow (short → slow) -->
  <line x1="510" y1="187" x2="548" y2="187" stroke="#0f766e" stroke-width="2" marker-end="url(#u08kvs_u8ks-arrG)"/>
  <text x="550" y="180" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#0f766e">v₂</text>
  <!-- D1, D2 -->
  <line x1="348" y1="173" x2="348" y2="201" stroke="#546e7a" stroke-width="1.5"/>
  <text x="336" y="193" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#546e7a">D₁</text>
  <line x1="520" y1="148" x2="520" y2="226" stroke="#546e7a" stroke-width="1.5"/>
  <text x="524" y="196" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#546e7a">D₂</text>
  <!-- Formula -->
  <rect x="348" y="252" width="240" height="52" rx="8" fill="#fffef6" stroke="#c49a0a" stroke-width="1.5"/>
  <text x="360" y="270" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">A₁v₁ = A₂v₂</text>
  <text x="360" y="288" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#516677">Q isti, brzina pada u širem presjeku</text>
  <!-- KV -->
  <rect x="348" y="144" width="192" height="96" rx="6" fill="none" stroke="#c96c35" stroke-width="1.8" stroke-dasharray="8,5"/>

  <!-- ===== SCENE 3: Komora s akumulacijom ===== -->
  <rect x="628" y="92" width="284" height="300" rx="12" fill="#f4f8fb" stroke="#d0dde8" stroke-width="1.5"/>
  <text x="644" y="114" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">Akumulacija</text>
  <text x="644" y="130" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#516677">ΣQ_ul ≠ ΣQ_iz  →  dV/dt ≠ 0</text>
  <!-- Tank -->
  <rect x="654" y="148" width="16" height="158" fill="url(#u08kvs_u8ks-sraf)"/>
  <rect x="854" y="148" width="16" height="158" fill="url(#u08kvs_u8ks-sraf)"/>
  <rect x="654" y="290" width="216" height="16" fill="url(#u08kvs_u8ks-sraf)"/>
  <line x1="654" y1="148" x2="654" y2="306" stroke="#3d4f5a" stroke-width="2"/>
  <line x1="870" y1="148" x2="870" y2="306" stroke="#3d4f5a" stroke-width="2"/>
  <line x1="654" y1="306" x2="870" y2="306" stroke="#3d4f5a" stroke-width="2.5"/>
  <!-- Water fill -->
  <rect x="670" y="228" width="184" height="78" fill="url(#u08kvs_u8ks-water)" stroke="none"/>
  <line x1="654" y1="228" x2="870" y2="228" stroke="#2980b9" stroke-width="2.5"/>
  <!-- Inlet arrow into tank (left) -->
  <rect x="614" y="212" width="40" height="20" fill="url(#u08kvs_u8ks-water)" stroke="none"/>
  <line x1="614" y1="212" x2="654" y2="212" stroke="#3d4f5a" stroke-width="1.5"/>
  <line x1="614" y1="232" x2="654" y2="232" stroke="#3d4f5a" stroke-width="1.5"/>
  <line x1="576" y1="222" x2="612" y2="222" stroke="#0f766e" stroke-width="3" marker-end="url(#u08kvs_u8ks-arrG)"/>
  <text x="566" y="214" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#0f766e">Q_in</text>
  <!-- Outlet arrow from tank (right, bottom) -->
  <rect x="870" y="268" width="38" height="18" fill="url(#u08kvs_u8ks-water)" stroke="none"/>
  <line x1="870" y1="268" x2="908" y2="268" stroke="#3d4f5a" stroke-width="1.5"/>
  <line x1="870" y1="286" x2="908" y2="286" stroke="#3d4f5a" stroke-width="1.5"/>
  <line x1="870" y1="277" x2="900" y2="277" stroke="#b42318" stroke-width="3" marker-end="url(#u08kvs_u8ks-arrR)"/>
  <!-- dh/dt arrow -->
  <line x1="762" y1="226" x2="762" y2="186" stroke="#c96c35" stroke-width="2.5" marker-end="url(#u08kvs_u8ks-arrUp)"/>
  <text x="768" y="210" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#c96c35">dh/dt</text>
  <!-- Q_out label -->
  <!-- KV dashed box -->
  <rect x="644" y="138" width="236" height="176" rx="6" fill="none" stroke="#c96c35" stroke-width="1.8" stroke-dasharray="8,5"/>
  <!-- Formula -->
  <rect x="640" y="326" width="264" height="52" rx="8" fill="#fffef6" stroke="#c49a0a" stroke-width="1.5"/>
  <text x="652" y="344" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">Q_in − Q_out = A_T · dh/dt</text>
  <text x="652" y="362" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#516677">nestacionarni KV — razina raste</text>
</svg>