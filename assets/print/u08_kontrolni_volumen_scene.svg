  <title id="u08kvs-title">Kontinuitet kroz suženje, difuzor i spremnik</title>
  <desc id="u08kvs-desc">Tri izvorna panela. Cijevni krajevi otvoreni su, a promjeri su kotirani poprečno na os cijevi. Krute stijenke prate vanjski rub istog kontinuiranog fluida. Miješajući spremnik ima dva uronjena otvorena dotoka i otvoren odvod; buduća razina označena je isprekidano bez lažnoga sloja. Tlak u difuzoru ne zaključuje se iz same bilance mase.</desc>
