<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" role="img" aria-labelledby="u03v3vs_title u03v3vs_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:900px;height:auto;">
  <title id="u03v3vs_title">Vakuumski spremnik s otvorenim zivinim manometrom</title>
  <desc id="u03v3vs_desc">Zatvoreni spremnik s vodom i plinskim prostorom pod vakuumom (p_g manje od p_0). Otvoreni U-manometar sa zivom prikazuje visu razinu zive u kraku spojenom na spremnik za delta_h=0,18 m. Tocka A u vodi na dubini h=1,20 m. Desni panel sadrzi izvod tlakova p_g, p_A i njihovih manometarskih vrijednosti.</desc>

  <defs>
    <!-- Strelice tlaka (plave) -->
    <marker id="u03v3vs_pr" markerWidth="6" markerHeight="4" refX="5.5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#1565c0" />
    </marker>
    <!-- Strelice atmosferskog tlaka (sive) -->
    <marker id="u03v3vs_prA" markerWidth="6" markerHeight="4" refX="5.5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#5a6a78" />
    </marker>
    <!-- Markeri kota (smedji) -->
    <marker id="u03v3vs_dim" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#b7600c" />
    </marker>
    <marker id="u03v3vs_dimL" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto-start-reverse">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#b7600c" />
    </marker>
    <!-- Leader marker (mala tocka) -->
    <marker id="u03v3vs_dot" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" orient="auto">
      <circle cx="2.5" cy="2.5" r="1.6" fill="#5a6a78" />
    </marker>
    <!-- Gradijent vode -->
    <linearGradient id="u03v3vs_voda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aed6f1" />
      <stop offset="100%" stop-color="#5b9ec9" />
    </linearGradient>
    <!-- Gradijent zive -->
    <linearGradient id="u03v3vs_ziva" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0b8c0" />
      <stop offset="100%" stop-color="#808890" />
    </linearGradient>
    <!-- Plinski prostor (vakuum, blago zuto) -->
    <linearGradient id="u03v3vs_plin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4efe2" />
      <stop offset="100%" stop-color="#e8e0c8" />
    </linearGradient>
    <!-- Srafura stijenki -->
    <pattern id="u03v3vs_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.1" />
    </pattern>
  </defs>

  <!-- Pozadina i okvir -->
  <rect width="940" height="500" fill="#ffffff" />
  <rect x="14" y="14" width="912" height="472" rx="12" fill="#ffffff" stroke="#dde3ea" stroke-width="1.4" />

  <!-- Vertikalni separator izmedju panela -->
  <line x1="540" y1="36" x2="540" y2="464" stroke="#dce7f0" stroke-width="1.1" stroke-dasharray="4,5" />

  <!-- ===================== LIJEVI PANEL: FIZIKALNI MODEL =====================
       KOORDINATE (rev2 - sirenje krakova U-manometra):
         Spremnik: outer x=60..280, y=70..420; stjenke debljine 10
           Unutar: x=70..280, y=80..410 (visina 330)
           Plin: y=80..180 (visina 100), Voda: y=180..410 (visina 230)
         Spojna cijev (gas): y=110..130, od x=290 do x=345
         U-manometar: KRAKOVI razmaknuti za citljivost
           Lijevi krak (spoj na p_g):  inner x=345..390 (sirina 45)
           Desni krak (atmosfera):     inner x=415..460 (sirina 45)
           Razmak izmedju krakova: x=390..415 (25 px)
           Lijevi krak vrh (zatvoren): y=130
           Desni krak vrh (otvoren atm): y=60
           Dno U (zajednicko): y=440..465
         Razine zive (delta_h = 0,18 m vidno):
           LIJEVA (visa, spoj na vakuum): y=235
           DESNA (niza, atmosfera):       y=295
         Tocka A: x=185, y=325 (h = 1,20 m ispod slobodne povrsine y=180; skala: 145 px = 1,20 m)
  -->

  <!-- ========== VAKUUMSKI SPREMNIK (zatvoren) ========== -->
  <!-- Fluid prvo (voda + plin) -->
  <rect x="70" y="180" width="210" height="230" fill="url(#u03v3vs_voda)" />
  <rect x="70" y="80" width="210" height="100" fill="url(#u03v3vs_plin)" />

  <!-- Stjenke (pune visine, srafura, tamni rub) -->
  <rect x="60" y="70" width="230" height="10" fill="url(#u03v3vs_hatch)" stroke="#3a4a56" stroke-width="1.2" />
  <rect x="60" y="410" width="230" height="10" fill="url(#u03v3vs_hatch)" stroke="#3a4a56" stroke-width="1.2" />
  <rect x="60" y="80" width="10" height="330" fill="url(#u03v3vs_hatch)" stroke="#3a4a56" stroke-width="1.2" />
  <rect x="280" y="80" width="10" height="330" fill="url(#u03v3vs_hatch)" stroke="#3a4a56" stroke-width="1.2" />

  <!-- Slobodna povrsina vode (puna plava linija) -->
  <line x1="70" y1="180" x2="280" y2="180" stroke="#1565c0" stroke-width="2" />

  <!-- ========== SPOJNA CIJEV (gas vod od spremnika do lijevog kraka U-cijevi) ========== -->
  <!-- Stjenke cijevi (gornja i donja) -->
  <line x1="280" y1="110" x2="345" y2="110" stroke="#3a4a56" stroke-width="1.4" />
  <line x1="280" y1="130" x2="345" y2="130" stroke="#3a4a56" stroke-width="1.4" />
  <!-- Unutrasnjost cijevi - plin -->
  <rect x="280" y="111" width="65" height="18" fill="url(#u03v3vs_plin)" />
  <!-- Port overlay preko desne stjenke spremnika -->
  <rect x="280" y="111" width="10" height="18" fill="url(#u03v3vs_plin)" />

  <!-- ========== U-MANOMETAR (otvoreni Zivin) ========== -->
  <!-- Vanjske stjenke krakova (tanke linije) -->
  <!-- Lijevi krak: inner 345..390, walls at x=343 i x=392 (debljina 2 sa svake strane) -->
  <line x1="343" y1="130" x2="343" y2="440" stroke="#3a4a56" stroke-width="2" />
  <line x1="392" y1="130" x2="392" y2="440" stroke="#3a4a56" stroke-width="2" />
  <!-- Desni krak: inner 415..460, walls at x=413 i x=462 -->
  <line x1="413" y1="60" x2="413" y2="440" stroke="#3a4a56" stroke-width="2" />
  <line x1="462" y1="60" x2="462" y2="440" stroke="#3a4a56" stroke-width="2" />
  <!-- Lijevi krak vrh (zatvoren - kratki kapak povezan na spojnu cijev) -->
  <line x1="343" y1="130" x2="392" y2="130" stroke="#3a4a56" stroke-width="2" />
  <!-- Dno U: zajednicko sa zaobljenim spojem (jednostavnije pravokutno dno) -->
  <line x1="343" y1="465" x2="462" y2="465" stroke="#3a4a56" stroke-width="2" />
  <!-- Donji spoj - zaobljenje krakova (linija ispod) -->
  <line x1="343" y1="440" x2="343" y2="465" stroke="#3a4a56" stroke-width="0" />
  <!-- Lijeva i desna donja zakrivljenost: koristimo kratke linije -->
  <line x1="392" y1="440" x2="413" y2="440" stroke="#3a4a56" stroke-width="2" />
  <!-- Vertikalni rubovi dna: x=343 do 465, x=462 do 465 -->
  <line x1="343" y1="440" x2="343" y2="465" stroke="#3a4a56" stroke-width="2" />
  <line x1="462" y1="440" x2="462" y2="465" stroke="#3a4a56" stroke-width="2" />

  <!-- ISPUNJENJE U-MANOMETRA -->
  <!-- Plin u lijevom kraku iznad zive (od y=131 do y=235) -->
  <rect x="344" y="131" width="48" height="104" fill="url(#u03v3vs_plin)" />
  <!-- Atmosferski zrak u desnom kraku (od y=61 do y=295) -->
  <rect x="414" y="61" width="48" height="234" fill="#f5fbff" />
  <!-- Ziva u lijevom kraku (od y=235 do y=440) -->
  <rect x="344" y="235" width="48" height="205" fill="url(#u03v3vs_ziva)" />
  <!-- Ziva u desnom kraku (od y=295 do y=440) -->
  <rect x="414" y="295" width="48" height="145" fill="url(#u03v3vs_ziva)" />
  <!-- Ziva u dnu (povezuje krakove, ukljucuje prostor izmedju) -->
  <rect x="344" y="440" width="118" height="24" fill="url(#u03v3vs_ziva)" />

  <!-- Granicne linije zive (puna plava da naglasi povrsinu) -->
  <line x1="344" y1="235" x2="392" y2="235" stroke="#3a4a56" stroke-width="1.5" />
  <line x1="414" y1="295" x2="462" y2="295" stroke="#3a4a56" stroke-width="1.5" />

  <!-- Otvoreni vrh desnog kraka (atmosfera) - kratka strelica + p_0 -->
  <line x1="438" y1="34" x2="438" y2="56" stroke="#5a6a78" stroke-width="1.8" marker-end="url(#u03v3vs_prA)" />
  <!-- ========== OZNAKE U SPREMNIKU ========== -->
  <!-- p_g labela u plinskom prostoru -->
  <!-- Oznaka vode -->
  <!-- Tocka A -->
  <circle cx="195" cy="325" r="5" fill="#c0392b" />
  <!-- ========== OZNAKE U MANOMETRU ========== -->
  <!-- Ziva u dnu -->
  <!-- Oznake krakova (mali natpisi, ABOVE mercury levels) -->
  <!-- Lijevi krak: plin je u y=131..235, tu mozemo staviti tekst -->
  <!-- Desni krak: zrak je u y=61..295 -->
  <!-- ========== KOTE ========== -->

  <!-- Kota h: od slobodne povrsine (y=180) do tocke A (y=325), lijevo od spremnika x=34 -->
  <!-- Kota delta_h: razlika razina zive (desno od desnog kraka) -->
  <!-- Pomocne linije od razina zive do dim osi x=500 -->
  <!-- ========== LEADERI ZA RAZINE ZIVE ========== -->
  <!-- (uklonjena dodatna labela "visa razina zive" - geometrija + Delta_h kota
        + labele "plin (=p_g)" / "zrak (=p_0)" iznad razina dovoljno objasnjavaju.) -->

  <!-- ========== NASLOV LIJEVOG PANELA ========== -->
  <!-- Spojni vod (mali label sa strelicom/vodicem, pomaknut desno da ne preklapa stijenku) -->
  <line x1="335" y1="98" x2="345" y2="115" stroke="#5a6a78" stroke-width="0.6" />
  <!-- ===================== DESNI PANEL: FORMULE I REZULTATI ===================== -->

  <!-- Kutija formula -->
  <rect x="560" y="46" width="356" height="410" rx="10" fill="#f4f9fd" stroke="#1565c0" stroke-width="1.4" />
  <!-- Header bar -->
  <rect x="560" y="46" width="356" height="32" rx="10" fill="#1565c0" />
  <rect x="560" y="62" width="356" height="16" fill="#1565c0" />
  <!-- ===== Blok 1: p_g iz manometra ===== -->
  <line x1="580" y1="174" x2="896" y2="174" stroke="#c8d6e4" stroke-width="1" />

  <!-- ===== Blok 2: p_g manometarski ===== -->
  <line x1="580" y1="248" x2="896" y2="248" stroke="#c8d6e4" stroke-width="1" />

  <!-- ===== Blok 3: p_A apsolutni ===== -->
  <line x1="580" y1="340" x2="896" y2="340" stroke="#c8d6e4" stroke-width="1" />

  <!-- ===== Blok 4: p_A manometarski ===== -->
  <!-- Footer komentar -->
  <line x1="60" y1="180" x2="34" y2="180" stroke="#b7600c" stroke-width="0.7" />
  <line x1="195" y1="325" x2="34" y2="325" stroke="#b7600c" stroke-width="0.7" stroke-dasharray="3,3" />
  <line x1="38" y1="180" x2="30" y2="180" stroke="#b7600c" stroke-width="1.2" />
  <line x1="38" y1="325" x2="30" y2="325" stroke="#b7600c" stroke-width="1.2" />
  <line x1="34" y1="183" x2="34" y2="322" stroke="#b7600c" stroke-width="1.4" marker-start="url(#u03v3vs_dimL)" marker-end="url(#u03v3vs_dim)" />
  <line x1="392" y1="235" x2="500" y2="235" stroke="#b7600c" stroke-width="0.7" stroke-dasharray="3,3" />
  <line x1="462" y1="295" x2="500" y2="295" stroke="#b7600c" stroke-width="0.7" />
  <line x1="496" y1="235" x2="504" y2="235" stroke="#b7600c" stroke-width="1.2" />
  <line x1="496" y1="295" x2="504" y2="295" stroke="#b7600c" stroke-width="1.2" />
  <line x1="500" y1="238" x2="500" y2="292" stroke="#b7600c" stroke-width="1.4" marker-start="url(#u03v3vs_dimL)" marker-end="url(#u03v3vs_dim)" />
  <text x="438" y="26" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" font-weight="700" text-anchor="middle" fill="#5a6a78">p<tspan baseline-shift="sub" font-size="0.7em">0</tspan></text>
  <text x="438" y="14" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#5a6a78">(atmosfera)</text>

  <text x="175" y="125" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-style="italic" font-weight="700" text-anchor="middle" fill="#0d47a1">p<tspan baseline-shift="sub" font-size="0.65em">g</tspan></text>
  <text x="201.3" y="125.0" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#0d47a1">&lt; p<tspan baseline-shift="sub" font-size="0.7em">0</tspan>&lt; p0   (vakuum)</text>
  <text x="175" y="162" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#5a6a78">plin / para</text>

  <text x="110" y="265" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" fill="#0d47a1">voda</text>
  <text x="110" y="282" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a2530">ρ = 1000 kg/m³</text>

  <text x="207" y="330" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#c0392b">A</text>

  <text x="403" y="458" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#ffffff" font-weight="700">živa</text>
  <text x="403" y="478" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#3a4a56">ρ<tspan baseline-shift="sub" font-size="0.75em">Hg</tspan> = 13 600 kg/m³</text>

  <text x="368" y="170" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#5a6a78">plin</text>
  <text x="368" y="183" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#5a6a78">(= p<tspan baseline-shift="sub" font-size="0.75em">g</tspan>)</text>
  <text x="438" y="170" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#5a6a78">zrak</text>
  <text x="438" y="183" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#5a6a78">(= p<tspan baseline-shift="sub" font-size="0.75em">0</tspan>)</text>

  <text x="380" y="92" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#5a6a78">spojni vod (plin)</text>

  <text x="738" y="68" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Vakuumski spremnik — izvod tlakova</text>

  <text x="738" y="100" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">1) Tlak plina u spremniku (apsolutni)</text>
  <text x="738" y="122" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a2530">p<tspan baseline-shift="sub" font-size="0.7em">g</tspan> = p<tspan baseline-shift="sub" font-size="0.7em">0</tspan> − ρ<tspan baseline-shift="sub" font-size="0.7em">Hg</tspan>·g·Δh</text>
  <text x="738" y="142" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1a2530">= 101 325 − 13 600·9,81·0,18</text>
  <text x="738" y="161" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">≈ 77 310 Pa ≈ 77,3 kPa</text>
  <text x="738" y="192" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">2) Manometarski tlak plina</text>
  <text x="738" y="214" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a2530">p<tspan baseline-shift="sub" font-size="0.7em">g,m</tspan> = p<tspan baseline-shift="sub" font-size="0.7em">g</tspan> − p<tspan baseline-shift="sub" font-size="0.7em">0</tspan> = −ρ<tspan baseline-shift="sub" font-size="0.7em">Hg</tspan>·g·Δh</text>
  <text x="738" y="234" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b">≈ −24 015 Pa ≈ −24,0 kPa  (podtlak)</text>
  <text x="738" y="266" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">3) Apsolutni tlak u točki A (silazak kroz vodu)</text>
  <text x="738" y="288" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a2530">p<tspan baseline-shift="sub" font-size="0.7em">A</tspan> = p<tspan baseline-shift="sub" font-size="0.7em">g</tspan> + ρ·g·h</text>
  <text x="738" y="308" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1a2530">= 77 310 + 1000·9,81·1,20</text>
  <text x="738" y="327" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">≈ 89 082 Pa ≈ 89,1 kPa</text>
  <text x="738" y="358" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">4) Manometarski tlak u točki A</text>
  <text x="738" y="380" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a2530">p<tspan baseline-shift="sub" font-size="0.7em">A,m</tspan> = p<tspan baseline-shift="sub" font-size="0.7em">A</tspan> − p<tspan baseline-shift="sub" font-size="0.7em">0</tspan></text>
  <text x="738" y="400" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b">≈ −12 243 Pa ≈ −12,2 kPa  (još podtlak)</text>

  <text x="738" y="430" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">Stupac vode 1,20 m ne nadoknadjuje vakuum –</text>
  <text x="738" y="446" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">točka A i dalje ispod atmosferskog tlaka.</text>

<text x="22" y="248" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" font-weight="700" text-anchor="middle" fill="#b7600c">h</text>
  <text x="22.0" y="264.0" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#b7600c">= 1,20 m</text>

  <text x="514" y="262" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" font-weight="700" fill="#b7600c">Δh</text>
  <text x="514.0" y="278.0" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#b7600c">= 0,18 m</text>

  </svg>