      <line x1="300" y1="125" x2="335" y2="89" stroke="#657781" stroke-width="1" />
      <text x="280" y="83" font-size="14" fill="#263746" text-anchor="start">Ag = 48,0 mm²</text>
      <text x="326" y="184" font-size="13" fill="#263746" text-anchor="start">pᵦ = 100</text>
      <text x="335" y="201" font-size="13" fill="#263746" text-anchor="start">kPa(abs)</text>
      <text x="31" y="213" font-size="13" fill="#263746" text-anchor="start">ṁ = 0,0595 kg/s; An = 50,0 mm² (nazivno)</text>
      <text x="223" y="235" font-size="12" fill="#263746" text-anchor="middle">Ag je izmjereni slobodni otvor; vanjski tok nije prikazan.</text>
    </g>
