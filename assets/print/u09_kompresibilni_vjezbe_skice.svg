      <line x1="335" y1="180" x2="364" y2="180" stroke="#657781" stroke-width="1" />
      <line x1="353" y1="110" x2="363" y2="110" stroke="#657781" stroke-width="1.2" />
      <line x1="353" y1="180" x2="363" y2="180" stroke="#657781" stroke-width="1.2" />
      <path id="u09kvs_z2diameter" d="M358 110 L358 180" fill="none" stroke="#657781" stroke-width="1.4" marker-start="url(#u09kvs_dim)" marker-end="url(#u09kvs_dim)" />
      <text x="337" y="93" font-size="14" fill="#263746" text-anchor="middle">D = 0,20 m</text>
      <text x="194" y="219" font-size="14" fill="#263746" text-anchor="middle">Uzdužni presjek; kružni vod.</text>
    </g>
    <g id="u09kvs_z3" transform="translate(28 286)">
