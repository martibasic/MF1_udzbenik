      <path id="u09kvs_z2flow" d="M117 145 L221 145" fill="none" stroke="#356b83" stroke-width="2.3" marker-end="url(#u09kvs_v)" />
      <text x="169.0" y="136" font-size="14" fill="#263746" text-anchor="middle">v = Q/A</text>
