      <text x="22" y="76" font-size="13" fill="#263746" text-anchor="start">iz mirne napojne komore</text>
      <text x="251" y="59" font-size="14" fill="#263746" text-anchor="start">p₀₂ = 451 ± 4 kPa</text>
      <text x="251" y="76" font-size="13" fill="#263746" text-anchor="start">podzvučna Pitotova sonda</text>
