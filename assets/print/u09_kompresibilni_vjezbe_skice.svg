<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820" role="img" aria-labelledby="u09kvs_title u09kvs_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:960px;height:auto;">
  <title id="u09kvs_title">Skice vježbi kompresibilnog idealnog toka</title>
  <desc id="u09kvs_desc">Z1: mirujući helij i dva smjera zvuka. Z2: otvoreni kružni vod s poprečnom kotom promjera. Z3: nepomične mjerne točke A i B udaljene 1,20 m, različita vremena putovanja uzvodno i nizvodno. Z4 i Z5: otvoreni izlazi konvergentnih sapnica; vanjski tok nije prikazan. Z6: prikaz mjernog dijela kanala, normalni val nije stijenka; statički priključci prolaze kroz stvarne otvore, Pitotova sonda desno od vala otvorena je prema dotoku. Ukupni tlak prije vala mjeri se u uzvodnoj mirnoj komori izvan prikaza. Shematske debljine stijenki i mjernih vodova.</desc>
  <defs>
    <pattern id="u09kvs_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.8" />
    </pattern>
    <marker id="u09kvs_v" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
    </marker>
    <marker id="u09kvs_dim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse">
      <path d="M0 0 L6 2.5 L0 5 Z" fill="#657781" />
    </marker>
    <marker id="u09kvs_dimSmall" markerWidth="3" markerHeight="3" refX="3" refY="1.5" orient="auto-start-reverse">
      <path d="M0 0 L3 1.5 L0 3 Z" fill="#356b83" />
    </marker>
  </defs>
  <g font-family="Arial, Liberation Sans, sans-serif" fill="#3a4a56">
    <defs>
      <marker id="u09kvs_sound" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
        <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
      </marker>
    </defs>
    <g id="u09kvs_z1" transform="translate(28 24)">
      <text x="31" y="30" font-size="14" fill="#263746" text-anchor="middle" font-weight="700">Z1</text>
      <text x="59" y="30" font-size="14" fill="#263746" text-anchor="start" font-weight="700">Zvuk u mirujućem heliju</text>
      <text x="223" y="68" font-size="14" fill="#263746" text-anchor="middle">T = 300 K; v = 0</text>
      <rect id="u09kvs_z1ductgas" x="49" y="102" width="348" height="76" rx="0" fill="#dcebf1" stroke="none" stroke-width="1.2" />
      <rect id="u09kvs_z1ducttop" x="49" y="95" width="348" height="7" rx="0" fill="url(#u09kvs_hatch)" stroke="#3a4a56" stroke-width="1.2" />
      <rect id="u09kvs_z1ductbottom" x="49" y="178" width="348" height="7" rx="0" fill="url(#u09kvs_hatch)" stroke="#3a4a56" stroke-width="1.2" />
      <line x1="66" y1="140" x2="380" y2="140" stroke="#657781" stroke-width="1" stroke-dasharray="4 4" />
      <circle id="u09kvs_z1origin" cx="223" cy="140" r="5" fill="#356b83" />
      <text x="223" y="163" font-size="14" fill="#263746" text-anchor="middle">O</text>
      <path id="u09kvs_z1left" d="M196 140 L118 140" fill="none" stroke="#356b83" stroke-width="2.3" marker-end="url(#u09kvs_sound)" />
      <text x="157.0" y="129" font-size="14" fill="#263746" text-anchor="middle">−a</text>
      <path id="u09kvs_z1right" d="M250 140 L328 140" fill="none" stroke="#356b83" stroke-width="2.3" marker-end="url(#u09kvs_sound)" />
      <text x="289.0" y="129" font-size="14" fill="#263746" text-anchor="middle">+a</text>
      <path id="u09kvs_z1axis" d="M341 209 L395 209" fill="none" stroke="#356b83" stroke-width="2.3" marker-end="url(#u09kvs_sound)" />
      <text x="368.0" y="198" font-size="14" fill="#263746" text-anchor="middle">x</text>
      <text x="61" y="219" font-size="14" fill="#263746" text-anchor="start">Poremećaj putuje u oba smjera.</text>
    </g>
    <g id="u09kvs_z2" transform="translate(486 24)">
