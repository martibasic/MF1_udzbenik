      <text x="300" y="102" font-size="14" fill="#263746" text-anchor="middle">e: pₑ, Maₑ</text>
      <text x="354" y="173" font-size="13" fill="#263746" text-anchor="middle">pᵦ,M (bar):</text>
      <text x="354" y="192" font-size="13" fill="#263746" text-anchor="middle">I: 4,00; II: 3,00</text>
      <text x="223" y="230" font-size="12" fill="#263746" text-anchor="middle">Vanjski tok nije prikazan; izlaz je najmanji presjek.</text>
    </g>
