<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 859 788" role="img" aria-labelledby="u09kvs_title u09kvs_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:859px;height:auto;">
  <title id="u09kvs_title">Skice vježbi kompresibilnog idealnog toka</title>
  <desc id="u09kvs_desc">Z1: mirujući helij i dva smjera zvuka. Z2: boca stlačenog zraka za upućivanje motora, ventil idealiziran kao konvergentni kritični presjek A* i otvoreni vod prema motoru, širi od kritičnog presjeka, u kojem vlada protutlak pb; stanje boce je zaustavno. Z3: nepomične mjerne točke A i B udaljene 1,20 m, različita vremena putovanja uzvodno i nizvodno. Z4 i Z5: otvoreni izlazi konvergentnih sapnica; vanjski tok nije prikazan. Z6: prikaz mjernog dijela kanala, normalni val nije stijenka; statički priključci prolaze kroz stvarne otvore, Pitotova sonda otvorom u presjeku 2, desno od vala, okrenuta je prema dotoku. Zaustavni tlak prije vala mjeri se u uzvodnoj mirnoj komori izvan prikaza. Shematske debljine stijenki i mjernih vodova.</desc>
  <defs>
    <pattern id="u09kvs_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.8" />
    </pattern>
    <marker id="u09kvs_v" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
