      <text x="23" y="65" font-size="14" fill="#263746" text-anchor="start">p₀,M = 7,00 bar</text>
      <text x="238" y="65" font-size="14" fill="#263746" text-anchor="start">pₐₜₘ = 1,00 bar(abs)</text>
