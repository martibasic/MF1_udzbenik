      <path id="u09kvs_z3upstream" d="M334 164 L106 164" fill="none" stroke="#356b83" stroke-width="2.3" marker-end="url(#u09kvs_sound)" />
      <text x="220.0" y="153" font-size="14" fill="#263746" text-anchor="middle">tBA = 4,00 ms</text>
      <path id="u09kvs_z3flow" d="M167 61 L263 61" fill="none" stroke="#356b83" stroke-width="2.3" marker-end="url(#u09kvs_v)" />
      <text x="215.0" y="52" font-size="14" fill="#263746" text-anchor="middle">v</text>
      <line x1="90" y1="187" x2="90" y2="218" stroke="#657781" stroke-width="1" />
      <line x1="350" y1="187" x2="350" y2="218" stroke="#657781" stroke-width="1" />
      <line x1="90" y1="209" x2="90" y2="219" stroke="#657781" stroke-width="1.2" />
