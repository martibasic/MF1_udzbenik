      <text x="59" y="30" font-size="14" fill="#263746" text-anchor="start" font-weight="700">Machov broj u kružnom vodu</text>
      <text x="223" y="66" font-size="14" fill="#263746" text-anchor="middle">T = 20 °C; Q = 2,0 m³/s (lokalno)</text>
      <rect id="u09kvs_z2ductgas" x="59" y="110" width="270" height="70" rx="0" fill="#dcebf1" stroke="none" stroke-width="1.2" />
