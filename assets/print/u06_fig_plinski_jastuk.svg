<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="u06fpj_title u06fpj_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:920px;height:auto;">
  <title id="u06fpj_title">Cetvrtcilindricni poklopac u zatvorenom spremniku s plinskim jastukom</title>
  <desc id="u06fpj_desc">Zatvoreni hidropneumatski spremnik s plinskim jastukom p_g=200 kPa i uljem gustoce 860 kg/m^3. Ulje kvasi konveksnu unutarnju stranu cetvrtcilindricnog poklopca R=0,50 m i b=1,20 m; lokalne normale od ulja prema poklopcu imaju komponentu prema dolje. Sile su F_H=121,3 kN prema van i F_V=122,0 kN prema dolje, a rezultanta F=172,0 kN djeluje 45,2 stupnja ispod horizontale.</desc>

  <defs>
    <linearGradient id="u06fpj_ulje" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#c8a000" />
    </linearGradient>
    <linearGradient id="u06fpj_plin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3f0" />
      <stop offset="100%" stop-color="#f7d6cb" />
    </linearGradient>
    <linearGradient id="u06fpj_iVol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff4c8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#e6c270" stop-opacity="0.85" />
    </linearGradient>
    <pattern id="u06fpj_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.1" />
    </pattern>
    <marker id="u06fpj_aR" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#c0392b" />
    </marker>
    <marker id="u06fpj_aG" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1e8449" />
    </marker>
    <marker id="u06fpj_aP" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#8e44ad" />
    </marker>
    <marker id="u06fpj_aB" markerWidth="6" markerHeight="4" refX="5.5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#1565c0" />
    </marker>
    <marker id="u06fpj_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u06fpj_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
  </defs>

  <rect width="1000" height="560" fill="#ffffff" />
  <line x1="610" y1="36" x2="610" y2="524" stroke="#dce7f0" stroke-width="1.2" stroke-dasharray="4,5" />

  <rect x="104" y="68" width="332" height="16" fill="url(#u06fpj_hatch)" stroke="#3a4a56" stroke-width="1.4" />
  <rect x="104" y="436" width="186" height="16" fill="url(#u06fpj_hatch)" stroke="#3a4a56" stroke-width="1.4" />
  <rect x="104" y="84" width="16" height="352" fill="url(#u06fpj_hatch)" stroke="#3a4a56" stroke-width="1.4" />
  <rect x="420" y="84" width="16" height="148" fill="url(#u06fpj_hatch)" stroke="#3a4a56" stroke-width="1.4" />

  <path d="M120,232 L420,232 A130,130 0 0,0 290,362 L290,436 L120,436 Z" fill="url(#u06fpj_ulje)" />

  <rect x="120" y="84" width="300" height="148" fill="url(#u06fpj_plin)" />

  <line x1="120" y1="232" x2="420" y2="232" stroke="#1565c0" stroke-width="2.4" />

  <path d="M420,232 A130,130 0 0,0 290,362" fill="none" stroke="#3a4a56" stroke-width="3.6" />

  <circle cx="420" cy="232" r="3.4" fill="#1a2530" />
  <circle cx="290" cy="362" r="3.4" fill="#1a2530" />
  <circle cx="367" cy="238" r="2" fill="#8a5a18" />
  <line x1="367" y1="238" x2="392" y2="298" stroke="#8a5a18" stroke-width="0.7" />
  <line x1="160" y1="180" x2="160" y2="226" stroke="#1565c0" stroke-width="1.8" marker-end="url(#u06fpj_aB)" />
  <line x1="220" y1="180" x2="220" y2="226" stroke="#1565c0" stroke-width="1.8" marker-end="url(#u06fpj_aB)" />
  <line x1="280" y1="180" x2="280" y2="226" stroke="#1565c0" stroke-width="1.8" marker-end="url(#u06fpj_aB)" />
  <line x1="340" y1="180" x2="340" y2="226" stroke="#1565c0" stroke-width="1.8" marker-end="url(#u06fpj_aB)" />
  <line x1="395" y1="180" x2="395" y2="226" stroke="#1565c0" stroke-width="1.8" marker-end="url(#u06fpj_aB)" />
  <line x1="180" y1="338" x2="285" y2="338" stroke="#c0392b" stroke-width="3" marker-end="url(#u06fpj_aR)" />
  <line x1="334" y1="195" x2="334" y2="262" stroke="#1e8449" stroke-width="3" marker-end="url(#u06fpj_aG)" />
  <line x1="328" y1="270" x2="418" y2="360" stroke="#8e44ad" stroke-width="2.8" marker-end="url(#u06fpj_aP)" />
  <line x1="470" y1="478" x2="425" y2="435" stroke="#5a6a78" stroke-width="0.8" stroke-dasharray="3,3" />

  <line x1="100" y1="232" x2="120" y2="232" stroke="#1565c0" stroke-width="0.9" stroke-dasharray="3,3" />

  <rect x="40" y="510" width="11" height="11" fill="#c0392b" rx="2" />
  <rect x="92" y="510" width="11" height="11" fill="#1e8449" rx="2" />
  <rect x="144" y="510" width="11" height="11" fill="#8e44ad" rx="2" />
  <rect x="252" y="510" width="11" height="11" fill="#1565c0" rx="2" />
  <rect x="630" y="48" width="346" height="402" rx="10" fill="#f4f9fd" stroke="#1565c0" stroke-width="1.4" />
  <rect x="630" y="48" width="346" height="32" rx="10" fill="#1565c0" />
  <rect x="630" y="72" width="346" height="8" fill="#1565c0" />
  <line x1="650" y1="156" x2="956" y2="156" stroke="#c8d6e4" stroke-width="1" />

  <line x1="650" y1="246" x2="956" y2="246" stroke="#c8d6e4" stroke-width="1" />

  <line x1="650" y1="336" x2="956" y2="336" stroke="#c8d6e4" stroke-width="1" />

  <rect x="630" y="466" width="346" height="46" rx="8" fill="#e8f5e9" stroke="#1e8449" stroke-width="1.4" />
  <path d="M420,232 L290,232 L290,362 A130,130 0 0,1 420,232 Z" fill="none" stroke="#b7600c" stroke-width="1.1" stroke-dasharray="6,4" />

  <line x1="290" y1="362" x2="290" y2="408" stroke="#b7600c" stroke-width="0.7" />
  <line x1="420" y1="362" x2="420" y2="408" stroke="#b7600c" stroke-width="0.7" />
  <line x1="290" y1="412" x2="290" y2="398" stroke="#b7600c" stroke-width="1.2" />
  <line x1="420" y1="412" x2="420" y2="398" stroke="#b7600c" stroke-width="1.2" />
  <line x1="293" y1="405" x2="417" y2="405" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u06fpj_dimL)" marker-end="url(#u06fpj_dim)" />
  <line x1="436" y1="232" x2="492" y2="232" stroke="#b7600c" stroke-width="0.7" stroke-dasharray="3,3" />
  <line x1="436" y1="297" x2="492" y2="297" stroke="#b7600c" stroke-width="0.7" stroke-dasharray="3,3" />
  <line x1="488" y1="232" x2="488" y2="297" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u06fpj_dimL)" marker-end="url(#u06fpj_dim)" />
  <rect x="320" y="510" width="11" height="11" fill="#b7600c" rx="2" />
  <text x="40" y="48" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Zatvoreni spremnik (presjek)</text>
  <text x="40" y="64" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78">Plinski jastuk iznad ulja djeluje Pascalovim prijenosom na cijelu plohu</text>

  <text x="426" y="226" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1a2530">A</text>
  <text x="266" y="358" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1a2530">B</text>

  <text x="180" y="120" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" font-weight="700" fill="#7a4a30">plinski jastuk</text>
  <text x="180" y="138" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530"><tspan font-style="italic">p</tspan><tspan baseline-shift="sub" font-size="0.7em">g</tspan> = 200 kPa (manometarski)</text>

  <text x="142" y="280" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" font-weight="700" fill="#7a5a18">ulje</text>
  <text x="142" y="298" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a2530">ρ = 860 kg/m³</text>

  <text x="398" y="304" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#8a5a18"><tspan font-weight="700">V*</tspan> = πR²b/4</text>
  <text x="398" y="317" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#8a5a18">imag. volumen ulja</text>

  <text x="180" y="162" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#1565c0">p<tspan baseline-shift="sub" font-size="0.7em">g</tspan> uniformno na slobodnu površinu</text>

  <text x="232" y="330" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="#c0392b"><tspan font-weight="700">F</tspan><tspan baseline-shift="sub" font-size="0.7em">H</tspan> = 121,3 kN</text>

  <text x="378" y="216" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-style="italic" text-anchor="middle" fill="#1e8449"><tspan font-weight="700">F</tspan><tspan baseline-shift="sub" font-size="0.7em">V</tspan> = 122,0 kN</text>

  <text x="448" y="372" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#8e44ad"><tspan font-weight="700">F</tspan> = 172,0 kN</text>
  <text x="448" y="388" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#8e44ad">α ≈ 45,2° ispod horizontale</text>

  <text x="470" y="488" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" text-anchor="middle" fill="#5a6a78">(vanjska strana poklopca: <tspan font-style="italic">p</tspan><tspan baseline-shift="sub" font-size="0.7em">atm</tspan>)</text>
  <text x="40" y="228" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1565c0">slob. površina</text>
  <text x="56" y="519" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#3a4a56">F<tspan baseline-shift="sub" font-size="0.7em">H</tspan></text>
  <text x="108" y="519" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#3a4a56">F<tspan baseline-shift="sub" font-size="0.7em">V</tspan></text>
  <text x="160" y="519" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#3a4a56">F (rezultanta)</text>
  <text x="268" y="519" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#3a4a56">tlak p<tspan baseline-shift="sub" font-size="0.7em">g</tspan></text>
  <text x="336" y="519" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#3a4a56">kote i V*</text>

  <text x="803" y="70" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Rastav sila: ulje + plinski jastuk</text>

  <text x="803" y="100" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Projekcije plohe (vert. i hor.)</text>
  <text x="803" y="122" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1a2530">A<tspan baseline-shift="sub" font-size="0.7em">proj</tspan> = R · b = 0,50 · 1,20</text>
  <text x="803" y="142" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">= 0,60 m²</text>
  <text x="803" y="174" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Horizontalna komponenta</text>
  <text x="803" y="194" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">H,o</tspan> = ρg(R/2)A<tspan baseline-shift="sub" font-size="0.7em">proj</tspan> ≈ <tspan font-weight="700">1,27 kN</tspan></text>
  <text x="803" y="212" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">H,g</tspan> = p<tspan baseline-shift="sub" font-size="0.7em">g</tspan>A<tspan baseline-shift="sub" font-size="0.7em">proj</tspan> = <tspan font-weight="700">120 kN</tspan></text>
  <text x="803" y="234" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#c0392b"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">H</tspan> ≈ 121,3 kN</text>
  <text x="803" y="264" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Vertikalna komponenta</text>
  <text x="803" y="284" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">V,o</tspan> = ρg · (πR²/4)b ≈ <tspan font-weight="700">1,99 kN</tspan></text>
  <text x="803" y="302" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">V,g</tspan> = p<tspan baseline-shift="sub" font-size="0.7em">g</tspan>A<tspan baseline-shift="sub" font-size="0.7em">proj</tspan> = <tspan font-weight="700">120 kN</tspan></text>
  <text x="803" y="324" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1e8449"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">V</tspan> ≈ 122,0 kN</text>
  <text x="803" y="354" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Rezultanta i smjer</text>
  <text x="803" y="376" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">F</tspan> = √(<tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">H</tspan>² + <tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">V</tspan>²)</text>
  <text x="803" y="396" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#8e44ad"><tspan font-style="italic">F</tspan> ≈ 172,0 kN   α ≈ 45,2° dolje</text>

  <text x="803" y="426" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">Plin dodaje isti iznos (120 kN) na obje</text>
  <text x="803" y="440" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">komponente → rezultanta teži 45°</text>

  <text x="803" y="482" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#5a6a78">REZULTATI ‒ usporedba s otvorenim spremnikom</text>
  <text x="710" y="503" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#8e44ad"><tspan font-style="italic">F</tspan> ≈ 172,0 kN</text>
  <text x="896" y="503" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b"><tspan font-style="italic">F</tspan>/<tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">open</tspan> ≈ 73</text>

  <text x="803" y="532" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" text-anchor="middle" fill="#5a6a78">Otvoreni spremnik: F<tspan baseline-shift="sub" font-size="0.7em">open</tspan> ≈ 2,36 kN, α<tspan baseline-shift="sub" font-size="0.7em">open</tspan> ≈ 57,5°</text>

<text x="356" y="427" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">R</tspan> = 0,50 m</text>

  <text x="356" y="448" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#b7600c"><tspan font-weight="700">b</tspan> = 1,20 m (dužina osi cilindra)</text>

  <text x="500" y="270" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b7600c"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">C</tspan> = R/2</text>
  <text x="500" y="284" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#b7600c">= 0,25 m</text>

  </svg>
