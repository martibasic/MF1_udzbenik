<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400">
<defs>
  <marker id="u12hj-ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0f766e"/></marker>
  <marker id="u12hj-ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#b42318"/></marker>
  <marker id="u12hj-agr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#546e7a"/></marker>
  <linearGradient id="u12hj-water" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7ec8e8"/><stop offset="100%" stop-color="#4aa8d0"/></linearGradient>
  <linearGradient id="u12hj-jet" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#d4eef8"/><stop offset="100%" stop-color="#7ec8e8" stop-opacity="0.3"/></linearGradient>
  <pattern id="u12hj-hatch" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#8090a0"/>
    <line x1="0" y1="8" x2="8" y2="0" stroke="#546e7a" stroke-width="1.8"/>
  </pattern>
</defs>
<rect width="940" height="400" fill="#ffffff"/>
<rect x="24" y="24" width="892" height="352" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>
<text x="54" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#173043">Hidromlazni pogon plovnog bagera</text>
<text x="54" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#516677">d = 120 mm · v_mlaz = 8,5 m/s · V_plovilo = 1,2 m/s · ρ = 1005 kg/m³ → Fp = 820 N</text>

<!-- Water surface (fills bottom portion) -->
<rect x="36" y="258" width="870" height="112" rx="0" fill="url(#u12hj-water)" opacity="0.35"/>
<line x1="36" y1="258" x2="906" y2="258" stroke="#1565c0" stroke-width="2"/>
<!-- Water surface label -->
<text x="840" y="276" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1565c0" font-style="italic">razina vode</text>

<!-- Barge hull (ship shape) -->
<!-- Hull outline: polygon shape, front tapered left, flat bottom, stern at right -->
<polygon points="90,180 720,180 750,210 740,255 80,255 70,210" fill="#95a5a6" stroke="#2d3a40" stroke-width="2"/>
<!-- Cabin/superstructure -->
<rect x="150" y="140" width="200" height="40" rx="4" fill="#8090a0" stroke="#2d3a40" stroke-width="1.5"/>
<!-- Windows -->
<rect x="165" y="148" width="25" height="20" rx="2" fill="#c5e8f8"/>
<rect x="205" y="148" width="25" height="20" rx="2" fill="#c5e8f8"/>
<rect x="245" y="148" width="25" height="20" rx="2" fill="#c5e8f8"/>
<rect x="285" y="148" width="25" height="20" rx="2" fill="#c5e8f8"/>
<!-- Hull fill (slightly lighter inside) -->
<polygon points="91,182 719,182 748,210 738,252 82,252 72,210" fill="#adb5bd"/>

<!-- Intake pipe at bottom center of hull (vertical suction from below) -->
<rect x="365" y="232" width="28" height="60" rx="3" fill="#8090a0" stroke="#2d3a40" stroke-width="1.5"/>
<!-- Suction arrow (water entering upward) -->
<line x1="379" y1="298" x2="379" y2="240" stroke="#0f766e" stroke-width="2.5" marker-end="url(#u12hj-ag)"/>
<text x="392" y="290" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#0f766e">usisava</text>
<text x="392" y="304" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#0f766e">vodu</text>

<!-- Stern nozzle (rear of barge, right side) -->
<rect x="720" y="212" width="35" height="30" rx="2" fill="url(#u12hj-hatch)"/>
<!-- Nozzle label: d=120mm -->
<text x="724" y="210" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#546e7a">d=120mm</text>

<!-- Exit jet (going right = backward direction = +x in SVG, but propels ship to left) -->
<path d="M 755,222 L 890,218 L 890,234 L 755,238 Z" fill="url(#u12hj-jet)"/>
<!-- v_mlaz arrow (green, rightward = jet direction) -->
<line x1="762" y1="230" x2="875" y2="230" stroke="#0f766e" stroke-width="3" marker-end="url(#u12hj-ag)"/>
<text x="790" y="222" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#0f766e">v_mlaz = 8,5 m/s</text>

<!-- Fp thrust arrow (leftward = forward direction of barge, reaction force) -->
<line x1="700" y1="200" x2="580" y2="200" stroke="#b42318" stroke-width="3.5" marker-end="url(#u12hj-ar)"/>
<text x="600" y="190" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#b42318">Fp = 820 N</text>

<!-- V_plovilo arrow (ship velocity, leftward, gray dashed) -->
<line x1="200" y1="130" x2="120" y2="130" stroke="#546e7a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#u12hj-agr)"/>
<text x="125" y="122" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#546e7a">V_plovilo = 1,2 m/s</text>

<!-- ===== INFO PANEL (bottom-right) ===== -->
<rect x="44" y="310" width="540" height="60" rx="8" fill="#fffef6" stroke="#c49a0a" stroke-width="1.5"/>
<text x="58" y="330" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#173043">A = π·(0,120)²/4 = 1,131·10⁻² m²   ·   ṁ = ρ·A·v = 1005·1,131·10⁻²·8,5 = <tspan font-weight="700" fill="#0f766e">96,6 kg/s</tspan></text>
<text x="58" y="355" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#173043">Fp = ρ·A·v_mlaz² = 1005·1,131·10⁻²·72,25 = <tspan font-weight="700" fill="#b42318">820 N</tspan>   ·   P = Fp·V_plovilo = 820·1,2 = <tspan font-weight="700" fill="#6d2694">984 W ≈ 1,0 kW</tspan></text>

<!-- Note: suction is vertical so no horizontal momentum from inlet -->
<text x="602" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#516677" font-style="italic">Ulaz je vertikalan →</text>
<text x="602" y="350" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#516677" font-style="italic">horizontalni impuls = 0.</text>
<text x="602" y="365" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#516677" font-style="italic">Potisak = ṁ · v_mlaz.</text>
</svg>
