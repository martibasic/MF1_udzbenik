<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" role="img" aria-labelledby="u02flt_title u02flt_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:880px;height:auto;">
  <title id="u02flt_title">Klizni lezaj pri hladnom startu i radnoj temperaturi</title>
  <desc id="u02flt_desc">Lijevo: dva paralelna prikaza Couetteova profila brzine u uljnom procjepu kliznog lezaja - hladni start (mu_1 = 0,40 Pa s, visoko smicno naprezanje) i radna temperatura (mu_2 = 0,040 Pa s, deset puta manje naprezanje), uz istu obodnu brzinu vratila v = 6,28 m/s i procjep delta = 0,30 mm. Desno: usporedba zakretnog momenta i snage trenja - faktor 10 razlike u viskoznosti daje faktor 10 razlike u snazi.</desc>

  <defs>
    <linearGradient id="u02flt_ulje" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a" />
      <stop offset="1" stop-color="#c8a000" />
    </linearGradient>
    <linearGradient id="u02flt_vratilo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa8b8" />
      <stop offset="1" stop-color="#3a5060" />
    </linearGradient>
    <pattern id="u02flt_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.1" />
    </pattern>
    <marker id="u02flt_v" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1e8449" />
    </marker>
    <marker id="u02flt_t1" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#c0392b" />
    </marker>
    <marker id="u02flt_t2" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1e8449" />
    </marker>
    <marker id="u02flt_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u02flt_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u02flt_om" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1e8449" />
    </marker>
  </defs>

  <!-- pozadina + okviri panela -->
  <rect x="16" y="16" width="888" height="508" rx="14" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.4" />

  <!-- ===================== LIJEVO: usporedba dva profila ===================== -->
  <!-- ============ LIJEVI PROFIL: HLADNI START (mu_1) ============ -->
  <!-- Layout: lezaj na vrhu, procjep, vratilo na dnu. Procjep prikazan uvelican (razmazan). -->
  <!-- Lezaj (kucišta) hatched -->
  <rect x="60" y="100" width="240" height="38" fill="url(#u02flt_hatch)" stroke="#3a4a56" stroke-width="1.4" />
  <!-- Uljni procjep (zuti) - veliko uvecan, visina 60 px -->
  <rect x="60" y="138" width="240" height="60" fill="url(#u02flt_ulje)" stroke="#a07a00" stroke-width="1.2" />

  <!-- Linearni profil brzine: trokut od 0 (gore) do v_max (dolje) -->
  <!-- Postavi vrh trokuta na (60, 138), baza na (60..210, 198) - max strelica = 150 px -->
  <polygon points="60,138 60,198 210,198" fill="#1e8449" fill-opacity="0.10" stroke="none" />
  <line x1="60" y1="138" x2="60" y2="198" stroke="#1e8449" stroke-width="1.2" stroke-dasharray="3,3" />
  <line x1="60" y1="138" x2="210" y2="198" stroke="#1e8449" stroke-width="2" />

  <!-- Strelice brzine na vise visina (linearno raste prema dnu) -->
  <line x1="60" y1="158" x2="110" y2="158" stroke="#1e8449" stroke-width="1.6" marker-end="url(#u02flt_v)" />
  <line x1="60" y1="178" x2="160" y2="178" stroke="#1e8449" stroke-width="1.6" marker-end="url(#u02flt_v)" />
  <line x1="60" y1="194" x2="206" y2="194" stroke="#1e8449" stroke-width="2.2" marker-end="url(#u02flt_v)" />

  <!-- Oznaka v na vrhu strelice na dnu -->
  <!-- Vratilo (vrti se) -->
  <rect x="60" y="198" width="240" height="38" fill="url(#u02flt_vratilo)" stroke="#1a2a36" stroke-width="1.6" />
  <!-- omega arc + label (ispod vratila, mali luk indicira rotaciju) -->
  <path d="M 80,250 A 22,22 0 0,1 130,250" fill="none" stroke="#1e8449" stroke-width="2" marker-end="url(#u02flt_om)" />
  <!-- Smicno naprezanje tau_1: horizontalna strelica unutar ulja (hladni start - velika) -->
  <line x1="226" y1="170" x2="290" y2="170" stroke="#c0392b" stroke-width="2.6" marker-end="url(#u02flt_t1)" />
  <!-- Kota delta (smedja, desno od procjepa) -->
  <!-- Hladni start labela -->
  <rect x="60" y="74" width="276" height="20" rx="5" fill="#fde8e8" stroke="#c0392b" stroke-width="1.2" />
  <!-- Rezultat tau_1 ispod prvog profila -->
  <!-- ============ DESNI PROFIL: RADNA TEMPERATURA (mu_2) ============ -->
  <!-- Pomaknuto desno od prvog: pocinje x=380 -->
  <rect x="380" y="100" width="240" height="38" fill="url(#u02flt_hatch)" stroke="#3a4a56" stroke-width="1.4" />
  <rect x="380" y="138" width="240" height="60" fill="url(#u02flt_ulje)" stroke="#a07a00" stroke-width="1.2" />

  <!-- Isti linearni profil - geometrija je ista, brzina je ista -->
  <polygon points="380,138 380,198 530,198" fill="#1e8449" fill-opacity="0.10" stroke="none" />
  <line x1="380" y1="138" x2="380" y2="198" stroke="#1e8449" stroke-width="1.2" stroke-dasharray="3,3" />
  <line x1="380" y1="138" x2="530" y2="198" stroke="#1e8449" stroke-width="2" />

  <line x1="380" y1="158" x2="430" y2="158" stroke="#1e8449" stroke-width="1.6" marker-end="url(#u02flt_v)" />
  <line x1="380" y1="178" x2="480" y2="178" stroke="#1e8449" stroke-width="1.6" marker-end="url(#u02flt_v)" />
  <line x1="380" y1="194" x2="526" y2="194" stroke="#1e8449" stroke-width="2.2" marker-end="url(#u02flt_v)" />

  <rect x="380" y="198" width="240" height="38" fill="url(#u02flt_vratilo)" stroke="#1a2a36" stroke-width="1.6" />
  <path d="M 400,250 A 22,22 0 0,1 450,250" fill="none" stroke="#1e8449" stroke-width="2" marker-end="url(#u02flt_om)" />
  <!-- Smicno naprezanje tau_2: horizontalna strelica unutar ulja (radna temp - mala, simbolicki ~5x kraca od tau_1) -->
  <line x1="546" y1="170" x2="558" y2="170" stroke="#1e8449" stroke-width="2.6" marker-end="url(#u02flt_t2)" />
  <!-- Radna temperatura labela -->
  <rect x="380" y="74" width="276" height="20" rx="5" fill="#eaf6ee" stroke="#1e8449" stroke-width="1.2" />
  <!-- Rezultat tau_2 -->
  <!-- ===================== ORIJENTACIJSKI MINI-PRESJEK (dolje lijevo) ===================== -->
  <!-- mala kruzna shema - prikazuje gdje se zumira -->
  <circle cx="100" cy="400" r="48" fill="#909fa8" stroke="#3a4a56" stroke-width="1.4" />
  <circle cx="100" cy="400" r="40" fill="url(#u02flt_ulje)" stroke="#a07a00" stroke-width="0.9" />
  <circle cx="100" cy="400" r="36" fill="url(#u02flt_vratilo)" stroke="#1a2a36" stroke-width="1.4" />

  <!-- rotacijska strelica -->
  <path d="M 70,400 A 30,30 0 0,1 130,400" fill="none" stroke="#1e8449" stroke-width="1.6" marker-end="url(#u02flt_om)" />

  <!-- kota D na crtezu (vodoravna ispod kruga) -->
  <!-- Lupica/indikator zooma -->
  <line x1="146" y1="380" x2="190" y2="340" stroke="#5a6a78" stroke-width="0.9" stroke-dasharray="3,3" />
  <line x1="138" y1="416" x2="190" y2="400" stroke="#5a6a78" stroke-width="0.9" stroke-dasharray="3,3" />
  <!-- Zajednicki ulazni podaci (dolje lijevo blok) -->
  <rect x="288" y="330" width="368" height="156" rx="9" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="288" y="330" width="368" height="22" rx="9" fill="#1565c0" />
  <rect x="288" y="345" width="368" height="7" fill="#1565c0" />
  <line x1="304" y1="446" x2="640" y2="446" stroke="#c8d6e4" stroke-width="1" />
  <!-- ===================== DESNO: USPOREDBA REZULTATA ===================== -->
  <!-- Glavni panel s naslovom i 3 reda usporedbe -->
  <rect x="676" y="40" width="228" height="380" rx="10" fill="#f4f9fd" stroke="#1565c0" stroke-width="1.4" />
  <rect x="676" y="40" width="228" height="30" rx="10" fill="#1565c0" />
  <rect x="676" y="56" width="228" height="14" fill="#1565c0" />
  <!-- Mali zaglavlja stupaca: hladno | toplo -->
  <line x1="694" y1="118" x2="886" y2="118" stroke="#c8d6e4" stroke-width="1" />

  <!-- Red 1: tau -->
  <line x1="694" y1="172" x2="886" y2="172" stroke="#c8d6e4" stroke-width="1" />

  <!-- Red 2: F -->
  <line x1="694" y1="226" x2="886" y2="226" stroke="#c8d6e4" stroke-width="1" />

  <!-- Red 3: M -->
  <line x1="694" y1="280" x2="886" y2="280" stroke="#c8d6e4" stroke-width="1" />

  <!-- Red 4: P -->
  <line x1="694" y1="340" x2="886" y2="340" stroke="#c8d6e4" stroke-width="1" />
  <!-- ===================== KLJUCNI REZULTAT: P1/P2 = 10 ===================== -->
  <rect x="676" y="432" width="228" height="74" rx="9" fill="#eaf6ee" stroke="#1e8449" stroke-width="1.6" />
  <line x1="306" y1="138" x2="332" y2="138" stroke="#b7600c" stroke-width="0.7" />
  <line x1="306" y1="198" x2="332" y2="198" stroke="#b7600c" stroke-width="0.7" />
  <line x1="326" y1="138" x2="326" y2="198" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u02flt_dimL)" marker-end="url(#u02flt_dim)" />
  <line x1="64" y1="400" x2="64" y2="456" stroke="#b7600c" stroke-width="0.7" />
  <line x1="136" y1="400" x2="136" y2="456" stroke="#b7600c" stroke-width="0.7" />
  <line x1="64" y1="458" x2="64" y2="446" stroke="#b7600c" stroke-width="1.2" />
  <line x1="136" y1="458" x2="136" y2="446" stroke="#b7600c" stroke-width="1.2" />
  <line x1="66" y1="452" x2="134" y2="452" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u02flt_dimL)" marker-end="url(#u02flt_dim)" />
  <text x="40" y="44" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Couetteov profil u uljnom procjepu (δ = 0,30 mm)</text>
  <text x="40" y="60" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78">ista geometrija i obodna brzina → τ i snaga skaliraju linearno s μ</text>

  <text x="180" y="124" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#3a4a56">ležaj (miruje)</text>

  <text x="216" y="198" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#1e8449"><tspan font-weight="700">v</tspan> = 6,28 m/s</text>

  <text x="180" y="222" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#ffffff">vratilo (rotira)</text>

  <text x="138" y="254" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#1e8449">ω = 251,3 rad/s</text>

  <text x="226" y="162" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#c0392b"><tspan font-weight="700">τ₁</tspan> ≈ 8,38 kPa</text>

  <text x="198" y="89" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#c0392b">Hladni start: T₁ = 0°C, μ₁ = 0,40 Pa·s</text>

  <text x="60" y="278" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530"><tspan font-style="italic">dv/dy</tspan> = <tspan font-style="italic">v</tspan>/<tspan font-style="italic">δ</tspan> ≈ 2,09·10⁴ s⁻¹</text>
  <text x="60" y="294" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#c0392b"><tspan font-style="italic">τ₁</tspan> = <tspan font-style="italic">μ₁</tspan>·<tspan font-style="italic">v</tspan>/<tspan font-style="italic">δ</tspan> ≈ <tspan font-weight="700">8,38·10³ Pa</tspan></text>

  <text x="500" y="124" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#3a4a56">ležaj (miruje)</text>

  <text x="536" y="198" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#1e8449"><tspan font-weight="700">v</tspan> = 6,28 m/s</text>

  <text x="500" y="222" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#ffffff">vratilo (rotira)</text>

  <text x="458" y="254" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#1e8449">ω = 251,3 rad/s</text>

  <text x="546" y="162" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#1e8449"><tspan font-weight="700">τ₂</tspan> ≈ 838 Pa</text>


  <text x="518" y="89" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1e8449">Radna temperatura: T₂ = 90°C, μ₂ = 0,040 Pa·s</text>

  <text x="380" y="278" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530"><tspan font-style="italic">dv/dy</tspan> = <tspan font-style="italic">v</tspan>/<tspan font-style="italic">δ</tspan> ≈ 2,09·10⁴ s⁻¹</text>
  <text x="380" y="294" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1e8449"><tspan font-style="italic">τ₂</tspan> = <tspan font-style="italic">μ₂</tspan>·<tspan font-style="italic">v</tspan>/<tspan font-style="italic">δ</tspan> ≈ <tspan font-weight="700">838 Pa</tspan></text>

  <text x="40" y="332" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#1a2530">Orijentacija: poprecni presjek lezaja</text>

  <text x="196" y="376" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a6a78">prikaz lijevo:</text>
  <text x="196" y="390" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a6a78">"odmotani" procjep,</text>
  <text x="196" y="404" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a6a78">visina vidno uvecana</text>

  <text x="472" y="346" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">Zadano (zajednicko za oba slucaja)</text>

  <text x="304" y="372" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530"><tspan font-style="italic">D</tspan> = 50 mm  •  <tspan font-style="italic">L</tspan> = 70 mm  •  <tspan font-style="italic">δ</tspan> = 0,30 mm</text>
  <text x="304" y="392" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530"><tspan font-style="italic">n</tspan> = 2400 min⁻¹  →  <tspan font-style="italic">v</tspan> = π<tspan font-style="italic">Dn</tspan>/60 ≈ 6,28 m/s</text>
  <text x="304" y="412" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530"><tspan font-style="italic">ω</tspan> = 2π<tspan font-style="italic">n</tspan>/60 ≈ 251,3 rad/s</text>
  <text x="304" y="432" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530"><tspan font-style="italic">A</tspan> = π<tspan font-style="italic">DL</tspan> ≈ 1,10·10⁻² m²</text>
  <text x="472" y="466" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-style="italic" text-anchor="middle" fill="#5a6a78">Newtonov zakon viskoznosti:  τ = μ · <tspan font-style="italic">dv/dy</tspan></text>
  <text x="472" y="481" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">linearan profil → <tspan font-style="italic">dv/dy</tspan> = <tspan font-style="italic">v</tspan>/<tspan font-style="italic">δ</tspan> = const</text>

  <text x="790" y="60" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">Usporedba rezultata</text>

  <text x="744" y="92" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#c0392b">Hladni start</text>
  <text x="744" y="106" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#c0392b">μ₁ = 0,40 Pa·s</text>
  <text x="844" y="92" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1e8449">Radna temp.</text>
  <text x="844" y="106" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#1e8449">μ₂ = 0,040 Pa·s</text>

  <text x="790" y="138" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#5a6a78">Smicno naprezanje  <tspan font-style="italic">τ</tspan> = <tspan font-style="italic">μv</tspan>/<tspan font-style="italic">δ</tspan></text>
  <text x="744" y="158" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b">8,38·10³ Pa</text>
  <text x="844" y="158" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1e8449">838 Pa</text>
  <text x="790" y="192" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#5a6a78">Sila trenja  <tspan font-style="italic">F</tspan> = <tspan font-style="italic">τA</tspan></text>
  <text x="744" y="212" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b">92,2 N</text>
  <text x="844" y="212" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1e8449">9,22 N</text>
  <text x="790" y="246" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#5a6a78">Moment trenja  <tspan font-style="italic">M</tspan> = <tspan font-style="italic">F</tspan>·<tspan font-style="italic">D</tspan>/2</text>
  <text x="744" y="266" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b">2,30 N·m</text>
  <text x="844" y="266" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1e8449">0,231 N·m</text>
  <text x="790" y="300" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#5a6a78">Snaga trenja  <tspan font-style="italic">P</tspan> = <tspan font-style="italic">Mω</tspan></text>
  <text x="744" y="322" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#c0392b">578 W</text>
  <text x="844" y="322" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1e8449">58,0 W</text>

  <text x="790" y="360" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">Sve velicine linearne u μ</text>
  <text x="790" y="376" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">jer ulazi samo kroz τ = μ<tspan font-style="italic">v</tspan>/δ</text>
  <text x="790" y="400" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#1a2530">Geometrija (<tspan font-style="italic">D, L, δ, n</tspan>) ne pomaze:</text>
  <text x="790" y="414" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">jedina mjera je svojstvo ulja</text>

  <text x="790" y="452" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#5a6a78">KLJUCNI REZULTAT</text>
  <text x="790" y="478" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">P₁</tspan>/<tspan font-style="italic">P₂</tspan> = <tspan font-style="italic">μ₁</tspan>/<tspan font-style="italic">μ₂</tspan> = <tspan fill="#c0392b">10</tspan></text>
  <text x="790" y="498" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" text-anchor="middle" fill="#5a6a78">faktor 10 u μ → faktor 10 u snazi</text>
