<text x="285" y="374" font-size="12" fill="#1a2530" text-anchor="start">D = 50 mm; L = 70 mm; δ = 0,30 mm</text>
<text x="285" y="393" font-size="12" fill="#1a2530" text-anchor="start">n = 2400 min⁻¹; ω ≈ 251,3 rad/s</text>
<text x="285" y="412" font-size="12" fill="#1a2530" text-anchor="start">A = πDL; M = (τA)D/2; P = Mω</text>
<text x="285" y="431" font-size="12" fill="#1a2530" text-anchor="start">Procjep je na skici uvećan.</text>
<text x="285" y="450" font-size="12" fill="#1a2530" text-anchor="start">Vektori sila nisu u zajedničkom mjerilu.</text>
