<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" role="img" aria-labelledby="u02flt_title u02flt_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:920px;height:auto;">
<title id="u02flt_title">Temperatura i viskozni otpor koncentričnog ležaja</title><desc id="u02flt_desc">Dva jednaka razmotana uljna procjepa s mirnom čahurom i brzinom vratila udesno. Profili brzine su isti, sile ulja na vratilo suprotne su gibanju. Poprečni presjek označuje promjer vratila, smjer vrtnje i suprotan moment otpora. Snage iz punog računa su 579 i 57,9 W.</desc>
