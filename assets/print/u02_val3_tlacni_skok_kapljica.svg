<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="u02v3tsk_u02v3tk_title u02v3tsk_u02v3tk_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:900px;height:auto;">
  <title id="u02v3tsk_u02v3tk_title">Tlacni skok u kapljici vode prema Young-Laplaceovu zakonu</title>
  <desc id="u02v3tsk_u02v3tk_desc">Lijevo: kapljica vode promjera 1,2 mm s vanjskim tlakom p-nula, unutarnjim tlakom p-in i povrsinskom napetoscu sigma. Desno: usporedba s manjom kapljicom 0,6 mm i Young-Laplaceova formula.</desc>

  <defs>
    <radialGradient id="u02v3tsk_u02v3tk_kap" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#d6ebf8" />
      <stop offset="1" stop-color="#5b9ec9" />
    </radialGradient>
    <marker id="u02v3tsk_u02v3tk_pr" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#1565c0" />
    </marker>
    <marker id="u02v3tsk_u02v3tk_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u02v3tsk_u02v3tk_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
  </defs>

  <!-- okvirni paneli -->
  <rect x="20" y="34" width="448" height="404" rx="14" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.4" />
  <rect x="492" y="34" width="448" height="404" rx="14" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.4" />

  <!-- ===================== LIJEVI PANEL ===================== -->
  <!-- vodena sfera -->
  <circle cx="250" cy="238" r="82" fill="url(#u02v3tsk_u02v3tk_kap)" stroke="#1565c0" stroke-width="2.6" />

  <!-- vanjski tlak p0 - 6 strelica prema unutra -->
  <line x1="368" y1="238" x2="348" y2="238" stroke="#1565c0" stroke-width="2.2" marker-end="url(#u02v3tsk_u02v3tk_pr)" />
  <line x1="132" y1="238" x2="152" y2="238" stroke="#1565c0" stroke-width="2.2" marker-end="url(#u02v3tsk_u02v3tk_pr)" />
  <line x1="333" y1="155" x2="318" y2="170" stroke="#1565c0" stroke-width="2.2" marker-end="url(#u02v3tsk_u02v3tk_pr)" />
  <line x1="167" y1="155" x2="182" y2="170" stroke="#1565c0" stroke-width="2.2" marker-end="url(#u02v3tsk_u02v3tk_pr)" />
  <line x1="333" y1="321" x2="318" y2="306" stroke="#1565c0" stroke-width="2.2" marker-end="url(#u02v3tsk_u02v3tk_pr)" />
  <line x1="167" y1="321" x2="182" y2="306" stroke="#1565c0" stroke-width="2.2" marker-end="url(#u02v3tsk_u02v3tk_pr)" />
  <!-- unutarnji tlak p_in - 4 kratke strelice prema van -->
  <line x1="265" y1="223" x2="284" y2="204" stroke="#3d8bd4" stroke-width="2" marker-end="url(#u02v3tsk_u02v3tk_pr)" />
  <line x1="235" y1="223" x2="216" y2="204" stroke="#3d8bd4" stroke-width="2" marker-end="url(#u02v3tsk_u02v3tk_pr)" />
  <line x1="265" y1="253" x2="284" y2="272" stroke="#3d8bd4" stroke-width="2" marker-end="url(#u02v3tsk_u02v3tk_pr)" />
  <line x1="235" y1="253" x2="216" y2="272" stroke="#3d8bd4" stroke-width="2" marker-end="url(#u02v3tsk_u02v3tk_pr)" />
  <!-- povrsinska napetost sigma na rubu (tangenta na vrhu) -->
  <line x1="226" y1="150" x2="274" y2="150" stroke="#1565c0" stroke-width="1.8" marker-start="url(#u02v3tsk_u02v3tk_pr)" marker-end="url(#u02v3tsk_u02v3tk_pr)" />
  <!-- Delta p oznaka -->
  <rect x="338" y="262" width="120" height="30" rx="7" fill="#eaf3fb" stroke="#1565c0" stroke-width="1.3" />
  <!-- kota promjera d -->
  <!-- legenda smjera tlaka -->
  <!-- ===================== DESNI PANEL ===================== -->
  <!-- manja kapljica d2 = 0,6 mm -->
  <circle cx="592" cy="158" r="44" fill="url(#u02v3tsk_u02v3tk_kap)" stroke="#1565c0" stroke-width="2.4" />
  <line x1="664" y1="158" x2="646" y2="158" stroke="#1565c0" stroke-width="2" marker-end="url(#u02v3tsk_u02v3tk_pr)" />
  <line x1="520" y1="158" x2="538" y2="158" stroke="#1565c0" stroke-width="2" marker-end="url(#u02v3tsk_u02v3tk_pr)" />
  <line x1="640" y1="110" x2="626" y2="124" stroke="#1565c0" stroke-width="2" marker-end="url(#u02v3tsk_u02v3tk_pr)" />
  <line x1="544" y1="110" x2="558" y2="124" stroke="#1565c0" stroke-width="2" marker-end="url(#u02v3tsk_u02v3tk_pr)" />
  <!-- kota d2 -->
  <!-- Delta p2 callout -->
  <rect x="730" y="120" width="184" height="64" rx="9" fill="#eaf3fb" stroke="#1565c0" stroke-width="1.4" />
  <!-- formula panel -->
  <rect x="514" y="266" width="404" height="158" rx="10" fill="#f4f9fd" stroke="#1565c0" stroke-width="1.4" />
  <rect x="514" y="266" width="404" height="30" rx="10" fill="#1565c0" />
  <rect x="514" y="282" width="404" height="14" fill="#1565c0" />
  <line x1="540" y1="344" x2="892" y2="344" stroke="#c8d6e4" stroke-width="1" />

  <line x1="168" y1="320" x2="168" y2="362" stroke="#b7600c" stroke-width="0.7" />
  <line x1="332" y1="320" x2="332" y2="362" stroke="#b7600c" stroke-width="0.7" />
  <line x1="168" y1="365" x2="168" y2="349" stroke="#b7600c" stroke-width="1.2" />
  <line x1="332" y1="365" x2="332" y2="349" stroke="#b7600c" stroke-width="1.2" />
  <line x1="171" y1="357" x2="329" y2="357" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u02v3tsk_u02v3tk_dimL)" marker-end="url(#u02v3tsk_u02v3tk_dim)" />
  <line x1="548" y1="202" x2="548" y2="226" stroke="#b7600c" stroke-width="0.7" />
  <line x1="636" y1="202" x2="636" y2="226" stroke="#b7600c" stroke-width="0.7" />
  <line x1="548" y1="229" x2="548" y2="215" stroke="#b7600c" stroke-width="1.2" />
  <line x1="636" y1="229" x2="636" y2="215" stroke="#b7600c" stroke-width="1.2" />
  <line x1="551" y1="222" x2="633" y2="222" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u02v3tsk_u02v3tk_dimL)" marker-end="url(#u02v3tsk_u02v3tk_dim)" />
  <text x="44" y="68" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#1a2530">Kapljica vode (d = 1,2 mm)</text>

  <text x="378" y="234" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#1565c0">p₀</text>
  <text x="122" y="234" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" text-anchor="end" fill="#1565c0">p₀</text>
  <text x="392" y="248" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a6a78">(atm.)</text>

  <text x="250" y="242" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" text-anchor="middle" fill="#0d47a1">p<tspan baseline-shift="sub" font-size="0.7em">in</tspan></text>

  <text x="250" y="138" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-style="italic" text-anchor="middle" fill="#1565c0">σ</text>

  <text x="398" y="282" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">Δp = 240 Pa</text>

  <text x="44" y="416" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78">Zakrivljena površina drži p<tspan baseline-shift="sub" font-size="0.7em">in</tspan> &gt; p₀ (membrana ostaje zategnuta).</text>

  <text x="516" y="68" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#1a2530">Učinak promjera kapljice</text>

  <text x="592" y="163" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="#0d47a1">p<tspan baseline-shift="sub" font-size="0.7em">in</tspan></text>

  <text x="822" y="144" font-family="'Segoe UI',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a2530">Δp₂ = 4σ/d₂</text>
  <text x="822" y="168" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#c0392b">= 480 Pa</text>

  <text x="716" y="286" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">Young-Laplaceov zakon (sfera, jedna granica faza)</text>

  <text x="716" y="328" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1a2530">Δp = 4σ / d  →  p<tspan baseline-shift="sub" font-size="0.7em">in</tspan> = p₀ + Δp</text>
  <text x="534" y="366" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530"><tspan font-style="italic">d</tspan> = 1,2 mm:  Δp = 240 Pa,  p<tspan baseline-shift="sub" font-size="0.7em">in</tspan> ≈ 101,57 kPa</text>
  <text x="534" y="388" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530"><tspan font-style="italic">d</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 0,6 mm:  Δp₂ = 480 Pa</text>
  <text x="716" y="412" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-style="italic" text-anchor="middle" fill="#5a6a78">Manja kapljica → veći skok tlaka (Δp ∝ 1/d)</text>
<text x="250" y="384" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">d</tspan> = 1,2 mm</text>

  <text x="592" y="244" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">d</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 0,6 mm</text>

  </svg>