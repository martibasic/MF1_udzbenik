  <text x="490" y="33" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Relativno mirovanje fluida — hidrostatika u efektivnom polju sila</text>
  <text x="184" y="80" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1565c0" text-anchor="middle">Brod u zaokretu</text>
  <text x="184" y="96" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" fill="#3a5a7a" text-anchor="middle">površina se naginje prema vanjskoj strani zavoja</text>
  <text x="266" y="247" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" font-style="italic" fill="#7a8a96">h₀</text>
  <text x="220" y="248" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#8e44ad">α</text>
  <text x="160" y="296" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#8e44ad" text-anchor="end">
    <tspan font-weight="700">g</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">eff</tspan>
  </text>
  <text x="208" y="182" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#c0392b">a = v²/R</text>
  <text x="184" y="456" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" fill="#1e8449" text-anchor="middle">putanja broda u zaokretu</text>
  <text x="184" y="466" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#3a4a56" text-anchor="middle" font-style="italic" transform="translate(0 8)">Slobodna površina ostaje okomita na <tspan font-weight="700">g</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">eff</tspan>.</text>
  <text x="184" y="480" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#3a4a56" text-anchor="middle" font-style="italic" transform="translate(0 16)">L ≪ R zavoja; lokalno stalno ubrzanje.</text>
  <text x="484" y="80" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1565c0" text-anchor="middle">Ključni princip</text>
  <text x="484" y="116" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78" text-anchor="middle">ravnoteža tlaka u efektivnom polju</text>
  <text x="484" y="142" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" font-style="italic" fill="#1a2530" text-anchor="middle">∇p = ρ <tspan fill="#8e44ad">g</tspan>
    <tspan baseline-shift="sub" font-size="0.7em" fill="#8e44ad">eff</tspan>
  </text>
  <text x="484" y="161" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#5a6a78" text-anchor="middle" transform="translate(0 8)">
    <tspan fill="#8e44ad" font-weight="700">g</tspan>
    <tspan baseline-shift="sub" font-size="0.7em" fill="#8e44ad">eff</tspan> = <tspan fill="#1a2530">g</tspan> − <tspan fill="#c0392b">a</tspan>
  </text>
  <text x="484" y="192" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78" text-anchor="middle">translatorno ubrzanje (kolica, brod, vozilo)</text>
  <text x="484" y="217" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" font-style="italic" fill="#1a2530" text-anchor="middle">tan α = a / g</text>
  <text x="484" y="238" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#1565c0" text-anchor="middle">Δh = a L / g</text>
  <text x="484" y="268" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78" text-anchor="middle">rotacija konstantnom ω (centrifuga)</text>
  <text x="484" y="293" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" font-style="italic" fill="#1a2530" text-anchor="middle">z(r) = z<tspan baseline-shift="sub" font-size="0.7em">C</tspan> + ω² r² / (2g)</text>
  <text x="484" y="314" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#1565c0" text-anchor="middle">Δh = ω² R² / (2g)</text>
  <text x="484" y="344" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78" text-anchor="middle">tlak za okomitu dubinu h (a<tspan baseline-shift="sub" font-size="0.7em">z</tspan> = 0)</text>
  <text x="484" y="369" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" font-style="italic" fill="#1a2530" text-anchor="middle">p = p₀ + ρ g h</text>
  <text x="484" y="404" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" fill="#3a4a56" text-anchor="middle">Hidrostatika ostaje – mijenja se samo</text>
  <text x="484" y="418" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" fill="#3a4a56" text-anchor="middle">smjer i iznos efektivnog polja sila.</text>
  <text x="484" y="450" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="#8b5e00" text-anchor="middle">GRANICE MODELA</text>
  <text x="484" y="467" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a4a20" text-anchor="middle">prelijevanje tekućine · ogoljavanje dna</text>
  <text x="790" y="80" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#8e44ad" text-anchor="middle">Centrifugalni separator</text>
  <text x="790" y="96" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" fill="#5a3a78" text-anchor="middle">paraboloidna slobodna površina pri rotaciji</text>
  <text x="794" y="180" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" font-style="italic" fill="#8e44ad">os rotacije</text>
  <text x="912" y="263" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" font-style="italic" fill="#7a8a96">h₀</text>
  <text x="730" y="128" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" font-weight="700" fill="#1e8449" text-anchor="end">ω</text>
  <text x="745" y="324" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#8e44ad">
    <tspan font-weight="700">g</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">eff</tspan>
  </text>
  <text x="820" y="324" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#8e44ad" text-anchor="end">
    <tspan font-weight="700">g</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">eff</tspan>
  </text>
  <text x="795" y="358" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" fill="#3a4a56">
    <tspan font-weight="700">g</tspan>
  </text>
  <text x="918" y="232" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" fill="#0d47a1">h<tspan baseline-shift="sub" font-size="0.7em">R</tspan>
  </text>
  <text x="794" y="380" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" fill="#0d47a1">h<tspan baseline-shift="sub" font-size="0.7em">C</tspan>
  </text>
  <text x="790" y="448" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#3a4a56" text-anchor="middle" font-style="italic">Centrifugalno polje ω²r → paraboloid.</text>
  <text x="790" y="462" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#3a4a56" text-anchor="middle" font-style="italic">Primjene: separatori, centrifuge,</text>
  <text x="790" y="476" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#3a4a56" text-anchor="middle" font-style="italic">procesne kade, lijevanje pod rotacijom.</text>
  <text x="306" y="244" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#b7600c" text-anchor="middle">Δh/2</text>
  <text x="184" y="378" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#b7600c" text-anchor="middle">L</text>
  <text x="845" y="416" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#b7600c" text-anchor="middle">R</text>
  <text x="640" y="264" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#b7600c" text-anchor="middle">Δh</text>
</svg>
