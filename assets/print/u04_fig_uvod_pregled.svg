<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 694 438" role="img" aria-labelledby="u04fup_title u04fup_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:694px;height:auto;">
  <title id="u04fup_title">Pregled poglavlja 4 - Relativno mirovanje fluida</title>
  <desc id="u04fup_desc">Lijevo: poprečni presjek broda u zavoju u lokalnoj aproksimaciji stalnog ubrzanja a prema središtu zavoja; površina je viša na vanjskoj strani. Desno: aksijalni presjek otvorenog spremnika u krutoj vrtnji s paraboloidom; h_0 je mirna razina, a h_C i h_R dubine u osi i uz stijenku, (h_C + h_R)/2 = h_0. Ubrzanja a, g_eff i g crtkane su strelice s punim vrhom; g_eff i g crtani su u istom mjerilu. Kutna brzina omega tanka je strelica s otvorenim vrhom. Efektivna gravitacija okomita je na lokalnu slobodnu površinu. Dubina h mjeri se okomito pri nultom vertikalnom ubrzanju.</desc>
