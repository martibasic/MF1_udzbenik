<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 530" role="img" aria-labelledby="u04fup_title u04fup_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="u04fup_title">Pregled poglavlja 4 - Relativno mirovanje fluida</title>
  <desc id="u04fup_desc">Brod u zaokretu u lokalnoj aproksimaciji stalnog ubrzanja, jednadžbe relativnog mirovanja i aksijalni presjek separatora. Efektivna gravitacija okomita je na lokalnu slobodnu površinu. Dubina h mjeri se okomito pri nultom vertikalnom ubrzanju.</desc>
