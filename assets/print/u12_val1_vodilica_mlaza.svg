  <text x="646" y="208" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#173043">y</text>

  <text x="590" y="160" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#173043">Sto mora biti vidljivo</text>
  <text x="590" y="195" font-family="'Segoe UI',Arial,sans-serif" font-size="17" fill="#587183">- ulazni i izlazni smjer mlaza</text>
  <text x="590" y="220" font-family="'Segoe UI',Arial,sans-serif" font-size="17" fill="#587183">- kut skretanja</text>
  <text x="590" y="245" font-family="'Segoe UI',Arial,sans-serif" font-size="17" fill="#587183">- kontrolni volumen</text>
  <text x="590" y="270" font-family="'Segoe UI',Arial,sans-serif" font-size="17" fill="#587183">- osi i reakcije nosaca</text>

