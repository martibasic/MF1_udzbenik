<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="u12v1vm_title u12v1vm_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:900px;height:auto;">
  <title id="u12v1vm_title">Vodilica mlaza na ispitnom stolu — defleksija 120 stupnjeva u tlocrtu</title>
  <desc id="u12v1vm_desc">Lijevo: tlocrt nepomicne vodilice mlaza. Pravokutni mlaz vode b=36 mm, h=14 mm ulazi brzinom v1=24 m/s, vodilica skrece mlaz za beta=120 stupnjeva u horizontalnoj ravnini, izlazna brzina v2=19 m/s. Oznacene su komponente sile fluida na vodilicu Fx, Fy i rezultantna reakcija nosaca R. Desno: panel s jednadzbama masenog protoka, projekcijama brzine, komponentama sile i iznosom reakcije.</desc>

  <defs>
    <linearGradient id="u12v1vm_voda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aed6f1" />
      <stop offset="1" stop-color="#5b9ec9" />
    </linearGradient>
    <pattern id="u12v1vm_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.1" />
    </pattern>
    <marker id="u12v1vm_v" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1e8449" />
    </marker>
    <marker id="u12v1vm_f" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#c0392b" />
    </marker>
    <marker id="u12v1vm_r" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1e8449" />
    </marker>
    <marker id="u12v1vm_ax" markerWidth="6" markerHeight="4" refX="5.5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#5a6a78" />
    </marker>
    <marker id="u12v1vm_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u12v1vm_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
  </defs>

  <!-- pozadina i okviri -->
  <rect x="14" y="14" width="892" height="472" rx="14" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.4" />
  <line x1="500" y1="34" x2="500" y2="466" stroke="#dce7f0" stroke-width="1.2" stroke-dasharray="4,5" />

  <!-- ===================== LIJEVI PANEL: TLOCRT ===================== -->
  <!-- Koordinatne osi u donjem lijevom kutu (tlocrt) -->
  <line x1="40" y1="450" x2="92" y2="450" stroke="#5a6a78" stroke-width="1.6" marker-end="url(#u12v1vm_ax)" />
  <line x1="40" y1="450" x2="40" y2="398" stroke="#5a6a78" stroke-width="1.6" marker-end="url(#u12v1vm_ax)" />
  <!-- Kontrolni volumen (isprekidana granica) -->
  <rect x="60" y="78" width="412" height="328" rx="6" fill="none" stroke="#9aabb5" stroke-width="1.2" stroke-dasharray="6,4" />
  <!-- ============ ULAZNI MLAZ (vodoravno, +x) ============ -->
  <!-- Sapnica (zidovi pravokutne sapnice u tlocrtu): hatched gornja i donja stjenka -->
  <rect x="78" y="248" width="112" height="14" fill="url(#u12v1vm_hatch)" stroke="#3a4a56" stroke-width="1" />
  <rect x="78" y="306" width="112" height="14" fill="url(#u12v1vm_hatch)" stroke="#3a4a56" stroke-width="1" />
  <!-- Mlaz u sapnici -->
  <rect x="78" y="262" width="112" height="44" fill="url(#u12v1vm_voda)" />
  <!-- Slobodni mlaz izmedu sapnice i vodilice -->
  <rect x="190" y="262" width="76" height="44" fill="url(#u12v1vm_voda)" />
  <line x1="190" y1="262" x2="266" y2="262" stroke="#1565c0" stroke-width="1.6" />
  <line x1="190" y1="306" x2="266" y2="306" stroke="#1565c0" stroke-width="1.6" />

  <!-- ============ VODILICA (zakrivljena lopatica tlocrt) ============ -->
  <!-- Os mlaza ulaza je y=284. Os mlaza izlaza pod kutom 120 stupnjeva iznad +x = smjer (-0.5, -0.866) u standardnim koordinatama, ali SVG y raste prema dolje, pa smjer izlaza u SVG koord = (-0.5, +0.866 obrnuto) = (-0.5, -0.866). Dakle gore-lijevo. -->
  <!-- Sredisnja tocka vodilice (gdje se mlaz "pregiba"): T = (302, 284). Polumjer zakrivljenosti lopatice ~64. -->
  <!-- Konkavna (unutarnja, "korita") strana lopatice prema mlazu = jugoistocna strana. Lopatica izgleda kao C otvoreno prema dolje-desno. -->

  <!-- Tijelo lopatice (hatched - kruti element) -->
  <!-- Vanjski rub: krzni luk sa sjeverozapadne strane od izlaznog ruba dolje do ulaznog ruba dolje -->
  <path d="M 266,320 L 266,335 A 80,80 0 0,0 346,255 L 360,231 A 96,96 0 0,1 264,335 Z" fill="url(#u12v1vm_hatch)" stroke="#3a4a56" stroke-width="1.2" />
  <!-- Unutarnji rub lopatice (povr&#353;ina koja skre&#263;e mlaz): glatki luk -->
  <path d="M 266,262 A 78,78 0 0,1 344,184" fill="none" stroke="#3a4a56" stroke-width="1.4" />
  <path d="M 266,306 A 56,56 0 0,1 322,250" fill="none" stroke="#3a4a56" stroke-width="0.9" opacity="0.55" />

  <!-- Mlaz koji prati zakrivljenu lopaticu (voda u kanalu) -->
  <path d="M 266,262 A 78,78 0 0,1 344,184 L 358,208 A 50,50 0 0,0 308,258 L 308,262 Z" fill="url(#u12v1vm_voda)" opacity="0.95" />
  <!-- Donja granica mlaza (uz konkavnu povr&#353;inu) -->
  <path d="M 266,306 A 56,56 0 0,1 322,250 L 308,258 L 308,262 L 266,262" fill="url(#u12v1vm_voda)" opacity="0.85" />

  <!-- ============ IZLAZNI MLAZ (smjer 120° iznad +x) ============ -->
  <!-- Os izlaza prolazi kroz tocku (333,221) u smjeru (-0.5,-0.866). Sirina mlaza okomito na os = b=44 px (skala) -->
  <!-- Stranice izlaznog mlaza: pomicemo perpendikularno (-0.866,+0.5)*22 i (+0.866,-0.5)*22 -->
  <!-- Centar izlaza: P = (333,221). Lijeva stranica = P + (-0.866,+0.5)*22 = (314, 232). Desna stranica = P + (0.866,-0.5)*22 = (352, 210). -->
  <!-- Krajnja tocka mlaza na (-0.5,-0.866)*72 od P = (297, 159). Lijeva krajna = (278, 170), Desna krajna = (316, 148). -->
  <polygon points="314,232 352,210 316,148 278,170" fill="url(#u12v1vm_voda)" opacity="0.95" />
  <line x1="314" y1="232" x2="278" y2="170" stroke="#1565c0" stroke-width="1.4" />
  <line x1="352" y1="210" x2="316" y2="148" stroke="#1565c0" stroke-width="1.4" />

  <!-- ============ PRESJEK 1 (ulaz mlaza u KV) ============ -->
  <line x1="208" y1="244" x2="208" y2="324" stroke="#445" stroke-width="1.2" stroke-dasharray="5,3" />
  <circle cx="208" cy="244" r="2" fill="#1a2530" />

  <!-- ============ PRESJEK 2 (izlaz mlaza iz vodilice) ============ -->
  <!-- Presjek 2 okomito na os izlaza, prolazi kroz tocku P' = (297, 159). Smjer presjeka = (-0.866,+0.5). Krajnje tocke: P'+/-(0.866,-0.5)*22 -->
  <line x1="278" y1="170" x2="316" y2="148" stroke="#445" stroke-width="1.2" stroke-dasharray="5,3" />
  <circle cx="316" cy="148" r="2" fill="#1a2530" />

  <!-- ============ BRZINA v1 (zelena, prema desno, na ulazu) ============ -->
  <!-- Skala: 1 m/s ~ 2.2 px. v1=24 -> ~53 px. Od (108,284) do (161,284) -->
  <line x1="108" y1="284" x2="166" y2="284" stroke="#1e8449" stroke-width="2.6" marker-end="url(#u12v1vm_v)" />
  <!-- ============ BRZINA v2 (zelena, smjer 120° iznad +x) ============ -->
  <!-- v2=19 -> ~42 px. Pocetak u sredistu presjeka 2: (297,159). Smjer (-0.5,-0.866) duzine 42 -> (276, 123). -->
  <line x1="297" y1="159" x2="276" y2="123" stroke="#1e8449" stroke-width="2.6" marker-end="url(#u12v1vm_v)" />
  <!-- ============ KUT BETA (luk izmedu osi v1 i v2) ============ -->
  <!-- Refrencno ishodi&#353;te luka: tocka pregiba T=(297,284). Kratka isprekidana produzetak osi v1 (od ruba ulazne sapnice prema centru bend). -->
  <line x1="266" y1="284" x2="338" y2="284" stroke="#9aabb5" stroke-width="0.9" stroke-dasharray="4,4" />
  <!-- Luk od pocetka na kutu 0 (333,284) do kuta 120° CCW u standardu = u SVG od (333,284) gore-lijevo do (279,253) -->
  <path d="M 333,284 A 36,36 0 0,0 279,253" fill="none" stroke="#1a2530" stroke-width="1.3" />
  <!-- ============ SILE FLUIDA NA VODILICU (Fx, Fy) ============ -->
  <!-- Hvatiste sila u centru lopatice, pomaknuto u cisti prostor desno-dolje od mlaza: H = (380,332) -->
  <!-- Skala sila: 1 N ~ 0.13 px -> Fx ~ 53 px, Fy ~ 26 px -->
  <circle cx="380" cy="332" r="2.4" fill="#1a2530" />
  <line x1="380" y1="332" x2="433" y2="332" stroke="#c0392b" stroke-width="2.6" marker-end="url(#u12v1vm_f)" />
  <line x1="380" y1="332" x2="380" y2="358" stroke="#c0392b" stroke-width="2.6" marker-end="url(#u12v1vm_f)" />
  <!-- Leader linija od vodilice do hvatista sile (vizualna veza) -->
  <line x1="330" y1="285" x2="378" y2="328" stroke="#5a6a78" stroke-width="0.6" stroke-dasharray="2,3" />

  <!-- ============ NOSAC I REAKCIJA R ============ -->
  <!-- Nosac (stupic) ispod-desno od vodilice -->
  <rect x="380" y="384" width="34" height="48" fill="url(#u12v1vm_hatch)" stroke="#3a4a56" stroke-width="1" />
  <line x1="380" y1="432" x2="414" y2="432" stroke="#3a4a56" stroke-width="1.4" />
  <!-- Pomocna veza vodilica-nosac (krak) -->
  <line x1="397" y1="384" x2="380" y2="362" stroke="#3a4a56" stroke-width="1.2" />

  <!-- Reakcija R u vrhu nosaca, suprotno fluidnoj sili: smjer u SVG (-0.896, -0.443) duzine ~60 px -->
  <!-- Pocetak (397,384), krajnja (397-54, 384-27)=(343,357) -->
  <circle cx="397" cy="384" r="2.4" fill="#1a2530" />
  <line x1="397" y1="384" x2="343" y2="357" stroke="#1e8449" stroke-width="2.8" marker-end="url(#u12v1vm_r)" />
  <!-- ============ KOTE: b (sirina sapnice) i sapnica oznaka ============ -->
  <!-- b je iz tlocrta okomito na os mlaza = vertikalna dimenzija u SVG (visina pravokutnog presjeka u tlocrtu) -->
  <!-- Napomena za h (debljina u smjeru okomitom na ravninu) -->
  <!-- ============ OZNAKA VODE ============ -->
  <!-- ===================== DESNI PANEL: JEDNADZBE I REZULTATI ===================== -->
  <!-- Header bar (Zadano) -->
  <rect x="520" y="66" width="370" height="22" rx="5" fill="#1565c0" />
  <rect x="520" y="88" width="370" height="64" fill="#f4f9fd" stroke="#cfe0ee" stroke-width="1" />
  <!-- Blok 1: povrsina i maseni protok -->
  <rect x="520" y="164" width="370" height="76" rx="6" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="520" y="164" width="6" height="76" rx="3" fill="#1565c0" />
  <!-- Blok 2: projekcije izlazne brzine -->
  <rect x="520" y="252" width="370" height="76" rx="6" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="520" y="252" width="6" height="76" rx="3" fill="#1e8449" />
  <!-- Blok 3: komponente sile fluida na vodilicu -->
  <rect x="520" y="340" width="370" height="76" rx="6" fill="#fdf5f3" stroke="#ecc2bf" stroke-width="1.2" />
  <rect x="520" y="340" width="6" height="76" rx="3" fill="#c0392b" />
  <!-- Result badge: R -->
  <rect x="520" y="428" width="370" height="44" rx="8" fill="#eaf6ee" stroke="#1e8449" stroke-width="1.6" />
  <line x1="78" y1="262" x2="48" y2="262" stroke="#b7600c" stroke-width="0.7" />
  <line x1="78" y1="306" x2="48" y2="306" stroke="#b7600c" stroke-width="0.7" />
  <line x1="54" y1="262" x2="54" y2="306" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u12v1vm_dimL)" marker-end="url(#u12v1vm_dim)" />
  <text x="40" y="50" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Tlocrt vodilice (horizontalna ravnina)</text>

  <text x="96" y="454" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#5a6a78">x</text>
  <text x="44" y="394" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#5a6a78">y</text>
  <text x="40" y="468" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-style="italic" fill="#5a6a78">tlocrt</text>

  <text x="68" y="94" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#7a8a96">KV (kontrolni volumen)</text>

  <text x="213" y="244" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1a2530">1</text>
  <text x="269" y="166" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1a2530">2</text>
  <text x="112" y="276" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#1e8449"><tspan font-weight="700">v</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> = 24 m/s</text>

  <text x="194" y="116" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#1e8449"><tspan font-weight="700">v</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 19 m/s</text>

  <text x="308" y="272" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#1a2530">β = 120°</text>

  <text x="404" y="324" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#c0392b"><tspan font-weight="700">F</tspan><tspan baseline-shift="sub" font-size="0.7em">x</tspan> = +404 N</text>
  <text x="386" y="356" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#c0392b"><tspan font-weight="700">F</tspan><tspan baseline-shift="sub" font-size="0.7em">y</tspan> = −199 N</text>
  <text x="386" y="370" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a6a78">sile fluida na vodilicu</text>
  <text x="397" y="450" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#5a6a78">nosač</text>
  <text x="298" y="404" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#1e8449"><tspan font-weight="700">R</tspan> = 451 N</text>
  <text x="298" y="418" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#1e8449">reakcija nosača</text>

  <text x="78" y="420" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78">pravokutna sapnica:  A = b · h = 36 · 14 mm</text>
  <text x="78" y="434" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78">(visina h okomita na ravninu tlocrta)</text>

  <text x="116" y="296" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#0d47a1">voda</text>

  <text x="520" y="50" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Jednadzbe i rezultati</text>

  <text x="705" y="82" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">ZADANO</text>
  <text x="534" y="106" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530">b = 36 mm,  h = 14 mm,  β = 120°</text>
  <text x="534" y="124" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530"><tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> = 24 m/s,  <tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 19 m/s</text>
  <text x="534" y="142" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530">ρ = 998 kg/m³</text>

  <text x="708" y="183" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">površina presjeka i maseni protok</text>
  <text x="708" y="205" font-family="'Segoe UI',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a2530">A = b·h = 5,04 · 10⁻⁴ m²</text>
  <text x="708" y="226" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">ṁ = ρ A v₁ ≈ 12,07 kg/s</text>

  <text x="708" y="271" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">projekcije izlazne brzine</text>
  <text x="708" y="292" font-family="'Segoe UI',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="0.7em">2x</tspan> = <tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan>·cos 120° = −9,50 m/s</text>
  <text x="708" y="313" font-family="'Segoe UI',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="0.7em">2y</tspan> = <tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan>·sin 120° = +16,45 m/s</text>

  <text x="708" y="359" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">sila fluida na vodilicu</text>
  <text x="708" y="380" font-family="'Segoe UI',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">x</tspan> = −ṁ(<tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="0.7em">2x</tspan> − <tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan>) = <tspan font-weight="700" fill="#c0392b">+404 N</tspan></text>
  <text x="708" y="401" font-family="'Segoe UI',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">y</tspan> = −ṁ·<tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="0.7em">2y</tspan> = <tspan font-weight="700" fill="#c0392b">−199 N</tspan></text>

  <text x="540" y="445" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#5a6a78">REAKCIJA NOSAČA</text>
  <text x="708" y="461" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1e8449">R = √(F<tspan baseline-shift="sub" font-size="0.7em">x</tspan>² + F<tspan baseline-shift="sub" font-size="0.7em">y</tspan>²) ≈ 451 N  @ 26,2°</text>
<text x="46" y="290" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="end" fill="#b7600c"><tspan font-style="italic">b</tspan> = 36 mm</text>

  </svg>