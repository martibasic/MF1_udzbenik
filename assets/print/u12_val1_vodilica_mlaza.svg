  <rect x="32" y="32" width="916" height="356" rx="22" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>

  <text x="90" y="150" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#173043">Tlocrt scene</text>

  <rect x="120" y="228" width="88" height="32" rx="4" fill="#e7edf1" stroke="#173043" stroke-width="4"/>
  <text x="128" y="219" font-family="'Segoe UI',Arial,sans-serif" font-size="16" fill="#173043">sapnica</text>
