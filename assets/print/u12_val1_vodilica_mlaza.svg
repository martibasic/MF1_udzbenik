<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="u12v1vm_title u12v1vm_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="u12v1vm_title">U12 Val 1 - vodilica mlaza na ispitnom stolu</title>
  <desc id="u12v1vm_desc">Tlocrt mlaza i vodilice s kontrolnim volumenom, kutom skretanja i reakcijama nosaca.</desc>
