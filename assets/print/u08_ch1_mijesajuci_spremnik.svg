<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 625 452" role="img" aria-labelledby="u08c1ms_title u08c1ms_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:625px;height:auto;">
  <title id="u08c1ms_title">Miješajući spremnik: dva ulaza i akumulacija</title>
  <desc id="u08c1ms_desc">Dva uronjena otvorena priključka ulaze u homogenu tekućinu. Izlaz desno otvoren je ispod početne razine. Isprekidana ciljna razina označuje budući porast, bez zasebnoga obojenog sloja. Početna i ciljna visina mjerene su od istog dna, u omjeru 0,80 prema 1,20. Kontrolni volumen nepomičan je; savršeno miješanje i početni sastav prate model teksta.</desc>
