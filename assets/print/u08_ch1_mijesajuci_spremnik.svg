      <path d="M0,0 L0,5 L7,2.5 z" fill="#356b83" />
    </marker>
    <marker id="u08c1ms_aMix" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#356b83" />
    </marker>
