    <text x="590" y="354" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1e8449" text-anchor="middle">Q₃ ≈ 14,1 L/s</text>
    <text x="580" y="415" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#3a4a56" text-anchor="middle">D₃ = 100 mm</text>
