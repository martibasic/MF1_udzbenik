<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" role="img" aria-labelledby="u8c1-title u8c1-desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u8c1-title">U08 CH1 – mijesajuci izjednacni spremnik</title>
  <desc id="u8c1-desc">Mijesajuci spremnik L=4,2m b=1,5m. QA=18 L/s voda, QB=6 L/s slana otopina rhoB=1100. Q3=14,1 L/s, rho3=1025, dh/dt=0,094 m/min, t=255s.</desc>
  <defs>
    <linearGradient id="u8c1-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4eef8"/>
      <stop offset="100%" stop-color="#7ec8e8"/>
    </linearGradient>
    <linearGradient id="u8c1-salt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8e8f4"/>
      <stop offset="100%" stop-color="#4a9ab8"/>
    </linearGradient>
    <linearGradient id="u8c1-mix" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbdff0"/>
      <stop offset="100%" stop-color="#5aafce"/>
    </linearGradient>
    <linearGradient id="u8c1-acc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8d8ea" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4aa0c0" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="u8c1-sraf" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#8090a0"/>
      <line x1="0" y1="4" x2="8" y2="4" stroke="#546e7a" stroke-width="1.8"/>
    </pattern>
    <marker id="u8c1-arrG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#0f766e"/>
    </marker>
    <marker id="u8c1-arrB" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#1565c0"/>
    </marker>
    <marker id="u8c1-arrS" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#0a6080"/>
    </marker>
    <marker id="u8c1-arrGr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#546e7a"/>
    </marker>
    <marker id="u8c1-arrGrRev" markerWidth="9" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <path d="M9,0 L9,7 L0,3.5 z" fill="#546e7a"/>
    </marker>
    <marker id="u8c1-arrUp" markerWidth="10" markerHeight="8" refX="5" refY="0" orient="auto">
      <path d="M0,8 L10,8 L5,0 z" fill="#c96c35"/>
    </marker>
  </defs>
  <!-- Canvas -->
  <rect width="940" height="430" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="382" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>
  <!-- Title -->
  <text x="54" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#173043">Miješajući izjednačni spremnik</text>
  <text x="54" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#516677">L = 4,2 m, b = 1,5 m; voda Q_A + slana Q_B → homogena mješavina Q₃, razina raste od h₀ do h₁</text>

  <!-- ===== TANK ===== -->
  <!-- Scale: full shown height 1.6m → 230px, scale=143.75px/m -->
  <!-- h0=0.80m → 115px → water top y=352-115=237 -->
  <!-- h1=1.20m → 172px → target y=352-172=180 -->
  <!-- Left wall -->
  <rect x="188" y="96" width="18" height="256" fill="url(#u8c1-sraf)"/>
  <!-- Right wall -->
  <rect x="572" y="96" width="18" height="256" fill="url(#u8c1-sraf)"/>
  <!-- Bottom wall -->
  <rect x="188" y="334" width="402" height="18" fill="url(#u8c1-sraf)"/>
  <!-- Wall outlines -->
  <line x1="188" y1="96" x2="188" y2="352" stroke="#3d4f5a" stroke-width="2.5"/>
  <line x1="590" y1="96" x2="590" y2="352" stroke="#3d4f5a" stroke-width="2.5"/>
  <line x1="188" y1="352" x2="590" y2="352" stroke="#3d4f5a" stroke-width="3"/>

  <!-- Water fill (current h0) -->
  <rect x="206" y="237" width="366" height="115" fill="url(#u8c1-mix)" stroke="none"/>
  <!-- Accumulation zone (h0 to h1) -->
  <rect x="206" y="180" width="366" height="57" fill="url(#u8c1-acc)" stroke="none"/>

  <!-- Water surface (h0) -->
  <line x1="188" y1="237" x2="590" y2="237" stroke="#2980b9" stroke-width="2.5"/>
  <!-- Target level (h1) -->
  <line x1="188" y1="180" x2="590" y2="180" stroke="#2980b9" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="600" y="177" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#2980b9" font-style="italic">h₁ = 1,20 m</text>
  <text x="600" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#2980b9">h₀ = 0,80 m</text>

  <!-- KV dashed boundary -->
  <rect x="178" y="86" width="422" height="276" rx="8" fill="none" stroke="#c96c35" stroke-width="2" stroke-dasharray="10,6"/>
  <text x="186" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#c96c35" font-style="italic">kontrolni volumen</text>

  <!-- Inlet A — water (upper) -->
  <rect x="90" y="192" width="98" height="22" fill="url(#u8c1-water)" stroke="none"/>
  <line x1="90" y1="192" x2="188" y2="192" stroke="#3d4f5a" stroke-width="2"/>
  <line x1="90" y1="214" x2="188" y2="214" stroke="#3d4f5a" stroke-width="2"/>
  <line x1="90" y1="192" x2="90" y2="214" stroke="#3d4f5a" stroke-width="2"/>
  <line x1="40" y1="203" x2="88" y2="203" stroke="#1565c0" stroke-width="3.5" marker-end="url(#u8c1-arrB)"/>
  <text x="30" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1565c0">A</text>
  <text x="28" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1565c0">voda</text>
  <text x="24" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1565c0">18 L/s</text>

  <!-- Inlet B — salt solution (lower) -->
  <rect x="90" y="272" width="98" height="16" fill="url(#u8c1-salt)" stroke="none"/>
  <line x1="90" y1="272" x2="188" y2="272" stroke="#3d4f5a" stroke-width="2"/>
  <line x1="90" y1="288" x2="188" y2="288" stroke="#3d4f5a" stroke-width="2"/>
  <line x1="90" y1="272" x2="90" y2="288" stroke="#3d4f5a" stroke-width="2"/>
  <line x1="40" y1="280" x2="88" y2="280" stroke="#0a6080" stroke-width="3.5" marker-end="url(#u8c1-arrS)"/>
  <text x="30" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#0a6080">B</text>
  <text x="24" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0a6080">slana</text>
  <text x="24" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0a6080">6 L/s</text>

  <!-- Outlet 3 — horizontal pipe to right (at lower part of tank) -->
  <rect x="590" y="307" width="130" height="18" fill="url(#u8c1-mix)" stroke="none"/>
  <line x1="590" y1="307" x2="720" y2="307" stroke="#3d4f5a" stroke-width="2"/>
  <line x1="590" y1="325" x2="720" y2="325" stroke="#3d4f5a" stroke-width="2"/>
  <line x1="720" y1="307" x2="720" y2="325" stroke="#3d4f5a" stroke-width="2"/>
  <line x1="720" y1="316" x2="762" y2="316" stroke="#0f766e" stroke-width="3.5" marker-end="url(#u8c1-arrG)"/>
  <text x="768" y="307" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f766e">Q₃</text>
  <text x="766" y="321" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f766e">D₃=100 mm</text>
  <text x="766" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f766e">v₃=1,80 m/s</text>

  <!-- dh/dt arrow -->
  <line x1="388" y1="234" x2="388" y2="185" stroke="#c96c35" stroke-width="3" marker-end="url(#u8c1-arrUp)"/>
  <text x="396" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#c96c35">dh/dt</text>

  <!-- Dimension h0, h1 (left side) -->
  <line x1="162" y1="237" x2="162" y2="352" stroke="#546e7a" stroke-width="1.8" marker-start="url(#u8c1-arrGrRev)" marker-end="url(#u8c1-arrGr)"/>
  <text x="138" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#546e7a">h₀</text>

  <line x1="148" y1="180" x2="148" y2="352" stroke="#546e7a" stroke-width="1.8" marker-start="url(#u8c1-arrGrRev)" marker-end="url(#u8c1-arrGr)"/>
  <text x="124" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#546e7a">h₁</text>

  <!-- Dimension L (bottom) -->
  <line x1="206" y1="378" x2="572" y2="378" stroke="#546e7a" stroke-width="1.8" marker-start="url(#u8c1-arrGrRev)" marker-end="url(#u8c1-arrGr)"/>
  <text x="370" y="392" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#546e7a" text-anchor="middle">L = 4,2 m   (b = 1,5 m ⊥ skici)</text>

  <!-- ===== FORMULA BOX ===== -->
  <rect x="54" y="308" width="124" height="72" rx="8" fill="#fffef6" stroke="#c49a0a" stroke-width="1.5"/>
  <text x="64" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#173043">Ključni rezultati</text>
  <text x="62" y="343" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#516677">Q₃ ≈ 14,1 L/s</text>
  <text x="62" y="358" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#516677">ρ₃ = 1025 kg/m³</text>
  <text x="62" y="373" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#516677">t ≈ 255 s ≈ 4,3 min</text>
</svg>