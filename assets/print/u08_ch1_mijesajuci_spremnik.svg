  <text x="824" y="36" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#263746">Ključne jednadžbe (KV)</text>
  <text x="824" y="72" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">1. Izlazni volumenski protok</text>
  <text x="824" y="92" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#263746">Q<tspan baseline-shift="sub" font-size="0.7em">3</tspan> = A<tspan baseline-shift="sub" font-size="0.7em">3</tspan> · v<tspan baseline-shift="sub" font-size="0.7em">3</tspan> = (π D<tspan baseline-shift="sub" font-size="0.7em">3</tspan>² / 4) · v<tspan baseline-shift="sub" font-size="0.7em">3</tspan>
  </text>
  <text x="824" y="112" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">≈ 14,1 L/s</text>
  <text x="824" y="142" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">2. Gustoća homogenizirane mješavine</text>
  <text x="824" y="162" font-family="Arial, Liberation Sans, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#263746">ρ<tspan baseline-shift="sub" font-size="0.7em">3</tspan> = (ρ<tspan baseline-shift="sub" font-size="0.7em">A</tspan>Q<tspan baseline-shift="sub" font-size="0.7em">A</tspan> + ρ<tspan baseline-shift="sub" font-size="0.7em">B</tspan>Q<tspan baseline-shift="sub" font-size="0.7em">B</tspan>) / (Q<tspan baseline-shift="sub" font-size="0.7em">A</tspan> + Q<tspan baseline-shift="sub" font-size="0.7em">B</tspan>)</text>
  <text x="824" y="182" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">= 24,6 / 0,024 = 1025 kg/m³</text>
  <text x="824" y="214" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">3. Brzina porasta razine</text>
  <text x="824" y="234" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#263746">dh/dt = (Q<tspan baseline-shift="sub" font-size="0.7em">A</tspan> + Q<tspan baseline-shift="sub" font-size="0.7em">B</tspan> − Q<tspan baseline-shift="sub" font-size="0.7em">3</tspan>) / A<tspan baseline-shift="sub" font-size="0.7em">T</tspan>
  </text>
  <text x="824" y="254" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">≈ 0,094 m/min</text>
  <text x="824" y="286" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">4. Vrijeme porasta Δh = h<tspan baseline-shift="sub" font-size="0.7em">1</tspan> − h<tspan baseline-shift="sub" font-size="0.7em">0</tspan>
  </text>
  <text x="824" y="306" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#263746">t = A<tspan baseline-shift="sub" font-size="0.7em">T</tspan> · Δh / (Q<tspan baseline-shift="sub" font-size="0.7em">A</tspan> + Q<tspan baseline-shift="sub" font-size="0.7em">B</tspan> − Q<tspan baseline-shift="sub" font-size="0.7em">3</tspan>)</text>
  <text x="824" y="326" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">≈ 255 s ≈ 4,3 min</text>
  <text x="824" y="358" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">5. Akumulirana masa</text>
  <text x="824" y="378" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#263746">Δm = ρ<tspan baseline-shift="sub" font-size="0.7em">3</tspan> · A<tspan baseline-shift="sub" font-size="0.7em">T</tspan> · Δh</text>
  <text x="824" y="398" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">≈ 2583 kg ≈ 2,58 t</text>
  <text x="824" y="432" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#263746">Q<tspan baseline-shift="sub" font-size="0.7em">A</tspan> + Q<tspan baseline-shift="sub" font-size="0.7em">B</tspan> &gt; Q<tspan baseline-shift="sub" font-size="0.7em">3</tspan> → razina raste, KV akumulira masu</text>
  <text x="824" y="461" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#263746">REZULTATI</text>
  <text x="730" y="481" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#263746">Q<tspan baseline-shift="sub" font-size="0.7em">3</tspan> ≈ 14,1 L/s</text>
  <text x="824" y="481" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#263746">ρ<tspan baseline-shift="sub" font-size="0.7em">3</tspan> = 1025 kg/m³</text>
  <text x="918" y="481" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#263746">Δm ≈ 2,58 t</text>
  <g font-family="Arial, Liberation Sans, sans-serif" />
