      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.8" />
    </pattern>
    <marker id="u08c1ms_aB" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
