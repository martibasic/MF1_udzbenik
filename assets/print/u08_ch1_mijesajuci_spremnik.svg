  <text x="668" y="178" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">1. Iz vodoravnog voda najprije se vraća Q_3 = A_3 v_3</text>
  <text x="668" y="204" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">2. Ulazne mase zatvaraju rho_3</text>
  <text x="668" y="230" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">3. Tek tada neto protok daje dh/dt</text>
  <text x="668" y="256" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">4. Iz Delta h slijede vrijeme i akumulirana masa</text>
  <text x="668" y="288" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#516677">Ulazi, gustoća, izlaz i član akumulacije odvojeni su tako da</text>
  <text x="668" y="310" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#516677">red čitanja bilance ostane jednoznačan i bez preklapanja.</text>

