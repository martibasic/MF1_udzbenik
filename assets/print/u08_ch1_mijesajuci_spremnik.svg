    <text x="120" y="315" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="middle">A: voda, Q<tspan baseline-shift="sub" font-size="0.7em">A</tspan> = 18 L/s</text>
    <text x="120" y="361" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="middle">B: otopina, Q<tspan baseline-shift="sub" font-size="0.7em">B</tspan> = 6 L/s</text>
    <text x="590" y="354" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="middle">Q₃ ≈ 14,1 L/s</text>
    <text x="580" y="415" font-family="Arial, Liberation Sans, sans-serif" font-size="10" fill="#263746" text-anchor="middle">D₃ = 100 mm</text>
    <text x="580" y="430" font-family="Arial, Liberation Sans, sans-serif" font-size="10" fill="#263746" text-anchor="middle">v₃ = 1,80 m/s</text>
