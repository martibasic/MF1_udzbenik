    <text x="120" y="315" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1565c0" text-anchor="middle">A: voda, Q<tspan baseline-shift="sub" font-size="0.7em">A</tspan> = 18 L/s</text>
