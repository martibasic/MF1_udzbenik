    </marker>
    <marker id="u08c1ms_aDimR" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse">
      <path d="M0,0 L0,5 L6,2.5 z" fill="#356b83" />
    </marker>
    <marker id="u08c1ms_fix_force" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0 0 L0 5 L6 2.5 Z" fill="#356b83" stroke="none" stroke-width="1.2" />
    </marker>
    <marker id="u08c1ms_fix_green" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
