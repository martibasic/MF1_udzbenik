<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">U04 Val 1 - procesna kada na automatskoj platformi</title>
  <desc id="desc">Otvorena kada u relativnom mirovanju s nagnutom slobodnom površinom, ubrzanjem, geometrijom i rezultantnom silom na straznju stijenu.</desc>
  <rect width="980" height="420" fill="#fffdf8"/>
  <rect x="32" y="32" width="916" height="356" rx="22" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>

  <text x="70" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#173043">U04 - Procesna kada na ubrzanoj platformi</text>
  <text x="70" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#587183">Relativno mirovanje, granicno prelijevanje i sila na straznju stijenu.</text>

  <text x="90" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#173043">Bocni pogled spremnika</text>

  <rect x="120" y="170" width="260" height="170" rx="8" fill="none" stroke="#173043" stroke-width="6"/>
  <polygon points="120,170 380,255 380,340 120,340" fill="#9ed0e6" opacity="0.95"/>
  <line x1="120" y1="170" x2="380" y2="255" stroke="#ffffff" stroke-width="5"/>

  <line x1="300" y1="156" x2="390" y2="156" stroke="#1976d2" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <text x="342" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#173043">a</text>

  <line x1="92" y1="170" x2="92" y2="340" stroke="#c96c35" stroke-width="3" marker-start="url(#arrowOrangeSmall)" marker-end="url(#arrowOrange)"/>
  <text x="36" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#173043">H = h_straznja</text>

  <line x1="408" y1="255" x2="408" y2="340" stroke="#c96c35" stroke-width="3" marker-start="url(#arrowOrangeSmall)" marker-end="url(#arrowOrange)"/>
  <text x="420" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#173043">h_prednja</text>

  <line x1="120" y1="364" x2="380" y2="364" stroke="#6f7f89" stroke-width="3" marker-start="url(#arrowGray)" marker-end="url(#arrowGray)"/>
  <text x="236" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#173043">L</text>

  <line x1="120" y1="248" x2="54" y2="248" stroke="#c23b22" stroke-width="5" marker-end="url(#arrowRed)"/>
  <text x="52" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#173043">F_R</text>

  <text x="550" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#173043">Efektivno polje sila</text>
  <rect x="560" y="175" width="290" height="150" rx="14" fill="#f7fafb" stroke="#d3d9de" stroke-width="2"/>
  <circle cx="700" cy="250" r="10" fill="#173043"/>
  <line x1="700" y1="250" x2="700" y2="320" stroke="#c96c35" stroke-width="5" marker-end="url(#arrowOrange)"/>
  <text x="714" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#173043">g</text>
  <line x1="700" y1="250" x2="785" y2="250" stroke="#1976d2" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <text x="744" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#173043">a</text>
  <line x1="700" y1="250" x2="785" y2="320" stroke="#2e7d32" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <text x="790" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#173043">g_eff</text>
  <text x="585" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#587183">Slobodna površina je okomita na g_eff.</text>

  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#1976d2"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#c96c35"/>
    </marker>
    <marker id="arrowOrangeSmall" markerWidth="10" markerHeight="10" refX="4" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L6,3 z" fill="#c96c35"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#2e7d32"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L6,3 z" fill="#6f7f89"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#c23b22"/>
    </marker>
  </defs>
</svg>