<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" role="img"
     aria-labelledby="u4v1T u4v1D" preserveAspectRatio="xMidYMid meet"
     style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u4v1T">U04 Val 1 – Procesna kada na ubrzanoj platformi</title>
  <desc id="u4v1D">Otvorena pravokutna kada (L=1,80 m, H=0,72 m, ρ=970 kg/m³). Granično stanje: slobodna površina doseže vrh stražnje stijenke. a_max≈1,96 m/s², F_R≈2,34 kN, hvatište na H/3=0,24 m od dna.</desc>
  <defs>
    <pattern id="u4v1H" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#8090a0"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#546e7a" stroke-width="1.8"/>
    </pattern>
    <linearGradient id="u4v1Wg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4eef8"/>
      <stop offset="100%" stop-color="#7ec8e8"/>
    </linearGradient>
    <!-- pressure triangle gradient (left-to-right: transparent to red) -->
    <linearGradient id="u4v1Pg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b42318" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#b42318" stop-opacity="0.35"/>
    </linearGradient>
    <marker id="u4v1aGr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#546e7a"/>
    </marker>
    <marker id="u4v1aGrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L0,8 L8,4 z" fill="#546e7a"/>
    </marker>
    <marker id="u4v1aB" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#1565c0"/>
    </marker>
    <marker id="u4v1aR" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#b42318"/>
    </marker>
  </defs>

  <!-- Background + border -->
  <rect width="940" height="420" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="372" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>

  <!-- Title + subtitle -->
  <text x="54" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#173043">U04 – Procesna kada na ubrzanoj platformi</text>
  <text x="54" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#516677">Granično stanje: slobodna površina dotiče vrh stražnje stijenke. Trokutasta sila F_R na stražnju stijenku.</text>

  <!-- === LEFT PANEL: tank cross-section at limiting acceleration === -->
  <!-- Scale: 150 px/m. L=1,80m→270px, H=0,72m→108px -->
  <!-- Tank: left inner x=140, right x=410 (270px), bottom y=338, top y=230 (108px) -->
  <!-- h_back = H = 0,72m→108px → water top y=230 (= tank top, limit!) -->
  <!-- h_front = 0,36m → 54px → water top y=284 -->

  <!-- Structural walls (srafura) -->
  <!-- Left (back) wall -->
  <rect x="110" y="230" width="30" height="108" fill="url(#u4v1H)"/>
  <rect x="110" y="230" width="30" height="108" fill="none" stroke="#546e7a" stroke-width="1.2"/>
  <!-- Right (front) wall -->
  <rect x="410" y="230" width="30" height="108" fill="url(#u4v1H)"/>
  <rect x="410" y="230" width="30" height="108" fill="none" stroke="#546e7a" stroke-width="1.2"/>
  <!-- Bottom floor -->
  <rect x="110" y="338" width="330" height="24" fill="url(#u4v1H)"/>
  <rect x="110" y="338" width="330" height="24" fill="none" stroke="#546e7a" stroke-width="1.2"/>

  <!-- Water fill -->
  <!-- back top y=230 (= tank top!), front top y=284, bottom y=338 -->
  <path d="M140,230 L410,284 L410,338 L140,338 Z" fill="url(#u4v1Wg)" opacity="0.9"/>

  <!-- Tank inner wall faces -->
  <line x1="140" y1="230" x2="140" y2="338" stroke="#2d3a40" stroke-width="2.5"/>
  <line x1="410" y1="230" x2="410" y2="338" stroke="#2d3a40" stroke-width="2.5"/>
  <!-- Top rim (tank top edge) -->
  <line x1="140" y1="230" x2="410" y2="230" stroke="#2d3a40" stroke-width="2.5"/>

  <!-- Free surface line (touching top of back wall) -->
  <line x1="140" y1="230" x2="410" y2="284" stroke="#3a87ad" stroke-width="2.5"/>

  <!-- *** KEY VISUAL: free surface touches top of back wall *** -->
  <!-- Highlight at corner where surface meets back wall top -->
  <circle cx="140" cy="230" r="5" fill="#b42318"/>
  <text x="96" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#b42318" font-weight="700">granično!</text>

  <!-- Pressure triangle on back (left) wall -->
  <!-- Back wall: x=140, from y=230 (top, p=0) to y=338 (bottom, p=p_max) -->
  <!-- Triangle: apex at (140,230), base at (140,338) extending left by ~50px -->
  <polygon points="140,230 140,338 90,338" fill="url(#u4v1Pg)"/>
  <line x1="140" y1="230" x2="90" y2="338" stroke="#b42318" stroke-width="1.5" stroke-dasharray="5 3"/>
  <!-- Pressure distribution bars (horizontal lines at back wall) -->
  <line x1="140" y1="250" x2="132" y2="250" stroke="#b42318" stroke-width="1.2"/>
  <line x1="140" y1="270" x2="121" y2="270" stroke="#b42318" stroke-width="1.2"/>
  <line x1="140" y1="290" x2="110" y2="290" stroke="#b42318" stroke-width="1.2"/>
  <line x1="140" y1="310" x2="99"  y2="310" stroke="#b42318" stroke-width="1.2"/>
  <line x1="140" y1="330" x2="88"  y2="330" stroke="#b42318" stroke-width="1.2"/>

  <!-- F_R resultant force arrow (pointing left, at hvatište H/3=0,24m from bottom → 36px above bottom) -->
  <!-- y_FR = 338 - 36 = 302 -->
  <line x1="140" y1="302" x2="60" y2="302" stroke="#b42318" stroke-width="4" marker-end="url(#u4v1aR)"/>
  <rect x="55" y="285" width="46" height="20" rx="5" fill="#fff8f8" stroke="#d8c7c4" stroke-width="1.2"/>
  <text x="78" y="299" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#b42318" text-anchor="middle">F_R</text>

  <!-- hvatište annotation: H/3 from bottom -->
  <line x1="72" y1="302" x2="72" y2="338" stroke="#b42318" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="36" y="312" width="30" height="18" rx="4" fill="#fff8f8" stroke="#e0c5c5" stroke-width="1"/>
  <text x="51" y="325" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#b42318" text-anchor="middle">H/3</text>

  <!-- Acceleration arrow (above tank, pointing right) -->
  <line x1="198" y1="196" x2="348" y2="196" stroke="#1565c0" stroke-width="3.5" marker-end="url(#u4v1aB)"/>
  <rect x="213" y="178" width="120" height="20" rx="5" fill="#eef4ff" stroke="#c5d5e8" stroke-width="1"/>
  <text x="273" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1565c0" font-weight="700" text-anchor="middle">a = a_max ≈ 1,96 m/s²</text>

  <!-- "stražnja" and "prednja" labels -->
  <text x="140" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#516677" text-anchor="middle">stražnja</text>
  <text x="410" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#516677" text-anchor="middle">prednja</text>

  <!-- === DIMENSION LINES === -->

  <!-- H dim (right of right wall, from tank top to bottom, x=455, y=230..338) -->
  <line x1="455" y1="230" x2="455" y2="338" stroke="#546e7a" stroke-width="1.8" marker-start="url(#u4v1aGrL)" marker-end="url(#u4v1aGr)"/>
  <line x1="450" y1="230" x2="460" y2="230" stroke="#546e7a" stroke-width="1.3"/>
  <line x1="450" y1="338" x2="460" y2="338" stroke="#546e7a" stroke-width="1.3"/>
  <rect x="462" y="272" width="56" height="34" rx="5" fill="#fff" stroke="#c9d2d8" stroke-width="1"/>
  <text x="490" y="287" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#173043" text-anchor="middle">H</text>
  <text x="490" y="301" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#516677" text-anchor="middle">0,72 m</text>
  <!-- note: H = h_str at limit -->
  <text x="490" y="315" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#b42318" text-anchor="middle">= h_str!</text>

  <!-- h_pred dim (further right, x=500, from y=284 to y=338) -->
  <line x1="500" y1="284" x2="500" y2="338" stroke="#546e7a" stroke-width="1.8" marker-start="url(#u4v1aGrL)" marker-end="url(#u4v1aGr)"/>
  <line x1="495" y1="284" x2="505" y2="284" stroke="#546e7a" stroke-width="1.3"/>
  <line x1="495" y1="338" x2="505" y2="338" stroke="#546e7a" stroke-width="1.3"/>
  <rect x="507" y="299" width="56" height="34" rx="5" fill="#fff" stroke="#c9d2d8" stroke-width="1"/>
  <text x="535" y="313" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#173043" text-anchor="middle">h_pred</text>
  <text x="535" y="327" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#516677" text-anchor="middle">0,36 m</text>

  <!-- L dim (below floor, y=375, x=140 to x=410) -->
  <line x1="140" y1="375" x2="410" y2="375" stroke="#546e7a" stroke-width="1.8" marker-start="url(#u4v1aGrL)" marker-end="url(#u4v1aGr)"/>
  <line x1="140" y1="370" x2="140" y2="380" stroke="#546e7a" stroke-width="1.3"/>
  <line x1="410" y1="370" x2="410" y2="380" stroke="#546e7a" stroke-width="1.3"/>
  <rect x="234" y="380" width="76" height="20" rx="4" fill="#fff" stroke="#c9d2d8" stroke-width="1"/>
  <text x="272" y="394" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#173043" text-anchor="middle">L = 1,80 m</text>

  <!-- h₀ dashed mid-level indicator: h₀=0,54m→81px, y=338-81=257 -->
  <line x1="140" y1="257" x2="410" y2="257" stroke="#b7600c" stroke-width="1.2" stroke-dasharray="7 5"/>
  <rect x="292" y="260" width="76" height="17" rx="3" fill="#fffbf5" stroke="#e0c080" stroke-width="1"/>
  <text x="330" y="271" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#b7600c" text-anchor="middle">h₀ = 0,54 m (mirno)</text>

  <!-- === RIGHT PANEL: Formula box === -->
  <rect x="566" y="90" width="350" height="310" rx="10" fill="#fffef6" stroke="#c49a0a" stroke-width="1.8"/>
  <text x="586" y="115" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#173043">Ključne jednadžbe</text>
  <line x1="586" y1="122" x2="900" y2="122" stroke="#e8d89a" stroke-width="1"/>

  <!-- a_max -->
  <text x="586" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#173043">Granično stanje: h_str = H</text>
  <text x="586" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#173043">a_max = g · Δh / L</text>
  <text x="586" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#516677">  Δh = 2(H − h₀) = 2(0,72 − 0,54) = 0,36 m</text>
  <text x="586" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#516677">  a_max = 9,81 · 0,36 / 1,80</text>
  <text x="586" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1565c0">a_max ≈ 1,96 m/s²</text>
  <line x1="586" y1="222" x2="900" y2="222" stroke="#e8d89a" stroke-width="1"/>

  <!-- h_pred -->
  <text x="586" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#173043">h_pred = 2h₀ − H = 0,36 m</text>
  <line x1="586" y1="250" x2="900" y2="250" stroke="#e8d89a" stroke-width="1"/>

  <!-- F_R -->
  <text x="586" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#173043">Trokutasta raspodjela na stražnjoj st.:</text>
  <text x="586" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#173043">F_R = ½ρgBH²</text>
  <text x="586" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#516677">  = ½ · 970 · 9,81 · 0,95 · 0,72²</text>
  <text x="586" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#b42318">F_R ≈ 2,34 kN  ←</text>
  <line x1="586" y1="330" x2="900" y2="330" stroke="#e8d89a" stroke-width="1"/>

  <!-- hvatište -->
  <text x="586" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#173043">Hvatište: y_R = H/3 = 0,24 m od dna</text>
  <text x="586" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#516677">(trokutasta raspodjela: centroid na 1/3 visine)</text>
  <text x="586" y="385" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#516677">ρ = 970 kg/m³,  B = 0,95 m,  H = 0,72 m</text>

</svg>