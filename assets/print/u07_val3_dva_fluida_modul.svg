<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-labelledby="u07v3dfm_title u07v3dfm_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:880px;height:auto;">
  <title id="u07v3dfm_title">Kalibracijski modul na granici ulja i vode</title>
  <desc id="u07v3dfm_desc">Lijevo: hermeticki kalibracijski modul potpuno uronjen u zatvoreni spremnik s uljem (gornji sloj) i vodom (donji sloj), s dijelom t-x u ulju i x u vodi; tezina G prema dolje i ukupni uzgon F_U prema gore. Desno: izvod neutralnog urona iz vertikalne ravnoteze i sila vodilice F_V za pogresan polozaj x=0,050 m.</desc>

  <defs>
    <linearGradient id="u07v3dfm_oil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#c8a000" />
    </linearGradient>
    <linearGradient id="u07v3dfm_water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aed6f1" />
      <stop offset="100%" stop-color="#5b9ec9" />
    </linearGradient>
    <linearGradient id="u07v3dfm_module" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfe6ea" />
      <stop offset="100%" stop-color="#aab5bd" />
    </linearGradient>
    <pattern id="u07v3dfm_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.1" />
    </pattern>
    <marker id="u07v3dfm_aR" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#c0392b" />
    </marker>
    <marker id="u07v3dfm_aG" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1e8449" />
    </marker>
    <marker id="u07v3dfm_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u07v3dfm_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
  </defs>

  <!-- Pozadina i okviri panela -->
  <rect width="880" height="500" fill="#ffffff" />
  <rect x="14" y="14" width="404" height="472" rx="14" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.4" />
  <rect x="430" y="14" width="436" height="472" rx="14" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.4" />

  <!-- ============================================================
       LIJEVI PANEL: FIZIKALNI MODEL
       Skala: 1 m = 800 px (tj. t = 0,22 m -> 176 px)
       Spremnik unutarnja sirina: 220 px; visina fluida: 320 px
       Interface (granica ulje/voda) na y = 250
       Modul: visina t = 176 px, podjela neutralna x = 0,0933 m -> 74,6 px (u vodi)
              t - x = 0,1267 m -> 101,4 px (u ulju)
       Modul gornja ploha y = 250 - 101 = 149
       Modul donja ploha y = 250 + 75 = 325
       Spremnik unutar: x = 100..320, gornji rub fluida y = 90, dno y = 410
    ============================================================ -->

  <!-- Spremnik: hatched stjenke (lijevo, desno, dno) -->
  <rect x="84" y="78" width="16" height="340" fill="url(#u07v3dfm_hatch)" stroke="#3a4a56" stroke-width="1.2" />
  <rect x="320" y="78" width="16" height="340" fill="url(#u07v3dfm_hatch)" stroke="#3a4a56" stroke-width="1.2" />
  <rect x="84" y="410" width="252" height="14" fill="url(#u07v3dfm_hatch)" stroke="#3a4a56" stroke-width="1.2" />
  <!-- Gornji poklopac (hermeticki) -->
  <rect x="84" y="78" width="252" height="14" fill="url(#u07v3dfm_hatch)" stroke="#3a4a56" stroke-width="1.2" />

  <!-- Fluidi (kontinuirani: ulje gore, voda dolje, interface y=250) -->
  <!-- Ulje y = 92..250 -->
  <rect x="100" y="92" width="220" height="158" fill="url(#u07v3dfm_oil)" />
  <!-- Voda y = 250..410 -->
  <rect x="100" y="250" width="220" height="160" fill="url(#u07v3dfm_water)" />
  <!-- Granica ulje/voda -->
  <line x1="100" y1="250" x2="320" y2="250" stroke="#0d47a1" stroke-width="1.6" stroke-dasharray="6,4" />

  <!-- Modul (rotirajuci pravokutnik) centriran na x=210, sirina 76 px, y=149..325 -->
  <rect x="172" y="149" width="76" height="176" rx="2" fill="url(#u07v3dfm_module)" stroke="#3a4a56" stroke-width="2" />
  <!-- Suptilna referenca na hermeticki spoj (gornja i donja ploha modula) -->
  <line x1="172" y1="155" x2="248" y2="155" stroke="#5d6d7e" stroke-width="0.8" opacity="0.55" />
  <line x1="172" y1="319" x2="248" y2="319" stroke="#5d6d7e" stroke-width="0.8" opacity="0.55" />

  <!-- Oznaka modula (centrirano, iznad interface-a) -->
  <!-- Sila G (crvena, prema dolje, iznad modula) -->
  <line x1="210" y1="110" x2="210" y2="146" stroke="#c0392b" stroke-width="2.6" marker-end="url(#u07v3dfm_aR)" />
  <!-- Sila F_U (zelena, prema gore, ispod modula) -->
  <line x1="210" y1="395" x2="210" y2="330" stroke="#1e8449" stroke-width="2.6" marker-end="url(#u07v3dfm_aG)" />
  <!-- Oznake fluida (lijevo od modula, unutar spremnika gdje stane) -->
  <!-- Oznaka granice fluida (iznad linije, lijevo izvan modula) -->
  <!-- ============================================================
       KOTE (desno od spremnika)
       Pomocne linije od modula i interface-a do dim osi
       Os t      x = 352
       Os t-x    x = 376
       Os x      x = 376 (drugi raspon)
    ============================================================ -->

  <!-- Pomocne linije: gornja ploha modula y=149 -->
  <!-- Interface y=250 -->
  <!-- Donja ploha modula y=325 -->
  <!-- Tik-crte za t (na x=352) -->
  <!-- Dim linija t -->
  <!-- Labela t s lijeve strane dim linije, na visini interface-a (uz blok ulja - vodena granica) -->
  <!-- Tik-crte za t-x (na x=378) -->
  <!-- Dim linija t-x -->
  <!-- Tik-crte za x (na x=378, donji raspon) -->
  <!-- Dim linija x -->
  <!-- Kota tlocrtna sirina b (ispod spremnika, samo za referencu na presjek modula) -->
  <!-- ============================================================
       DESNI PANEL: FORMULA STACK (4 bloka + rezultati badge)
       Panel x = 430..866, y = 14..486 (h = 472)
       Header bar y = 30..62
       Blok 1 y = 78..158  (Tlocrt + tezina)
       Blok 2 y = 168..258 (Ravnoteza za neutralno x)
       Blok 3 y = 268..348 (Pogresan polozaj x=0,050 m)
       Badge  y = 360..420 (Rezultati F_V)
       Footer y = 432..472 (italic comment)
    ============================================================ -->

  <!-- Header bar -->
  <rect x="446" y="30" width="404" height="32" rx="6" fill="#1565c0" />
  <!-- BLOK 1: tlocrt + tezina -->
  <line x1="466" y1="156" x2="830" y2="156" stroke="#c8d6e4" stroke-width="1" />

  <!-- BLOK 2: neutralni uron -->
  <line x1="466" y1="258" x2="830" y2="258" stroke="#c8d6e4" stroke-width="1" />

  <!-- BLOK 3: pogresan polozaj -->
  <line x1="466" y1="348" x2="830" y2="348" stroke="#c8d6e4" stroke-width="1" />

  <!-- REZULTATI BADGE -->
  <rect x="466" y="362" width="364" height="60" rx="9" fill="#eaf6ee" stroke="#1e8449" stroke-width="1.6" />
  <!-- Footer italic -->
  <line x1="248" y1="149" x2="384" y2="149" stroke="#b7600c" stroke-width="0.7" />
  <line x1="248" y1="250" x2="384" y2="250" stroke="#b7600c" stroke-width="0.7" />
  <line x1="248" y1="325" x2="384" y2="325" stroke="#b7600c" stroke-width="0.7" />

  <line x1="346" y1="149" x2="358" y2="149" stroke="#b7600c" stroke-width="1.2" />
  <line x1="346" y1="325" x2="358" y2="325" stroke="#b7600c" stroke-width="1.2" />
  <line x1="352" y1="151" x2="352" y2="323" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u07v3dfm_dimL)" marker-end="url(#u07v3dfm_dim)" />
  <line x1="372" y1="149" x2="384" y2="149" stroke="#b7600c" stroke-width="1.2" />
  <line x1="372" y1="250" x2="384" y2="250" stroke="#b7600c" stroke-width="1.2" />
  <line x1="378" y1="151" x2="378" y2="248" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u07v3dfm_dimL)" marker-end="url(#u07v3dfm_dim)" />
  <line x1="372" y1="250" x2="384" y2="250" stroke="#b7600c" stroke-width="1.2" />
  <line x1="372" y1="325" x2="384" y2="325" stroke="#b7600c" stroke-width="1.2" />
  <line x1="378" y1="252" x2="378" y2="323" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u07v3dfm_dimL)" marker-end="url(#u07v3dfm_dim)" />
  <line x1="172" y1="425" x2="172" y2="450" stroke="#b7600c" stroke-width="0.7" />
  <line x1="248" y1="425" x2="248" y2="450" stroke="#b7600c" stroke-width="0.7" />
  <line x1="172" y1="447" x2="172" y2="435" stroke="#b7600c" stroke-width="1.2" />
  <line x1="248" y1="447" x2="248" y2="435" stroke="#b7600c" stroke-width="1.2" />
  <line x1="174" y1="441" x2="246" y2="441" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u07v3dfm_dimL)" marker-end="url(#u07v3dfm_dim)" />
  <text x="36" y="40" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Hermeticki spremnik (ulje + voda)</text>

  <text x="210" y="225" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1a2530">modul</text>
  <text x="210" y="285" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">m</tspan> = 12,8 kg</text>

  <text x="218" y="124" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#c0392b"><tspan font-weight="700">G</tspan> = 125,6 N</text>

  <text x="218" y="378" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#1e8449"><tspan font-weight="700">F</tspan><tspan baseline-shift="sub" font-size="0.7em">U</tspan> = 125,6 N</text>

  <text x="118" y="160" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#8a5a00">ulje</text>
  <text x="106" y="176" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#8a5a00">ρ₁ = 820</text>
  <text x="106" y="190" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#8a5a00">kg/m³</text>

  <text x="118" y="340" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#0d47a1">voda</text>
  <text x="106" y="356" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#0d47a1">ρ₂ = 1030</text>
  <text x="106" y="370" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#0d47a1">kg/m³</text>

  <text x="166" y="246" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" text-anchor="end" font-style="italic" fill="#0d47a1">granica</text>

  <text x="648" y="51" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#ffffff">Vertikalna ravnoteža uronjenog modula</text>

  <text x="648" y="92" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Tlocrtna površina i težina modula</text>
  <text x="648" y="114" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">A</tspan> = <tspan font-style="italic">b</tspan> · <tspan font-style="italic">l</tspan> = 0,32 · 0,20 = 0,064 m²</text>
  <text x="648" y="138" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#c0392b"><tspan font-style="italic">G</tspan> = <tspan font-style="italic">m</tspan> <tspan font-style="italic">g</tspan> = 12,8 · 9,81 ≈ 125,6 N</text>
  <text x="648" y="178" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Neutralni uron: <tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">U</tspan> = <tspan font-style="italic">G</tspan></text>
  <text x="648" y="202" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530">ρ₁ <tspan font-style="italic">g</tspan> <tspan font-style="italic">A</tspan> (<tspan font-style="italic">t</tspan> − <tspan font-style="italic">x</tspan>) + ρ₂ <tspan font-style="italic">g</tspan> <tspan font-style="italic">A</tspan> <tspan font-style="italic">x</tspan> = <tspan font-style="italic">m</tspan> <tspan font-style="italic">g</tspan></text>
  <text x="648" y="224" font-family="'Segoe UI',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a2530">820 · 0,22 + (1030 − 820) <tspan font-style="italic">x</tspan> = 12,8 / 0,064 = 200</text>
  <text x="648" y="246" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1e8449"><tspan font-style="italic">x</tspan> = 19,6 / 210 ≈ 0,0933 m ≈ 9,33 cm</text>
  <text x="648" y="280" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Pogrešan položaj: <tspan font-style="italic">x</tspan> = 0,050 m → uzgon manji od težine</text>
  <text x="648" y="304" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">U</tspan> = 9,81 · 0,064 · (820 · 0,17 + 1030 · 0,05)</text>
  <text x="648" y="328" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1565c0"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">U</tspan> ≈ 119,9 N  &lt;  <tspan font-style="italic">G</tspan> = 125,6 N</text>
  <text x="648" y="382" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#5a6a78">REZULTAT – SILA VODILICE</text>
  <text x="648" y="410" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1e8449"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">V</tspan> = <tspan font-style="italic">G</tspan> − <tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">U</tspan> ≈ 5,7 N ↑</text>

  <text x="648" y="448" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">Vodilica prenosi razliku tezine i uzgona prema gore.</text>
  <text x="648" y="466" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" text-anchor="middle" fill="#5a6a78">Vise vode u istisnini → veci uzgon (ρ₂ &gt; ρ₁).</text>
<text x="346" y="240" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" font-style="italic" text-anchor="end" fill="#b7600c">t</text>
  <text x="346.0" y="256.0" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="end" fill="#b7600c">= 0,22 m</text>

  <text x="384" y="194" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b7600c"><tspan font-style="italic">t</tspan>−<tspan font-style="italic">x</tspan></text>
  <text x="384" y="208" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#b7600c">0,127 m</text>

  <text x="384" y="285" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b7600c"><tspan font-style="italic">x</tspan></text>
  <text x="384.0" y="301.0" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#b7600c">= 0,093 m</text>

  <text x="210" y="465" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">b</tspan> = 0,32 m,  <tspan font-style="italic">l</tspan> = 0,20 m</text>

  </svg>