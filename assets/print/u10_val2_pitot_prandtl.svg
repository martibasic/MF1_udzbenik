<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="title">U10 Val 2 - Pitot-staticka cijev</title>
  <desc id="desc">Minimalna tehnička skica Pitot-staticke cijevi u struji vode spojene na zivin manometar s označenim stagnacijskim i statickim tlakom te razlikom razina delta h Hg.</desc>
  <rect width="940" height="320" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="272" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>

  <text x="54" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#173043">U10 - Pitot-staticka cijev</text>
  <text x="54" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#516677">Manometar mjeri razliku stagnacijskog i statickog tlaka, a iz nje se dobiva brzina.</text>

  <rect x="88" y="134" width="430" height="92" rx="18" fill="#dff1f8" stroke="#173043" stroke-width="3"/>
  <line x1="116" y1="180" x2="246" y2="180" stroke="#1976d2" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <line x1="258" y1="180" x2="388" y2="180" stroke="#1976d2" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <text x="140" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">struja vode</text>

  <path d="M412 180 L412 116 L436 116 L436 180" fill="none" stroke="#173043" stroke-width="4"/>
  <circle cx="412" cy="180" r="6" fill="#be123c"/>
  <text x="446" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">stagnacijska točka</text>
  <text x="446" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#516677">p0, v = 0</text>

  <path d="M324 180 L324 236 L348 236" fill="none" stroke="#173043" stroke-width="4"/>
  <circle cx="324" cy="180" r="6" fill="#0f766e"/>
  <text x="286" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#173043">p</text>

  <path d="M566 108 L566 236 L620 236 L620 126" fill="none" stroke="#173043" stroke-width="4"/>
  <path d="M566 208 L566 236 L620 236 L620 182" fill="none" stroke="#7d7d83" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="632" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">Hg</text>

  <line x1="650" y1="126" x2="650" y2="182" stroke="#c96c35" stroke-width="3" marker-start="url(#arrowOrangeSmall)" marker-end="url(#arrowOrange)"/>
  <text x="662" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">delta h Hg</text>

  <line x1="436" y1="126" x2="566" y2="126" stroke="#6b7280" stroke-width="3"/>
  <line x1="348" y1="236" x2="566" y2="236" stroke="#6b7280" stroke-width="3"/>
  <text x="706" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">delta p = p0 - p</text>
  <text x="706" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">v = sqrt(2 delta p / rho)</text>

  <text x="94" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#516677">Pitot otvor zaustavlja tok lokalno, a manometar prevodi tu tlacnu razliku u mjerljivu razliku razina.</text>

  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#1976d2"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#c96c35"/>
    </marker>
    <marker id="arrowOrangeSmall" markerWidth="10" markerHeight="10" refX="4" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L6,3 z" fill="#c96c35"/>
    </marker>
  </defs>
</svg>