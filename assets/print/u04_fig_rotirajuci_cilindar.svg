<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 513 497" role="img" aria-labelledby="u04frc_title u04frc_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:513px;height:auto;">
  <title id="u04frc_title">Poprečni presjek broda u kružnom zavoju: balastni tank s nagnutom slobodnom površinom i sondnim cijevima</title>
  <desc id="u04frc_desc">Brod skreće oko središta zavoja koje je lijevo od presjeka; strelica a pokazuje centripetalno ubrzanje, a jednako duga suprotna strelica prividnu silu po jedinici mase na vodu. U okviru broda na vodu u poprečnom tanku djeluje gravitacija i prividna sila od središta, pa se površina podiže na vanjskoj (desnoj) strani. Mjerilo je 40 jedinica po metru: tank širok 9,0 m i visok 2,20 m, mirna razina 1,60 m, razine 1,503 m uz unutarnju i 1,697 m uz vanjsku stijenku. Sondne cijevi uz obje stijenke otvorene su iznad dna. Nagib površine nacrtan je u stvarnom omjeru a/g, bez uvećanja.</desc>
  <defs>
    <pattern id="u04frc_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.1" />
    </pattern>
    <marker id="u04frc_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#657781" />
    </marker>
    <marker id="u04frc_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#657781" />
    </marker>
    <marker id="u04frc_vec" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#356b83" />
    </marker>
  </defs>
