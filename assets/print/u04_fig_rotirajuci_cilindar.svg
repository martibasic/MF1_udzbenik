  <text x="160" y="396" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#0d47a1">voda</text>
  <text x="681" y="58" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">Paraboloidna slobodna površina</text>
  <text x="681" y="106" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Razlika razina rub - osa</text>
  <text x="681" y="129" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a2530">Δh = ω² R² / (2g)</text>
  <text x="681" y="150" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#3a4a56">= 6,0² · 0,35² / (2 · 9,81)</text>
  <text x="681" y="168" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b">≈ 0,225 m = 22,5 cm</text>
  <text x="681" y="204" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Visina uz stijenku (uzdizanje)</text>
  <text x="681" y="227" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a2530">
    <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">rub</tspan> = h₀ + Δh/2</text>
  <text x="681" y="246" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#3a4a56" transform="translate(0 8)">= 0,28 + 0,11239</text>
  <text x="681" y="262" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0" transform="translate(0 13)">≈ 0,392 m</text>
  <text x="681" y="294" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78" transform="translate(0 13)">Visina u osi (spustanje)</text>
  <text x="681" y="317" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a2530" transform="translate(0 13)">
    <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">osa</tspan> = h₀ − Δh/2</text>
  <text x="681" y="336" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#3a4a56" transform="translate(0 13) translate(0 8)">= 0,28 − 0,11239</text>
  <text x="681" y="352" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0" transform="translate(0 26)">≈ 0,168 m</text>
  <text x="681" y="378" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78" transform="translate(0 26)">Simetrija oko h₀: rub se uzdize koliko se osa spusta.</text>
  <text x="681" y="410" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#5a6a78" transform="translate(0 26)">REZULTATI</text>
  <text x="605" y="436" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b" transform="translate(0 26)">Δh ≈ 22,5 cm</text>
  <text x="757" y="436" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1e8449" transform="translate(0 26)">
