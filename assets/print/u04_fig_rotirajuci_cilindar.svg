<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 526" role="img" aria-labelledby="u04frc_title u04frc_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:860px;height:auto;">
  <title id="u04frc_title">Rotirajuci cilindricni spremnik s paraboloidnom slobodnom povrsinom</title>
  <desc id="u04frc_desc">Aksijalni presjek otvorenog cilindra polumjera R=0,35 m koji rotira kutnom brzinom omega=6,0 rad/s. Slobodna površina je paraboloid: u osi pada za Delta h/2 = 11,25 cm ispod pocetne razine h0=0,28 m, a uz stijenku se uzdize za Delta h/2 iznad nje. Ukupna razlika razina Delta h priblizno 22,5 cm. Desno: stog formula s Delta h, h_rub i h_osa te badge s rezultatima.</desc>
