<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 526" role="img" aria-labelledby="u04frc_title u04frc_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:860px;height:auto;">
  <title id="u04frc_title">Rotirajući cilindrični spremnik s paraboloidnom slobodnom površinom</title>
  <desc id="u04frc_desc">Aksijalni presjek otvorenog cilindra polumjera R=0,35 m koji rotira kutnom brzinom omega=6,0 rad/s. Slobodna površina je paraboloid: u osi pada za Delta h/2 = 11,25 cm ispod početne razine h0=0,28 m, a uz stijenku se uzdiže za Delta h/2 iznad nje. Ukupna razlika razina Delta h približno 22,5 cm. Desno: pregled formula s Delta h, h_rub i h_osa te okvir s rezultatima.</desc>
