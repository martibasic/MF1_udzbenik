  <text x="30" y="56" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1a2530">rotirajućeg cilindra</text>
  <text x="260" y="34" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" font-weight="700" text-anchor="middle" fill="#1e8449">ω = 6,0 rad/s</text>
  <text x="340" y="240" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" text-anchor="end" font-style="italic" fill="#0d47a1">
    <tspan font-weight="700">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">rub</tspan> ≈ 0,392 m</text>
  <text x="322" y="385" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-style="italic" fill="#0d47a1">
    <tspan font-weight="700">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">osa</tspan> ≈ 0,168 m</text>
