  <text x="30" y="40" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" fill="#263746">Aksijalni presjek</text>
  <text x="30" y="56" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" fill="#263746">rotirajućeg cilindra</text>
  <text x="260" y="34" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-style="italic" font-weight="700" text-anchor="middle" fill="#263746">ω = 6,0 rad/s</text>
  <text x="340" y="240" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" text-anchor="end" font-style="italic" fill="#263746">
    <tspan font-weight="700">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">rub</tspan> ≈ 0,392 m</text>
  <text x="322" y="385" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" font-style="italic" fill="#263746">
    <tspan font-weight="700">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">osa</tspan> ≈ 0,168 m</text>
  <text x="384" y="302" font-family="Arial, Liberation Sans, sans-serif" font-size="10" text-anchor="end" fill="#263746" font-style="italic">mirna razina</text>
  <text x="160" y="396" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-style="italic" fill="#263746">voda</text>
  <text x="681" y="58" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">Paraboloidna slobodna površina</text>
  <text x="681" y="106" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">Razlika razina rub - osa</text>
  <text x="681" y="129" font-family="Arial, Liberation Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#263746">Δh = ω² R² / (2g)</text>
  <text x="681" y="150" font-family="Arial, Liberation Sans, sans-serif" font-size="12" text-anchor="middle" fill="#263746">= 6,0² · 0,35² / (2 · 9,81)</text>
  <text x="681" y="168" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">≈ 0,225 m = 22,5 cm</text>
  <text x="681" y="204" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">Visina uz stijenku (uzdizanje)</text>
  <text x="681" y="227" font-family="Arial, Liberation Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">rub</tspan> = h₀ + Δh/2</text>
  <text x="681" y="246" font-family="Arial, Liberation Sans, sans-serif" font-size="12" text-anchor="middle" fill="#263746" transform="translate(0 8)">= 0,28 + 0,11239</text>
  <text x="681" y="262" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 13)">≈ 0,392 m</text>
  <text x="681" y="294" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746" transform="translate(0 13)">Visina u osi (spuštanje)</text>
  <text x="681" y="317" font-family="Arial, Liberation Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 13)">
    <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">osa</tspan> = h₀ − Δh/2</text>
  <text x="681" y="336" font-family="Arial, Liberation Sans, sans-serif" font-size="12" text-anchor="middle" fill="#263746" transform="translate(0 13) translate(0 8)">= 0,28 − 0,11239</text>
  <text x="681" y="352" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 26)">≈ 0,168 m</text>
  <text x="681" y="378" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#263746" transform="translate(0 26)">Simetrija oko h₀: razina uz rub raste koliko u osi pada.</text>
  <text x="681" y="410" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 26)">REZULTATI</text>
  <text x="605" y="436" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 26)">Δh ≈ 22,5 cm</text>
  <text x="757" y="436" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 26)">
    <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">rub</tspan> ≈ 0,392 m</text>
  <text x="681" y="458" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 26)">
    <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">osa</tspan> ≈ 0,168 m</text>
  <text x="450" y="354" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-style="italic" fill="#263746">
    <tspan font-weight="700">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">0</tspan>
  </text>
  <text x="450.0" y="370.0" font-family="Arial, Liberation Sans, sans-serif" font-size="10" fill="#263746">= 0,28 m</text>
  <text x="260" y="468" font-family="Arial, Liberation Sans, sans-serif" font-size="12" text-anchor="middle" fill="#263746">
    <tspan font-style="italic" font-weight="700">2R</tspan> = 0,70 m</text>
  <text x="92" y="306.0" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" fill="#263746" text-anchor="middle" transform="rotate(-90 92 306.0)">Δh ≈ 22,5 cm</text>
  <text x="46" y="285.1284403669725" font-family="Arial, Liberation Sans, sans-serif" font-size="10" fill="#263746" text-anchor="end">Δh/2</text>
  <text x="46" y="326.8715596330275" font-family="Arial, Liberation Sans, sans-serif" font-size="10" fill="#263746" text-anchor="end">Δh/2</text>
</svg>
