      <text x="250" y="392" font-size="11" fill="#263746" text-anchor="middle">balastni tank, odzračen na palubu</text>
      <text x="250" y="374" font-size="11" fill="#263746" text-anchor="middle">morska voda, ρ = 1025 kg/m³</text>
      <text x="300" y="328" font-size="10" fill="#263746" text-anchor="middle">mirna razina h<tspan baseline-shift="sub" font-size="0.7em">0</tspan></text>
      <text x="384" y="350" font-size="10" fill="#263746" text-anchor="middle">θ</text>
      <text x="400" y="60" font-size="10" fill="#263746" text-anchor="middle">prividna sila na vodu u tanku</text>
      <text x="400" y="74" font-size="10" fill="#263746" text-anchor="middle">(okvir broda), od središta zavoja</text>
