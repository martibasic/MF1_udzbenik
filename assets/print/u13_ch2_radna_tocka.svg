  <!-- ===== RADNA TO&#268;KA 1 (Q=20, H=18) ===== -->
  <!-- projekcijske linije -->
  <line x1="386.7" y1="174.3" x2="386.7" y2="380" stroke="#3a4a56" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6" />
