  <text x="58" y="64" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">[m]</text>

  <text x="544" y="315" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#1565c0">Δz = 6 m</text>

  <text x="240" y="76" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1e8449"><tspan font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="0.75em">p</tspan>(Q) = 25 − 0,0175 Q²</text>
  <text x="386" y="280" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1565c0"><tspan font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="0.75em">s,0</tspan>(Q) = 6 + 0,0303 Q²</text>
  <text x="92" y="192" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#d35400"><tspan font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="0.75em">s,1</tspan>(Q) = 6 + 0,0464 Q²</text>
  <text x="92" y="208" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#a04300">(zatvoreniji ventil, ξ<tspan baseline-shift="sub" font-size="0.7em">vent</tspan> = 8)</text>
  <text x="465" y="196" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1a2530">Radna točka 1</text>
  <text x="465" y="213" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#1a2530">Q₁ ≈ 20,0 L/s   H₁ ≈ 18,0 m</text>

  <text x="172" y="134" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#8e44ad">Radna točka 2 (pomak)</text>
  <text x="172" y="152" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#8e44ad">Q₂ ≈ 17,24 L/s,  H₂ ≈ 19,80 m</text>
  <text x="447" y="338" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a2530">crpka <tspan font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="0.7em">p</tspan>(Q)</text>
