<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-labelledby="u13c2rt_title u13c2rt_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:920px;height:auto;">
  <title id="u13c2rt_title">Radna tocka crpke i sustava H(Q) dijagram</title>
  <desc id="u13c2rt_desc">Lijevo: H-Q dijagram s karakteristikom crpke Hp = 25 - 0,0175 Q^2 (zelena), karakteristikom sustava Hs = 6 + 0,0303 Q^2 (plava) i pomaknutom karakteristikom Hs,1 = 6 + 0,0464 Q^2 (narancasta isprekidana) nakon djelomicnog zatvaranja ventila. Radna tocka 1 pri Q = 20 L/s, H = 18 m; radna tocka 2 pri Q = 17,24 L/s, H = 19,80 m. Desno: panel s jednadzbama i sazetkom rezultata.</desc>

  <defs>
    <marker id="u13c2rt_arrG" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1e8449" />
    </marker>
    <marker id="u13c2rt_arrB" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1565c0" />
    </marker>
    <marker id="u13c2rt_arrO" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#d35400" />
    </marker>
    <marker id="u13c2rt_axR" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
