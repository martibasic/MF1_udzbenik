  <text x="447" y="370" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a2530">sustav <tspan font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="0.7em">s,1</tspan>(Q)</text>

  <text x="793" y="48" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Uvjet radne točke</text>

  <text x="793" y="80" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">presjecište krivulja</text>
  <text x="793" y="100" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="0.75em">p</tspan>(Q<tspan baseline-shift="sub" font-size="0.75em">op</tspan>) = <tspan font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="0.75em">s</tspan>(Q<tspan baseline-shift="sub" font-size="0.75em">op</tspan>)</text>
  <text x="793" y="134" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">stanje 1 (otvoren ventil)</text>
  <text x="793" y="153" font-family="'Segoe UI',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a2530">25 − 0,0175 Q² = 6 + 0,0303 Q²</text>
  <text x="793" y="171" font-family="'Segoe UI',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a2530">19 = 0,0478 Q²  →  Q² ≈ 397,5</text>
  <text x="793" y="190" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1e8449">Q<tspan baseline-shift="sub" font-size="0.75em">op,1</tspan> ≈ 19,94 L/s,  H<tspan baseline-shift="sub" font-size="0.75em">op,1</tspan> ≈ 18,0 m</text>
  <text x="793" y="223" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">stanje 2 (zatvoreniji ventil, ξ<tspan baseline-shift="sub" font-size="0.7em">vent</tspan> = 8)</text>
  <text x="793" y="242" font-family="'Segoe UI',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a2530">25 − 0,0175 Q² = 6 + 0,0464 Q²</text>
