<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" role="img" aria-labelledby="u11v1mnp_title u11v1mnp_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u11v1mnp_title">U11 Val 1 - mlaz na ploču</title>
  <desc id="u11v1mnp_desc">Minimalna tehnička skica slobodnog mlaza koji udara u vertikalnu ploču, s označenim masenim protokom, brzinom i reakcijskom silom na ploču.</desc>
  <rect width="940" height="300" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="252" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>

  <rect x="700" y="92" width="18" height="128" fill="#dfe7ec" stroke="#173043" stroke-width="3"/>
  <text x="690" y="238" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">ploča</text>

  <polygon points="138,156 278,130 278,182" fill="#6ec1e4" stroke="#1976d2" stroke-width="3"/>
  <line x1="278" y1="156" x2="700" y2="156" stroke="#1976d2" stroke-width="14" stroke-linecap="round"/>
  <line x1="342" y1="156" x2="430" y2="156" stroke="#0f766e" stroke-width="4" marker-end="url(#u11v1mnp_arrowGreen)"/>
  <text x="356" y="144" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">v = 20 m/s</text>

  <line x1="736" y1="156" x2="824" y2="156" stroke="#be123c" stroke-width="4" marker-end="url(#u11v1mnp_arrowRed)"/>
  <text x="742" y="144" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">FR = 200 N</text>

  <line x1="540" y1="116" x2="540" y2="198" stroke="#c96c35" stroke-width="3"/>
  <line x1="522" y1="116" x2="558" y2="116" stroke="#c96c35" stroke-width="3"/>
  <line x1="522" y1="198" x2="558" y2="198" stroke="#c96c35" stroke-width="3"/>
  <text x="566" y="162" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">kontrolni volumen</text>

  <text x="284" y="202" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">m_dot = 10 kg/s</text>
  <text x="88" y="254" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#516677">Iza udara mlaz se rasprši uz ploču, pa u osi mlaza izlazna komponenta brzine pada na nulu.</text>

  <defs>
    <marker id="u11v1mnp_arrowGreen" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#0f766e"/>
    </marker>
    <marker id="u11v1mnp_arrowRed" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#be123c"/>
    </marker>
  </defs>
</svg>