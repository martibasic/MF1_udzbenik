<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="u11v1_title u11v1_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:900px;height:auto;">
<title id="u11v1_title">Mirni mlaz na ravnu ploču</title><desc id="u11v1_desc">Slobodan mlaz udara u nepropusnu mirnu ploču i radijalno se razlijeva po prednjoj strani. Aksijalna izlazna brzina je nula. Crveno je sila fluida na ploču, zeleno su brzine. Debljina sloja uz ploču je shematska.</desc>
<defs>
<linearGradient id="u11v1_water" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#aed6f1"/><stop offset="100%" stop-color="#5b9ec9"/></linearGradient>
<linearGradient id="u11v1_oil" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#c8a000"/></linearGradient>
<linearGradient id="u11v1_hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1a2e42"/><stop offset="100%" stop-color="#1a3a52"/></linearGradient>
<pattern id="u11v1_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.8"/></pattern>
<marker id="u11v1_v" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#1e8449"/></marker>
<marker id="u11v1_dim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse"><path d="M0 0 L6 2.5 L0 5 Z" fill="#b7600c"/></marker>
<marker id="u11v1_dimSmall" markerWidth="3" markerHeight="3" refX="3" refY="1.5" orient="auto-start-reverse"><path d="M0 0 L3 1.5 L0 3 Z" fill="#b7600c"/></marker>
</defs>
<rect width="900" height="440" fill="white"/>
<g font-family="'Segoe UI',Arial,sans-serif" fill="#1a2530">
<!-- Zadržane neutralne boje i zaglavlja iz postojećih panela.
Jedna prostorna ispuna predstavlja isti fluid; nije mapa tlaka ili brzine.
Strelice imaju značenje iz oznake; izdvojeni vektori sila ne određuju hvatište. -->
<defs>
<marker id="u11v1_forceMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#c0392b"/></marker>
<marker id="u11v1_pressureMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#1565c0"/></marker>
<marker id="u11v1_reactionMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#1e8449"/></marker>
<marker id="u11v1_axisMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#3a4a56"/></marker>
</defs>
<text x="28" y="49" font-size="17" fill="#1a2530" text-anchor="start" font-weight="700">Mlaz na nepomičnu ploču</text>
<defs><linearGradient id="u11v1_jetfield" gradientUnits="userSpaceOnUse" x1="0" y1="108" x2="0" y2="331"><stop offset="0%" stop-color="#aed6f1"/><stop offset="100%" stop-color="#5b9ec9"/></linearGradient></defs>
<path id="u11v1_jetfluid" d="M44 203.5 H327 Q346 203.5 346 184.5 V108 H353 V331 H346 V257.5 Q346 238.5 327 238.5 H44 Z" fill="url(#u11v1_jetfield)" stroke="none" stroke-width="1.8" />
<line id="u11v1_jettop" x1="44" y1="203.5" x2="96" y2="203.5" stroke="#3a4a56" stroke-width="2"/>
<line id="u11v1_jetbottom" x1="44" y1="238.5" x2="96" y2="238.5" stroke="#3a4a56" stroke-width="2"/>
<rect id="u11v1_jetplate" x="353" y="116" width="12" height="207" rx="0" fill="url(#u11v1_hatch)" stroke="#3a4a56" stroke-width="1.2"/>
<path id="u11v1_inflow" d="M151 221 L266 221" fill="none" stroke="#1e8449" stroke-width="2.3" marker-end="url(#u11v1_v)"/>
<text x="208.5" y="212" font-size="12" fill="#1e8449" text-anchor="middle">v₁ = 20 m/s</text>
<path id="u11v1_outtop" d="M349.5 149 L349.5 90" fill="none" stroke="#1e8449" stroke-width="2.3" marker-end="url(#u11v1_v)"/>
<path id="u11v1_outbottom" d="M349.5 290 L349.5 350" fill="none" stroke="#1e8449" stroke-width="2.3" marker-end="url(#u11v1_v)"/>
<text x="58" y="174" font-size="15" fill="#1a2530" text-anchor="start">ṁ = 10 kg/s</text>
<text x="372" y="103" font-size="14" fill="#1e8449" text-anchor="start">v₂ₓ = 0</text>
<path id="u11v1_force" d="M370 236 L470 236" fill="none" stroke="#c0392b" stroke-width="2.3" marker-end="url(#u11v1_forceMarker)"/>
<text x="420.0" y="222" font-size="13" fill="#c0392b" text-anchor="middle">F = 200 N</text>
<text x="375" y="267" font-size="12" fill="#c0392b" text-anchor="start">fluid → ploča</text>
<text x="63" y="374" font-size="13" fill="#1565c0" text-anchor="start">pM = 0 na slobodnim granicama mlaza</text>
<path d="M438 382 L472 382" fill="none" stroke="#3a4a56" stroke-width="2.3" marker-end="url(#u11v1_axisMarker)"/>
<text x="480" y="386" font-size="13" fill="#3a4a56" text-anchor="middle">x</text>
<path d="M438 382 L438 348" fill="none" stroke="#3a4a56" stroke-width="2.3" marker-end="url(#u11v1_axisMarker)"/>
<text x="438" y="339" font-size="13" fill="#3a4a56" text-anchor="middle">y</text>
<rect x="533" y="28" width="337" height="34" rx="7" fill="white" stroke="none" stroke-width="1.2"/>
<text x="701.5" y="51" font-size="15" fill="#1565c0" text-anchor="middle" font-weight="700">Bilanca u smjeru x</text>
<rect x="533" y="77" width="337" height="58" rx="7" fill="white" stroke="#d4e3f0" stroke-width="1" stroke-opacity="0.65" />
<rect x="533" y="77" width="2" height="58" rx="1" fill="#1e8449" stroke="none" stroke-width="1.2"/>
<text x="548" y="98" font-size="13" fill="#1e8449" text-anchor="start" font-weight="700">Promjena toka količine gibanja</text>
<text x="548" y="122" font-size="13" fill="#1a2530" text-anchor="start">ṁ (v₂ₓ − v₁) = −200 N</text>
<rect x="533" y="147" width="337" height="58" rx="7" fill="white" stroke="#d4e3f0" stroke-width="1" stroke-opacity="0.65" />
<rect x="533" y="147" width="2" height="58" rx="1" fill="#1565c0" stroke="none" stroke-width="1.2"/>
<text x="548" y="168" font-size="13" fill="#1565c0" text-anchor="start" font-weight="700">Ploča djeluje na fluid</text>
<text x="548" y="192" font-size="13" fill="#1a2530" text-anchor="start">Fploča→fluid,x = −200 N</text>
<rect x="533" y="217" width="337" height="80" rx="7" fill="white" stroke="#d4e3f0" stroke-width="1" stroke-opacity="0.65" />
<rect x="533" y="217" width="2" height="80" rx="1" fill="#c0392b" stroke="none" stroke-width="1.2"/>
<text x="548" y="238" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Fluid djeluje na ploču</text>
<text x="548" y="262" font-size="13" fill="#1a2530" text-anchor="start">Ffluid→ploča,x = +200 N</text>
<text x="548" y="284" font-size="13" fill="#1a2530" text-anchor="start">Reakcija oslonca: Rₓ = −200 N</text>
</g>
</svg>
