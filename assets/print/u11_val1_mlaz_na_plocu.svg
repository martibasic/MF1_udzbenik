<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="u11v1mnp_title u11v1mnp_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:880px;height:auto;">
  <title id="u11v1mnp_title">Mlaz vode okomito udara u mirnu plocu</title>
  <desc id="u11v1mnp_desc">Lijevo: mlaz vode izlazi iz mlaznice brzinom v = 20 m/s i masenim protokom 10 kg/s te okomito udara u nepomicnu vertikalnu plocu. Nakon udara voda se rasprsava uz plocu (v iz x = 0). Strelica reakcije F R = 200 N na plocu. Desno: izvedba sile iz promjene kolicine gibanja u cetiri koraka, zakljucni REZULTATI badge.</desc>

  <defs>
    <linearGradient id="u11v1mnp_voda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aed6f1" />
      <stop offset="1" stop-color="#5b9ec9" />
    </linearGradient>
    <linearGradient id="u11v1mnp_jet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c5e2f3" />
      <stop offset="1" stop-color="#5b9ec9" />
    </linearGradient>
    <pattern id="u11v1mnp_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.1" />
    </pattern>
    <!-- Sila ulaz (crvena) -->
    <marker id="u11v1mnp_fr" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#c0392b" />
    </marker>
    <!-- Sila izlaz / reakcija (zelena) -->
    <marker id="u11v1mnp_fg" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1e8449" />
    </marker>
    <!-- Brzina (plava) -->
    <marker id="u11v1mnp_v" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1565c0" />
    </marker>
    <!-- Brzina rasprsenja (svjetlija plava) -->
    <marker id="u11v1mnp_vs" markerWidth="6" markerHeight="4" refX="5.5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#3d8bd4" />
    </marker>
    <!-- Kota -->
    <marker id="u11v1mnp_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u11v1mnp_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <!-- Koord. osi (sive) -->
    <marker id="u11v1mnp_ax" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#5d6d7e" />
    </marker>
  </defs>

  <!-- okviri panela -->
  <rect x="14" y="14" width="510" height="412" rx="14" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.4" />
  <rect x="538" y="14" width="348" height="412" rx="14" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.4" />

  <!-- =========================================================
       LIJEVI PANEL  - fizikalna scena
       ========================================================= -->
  <!-- Cijev (stijenka) -->
  <rect x="40" y="200" width="120" height="46" fill="#909fa8" stroke="#3a4a56" stroke-width="1.4" />
  <!-- Tamniji donji rub cijevi -->
  <rect x="40" y="237" width="120" height="9" fill="#5d6d7e" stroke="none" />
  <!-- Voda u cijevi -->
  <rect x="40" y="208" width="123" height="30" fill="url(#u11v1mnp_voda)" />

  <!-- Mlaznica (konvergentna) -->
  <polygon points="160,200 200,213 200,233 160,246" fill="#909fa8" stroke="#3a4a56" stroke-width="1.4" />
  <polygon points="160,208 200,217 200,229 160,238" fill="url(#u11v1mnp_voda)" />

  <!-- Slobodni mlaz (mlaz vode od mlaznice do ploce) -->
  <rect x="200" y="217" width="180" height="12" fill="url(#u11v1mnp_jet)" stroke="#1565c0" stroke-width="1.2" />

  <!-- Ploca -->
  <rect x="380" y="110" width="24" height="226" fill="url(#u11v1mnp_hatch)" stroke="#3a4a56" stroke-width="1.6" />
  <!-- Oslonac place (dolje) -->
  <polygon points="380,336 404,336 410,358 374,358" fill="#5d6d7e" stroke="#3a4a56" stroke-width="1.4" />
  <line x1="368" y1="358" x2="416" y2="358" stroke="#3a4a56" stroke-width="1.6" />
  <!-- Srafura tla -->
  <g stroke="#3a4a56" stroke-width="0.9">
    <line x1="368" y1="358" x2="362" y2="368" />
    <line x1="378" y1="358" x2="372" y2="368" />
    <line x1="388" y1="358" x2="382" y2="368" />
    <line x1="398" y1="358" x2="392" y2="368" />
    <line x1="408" y1="358" x2="402" y2="368" />
    <line x1="416" y1="358" x2="410" y2="368" />
  </g>

  <!-- Rasprseni fluid uz plocu (krivulje koje pratimo iz tocke udara) -->
  <!-- gore -->
  <path d="M 380 223 C 376 200 372 178 370 155" fill="none" stroke="#5b9ec9" stroke-width="6" stroke-linecap="round" opacity="0.85" />
  <path d="M 380 223 C 376 200 372 178 370 155" fill="none" stroke="#aed6f1" stroke-width="3" stroke-linecap="round" />
  <!-- dolje -->
  <path d="M 380 223 C 376 246 372 268 370 290" fill="none" stroke="#5b9ec9" stroke-width="6" stroke-linecap="round" opacity="0.85" />
  <path d="M 380 223 C 376 246 372 268 370 290" fill="none" stroke="#aed6f1" stroke-width="3" stroke-linecap="round" />

  <!-- Strelice brzine rasprsenja v2 (po ploci, plave) -->
  <line x1="372" y1="168" x2="366" y2="148" stroke="#3d8bd4" stroke-width="1.6" marker-end="url(#u11v1mnp_vs)" />
  <line x1="372" y1="278" x2="366" y2="298" stroke="#3d8bd4" stroke-width="1.6" marker-end="url(#u11v1mnp_vs)" />
  <!-- Kontrolni volumen (isprekidana kutija) -->
  <rect x="186" y="178" width="208" height="92" rx="6" fill="none" stroke="#7a8a96" stroke-width="1.4" stroke-dasharray="8,5" />
  <!-- Presjek 1 (ulaz u KV) -->
  <line x1="200" y1="178" x2="200" y2="270" stroke="#1a2530" stroke-width="1.4" stroke-dasharray="5,4" />
  <circle cx="200" cy="178" r="9" fill="#ffffff" stroke="#1a2530" stroke-width="1.2" />
  <!-- Presjek 2 (na ploci - oznacavamo da je v2x = 0) -->
  <line x1="378" y1="178" x2="378" y2="270" stroke="#1a2530" stroke-width="1.4" stroke-dasharray="5,4" />
  <circle cx="378" cy="178" r="9" fill="#ffffff" stroke="#1a2530" stroke-width="1.2" />
  <!-- Brzina v u mlazu (plava strelica) -->
  <line x1="220" y1="223" x2="350" y2="223" stroke="#1565c0" stroke-width="2.6" marker-end="url(#u11v1mnp_v)" />
  <!-- Maseni protok m_dot oznaka -->
  <!-- Oznaka mlaznica -->
  <!-- Oznaka ploce -->
  <line x1="392" y1="103" x2="392" y2="108" stroke="#1a2530" stroke-width="0.8" />

  <!-- v_x,izl = 0 oznaka -->
  <rect x="412" y="206" width="96" height="36" rx="6" fill="#eaf3fb" stroke="#1565c0" stroke-width="1.2" />
  <!-- Reakcija F_R na plocu (zelena, izlazna sila / korisni rezultat) -->
  <line x1="404" y1="320" x2="492" y2="320" stroke="#1e8449" stroke-width="3" marker-end="url(#u11v1mnp_fg)" />
  <!-- Koord osi (donji lijevi kut panela) -->
  <line x1="40" y1="392" x2="92" y2="392" stroke="#5d6d7e" stroke-width="1.6" marker-end="url(#u11v1mnp_ax)" />
  <line x1="40" y1="392" x2="40" y2="346" stroke="#5d6d7e" stroke-width="1.6" marker-end="url(#u11v1mnp_ax)" />
  <!-- Napomena na dnu panela -->
  <!-- =========================================================
       DESNI PANEL  - izvod jednadzbe (4 koraka)
       ========================================================= -->

  <!-- Header bar -->
  <rect x="554" y="30" width="316" height="34" rx="8" fill="#1565c0" />
  <!-- Korak 1 -->
  <rect x="554" y="78" width="316" height="68" rx="8" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="554" y="78" width="5" height="68" rx="2" fill="#1565c0" />
  <!-- Korak 2 -->
  <rect x="554" y="156" width="316" height="68" rx="8" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="554" y="156" width="5" height="68" rx="2" fill="#1565c0" />
  <!-- Korak 3 -->
  <rect x="554" y="234" width="316" height="68" rx="8" fill="#fdf3f1" stroke="#e6c2bb" stroke-width="1.2" />
  <rect x="554" y="234" width="5" height="68" rx="2" fill="#c0392b" />
  <!-- Korak 4 -->
  <rect x="554" y="312" width="316" height="68" rx="8" fill="#f1f9f3" stroke="#cce7d4" stroke-width="1.2" />
  <rect x="554" y="312" width="5" height="68" rx="2" fill="#1e8449" />
  <!-- REZULTATI badge -->
  <rect x="554" y="390" width="316" height="30" rx="7" fill="#e8f5e9" stroke="#1e8449" stroke-width="1.4" />
  <text x="36" y="44" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Mlaz na mirnu plocu</text>

  <text x="346" y="144" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-style="italic" fill="#1565c0">v<tspan baseline-shift="sub" font-size="0.7em">y</tspan></text>
  <text x="346" y="306" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-style="italic" fill="#1565c0">v<tspan baseline-shift="sub" font-size="0.7em">y</tspan></text>

  <text x="290" y="172" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#5a6a78">kontrolni volumen (KV)</text>

  <text x="200" y="182" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1a2530">1</text>

  <text x="378" y="182" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1a2530">2</text>

  <text x="285" y="212" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="#1565c0"><tspan font-weight="700">v</tspan> = 20 m/s</text>

  <text x="100" y="278" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#1a2530">ṁ = 10 kg/s</text>

  <text x="172" y="195" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#5a6a78">mlaznica</text>
  <text x="100" y="195" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#5a6a78">cjevovod</text>

  <text x="392" y="100" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1a2530">ploca</text>
  <text x="460" y="221" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#5a6a78">nakon udara</text>
  <text x="460" y="237" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" font-weight="700" text-anchor="middle" fill="#1565c0">v<tspan baseline-shift="sub" font-size="0.7em">x,izl</tspan> = 0</text>

  <text x="446" y="312" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="#1e8449"><tspan font-weight="700">F</tspan><tspan baseline-shift="sub" font-size="0.7em" font-weight="700">R</tspan> = 200 N</text>


  <text x="98" y="396" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#5d6d7e">x</text>
  <text x="44" y="342" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#5d6d7e">y</text>

  <text x="270" y="412" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" text-anchor="middle" fill="#5a6a78">Tlak svuda ≈ atmosferski, p ≈ p₀; jedina os-x sila je promjena kolicine gibanja.</text>

  <text x="712" y="52" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#ffffff">Bilanca kolicine gibanja u osi x</text>

  <text x="712" y="98" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">1. Stacionarna bilanca</text>
  <text x="712" y="120" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a2530">∑F<tspan baseline-shift="sub" font-size="0.7em">x</tspan> = ṁ (v<tspan baseline-shift="sub" font-size="0.7em">x,izl</tspan> − v<tspan baseline-shift="sub" font-size="0.7em">x,ul</tspan>)</text>
  <text x="712" y="138" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">Newton II za otvoreni kontrolni volumen</text>

  <text x="712" y="176" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">2. Komponente brzine u osi x</text>
  <text x="712" y="200" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530">v<tspan baseline-shift="sub" font-size="0.7em">x,ul</tspan> = 20 m/s    v<tspan baseline-shift="sub" font-size="0.7em">x,izl</tspan> = 0</text>
  <text x="712" y="217" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">mlaz se na ploci rasprsi uz povrsinu</text>

  <text x="712" y="254" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">3. Sila ploce na fluid</text>
  <text x="712" y="276" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530">F<tspan baseline-shift="sub" font-size="0.7em">pl→f</tspan> = 10 · (0 − 20)</text>
  <text x="712" y="294" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b">= −200 N  (suprotno mlazu)</text>

  <text x="712" y="332" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">4. Sila fluida na plocu (Newton III)</text>
  <text x="712" y="354" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530">F<tspan baseline-shift="sub" font-size="0.7em">R</tspan> = −F<tspan baseline-shift="sub" font-size="0.7em">pl→f</tspan> = +200 N</text>
  <text x="712" y="372" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">u smjeru dolaznog mlaza</text>

  <text x="600" y="409" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#5a6a78">REZULTAT</text>
  <text x="760" y="410" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1e8449">F<tspan baseline-shift="sub" font-size="0.7em">R</tspan> = 200 N</text>
</svg>