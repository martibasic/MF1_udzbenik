<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" width="940" role="img" aria-labelledby="u11v1-title" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <defs>
    <linearGradient id="u11v1-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4eef8"/>
      <stop offset="100%" stop-color="#7ec8e8"/>
    </linearGradient>
    <pattern id="u11v1-hatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#8090a0"/>
      <line x1="0" y1="8" x2="8" y2="0" stroke="#546e7a" stroke-width="1.8"/>
    </pattern>
    <marker id="u11v1-ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0f766e"/>
    </marker>
    <marker id="u11v1-ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#b42318"/>
    </marker>
    <marker id="u11v1-agr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#546e7a"/>
    </marker>
    <marker id="u11v1-ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1d6b8a"/>
    </marker>
  </defs>
  <rect width="940" height="390" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="342" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>
  <text id="u11v1-title" x="54" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#173043">U11 – Mlaz vode na mirnu ravnu plocu</text>
  <text x="54" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#516677">v&#x2081; = 20 m/s, m&#x2D9; = 10 kg/s  &#x21D2;  F&#x209C; = m&#x2D9;&#xB7;v&#x2081; = 200 N (sila fluida na plocu u smjeru mlaza)</text>
  <!-- Pipe wall -->
  <rect x="54" y="185" width="150" height="42" rx="3" fill="#c8d6df" stroke="#2d3a40" stroke-width="2"/>
  <!-- Fluid in pipe -->
  <rect x="57" y="189" width="144" height="34" fill="url(#u11v1-water)" stroke="none"/>
  <!-- Nozzle taper (wall) -->
  <polygon points="204,185 238,193 238,219 204,227" fill="#c8d6df" stroke="#2d3a40" stroke-width="2"/>
  <!-- Fluid in nozzle -->
  <polygon points="207,190 235,195 235,217 207,222" fill="url(#u11v1-water)" stroke="none"/>
  <!-- Free jet (horizontal water body) -->
  <rect x="238" y="196" width="318" height="20" rx="2" fill="url(#u11v1-water)" stroke="#1976a8" stroke-width="1.5"/>
  <!-- Plate (srafura + border) -->
  <rect x="556" y="112" width="34" height="188" fill="url(#u11v1-hatch)"/>
  <rect x="556" y="112" width="34" height="188" fill="none" stroke="#2d3a40" stroke-width="2.5"/>
  <!-- Post-impact spray upward -->
  <path d="M567,196 C 560,175 545,150 530,125" fill="none" stroke="#1976a8" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#u11v1-ab)"/>
  <!-- Post-impact spray downward -->
  <path d="M567,216 C 560,237 545,262 530,287" fill="none" stroke="#1976a8" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#u11v1-ab)"/>
  <!-- Labels for spray -->
  <text x="490" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1976a8">v&#x2082; (gore)</text>
  <text x="490" y="294" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1976a8">v&#x2082; (dolje)</text>
  <!-- Control volume dashed box -->
  <rect x="192" y="168" width="376" height="76" rx="8" fill="none" stroke="#8090a0" stroke-width="1.8" stroke-dasharray="10 5"/>
  <text x="220" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8090a0">kontrolni volumen (KV)</text>
  <!-- Section presjek 1 (inlet to KV) -->
  <line x1="200" y1="162" x2="200" y2="250" stroke="#173043" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="204" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#173043">1</text>
  <!-- v1 velocity arrow -->
  <line x1="295" y1="206" x2="450" y2="206" stroke="#0f766e" stroke-width="3.5" marker-end="url(#u11v1-ag)"/>
  <text x="338" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f766e">v&#x2081; = 20 m/s</text>
  <!-- mdot label below jet -->
  <text x="310" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#173043">m&#x2D9; = 10 kg/s</text>
  <!-- Plate label -->
  <text x="596" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#173043">ploča</text>
  <!-- Force F_R on plate (fluid -> plate, red, pointing right) -->
  <line x1="596" y1="270" x2="740" y2="270" stroke="#b42318" stroke-width="3.5" marker-end="url(#u11v1-ar)"/>
  <text x="638" y="263" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#b42318">F&#x209C; = 200 N</text>
  <!-- v2x=0 annotation -->
  <text x="596" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#516677">iza ploče:</text>
  <text x="596" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#516677">v&#x2082;&#x2093; = 0</text>
  <!-- Formula box -->
  <rect x="648" y="95" width="268" height="72" rx="10" fill="#fffef6" stroke="#c49a0a" stroke-width="1.8"/>
  <text x="664" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#173043">&#x2211;F&#x2093; = m&#x2D9;(v&#x2082;&#x2093; &#x2212; v&#x2081;&#x2093;)</text>
  <text x="664" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#173043">= 10&#xB7;(0 &#x2212; 20) = &#x2212;200 N</text>
  <text x="664" y="157" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#b42318">F&#x209C; = 200 N (&#x2192;)</text>
  <!-- Coord axes -->
  <line x1="66" y1="330" x2="124" y2="330" stroke="#546e7a" stroke-width="2" marker-end="url(#u11v1-agr)"/>
  <text x="128" y="334" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#546e7a">x</text>
  <line x1="66" y1="330" x2="66" y2="272" stroke="#546e7a" stroke-width="2" marker-end="url(#u11v1-agr)"/>
  <text x="72" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#546e7a">y</text>
</svg>