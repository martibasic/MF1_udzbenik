<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="u02fkvz_title u02fkvz_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:860px;height:auto;">
  <title id="u02fkvz_title">Kapilarni uspon vlage kroz opečni zid</title>
  <desc id="u02fkvz_desc">Lijevo: presjek opečnog zida iznad vlažnog tla, vidljiva zona kapilarne vlage do visine h približno 18,8 cm uz strelice uspona i inset s jednom porom (kontaktni kut theta = 40 stupnjeva, površinska napetost sigma). Desno: izvod ravnoteže sila, formula h = 4 sigma cos theta kroz ro g d, te usporedba d = 0,12 mm (h približno 18,8 cm) i d = 0,06 mm (h približno 37,6 cm).</desc>

  <defs>
    <linearGradient id="u02fkvz_voda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aed6f1" />
      <stop offset="1" stop-color="#5b9ec9" />
    </linearGradient>
    <linearGradient id="u02fkvz_vlaga" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aed6f1" stop-opacity="0.0" />
      <stop offset="0.55" stop-color="#7ab6d6" stop-opacity="0.55" />
      <stop offset="1" stop-color="#5b9ec9" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="u02fkvz_tlo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c6a3f" />
      <stop offset="1" stop-color="#5b3f1f" />
    </linearGradient>
    <pattern id="u02fkvz_brick" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#c46a4a" />
      <rect x="0" y="0" width="46" height="11" rx="1.2" fill="#b85c3c" stroke="#7a3618" stroke-width="0.8" />
      <rect x="0" y="13" width="22" height="11" rx="1.2" fill="#b85c3c" stroke="#7a3618" stroke-width="0.8" />
      <rect x="24" y="13" width="22" height="11" rx="1.2" fill="#b85c3c" stroke="#7a3618" stroke-width="0.8" />
    </pattern>
    <pattern id="u02fkvz_soilh" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#3e2812" stroke-width="1.1" />
    </pattern>
    <pattern id="u02fkvz_glassh" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#e9eef2" />
      <line x1="0" y1="0" x2="0" y2="6" stroke="#94a3ad" stroke-width="0.9" />
    </pattern>

    <marker id="u02fkvz_up" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1565c0" />
    </marker>
    <marker id="u02fkvz_sig" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1565c0" />
    </marker>
    <marker id="u02fkvz_G" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#c0392b" />
    </marker>
    <marker id="u02fkvz_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u02fkvz_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
  </defs>

  <!-- pozadina i okviri panela -->
  <rect x="14" y="14" width="872" height="492" rx="14" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.4" />
  <line x1="430" y1="34" x2="430" y2="486" stroke="#dce7f0" stroke-width="1.2" stroke-dasharray="4,5" />

  <!-- =========================================================
       LIJEVI PANEL: presjek opecnog zida + zona vlage
       ========================================================= -->
  <!-- geometrijska skala u lijevom panelu:
       razina tla y = 400 (referenca za h)
       1 cm = 10 px      h = 18,8 cm -> 188 px (gornji rub vlage y = 212)
       zid: x = 120..280 (sirina 160 px = 16 cm), y = 92..400 (visina 308 px = 30,8 cm)
       tlo: y = 400..456 -->

  <!-- atmosfera (suptilan svijetli pozadina iza zida) -->
  <rect x="40" y="92" width="360" height="308" fill="#f5f8fb" />

  <!-- zid: opeka pattern -->
  <rect x="120" y="92" width="160" height="308" fill="url(#u02fkvz_brick)" stroke="#5a1808" stroke-width="1.6" />

  <!-- zona vlage (gradient od jasne dolje do prozirno gore), preko zida -->
  <rect x="120" y="212" width="160" height="188" fill="url(#u02fkvz_vlaga)" />

  <!-- granica vlage (gornji rub kapilarne zone) -->
  <line x1="100" y1="212" x2="356" y2="212" stroke="#1565c0" stroke-width="1.6" stroke-dasharray="7,4" />
  <!-- bijela podloga za label da se vidi preko opeke -->
  <rect x="121" y="194" width="158" height="15" rx="2" fill="#ffffff" opacity="0.85" />
  <!-- 4 strelice kapilarnog uspona (od dna zida prema gornjoj granici vlage) -->
  <line x1="148" y1="395" x2="148" y2="222" stroke="#1565c0" stroke-width="2.0" marker-end="url(#u02fkvz_up)" />
  <line x1="188" y1="395" x2="188" y2="222" stroke="#1565c0" stroke-width="2.0" marker-end="url(#u02fkvz_up)" />
  <line x1="220" y1="395" x2="220" y2="222" stroke="#1565c0" stroke-width="2.0" marker-end="url(#u02fkvz_up)" />
  <line x1="252" y1="395" x2="252" y2="222" stroke="#1565c0" stroke-width="2.0" marker-end="url(#u02fkvz_up)" />

  <!-- tlo (hatched, zasiceno vodom) -->
  <rect x="40" y="400" width="360" height="56" fill="url(#u02fkvz_tlo)" />
  <rect x="40" y="400" width="360" height="56" fill="url(#u02fkvz_soilh)" opacity="0.45" />
  <line x1="40" y1="400" x2="400" y2="400" stroke="#3e2812" stroke-width="1.4" />
  <!-- referenca: razina tla je linija povrsine tla y=400; oznaka iznad soil-a, lijevo od zida -->
  <line x1="116" y1="400" x2="120" y2="400" stroke="#5a6a78" stroke-width="0.7" />

  <!-- KOTA h (visina kapilarnog uspona) desno od zida -->
  <!-- OZNAKA opeke (leader iz zida prema lijevo) -->
  <line x1="120" y1="150" x2="85" y2="135" stroke="#5a6a78" stroke-width="0.7" />
  <circle cx="120" cy="150" r="1.6" fill="#5a6a78" />
  <!-- =========================================================
       DESNI PANEL: presjek pore (top) + formula + usporedba
       ========================================================= -->
  <!-- ==== detalj pore (gornji dio desnog panela) ==== -->
  <!-- centar pore: x = 552, vrh y = 84, dno y = 196
       unutrasnji promjer d = 38 px (predstavlja d_por simbolicki) -->
  <!-- stjenke pore (krute, hatched) -->
  <rect x="510" y="84" width="23" height="112" fill="url(#u02fkvz_glassh)" stroke="#4a5a66" stroke-width="1.1" />
  <rect x="571" y="84" width="23" height="112" fill="url(#u02fkvz_glassh)" stroke="#4a5a66" stroke-width="1.1" />

  <!-- voda u pori (do meniskusa) -->
  <rect x="533" y="120" width="38" height="76" fill="url(#u02fkvz_voda)" />
  <!-- meniskus konkavan (theta = 40 stupnjeva, blago udubljen) -->
  <path d="M533,124 Q552,108 571,124 L571,120 L533,120 Z" fill="url(#u02fkvz_voda)" />
  <path d="M533,124 Q552,108 571,124" fill="none" stroke="#0d47a1" stroke-width="1.6" />

  <!-- povrsinska napetost sigma (uz stijenke, plave strelice prema gore) -->
  <line x1="536" y1="124" x2="536" y2="100" stroke="#1565c0" stroke-width="2" marker-end="url(#u02fkvz_sig)" />
  <line x1="568" y1="124" x2="568" y2="100" stroke="#1565c0" stroke-width="2" marker-end="url(#u02fkvz_sig)" />
  <line x1="500" y1="110" x2="534" y2="115" stroke="#1565c0" stroke-width="0.7" />
  <line x1="604" y1="110" x2="570" y2="115" stroke="#1565c0" stroke-width="0.7" />

  <!-- kontaktni kut theta na lijevoj stijenci -->
  <!-- tezina stupca G (crvena, prema dolje, marker na donjem kraju) -->
  <line x1="552" y1="148" x2="552" y2="186" stroke="#c0392b" stroke-width="2.4" marker-end="url(#u02fkvz_G)" />
  <!-- kota d_por na vrhu pore -->
  <!-- nadnaslov detalja -->
  <!-- separator -->
  <line x1="452" y1="216" x2="876" y2="216" stroke="#e2e8ee" stroke-width="1" />

  <!-- ==== formula panel (donji dio desnog panela) ==== -->
  <rect x="452" y="230" width="424" height="170" rx="10" fill="#f4f9fd" stroke="#1565c0" stroke-width="1.4" />
  <rect x="452" y="230" width="424" height="28" rx="10" fill="#1565c0" />
  <rect x="452" y="244" width="424" height="14" fill="#1565c0" />
  <!-- blok 1: formula primjena -->
  <line x1="478" y1="338" x2="852" y2="338" stroke="#c8d6e4" stroke-width="1" />

  <!-- blok 2: rezultat za d = 0,12 mm -->
  <!-- ==== usporedba d/2 -> 2h ==== -->
  <!-- ==== napomena na dnu lijevog panela ==== -->
  <line x1="280" y1="212" x2="356" y2="212" stroke="#b7600c" stroke-width="0.7" />
  <line x1="280" y1="400" x2="356" y2="400" stroke="#b7600c" stroke-width="0.7" />
  <line x1="350" y1="215" x2="350" y2="397" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u02fkvz_dimL)" marker-end="url(#u02fkvz_dim)" />
  <path d="M533,124 A11,11 0 0 1 542,134" fill="none" stroke="#b7600c" stroke-width="1.2" />
  <line x1="510" y1="142" x2="532" y2="132" stroke="#b7600c" stroke-width="0.7" />

  <line x1="533" y1="84" x2="533" y2="64" stroke="#b7600c" stroke-width="0.7" />
  <line x1="571" y1="84" x2="571" y2="64" stroke="#b7600c" stroke-width="0.7" />
  <line x1="536" y1="72" x2="568" y2="72" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u02fkvz_dimL)" marker-end="url(#u02fkvz_dim)" />
  <rect x="452" y="412" width="424" height="64" rx="10" fill="#fff7e6" stroke="#b7600c" stroke-width="1.4" />
  <text x="40" y="56" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#1a2530">Opečni zid iznad vlažnog tla</text>
  <text x="40" y="73" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">presjek – vlaga se kapilarno diže kroz mrežu sitnih pora</text>

  <text x="200" y="206" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1565c0" text-anchor="middle" font-style="italic">gornji rub kapilarne vlage</text>

  <text x="70" y="438" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#f4e2c2">tlo (zasićeno vodom)</text>

  <text x="115" y="394" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a6a78" text-anchor="end" font-style="italic">razina tla (z = 0)</text>
  <text x="80" y="120" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="end" fill="#5a1808">opečni zid</text>
  <text x="80" y="134" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" text-anchor="end" fill="#5a6a78">(pore <tspan font-style="italic">d</tspan><tspan baseline-shift="sub" font-size="0.75em">por</tspan>)</text>

  <text x="452" y="56" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#1a2530">Izvod i utjecaj veličine pore</text>

  <text x="496" y="106" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" fill="#1565c0" text-anchor="middle">σ</text>
  <text x="608" y="106" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" fill="#1565c0">σ</text>
  <text x="544" y="172" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" font-weight="700" fill="#c0392b" text-anchor="end">G</text>

  <text x="688" y="84" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#0d47a1">Ravnoteža u pori</text>
  <text x="688" y="102" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a2530">Sila površine (gore):</text>
  <text x="688" y="118" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1565c0">F<tspan baseline-shift="sub" font-size="0.7em">σ</tspan> = π d σ cosθ</text>
  <text x="688" y="138" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a2530">Težina stupca (dolje):</text>
  <text x="688" y="154" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#c0392b">G = ρ g (πd²/4) h</text>
  <text x="688" y="174" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a2530">Iz F<tspan baseline-shift="sub" font-size="0.7em">σ</tspan> = G slijedi:</text>
  <text x="688" y="192" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1a2530">h = 4σ cosθ / (ρ g d)</text>

  <text x="664" y="249" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">Maksimalna visina kapilarnog uspona</text>

  <text x="664" y="280" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78" text-anchor="middle">cos 40° = 0,766</text>
  <text x="664" y="302" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1a2530" text-anchor="middle">h = (4 · 0,072 · 0,766) / (998 · 9,81 · 0,12 · 10⁻³)</text>
  <text x="664" y="322" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1a2530" text-anchor="middle">= 0,2207 / 1,175</text>

  <text x="664" y="362" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78" text-anchor="middle">za d<tspan baseline-shift="sub" font-size="0.75em">por</tspan> = 0,12 mm</text>
  <text x="664" y="386" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1565c0">h ≈ 0,188 m ≈ 18,8 cm</text>

  <text x="664" y="432" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#8b5e00">Utjecaj veličine pora − h ∝ 1/d</text>
  <text x="500" y="458" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530"><tspan font-style="italic">d</tspan> = 0,12 mm → <tspan font-weight="700" fill="#1565c0">h ≈ 18,8 cm</tspan></text>
  <text x="828" y="458" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="end" fill="#1a2530"><tspan font-style="italic">d</tspan> = 0,06 mm → <tspan font-weight="700" fill="#c0392b">h ≈ 37,6 cm</tspan></text>
  <text x="664" y="470" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" text-anchor="middle" fill="#5a6a78">prepolovljen promjer pore → uspon se udvostručuje</text>

  <text x="40" y="479" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a2530">Hidroizolacijska barijera u zidu prekida kapilarni kontakt</text>
  <text x="40" y="494" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" fill="#5a6a78">i zaustavlja uspon vlage iznad razine tla.</text>

<text x="360" y="304" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" font-style="italic" fill="#b7600c">h</text>
  <text x="374.0" y="304.0" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#b7600c">≈ 18,8 cm</text>

  <text x="498" y="146" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#b7600c">θ = 40°</text>
  <text x="552" y="60" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">d</tspan><tspan baseline-shift="sub" font-size="0.75em">por</tspan> = 0,12 mm</text>

  </svg>