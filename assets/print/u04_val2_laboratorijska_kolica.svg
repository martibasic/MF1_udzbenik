<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="u04v2lk_title u04v2lk_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:900px;height:auto;">
  <title id="u04v2lk_title">Otvoreni spremnik na laboratorijskim kolicima pri vodoravnom ubrzanju</title>
  <desc id="u04v2lk_desc">Pravokutni otvoreni spremnik duljine L = 1,60 m i pocetne mirne visine h_0 = 0,42 m na laboratorijskim kolicima koja se gibaju udesno stalnim ubrzanjem a = 1,35 m/s^2. Slobodna povrsina nagnuta je za theta priblizno 7,9 stupnjeva; razlika razina Delta h = 0,220 m, visina uz straznju stijenku 0,530 m, uz prednju 0,310 m. Desno: panel s formulama i rezultatima.</desc>

  <defs>
    <!-- Voda gradient (vertikalan) -->
    <linearGradient id="u04v2lk_water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aed6f1" />
      <stop offset="100%" stop-color="#5b9ec9" />
    </linearGradient>
    <!-- Hatch 7x7 za stjenke spremnika i kolica -->
    <pattern id="u04v2lk_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.6" />
    </pattern>
    <!-- Markeri za sile/ubrzanje (crveni = input) -->
    <marker id="u04v2lk_aR" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#c0392b" />
    </marker>
    <!-- Marker za g (crni/dark) -->
    <marker id="u04v2lk_aK" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#3a4a56" />
    </marker>
    <!-- Marker za g_eff (ljubicasta) -->
    <marker id="u04v2lk_aP" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#8e44ad" />
    </marker>
    <!-- Markeri za kote (smedji) -->
    <marker id="u04v2lk_dim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L6,2.5 z" fill="#b7600c" />
    </marker>
    <marker id="u04v2lk_dimL" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse">
      <path d="M0,0 L0,5 L6,2.5 z" fill="#b7600c" />
    </marker>
  </defs>

  <!-- Pozadina + okviri panela -->
  <rect width="920" height="470" fill="#ffffff" />
  <rect x="14" y="18" width="556" height="434" rx="12" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.4" />
  <rect x="582" y="18" width="324" height="434" rx="12" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.4" />

  <!-- ============================================================
       LIJEVI PANEL: SPREMNIK NA KOLICIMA (translacija udesno)
       Koordinatni sustav (lijevi panel):
         Spremnik interior:  x = 130..490  (sirina 360 px = L = 1,60 m)  -> 1 m = 225 px
         Dno spremnika:      y = 320
         Mirna razina h_0:   y = 245   (h_0 = 0,42 m -> 75 px po 225 px/m ?
                                       Stvarno: za citljivost koristim h_0 = 95 px)
         Skala: 1 m = 95/0,42 -> ~226 px/m vertikalno; isto kao 360/1,60 = 225 px/m
         Straznja stijenka (lijevo): razina = h_strag = 0,530 m -> y_back = 320 - 95 - 25 = 200
                                     Delta h/2 = 25 px (gore)
         Prednja stijenka (desno):   razina = h_pred = 0,310 m -> y_front = 320 - 95 + 25 = 250
       Provjera nagiba prikaza: (250 - 200)/360 = 50/360 = 0,139 ~= tan(7,9 stupnjeva) = 0,138  ✓
  ============================================================ -->

  <!-- Naslov panela (lijevi) -->
  <!-- ===== KOLICA (vozilo) ===== -->
  <!-- Platforma (siva ploca ispod spremnika) -->
  <rect x="100" y="328" width="420" height="14" rx="2" fill="#c2cad2" stroke="#7a8a96" stroke-width="1.2" />
  <!-- Sasija kolica (uska tamnija traka ispod platforme) -->
  <rect x="118" y="342" width="384" height="10" fill="#5d6d7e" />
  <!-- Kotaci kolica (vrh na razini sasije y=352, na PLATFORMI vozila, ne pod platformom spremnika) -->
  <g stroke="#1a2530" stroke-width="1.5" fill="#3a4a56">
    <circle cx="170" cy="372" r="20" />
    <circle cx="280" cy="372" r="20" />
    <circle cx="380" cy="372" r="20" />
    <circle cx="470" cy="372" r="20" />
  </g>
  <!-- Glavcine (svjetli krug) -->
  <g fill="#aab4bc">
    <circle cx="170" cy="372" r="6" />
    <circle cx="280" cy="372" r="6" />
    <circle cx="380" cy="372" r="6" />
    <circle cx="470" cy="372" r="6" />
  </g>
  <!-- Tlo (referentna podloga) -->
  <line x1="40" y1="397" x2="540" y2="397" stroke="#3a4a56" stroke-width="1.6" />
  <g stroke="#7a8a96" stroke-width="0.9">
    <line x1="50" y1="397" x2="44" y2="406" />
    <line x1="80" y1="397" x2="74" y2="406" />
    <line x1="110" y1="397" x2="104" y2="406" />
    <line x1="140" y1="397" x2="134" y2="406" />
    <line x1="170" y1="397" x2="164" y2="406" />
    <line x1="200" y1="397" x2="194" y2="406" />
    <line x1="230" y1="397" x2="224" y2="406" />
    <line x1="260" y1="397" x2="254" y2="406" />
    <line x1="290" y1="397" x2="284" y2="406" />
    <line x1="320" y1="397" x2="314" y2="406" />
    <line x1="350" y1="397" x2="344" y2="406" />
    <line x1="380" y1="397" x2="374" y2="406" />
    <line x1="410" y1="397" x2="404" y2="406" />
    <line x1="440" y1="397" x2="434" y2="406" />
    <line x1="470" y1="397" x2="464" y2="406" />
    <line x1="500" y1="397" x2="494" y2="406" />
    <line x1="530" y1="397" x2="524" y2="406" />
  </g>

  <!-- ===== SPREMNIK (otvoreni) - stjenke pune visine ===== -->
  <!-- Vanjski rub stjenki: spremnik interior x=130..490, top open y=160, dno y=320 -->
  <!-- Lijeva (straznja) stijenka -->
  <rect x="118" y="160" width="12" height="168" fill="url(#u04v2lk_hatch)" stroke="#3a4a56" stroke-width="1.4" />
  <!-- Desna (prednja) stijenka -->
  <rect x="490" y="160" width="12" height="168" fill="url(#u04v2lk_hatch)" stroke="#3a4a56" stroke-width="1.4" />
  <!-- Dno (na vrhu platforme) -->
  <rect x="118" y="320" width="384" height="8" fill="url(#u04v2lk_hatch)" stroke="#3a4a56" stroke-width="1.4" />
  <!-- Unutarnje rub stjenke (jasno crta interior boundary) -->
  <line x1="130" y1="160" x2="130" y2="320" stroke="#3a4a56" stroke-width="1.6" />
  <line x1="490" y1="160" x2="490" y2="320" stroke="#3a4a56" stroke-width="1.6" />

  <!-- ===== VODA (nakosena slobodna povrsina) =====
       Poligon: gore-lijevo (130, 200), gore-desno (490, 250), dno desno (490, 320), dno lijevo (130, 320)
  -->
  <polygon points="130,200 490,250 490,320 130,320" fill="url(#u04v2lk_water)" />
  <!-- Slobodna povrsina (deblja plava linija) -->
  <line x1="130" y1="200" x2="490" y2="250" stroke="#1565c0" stroke-width="2.4" />

  <!-- Mirna razina h_0 (referenca, isprekidana siva) -->
  <line x1="130" y1="225" x2="490" y2="225" stroke="#7a8a96" stroke-width="1.2" stroke-dasharray="9,6" />
  <!-- ===== UBRZANJE a (smjer udesno) - crvena strelica iznad spremnika ===== -->
  <line x1="240" y1="100" x2="380" y2="100" stroke="#c0392b" stroke-width="3" marker-end="url(#u04v2lk_aR)" />
  <!-- Kut nagiba theta i theta-luk uz straznji ugao slobodne povrsine -->
  <!-- Kratka horizontala iz tocke (130,200) udesno -->
  <line x1="130" y1="200" x2="230" y2="200" stroke="#7a8a96" stroke-width="0.9" stroke-dasharray="4,3" />
  <!-- Luk od horizontale do nakosene povrsine, polumjer 60 -->
  <!-- tan theta = 50/360 ~= 0,1389, theta ~= 7,9 deg. End point at angle theta down from (130,200) along radius 60:
       x = 130 + 60*cos(7,9) = 130 + 59,43 = 189,43; y = 200 + 60*sin(7,9) = 200 + 8,25 = 208,25 -->
  <path d="M190,200 A60,60 0 0,1 189.43,208.25" fill="none" stroke="#8e44ad" stroke-width="1.6" />
  <!-- ===== INSET: g_eff vektorski dijagram (gornji desni ugao lijevog panela) ===== -->
  <rect x="430" y="40" width="124" height="98" rx="8" fill="#f5f1fa" stroke="#8e44ad" stroke-width="1.2" />
  <!-- Origin tocka -->
  <circle cx="460" cy="74" r="2.3" fill="#1a2530" />
  <!-- g vektor: dolje (od origin (460,74) do (460,116)) -->
  <line x1="460" y1="76" x2="460" y2="116" stroke="#3a4a56" stroke-width="2" marker-end="url(#u04v2lk_aK)" />
  <!-- -a vektor (inercija, suprotno od a, dakle ulijevo): od (460,74) ka (440,74). Crvena uz prekrizenu liniju? Koristim crvenu jer je to dio sustava sila. -->
  <line x1="460" y1="74" x2="476" y2="74" stroke="#c0392b" stroke-width="2" marker-end="url(#u04v2lk_aR)" />
  <!-- g_eff rezultanta: od (460,74) dijagonalno; proporcionalno: a=16, g=42, dakle (476, 116) -->
  <line x1="460" y1="74" x2="476" y2="116" stroke="#8e44ad" stroke-width="2.2" marker-end="url(#u04v2lk_aP)" />
  <!-- ===== KOTE ===== -->

  <!-- Kota h_strag (lijevo od spremnika) -->
  <!-- Pomocne linije -->
  <!-- Tik-crte -->
  <!-- Dimenzijska linija -->
  <!-- Tekst (rotiran) -->
  <!-- Kota h_pred (desno od spremnika, izvan + iza Delta h kote) -->
  <!-- Kota Delta h (na desnoj strani, izmedju y=200 i y=250) -->
  <!-- Pomocne linije od ruba povrsine -->
  <!-- Kota L (ispod platforme/kolica) -->
  <!-- Voda labela (na sredini fluida) -->
  <!-- Oznake stijenki: skraceno "straz." i "pred." iznad stijenki -->
  <!-- ============================================================
       DESNI PANEL: FORMULA BOX + REZULTATI
  ============================================================ -->

  <!-- Header bar (plavi) -->
  <rect x="582" y="18" width="324" height="36" rx="12" fill="#1565c0" />
  <rect x="582" y="42" width="324" height="14" fill="#1565c0" />
  <!-- Blok 1: Delta h -->
  <line x1="606" y1="152" x2="882" y2="152" stroke="#c8d6e4" stroke-width="1" />

  <!-- Blok 2: h_strag -->
  <line x1="606" y1="244" x2="882" y2="244" stroke="#c8d6e4" stroke-width="1" />

  <!-- Blok 3: h_pred -->
  <line x1="606" y1="336" x2="882" y2="336" stroke="#c8d6e4" stroke-width="1" />

  <!-- Blok 4: theta -->
  <!-- REZULTATI badge -->
  <rect x="596" y="411" width="296" height="32" rx="7" fill="#e8f5e9" stroke="#1e8449" stroke-width="1.4" />
  <line x1="118" y1="200" x2="78" y2="200" stroke="#b7600c" stroke-width="0.7" />
  <line x1="118" y1="320" x2="78" y2="320" stroke="#b7600c" stroke-width="0.7" />
  <line x1="84" y1="200" x2="72" y2="200" stroke="#b7600c" stroke-width="1.2" />
  <line x1="84" y1="320" x2="72" y2="320" stroke="#b7600c" stroke-width="1.2" />
  <line x1="78" y1="203" x2="78" y2="317" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u04v2lk_dimL)" marker-end="url(#u04v2lk_dim)" />
  <line x1="502" y1="250" x2="556" y2="250" stroke="#b7600c" stroke-width="0.7" />
  <line x1="502" y1="320" x2="556" y2="320" stroke="#b7600c" stroke-width="0.7" />
  <line x1="546" y1="250" x2="558" y2="250" stroke="#b7600c" stroke-width="1.2" />
  <line x1="546" y1="320" x2="558" y2="320" stroke="#b7600c" stroke-width="1.2" />
  <line x1="552" y1="253" x2="552" y2="317" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u04v2lk_dimL)" marker-end="url(#u04v2lk_dim)" />
  <line x1="490" y1="200" x2="524" y2="200" stroke="#b7600c" stroke-width="0.7" />
  <line x1="490" y1="250" x2="524" y2="250" stroke="#b7600c" stroke-width="0.7" />
  <line x1="514" y1="200" x2="526" y2="200" stroke="#b7600c" stroke-width="1.2" />
  <line x1="514" y1="250" x2="526" y2="250" stroke="#b7600c" stroke-width="1.2" />
  <line x1="520" y1="203" x2="520" y2="247" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u04v2lk_dimL)" marker-end="url(#u04v2lk_dim)" />
  <line x1="130" y1="328" x2="130" y2="432" stroke="#b7600c" stroke-width="0.7" />
  <line x1="490" y1="328" x2="490" y2="432" stroke="#b7600c" stroke-width="0.7" />
  <line x1="130" y1="422" x2="130" y2="434" stroke="#b7600c" stroke-width="1.2" />
  <line x1="490" y1="422" x2="490" y2="434" stroke="#b7600c" stroke-width="1.2" />
  <line x1="133" y1="428" x2="487" y2="428" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u04v2lk_dimL)" marker-end="url(#u04v2lk_dim)" />
  <text x="38" y="46" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Spremnik na ubrzanim kolicima</text>
  <text x="38" y="62" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">vodoravna translacija u relativnom mirovanju</text>

  <text x="380" y="220" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78" text-anchor="middle" font-style="italic">mirna razina (h₀ = 0,42 m)</text>


  <text x="310" y="90" font-family="'Segoe UI',Arial,sans-serif" font-size="14" text-anchor="middle" fill="#c0392b" font-style="italic"><tspan font-weight="700">a</tspan> = 1,35 m/s²</text>
  <text x="310" y="124" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#a04030" font-style="italic">smjer gibanja kolica</text>

  <text x="200" y="216" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#8e44ad" font-style="italic">θ ≈ 7,9°</text>

  <text x="492" y="56" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#8e44ad">efektivno polje</text>
  <text x="454" y="100" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="end" fill="#3a4a56" font-style="italic">g</text>
  <text x="490" y="71" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#c0392b" font-style="italic">a</text>
  <text x="482" y="116" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#8e44ad" font-style="italic">g<tspan baseline-shift="sub" font-size="0.7em">eff</tspan></text>
  <text x="492" y="132" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#5a6a78" font-style="italic">povrsina ⊥ g<tspan baseline-shift="sub" font-size="0.7em">eff</tspan></text>

  <text x="310" y="298" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#0d47a1" font-style="italic">voda</text>

  <text x="124" y="156" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#5a6a78" font-style="italic">stražnja</text>
  <text x="496" y="156" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#5a6a78" font-style="italic">prednja</text>

  <text x="744" y="42" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">Ključne jednadžbe</text>

  <text x="744" y="80" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">razlika razina slobodne površine</text>
  <text x="744" y="102" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a2530">Δh = a L / g</text>
  <text x="744" y="120" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#5a6a78">= 1,35 · 1,60 / 9,81</text>
  <text x="744" y="139" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1565c0">Δh ≈ 0,220 m</text>
  <text x="744" y="172" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">visina uz stražnju stijenku</text>
  <text x="744" y="194" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a2530">h<tspan baseline-shift="sub" font-size="0.7em" font-weight="400">straž</tspan> = h₀ + Δh/2</text>
  <text x="744" y="212" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#5a6a78">= 0,42 + 0,110</text>
  <text x="744" y="231" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1565c0">h<tspan baseline-shift="sub" font-size="0.7em" font-weight="400">straž</tspan> = 0,530 m</text>
  <text x="744" y="264" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">visina uz prednju stijenku</text>
  <text x="744" y="286" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a2530">h<tspan baseline-shift="sub" font-size="0.7em" font-weight="400">pred</tspan> = h₀ − Δh/2</text>
  <text x="744" y="304" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#5a6a78">= 0,42 − 0,110</text>
  <text x="744" y="323" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1565c0">h<tspan baseline-shift="sub" font-size="0.7em" font-weight="400">pred</tspan> = 0,310 m</text>
  <text x="744" y="356" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">kut nagiba slobodne površine</text>
  <text x="744" y="378" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a2530">tan θ = a / g = 1,35 / 9,81</text>
  <text x="744" y="397" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#8e44ad">θ = arctan(0,138) ≈ 7,9°</text>

  <text x="612" y="431" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#1e8449">PROVJERA</text>
  <text x="878" y="431" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" text-anchor="end" fill="#1a2530" font-style="italic">(h<tspan baseline-shift="sub" font-size="0.7em" font-style="normal">straž</tspan> + h<tspan baseline-shift="sub" font-size="0.7em" font-style="normal">pred</tspan>)/2 = 0,42 m = h₀  √</text>
<text x="60" y="258" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#b7600c" font-style="italic">h<tspan baseline-shift="sub" font-size="0.7em" font-style="normal">straz</tspan></text>
  <text x="108.6" y="258.0" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#b7600c" font-weight="700">= 0,530 m</text>

  <text x="538" y="282" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#b7600c" font-style="italic">h<tspan baseline-shift="sub" font-size="0.7em" font-style="normal">pred</tspan></text>
  <text x="538.0" y="298.0" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#b7600c" font-weight="700">= 0,310 m</text>

  <text x="514" y="180" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#b7600c" font-style="italic">Δh</text>
  <text x="514.0" y="196.0" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#b7600c" font-weight="700">= 0,220 m</text>

  <text x="310" y="446" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">L</tspan> = 1,60 m</text>

  </svg>