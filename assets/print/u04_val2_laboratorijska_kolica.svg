<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" role="img" aria-labelledby="u04v2lk_title u04v2lk_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u04v2lk_title">U04 Val 2 - otvoreni spremnik na laboratorijskim kolicima</title>
  <desc id="u04v2lk_desc">Minimalna tehnička skica otvorenog spremnika na kolicima s vodoravnim ubrzanjem, nagnutom slobodnom površinom, razlikom razina delta h i lokalnim dubinama uz straznju i prednju stijenu.</desc>
  <rect width="940" height="320" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="272" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>

  <rect x="164" y="128" width="356" height="126" rx="8" fill="none" stroke="#173043" stroke-width="4"/>
  <polygon points="164,150 520,202 520,254 164,254" fill="#9ed0e6" opacity="0.95"/>
  <line x1="164" y1="150" x2="520" y2="202" stroke="#ffffff" stroke-width="5"/>

  <line x1="426" y1="112" x2="524" y2="112" stroke="#1976d2" stroke-width="5" marker-end="url(#u04v2lk_arrowBlue)"/>
  <text x="466" y="100" font-family="'Segoe UI',Arial,sans-serif" font-size="16" fill="#173043">a</text>

  <line x1="140" y1="150" x2="140" y2="254" stroke="#c96c35" stroke-width="3" marker-start="url(#u04v2lk_arrowOrangeSmall)" marker-end="url(#u04v2lk_arrowOrange)"/>
  <text x="82" y="210" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">h_straznja</text>

  <line x1="546" y1="202" x2="546" y2="254" stroke="#c96c35" stroke-width="3" marker-start="url(#u04v2lk_arrowOrangeSmall)" marker-end="url(#u04v2lk_arrowOrange)"/>
  <text x="558" y="232" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">h_prednja</text>

  <line x1="164" y1="278" x2="520" y2="278" stroke="#6f7f89" stroke-width="3" marker-start="url(#u04v2lk_arrowGray)" marker-end="url(#u04v2lk_arrowGray)"/>
  <text x="332" y="290" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">L</text>

  <line x1="572" y1="150" x2="572" y2="202" stroke="#be123c" stroke-width="3" marker-start="url(#u04v2lk_arrowRedSmall)" marker-end="url(#u04v2lk_arrowRed)"/>
  <text x="584" y="180" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">delta h</text>

  <line x1="734" y1="116" x2="734" y2="182" stroke="#c96c35" stroke-width="4" marker-end="url(#u04v2lk_arrowOrange)"/>
  <line x1="734" y1="116" x2="790" y2="116" stroke="#1976d2" stroke-width="4" marker-end="url(#u04v2lk_arrowBlue)"/>
  <line x1="734" y1="116" x2="790" y2="182" stroke="#2e7d32" stroke-width="4" marker-end="url(#u04v2lk_arrowGreen)"/>
  <text x="746" y="158" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">g</text>
  <text x="794" y="192" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">g_eff</text>

  <text x="92" y="110" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#516677">Slobodna površina ostaje okomita na efektivno polje sila.</text>
  <text x="628" y="246" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#516677">delta h = aL/g</text>

