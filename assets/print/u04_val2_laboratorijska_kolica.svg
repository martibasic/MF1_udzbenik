  <text x="535" y="287" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#b7600c" text-anchor="middle" transform="rotate(-90 535 287)">h<tspan baseline-shift="sub" font-size="0.7em">pred</tspan> = 0,310 m</text>
