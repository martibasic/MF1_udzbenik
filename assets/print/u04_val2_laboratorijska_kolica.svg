<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" role="img"
     aria-labelledby="u4v2T u4v2D" preserveAspectRatio="xMidYMid meet"
     style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u4v2T">U04 Val 2 – Otvoreni spremnik na laboratorijskim kolicima</title>
  <desc id="u4v2D">Otvoreni pravokutni spremnik (L=1,60 m, h₀=0,42 m) s vodoravnim ubrzanjem a=1,35 m/s². Δh=0,220 m, h_str=0,530 m, h_pred=0,310 m, θ≈7,9°.</desc>
  <defs>
    <pattern id="u4v2H" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#8090a0"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#546e7a" stroke-width="1.8"/>
    </pattern>
    <linearGradient id="u4v2Wg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4eef8"/>
      <stop offset="100%" stop-color="#7ec8e8"/>
    </linearGradient>
    <marker id="u4v2aGr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#546e7a"/>
    </marker>
    <marker id="u4v2aGrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L0,8 L8,4 z" fill="#546e7a"/>
    </marker>
    <marker id="u4v2aB" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- Background + border -->
  <rect width="940" height="400" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="352" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>

  <!-- Title + subtitle -->
  <text x="54" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#173043">U04 – Otvoreni spremnik na laboratorijskim kolicima</text>
  <text x="54" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#516677">Translatorno ubrzanje: slobodna površina se naginje, Δh = aL/g, razine h_str i h_pred simetrično oko h₀.</text>

  <!-- === LEFT PANEL: tank cross-section === -->

  <!-- Structural walls (srafura) -->
  <!-- Left (back) wall -->
  <rect x="120" y="218" width="30" height="102" fill="url(#u4v2H)"/>
  <rect x="120" y="218" width="30" height="102" fill="none" stroke="#546e7a" stroke-width="1.2"/>
  <!-- Right (front) wall -->
  <rect x="390" y="218" width="30" height="102" fill="url(#u4v2H)"/>
  <rect x="390" y="218" width="30" height="102" fill="none" stroke="#546e7a" stroke-width="1.2"/>
  <!-- Bottom floor -->
  <rect x="120" y="320" width="300" height="24" fill="url(#u4v2H)"/>
  <rect x="120" y="320" width="300" height="24" fill="none" stroke="#546e7a" stroke-width="1.2"/>

  <!-- Water fill: back top y=240, front top y=273, bottom y=320 -->
  <path d="M150,240 L390,273 L390,320 L150,320 Z" fill="url(#u4v2Wg)" opacity="0.9"/>

  <!-- Tank inner wall faces -->
  <line x1="150" y1="218" x2="150" y2="320" stroke="#2d3a40" stroke-width="2.5"/>
  <line x1="390" y1="218" x2="390" y2="320" stroke="#2d3a40" stroke-width="2.5"/>
  <!-- Tank top open rim -->
  <line x1="150" y1="218" x2="390" y2="218" stroke="#2d3a40" stroke-width="2"/>

  <!-- Free surface (tilted water line) -->
  <line x1="150" y1="240" x2="390" y2="273" stroke="#3a87ad" stroke-width="2.5"/>

  <!-- Horizontal dashed reference at back water level -->
  <line x1="150" y1="240" x2="240" y2="240" stroke="#546e7a" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- θ angle indicator -->
  <!-- arc centre (150,240), radius 45: from 0° to 7.9°, end=(195,246.2) -->
  <path d="M195,240 A45,45 0 0 1 209.8,246.1" fill="none" stroke="#546e7a" stroke-width="1.3"/>
  <text x="207" y="259" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#546e7a">θ = 7,9°</text>

  <!-- Stražnja/Prednja labels -->
  <text x="150" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#516677" text-anchor="middle">stražnja</text>
  <text x="390" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#516677" text-anchor="middle">prednja</text>

  <!-- Acceleration arrow (above tank, pointing right) -->
  <line x1="198" y1="183" x2="338" y2="183" stroke="#1565c0" stroke-width="3.5" marker-end="url(#u4v2aB)"/>
  <rect x="215" y="165" width="110" height="20" rx="5" fill="#eef4ff" stroke="#c5d5e8" stroke-width="1"/>
  <text x="270" y="179" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1565c0" font-weight="700" text-anchor="middle">a = 1,35 m/s²</text>

  <!-- g_eff vector diagram (small inset, top area) -->
  <rect x="415" y="93" width="82" height="85" rx="8" fill="#f8fafb" stroke="#d3d9de" stroke-width="1.2"/>
  <!-- origin -->
  <circle cx="440" cy="128" r="3" fill="#173043"/>
  <!-- g arrow: down -->
  <line x1="440" y1="131" x2="440" y2="162" stroke="#173043" stroke-width="2.5" marker-end="url(#u4v2aGr)"/>
  <text x="445" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#173043">g</text>
  <!-- a arrow: right -->
  <line x1="443" y1="128" x2="470" y2="128" stroke="#1565c0" stroke-width="2.5" marker-end="url(#u4v2aB)"/>
  <text x="454" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#1565c0">a</text>
  <!-- g_eff arrow: diagonal -->
  <marker id="u4v2aBk" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#173043"/></marker>
  <line x1="440" y1="128" x2="468" y2="160" stroke="#173043" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#u4v2aBk)"/>
  <text x="466" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#173043">g_eff</text>
  <text x="420" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#516677">tan θ = a/g</text>

  <!-- === DIMENSION LINES === -->

  <!-- h_str dim (left of tank, x=96, from y=240 to y=320) -->
  <line x1="96" y1="240" x2="96" y2="320" stroke="#546e7a" stroke-width="1.8" marker-start="url(#u4v2aGrL)" marker-end="url(#u4v2aGr)"/>
  <!-- tick marks at dim endpoints -->
  <line x1="92" y1="240" x2="100" y2="240" stroke="#546e7a" stroke-width="1.3"/>
  <line x1="92" y1="320" x2="100" y2="320" stroke="#546e7a" stroke-width="1.3"/>
  <rect x="30" y="271" width="58" height="34" rx="5" fill="#fff" stroke="#c9d2d8" stroke-width="1"/>
  <text x="59" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#173043" text-anchor="middle">h_str</text>
  <text x="59" y="299" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#516677" text-anchor="middle">0,530 m</text>

  <!-- Δh dim (right of front wall face, x=406, from y=240 to y=273) -->
  <line x1="406" y1="240" x2="406" y2="273" stroke="#546e7a" stroke-width="1.8" marker-start="url(#u4v2aGrL)" marker-end="url(#u4v2aGr)"/>
  <line x1="402" y1="240" x2="410" y2="240" stroke="#546e7a" stroke-width="1.3"/>
  <line x1="402" y1="273" x2="410" y2="273" stroke="#546e7a" stroke-width="1.3"/>
  <rect x="413" y="249" width="54" height="20" rx="4" fill="#fff" stroke="#c9d2d8" stroke-width="1"/>
  <text x="440" y="263" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#173043" text-anchor="middle">Δh</text>
  <text x="413" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#516677">0,220 m</text>

  <!-- h_pred dim (right of Δh, x=478, from y=273 to y=320) -->
  <line x1="466" y1="273" x2="466" y2="320" stroke="#546e7a" stroke-width="1.8" marker-start="url(#u4v2aGrL)" marker-end="url(#u4v2aGr)"/>
  <line x1="462" y1="273" x2="470" y2="273" stroke="#546e7a" stroke-width="1.3"/>
  <line x1="462" y1="320" x2="470" y2="320" stroke="#546e7a" stroke-width="1.3"/>
  <rect x="474" y="285" width="58" height="34" rx="5" fill="#fff" stroke="#c9d2d8" stroke-width="1"/>
  <text x="503" y="299" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#173043" text-anchor="middle">h_pred</text>
  <text x="503" y="313" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#516677" text-anchor="middle">0,310 m</text>

  <!-- L dim (below floor, y=358, x=150 to x=390) -->
  <line x1="150" y1="358" x2="390" y2="358" stroke="#546e7a" stroke-width="1.8" marker-start="url(#u4v2aGrL)" marker-end="url(#u4v2aGr)"/>
  <line x1="150" y1="353" x2="150" y2="363" stroke="#546e7a" stroke-width="1.3"/>
  <line x1="390" y1="353" x2="390" y2="363" stroke="#546e7a" stroke-width="1.3"/>
  <rect x="232" y="364" width="76" height="20" rx="4" fill="#fff" stroke="#c9d2d8" stroke-width="1"/>
  <text x="270" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#173043" text-anchor="middle">L = 1,60 m</text>

  <!-- h₀ dashed mid-level indicator -->
  <line x1="150" y1="257" x2="390" y2="257" stroke="#b7600c" stroke-width="1.2" stroke-dasharray="7 5"/>
  <rect x="154" y="259" width="54" height="17" rx="3" fill="#fffbf5" stroke="#e0c080" stroke-width="1"/>
  <text x="181" y="271" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#b7600c" text-anchor="middle">h₀ = 0,42 m</text>

  <!-- === RIGHT PANEL: Formula box === -->
  <rect x="540" y="88" width="370" height="278" rx="10" fill="#fffef6" stroke="#c49a0a" stroke-width="1.8"/>
  <text x="560" y="113" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#173043">Ključne jednadžbe</text>
  <line x1="560" y1="120" x2="895" y2="120" stroke="#e8d89a" stroke-width="1"/>

  <text x="560" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#173043">Δh = aL/g</text>
  <text x="560" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#516677">  = 1,35 · 1,60 / 9,81</text>
  <text x="560" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#173043">Δh ≈ 0,220 m</text>
  <line x1="560" y1="184" x2="895" y2="184" stroke="#e8d89a" stroke-width="1"/>

  <text x="560" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#173043">h_str = h₀ + Δh/2</text>
  <text x="560" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#516677">  = 0,42 + 0,11 = 0,530 m  ↑</text>
  <line x1="560" y1="228" x2="895" y2="228" stroke="#e8d89a" stroke-width="1"/>

  <text x="560" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#173043">h_pred = h₀ − Δh/2</text>
  <text x="560" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#516677">  = 0,42 − 0,11 = 0,310 m  ↓</text>
  <line x1="560" y1="272" x2="895" y2="272" stroke="#e8d89a" stroke-width="1"/>

  <text x="560" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#173043">tan θ = a/g = 1,35/9,81 = 0,138</text>
  <text x="560" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#173043">θ = arctan(0,138) ≈ 7,9°</text>
  <line x1="560" y1="316" x2="895" y2="316" stroke="#e8d89a" stroke-width="1"/>

  <text x="560" y="334" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#516677">Provjera: (0,530 + 0,310)/2 = 0,42 = h₀ ✓</text>
  <text x="560" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#516677">Nema prelijevanja: h_str = 0,53 m &lt; H (nije zadano, ok)</text>

</svg>