  <text x="38" y="46" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Spremnik na ubrzanim kolicima</text>
  <text x="38" y="62" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">vodoravna translacija u relativnom mirovanju</text>
  <text x="380" y="220" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78" text-anchor="middle" font-style="italic">mirna razina (h₀ = 0,42 m)</text>
  <text x="310" y="90" font-family="'Segoe UI',Arial,sans-serif" font-size="14" text-anchor="middle" fill="#c0392b" font-style="italic">
    <tspan font-weight="700">a</tspan> = 1,35 m/s²</text>
  <text x="310" y="124" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#a04030" font-style="italic">ubrzanje kolica udesno</text>
  <text x="200" y="216" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#8e44ad" font-style="italic">θ ≈ 7,9°</text>
  <text x="492" y="56" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#8e44ad">efektivno polje</text>
  <text x="495" y="105" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="end" fill="#3a4a56" font-style="italic">g</text>
  <text x="462" y="70" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#c0392b" font-style="italic">−a</text>
  <text x="455" y="116" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#8e44ad" font-style="italic">g<tspan baseline-shift="sub" font-size="0.7em">eff</tspan>
  </text>
  <text x="492" y="132" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#5a6a78" font-style="italic">povrsina ⊥ g<tspan baseline-shift="sub" font-size="0.7em">eff</tspan>
  </text>
  <text x="310" y="298" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#0d47a1" font-style="italic">voda</text>
  <text x="124" y="156" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#5a6a78" font-style="italic">stražnja</text>
  <text x="496" y="156" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#5a6a78" font-style="italic">prednja</text>
  <text x="744" y="42" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1565c0">Ključne jednadžbe</text>
  <text x="744" y="80" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">razlika razina slobodne površine</text>
  <text x="744" y="102" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a2530">Δh = a L / g</text>
  <text x="744" y="120" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#5a6a78">= 1,35 · 1,60 / 9,81</text>
  <text x="744" y="139" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1565c0">Δh ≈ 0,220 m</text>
  <text x="744" y="172" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">visina uz stražnju stijenku</text>
  <text x="744" y="194" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a2530">h<tspan baseline-shift="sub" font-size="0.7em" font-weight="400">straž</tspan> = h₀ + Δh/2</text>
  <text x="744" y="212" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#5a6a78" transform="translate(0 9)">= 0,42 + 0,110</text>
  <text x="744" y="231" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1565c0" transform="translate(0 12)">h<tspan baseline-shift="sub" font-size="0.7em" font-weight="400">straž</tspan> = 0,530 m</text>
  <text x="744" y="264" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78" transform="translate(0 12)">visina uz prednju stijenku</text>
  <text x="744" y="286" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a2530" transform="translate(0 12)">h<tspan baseline-shift="sub" font-size="0.7em" font-weight="400">pred</tspan> = h₀ − Δh/2</text>
  <text x="744" y="304" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#5a6a78" transform="translate(0 12) translate(0 9)">= 0,42 − 0,110</text>
  <text x="744" y="323" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1565c0" transform="translate(0 24)">h<tspan baseline-shift="sub" font-size="0.7em" font-weight="400">pred</tspan> = 0,310 m</text>
  <text x="744" y="356" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78" transform="translate(0 24)">kut nagiba slobodne površine</text>
  <text x="744" y="378" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a2530" transform="translate(0 24)">tan θ = a / g = 1,35 / 9,81</text>
  <text x="744" y="397" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#8e44ad" transform="translate(0 24)">θ = arctan(0,138) ≈ 7,9°</text>
  <text x="612" y="431" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#1e8449" transform="translate(0 24)">PROVJERA</text>
  <text x="878" y="431" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" text-anchor="end" fill="#1a2530" font-style="italic" transform="translate(0 24)">(h<tspan baseline-shift="sub" font-size="0.7em" font-style="normal">straž</tspan> + h<tspan baseline-shift="sub" font-size="0.7em" font-style="normal">pred</tspan>)/2 = 0,42 m = h₀  √</text>
  <text x="514" y="180" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#b7600c" font-style="italic">Δh</text>
  <text x="514.0" y="196.0" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#b7600c" font-weight="700">= 0,220 m</text>
  <text x="310" y="446" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#b7600c">
    <tspan font-style="italic">L</tspan> = 1,60 m</text>
