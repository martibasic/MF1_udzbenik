<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 491" role="img" aria-labelledby="u05v1pz_title u05v1pz_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:460px;height:auto;">
  <title id="u05v1pz_title">Vertikalna pravokutna zaklopka ispod slobodne površine</title>
  <desc id="u05v1pz_desc">Bočni presjek vertikalne pravokutne zaklopke pod vodom. Tlak raste s dubinom; rezultanta djeluje u centru tlaka ispod težišta plohe. Desno su osnovne relacije za silu i centar tlaka.</desc>
