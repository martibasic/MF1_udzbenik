    <text x="76" y="40" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" fill="#263746">Bočni presjek spremnika sa zaklopkom</text>
    <text x="74" y="103" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" fill="#263746">slobodna površina (p = p₀)</text>
    <text x="140" y="245" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-style="italic" fill="#263746">voda</text>
    <text x="140" y="262" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" fill="#263746">ρ = 998 kg/m³</text>
    <text x="286" y="186" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="end" font-style="italic">p₁</text>
    <text x="214" y="324" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="end" font-style="italic">p₂</text>
    <text x="415" y="251" font-family="Arial, Liberation Sans, sans-serif" font-size="13" fill="#263746" font-style="italic" font-weight="700">F</text>
    <text x="382" y="230" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746">
      <tspan font-style="italic">C</tspan>
    </text>
    <text x="382" y="291" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746">
      <tspan font-style="italic">CP</tspan>
