<svg xmlns="http://www.w3.org/2000/svg" width="940" height="490" viewBox="0 0 940 490" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
<defs>
  <marker id="u12c1pzl_u12c1-ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0f766e"/></marker>
  <marker id="u12c1pzl_u12c1-ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#b42318"/></marker>
  <marker id="u12c1pzl_u12c1-ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#1d4ed8"/></marker>
  <marker id="u12c1pzl_u12c1-ao" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#b45309"/></marker>
  <marker id="u12c1pzl_u12c1-agr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#546e7a"/></marker>
  <linearGradient id="u12c1pzl_u12c1-wat" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#d4eef8"/><stop offset="100%" stop-color="#7ec8e8"/></linearGradient>
  <pattern id="u12c1pzl_u12c1-hatch" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#8090a0"/>
    <line x1="0" y1="8" x2="8" y2="0" stroke="#546e7a" stroke-width="1.8"/>
  </pattern>
</defs>
<rect width="940" height="490" fill="#ffffff"/>
<rect x="24" y="24" width="892" height="442" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>
<text x="54" y="55" font-family="'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#173043">Pokretna zakrivljena lopatica — sila, snaga, trokut brzina</text>
<text x="54" y="76" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#516677">Lopatica giba brzinom u = 10 m/s · c₁=26 m/s, w₁=16 m/s, β=30°, k=0,90</text>

<!-- ===== PHYSICAL DIAGRAM — left half ===== -->

<!-- Nozzle body -->
<rect x="44" y="175" width="65" height="78" rx="4" fill="url(#u12c1pzl_u12c1-hatch)"/>
<!-- Nozzle exit -->
<rect x="103" y="192" width="5" height="44" fill="#2d3a40"/>
<!-- Jet (water stream going right) -->
<rect x="108" y="192" width="88" height="44" fill="url(#u12c1pzl_u12c1-wat)" opacity="0.85"/>
<!-- Nozzle label: d=45mm -->
<text x="50" y="168" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#546e7a">d = 45 mm</text>

<!-- Moving curved blade body (semi-circular bucket shape, moving right) -->
<!-- Blade shape: enters from right at (196,214), curves around and exits upper-left -->
<!-- Outer wall (bottom/convex): Bezier from (196,236) to (278,214) [exit side] -->
<!-- Entry at x=196, y=192 top and y=236 bottom (water jet height = 44px) -->
<!-- Blade: thick curved shape representing the bucket/blade -->
<path d="M 196,192 C 230,192 260,188 276,200 C 292,212 298,230 288,248 C 278,268 260,278 240,280 L 240,266 C 254,264 268,256 276,240 C 284,224 280,212 270,204 C 260,196 234,198 196,200 Z" fill="url(#u12c1pzl_u12c1-hatch)"/>
<!-- Water channel inside blade -->
<path d="M 200,200 C 230,200 256,196 270,208 C 282,218 284,236 274,252 C 266,264 252,272 240,274 L 240,268 C 250,266 264,258 272,248 C 280,234 278,218 268,208 C 256,198 230,194 200,194 Z" fill="url(#u12c1pzl_u12c1-wat)" opacity="0.82"/>

<!-- Exit water stream from blade (upper-left direction, β=30° from horizontal in relative frame) -->
<!-- Exit direction in SVG: (−0.5,−0.866) for angle 120° from +x (since β=30° ABOVE −x axis = 150° from +x) -->
<!-- Wait: β=30° above −x axis means the angle from +x is 180°−30°=150°: direction (cos150°,sin150°)=(−0.866,+0.5) in physics -->
<!-- In SVG (y-down): (−0.866,−0.5) = upper-left going steeply left and slightly up -->
<!-- From blade exit (240,272) in direction (−0.866,−0.5) for 70px: (179.4,237) -->
<path d="M 228,270 L 170,235 L 175,225 L 233,260 Z" fill="url(#u12c1pzl_u12c1-wat)" opacity="0.80"/>

<!-- Blade velocity u arrow (orange, rightward from plate) -->
<line x1="196" y1="305" x2="270" y2="305" stroke="#b45309" stroke-width="2.8" marker-end="url(#u12c1pzl_u12c1-ao)"/>
<text x="200" y="322" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#b45309">u = 10 m/s</text>

<!-- c1 arrow (absolute velocity, green, from nozzle going right) -->
<line x1="118" y1="175" x2="190" y2="175" stroke="#0f766e" stroke-width="2.5" marker-end="url(#u12c1pzl_u12c1-ag)"/>
<text x="118" y="168" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#0f766e">c₁ = 26 m/s</text>

<!-- Force arrows on blade (fluid forces) -->
<!-- Fx = +723 N → (rightward): from blade center -->
<line x1="298" y1="228" x2="370" y2="228" stroke="#b42318" stroke-width="2.5" marker-end="url(#u12c1pzl_u12c1-ar)"/>
<text x="300" y="220" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#b42318">Fₓ = 723 N (→)</text>
<!-- Fy = −183 N ↓: (fluid pushes down on blade) -->
<line x1="298" y1="228" x2="298" y2="282" stroke="#b42318" stroke-width="2.5" marker-end="url(#u12c1pzl_u12c1-ar)"/>
<text x="304" y="279" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#b42318">Fᵧ = 183 N (↓)</text>

<!-- ===== VELOCITY TRIANGLE PANEL (below physical diagram) ===== -->
<rect x="44" y="350" width="390" height="118" rx="8" fill="#f0f6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="60" y="372" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#173043">Trokut brzina</text>

<!-- INLET triangle: all vectors rightward (1D), origin at (70,400) -->
<!-- Scale: 1 m/s = 8px → c1=208px, u=80px, w1=128px -->
<text x="60" y="390" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677">Ulaz:</text>
<!-- c1: from 70 to 70+208=278 -->
<line x1="68" y1="408" x2="276" y2="408" stroke="#0f766e" stroke-width="3" marker-end="url(#u12c1pzl_u12c1-ag)"/>
<text x="152" y="423" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#0f766e" font-weight="700">c₁=26</text>
<!-- u: from 68 to 68+80=148 -->
<line x1="68" y1="400" x2="148" y2="400" stroke="#b45309" stroke-width="2.2" marker-end="url(#u12c1pzl_u12c1-ao)"/>
<text x="82" y="396" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b45309">u=10</text>
<!-- w1: from 148 to 148+128=276 (relative velocity at entry) -->
<line x1="148" y1="416" x2="276" y2="416" stroke="#1d4ed8" stroke-width="2.2" stroke-dasharray="5,2" marker-end="url(#u12c1pzl_u12c1-ab)"/>
<text x="196" y="434" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1d4ed8">w₁=c₁−u=16</text>

<!-- OUTLET triangle: origin at same level but shifted right or in separate area -->
<text x="310" y="390" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677">Izlaz:</text>
<!-- In relative frame: w2=14.4 m/s at β=30° from −x axis = direction (−cos30°, −sin30°)=(−0.866,−0.5) in SVG -->
<!-- w2 vector: 14.4×8=115px. From origin (315,420): (315+115·(−0.866), 420+115·(−0.5))=(215.4,362.5) -->
<!-- We place origin at (415,430), w2 points upper-left: to (415+115·(−0.866),430+115·(−0.5))=(314.4,372.5) -->
<line x1="415" y1="430" x2="315" y2="373" stroke="#1d4ed8" stroke-width="2.2" stroke-dasharray="5,2" marker-end="url(#u12c1pzl_u12c1-ab)"/>
<text x="340" y="393" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#1d4ed8">w₂=14,4</text>
<!-- u vector: same as before, rightward from origin: (415,430) to (495,430) BUT we want the tip to be at origin (blade velocity added to w2) -->
<!-- c2 = u + w2: c2=(10+14.4·(−0.866), 0+14.4·(−0.5))=(10−12.47, −7.20)=(−2.47,+7.20) wait in SVG: (−2.47,−7.20) magnitude ≈ 7.61 m/s -->
<!-- Show: u (orange from prev tip of w2 forward to c2 tip), c2=u+w2 -->
<!-- u from (315,373) to (315+80,373)=(395,373): adds u=10 m/s rightward -->
<line x1="315" y1="373" x2="395" y2="373" stroke="#b45309" stroke-width="2.2" marker-end="url(#u12c1pzl_u12c1-ao)"/>
<text x="338" y="368" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#b45309">u=10</text>
<!-- c2 from origin (415,430) to (395,373): c2 = u+w2 -->
<line x1="415" y1="430" x2="397" y2="375" stroke="#0f766e" stroke-width="2.5" marker-end="url(#u12c1pzl_u12c1-ag)"/>
<text x="403" y="415" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#0f766e">c₂=7,6 m/s</text>
<!-- β angle arc at (415,430) showing 30° label -->
<path d="M 385,430 A 30,30 0 0,1 404,413" fill="none" stroke="#173043" stroke-width="1.2"/>
<text x="374" y="418" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#173043" font-style="italic">β=30°</text>

<!-- ===== INFO PANEL (right) ===== -->
<rect x="455" y="88" width="460" height="380" rx="10" fill="#fffef6" stroke="#c49a0a" stroke-width="1.8"/>
<text x="471" y="114" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">Zadano</text>
<text x="471" y="134" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">Sapnica:  d = 45 mm,  c₁ = 26 m/s</text>
<text x="471" y="153" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">Brzina lopatice:  u = 10 m/s</text>
<text x="471" y="172" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">Izlazni kut (relat. okvir):  β = 30°</text>
<text x="471" y="191" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">Koef. trenja:  k = 0,90  (w₂ = k·w₁)</text>
<line x1="471" y1="203" x2="903" y2="203" stroke="#e2e8f0" stroke-width="1"/>
<text x="471" y="222" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">Relativni sustav (pokretni KV)</text>
<text x="471" y="242" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">w₁ = c₁ − u = 26 − 10 = 16 m/s</text>
<text x="471" y="261" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">w₂ = 0,90 · 16 = 14,4 m/s</text>
<text x="471" y="280" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">A = π d²/4 = 1,590·10⁻³ m²</text>
<text x="471" y="299" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">ṁ_rel = ρ A w₁ = 1000·1,59·10⁻³·16 = <tspan font-weight="700" fill="#0f766e">25,4 kg/s</tspan></text>
<line x1="471" y1="311" x2="903" y2="311" stroke="#e2e8f0" stroke-width="1"/>
<text x="471" y="330" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">Trokut brzina (izlaz)</text>
<text x="471" y="350" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">w₂ₓ = −14,4·cos30° = −12,47 m/s</text>
<text x="471" y="369" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">w₂ᵧ = 14,4·sin30° = +7,20 m/s</text>
<text x="471" y="388" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">c₂ = u + w₂ = (10−12,47 ; +7,20) m/s</text>
<line x1="471" y1="400" x2="903" y2="400" stroke="#e2e8f0" stroke-width="1"/>
<text x="471" y="419" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">Sila i snaga</text>
<text x="471" y="439" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e293b">Fₓ = ṁ(w₁−w₂ₓ) = 25,4·(16+12,47) = <tspan font-weight="700" fill="#b42318">723 N</tspan></text>
<text x="471" y="458" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#6d2694">P = Fₓ · u = 723 · 10 = 7,23 kW</text>
</svg>