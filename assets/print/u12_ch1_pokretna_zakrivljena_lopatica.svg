  <rect x="602" y="116" width="278" height="206" rx="12" fill="#f8fafb" stroke="#d6dde2" stroke-width="1.5"/>
  <text x="624" y="146" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#173043">Čitanje skice</text>
  <text x="624" y="178" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">1. Iz sapnice dolazi apsolutna brzina c_1</text>
  <text x="624" y="204" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">2. Lopatica se giba brzinom u pa ulaz postaje w_1</text>
  <text x="624" y="230" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">3. Relativni izlaz w_2 prvo se prevodi u apsolutni c_2</text>
  <text x="624" y="256" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">4. Tek tada impuls daje silu i snagu na lopatici</text>
  <text x="624" y="288" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#516677">Brzine su razdvojene tako da se ne pomijesaju relativni i</text>
  <text x="624" y="310" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#516677">apsolutni sustav prije zatvaranja jednadzbe količine gibanja.</text>

