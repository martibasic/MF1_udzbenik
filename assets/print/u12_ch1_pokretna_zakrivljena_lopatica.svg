  <title id="u12c1pzl_title">U12 CH 1 - pokretna zakrivljena lopatica</title>
  <desc id="u12c1pzl_desc">Mlaz udara u pokretnu zakrivljenu lopaticu. Skica jasno razdvaja apsolutnu ulaznu brzinu, brzinu gibanja lopatice, relativni izlaz, apsolutni izlaz i silu na lopaticu.</desc>
