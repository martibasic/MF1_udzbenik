    <text x="27" y="211.5" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="start">h₂</text>
    <text x="252" y="52" font-family="Arial, Liberation Sans, sans-serif" font-size="14" fill="#263746" text-anchor="middle" font-weight="700">Uronjeno tijelo: uzgon iz razlike tlakova</text>
    <text x="247" y="146" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="middle">p₁A ↓</text>
    <text x="248" y="367" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="middle">p₂A ↑; p₂ &gt; p₁</text>
    <text x="246" y="393" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="middle">F<tspan baseline-shift="sub" font-size="0.7em">U</tspan> je rezultanta tlakova, ne dodatna sila.</text>
    <text x="728" y="250" font-family="Arial, Liberation Sans, sans-serif" font-size="14" fill="#263746" text-anchor="middle" font-weight="700">Početni stabilitet plivajućeg tijela</text>
  </g>
