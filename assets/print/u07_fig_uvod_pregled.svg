<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" role="img" aria-labelledby="u07fup_title u07fup_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="u07fup_title">Uzgon i početni stabilitet</title>
  <desc id="u07fup_desc">Lijevo je potpuno uronjeno tijelo s centrom uzgona u centroidu istisnine. FU je rezultanta razlike tlačnih sila; ne zbraja se ponovno s njima. Desno dolje kruto plivajuće tijelo ima vodoravnu vodnu liniju, pomaknuti centar uzgona B, težište G i metacentar M na sjecištu uzgonskog pravca i nagnute osi. Težina i uzgon stvaraju povratni moment za prikazani mali nagib.</desc>
