  <text x="728" y="48" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">Ključne jednadžbe poglavlja</text>
  <text x="728" y="82" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">Arhimedov zakon — sila uzgona</text>
  <text x="728" y="104" font-family="Arial, Liberation Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">U</tspan> = ρ g V<tspan baseline-shift="sub" font-size="0.7em">ist</tspan>
  </text>
  <text x="728" y="138" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">Plivanje — vertikalna ravnoteža i gaz</text>
  <text x="728" y="160" font-family="Arial, Liberation Sans, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#263746">ρ g V<tspan baseline-shift="sub" font-size="0.7em">ist</tspan> = G = mg   →   V<tspan baseline-shift="sub" font-size="0.7em">ist</tspan> = m / ρ</text>
  <text x="728" y="195" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" font-style="italic" text-anchor="middle" fill="#263746">Težina, istisnuti volumen i momentni raspored sila razdvajaju se kao tri stvari.</text>
