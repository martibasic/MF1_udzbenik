  <text x="728" y="48" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">Ključne jednadžbe poglavlja</text>
  <text x="728" y="82" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Arhimedov zakon — sila uzgona</text>
  <text x="728" y="104" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1a2530">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">U</tspan> = ρ g V<tspan baseline-shift="sub" font-size="0.7em">ist</tspan>
  </text>
  <text x="728" y="138" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Plivanje — vertikalna ravnoteža i gaz</text>
  <text x="728" y="160" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1a2530">ρ g V<tspan baseline-shift="sub" font-size="0.7em">ist</tspan> = G = mg   →   V<tspan baseline-shift="sub" font-size="0.7em">ist</tspan> = m / ρ</text>
  <text x="728" y="195" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-style="italic" text-anchor="middle" fill="#5a6a78">Težina, istisnuti volumen i momentni raspored sila razdvajaju se kao tri stvari.</text>
