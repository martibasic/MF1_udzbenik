<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" role="img" aria-labelledby="u07fup_title u07fup_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="u07fup_title">Pregled poglavlja 7 - Uzgon, plivanje i stabilnost</title>
  <desc id="u07fup_desc">Tri panela: lijevo fizikalni model potpuno uronjenog prizmaticnog tijela s tlakovima na gornju i donju plohu te rezultantom uzgona F_U i tezinom G; gore desno tri kljucne jednadzbe poglavlja (sila uzgona, ravnoteza plivanja, gaz iz mase); dolje desno inzenjerski kontekst - brod nagnut za mali kut theta s tezistem G iznad centra uzgona B i metacentrom M koji vraca brod u ravnotezu.</desc>

  <defs>
    <linearGradient id="u07fup_voda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aed6f1" />
      <stop offset="100%" stop-color="#5b9ec9" />
    </linearGradient>
    <linearGradient id="u07fup_more" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bcdff0" />
      <stop offset="100%" stop-color="#4f8fb8" />
    </linearGradient>
    <linearGradient id="u07fup_body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#909fa8" />
      <stop offset="100%" stop-color="#5d6d7e" />
    </linearGradient>
    <pattern id="u07fup_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.1" />
    </pattern>

    <!-- Strelice sila (manje, 7x5) -->
    <marker id="u07fup_aR" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#c0392b" />
    </marker>
    <marker id="u07fup_aG" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1e8449" />
    </marker>
    <!-- Strelice tlaka u fluidu (plave, 6x4) -->
    <marker id="u07fup_aB" markerWidth="6" markerHeight="4" refX="5.5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#1565c0" />
    </marker>
    <!-- Strelice kota (smedje) -->
    <marker id="u07fup_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u07fup_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <!-- Mali tamni za moment / pomocne sive -->
    <marker id="u07fup_aGr" markerWidth="6" markerHeight="4" refX="5.5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#5a6a78" />
    </marker>
  </defs>

  <!-- pozadina -->
  <!-- ===================== LIJEVI PANEL: Fizikalni model ===================== -->
  <rect x="28" y="28" width="446" height="404" rx="10" fill="#ffffff" stroke="#cfe0ee" stroke-width="1.2" />
  <!-- Slobodna povrsina i voda -->
  <rect x="44" y="98" width="416" height="316" fill="url(#u07fup_voda)" />
  <line x1="44" y1="98" x2="460" y2="98" stroke="#1565c0" stroke-width="2" />
  <!-- Dno (hatched) -->
  <rect x="44" y="414" width="416" height="10" fill="url(#u07fup_hatch)" />

  <!-- Uronjeno prizmaticno tijelo (sredinom panela) -->
  <!-- Tijelo: x 178..318, y 178..312, povrsine A na vrhu/dnu -->
  <rect x="178" y="178" width="140" height="134" fill="url(#u07fup_body)" stroke="#3a4a56" stroke-width="1.6" />

  <!-- Oznaka povrsina A na gornjoj i donjoj plohi -->
  <!-- Tlacne strelice na gornju plohu (prema dolje, plavo p1 = p0 + rho g h1) -->
  <line x1="200" y1="148" x2="200" y2="174" stroke="#1565c0" stroke-width="1.8" marker-end="url(#u07fup_aB)" />
  <line x1="226" y1="148" x2="226" y2="174" stroke="#1565c0" stroke-width="1.8" marker-end="url(#u07fup_aB)" />
  <line x1="270" y1="148" x2="270" y2="174" stroke="#1565c0" stroke-width="1.8" marker-end="url(#u07fup_aB)" />
  <line x1="296" y1="148" x2="296" y2="174" stroke="#1565c0" stroke-width="1.8" marker-end="url(#u07fup_aB)" />
  <!-- Tlacne strelice na donju plohu (prema gore, vise = jace, p2 = p0 + rho g h2) -->
  <line x1="194" y1="358" x2="194" y2="316" stroke="#1565c0" stroke-width="2.2" marker-end="url(#u07fup_aB)" />
  <line x1="220" y1="358" x2="220" y2="316" stroke="#1565c0" stroke-width="2.2" marker-end="url(#u07fup_aB)" />
  <line x1="248" y1="358" x2="248" y2="316" stroke="#1565c0" stroke-width="2.2" marker-end="url(#u07fup_aB)" />
  <line x1="276" y1="358" x2="276" y2="316" stroke="#1565c0" stroke-width="2.2" marker-end="url(#u07fup_aB)" />
  <line x1="302" y1="358" x2="302" y2="316" stroke="#1565c0" stroke-width="2.2" marker-end="url(#u07fup_aB)" />
  <!-- Tezina G u tezistu tijela (crvena, prema dolje, krece iz teziste pa dolje) -->
  <circle cx="248" cy="245" r="3" fill="#c0392b" />
  <line x1="248" y1="245" x2="248" y2="295" stroke="#c0392b" stroke-width="2.4" marker-end="url(#u07fup_aR)" />
  <!-- Sila uzgona F_U u centru istisnine B (zelena, prema gore, iz B prema gore) -->
  <circle cx="348" cy="245" r="3" fill="#1e8449" />
  <line x1="348" y1="245" x2="348" y2="180" stroke="#1e8449" stroke-width="2.4" marker-end="url(#u07fup_aG)" />
  <!-- Kota h1: od povrsine do gornje plohe (lijevo) -->
  <!-- Kota h2: od povrsine do donje plohe (jos lijevije) -->
  <!-- Komentar dolje -->
  <!-- ===================== DESNO GORE: Jednadzbe ===================== -->
  <rect x="490" y="28" width="476" height="186" rx="10" fill="#f4f9fd" stroke="#1565c0" stroke-width="1.4" />
  <rect x="490" y="28" width="476" height="28" rx="10" fill="#1565c0" />
  <rect x="490" y="46" width="476" height="10" fill="#1565c0" />
  <!-- Jednadzba 1: F_U = rho g V_ist -->
  <line x1="510" y1="118" x2="946" y2="118" stroke="#c8d6e4" stroke-width="1" />

  <!-- Jednadzba 2: F_U = G  =>  V_ist = m/rho -->
  <line x1="510" y1="174" x2="946" y2="174" stroke="#c8d6e4" stroke-width="1" />

  <!-- Sazetak italic -->
  <!-- ===================== DESNO DOLJE: Inzenjerski kontekst (brod nagnut) ===================== -->
  <rect x="490" y="228" width="476" height="204" rx="10" fill="#fdf6ec" stroke="#e0c490" stroke-width="1.4" />
  <!-- Voda (more) - traka iznad footera -->
  <rect x="500" y="360" width="456" height="42" fill="url(#u07fup_more)" />
  <!-- Slobodna povrsina (mirna - referentni horizont) -->
  <line x1="500" y1="360" x2="956" y2="360" stroke="#1565c0" stroke-width="1.5" />

  <!-- Brod (silueta) nagnut za mali kut theta. Sredistnja tocka rotacije: (700, 360). -->
  <g transform="rotate(-8 700 360)">
    <!-- Trup (paluba + bokovi, V-dno) -->
    <path d="M 620,336 L 780,336 L 798,366 L 762,392 L 638,392 L 602,366 Z" fill="#c8d2db" stroke="#3a4a56" stroke-width="1.6" />
    <!-- Vodna linija na trupu (referenca) -->
    <line x1="620" y1="360" x2="780" y2="360" stroke="#3a4a56" stroke-width="0.8" stroke-dasharray="4,3" />
    <!-- Nadgrade (zgrada na palubi) -->
    <rect x="662" y="312" width="76" height="24" fill="#909fa8" stroke="#3a4a56" stroke-width="1.2" />
    <rect x="672" y="318" width="9" height="10" fill="#fbfdff" />
    <rect x="688" y="318" width="9" height="10" fill="#fbfdff" />
    <rect x="704" y="318" width="9" height="10" fill="#fbfdff" />
    <rect x="720" y="318" width="9" height="10" fill="#fbfdff" />
    <!-- Dimnjak (pomaknut da ne sjedi tocno na osi) -->
    <rect x="676" y="296" width="10" height="16" fill="#5d6d7e" stroke="#3a4a56" stroke-width="1" />

    <!-- Os simetrije trupa (kroz G, B, M) -->
    <line x1="700" y1="294" x2="700" y2="392" stroke="#8e44ad" stroke-width="0.9" stroke-dasharray="3,3" />

    <!-- Tocka M (metacentar) - na osi, gore -->
    <circle cx="700" cy="300" r="3.4" fill="#8e44ad" />
    <!-- Tocka G (teziste mase) - na osi, sredina -->
    <circle cx="700" cy="338" r="3.4" fill="#c0392b" />
    <!-- Tocka B (centar uzgona) - na osi, ispod -->
    <circle cx="700" cy="372" r="3.4" fill="#1e8449" />
  </g>

  <!-- Sile (vertikalne u svjetskom sustavu): G dolje iz teziste tijela; F_U gore iz centra uzgona -->
  <!-- G vertikalno dolje (svjetska pozicija rotirane tocke G ~ (705,333)) -->
  <line x1="705" y1="333" x2="705" y2="385" stroke="#c0392b" stroke-width="2.6" marker-end="url(#u07fup_aR)" />
  <!-- F_U vertikalno gore (svjetska pozicija rotirane tocke B ~ (695,367)) -->
  <line x1="730" y1="367" x2="730" y2="312" stroke="#1e8449" stroke-width="2.6" marker-end="url(#u07fup_aG)" />
  <!-- Oznake (M, G, B) izvan rotiranog trupa, povezane svjetlim leaderima -->
  <!-- M leader: iz priblizne svjetske pozicije rotirane tocke (700,300 -> rot -8 oko (700,360) ~ (708,300)) -->
  <line x1="710" y1="294" x2="756" y2="270" stroke="#8e44ad" stroke-width="0.7" />
  <!-- G leader (teziste mase) -->
  <line x1="700" y1="333" x2="618" y2="298" stroke="#c0392b" stroke-width="0.7" />
  <!-- B leader (centar uzgona, u vodi izmedu trupa i lijevog ruba) -->
  <line x1="697" y1="370" x2="582" y2="392" stroke="#1e8449" stroke-width="0.7" />
  <!-- Spreg sila stvara povratni moment - oznaka luka momenta uz krmu -->
  <path d="M 826,322 A 28,28 0 0,1 842,358" fill="none" stroke="#5a6a78" stroke-width="1.4" marker-end="url(#u07fup_aGr)" />
  <!-- Kut theta izmedu vodne linije trupa i mirne povrsine, uz pramac -->
  <!-- Komentar pri dnu desnog donjeg panela (ispod vode, na narancastoj pozadini) -->
  <line x1="178" y1="98" x2="80" y2="98" stroke="#b7600c" stroke-width="0.7" />
  <line x1="178" y1="178" x2="80" y2="178" stroke="#b7600c" stroke-width="0.7" />
  <line x1="80" y1="98" x2="80" y2="178" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u07fup_dimL)" marker-end="url(#u07fup_dim)" />
  <line x1="76" y1="98" x2="84" y2="98" stroke="#b7600c" stroke-width="1.2" />
  <line x1="76" y1="178" x2="84" y2="178" stroke="#b7600c" stroke-width="1.2" />
  <line x1="178" y1="312" x2="46" y2="312" stroke="#b7600c" stroke-width="0.7" />
  <line x1="46" y1="98" x2="46" y2="312" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u07fup_dimL)" marker-end="url(#u07fup_dim)" />
  <line x1="42" y1="312" x2="50" y2="312" stroke="#b7600c" stroke-width="1.2" />
  <rect x="490" y="228" width="476" height="26" rx="10" fill="#b7600c" />
  <rect x="490" y="244" width="476" height="10" fill="#b7600c" />
  <path d="M 545,360 A 22,22 0 0,1 544,338" fill="none" stroke="#b7600c" stroke-width="1.4" />
  <text x="44" y="52" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Fizikalni model</text>
  <text x="44" y="69" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">Uronjeno prizmaticno tijelo → uzgon iz razlike tlakova</text>

  <text x="48" y="92" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1565c0">slobodna površina</text>

  <text x="248" y="172" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#1a2530">A</text>
  <text x="248" y="328" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#1a2530">A</text>

  <text x="248" y="142" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#1565c0">p₁ A</text>

  <text x="248" y="372" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#1565c0">p₂ A  (p₂ &gt; p₁)</text>

  <text x="256" y="241" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#c0392b">G<tspan baseline-shift="sub" font-size="0.7em">T</tspan></text>
  <text x="262" y="282" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#c0392b"><tspan font-weight="700">G</tspan> = mg</text>

  <text x="356" y="241" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#1e8449">B</text>
  <text x="356" y="200" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e8449"><tspan font-weight="700">F</tspan><tspan baseline-shift="sub" font-size="0.7em">U</tspan> = ρgV<tspan baseline-shift="sub" font-size="0.7em">ist</tspan></text>

  <text x="44" y="402" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78">Neto vertikalna sila: F<tspan baseline-shift="sub" font-size="0.7em">U</tspan> = (p₂ − p₁) A = ρ g (h₂ − h₁) A = ρ g V<tspan baseline-shift="sub" font-size="0.7em">ist</tspan></text>

  <text x="728" y="48" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Kljucne jednadzbe poglavlja</text>

  <text x="728" y="82" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Arhimedov zakon — sila uzgona</text>
  <text x="728" y="104" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">U</tspan> = ρ g V<tspan baseline-shift="sub" font-size="0.7em">ist</tspan></text>
  <text x="728" y="138" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Plivanje — vertikalna ravnoteza i gaz</text>
  <text x="728" y="160" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1a2530">ρ g V<tspan baseline-shift="sub" font-size="0.7em">ist</tspan> = G = mg   →   V<tspan baseline-shift="sub" font-size="0.7em">ist</tspan> = m / ρ</text>
  <text x="728" y="195" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-style="italic" text-anchor="middle" fill="#5a6a78">Tezina, istisnuti volumen i momentni raspored sila razdvajaju se kao tri stvari.</text>

  <text x="728" y="245" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">Inzenjerski kontekst — stabilnost plivajuceg tijela</text>

  <text x="711" y="362" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" font-weight="700" fill="#c0392b">G</text>

  <text x="736" y="342" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e8449"><tspan font-style="italic" font-weight="700">F</tspan><tspan baseline-shift="sub" font-size="0.7em">U</tspan></text>

  <text x="762" y="266" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" font-weight="700" fill="#8e44ad">M</text>
  <text x="762" y="280" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#8e44ad">metacentar</text>

  <text x="612" y="296" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="end" fill="#c0392b">teziste mase</text>

  <text x="578" y="394" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" font-weight="700" text-anchor="end" fill="#1e8449">B</text>
  <text x="578" y="384" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="end" fill="#1e8449">centar uzgona</text>

  <text x="852" y="338" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#5a6a78">povratni</text>
  <text x="852" y="352" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#5a6a78">moment</text>

  <text x="728" y="420" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" text-anchor="middle" fill="#5a6a78">M iznad G → GM &gt; 0: spreg sila G i F<tspan baseline-shift="sub" font-size="0.7em">U</tspan> vraca brod u ravnotezu.</text>
<text x="72" y="142" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="end" fill="#b7600c"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan></text>

  <text x="38" y="208" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="end" fill="#b7600c"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan></text>

  <text x="528" y="354" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#b7600c">θ</text>
  <text x="510" y="332" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#b7600c">nagib</text>

  </svg>