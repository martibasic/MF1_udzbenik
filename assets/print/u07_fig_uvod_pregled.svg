<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" role="img" aria-labelledby="u07fup_u7fpT" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u07fup_u7fpT">U07 – Uzgon, plivanje i stabilnost: pregled poglavlja</title>
  <defs>
    <pattern id="u07fup_u7fpH" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#8090a0"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#546e7a" stroke-width="1.8"/>
    </pattern>
    <linearGradient id="u07fup_u7fpWg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4eef8"/>
      <stop offset="100%" stop-color="#7ec8e8"/>
    </linearGradient>
    <marker id="u07fup_u7fpAG" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
    </marker>
    <marker id="u07fup_u7fpAR" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#b42318"/>
    </marker>
    <marker id="u07fup_u7fpAGr" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#546e7a"/>
    </marker>
    <marker id="u07fup_u7fpAGrR" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L8,3 z" fill="#546e7a"/>
    </marker>
  </defs>
  <rect width="940" height="420" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="372" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>

  <!-- LEFT PANEL: Fizikalni sustav -->
  <rect x="40" y="88" width="408" height="295" rx="10" fill="#eaf4fb" stroke="#b3d0e5" stroke-width="1.5"/>
  <text x="56" y="111" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">Fizikalni sustav</text>
  <!-- Water fill below surface y=162 -->
  <rect x="46" y="162" width="396" height="215" fill="url(#u07fup_u7fpWg)" opacity="0.55"/>
  <!-- Surface line -->
  <line x1="46" y1="162" x2="442" y2="162" stroke="#1565c0" stroke-width="2"/>
  <text x="50" y="157" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1565c0">p.p.</text>
  <!-- Submerged body (fully submerged) -->
  <rect x="172" y="188" width="158" height="96" rx="4" fill="#c8d6df" stroke="#546e7a" stroke-width="2"/>
  <!-- F_U arrow (green, upward from body center) -->
  <line x1="251" y1="284" x2="251" y2="156" stroke="#0f766e" stroke-width="3.5" marker-end="url(#u07fup_u7fpAG)"/>
  <text x="259" y="168" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#0f766e">F_U</text>
  <!-- G arrow (red, downward from body center) -->
  <line x1="251" y1="188" x2="251" y2="308" stroke="#b42318" stroke-width="3.5" marker-end="url(#u07fup_u7fpAR)"/>
  <text x="218" y="304" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#b42318">G</text>
  <!-- B marker (centar uzgona) -->
  <circle cx="251" cy="226" r="6" fill="#0f766e"/>
  <text x="262" y="230" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#0f766e">B</text>
  <!-- G_T marker (centar težišta) -->
  <rect x="245" y="242" width="12" height="12" fill="#b42318"/>
  <text x="262" y="252" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#b42318">G_T</text>
  <!-- h dim (depth of body top below surface) -->
  <line x1="336" y1="162" x2="336" y2="188" stroke="#546e7a" stroke-width="1.5" marker-start="url(#u07fup_u7fpAGrR)" marker-end="url(#u07fup_u7fpAGr)"/>
  <text x="342" y="180" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#546e7a">h</text>
  <!-- Stability note -->
  <text x="56" y="362" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677">G_T ispod B → statički stabilno (uronjen slučaj)</text>

  <!-- RIGHT-TOP PANEL: Jednadžbe -->
  <rect x="456" y="88" width="440" height="140" rx="10" fill="#eafaf1" stroke="#a7d4bc" stroke-width="1.5"/>
  <text x="472" y="111" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">Ključne jednadžbe</text>
  <text x="472" y="133" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#173043">F_U = ρ g V</text>
  <text x="472" y="153" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">F_U = G  →  plivanje (ravnoteža istisnine)</text>
  <text x="472" y="172" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">V_ist = m / ρ</text>
  <line x1="472" y1="181" x2="888" y2="181" stroke="#a7d4bc" stroke-width="1"/>
  <text x="472" y="198" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#516677">Bočni pomak: y_B = B(h_L − h_D) / (12 h_m)</text>
  <text x="472" y="217" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#516677">G_T ispod B  →  stabilno (potpuno uronjeno tijelo)</text>

  <!-- RIGHT-BOTTOM PANEL: Primjena -->
  <rect x="456" y="240" width="440" height="143" rx="10" fill="#fdf2e9" stroke="#e0c490" stroke-width="1.5"/>
  <text x="472" y="263" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">Primjena u tehnici</text>
  <text x="472" y="283" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#516677">Ponton  ·  plutajuća dizalica  ·  servisna platforma</text>
  <text x="472" y="300" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#516677">Nesimetrični teret → nagib → bočni pomak uzgona B</text>
  <!-- Water in bottom panel -->
  <rect x="462" y="322" width="428" height="56" fill="url(#u07fup_u7fpWg)" opacity="0.5"/>
  <line x1="462" y1="322" x2="884" y2="322" stroke="#1565c0" stroke-width="1.5"/>
  <!-- Tilted ponton (slightly tilted, load on right) -->
  <polygon points="468,332 870,323 870,309 468,318" fill="#b0bec5" stroke="#546e7a" stroke-width="1.5"/>
  <!-- Displaced load on right -->
  <rect x="818" y="295" width="36" height="14" rx="2" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <text x="825" y="306" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#173043">m_o</text>
  <!-- Force arrows on ponton -->
  <line x1="668" y1="319" x2="668" y2="337" stroke="#b42318" stroke-width="2" marker-end="url(#u07fup_u7fpAR)"/>
  <text x="672" y="336" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#b42318">G</text>
  <line x1="655" y1="332" x2="655" y2="314" stroke="#0f766e" stroke-width="2" marker-end="url(#u07fup_u7fpAG)"/>
  <text x="636" y="313" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#0f766e">F_U</text>
</svg>