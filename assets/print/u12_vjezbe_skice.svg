<svg xmlns="http://www.w3.org/2000/svg" width="940" height="740" viewBox="0 0 940 740">
<defs>
  <marker id="u12vs-ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0f766e"/></marker>
  <marker id="u12vs-ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#b42318"/></marker>
  <marker id="u12vs-ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#1d4ed8"/></marker>
  <marker id="u12vs-ao" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#b45309"/></marker>
  <linearGradient id="u12vs-watH" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#d4eef8"/><stop offset="100%" stop-color="#7ec8e8"/></linearGradient>
  <linearGradient id="u12vs-watV" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d4eef8"/><stop offset="100%" stop-color="#7ec8e8" stop-opacity="0.4"/></linearGradient>
  <pattern id="u12vs-hatch" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#8090a0"/>
    <line x1="0" y1="8" x2="8" y2="0" stroke="#546e7a" stroke-width="1.8"/>
  </pattern>
</defs>
<rect width="940" height="740" fill="#ffffff"/>
<rect x="24" y="24" width="892" height="692" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>
<text x="54" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#173043">Skice zadataka — Poglavlje 12</text>
<text x="54" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#516677">Pokretne lopatice i potisak — tipovi zadataka T1, T2, T3</text>

<!-- Grid: 2 columns × 3 rows. Col1: x=44–474, Col2: x=486–916. Row H=208px each, y_start=94 -->

<!-- ==================== ROW 1 ==================== -->

<!-- ---- T1-a: Horizontal jet on stationary flat plate (d=22, v=24) ---- -->
<rect x="44" y="94" width="430" height="208" rx="8" fill="#f8fafc" stroke="#d3d9de" stroke-width="1.5"/>
<text x="56" y="114" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#173043">T1 · a)  Mlaz na nepomičnu ravnu ploču</text>
<text x="56" y="130" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#516677">d = 22 mm,  v = 24 m/s  →  F = ?</text>
<!-- Nozzle -->
<rect x="62" y="162" width="48" height="44" rx="3" fill="url(#u12vs-hatch)"/>
<!-- Jet water -->
<rect x="110" y="170" width="100" height="28" fill="url(#u12vs-watH)" opacity="0.85"/>
<!-- Flat plate (vertical) -->
<rect x="210" y="148" width="16" height="90" rx="2" fill="url(#u12vs-hatch)"/>
<!-- v arrow -->
<line x1="118" y1="162" x2="204" y2="162" stroke="#0f766e" stroke-width="2.2" marker-end="url(#u12vs-ag)"/>
<text x="135" y="155" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#0f766e">v = 24 m/s</text>
<!-- F reaction arrow (red, leftward on plate) -->
<line x1="210" y1="193" x2="162" y2="193" stroke="#b42318" stroke-width="2.2" marker-end="url(#u12vs-ar)"/>
<text x="155" y="215" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#b42318">F = ?</text>
<!-- Splash arrows (upward and downward from plate center) -->
<line x1="210" y1="165" x2="210" y2="148" stroke="#0f766e" stroke-width="1.5" marker-end="url(#u12vs-ag)"/>
<line x1="210" y1="220" x2="210" y2="238" stroke="#0f766e" stroke-width="1.5" marker-end="url(#u12vs-ag)"/>
<!-- Formula -->
<text x="248" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#173043" font-style="italic">F = ρ A v²</text>
<text x="248" y="185" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#173043" font-style="italic">A = π d²/4</text>
<!-- Answer -->
<text x="248" y="215" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#6d2694">F = 220 N</text>
<!-- d=22mm label -->
<text x="106" y="215" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#546e7a">d=22mm</text>

<!-- ---- T1-b: Rectangular nozzle guide vane 110° deflection ---- -->
<rect x="486" y="94" width="430" height="208" rx="8" fill="#f8fafc" stroke="#d3d9de" stroke-width="1.5"/>
<text x="498" y="114" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#173043">T1 · b)  Vodilica mlaza — defleksija 110°</text>
<text x="498" y="130" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#516677">b=30 mm, h=16 mm, v=26 m/s  →  Fₓ, Fᵧ, R = ?</text>
<!-- Inlet pipe (tlocrt view) -->
<rect x="504" y="163" width="115" height="30" fill="url(#u12vs-watH)" opacity="0.85"/>
<rect x="504" y="155" width="115" height="8" fill="url(#u12vs-hatch)"/>
<rect x="504" y="193" width="115" height="8" fill="url(#u12vs-hatch)"/>
<!-- Simplified guide vane body: curve -->
<path d="M 619,163 C 660,163 678,180 670,205 L 654,200 C 660,182 648,174 619,171 Z" fill="url(#u12vs-hatch)"/>
<path d="M 619,193 C 660,193 690,208 685,240 L 668,236 C 670,218 654,208 619,201 Z" fill="url(#u12vs-hatch)"/>
<!-- Water in bend -->
<path d="M 619,171 C 652,171 668,186 661,212 L 643,208 C 648,192 638,178 619,178 Z" fill="url(#u12vs-watH)" opacity="0.80"/>
<!-- v1 arrow -->
<line x1="524" y1="156" x2="600" y2="156" stroke="#0f766e" stroke-width="2" marker-end="url(#u12vs-ag)"/>
<text x="524" y="150" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#0f766e">v₁=26 m/s</text>
<!-- Exit direction: 110° from +x. In SVG: 110° CCW from +x = direction (cos110°,−sin110°)=(−0.342,−0.940) = upper-left-ish, more toward −y -->
<!-- v2 arrow going approx from exit area at direction −0.342,−0.940: from (655,210) 45px: (655−15,210−42)=(640,168) -->
<line x1="652" y1="218" x2="638" y2="176" stroke="#0f766e" stroke-width="2" marker-end="url(#u12vs-ag)"/>
<text x="618" y="174" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#0f766e">v₂=26 m/s</text>
<!-- Angle β = 110° -->
<text x="620" y="148" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#173043" font-style="italic">β=110°</text>
<!-- Force R arrow (resultant on vane) -->
<text x="694" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#173043" font-style="italic">Fₓ = ṁ(v₂ₓ−v₁)</text>
<text x="694" y="183" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#173043" font-style="italic">Fᵧ = ṁ·v₂ᵧ</text>
<text x="694" y="215" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#6d2694">Rješiti!</text>

<!-- ==================== ROW 2 ==================== -->

<!-- ---- T2-a: Moving curved blade 150° deflection ---- -->
<rect x="44" y="316" width="430" height="208" rx="8" fill="#f8fafc" stroke="#d3d9de" stroke-width="1.5"/>
<text x="56" y="336" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#173043">T2 · a)  Pokretna lopatica — defleksija 150°</text>
<text x="56" y="352" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#516677">c₁=32 m/s, u=12 m/s, ṁ=18 kg/s  →  Ft, P = ?</text>
<!-- Nozzle -->
<rect x="62" y="384" width="42" height="38" rx="3" fill="url(#u12vs-hatch)"/>
<!-- Jet -->
<rect x="104" y="388" width="75" height="30" fill="url(#u12vs-watH)" opacity="0.85"/>
<!-- Moving curved blade -->
<path d="M 179,388 C 215,388 240,380 250,368 C 260,356 265,370 255,382 C 245,394 224,408 179,418 Z" fill="url(#u12vs-hatch)"/>
<path d="M 184,394 C 215,394 236,386 244,375 C 252,364 256,374 248,384 C 240,394 220,408 184,412 Z" fill="url(#u12vs-watH)" opacity="0.80"/>
<!-- c1 arrow -->
<line x1="110" y1="382" x2="170" y2="382" stroke="#0f766e" stroke-width="2.2" marker-end="url(#u12vs-ag)"/>
<text x="112" y="375" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#0f766e">c₁=32 m/s</text>
<!-- u arrow (blade velocity, rightward) -->
<line x1="179" y1="430" x2="235" y2="430" stroke="#b45309" stroke-width="2" marker-end="url(#u12vs-ao)"/>
<text x="183" y="445" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#b45309">u=12 m/s</text>
<!-- w1 dashed arrow -->
<line x1="110" y1="372" x2="150" y2="372" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="4,2" marker-end="url(#u12vs-ab)"/>
<text x="110" y="366" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#1d4ed8">w₁=20 m/s</text>
<!-- Exit: 150° in relative frame from +x (almost 180°, so nearly reversed) direction: (cos150°,sin150°)=(−0.866,+0.5) physics = (−0.866,−0.5) SVG = upper-left steep -->
<!-- Exit water from blade tip: approximately at (252,374) going (−0.866,−0.5) for 35px: (221,356) -->
<line x1="252" y1="374" x2="222" y2="357" stroke="#0f766e" stroke-width="2" marker-end="url(#u12vs-ag)"/>
<!-- Force Ft: rightward -->
<line x1="260" y1="393" x2="320" y2="393" stroke="#b42318" stroke-width="2.2" marker-end="url(#u12vs-ar)"/>
<text x="265" y="386" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#b42318">Ft = ?</text>
<!-- Formula box -->
<rect x="342" y="370" width="122" height="76" rx="6" fill="#fffef6" stroke="#c49a0a" stroke-width="1.2"/>
<text x="352" y="388" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#173043">w₁ = c₁ − u = 20</text>
<text x="352" y="404" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#173043">Ft = ṁ·Δw</text>
<text x="352" y="420" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#173043">P = Ft · u</text>
<text x="352" y="438" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#6d2694">Rješiti!</text>

<!-- ---- T2-b: Pelton rotor (R=0.42, ṁ=24, vu1=28, vu2=6) ---- -->
<rect x="486" y="316" width="430" height="208" rx="8" fill="#f8fafc" stroke="#d3d9de" stroke-width="1.5"/>
<text x="498" y="336" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#173043">T2 · b)  Peltonov rotor — moment i snaga</text>
<text x="498" y="352" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#516677">R=0,42 m, ṁ=24 kg/s, v_u1=28 m/s, v_u2=6 m/s  →  Ft, M = ?</text>
<!-- Pelton rotor circle -->
<circle cx="614" cy="420" r="72" fill="none" stroke="#2d3a40" stroke-width="2"/>
<circle cx="614" cy="420" r="14" fill="url(#u12vs-hatch)" stroke="#2d3a40" stroke-width="1.5"/>
<!-- Spokes -->
<line x1="614" y1="406" x2="614" y2="350" stroke="#2d3a40" stroke-width="1.5"/>
<line x1="614" y1="434" x2="614" y2="492" stroke="#2d3a40" stroke-width="1.5"/>
<line x1="600" y1="420" x2="544" y2="420" stroke="#2d3a40" stroke-width="1.5"/>
<line x1="628" y1="420" x2="684" y2="420" stroke="#2d3a40" stroke-width="1.5"/>
<!-- Bucket at top -->
<path d="M 601,348 L 627,348 L 627,366 C 627,374 601,374 601,366 Z" fill="url(#u12vs-hatch)"/>
<!-- Jet c1 from left going right at top -->
<rect x="508" y="348" width="93" height="18" fill="url(#u12vs-watH)" opacity="0.85"/>
<line x1="520" y1="344" x2="590" y2="344" stroke="#0f766e" stroke-width="2" marker-end="url(#u12vs-ag)"/>
<text x="520" y="337" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#0f766e">v_u1=28 m/s</text>
<!-- u arrow (rightward at bucket) -->
<line x1="626" y1="370" x2="680" y2="370" stroke="#b45309" stroke-width="2" marker-end="url(#u12vs-ao)"/>
<text x="630" y="366" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#b45309">u</text>
<!-- c2 exit (much smaller, going back) -->
<line x1="601" y1="357" x2="571" y2="357" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#u12vs-ag)"/>
<text x="552" y="354" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#0f766e">v_u2=6</text>
<!-- Formula -->
<text x="700" y="380" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#173043" font-style="italic">Ft = ṁ(v_u1−v_u2)</text>
<text x="700" y="398" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#173043" font-style="italic">M = Ft · R</text>
<text x="700" y="425" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#6d2694">Rješiti!</text>
<text x="700" y="444" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#546e7a" font-style="italic">R = 0,42 m</text>

<!-- ==================== ROW 3 ==================== -->

<!-- ---- T3-a: 3-nozzle thrust module ---- -->
<rect x="44" y="538" width="430" height="178" rx="8" fill="#f8fafc" stroke="#d3d9de" stroke-width="1.5"/>
<text x="56" y="558" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#173043">T3 · a)  Trijadna mlazna naprava (3 sapnice)</text>
<text x="56" y="574" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#516677">d = 30 mm,  v = 42 m/s  →  Fukupna, P = ?</text>
<!-- Cylindrical vessel (simplified) -->
<rect x="130" y="586" width="90" height="110" rx="6" fill="url(#u12vs-hatch)"/>
<!-- 3 nozzles on sides (simplified: one each left, right, bottom): 
   Actually for a thrust module all pointing in same direction or different to create rotation?
   For simplicity: 3 nozzles pointing downward (like a jet platform) or all pointing right (creating thrust).
   The problem says "thrust module" so I'll show 3 nozzles pointing the same direction (e.g., downward-left) for combined thrust. -->
<!-- 3 nozzles at bottom of vessel, pointing down -->
<rect x="150" y="696" width="10" height="12" rx="1" fill="#2d3a40"/>
<rect x="170" y="696" width="10" height="12" rx="1" fill="#2d3a40"/>
<rect x="190" y="696" width="10" height="12" rx="1" fill="#2d3a40"/>
<!-- Jet arrows from nozzles -->
<line x1="155" y1="708" x2="155" y2="690" stroke="#1d4ed8" stroke-width="1.8" transform="rotate(180,155,700)" marker-end="url(#u12vs-ab)"/>
<line x1="175" y1="708" x2="175" y2="690" stroke="#1d4ed8" stroke-width="1.8" transform="rotate(180,175,700)" marker-end="url(#u12vs-ab)"/>
<line x1="195" y1="708" x2="195" y2="690" stroke="#1d4ed8" stroke-width="1.8" transform="rotate(180,195,700)" marker-end="url(#u12vs-ab)"/>
<!-- v=42 label -->
<text x="212" y="705" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#1d4ed8">v=42 m/s</text>
<!-- Total thrust arrow (upward) -->
<line x1="175" y1="586" x2="175" y2="548" stroke="#b42318" stroke-width="2.5" marker-end="url(#u12vs-ar)"/>
<text x="180" y="566" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#b42318">F = ?</text>
<!-- Formula -->
<text x="248" y="610" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#173043" font-style="italic">F = n_sap · ρ A v²</text>
<text x="248" y="628" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#173043" font-style="italic">P = F · v</text>
<text x="248" y="660" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#6d2694">Rješiti!</text>
<text x="248" y="678" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#546e7a">A = π(0,030)²/4</text>

<!-- ---- T3-b: 4-nozzle hovering platform ---- -->
<rect x="486" y="538" width="430" height="178" rx="8" fill="#f8fafc" stroke="#d3d9de" stroke-width="1.5"/>
<text x="498" y="558" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#173043">T3 · b)  Lebdeća platforma (4 sapnice)</text>
<text x="498" y="574" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#516677">m=110 kg, d=28 mm, v=36 m/s  →  Fp, m_max, a = ?</text>
<!-- Platform and nozzles (simpler version) -->
<rect x="570" y="610" width="130" height="14" rx="2" fill="url(#u12vs-hatch)"/>
<!-- 4 nozzles -->
<rect x="578" y="624" width="8" height="6" rx="1" fill="#2d3a40"/>
<rect x="598" y="624" width="8" height="6" rx="1" fill="#2d3a40"/>
<rect x="644" y="624" width="8" height="6" rx="1" fill="#2d3a40"/>
<rect x="664" y="624" width="8" height="6" rx="1" fill="#2d3a40"/>
<!-- Jets (downward) -->
<line x1="582" y1="630" x2="582" y2="680" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#u12vs-ab)"/>
<line x1="602" y1="630" x2="602" y2="680" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#u12vs-ab)"/>
<line x1="648" y1="630" x2="648" y2="680" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#u12vs-ab)"/>
<line x1="668" y1="630" x2="668" y2="680" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#u12vs-ab)"/>
<!-- v = 36 label -->
<text x="676" y="660" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#1d4ed8">v=36 m/s</text>
<!-- Fp arrow (upward, large) -->
<line x1="635" y1="610" x2="635" y2="562" stroke="#0f766e" stroke-width="3" marker-end="url(#u12vs-ag)"/>
<text x="642" y="590" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#0f766e">Fp=?</text>
<!-- G arrow (downward) -->
<line x1="615" y1="624" x2="615" y2="674" stroke="#b42318" stroke-width="2" marker-end="url(#u12vs-ar)"/>
<text x="590" y="665" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#b42318">G=mg</text>
<!-- Formula box -->
<rect x="735" y="565" width="170" height="98" rx="6" fill="#fffef6" stroke="#c49a0a" stroke-width="1.2"/>
<text x="745" y="582" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#173043">A = π·(0,028)²/4</text>
<text x="745" y="599" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#173043">Fp = 4 ρ A v²</text>
<text x="745" y="616" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#173043">m_max: Fp = m_max·g</text>
<text x="745" y="633" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#173043">a: FR = Fp − mg</text>
<text x="745" y="655" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#6d2694">Rješiti!</text>
</svg>