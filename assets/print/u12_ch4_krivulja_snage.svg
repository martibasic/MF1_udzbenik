<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="u12c4ks_title u12c4ks_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:900px;height:auto;">
  <title id="u12c4ks_title">Krivulja snage P(u) Peltonove lopatice s maksimumom pri u = c1/2</title>
  <desc id="u12c4ks_desc">Lijevo: parabolicna krivulja P(u) = 109,9 (c1 - u) u s nulama na u = 0 i u = c1 = 30 m/s, maksimumom P_max priblizno 24,7 kW pri u_opt = 15 m/s, te oznacenim radnim tockama na c1/4, c1/3, c1/2, 2c1/3. Desno: panel s funkcionalnim izrazima za F(u), P(u), uvjetom dP/du = 0 i rezultatima P_max, omega_opt, n_opt i eta_max.</desc>

  <defs>
    <marker id="u12c4ks_arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1e8449" />
    </marker>
    <marker id="u12c4ks_arx" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#3a4a56" />
    </marker>
    <marker id="u12c4ks_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u12c4ks_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
  </defs>

  <!-- okvirni paneli -->
  <rect x="16" y="20" width="608" height="464" rx="14" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.4" />
  <rect x="640" y="20" width="304" height="464" rx="14" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.4" />

  <!-- ===================== LIJEVI PANEL: GRAF P(u) ===================== -->
  <!-- pozadina grafa -->
  <rect x="100" y="100" width="500" height="300" fill="#ffffff" stroke="#d4e3f0" stroke-width="1" />

  <!-- horizontalne gridlinije y = 0, 5, 10, 15, 20, 25 kW -->
  <line x1="100" y1="380" x2="600" y2="380" stroke="#e8eef3" stroke-width="0.8" />
  <line x1="100" y1="331.79" x2="600" y2="331.79" stroke="#e8eef3" stroke-width="0.8" />
  <line x1="100" y1="283.57" x2="600" y2="283.57" stroke="#e8eef3" stroke-width="0.8" />
  <line x1="100" y1="235.36" x2="600" y2="235.36" stroke="#e8eef3" stroke-width="0.8" />
  <line x1="100" y1="187.14" x2="600" y2="187.14" stroke="#e8eef3" stroke-width="0.8" />
  <line x1="100" y1="138.93" x2="600" y2="138.93" stroke="#e8eef3" stroke-width="0.8" />

  <!-- vertikalne gridlinije na c1/4, c1/3, c1/2, 2c1/3 -->
  <line x1="242.5" y1="100" x2="242.5" y2="380" stroke="#eef3f7" stroke-width="0.7" stroke-dasharray="3,4" />
  <line x1="280" y1="100" x2="280" y2="380" stroke="#eef3f7" stroke-width="0.7" stroke-dasharray="3,4" />
  <line x1="355" y1="100" x2="355" y2="380" stroke="#eef3f7" stroke-width="0.7" stroke-dasharray="3,4" />
  <line x1="430" y1="100" x2="430" y2="380" stroke="#eef3f7" stroke-width="0.7" stroke-dasharray="3,4" />

  <!-- y-os -->
  <line x1="100" y1="380" x2="100" y2="90" stroke="#3a4a56" stroke-width="1.4" marker-end="url(#u12c4ks_arx)" />
  <!-- x-os -->
  <line x1="100" y1="380" x2="610" y2="380" stroke="#3a4a56" stroke-width="1.4" marker-end="url(#u12c4ks_arx)" />

  <!-- y-os: oznake (kW) -->
  <!-- tik-crte y-osi -->
  <line x1="96" y1="380" x2="100" y2="380" stroke="#3a4a56" stroke-width="1.2" />
  <line x1="96" y1="331.79" x2="100" y2="331.79" stroke="#3a4a56" stroke-width="1.2" />
  <line x1="96" y1="283.57" x2="100" y2="283.57" stroke="#3a4a56" stroke-width="1.2" />
  <line x1="96" y1="235.36" x2="100" y2="235.36" stroke="#3a4a56" stroke-width="1.2" />
  <line x1="96" y1="187.14" x2="100" y2="187.14" stroke="#3a4a56" stroke-width="1.2" />
  <line x1="96" y1="138.93" x2="100" y2="138.93" stroke="#3a4a56" stroke-width="1.2" />

  <!-- naslov y-osi -->
  <!-- x-os: oznake (m/s) - u, c1/4, c1/3, c1/2, 2c1/3, c1 -->
  <line x1="100" y1="380" x2="100" y2="384" stroke="#3a4a56" stroke-width="1.2" />
  <line x1="242.5" y1="380" x2="242.5" y2="384" stroke="#3a4a56" stroke-width="1.2" />
  <line x1="280" y1="380" x2="280" y2="384" stroke="#3a4a56" stroke-width="1.2" />
  <line x1="355" y1="380" x2="355" y2="384" stroke="#3a4a56" stroke-width="1.2" />
  <line x1="430" y1="380" x2="430" y2="384" stroke="#3a4a56" stroke-width="1.2" />
  <line x1="580" y1="380" x2="580" y2="384" stroke="#3a4a56" stroke-width="1.2" />

  <!-- sekundarne oznake na x-osi (frakcije c1) ispod -->
  <!-- naslov x-osi -->
  <!-- KRIVULJA P(u) - parabola - kvadratna Bezier path s tocno vrhom u (355, 100.71) gdje je P=24.73 kW -->
  <!-- Stvarni vrh: u=15, P=24.7305 kW => y = 380 - 24.7305*9.643 = 380 - 238.46 = 141.54 -->
  <!-- Za kvadratnu Bezier od (100,380) do (580,380) s kontrolnom tockom u (340, y_ctrl), vrh je na sredini i y_vrh = (y_start + 2*y_ctrl + y_end)/4. Treba y_vrh=141.54, pa y_ctrl = (4*141.54 - 380 - 380)/2 = -96.92 -->
  <path d="M 100,380 Q 340,-96.92 580,380" fill="none" stroke="#1e8449" stroke-width="2.6" />

  <!-- Radne tocke kao puni krugovi -->
  <!-- u=0, P=0 -->
  <circle cx="100" cy="380" r="3.5" fill="#1e8449" stroke="#ffffff" stroke-width="1" />
  <!-- u=c1/4=7.5, P=18.55 -->
  <circle cx="242.5" cy="201.16" r="4" fill="#1e8449" stroke="#ffffff" stroke-width="1" />
  <!-- u=c1/3=10, P=21.98 -->
  <circle cx="280" cy="168.06" r="4" fill="#1e8449" stroke="#ffffff" stroke-width="1" />
  <!-- u=c1/2=15, P_max=24.73 - veca crvena -->
  <circle cx="355" cy="141.54" r="5.5" fill="#c0392b" stroke="#ffffff" stroke-width="1.4" />
  <!-- u=2c1/3=20, P=21.98 -->
  <circle cx="430" cy="168.06" r="4" fill="#1e8449" stroke="#ffffff" stroke-width="1" />
  <!-- u=c1=30, P=0 -->
  <circle cx="580" cy="380" r="3.5" fill="#1e8449" stroke="#ffffff" stroke-width="1" />

  <!-- Oznaka P_max - callout pored maksimuma -->
  <line x1="355" y1="141.54" x2="355" y2="115" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="3,3" />
  <rect x="288" y="92" width="134" height="26" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3" />
  <!-- vodoravna isprekidana linija do y-osi za citanje P_max -->
  <line x1="100" y1="141.54" x2="355" y2="141.54" stroke="#c0392b" stroke-width="0.7" stroke-dasharray="3,3" />

  <!-- Oznake brojcanih vrijednosti pored ostalih tocaka -->
  <!-- 18,5 kW za c1/4 -->
  <!-- 22,0 kW za c1/3 -->
  <!-- 22,0 kW za 2c1/3 -->
  <!-- u_opt = c1/2 vertikalna iskazna linija - debela crvena isprekidana -->
  <line x1="355" y1="380" x2="355" y2="141.54" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.55" />

  <!-- Oznaka u_opt na x-osi -->
  <rect x="324" y="425" width="62" height="22" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.2" />
  <!-- Simetrija - mala vodoravna kota izmedju c1/3 i 2c1/3 -->
  <!-- ===================== DESNI PANEL: FORMULE I REZULTATI ===================== -->

  <!-- Glavni panel formula -->
  <rect x="656" y="40" width="272" height="288" rx="10" fill="#f4f9fd" stroke="#1565c0" stroke-width="1.4" />
  <rect x="656" y="40" width="272" height="30" rx="10" fill="#1565c0" />
  <rect x="656" y="56" width="272" height="14" fill="#1565c0" />
  <!-- Blok 1: maseni protok -->
  <line x1="672" y1="118" x2="912" y2="118" stroke="#c8d6e4" stroke-width="1" />

  <!-- Blok 2: sila F(u) -->
  <line x1="672" y1="180" x2="912" y2="180" stroke="#c8d6e4" stroke-width="1" />

  <!-- Blok 3: snaga P(u) -->
  <line x1="672" y1="244" x2="912" y2="244" stroke="#c8d6e4" stroke-width="1" />

  <!-- Blok 4: uvjet optimuma -->
  <!-- REZULTATI badge -->
  <rect x="656" y="344" width="272" height="128" rx="9" fill="#e8f5e9" stroke="#1e8449" stroke-width="1.4" />
  <line x1="280" y1="455" x2="430" y2="455" stroke="#b7600c" stroke-width="1.2" stroke-dasharray="2,3" />
  <text x="44" y="52" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Krivulja snage <tspan font-style="italic">P</tspan>(<tspan font-style="italic">u</tspan>) Peltonove lopatice</text>
  <text x="44" y="70" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78"><tspan font-style="italic">c</tspan>₁ = 30 m/s  ·  β₂ = 165°  ·  <tspan font-style="italic">k</tspan> = 0,90  ·  ρ = 998 kg/m³  ·  <tspan font-style="italic">R</tspan> = 0,20 m</text>

  <text x="92" y="384" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="end" fill="#3a4a56">0</text>
  <text x="92" y="335.79" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="end" fill="#3a4a56">5</text>
  <text x="92" y="287.57" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="end" fill="#3a4a56">10</text>
  <text x="92" y="239.36" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="end" fill="#3a4a56">15</text>
  <text x="92" y="191.14" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="end" fill="#3a4a56">20</text>
  <text x="92" y="142.93" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="end" fill="#3a4a56">25</text>
  <text x="50" y="100" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1a2530"><tspan font-style="italic">P</tspan> [kW]</text>

  <text x="100" y="397" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#3a4a56">0</text>
  <text x="242.5" y="397" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#3a4a56">7,5</text>
  <text x="280" y="397" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#3a4a56">10</text>
  <text x="355" y="397" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#3a4a56">15</text>
  <text x="430" y="397" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#3a4a56">20</text>
  <text x="580" y="397" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#3a4a56">30</text>

  <text x="242.5" y="412" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#8a7050">c₁/4</text>
  <text x="280" y="412" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#8a7050">c₁/3</text>
  <text x="355" y="412" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#c0392b" font-weight="700">c₁/2</text>
  <text x="430" y="412" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#8a7050">2c₁/3</text>
  <text x="580" y="412" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#8a7050">c₁</text>

  <text x="600" y="438" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="end" fill="#1a2530"><tspan font-style="italic">u</tspan> [m/s]</text>

  <text x="355" y="110" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b"><tspan font-style="italic">P</tspan><tspan baseline-shift="sub" font-size="0.7em">max</tspan> ≈ 24,7 kW</text>

  <text x="248" y="195" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#1e8449">18,5</text>
  <text x="286" y="161" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#1e8449">22,0</text>
  <text x="436" y="161" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#1e8449">22,0</text>

  <text x="355" y="441" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#c0392b"><tspan font-style="italic">u</tspan><tspan baseline-shift="sub" font-size="0.7em">opt</tspan> = 15</text>

  <text x="792" y="60" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">Model snage Peltonove lopatice</text>

  <text x="792" y="88" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#5a6a78">Maseni protok mlaza</text>
  <text x="792" y="108" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530">ṁ = ρ <tspan font-style="italic">A c</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> ≈ 58,77 kg/s</text>
  <text x="792" y="134" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#5a6a78">Sila na lopatice</text>
  <text x="792" y="154" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">F</tspan>(<tspan font-style="italic">u</tspan>) = ṁ (<tspan font-style="italic">c</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> − <tspan font-style="italic">u</tspan>)(1 − <tspan font-style="italic">k</tspan> cos β<tspan baseline-shift="sub" font-size="0.7em">2</tspan>)</text>
  <text x="792" y="170" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#5a6a78">(1 − <tspan font-style="italic">k</tspan> cos β<tspan baseline-shift="sub" font-size="0.7em">2</tspan>) = 1,870</text>
  <text x="792" y="196" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#5a6a78">Snaga predana rotoru</text>
  <text x="792" y="216" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">P</tspan>(<tspan font-style="italic">u</tspan>) = <tspan font-style="italic">F</tspan>(<tspan font-style="italic">u</tspan>) · <tspan font-style="italic">u</tspan></text>
  <text x="792" y="234" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1565c0">≈ 109,9 (<tspan font-style="italic">c</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> − <tspan font-style="italic">u</tspan>) <tspan font-style="italic">u</tspan>  [W]</text>
  <text x="792" y="260" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#5a6a78">Uvjet maksimuma</text>
  <text x="792" y="280" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530">d<tspan font-style="italic">P</tspan>/d<tspan font-style="italic">u</tspan> = 0  →  <tspan font-style="italic">c</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> − 2<tspan font-style="italic">u</tspan> = 0</text>
  <text x="792" y="300" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b"><tspan font-style="italic">u</tspan><tspan baseline-shift="sub" font-size="0.7em">opt</tspan> = <tspan font-style="italic">c</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan>/2 = 15 m/s</text>
  <text x="792" y="318" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" text-anchor="middle" fill="#5a6a78">univerzalno za Peltonovu turbinu</text>

  <text x="792" y="362" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#5a6a78">REZULTATI</text>

  <text x="670" y="384" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530"><tspan font-style="italic">P</tspan><tspan baseline-shift="sub" font-size="0.7em">max</tspan></text>
  <text x="922" y="384" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="end" fill="#c0392b">≈ 24,7 kW</text>

  <text x="670" y="404" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530">ω<tspan baseline-shift="sub" font-size="0.7em">opt</tspan> = <tspan font-style="italic">u</tspan><tspan baseline-shift="sub" font-size="0.7em">opt</tspan>/<tspan font-style="italic">R</tspan></text>
  <text x="922" y="404" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="end" fill="#1e8449">= 75 rad/s</text>

  <text x="670" y="424" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530"><tspan font-style="italic">n</tspan><tspan baseline-shift="sub" font-size="0.7em">opt</tspan></text>
  <text x="922" y="424" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="end" fill="#1e8449">≈ 716 min⁻¹</text>

  <text x="670" y="444" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530"><tspan font-style="italic">P</tspan><tspan baseline-shift="sub" font-size="0.7em">hid</tspan> = ½ ṁ <tspan font-style="italic">c</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan>²</text>
  <text x="922" y="444" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="end" fill="#1565c0">≈ 26,4 kW</text>

  <text x="670" y="464" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530">η<tspan baseline-shift="sub" font-size="0.7em">max</tspan> = <tspan font-style="italic">P</tspan><tspan baseline-shift="sub" font-size="0.7em">max</tspan>/<tspan font-style="italic">P</tspan><tspan baseline-shift="sub" font-size="0.7em">hid</tspan></text>
  <text x="922" y="464" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="end" fill="#1e8449">≈ 93,6 %</text>
<text x="355" y="471" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#b7600c">simetrija oko <tspan font-style="italic">u</tspan><tspan baseline-shift="sub" font-size="0.7em">opt</tspan>: <tspan font-style="italic">P</tspan>(c₁/3) = <tspan font-style="italic">P</tspan>(2c₁/3) ≈ 22,0 kW</text>

  </svg>