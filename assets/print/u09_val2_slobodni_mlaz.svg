<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="u09v2_title u09v2_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:900px;height:auto;">
<title id="u09v2_title">Domet mlaza za tri položaja otvora</title><desc id="u09v2_desc">Tri alternativna položaja malog otvora na stijenci spremnika. Otvori su stvarno prekinuti u stijenci. Putanje počinju vodoravno i slijede y = g x²/(2 v₀²); visine i dometi imaju jednaku skalu. Otvori na 1 i 3 m imaju isti domet, a onaj na 2 m najveći.</desc>
