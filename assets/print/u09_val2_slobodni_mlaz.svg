<text x="536" y="77" font-size="13" fill="#1565c0" text-anchor="start" font-weight="700">Torricelli i vodoravni hitac</text>
<text x="536" y="100" font-size="12" fill="#1a2530" text-anchor="start">v₀ = √[2g(H − h)]</text>
<text x="536" y="119" font-size="12" fill="#1a2530" text-anchor="start">t = √(2h/g)</text>
<text x="536" y="138" font-size="12" fill="#1a2530" text-anchor="start">x = v₀t = 2√[h(H − h)]</text>
<text x="536" y="157" font-size="12" fill="#1a2530" text-anchor="start">h i H − h daju isti domet.</text>
<rect x="524" y="211" width="342" height="128" rx="7" fill="#f4f9fd" stroke="#1565c0" stroke-width="1.2"/>
<text x="536" y="231" font-size="13" fill="#1565c0" text-anchor="start" font-weight="700">Rezultati za H = 4,0 m</text>
