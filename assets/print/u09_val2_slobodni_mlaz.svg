<text x="712" y="298" font-size="12" fill="#1a2530" text-anchor="start">0,639</text>
<text x="798" y="298" font-size="12" fill="#1a2530" text-anchor="start">4,00</text>
<text x="548" y="319" font-size="12" fill="#1a2530" text-anchor="start">3,0</text>
