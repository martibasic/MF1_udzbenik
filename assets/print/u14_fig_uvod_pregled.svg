<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" role="img" aria-labelledby="u14fup_title u14fup_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="u14fup_title">U14 - Pregled poglavlja: bezdimenzijski brojevi, dimenzijska analiza i slicnost</title>
  <desc id="u14fup_desc">Tri panela: lijevo prepoznavanje dominantne sile kao vage izmedu inercije i viskoznosti, gravitacije ili napetosti; sredina kljucni brojevi Re, Fr, Eu, We i Ma; desno primjena u aerotunelu gdje jednak Reynoldsov broj daje jednak koeficijent otpora modela i prototipa.</desc>
  <defs>
    <marker id="u14fup_aR" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#c0392b" />
    </marker>
  </defs>

  <rect width="980" height="460" fill="#ffffff" />

  <!-- ===================== PANEL 1: dominantna sila ===================== -->
  <rect x="24" y="28" width="306" height="404" rx="10" fill="#f8fbff" stroke="#c0392b" stroke-width="1.3" />
  <rect x="24" y="28" width="306" height="30" rx="10" fill="#c0392b" />
  <rect x="24" y="50" width="306" height="8" fill="#c0392b" />
  <text x="177" y="48" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">Koja sila dominira?</text>

  <!-- vaga 1: inercija vs viskoznost -->
  <text x="44" y="92" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#3a4a56">inercija ↔ viskoznost</text>
  <rect x="44" y="100" width="133" height="24" fill="#fadbd8" stroke="#c0392b" stroke-width="1" />
  <rect x="177" y="100" width="133" height="24" fill="#e5e9ec" stroke="#5d6d7e" stroke-width="1" />
  <text x="177" y="144" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-style="italic" font-weight="700" text-anchor="middle" fill="#c0392b">Re = ρvL / μ</text>

  <!-- vaga 2: inercija vs gravitacija -->
  <text x="44" y="186" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#3a4a56">inercija ↔ gravitacija</text>
  <rect x="44" y="194" width="133" height="24" fill="#fadbd8" stroke="#c0392b" stroke-width="1" />
  <rect x="177" y="194" width="133" height="24" fill="#f3eafa" stroke="#8e44ad" stroke-width="1" />
  <text x="177" y="238" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-style="italic" font-weight="700" text-anchor="middle" fill="#8e44ad">Fr = v / √(gL)</text>

  <!-- vaga 3: inercija vs napetost -->
  <text x="44" y="280" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#3a4a56">inercija ↔ napetost</text>
  <rect x="44" y="288" width="133" height="24" fill="#fadbd8" stroke="#c0392b" stroke-width="1" />
  <rect x="177" y="288" width="133" height="24" fill="#eaf3fb" stroke="#1565c0" stroke-width="1" />
  <text x="177" y="332" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-style="italic" font-weight="700" text-anchor="middle" fill="#1565c0">We = ρv²L / σ</text>

  <text x="177" y="386" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#5a6a78">Veći omjer → inercija</text>
  <text x="177" y="404" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#5a6a78">nadvladava drugu silu</text>

  <!-- ===================== PANEL 2: kljucni brojevi ===================== -->
  <rect x="342" y="28" width="306" height="404" rx="10" fill="#fcfdff" stroke="#1565c0" stroke-width="1.3" />
  <rect x="342" y="28" width="306" height="30" rx="10" fill="#1565c0" />
  <rect x="342" y="50" width="306" height="8" fill="#1565c0" />
  <text x="495" y="48" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">Ključni brojevi</text>

  <rect x="362" y="76" width="266" height="60" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.1" />
  <text x="378" y="104" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-style="italic" font-weight="700" fill="#c0392b">Re = vL / ν</text>
  <text x="378" y="124" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">režim strujanja</text>

  <rect x="362" y="144" width="266" height="60" rx="6" fill="#f3eafa" stroke="#8e44ad" stroke-width="1.1" />
  <text x="378" y="172" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-style="italic" font-weight="700" fill="#8e44ad">Fr = v / √(gL)</text>
  <text x="378" y="192" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">slobodna površina</text>

  <rect x="362" y="212" width="266" height="60" rx="6" fill="#eaf3fb" stroke="#1565c0" stroke-width="1.1" />
  <text x="378" y="240" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-style="italic" font-weight="700" fill="#1565c0">Eu = Δp / (ρv²)</text>
  <text x="378" y="260" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">tlak, kavitacija</text>

  <rect x="362" y="280" width="266" height="60" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="1.1" />
  <text x="378" y="308" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-style="italic" font-weight="700" fill="#1e8449">We = ρv²L / σ</text>
  <text x="378" y="328" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">kapljice, mlaz</text>

  <rect x="362" y="348" width="266" height="60" rx="6" fill="#f4f6f7" stroke="#5d6d7e" stroke-width="1.1" />
  <text x="378" y="376" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-style="italic" font-weight="700" fill="#5d6d7e">Ma = v / a</text>
  <text x="378" y="396" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">stlačivost (Ma &lt; 0,3)</text>

  <!-- ===================== PANEL 3: aerotunel ===================== -->
  <rect x="660" y="28" width="296" height="404" rx="10" fill="#fcfdff" stroke="#1e8449" stroke-width="1.3" />
  <rect x="660" y="28" width="296" height="30" rx="10" fill="#1e8449" />
  <rect x="660" y="50" width="296" height="8" fill="#1e8449" />
  <text x="808" y="48" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">Model ↔ prototip (aerotunel)</text>

  <!-- aerotunel kanal -->
  <rect x="680" y="150" width="256" height="150" rx="4" fill="#eef6f1" stroke="#3a4a56" stroke-width="1.4" />
  <!-- strujanje -->
  <line x1="690" y1="180" x2="740" y2="180" stroke="#c0392b" stroke-width="2.4" marker-end="url(#u14fup_aR)" />
  <line x1="690" y1="210" x2="740" y2="210" stroke="#c0392b" stroke-width="2.4" marker-end="url(#u14fup_aR)" />
  <!-- auto silueta -->
  <path d="M745,278 Q748,250 772,246 L800,224 Q828,216 858,226 L892,250 Q908,256 910,278 Z" fill="#cfd8df" stroke="#3a4a56" stroke-width="1.5" />
  <circle cx="788" cy="278" r="12" fill="#34495e" />
  <circle cx="872" cy="278" r="12" fill="#34495e" />
  <line x1="690" y1="270" x2="740" y2="270" stroke="#c0392b" stroke-width="2.4" marker-end="url(#u14fup_aR)" />

  <text x="808" y="338" font-family="'Segoe UI',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#14532d"><tspan font-weight="700">jednak Re</tspan> → jednak C_d</text>
  <text x="808" y="362" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#5a6a78">jedna krivulja vrijedi za</text>
  <text x="808" y="380" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#5a6a78">sve veličine i fluide</text>
</svg>
