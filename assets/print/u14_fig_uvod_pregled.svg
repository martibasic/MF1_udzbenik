<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" role="img" aria-labelledby="u14fup_title u14fup_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="u14fup_title">Pregled poglavlja: bezdimenzijski brojevi, dimenzijska analiza i sličnost</title>
  <desc id="u14fup_desc">Tri panela: lijevo usporedba karakterističnih mehanizama, sredina ključni brojevi Re, Fr, Eu, We i Ma, a desno prijenos koeficijenta otpora iz aerotunela uz jednak Reynoldsov broj i ostale jednake bezdimenzijske uvjete.</desc>
  <defs>
    <marker id="u14fup_aR" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#356b83" />
    </marker>
  </defs>
  <text x="177" y="48" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">Usporedi mehanizme</text>
  <text x="44" y="92" font-family="Arial, Liberation Sans, sans-serif" font-size="12" fill="#263746">inercija ↔ viskoznost</text>
  <rect x="44" y="100" width="133" height="24" fill="#c5cdd3" stroke="#356b83" stroke-width="1" />
  <rect x="177" y="100" width="133" height="24" fill="#d7dee3" stroke="#3a4a56" stroke-width="1" />
  <text x="177" y="144" font-family="Arial, Liberation Sans, sans-serif" font-size="16" font-style="italic" font-weight="700" text-anchor="middle" fill="#263746">Re = ρvL / μ</text>
  <text x="44" y="186" font-family="Arial, Liberation Sans, sans-serif" font-size="12" fill="#263746">inercija ↔ gravitacija</text>
  <rect x="44" y="194" width="133" height="24" fill="#c5cdd3" stroke="#356b83" stroke-width="1" />
  <rect x="177" y="194" width="133" height="24" fill="#c5cdd3" stroke="#356b83" stroke-width="1" />
  <text x="177" y="238" font-family="Arial, Liberation Sans, sans-serif" font-size="16" font-style="italic" font-weight="700" text-anchor="middle" fill="#263746">Fr² = v² / (gL)</text>
  <text x="44" y="280" font-family="Arial, Liberation Sans, sans-serif" font-size="12" fill="#263746">inercija ↔ napetost</text>
  <rect x="44" y="288" width="133" height="24" fill="#c5cdd3" stroke="#356b83" stroke-width="1" />
  <rect x="177" y="288" width="133" height="24" fill="#dcebf1" stroke="#356b83" stroke-width="1" />
  <text x="177" y="332" font-family="Arial, Liberation Sans, sans-serif" font-size="16" font-style="italic" font-weight="700" text-anchor="middle" fill="#263746">We = ρv²L / σ</text>
  <text x="177" y="386" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#263746">Parovi su shematski prikaz,</text>
  <text x="177" y="404" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#263746">bez numeričkog mjerila.</text>
  <text x="495" y="48" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">Ključni brojevi</text>
  <text x="378" y="104" font-family="Arial, Liberation Sans, sans-serif" font-size="16" font-style="italic" font-weight="700" fill="#263746">Re = vL / ν</text>
  <text x="378" y="124" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746">inercija / viskoznost</text>
  <text x="378" y="172" font-family="Arial, Liberation Sans, sans-serif" font-size="16" font-style="italic" font-weight="700" fill="#263746">Fr = v / √(gL)</text>
  <text x="378" y="192" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746">slobodna površina</text>
  <text x="378" y="240" font-family="Arial, Liberation Sans, sans-serif" font-size="16" font-style="italic" font-weight="700" fill="#263746">Eu = Δp / (ρv²)</text>
  <text x="378" y="260" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746">tlak, kavitacija</text>
  <text x="378" y="308" font-family="Arial, Liberation Sans, sans-serif" font-size="16" font-style="italic" font-weight="700" fill="#263746">We = ρv²L / σ</text>
  <text x="378" y="328" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746">kapljice, mlaz</text>
  <text x="378" y="376" font-family="Arial, Liberation Sans, sans-serif" font-size="16" font-style="italic" font-weight="700" fill="#263746">Ma = v / a</text>
  <text x="378" y="396" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746">stlačivost; prag je uvjetan</text>
  <text x="808" y="48" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">Model ↔ prototip (aerotunel)</text>
  <rect x="680" y="150" width="256" height="140" fill="#cedee0" />
  <path id="u14fup_tunnelwalls" d="M680 150 H936 M680 290 H936" fill="none" stroke="#3a4a56" stroke-width="2" />
  <line x1="690" y1="180" x2="740" y2="180" stroke="#356b83" stroke-width="2.4" marker-end="url(#u14fup_aR)" />
  <line x1="690" y1="210" x2="740" y2="210" stroke="#356b83" stroke-width="2.4" marker-end="url(#u14fup_aR)" />
  <path d="M745,278 Q748,250 772,246 L800,224 Q828,216 858,226 L892,250 Q908,256 910,278 Z" fill="#dcebf1" stroke="#3a4a56" stroke-width="1.5" />
  <circle cx="788" cy="278" r="12" fill="#3a4a56" />
  <circle cx="872" cy="278" r="12" fill="#3a4a56" />
  <line x1="690" y1="270" x2="740" y2="270" stroke="#356b83" stroke-width="2.4" marker-end="url(#u14fup_aR)" />
  <text x="808" y="338" font-family="Arial, Liberation Sans, sans-serif" font-size="12" text-anchor="middle" fill="#263746">
    <tspan font-weight="700">jednak Re + isti ostali uvjeti</tspan>
  </text>
  <text x="808" y="362" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#263746">→ jednak C<tspan baseline-shift="sub" font-size="0.75em">d</tspan> unutar</text>
  <text x="808" y="380" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#263746">granica odabranoga modela</text>
</svg>
