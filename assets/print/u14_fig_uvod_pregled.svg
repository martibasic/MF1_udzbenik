<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 618 325" role="img" aria-labelledby="u14fup_title u14fup_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:618px;height:auto;">
  <title id="u14fup_title">Pregled poglavlja: bezdimenzijski brojevi, dimenzijska analiza i sličnost</title>
  <desc id="u14fup_desc">Tri panela: lijevo usporedba karakterističnih mehanizama, sredina ključni brojevi Re, Fr, Eu, We i Ma, a desno prijenos koeficijenta otpora iz aerotunela uz jednak Reynoldsov broj i ostale jednake bezdimenzijske uvjete.</desc>
