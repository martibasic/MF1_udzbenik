<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" role="img" aria-labelledby="u09fup_u9fp-title u09fup_u9fp-sub" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <defs>
    <linearGradient id="u09fup_u9fp-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4eef8"/>
      <stop offset="100%" stop-color="#7ec8e8"/>
    </linearGradient>
    <linearGradient id="u09fup_u9fp-air" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f6fb"/>
      <stop offset="100%" stop-color="#daeaf5"/>
    </linearGradient>
    <pattern id="u09fup_u9fp-sraf" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#8090a0"/>
      <line x1="0" y1="8" x2="8" y2="0" stroke="#546e7a" stroke-width="1.8"/>
    </pattern>
    <marker id="u09fup_u9fp-arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#0f766e"/>
    </marker>
    <marker id="u09fup_u9fp-arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="940" height="430" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="382" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>

  <!-- ===== LEFT PANEL: fizikalni sustav s EGL/HGL ===== -->
  <rect x="44" y="90" width="400" height="300" rx="12" fill="#f7fbfe" stroke="#d9e6ee"/>
  <text x="60" y="113" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#173043">Fizi&#x10D;ki sustav &#x2014; konfuzor</text>

  <!-- EGL horizontal red dashed -->
  <line x1="58" y1="136" x2="432" y2="136" stroke="#b42318" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="396" y="131" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#b42318">EGL</text>

  <!-- HGL: drops at narrow section -->
  <polyline points="58,154 175,154 315,200 432,200" fill="none" stroke="#6d2694" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="396" y="196" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#6d2694">HGL</text>

  <!-- Pipe walls: wide left, narrows to right -->
  <!-- top wall srafura -->
  <polygon points="58,162 175,162 315,188 430,188 430,178 315,178 175,152 58,152" fill="url(#u09fup_u9fp-sraf)"/>
  <!-- bottom wall srafura -->
  <polygon points="58,262 175,262 315,242 430,242 430,252 315,252 175,272 58,272" fill="url(#u09fup_u9fp-sraf)"/>
  <!-- outline top -->
  <polyline points="58,152 175,152 315,178 430,178" fill="none" stroke="#2d3a40" stroke-width="2"/>
  <polyline points="58,162 175,162 315,188 430,188" fill="none" stroke="#2d3a40" stroke-width="2"/>
  <!-- outline bottom -->
  <polyline points="58,262 175,262 315,252 430,252" fill="none" stroke="#2d3a40" stroke-width="2"/>
  <polyline points="58,272 175,272 315,242 430,242" fill="none" stroke="#2d3a40" stroke-width="2"/>
  <!-- end caps -->
  <line x1="58" y1="152" x2="58" y2="272" stroke="#2d3a40" stroke-width="2"/>
  <line x1="430" y1="178" x2="430" y2="252" stroke="#2d3a40" stroke-width="2"/>

  <!-- fluid fill (air/fluid) -->
  <polygon points="58,162 175,162 315,188 430,188 430,252 315,252 175,262 58,262" fill="url(#u09fup_u9fp-air)"/>

  <!-- flow arrows -->
  <line x1="66" y1="212" x2="148" y2="212" stroke="#0f766e" stroke-width="2.5" marker-end="url(#u09fup_u9fp-arrG)"/>
  <text x="70" y="207" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#0f766e">v&#x2081;</text>
  <line x1="338" y1="215" x2="418" y2="215" stroke="#0f766e" stroke-width="2.5" marker-end="url(#u09fup_u9fp-arrG)"/>
  <text x="344" y="210" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#0f766e">v&#x2082;&#x226B;v&#x2081;</text>

  <!-- velocity head arrows -->
  <line x1="120" y1="136" x2="120" y2="154" stroke="#546e7a" stroke-width="1.5"/>
  <text x="124" y="148" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#546e7a">v&#x2081;&#xB2;/2g</text>
  <line x1="390" y1="136" x2="390" y2="200" stroke="#546e7a" stroke-width="1.5"/>
  <text x="370" y="172" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#546e7a">v&#x2082;&#xB2;/2g</text>

  <!-- Labels sections -->
  <circle cx="175" cy="212" r="5" fill="#b42318"/>
  <text x="180" y="209" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#b42318">&#x2460;</text>
  <circle cx="315" cy="215" r="5" fill="#b42318"/>
  <text x="320" y="212" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#b42318">&#x2461;</text>

  <!-- explanatory text below pipe -->
  <text x="58" y="305" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043">Su&#x17E;enje: v raste, p pada</text>
  <text x="58" y="324" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#b42318">EGL ostaje vodoravna (idealni tok)</text>
  <text x="58" y="343" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#6d2694">HGL pada u su&#x17E;enju (manji tlak)</text>
  <text x="58" y="362" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043">EGL&#x2212;HGL = v&#xB2;/(2g)   (brzinska visina)</text>
  <text x="58" y="381" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043">Duct&#x2011;os&#x2011;HGL = p/(&#x3C1;g) (tla&#x010D;na visina)</text>

  <!-- ===== RIGHT-TOP: key equation ===== -->
  <rect x="462" y="90" width="450" height="155" rx="12" fill="#f6fbf8" stroke="#dcebe1"/>
  <text x="478" y="115" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#173043">Klju&#x010D;na jednad&#x17E;ba</text>
  <!-- Bernoulli in three forms -->
  <text x="478" y="143" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#173043">p/(&#x3C1;g) + v&#xB2;/(2g) + z = const</text>
  <text x="478" y="165" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677">&#x2502; tla&#x10D;na visina + brzinska visina + geod. visina = const</text>
  <line x1="478" y1="174" x2="900" y2="174" stroke="#c8dcd4" stroke-width="1"/>
  <text x="478" y="193" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#173043">p + &#x3C1;v&#xB2;/2 + &#x3C1;gz = const</text>
  <text x="478" y="215" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677">Vrijedi: stacionarno, nestla&#x10D;ivo, bez gubitaka, ista strujnica</text>
  <text x="478" y="232" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677">1&#xB0; spoji s kontinuitetom: A&#x2081;v&#x2081; = A&#x2082;v&#x2082; &#x21D2; v&#x2082; = v&#x2081;&#x22C5;(A&#x2081;/A&#x2082;)</text>

  <!-- ===== RIGHT-BOTTOM: primjene ===== -->
  <rect x="462" y="258" width="450" height="160" rx="12" fill="#fbf8f2" stroke="#eadfca"/>
  <text x="478" y="281" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#173043">Primjena &#x2014; Pitotova sonda</text>

  <!-- Pitot tube sketch in right panel -->
  <!-- Pipe (horizontal flow) -->
  <rect x="480" y="310" width="270" height="44" rx="4" fill="url(#u09fup_u9fp-water)" stroke="#2d6a8a" stroke-width="2"/>
  <!-- flow arrows -->
  <line x1="492" y1="332" x2="536" y2="332" stroke="#0f766e" stroke-width="2.4" marker-end="url(#u09fup_u9fp-arrG)"/>
  <line x1="660" y1="332" x2="738" y2="332" stroke="#0f766e" stroke-width="2.4" marker-end="url(#u09fup_u9fp-arrG)"/>
  <text x="750" y="336" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#0f766e">v&#x221E;</text>
  <!-- Pitot tube: a small tube sticking into the flow horizontally, bent upward -->
  <line x1="600" y1="310" x2="600" y2="272" stroke="#2d3a40" stroke-width="4"/>
  <line x1="600" y1="310" x2="580" y2="310" stroke="#2d3a40" stroke-width="4"/>
  <circle cx="580" cy="310" r="4" fill="#b42318"/>
  <text x="558" y="305" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#b42318">stag.</text>
  <!-- column of fluid indicating stagnation pressure -->
  <rect x="594" y="286" width="12" height="24" rx="2" fill="#7ec8e8" stroke="none"/>
  <text x="614" y="300" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#173043">p&#x2080;=p+&#x3C1;v&#xB2;/2</text>
  <!-- formula -->
  <text x="478" y="390" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043">v = &#x221A;(2&#x394;p/&#x3C1;)   gdje je  &#x394;p = p&#x2080; &#x2212; p&#x221E;</text>
  <text x="478" y="408" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677">Ista logika: Venturi, sifon, mlaz iz otvora, propust u brani</text>
</svg>