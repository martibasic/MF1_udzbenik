<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="u09intro_title u09intro_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:960px;height:auto;">
<title id="u09intro_title">Energijska jednadžba i Bernoulli</title><desc id="u09intro_desc">Lijevo su dva energetska stupca iste ukupne visine: geodetska, tlačna i brzinska visina. Gornji desni panel daje jednadžbe, a donji uzlazni vod stalnog presjeka u kojem tlak pada zbog porasta geodetske visine. Stupci energije nisu slojevi različitih fluida.</desc>
<defs>
<linearGradient id="u09intro_water" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#aed6f1"/><stop offset="100%" stop-color="#5b9ec9"/></linearGradient>
<linearGradient id="u09intro_oil" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#c8a000"/></linearGradient>
<linearGradient id="u09intro_hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1a2e42"/><stop offset="100%" stop-color="#1a3a52"/></linearGradient>
<pattern id="u09intro_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.8"/></pattern>
<marker id="u09intro_v" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#1e8449"/></marker>
<marker id="u09intro_dim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse"><path d="M0 0 L6 2.5 L0 5 Z" fill="#b7600c"/></marker>
<marker id="u09intro_dimSmall" markerWidth="3" markerHeight="3" refX="3" refY="1.5" orient="auto-start-reverse"><path d="M0 0 L3 1.5 L0 3 Z" fill="#b7600c"/></marker>
</defs>
<rect width="960" height="500" fill="white"/>
<g font-family="'Segoe UI',Arial,sans-serif" fill="#1a2530">
<rect x="0" y="0" width="960" height="48" rx="0" fill="url(#u09intro_hdr)" stroke="none" stroke-width="1.2"/>
<text x="480" y="22" font-size="18" fill="white" text-anchor="middle" font-weight="700">Energijska jednadžba i Bernoulli</text>
<text x="480" y="40" font-size="12" fill="#8aaccc" text-anchor="middle">tlak · brzina · geodetska visina · pretpostavke modela</text>
<rect x="18" y="62" width="527" height="417" rx="10" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.2"/>
<text x="35" y="87" font-size="14" fill="#1a2530" text-anchor="start" font-weight="700">Tri energijska člana po istoj strujnici</text>
<rect x="145" y="384" width="46" height="36" rx="0" fill="#b7600c" stroke="none" stroke-width="1.2"/>
<text x="168" y="406" font-size="10" fill="white" text-anchor="middle" font-weight="700">z</text>
<rect x="145" y="204" width="46" height="180" rx="0" fill="#1565c0" stroke="none" stroke-width="1.2"/>
<text x="168" y="298" font-size="10" fill="white" text-anchor="middle" font-weight="700">p/(ρg)</text>
<rect x="145" y="132" width="46" height="72" rx="0" fill="#1e8449" stroke="none" stroke-width="1.2"/>
<text x="168" y="172" font-size="10" fill="white" text-anchor="middle" font-weight="700">v²/(2g)</text>
<rect x="362" y="348" width="46" height="72" rx="0" fill="#b7600c" stroke="none" stroke-width="1.2"/>
<text x="385" y="388" font-size="10" fill="white" text-anchor="middle" font-weight="700">z</text>
<rect x="362" y="240" width="46" height="108" rx="0" fill="#1565c0" stroke="none" stroke-width="1.2"/>
<text x="385" y="298" font-size="10" fill="white" text-anchor="middle" font-weight="700">p/(ρg)</text>
<rect x="362" y="132" width="46" height="108" rx="0" fill="#1e8449" stroke="none" stroke-width="1.2"/>
<text x="385" y="190" font-size="10" fill="white" text-anchor="middle" font-weight="700">v²/(2g)</text>
<line x1="32" y1="132" x2="515" y2="132" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="38" y="120" font-size="11" fill="#c0392b" text-anchor="start">EGL = 8 m</text>
<line x1="33" y1="420" x2="515" y2="420" stroke="#7a8a96" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="420" y="439" font-size="11" fill="#1a2530" text-anchor="start">z = 0</text>
<path id="u09intro_hgl" d="M32 204 H191 L362 240 H515" fill="none" stroke="#1565c0" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="41" y="195" font-size="10" fill="#1565c0" text-anchor="start">HGL₁ = 6 m</text>
<text x="416" y="258" font-size="10" fill="#1565c0" text-anchor="start">HGL₂ = 5 m</text>
<text x="168" y="105" font-size="11" fill="#1a2530" text-anchor="middle">presjek 1</text>
<text x="385" y="105" font-size="11" fill="#1a2530" text-anchor="middle">presjek 2</text>
<text x="48" y="458" font-size="10" fill="#1a2530" text-anchor="start">Stupci energije; nisu slojevi fluida. Jednaka skala: 36 px/m.</text>
<rect x="563" y="62" width="378" height="180" rx="7" fill="#f4f9fd" stroke="#1565c0" stroke-width="1.2"/>
<text x="575" y="82" font-size="13" fill="#1565c0" text-anchor="start" font-weight="700">Bernoulli duž strujnice</text>
<text x="575" y="105" font-size="12" fill="#1a2530" text-anchor="start">p/(ρg) + v²/(2g) + z = konst.</text>
<text x="575" y="124" font-size="12" fill="#1a2530" text-anchor="start">HGL = z + p/(ρg)</text>
<text x="575" y="143" font-size="12" fill="#1a2530" text-anchor="start">EGL = HGL + v²/(2g)</text>
<text x="575" y="162" font-size="12" fill="#1a2530" text-anchor="start">Stacionaran, nestlačiv tok; zanemarivi gubitci.</text>
<text x="575" y="181" font-size="12" fill="#1a2530" text-anchor="start">Između presjeka nema strojnog rada.</text>
<rect x="563" y="257" width="378" height="222" rx="10" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.2"/>
<text x="578" y="280" font-size="14" fill="#1a2530" text-anchor="start" font-weight="700">Primjena: uzlazni tlačni dovod</text>
<defs><linearGradient id="u09intro_field" gradientUnits="userSpaceOnUse" x1="0" y1="321" x2="0" y2="405"><stop offset="0%" stop-color="#aed6f1"/><stop offset="100%" stop-color="#5b9ec9"/></linearGradient></defs>
<path id="u09intro_riserwall" d="M592 390 H646 Q660 390 672 378 L714 336 Q724 326 740 326 H878" fill="none" stroke="#3a4a56" stroke-width="20" stroke-linecap="butt" stroke-linejoin="round"/>
<path id="u09intro_riserwater" d="M592 390 H646 Q660 390 672 378 L714 336 Q724 326 740 326 H878" fill="none" stroke="url(#u09intro_field)" stroke-width="16" stroke-linecap="butt" stroke-linejoin="round"/>
<path d="M596 390 L629 390" fill="none" stroke="#1e8449" stroke-width="2.3" marker-end="url(#u09intro_v)"/>
<text x="612.5" y="381" font-size="12" fill="#1e8449" text-anchor="middle">v</text>
<path d="M798 326 L831 326" fill="none" stroke="#1e8449" stroke-width="2.3" marker-end="url(#u09intro_v)"/>
<text x="814.5" y="317" font-size="12" fill="#1e8449" text-anchor="middle">v</text>
<line x1="903" y1="326" x2="913" y2="326" stroke="#b7600c" stroke-width="1.2"/>
<line x1="903" y1="390" x2="913" y2="390" stroke="#b7600c" stroke-width="1.2"/>
<path id="u09intro_rise" d="M908 326 L908 390" fill="none" stroke="#b7600c" stroke-width="1.4" marker-start="url(#u09intro_dim)" marker-end="url(#u09intro_dim)"/>
<text x="919" y="362.0" font-size="11" fill="#b7600c" text-anchor="start">Δz</text>
<text x="580" y="431" font-size="12" fill="#1a2530" text-anchor="start">Stalan presjek: v₁ = v₂;  p₂ − p₁ = −ρgΔz.</text>
<text x="580" y="454" font-size="11" fill="#1a2530" text-anchor="start">Dio tlačne energije prelazi u geodetsku visinu.</text>
</g>
</svg>
