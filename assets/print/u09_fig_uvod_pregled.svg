<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="u09intro_title u09intro_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:960px;height:auto;">
  <title id="u09intro_title">Energijska jednadžba i Bernoulli</title>
  <desc id="u09intro_desc">Lijevo su dva energetska stupca iste ukupne visine: geodetska, tlačna i brzinska visina. Gornji desni panel daje jednadžbe, a donji uzlazni vod stalnog presjeka u kojem tlak pada zbog porasta geodetske visine. Stupci energije nisu slojevi različitih fluida.</desc>
  <defs>
    <pattern id="u09intro_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.8" />
    </pattern>
    <marker id="u09intro_v" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
    </marker>
    <marker id="u09intro_dim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse">
      <path d="M0 0 L6 2.5 L0 5 Z" fill="#657781" />
    </marker>
    <marker id="u09intro_dimSmall" markerWidth="3" markerHeight="3" refX="3" refY="1.5" orient="auto-start-reverse">
      <path d="M0 0 L3 1.5 L0 3 Z" fill="#356b83" />
    </marker>
  </defs>
  <g font-family="Arial, Liberation Sans, sans-serif" fill="#3a4a56">
    <text x="480" y="22" font-size="18" fill="#263746" text-anchor="middle" font-weight="700">Energijska jednadžba i Bernoulli</text>
    <text x="480" y="40" font-size="12" fill="#263746" text-anchor="middle">tlak · brzina · geodetska visina · pretpostavke modela</text>
    <text x="35" y="87" font-size="14" fill="#263746" text-anchor="start" font-weight="700">Tri energijska člana po istoj strujnici</text>
    <rect x="145" y="384" width="46" height="36" rx="0" fill="#d7dee3" stroke="#657781" stroke-width="0.7" data-mf1-role="energy-component" />
    <text x="168" y="406" font-size="10" fill="#263746" text-anchor="middle" font-weight="700">z</text>
    <rect x="145" y="204" width="46" height="180" rx="0" fill="#dcebf1" stroke="#657781" stroke-width="0.7" data-mf1-role="energy-component" />
    <text x="168" y="298" font-size="10" fill="#263746" text-anchor="middle" font-weight="700">p/(ρg)</text>
    <rect x="145" y="132" width="46" height="72" rx="0" fill="#a8b8c2" stroke="#657781" stroke-width="0.7" data-mf1-role="energy-component" />
    <text x="168" y="172" font-size="10" fill="#263746" text-anchor="middle" font-weight="700">v²/(2g)</text>
    <rect x="362" y="348" width="46" height="72" rx="0" fill="#d7dee3" stroke="#657781" stroke-width="0.7" data-mf1-role="energy-component" />
    <text x="385" y="388" font-size="10" fill="#263746" text-anchor="middle" font-weight="700">z</text>
    <rect x="362" y="240" width="46" height="108" rx="0" fill="#dcebf1" stroke="#657781" stroke-width="0.7" data-mf1-role="energy-component" />
    <text x="385" y="298" font-size="10" fill="#263746" text-anchor="middle" font-weight="700">p/(ρg)</text>
    <rect x="362" y="132" width="46" height="108" rx="0" fill="#a8b8c2" stroke="#657781" stroke-width="0.7" data-mf1-role="energy-component" />
    <text x="385" y="190" font-size="10" fill="#263746" text-anchor="middle" font-weight="700">v²/(2g)</text>
    <line x1="32" y1="132" x2="515" y2="132" stroke="#356b83" stroke-width="1.4" />
    <text x="38" y="120" font-size="11" fill="#263746" text-anchor="start">EGL = 8 m</text>
    <line x1="33" y1="420" x2="515" y2="420" stroke="#657781" stroke-width="1.2" stroke-dasharray="5 4" />
    <text x="420" y="439" font-size="11" fill="#263746" text-anchor="start">z = 0</text>
    <path id="u09intro_hgl" d="M32 204 H191 L362 240 H515" fill="none" stroke="#356b83" stroke-width="1.3" stroke-dasharray="5 4" />
    <text x="41" y="195" font-size="10" fill="#263746" text-anchor="start">HGL₁ = 6 m</text>
    <text x="416" y="258" font-size="10" fill="#263746" text-anchor="start">HGL₂ = 5 m</text>
    <text x="168" y="105" font-size="11" fill="#263746" text-anchor="middle">presjek 1</text>
    <text x="385" y="105" font-size="11" fill="#263746" text-anchor="middle">presjek 2</text>
    <text x="48" y="458" font-size="10" fill="#263746" text-anchor="start">Ilustrativni stupci energije; jednaka skala 36 px/m.</text>
    <text x="575" y="82" font-size="13" fill="#263746" text-anchor="start" font-weight="700">Bernoulli duž strujnice</text>
    <text x="575" y="105" font-size="12" fill="#263746" text-anchor="start">p/(ρg) + v²/(2g) + z = konst.</text>
    <text x="575" y="124" font-size="12" fill="#263746" text-anchor="start">HGL = z + p/(ρg)</text>
    <text x="575" y="143" font-size="12" fill="#263746" text-anchor="start">EGL = HGL + v²/(2g)</text>
    <text x="575" y="162" font-size="12" fill="#263746" text-anchor="start">Stacionaran, nestlačiv tok; zanemarivi gubitci.</text>
    <text x="575" y="181" font-size="12" fill="#263746" text-anchor="start">Između presjeka nema strojnog rada.</text>
    <text x="578" y="280" font-size="14" fill="#263746" text-anchor="start" font-weight="700">Primjena: uzlazni tlačni dovod</text>
    <defs />
    <path id="u09intro_riserwall" d="M592 390 H646 Q660 390 672 378 L714 336 Q724 326 740 326 H878" fill="none" stroke="#3a4a56" stroke-width="20" stroke-linecap="butt" stroke-linejoin="round" />
    <path id="u09intro_riserwater" d="M592 390 H646 Q660 390 672 378 L714 336 Q724 326 740 326 H878" fill="none" stroke="#dcebf1" stroke-width="16" stroke-linecap="butt" stroke-linejoin="round" />
    <path d="M596 390 L629 390" fill="none" stroke="#356b83" stroke-width="2.3" marker-end="url(#u09intro_v)" />
    <text x="612.5" y="381" font-size="12" fill="#263746" text-anchor="middle">v</text>
    <path d="M798 326 L831 326" fill="none" stroke="#356b83" stroke-width="2.3" marker-end="url(#u09intro_v)" />
    <text x="814.5" y="317" font-size="12" fill="#263746" text-anchor="middle">v</text>
    <line x1="903" y1="326" x2="913" y2="326" stroke="#657781" stroke-width="1.2" />
    <line x1="903" y1="390" x2="913" y2="390" stroke="#657781" stroke-width="1.2" />
    <path id="u09intro_rise" d="M908 326 L908 390" fill="none" stroke="#657781" stroke-width="1.4" marker-start="url(#u09intro_dim)" marker-end="url(#u09intro_dim)" />
    <text x="919" y="362.0" font-size="11" fill="#263746" text-anchor="start">Δz</text>
    <text x="580" y="431" font-size="12" fill="#263746" text-anchor="start">Stalan presjek: v₁ = v₂;  p₂ − p₁ = −ρgΔz.</text>
    <text x="580" y="454" font-size="11" fill="#263746" text-anchor="start">Tlačna visina pada, geodetska raste.</text>
  </g>
</svg>
