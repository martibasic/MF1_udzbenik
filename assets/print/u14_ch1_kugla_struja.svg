<title id="u14ball_title">Otpor kugle i jasno zadana korelacija</title><desc id="u14ball_desc">Kugla promjera dvadeset milimetara u zraku trideset metara u sekundi. Sila otpora usmjerena je kao dolazni tok. Desni logaritamski graf prikazuje korelaciju notebooka do Reynoldsova broja dvjesto tisuća i zaseban zadani koeficijent 0,45 pri četrdeset tisuća.</desc>
