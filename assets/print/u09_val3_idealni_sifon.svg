<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" role="img" aria-labelledby="u09v3is_title u09v3is_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
<title id="u09v3is_title">Sifon s otvorenim izlazom</title><desc id="u09v3is_desc">Voda iz velikog bazena A prolazi kroz prethodno napunjen sifon stalnog promjera i izlazi slobodnim mlazom u B iznad prihvatnog kanala. B je 3,6 m ispod A, a os vrha C 2,2 m iznad A. HGL u cijevi je 3,6 m ispod A. Promjer cijevi uvećan je za čitljivost.</desc>
