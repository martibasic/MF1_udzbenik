<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" role="img" aria-labelledby="u09v3is_u9v3-title u09v3is_u9v3-sub" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <defs>
    <linearGradient id="u09v3is_u9v3-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4eef8"/>
      <stop offset="100%" stop-color="#7ec8e8"/>
    </linearGradient>
    <pattern id="u09v3is_u9v3-sraf" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#8090a0"/>
      <line x1="0" y1="8" x2="8" y2="0" stroke="#546e7a" stroke-width="1.8"/>
    </pattern>
    <marker id="u09v3is_u9v3-arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#0f766e"/>
    </marker>
    <marker id="u09v3is_u9v3-arrGr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 z" fill="#546e7a"/>
    </marker>
    <marker id="u09v3is_u9v3-arrGrR" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto">
      <path d="M7,0 L0,4 L7,8 z" fill="#546e7a"/>
    </marker>
    <marker id="u09v3is_u9v3-arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="940" height="420" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="372" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>
  <text id="u09v3is_u9v3-title" x="54" y="55" font-family="'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#173043">Privremeni sifon za pra&#x17E;njenje servisnog bazena</text>
  <text id="u09v3is_u9v3-sub" x="54" y="76" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#516677">D=80&#x202F;mm, &#x394;z=3,6&#x202F;m, z&#x2C;=2,2&#x202F;m iznad slobodne povrn&#x161;ine A; skala&#x202F;50&#x202F;px/m</text>

  <!-- Ground line at y=385 -->
  <line x1="50" y1="385" x2="890" y2="385" stroke="#546e7a" stroke-width="2"/>
  <text x="830" y="380" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#546e7a">tlo / ref</text>

  <!-- ===== Basin A (upper) ===== -->
  <!-- Free surface A at y=200 (reference); Delta z=3.6m -> B at y=200+3.6*50=380; C=2.2m above A -> y=200-110=90 -->
  <!-- Basin A: x=60..220, bottom at y=385, water from y=200 to y=385 -->
  <rect x="60" y="200" width="160" height="185" fill="url(#u09v3is_u9v3-water)" opacity="0.85"/>
  <!-- Basin walls (srafura) -->
  <rect x="46" y="160" width="14" height="225" fill="url(#u09v3is_u9v3-sraf)"/>
  <rect x="220" y="200" width="14" height="185" fill="url(#u09v3is_u9v3-sraf)"/>
  <rect x="46" y="385" width="188" height="10" fill="url(#u09v3is_u9v3-sraf)"/>
  <!-- Basin outline -->
  <polyline points="46,160 46,385 234,385 234,200" fill="none" stroke="#2d3a40" stroke-width="2.5"/>
  <!-- Free surface A (dashed blue) -->
  <line x1="46" y1="200" x2="234" y2="200" stroke="#1565c0" stroke-width="2" stroke-dasharray="5 3"/>
  <!-- Label A surface -->
  <text x="56" y="193" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1565c0">Slobodna povrn&#x161;ina A</text>
  <!-- Circle point A -->
  <circle cx="234" cy="200" r="5" fill="#b42318"/>
  <text x="242" y="196" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#b42318">A</text>

  <!-- ===== Basin B (lower, right) ===== -->
  <!-- B at y=380 (3.6m below A). Narrow channel x=700..870 -->
  <rect x="700" y="380" width="170" height="5" fill="url(#u09v3is_u9v3-water)" opacity="0.85"/>
  <!-- Channel walls -->
  <rect x="686" y="370" width="14" height="15" fill="url(#u09v3is_u9v3-sraf)"/>
  <rect x="700" y="385" width="184" height="8" fill="url(#u09v3is_u9v3-sraf)"/>
  <!-- Free surface B (dashed blue) -->
  <line x1="686" y1="380" x2="886" y2="380" stroke="#1565c0" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="700" y="374" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1565c0">Slobodna povrn&#x161;ina B</text>
  <circle cx="686" cy="380" r="5" fill="#b42318"/>
  <text x="660" y="376" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#b42318">B</text>

  <!-- ===== Siphon pipe ===== -->
  <!-- Path: from A side exit at (234,270) -> right to (310,270) -> curve up to C(480,90) -> curve down to B exit (686,380) -->
  <!-- Using cubic bezier for smooth pipe appearance -->
  <!-- Outer pipe (thick, dark) -->
  <path d="M 234,270 L 310,270 C 420,270 420,90 480,90 C 550,90 580,300 686,380"
        fill="none" stroke="#2d3a40" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Inner (fluid) -->
  <path d="M 234,270 L 310,270 C 420,270 420,90 480,90 C 550,90 580,300 686,380"
        fill="none" stroke="#7ec8e8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pipe center line outline -->
  <path d="M 234,270 L 310,270 C 420,270 420,90 480,90 C 550,90 580,300 686,380"
        fill="none" stroke="#2d6a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0"/>

  <!-- Flow direction arrow on rising limb -->
  <line x1="340" y1="260" x2="370" y2="230" stroke="#0f766e" stroke-width="3" marker-end="url(#u09v3is_u9v3-arrG)"/>
  <!-- Flow direction arrow on descending limb -->
  <line x1="590" y1="270" x2="620" y2="310" stroke="#0f766e" stroke-width="3" marker-end="url(#u09v3is_u9v3-arrG)"/>
  <!-- v and Q label -->
  <rect x="300" y="220" width="100" height="26" rx="6" fill="#fffef6" stroke="#c49a0a" stroke-width="1.5"/>
  <text x="316" y="237" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#0f766e">v=8,40&#x202F;m/s</text>

  <!-- ===== Point C (peak) ===== -->
  <circle cx="480" cy="90" r="7" fill="#b42318"/>
  <text x="490" y="86" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#b42318">C</text>
  <!-- C label box with pressure result -->
  <rect x="504" y="70" width="178" height="50" rx="8" fill="#fef2f2" stroke="#b42318" stroke-width="1.5"/>
  <text x="514" y="90" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#173043">p&#x2C;/&#x3B3; = &#x2212;5,8&#x202F;m (man.)</text>
  <text x="514" y="107" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#173043">p&#x2C;,abs = 4,4&#x202F;m v.s. &#x2714;</text>

  <!-- ===== Dimension lines ===== -->
  <!-- Delta z = 3.6m: from A surface (y=200) to B surface (y=380), at x=800 -->
  <line x1="840" y1="200" x2="840" y2="380" stroke="#546e7a" stroke-width="1.8" marker-start="url(#u09v3is_u9v3-arrGrR)" marker-end="url(#u09v3is_u9v3-arrGr)"/>
  <rect x="848" y="276" width="36" height="24" rx="4" fill="#ffffff" stroke="#d3d9de" stroke-width="1"/>
  <text x="852" y="292" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#546e7a">&#x394;z</text>
  <text x="852" y="318" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#546e7a">3,6&#x202F;m</text>

  <!-- z_C = 2.2m: from A surface (y=200) to C peak (y=90), at x=444 -->
  <line x1="444" y1="90" x2="444" y2="200" stroke="#546e7a" stroke-width="1.8" marker-start="url(#u09v3is_u9v3-arrGrR)" marker-end="url(#u09v3is_u9v3-arrGr)"/>
  <rect x="414" y="134" width="26" height="24" rx="4" fill="#ffffff" stroke="#d3d9de" stroke-width="1"/>
  <text x="416" y="150" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#546e7a">z&#x2C;</text>
  <text x="406" y="168" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#546e7a">2,2&#x202F;m</text>

  <!-- ===== Formula box ===== -->
  <rect x="56" y="100" width="230" height="90" rx="10" fill="#fffef6" stroke="#c49a0a" stroke-width="1.8"/>
  <text x="70" y="120" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#173043">A&#x2192;B: v = &#x221A;(2g&#x394;z)</text>
  <text x="70" y="140" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#0f766e">v = 8,40&#x202F;m/s</text>
  <text x="70" y="158" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#0f766e">Q = 42,2&#x202F;L/s</text>
  <text x="70" y="178" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#173043">D=80&#x202F;mm,  A=5,03&#xB7;10&#x207B;&#xB3;&#x202F;m&#xB2;</text>

  <!-- HGL reference line at C: horizontal dashed purple at y=90 -->
  <text x="56" y="312" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677">Provjera kavitacije: p&#x2C;,abs=4,4&#x202F;m &gt; p&#x1D48;/&#x3B3;=0,25&#x202F;m &#x2713;  (razlika&#x202F;4,15&#x202F;m)</text>
</svg>