<text x="407" y="113" font-size="11" fill="#b7600c" text-anchor="start">D = 80 mm</text>
<text x="34" y="481" font-size="10" fill="#1a2530" text-anchor="start">Visine: 40 px/m; promjer cijevi uvećan. Kote se odnose na os.</text>
<rect x="570" y="48" width="345" height="92" rx="7" fill="white" stroke="#1565c0" stroke-width="1" stroke-opacity="0.65" />
<text x="582" y="68" font-size="13" fill="#1565c0" text-anchor="start" font-weight="700">1. Bernoulli A → B</text>
<text x="582" y="91" font-size="12" fill="#1a2530" text-anchor="start">pA = pB = pₐₜₘ; vA ≈ 0, vB = v</text>
<text x="582" y="110" font-size="12" fill="#1a2530" text-anchor="start">v²/(2g) = Δz = 3,6 m</text>
<text x="582" y="129" font-size="12" fill="#1a2530" text-anchor="start">v = 8,40 m/s; Q = 42,2 L/s</text>
<rect x="570" y="158" width="345" height="92" rx="7" fill="white" stroke="#1565c0" stroke-width="1" stroke-opacity="0.65" />
<text x="582" y="178" font-size="13" fill="#1565c0" text-anchor="start" font-weight="700">2. Bernoulli A → C</text>
<text x="582" y="201" font-size="12" fill="#1a2530" text-anchor="start">pC,man/(ρg) = −zC − v²/(2g)</text>
<text x="582" y="220" font-size="12" fill="#1a2530" text-anchor="start">= −2,2 − 3,6 = −5,8 m</text>
<text x="582" y="239" font-size="12" fill="#1a2530" text-anchor="start">HGLC = 2,2 − 5,8 = −3,6 m</text>
<rect x="570" y="268" width="345" height="92" rx="7" fill="white" stroke="#1e8449" stroke-width="1" stroke-opacity="0.65" />
<text x="582" y="288" font-size="13" fill="#1e8449" text-anchor="start" font-weight="700">3. Apsolutna tlačna visina</text>
<text x="582" y="311" font-size="12" fill="#1a2530" text-anchor="start">pC,abs/(ρg) = 10,2 − 5,8 = 4,4 m</text>
<text x="582" y="330" font-size="12" fill="#1a2530" text-anchor="start">pC,abs = 43,2 kPa</text>
<text x="582" y="349" font-size="12" fill="#1a2530" text-anchor="start">Razlika prema tlaku pare: 4,15 m</text>
<text x="585" y="394" font-size="11" fill="#1a2530" text-anchor="start">Pozitivna razlika vrijedi u idealnom modelu.</text>
<text x="585" y="413" font-size="11" fill="#1a2530" text-anchor="start">Gubitci i prolazne pojave traže zasebnu provjeru.</text>
<text x="585" y="453" font-size="12" fill="#1565c0" text-anchor="start">B je otvoreni izlaz, s nezanemarivom brzinom.</text>
