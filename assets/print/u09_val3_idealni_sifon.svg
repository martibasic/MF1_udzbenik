<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="title">U09 Val 3 - idealni sifon</title>
  <desc id="desc">Idealni sifon između dviju slobodnih površina s jasno izdvojenim visinama, vrhom sifona i tokom u cijevi.</desc>
  <rect width="980" height="420" fill="#ffffff"/>
  <rect x="28" y="28" width="924" height="364" rx="18" fill="#ffffff" stroke="#c9d2d8" stroke-width="2"/>

  <text x="58" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#173043">U09 - Privremeni sifon za praznjenje servisnog bazena</text>
  <text x="58" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#516677">Idealni Bernoulli se ovdje cita u dva koraka: A -> B za brzinu, zatim A -> C za tlak u vrhu sifona.</text>

  <rect x="102" y="184" width="198" height="138" fill="#dff1f8" stroke="#5b6770" stroke-width="2.5"/>
  <line x1="102" y1="184" x2="300" y2="184" stroke="#3a87ad" stroke-width="4"/>
  <circle cx="300" cy="184" r="5" fill="#111827"/>
  <rect x="316" y="166" width="136" height="28" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="332" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">slobodna površina A</text>

  <rect x="664" y="254" width="180" height="68" fill="#dff1f8" stroke="#5b6770" stroke-width="2.5"/>
  <line x1="664" y1="254" x2="844" y2="254" stroke="#3a87ad" stroke-width="4"/>
  <circle cx="664" cy="254" r="5" fill="#111827"/>
  <rect x="680" y="226" width="136" height="28" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="696" y="245" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">slobodna površina B</text>

  <path d="M300 216 C390 216 404 122 494 122 C586 122 602 254 664 254" fill="none" stroke="#2d3a40" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M300 216 C390 216 404 122 494 122 C586 122 602 254 664 254" fill="none" stroke="#d9edf4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M300 216 C390 216 404 122 494 122 C586 122 602 254 664 254" fill="none" stroke="#5b6770" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="494" cy="122" r="5" fill="#111827"/>
  <rect x="508" y="100" width="46" height="26" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="525" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#173043">C</text>

  <line x1="350" y1="216" x2="430" y2="216" stroke="#1565c0" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <line x1="520" y1="154" x2="590" y2="210" stroke="#1565c0" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <rect x="374" y="182" width="54" height="26" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="392" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">Q, v</text>

  <line x1="462" y1="184" x2="462" y2="122" stroke="#8b5e3c" stroke-width="3" marker-start="url(#arrowBrown)" marker-end="url(#arrowBrown)"/>
  <rect x="402" y="144" width="50" height="26" rx="6" fill="#ffffff" stroke="#d9cdc3" stroke-width="1.5"/>
  <text x="418" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">z_C</text>

  <line x1="888" y1="184" x2="888" y2="254" stroke="#6f7f89" stroke-width="3" marker-start="url(#arrowGray)" marker-end="url(#arrowGray)"/>
  <rect x="808" y="206" width="74" height="26" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="822" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">delta z</text>

  <rect x="610" y="124" width="272" height="174" rx="12" fill="#f8fafb" stroke="#d6dde2" stroke-width="1.5"/>
  <text x="632" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#173043">Čitanje skice</text>
  <text x="632" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">1. A -> B daje v = sqrt(2 g delta z)</text>
  <text x="632" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">2. Q = A v</text>
  <text x="632" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">3. A -> C daje p_C/gamma</text>
  <text x="632" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#516677">Visinske kote i vrh sifona više ne stoje preko cijevi, pa je</text>
  <text x="632" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#516677">odmah vidljivo gdje se cita brzina, a gdje pad tlaka.</text>

  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#1565c0"/>
    </marker>
    <marker id="arrowBrown" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L0,8 L8,4 z" fill="#8b5e3c"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L0,8 L8,4 z" fill="#6f7f89"/>
    </marker>
  </defs>
</svg>