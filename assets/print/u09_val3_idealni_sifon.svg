<text x="396" y="339" font-size="11" fill="#1565c0" text-anchor="start">pB = pₐₜₘ</text>
<text x="396" y="357" font-size="11" fill="#1565c0" text-anchor="start">vB = v</text>
<text x="86" y="155" font-size="11" fill="#1565c0" text-anchor="start">pₐₜₘ</text>
<line x1="234" y1="170" x2="498" y2="170" stroke="#7a8a96" stroke-width="1" stroke-dasharray="5 4"/>
<text x="238" y="190" font-size="11" fill="#1a2530" text-anchor="start">zA = 0</text>
<line x1="380" y1="314" x2="498" y2="314" stroke="#b7600c" stroke-width="1"/>
<line x1="491" y1="170" x2="501" y2="170" stroke="#b7600c" stroke-width="1.2"/>
