<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img"
     aria-labelledby="u3vT u3vD" preserveAspectRatio="xMidYMid meet"
     style="display:block;width:100%;max-width:900px;height:auto;">
  <title id="u3vT">Pregled poglavlja U03: Hidrostatika, raspodjela tlaka i manometrija</title>
  <desc id="u3vD">Tri panela: (1) fizikalni sustav – zatvoreni spremnik s linearnom raspodjelom tlaka i kapilarnom kotom h; (2) ključne jednadžbe – p = p₀ + ρgh i dp/dz = −ρg; (3) primjena – hidrotehnička brana s trokutnom raspodjelom tlaka.</desc>
  <defs>
    <marker id="u3vaR"  markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#c0392b"/></marker>
    <marker id="u3vaRev" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L10,4 z" fill="#c0392b"/></marker>
    <marker id="u3vaG"  markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#1e8449"/></marker>
    <marker id="u3vaDim"  markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#b7600c"/></marker>
    <marker id="u3vaDimL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L8,4 z" fill="#b7600c"/></marker>
    <marker id="u3vaBlu" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#1565c0"/></marker>
    <linearGradient id="u3vfl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aed6f1"/><stop offset="100%" stop-color="#7fb3d3"/>
    </linearGradient>
    <linearGradient id="u3vpres" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c0392b" stop-opacity="0"/><stop offset="100%" stop-color="#c0392b" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="u3vhatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8a9aa6" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="900" height="460" fill="#f0f4f8"/>
  <rect x="8" y="8" width="884" height="444" rx="14" fill="#f8f9fa" stroke="#dde3ea" stroke-width="1.5"/>

  <!-- Naslov -->
  <text x="450" y="33" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#1a2530" text-anchor="middle">U03 – Hidrostatika, raspodjela tlaka i manometrija</text>

  <!-- ════════════════════════════════════
       PANEL 1 – Fizikalni sustav (x 20..390)
       Zatvoreni spremnik, plinski prostor gore, fluid dolje,
       raspodjela tlaka kao trokut desno
       ════════════════════════════════════ -->
  <rect x="20" y="46" width="370" height="406" rx="10" fill="#eaf4fb" stroke="#c8d8e8" stroke-width="1.3"/>
  <text x="205" y="66" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1a2530" text-anchor="middle">Fizikalni sustav</text>

  <!-- Stijenke (hatch) -->
  <!-- Dno -->
  <rect x="80" y="380" width="220" height="12" fill="url(#u3vhatch)" stroke="#4a6070" stroke-width="1.2"/>
  <!-- Lijeva stijenka -->
  <rect x="68" y="100" width="12" height="280" fill="url(#u3vhatch)" stroke="#4a6070" stroke-width="1.2"/>
  <!-- Desna stijenka -->
  <rect x="300" y="100" width="12" height="280" fill="url(#u3vhatch)" stroke="#4a6070" stroke-width="1.2"/>
  <!-- Poklopac (gore) -->
  <rect x="68" y="88" width="244" height="12" fill="url(#u3vhatch)" stroke="#4a6070" stroke-width="1.2"/>

  <!-- Plinski prostor (p₀) -->
  <rect x="80" y="100" width="220" height="72" fill="#f5f0e0" stroke="none"/>
  <!-- Razina fluida (dashed) -->
  <line x1="68" y1="172" x2="312" y2="172" stroke="#1565c0" stroke-width="1.8" stroke-dasharray="6,4"/>
  <!-- p₀ labela desno od razine -->
  <text x="320" y="169" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#8b5e00">p₀</text>
  <!-- Plinski tlak simbol -->
  <text x="190" y="142" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#8b5e00" text-anchor="middle" font-style="italic">plin (p₀)</text>

  <!-- Fluid -->
  <rect x="80" y="172" width="220" height="208" fill="url(#u3vfl)"/>

  <!-- Strelice tlaka unutar fluida (horizontalne, prema desnoj stjenki, rastu s dubinom) -->
  <line x1="142" y1="210" x2="172" y2="210" stroke="#1565c0" stroke-width="1.2" marker-end="url(#u3vaBlu)"/>
  <line x1="130" y1="250" x2="172" y2="250" stroke="#1565c0" stroke-width="1.3" marker-end="url(#u3vaBlu)"/>
  <line x1="115" y1="290" x2="172" y2="290" stroke="#1565c0" stroke-width="1.5" marker-end="url(#u3vaBlu)"/>
  <line x1="98"  y1="330" x2="172" y2="330" stroke="#1565c0" stroke-width="1.7" marker-end="url(#u3vaBlu)"/>
  <line x1="80"  y1="370" x2="172" y2="370" stroke="#1565c0" stroke-width="2.0" marker-end="url(#u3vaBlu)"/>

  <!-- Kota h (lijevo) -->
  <line x1="58" y1="172" x2="64" y2="172" stroke="#b7600c" stroke-width="1"/>
  <line x1="58" y1="380" x2="64" y2="380" stroke="#b7600c" stroke-width="1"/>
  <line x1="61" y1="174" x2="61" y2="378" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u3vaDimL)" marker-end="url(#u3vaDim)"/>
  <text x="48" y="280" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-style="italic" font-weight="700" fill="#b7600c" text-anchor="middle">h</text>

  <!-- Raspodjela tlaka (trokut desno od posude) -->
  <!-- Trokut: vrh pri y=172 (p=p₀), baza pri y=380 (p=p₀+ρgh) -->
  <polygon points="312,172 312,380 355,380" fill="#c0392b" fill-opacity="0.22" stroke="#c0392b" stroke-width="1.5"/>
  <text x="358" y="383" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#c0392b">p_max</text>
  <text x="325" y="169" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#c0392b">p₀</text>

  <!-- Jednadžba unutar panela -->
  <rect x="82" y="395" width="218" height="28" rx="6" fill="white" stroke="#c8d8e8" stroke-width="1.2"/>
  <text x="191" y="414" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#1a2530" text-anchor="middle">p = p₀ + ρ·g·h</text>

  <!-- ════════════════════════════════════
       PANEL 2 – Jednadžbe (x 400..590)
       ════════════════════════════════════ -->
  <rect x="400" y="46" width="190" height="406" rx="10" fill="#eaf9f1" stroke="#b8e0c8" stroke-width="1.3"/>
  <text x="495" y="66" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1a2530" text-anchor="middle">Ključne jednadžbe</text>

  <!-- Osnovna jednadžba -->
  <text x="495" y="116" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-style="italic" fill="#1a2530" text-anchor="middle">p = p₀ + ρgh</text>
  <line x1="418" y1="128" x2="572" y2="128" stroke="#b8e0c8" stroke-width="1.0"/>

  <!-- Diferencijalni oblik -->
  <text x="495" y="165" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-style="italic" fill="#1a2530" text-anchor="middle">dp/dz = −ρg</text>
  <line x1="418" y1="178" x2="572" y2="178" stroke="#b8e0c8" stroke-width="1.0"/>

  <!-- Opis -->
  <text x="495" y="207" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#3a6a4a" text-anchor="middle" font-style="italic">tlak raste linearno</text>
  <text x="495" y="221" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#3a6a4a" text-anchor="middle" font-style="italic">s dubinom h</text>
  <line x1="418" y1="232" x2="572" y2="232" stroke="#b8e0c8" stroke-width="1.0"/>

  <!-- Piezometarska visina -->
  <text x="495" y="262" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" fill="#1a2530" text-anchor="middle">H_p = p/(ρg) + z</text>
  <text x="495" y="280" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#3a6a4a" text-anchor="middle" font-style="italic">piezometarska visina</text>
  <line x1="418" y1="290" x2="572" y2="290" stroke="#b8e0c8" stroke-width="1.0"/>

  <!-- Diferencijalni manometar napomena -->
  <text x="495" y="318" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a2530" text-anchor="middle" font-style="italic">Δp = ρ_ind·g·Δh</text>
  <text x="495" y="334" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#3a6a4a" text-anchor="middle" font-style="italic">U-manometar</text>
  <line x1="418" y1="344" x2="572" y2="344" stroke="#b8e0c8" stroke-width="1.0"/>

  <!-- Kavitacija napomena -->
  <rect x="415" y="352" width="160" height="56" rx="6" fill="#fff8e8" stroke="#e0c870" stroke-width="1.0"/>
  <text x="495" y="370" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5c3d00" text-anchor="middle" font-weight="700">Pažnja: kavitacija</text>
  <text x="495" y="385" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5c3d00" text-anchor="middle">p_abs ≥ p_para fluida</text>
  <text x="495" y="399" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5c3d00" text-anchor="middle">→ limit usisne visine pumpe</text>

  <!-- ════════════════════════════════════
       PANEL 3 – Primjena u praksi (x 610..880)
       Hidrotehnička brana s vodom i trokutnom raspodjelom tlaka
       ════════════════════════════════════ -->
  <rect x="610" y="46" width="270" height="406" rx="10" fill="#fdf2e9" stroke="#e8c8a0" stroke-width="1.3"/>
  <text x="745" y="66" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1a2530" text-anchor="middle">Primjena u praksi</text>

  <!-- Tlo (hatch) -->
  <rect x="625" y="388" width="245" height="12" fill="url(#u3vhatch)" stroke="#4a6070" stroke-width="1.2"/>

  <!-- Brana (trapez) -->
  <polygon points="720,100 760,100 775,388 705,388" fill="#909fa8" stroke="#4a6070" stroke-width="2.0"/>
  <text x="740" y="270" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="700">brana</text>

  <!-- Voda (lijevo od brane) -->
  <polygon points="625,100 720,100 705,388 625,388" fill="url(#u3vfl)" stroke="none"/>
  <!-- Slobodna površina -->
  <line x1="622" y1="100" x2="722" y2="100" stroke="#1565c0" stroke-width="1.8" stroke-dasharray="6,4"/>
  <!-- p₀=atm labela -->
  <text x="640" y="94" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#8b5e00" font-style="italic">p₀=p_atm</text>
  <!-- H kota lijevo -->
  <line x1="618" y1="100" x2="624" y2="100" stroke="#b7600c" stroke-width="1"/>
  <line x1="618" y1="388" x2="624" y2="388" stroke="#b7600c" stroke-width="1"/>
  <line x1="621" y1="102" x2="621" y2="386" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u3vaDimL)" marker-end="url(#u3vaDim)"/>
  <text x="630" y="248" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-style="italic" font-weight="700" fill="#b7600c">H</text>

  <!-- Raspodjela tlaka (desno od brane, trokut) -->
  <polygon points="775,100 775,388 840,388" fill="#c0392b" fill-opacity="0.22" stroke="#c0392b" stroke-width="1.5"/>
  <text x="848" y="392" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#c0392b">p_max=ρgH</text>
  <text x="782" y="96" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#c0392b">p₀</text>

  <!-- Strelice tlaka na lijevoj plohi brane (horizontalne prema brani) -->
  <line x1="680" y1="150" x2="715" y2="150" stroke="#1565c0" stroke-width="1.1" marker-end="url(#u3vaBlu)"/>
  <line x1="672" y1="210" x2="713" y2="210" stroke="#1565c0" stroke-width="1.3" marker-end="url(#u3vaBlu)"/>
  <line x1="663" y1="275" x2="711" y2="275" stroke="#1565c0" stroke-width="1.6" marker-end="url(#u3vaBlu)"/>
  <line x1="651" y1="340" x2="710" y2="340" stroke="#1565c0" stroke-width="2.0" marker-end="url(#u3vaBlu)"/>

  <!-- Primjena label -->
  <rect x="625" y="405" width="245" height="34" rx="6" fill="white" stroke="#e8c8a0" stroke-width="1.0"/>
  <text x="747" y="419" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#3a4a56" text-anchor="middle">Strojarstvo: tlak na dnu tlačnog cilindra,</text>
  <text x="747" y="432" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#3a4a56" text-anchor="middle">Građevinarstvo: opterećenje brane, keson, temelj</text>
</svg>
