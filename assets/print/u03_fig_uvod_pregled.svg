      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.6" />
    </pattern>
    <marker id="u03fup_aB" markerWidth="6" markerHeight="4" refX="5.5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#356b83" />
    </marker>
