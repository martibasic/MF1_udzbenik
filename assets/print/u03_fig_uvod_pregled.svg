    <text x="630" y="160" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="start">Δh</text>
    <text x="542" y="208" font-family="Arial, Liberation Sans, sans-serif" font-size="10" fill="#263746" text-anchor="middle">Hg</text>
    <text x="522" y="242" font-family="Arial, Liberation Sans, sans-serif" font-size="12" fill="#263746" text-anchor="middle">p<tspan baseline-shift="sub" font-size="0.7em">g</tspan> = p<tspan baseline-shift="sub" font-size="0.7em">atm</tspan> + ρ<tspan baseline-shift="sub" font-size="0.7em">Hg</tspan> g Δh</text>
