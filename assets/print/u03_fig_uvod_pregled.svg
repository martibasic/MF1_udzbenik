  <text x="190" y="46" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">Hidrostatska raspodjela tlaka</text>
  <text x="178" y="128" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" text-anchor="middle" fill="#263746" font-style="italic">p<tspan baseline-shift="sub" font-size="0.7em">0</tspan> = p<tspan baseline-shift="sub" font-size="0.7em">atm</tspan>
  </text>
  <text x="130" y="220" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-style="italic" fill="#263746">voda, ρ</text>
  <text x="182" y="338" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" fill="#263746">A</text>
  <text x="292" y="146" fill="#263746" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="start">p<tspan baseline-shift="sub" font-size="0.7em">M</tspan> = 0</text>
  <text x="346" y="424" fill="#263746" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="end">p<tspan baseline-shift="sub" font-size="0.7em">M</tspan> = p − p₀</text>
  <text x="306" y="330" fill="#263746" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="start">p<tspan baseline-shift="sub" font-size="0.7em">M,A</tspan>
  </text>
  <text x="190" y="454" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746" font-style="italic">Tlak raste linearno s dubinom h</text>
  <text x="190" y="470" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#263746">(strelice: tlačno opterećenje stijenke)</text>
  <text x="822" y="44" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">Ključne jednadžbe poglavlja</text>
  <text x="822" y="80" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#263746">diferencijalni oblik</text>
  <text x="822" y="108" font-family="Arial, Liberation Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#263746" font-style="italic">dp/dz = −ρg</text>
  <text x="822" y="146" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#263746">radna jednadžba (homogen fluid)</text>
  <text x="822" y="174" font-family="Arial, Liberation Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#263746" font-style="italic">p = p<tspan baseline-shift="sub" font-size="0.7em">0</tspan> + ρgh</text>
  <text x="822" y="212" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#263746">tlačna visina</text>
  <text x="822" y="240" font-family="Arial, Liberation Sans, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#263746" font-style="italic">h<tspan baseline-shift="sub" font-size="0.7em">p</tspan> = p<tspan baseline-shift="sub" font-size="0.7em">M</tspan> / (ρg)</text>
  <text x="822" y="278" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#263746">apsolutni i manometarski tlak</text>
  <text x="822" y="306" font-family="Arial, Liberation Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#263746" font-style="italic">p<tspan baseline-shift="sub" font-size="0.7em">aps</tspan> = p<tspan baseline-shift="sub" font-size="0.7em">atm</tspan> + p<tspan baseline-shift="sub" font-size="0.7em">M</tspan>
  </text>
  <text x="822" y="324" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746" font-style="italic" transform="translate(0 8)">p<tspan baseline-shift="sub" font-size="0.7em">M</tspan> &lt; 0 → podtlak (vakuum)</text>
  <text x="822" y="360" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#263746">radni postupak kroz manometar</text>
  <text x="822" y="382" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" text-anchor="middle" fill="#263746">silazak: +ρgΔh   penjanje: −ρgΔh</text>
  <text x="822" y="400" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" text-anchor="middle" fill="#263746">ista razina → isti tlak (isti fluid)</text>
  <text x="822" y="430" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#263746" font-weight="700">PRIMJENA</text>
  <text x="822" y="446" font-family="Arial, Liberation Sans, sans-serif" font-size="10" text-anchor="middle" fill="#263746">spremnici · piezometri · U-manometri</text>
  <text x="822" y="460" font-family="Arial, Liberation Sans, sans-serif" font-size="10" text-anchor="middle" fill="#263746">diferencijalni manometri preko filtra ili izmjenjivača</text>
  <text x="42" y="247" font-family="Arial, Liberation Sans, sans-serif" font-size="16" font-style="italic" font-weight="700" text-anchor="middle" fill="#263746">h</text>
