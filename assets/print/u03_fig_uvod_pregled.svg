<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-labelledby="u03fup_title u03fup_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="u03fup_title">Pregled poglavlja 3 - Hidrostatika, raspodjela tlaka i manometrija</title>
  <desc id="u03fup_desc">Pregled hidrostatike. Lijevo je trokut manometarskog tlaka s nulom na atmosferskoj površini. Srednji manometri imaju otvorene spojeve i ujednačen presjek. Donji izraz vrijedi za isti radni fluid gustoće rho u oba voda na istoj visini. Tlakovi su skalarni; strelice uz raspodjelu predstavljaju opterećenje stijenke.</desc>
