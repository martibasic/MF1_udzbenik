    <text x="522" y="471" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" fill="#263746" text-anchor="middle">p<tspan baseline-shift="sub" font-size="0.7em">1</tspan> − p<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = (ρ<tspan baseline-shift="sub" font-size="0.7em">Hg</tspan> − ρ) g Δh</text>
