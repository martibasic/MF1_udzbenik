      <path d="M0,0 L0,5 L6,2.5 z" fill="#657781" />
    </marker>
    <marker id="u03fup_aDimR" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse">
      <path d="M0,0 L0,5 L6,2.5 z" fill="#657781" />
    </marker>
