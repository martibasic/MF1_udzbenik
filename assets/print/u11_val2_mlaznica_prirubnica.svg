<text x="640" y="282" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">3 · Aksijalna sila prirubnice</text>
<text x="640" y="306" font-size="13" fill="#1a2530" text-anchor="start">R = pM1 A₁ − ρ Q (v₂ − v₁)</text>
<text x="640" y="328" font-size="13" fill="#1a2530" text-anchor="start">R ≈ 445 N (vlačno opterećenje)</text>
