<text x="640" y="190" font-size="13" fill="#1565c0" text-anchor="start" font-weight="700">2 · Kontinuitet i energija</text>
<text x="640" y="214" font-size="13" fill="#1a2530" text-anchor="start">v₁ ≈ 0,974 m/s</text>
<text x="640" y="236" font-size="13" fill="#1a2530" text-anchor="start">pM1 ≈ 16,4 kPa</text>
<rect x="625" y="261" width="305" height="80" rx="7" fill="white" stroke="#d4e3f0" stroke-width="1" stroke-opacity="0.65" />
