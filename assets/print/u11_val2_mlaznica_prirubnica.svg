<marker id="u11v2_axisMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#3a4a56"/></marker>
</defs>
<text x="28" y="49" font-size="17" fill="#1a2530" text-anchor="start" font-weight="700">Mlaznica, prirubnica i mjerna ploča</text>
