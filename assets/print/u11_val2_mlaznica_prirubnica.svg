<text x="640" y="122" font-size="13" fill="#1a2530" text-anchor="start">F = ρ A₂ v₂² = 215 N</text>
<text x="640" y="144" font-size="13" fill="#1a2530" text-anchor="start">v₂ ≈ 5,82 m/s; Q ≈ 37,0 L/s</text>
