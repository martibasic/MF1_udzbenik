<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="940" role="img" aria-labelledby="u11v2mp_u11v2-title" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <defs>
    <linearGradient id="u11v2mp_u11v2-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4eef8"/>
      <stop offset="100%" stop-color="#7ec8e8"/>
    </linearGradient>
    <linearGradient id="u11v2mp_u11v2-nozzle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0bec5"/>
      <stop offset="100%" stop-color="#78909c"/>
    </linearGradient>
    <pattern id="u11v2mp_u11v2-hatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#8090a0"/>
      <line x1="0" y1="8" x2="8" y2="0" stroke="#546e7a" stroke-width="1.8"/>
    </pattern>
    <marker id="u11v2mp_u11v2-ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0f766e"/>
    </marker>
    <marker id="u11v2mp_u11v2-ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#b42318"/>
    </marker>
    <marker id="u11v2mp_u11v2-agr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#546e7a"/>
    </marker>
    <marker id="u11v2mp_u11v2-agr-rev" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#546e7a"/>
    </marker>
  </defs>
  <rect width="940" height="460" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="412" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>
  <!-- Dovodna cijev (D=220mm, lijevaa) -->
  <rect x="54" y="202" width="168" height="58" rx="3" fill="#c8d6df" stroke="#2d3a40" stroke-width="2.5"/>
  <rect x="57" y="207" width="162" height="48" fill="url(#u11v2mp_u11v2-water)" stroke="none"/>
  <!-- Prirubnica (flange) section A-A at x=222 -->
  <rect x="220" y="190" width="18" height="82" rx="3" fill="#78909c" stroke="#2d3a40" stroke-width="2.5"/>
  <!-- Bolts (small circles) -->
  <circle cx="229" cy="198" r="4" fill="#2d3a40"/>
  <circle cx="229" cy="214" r="4" fill="#2d3a40"/>
  <circle cx="229" cy="258" r="4" fill="#2d3a40"/>
  <circle cx="229" cy="274" r="4" fill="#2d3a40"/>
  <!-- Section A-A label -->
  <text x="196" y="186" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#173043">A</text>
  <text x="238" y="186" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#173043">A</text>
  <line x1="210" y1="176" x2="210" y2="294" stroke="#173043" stroke-width="1.5" stroke-dasharray="6 3"/>
  <!-- Nozzle body (converging, gray) -->
  <polygon points="238,198 560,220 560,242 238,264" fill="url(#u11v2mp_u11v2-nozzle)" stroke="#2d3a40" stroke-width="2"/>
  <!-- Fluid inside nozzle -->
  <polygon points="240,209 558,222 558,240 240,253" fill="url(#u11v2mp_u11v2-water)" stroke="none"/>
  <!-- Free jet after nozzle exit -->
  <rect x="560" y="222" width="110" height="18" rx="2" fill="url(#u11v2mp_u11v2-water)" stroke="#1976a8" stroke-width="1.5"/>
  <!-- Measuring plate (srafura) -->
  <rect x="670" y="180" width="28" height="102" fill="url(#u11v2mp_u11v2-hatch)"/>
  <rect x="670" y="180" width="28" height="102" fill="none" stroke="#2d3a40" stroke-width="2.5"/>
  <text x="702" y="233" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">mjerna ploča</text>
  <!-- F_P force on plate -->
  <line x1="740" y1="265" x2="675" y2="265" stroke="#b42318" stroke-width="3.5" marker-end="url(#u11v2mp_u11v2-ar)"/>
  <text x="742" y="269" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#b42318">F&#x209A; = 215 N</text>
  <!-- Section 1 (after flange) -->
  <line x1="242" y1="185" x2="242" y2="278" stroke="#173043" stroke-width="2"/>
  <circle cx="242" cy="231" r="5" fill="#173043"/>
  <text x="248" y="282" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">1</text>
  <!-- Section 2 (nozzle exit) -->
  <line x1="562" y1="210" x2="562" y2="254" stroke="#173043" stroke-width="2"/>
  <circle cx="562" cy="231" r="5" fill="#173043"/>
  <text x="568" y="258" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">2</text>
  <!-- Velocity arrows -->
  <line x1="300" y1="231" x2="420" y2="231" stroke="#0f766e" stroke-width="3" marker-end="url(#u11v2mp_u11v2-ag)"/>
  <text x="328" y="222" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#0f766e">v&#x2081; = 0,97 m/s</text>
  <line x1="576" y1="231" x2="648" y2="231" stroke="#0f766e" stroke-width="3" marker-end="url(#u11v2mp_u11v2-ag)"/>
  <text x="576" y="222" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#0f766e">v&#x2082; = 5,82 m/s</text>
  <!-- Pressure labels -->
  <rect x="242" y="292" width="120" height="26" rx="6" fill="#f0f7ff" stroke="#93afc8" stroke-width="1.5"/>
  <text x="258" y="310" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">p&#x2098;&#x2081; = 16,4 kPa</text>
  <rect x="528" y="292" width="98" height="26" rx="6" fill="#f0f7ff" stroke="#93afc8" stroke-width="1.5"/>
  <text x="544" y="310" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">p&#x2082; = 0 (atm)</text>
  <!-- Bolt tension arrow (R, pointing left = tension pulling out) -->
  <line x1="192" y1="340" x2="100" y2="340" stroke="#b42318" stroke-width="3.5" marker-end="url(#u11v2mp_u11v2-ar)"/>
  <text x="194" y="345" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#b42318">R = 445 N (vlak)</text>
  <!-- Dimension lines for D and d -->
  <line x1="100" y1="202" x2="100" y2="260" stroke="#546e7a" stroke-width="1.5" marker-start="url(#u11v2mp_u11v2-agr-rev)" marker-end="url(#u11v2mp_u11v2-agr)"/>
  <text x="54" y="235" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#546e7a">D=220</text>
  <text x="62" y="248" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#546e7a">mm</text>
  <line x1="592" y1="222" x2="592" y2="240" stroke="#546e7a" stroke-width="1.5" marker-start="url(#u11v2mp_u11v2-agr-rev)" marker-end="url(#u11v2mp_u11v2-agr)"/>
  <text x="598" y="234" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#546e7a">d=90 mm</text>
  <!-- Formula box -->
  <rect x="54" y="358" width="838" height="58" rx="10" fill="#fffef6" stroke="#c49a0a" stroke-width="1.8"/>
  <text x="72" y="380" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">Q = A&#x2082;&#xB7;v&#x2082; = 37,0 L/s</text>
  <text x="242" y="380" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">&#x2502;</text>
  <text x="254" y="380" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">p&#x2098;&#x2081; = &#x03C1;/2&#xB7;(v&#x2082;&#xB2;&#x2212;v&#x2081;&#xB2;) = 16,4 kPa</text>
  <text x="534" y="380" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">&#x2502;</text>
  <text x="546" y="380" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">R = p&#x2098;&#x2081;&#xB7;A&#x2081; &#x2212; m&#x2D9;(v&#x2082;&#x2212;v&#x2081;) = 445 N</text>
  <text x="72" y="401" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#516677">Bernoulli (1&#x2192;2): F&#x209A; = &#x03C1;A&#x2082;v&#x2082;&#xB2; = 215 N &#x21D2; v&#x2082; = 5,82 m/s</text>
  <text x="534" y="401" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#516677">Vijci rade na vlak (prirubnica se razvlaci od mlaznice).</text>
</svg>