    <text x="72" y="216" font-size="13" fill="#263746" text-anchor="start">p<tspan baseline-shift="sub" font-size="0.75em">M1</tspan> ≈ 48,6 kPa</text>
    <text x="439" y="242" font-size="13" fill="#263746" text-anchor="start">p<tspan baseline-shift="sub" font-size="0.75em">M2</tspan> = 0</text>
    <text x="425" y="132" font-size="13" fill="#263746" text-anchor="start">p<tspan baseline-shift="sub" font-size="0.75em">M3</tspan> = 0</text>
