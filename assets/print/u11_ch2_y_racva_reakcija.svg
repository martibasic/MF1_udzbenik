<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="title">U11 CH 2 - Y-račva s mjerenom reakcijom konzole</title>
  <desc id="desc">Vodoravna Y-račva s jednim ravnim i jednim kosim izlazom. Konzola mjeri vertikalnu reakciju, a iz nje se vraćaju brzina, protok i ulazni tlak.</desc>
  <rect width="980" height="420" fill="#ffffff"/>
  <rect x="28" y="28" width="924" height="364" rx="18" fill="#ffffff" stroke="#c9d2d8" stroke-width="2"/>

  <text x="58" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#173043">U11 CH - Y-račva s mjerenom reakcijom konzole</text>
  <text x="58" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#516677">Inverzni račun: iz izmjerene sile vraćaju se brzine, protoci i ulazni pretlak račve.</text>

  <line x1="108" y1="240" x2="404" y2="240" stroke="#2d3a40" stroke-width="16" stroke-linecap="round"/>
  <line x1="108" y1="240" x2="404" y2="240" stroke="#d9edf4" stroke-width="9" stroke-linecap="round"/>
  <line x1="108" y1="240" x2="404" y2="240" stroke="#5b6770" stroke-width="2" stroke-linecap="round"/>

  <line x1="404" y1="240" x2="742" y2="240" stroke="#2d3a40" stroke-width="16" stroke-linecap="round"/>
  <line x1="404" y1="240" x2="742" y2="240" stroke="#d9edf4" stroke-width="9" stroke-linecap="round"/>
  <line x1="404" y1="240" x2="742" y2="240" stroke="#5b6770" stroke-width="2" stroke-linecap="round"/>

  <line x1="404" y1="240" x2="507" y2="62" stroke="#2d3a40" stroke-width="16" stroke-linecap="round"/>
  <line x1="404" y1="240" x2="507" y2="62" stroke="#d9edf4" stroke-width="9" stroke-linecap="round"/>
  <line x1="404" y1="240" x2="507" y2="62" stroke="#5b6770" stroke-width="2" stroke-linecap="round"/>

  <circle cx="404" cy="240" r="10" fill="#eef3f6" stroke="#5b6770" stroke-width="2"/>

  <polygon points="356,318 452,318 404,264" fill="#e8eef2" stroke="#5b6770" stroke-width="2"/>
  <rect x="330" y="320" width="148" height="22" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="360" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#173043">servisna konzola</text>

  <line x1="182" y1="240" x2="344" y2="240" stroke="#1565c0" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <rect x="204" y="202" width="92" height="28" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="226" y="221" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">Q1, v1</text>

  <line x1="482" y1="240" x2="674" y2="240" stroke="#1565c0" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <rect x="542" y="202" width="86" height="28" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="566" y="221" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">Q2, v</text>

  <line x1="440" y1="183" x2="465" y2="140" stroke="#1565c0" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <rect x="472" y="102" width="86" height="28" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="496" y="121" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">Q3, v</text>

  <line x1="404" y1="306" x2="404" y2="210" stroke="#2e8b57" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <rect x="420" y="264" width="108" height="28" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="440" y="283" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">R_y = 625 N</text>

  <rect x="126" y="150" width="126" height="28" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="150" y="169" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">p_M1, D1</text>

  <rect x="706" y="202" width="116" height="28" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="726" y="221" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">p_M2 = 0, D2</text>

  <rect x="528" y="42" width="148" height="28" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="548" y="61" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">p_M3 = 0, D3, 60°</text>

  <path d="M456 240 A52 52 0 0 0 430 195" fill="none" stroke="#8b5e3c" stroke-width="3"/>
  <text x="462" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">60°</text>

  <rect x="620" y="266" width="276" height="90" rx="12" fill="#f8fafb" stroke="#d6dde2" stroke-width="1.5"/>
  <text x="642" y="294" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#173043">Redoslijed</text>
  <text x="642" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">1. iz R_y vrati v po osi y</text>
  <text x="642" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">2. kontinuitet daje v1 i protoke</text>
  <text x="642" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">3. Bernoulli vraća p_M1, x-momentum R_x</text>

  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#1565c0"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#2e8b57"/>
    </marker>
  </defs>
</svg>