<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="u11ch2_title u11ch2_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:960px;height:auto;">
<title id="u11ch2_title">Y-račva s mjerenom reakcijom</title><desc id="u11ch2_desc">Tlocrt horizontalne Y-račve. Grana 3 zatvara 60 stupnjeva s pozitivnom osi x. Omjer promjera je 170 prema 100 prema 80. Izlazni presjek grane okomit je na njezinu os. Izdvojeni dijagram reakcije konzole pokazuje lijevu i gornju komponentu na listu, a ne prostorno hvatište sile.</desc>
