<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 566" role="img" aria-labelledby="u11ch2_title u11ch2_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:960px;height:auto;">
  <title id="u11ch2_title">Y-račva s mjerenom reakcijom</title>
  <desc id="u11ch2_desc">Tlocrt horizontalne Y-račve. Grana 3 zatvara 60 stupnjeva s pozitivnom osi x. Omjer promjera je 170 prema 100 prema 80. Izlazni presjek grane okomit je na njezinu os. Izdvojeni dijagram reakcije konzole pokazuje lijevu i gornju komponentu na listu, a ne prostorno hvatište sile. Isprekidana granica označuje odabrani kontrolni volumen fluida; uz krutu stijenku granice se podudaraju.</desc>
  <defs>
    <pattern id="u11ch2_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.8" />
    </pattern>
    <marker id="u11ch2_v" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
    </marker>
    <marker id="u11ch2_dim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse">
      <path d="M0 0 L6 2.5 L0 5 Z" fill="#657781" />
    </marker>
    <marker id="u11ch2_dimSmall" markerWidth="3" markerHeight="3" refX="3" refY="1.5" orient="auto-start-reverse">
      <path d="M0 0 L3 1.5 L0 3 Z" fill="#356b83" />
    </marker>
  </defs>
  <g font-family="Arial, Liberation Sans, sans-serif" fill="#3a4a56">
