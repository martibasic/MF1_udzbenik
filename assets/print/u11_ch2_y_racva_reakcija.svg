    <text x="61" y="492" font-size="13" fill="#263746" text-anchor="start">Reakcija konzole</text>
    <text x="220" y="419" font-size="13" fill="#263746" text-anchor="start">Rₓ ≈ 664 N ulijevo (iznos)</text>
    <text x="220" y="445" font-size="13" fill="#263746" text-anchor="start">Rᵧ = 625 N prema +y</text>
    <text x="220" y="482" font-size="12" fill="#263746" text-anchor="start">Sve brzine u m/s.</text>
    <text x="771.0" y="51" font-size="15" fill="#263746" text-anchor="middle" font-weight="700">Od mjerenja do procjene</text>
    <text x="625" y="98" font-size="13" fill="#263746" text-anchor="start" font-weight="700">Poprečna reakcija → brzina</text>
    <text x="625" y="122" font-size="13" fill="#263746" text-anchor="start">Rᵧ = ρ A₃ v₃² sin 60°</text>
    <text x="625" y="144" font-size="13" fill="#263746" text-anchor="start">v₂ = v₃ = 12,0 m/s</text>
    <text x="625" y="190" font-size="13" fill="#263746" text-anchor="start" font-weight="700">Kontinuitet i tlak</text>
    <text x="625" y="214" font-size="13" fill="#263746" text-anchor="start">v₁ ≈ 6,81 m/s; Q₁ ≈ 154,5 L/s</text>
    <text x="625" y="236" font-size="13" fill="#263746" text-anchor="start">p<tspan baseline-shift="sub" font-size="0.75em">M1</tspan> ≈ 48,6 kPa</text>
    <text x="625" y="282" font-size="13" fill="#263746" text-anchor="start" font-weight="700">Ukupna reakcija</text>
    <text x="625" y="306" font-size="13" fill="#263746" text-anchor="start">R ≈ 913 N &lt; 1000 N</text>
    <text x="625" y="328" font-size="13" fill="#263746" text-anchor="start">Rezerva do zadane granice ≈ 87 N</text>
    <text x="625" y="374" font-size="13" fill="#263746" text-anchor="start" font-weight="700">Zaključak u zadanom modelu</text>
    <text x="625" y="398" font-size="13" fill="#263746" text-anchor="start">Zadovoljen zadani statički kriterij.</text>
