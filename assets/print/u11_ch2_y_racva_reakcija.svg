    <line x1="25" y1="317" x2="35" y2="317" stroke="#657781" stroke-width="1.2" />
    <path id="u11ch2_D1" d="M30 249 L30 317" fill="none" stroke="#657781" stroke-width="1.4" marker-start="url(#u11ch2_dim)" marker-end="url(#u11ch2_dim)" />
    <text x="55" y="343" font-size="13" fill="#263746" text-anchor="start">D₁ = 170 mm</text>
    <line x1="544" y1="263" x2="554" y2="263" stroke="#657781" stroke-width="1.2" />
    <line x1="544" y1="303" x2="554" y2="303" stroke="#657781" stroke-width="1.2" />
    <path id="u11ch2_D2" d="M549 263 L549 303" fill="none" stroke="#657781" stroke-width="1.4" marker-start="url(#u11ch2_dim)" marker-end="url(#u11ch2_dim)" />
    <text x="430" y="333" font-size="13" fill="#263746" text-anchor="start">D₂ = 100 mm</text>
    <line x1="380.143593539449" y1="112.18722408852554" x2="390.143593539449" y2="94.86671601283678" stroke="#657781" stroke-width="1" />
    <line x1="407.856406460551" y1="128.18722408852554" x2="417.856406460551" y2="110.86671601283678" stroke="#657781" stroke-width="1" />
    <path id="u11ch2_D3" d="M387.143593539449 100.0628684355434 L414.856406460551 116.0628684355434" fill="none" stroke="#657781" stroke-width="1.4" marker-start="url(#u11ch2_dim)" marker-end="url(#u11ch2_dim)" />
    <text x="332" y="83" font-size="13" fill="#263746" text-anchor="start">D₃ = 80 mm</text>
