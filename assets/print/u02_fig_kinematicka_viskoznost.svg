<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="u02fkv_title u02fkv_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:820px;height:auto;">
  <title id="u02fkv_title">Kinematička viskoznost kao omjer dinamičke viskoznosti i gustoće</title>
  <desc id="u02fkv_desc">Lijevo: smicanje uljnog sloja između pomične gornje i nepomične donje ploče — linearan profil brzine u(y), smično naprezanje tau prema Newtonovom zakonu tau = mi dv/dy, razmak delta. Ilustrira značenje dinamičke viskoznosti mi. Desno: panel s izvodom kinematičke viskoznosti nu = mi/ro = 0,18/900 ≈ 2,0·10⁻⁴ m²/s = 200 cSt i ulogom u Reynoldsovom broju.</desc>

  <defs>
    <linearGradient id="u02fkv_ulje" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a" />
      <stop offset="1" stop-color="#c8a000" />
    </linearGradient>
    <linearGradient id="u02fkv_ploca" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#909fa8" />
      <stop offset="1" stop-color="#5d6d7e" />
    </linearGradient>
    <pattern id="u02fkv_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.1" />
    </pattern>
    <marker id="u02fkv_v" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1565c0" />
    </marker>
    <marker id="u02fkv_tau" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1e8449" />
    </marker>
    <marker id="u02fkv_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u02fkv_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
  </defs>

  <rect x="16" y="16" width="868" height="368" rx="14" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.4" />
  <line x1="440" y1="40" x2="440" y2="360" stroke="#dce7f0" stroke-width="1.2" stroke-dasharray="4,5" />

  <!-- ===================== LIJEVO: smicanje uljnog sloja (znacenje mi) ===================== -->
  <!-- gornja ploca (pomicna) -->
  <rect x="80" y="110" width="300" height="15" fill="url(#u02fkv_ploca)" stroke="#3a4a56" stroke-width="1.2" />
  <rect x="80" y="100" width="300" height="10" fill="url(#u02fkv_hatch)" stroke="#3a4a56" stroke-width="0.8" />
  <!-- uljni sloj -->
  <rect x="80" y="125" width="300" height="128" fill="url(#u02fkv_ulje)" />
  <!-- donja ploca (nepomicna) -->
  <rect x="80" y="253" width="300" height="15" fill="url(#u02fkv_ploca)" stroke="#3a4a56" stroke-width="1.2" />
  <rect x="80" y="268" width="300" height="9" fill="url(#u02fkv_hatch)" stroke="#3a4a56" stroke-width="0.8" />

  <!-- nulta os brzine (lijevi rub, dashed) -->
  <line x1="80" y1="125" x2="80" y2="253" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="4,3" />
  <!-- trokutna ispuna profila -->
  <polygon points="80,253 80,125 310,125" fill="#1565c0" fill-opacity="0.10" />
  <!-- linija profila brzine -->
  <line x1="80" y1="253" x2="310" y2="125" stroke="#0d47a1" stroke-width="2.5" />
  <!-- strelice brzine (linearan profil) -->
  <line x1="80" y1="232" x2="119" y2="232" stroke="#1565c0" stroke-width="2" marker-end="url(#u02fkv_v)" />
  <line x1="80" y1="208" x2="161" y2="208" stroke="#1565c0" stroke-width="2" marker-end="url(#u02fkv_v)" />
  <line x1="80" y1="184" x2="204" y2="184" stroke="#1565c0" stroke-width="2" marker-end="url(#u02fkv_v)" />
  <line x1="80" y1="160" x2="246" y2="160" stroke="#1565c0" stroke-width="2" marker-end="url(#u02fkv_v)" />
  <line x1="80" y1="136" x2="289" y2="136" stroke="#1565c0" stroke-width="2" marker-end="url(#u02fkv_v)" />

  <!-- v strelica iznad gornje ploce -->
  <line x1="214" y1="92" x2="314" y2="92" stroke="#1565c0" stroke-width="3" marker-end="url(#u02fkv_v)" />

  <!-- tau strelica (smicno naprezanje na uljnom sloju) -->
  <line x1="320" y1="170" x2="372" y2="170" stroke="#1e8449" stroke-width="3.5" marker-end="url(#u02fkv_tau)" />

  <!-- delta kota (razmak) - lijevo izvana -->
  <line x1="80" y1="125" x2="54" y2="125" stroke="#b7600c" stroke-width="0.7" />
  <line x1="80" y1="253" x2="54" y2="253" stroke="#b7600c" stroke-width="0.7" />
  <line x1="60" y1="125" x2="60" y2="253" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u02fkv_dimL)" marker-end="url(#u02fkv_dim)" />

  <!-- ===================== DESNO: PANEL S IZVODOM ===================== -->
  <rect x="456" y="64" width="392" height="288" rx="10" fill="#f4f9fd" stroke="#1565c0" stroke-width="1.4" />
  <rect x="456" y="64" width="392" height="30" rx="10" fill="#1565c0" />
  <rect x="456" y="80" width="392" height="14" fill="#1565c0" />
  <!-- glavna formula (highlight) -->
  <rect x="478" y="206" width="348" height="42" rx="8" fill="#eaf3fb" stroke="#1565c0" stroke-width="1.3" />
  <!-- rezultat badge -->
  <rect x="478" y="262" width="348" height="44" rx="9" fill="#eaf6ee" stroke="#1e8449" stroke-width="1.6" />
  <!-- separatori -->
  <line x1="478" y1="160" x2="826" y2="160" stroke="#c8d6e4" stroke-width="1" />
  <line x1="478" y1="324" x2="826" y2="324" stroke="#e2e8ee" stroke-width="1" />

  <!-- ===== TEKST (na vrhu) ===== -->
  <text x="44" y="60" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Smicanje uljnog sloja (značenje μ)</text>

  <text x="322" y="88" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" font-weight="700" fill="#1565c0">v</text>
  <text x="378" y="174" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-style="italic" fill="#1e8449">τ</text>
  <text x="124" y="214" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#0d47a1">u(y)</text>
  <text x="46" y="193" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" font-weight="700" text-anchor="end" fill="#b7600c">δ</text>
  <text x="230" y="121" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#3a4a56">pomična ploča</text>
  <text x="230" y="265" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#e8eef2">nepomična ploča</text>

  <text x="44" y="300" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530">Newtonov zakon: <tspan font-style="italic">τ</tspan> = <tspan font-style="italic">μ</tspan> · d<tspan font-style="italic">v</tspan>/d<tspan font-style="italic">y</tspan></text>
  <text x="44" y="320" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#5a6a78">veći μ → veći otpor smicanju pri istom profilu</text>
  <text x="44" y="340" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#6b5800">hidraulično ulje: μ = 0,18 Pa·s,  ρ = 900 kg/m³</text>

  <!-- ===== DESNI PANEL TEKST ===== -->
  <text x="652" y="85" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Kinematička viskoznost  ν = μ / ρ</text>

  <text x="652" y="122" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Dinamička viskoznost (otpor smicanju)</text>
  <text x="652" y="144" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#6b5800"><tspan font-style="italic">μ</tspan> = 0,18 Pa·s</text>

  <text x="652" y="180" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Gustoća (masena inercija)</text>
  <text x="652" y="194" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#3a4a56"><tspan font-style="italic">ρ</tspan> = 900 kg/m³</text>

  <text x="652" y="233" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1565c0">ν = μ / ρ = 0,18 / 900</text>

  <text x="652" y="290" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1e8449">ν ≈ 2,0·10⁻⁴ m²/s = 200 cSt</text>

  <text x="478" y="344" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1a2530">ν ulazi u Reynoldsov broj:  <tspan font-weight="700" fill="#1565c0">Re = v L / ν</tspan>   (1 cSt = 10⁻⁶ m²/s)</text>
</svg>
