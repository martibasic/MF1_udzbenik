<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="u02fkv_title u02fkv_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:900px;height:auto;">
<title id="u02fkv_title">Dinamička i kinematička viskoznost</title><desc id="u02fkv_desc">Lijevo je opći sloj ulja između ploča s prianjanjem, desno pretvorba mu 0,18 Pa s i rho 900 kg/m³ u nu 200 cSt. Nije zadan brojčani gradijent brzine.</desc>
<defs>
<linearGradient id="u02fkv_water" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#aed6f1"/><stop offset="100%" stop-color="#5b9ec9"/></linearGradient>
<linearGradient id="u02fkv_oil" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#c8a000"/></linearGradient>
<linearGradient id="u02fkv_hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1a2e42"/><stop offset="100%" stop-color="#1a3a52"/></linearGradient>
<pattern id="u02fkv_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.8"/></pattern>
<marker id="u02fkv_v" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#1e8449"/></marker>
<marker id="u02fkv_dim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse"><path d="M0 0 L6 2.5 L0 5 Z" fill="#b7600c"/></marker>
<marker id="u02fkv_dimSmall" markerWidth="3" markerHeight="3" refX="3" refY="1.5" orient="auto-start-reverse"><path d="M0 0 L3 1.5 L0 3 Z" fill="#b7600c"/></marker>
</defs>
<rect width="900" height="400" fill="white"/>
<g font-family="'Segoe UI',Arial,sans-serif" fill="#1a2530">
<!-- Zadržane neutralne boje i zaglavlja iz postojećih panela.
Jedna prostorna ispuna predstavlja isti fluid; nije mapa tlaka ili brzine.
Strelice imaju značenje iz oznake; izdvojeni vektori sila ne određuju hvatište. -->
<defs>
<marker id="u02fkv_forceMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#c0392b"/></marker>
<marker id="u02fkv_pressureMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#1565c0"/></marker>
<marker id="u02fkv_reactionMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#1e8449"/></marker>
<marker id="u02fkv_axisMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#3a4a56"/></marker>
</defs>
<defs><linearGradient id="u02fkv_metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#909fa8"/><stop offset="100%" stop-color="#5d6d7e"/></linearGradient></defs>
<!-- Fluidna ispuna nije mapa tlaka, brzine ili temperature. Debljine stijenki uvećane su radi čitljivosti. -->
<text x="215" y="41" font-size="15" fill="#1a2530" text-anchor="middle" font-weight="700">Smicanje ulja — značenje μ</text>
<defs><linearGradient id="u02fkv_shearfield" gradientUnits="userSpaceOnUse" x1="0" y1="126" x2="0" y2="257"><stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#c8a000"/></linearGradient></defs>
<rect id="u02fkv_shearfluid" x="65" y="126" width="310" height="131" rx="0" fill="url(#u02fkv_shearfield)" stroke="none" stroke-width="1.2"/>
<rect id="u02fkv_shearmoving" x="65" y="110" width="310" height="16" rx="0" fill="url(#u02fkv_metal)" stroke="#3a4a56" stroke-width="1.2"/>
<rect id="u02fkv_shearfixedbase" x="65" y="257" width="310" height="14" rx="0" fill="white" stroke="none" stroke-width="1.2"/>
<rect id="u02fkv_shearfixed" x="65" y="257" width="310" height="14" rx="0" fill="url(#u02fkv_hatch)" stroke="#3a4a56" stroke-width="1.2"/>
<line id="u02fkv_shearzero" x1="102.19999999999999" y1="257" x2="102.19999999999999" y2="126" stroke="#1565c0" stroke-width="1" stroke-dasharray="3 3"/>
<line id="u02fkv_shearprofile" x1="102.19999999999999" y1="257" x2="278.9" y2="126" stroke="#1565c0" stroke-width="1.7"/>
<path id="u02fkv_shearvelocity1" d="M102.19999999999999 230.8 L137.54 230.8" fill="none" stroke="#3a4a56" stroke-width="2.3" marker-end="url(#u02fkv_axisMarker)"/>
<path id="u02fkv_shearvelocity2" d="M102.19999999999999 204.6 L172.88 204.6" fill="none" stroke="#3a4a56" stroke-width="2.3" marker-end="url(#u02fkv_axisMarker)"/>
<path id="u02fkv_shearvelocity3" d="M102.19999999999999 178.4 L208.21999999999997 178.4" fill="none" stroke="#3a4a56" stroke-width="2.3" marker-end="url(#u02fkv_axisMarker)"/>
<path id="u02fkv_shearvelocity4" d="M102.19999999999999 152.2 L243.55999999999997 152.2" fill="none" stroke="#3a4a56" stroke-width="2.3" marker-end="url(#u02fkv_axisMarker)"/>
<path id="u02fkv_shearspeed" d="M158.0 83 L251.0 83" fill="none" stroke="#3a4a56" stroke-width="2.3" marker-end="url(#u02fkv_axisMarker)"/>
<text x="204.5" y="72.0" font-size="13" fill="#3a4a56" text-anchor="middle">v</text>
<path id="u02fkv_sheardrag" d="M161.1 126 L77.39999999999999 126" fill="none" stroke="#1e8449" stroke-width="2.3" marker-end="url(#u02fkv_reactionMarker)"/>
<text x="78.95" y="149" font-size="13" fill="#1e8449" text-anchor="middle">Fᵥ</text>
<path id="u02fkv_shearpull" d="M313.0 118 L390.5 118" fill="none" stroke="#c0392b" stroke-width="2.3" marker-end="url(#u02fkv_forceMarker)"/>
<text x="368.8" y="106" font-size="13" fill="#c0392b" text-anchor="middle">F</text>
<text x="288.2" y="200.67" font-size="11" fill="#1565c0" text-anchor="start">u(y)</text>
<text x="220.0" y="290" font-size="10" fill="#1565c0" text-anchor="middle">donja stijenka: u = 0</text>
<line x1="42" y1="126" x2="52" y2="126" stroke="#b7600c" stroke-width="1.2"/>
<line x1="42" y1="257" x2="52" y2="257" stroke="#b7600c" stroke-width="1.2"/>
<path id="u02fkv_sheargap" d="M47 126 L47 257" fill="none" stroke="#b7600c" stroke-width="1.4" marker-start="url(#u02fkv_dim)" marker-end="url(#u02fkv_dim)"/>
<text x="31" y="195.5" font-size="11" fill="#b7600c" text-anchor="start">δ</text>
<text x="215" y="317" font-size="12" fill="#1565c0" text-anchor="middle">τ = μ du/dy; sile su na pokretnoj ploči</text>
<text x="215" y="341" font-size="12" fill="#3a4a56" text-anchor="middle">Za brojčani τ treba poznavati gradijent.</text>
<line x1="436" y1="35" x2="436" y2="365" stroke="#cbdce9" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="457" y="56" width="414" height="292" rx="9" fill="#f8fbff" stroke="#cbdce9" stroke-width="1.2"/>
<rect x="457" y="56" width="414" height="28" rx="7" fill="#1565c0" stroke="none" stroke-width="1.2"/>
<text x="664.0" y="75" font-size="13" fill="white" text-anchor="middle" font-weight="700">Kinematička viskoznost ν = μ/ρ</text>
<text x="664" y="120" font-size="17" fill="#b7600c" text-anchor="middle" font-weight="700">μ = 0,18 Pa·s</text>
<text x="664" y="153" font-size="16" fill="#3a4a56" text-anchor="middle" font-weight="700">ρ = 900 kg/m³</text>
<text x="664" y="209" font-size="20" fill="#1565c0" text-anchor="middle" font-weight="700">ν = 0,18/900</text>
<text x="664" y="257" font-size="18" fill="#1e8449" text-anchor="middle" font-weight="700">ν = 2,00·10⁻⁴ m²/s = 200 cSt</text>
<text x="664" y="319" font-size="12" fill="#1565c0" text-anchor="middle" font-weight="700">1 cSt = 10⁻⁶ m²/s</text>
</g>
</svg>
