<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" role="img" aria-labelledby="u13v2pg_title u13v2pg_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:880px;height:auto;">
  <title id="u13v2pg_title">Raspodjela ukupnog protoka u dvjema paralelnim granama</title>
  <desc id="u13v2pg_desc">Lijevo: shema cjevovoda s dvije paralelne grane razlicitih promjera d1 = 40 mm i d2 = 80 mm, duljine L = 36 m, ukupni protok Q_tot = 30 L/s ulazi u cvor A i izlazi iz cvora B. Desno: postupak rjesenja u cetiri koraka i rezultati v1, v2, Q1, Q2.</desc>

  <defs>
    <linearGradient id="u13v2pg_voda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aed6f1" />
      <stop offset="1" stop-color="#5b9ec9" />
    </linearGradient>
    <linearGradient id="u13v2pg_vodaH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe0f3" />
      <stop offset="1" stop-color="#6aabd0" />
    </linearGradient>
    <marker id="u13v2pg_flow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#0d47a1" />
    </marker>
    <marker id="u13v2pg_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u13v2pg_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
  </defs>

  <!-- Pozadina i okvirni paneli -->
  <rect x="14" y="14" width="912" height="472" rx="14" fill="#ffffff" stroke="#d4e3f0" stroke-width="1.2" />
  <rect x="22" y="22" width="500" height="456" rx="10" fill="#fbfdff" stroke="#dde8f1" stroke-width="1" />
  <rect x="530" y="22" width="396" height="456" rx="10" fill="#fbfdff" stroke="#dde8f1" stroke-width="1" />

  <!-- ============================================================ -->
  <!-- =====================  LIJEVI PANEL  ======================= -->
  <!-- ============================================================ -->

  <!-- Naslov lijevog panela -->
  <!-- =========== ULAZNA DIONICA (lijevo od A) =========== -->
  <!-- Ulazna cijev: x=60..120, centar y=240, debljina 26 (proporcionalno suckmi protoku) -->
  <rect x="60" y="227" width="60" height="26" fill="url(#u13v2pg_voda)" stroke="#3a4a56" stroke-width="1.4" />
  <!-- Strelica ulaznog protoka Q_tot -->
  <line x1="32" y1="240" x2="56" y2="240" stroke="#0d47a1" stroke-width="3" marker-end="url(#u13v2pg_flow)" />
  <!-- =========== CVOR A (lijevi raspored) =========== -->
  <!-- Vertikalni distribuciji "razdjelnik" cvora A: pravokutnik x=120..150 -->
  <rect x="120" y="155" width="30" height="170" fill="url(#u13v2pg_vodaH)" stroke="#3a4a56" stroke-width="1.4" />
  <!-- Cvor A oznaka -->
  <circle cx="135" cy="240" r="9" fill="#ffffff" stroke="#0d47a1" stroke-width="2" />
  <!-- =========== PARALELNE GRANE =========== -->
  <!-- Grana 1 (uza, d1 = 40 mm) -->
  <!-- Vertikalna spojnica gore: od cvora A (y=155, x=135) do glavnog kanala (y=175) -->
  <rect x="128" y="155" width="14" height="22" fill="url(#u13v2pg_voda)" stroke="#3a4a56" stroke-width="1.2" />
  <!-- Horizontalna grana 1: y=168..182 (debljina 14, proporcionalno d1=40) -->
  <rect x="142" y="168" width="246" height="14" fill="url(#u13v2pg_voda)" stroke="#3a4a56" stroke-width="1.2" />
  <!-- Vertikalna spojnica desno (grana 1 do cvora B): -->
  <rect x="388" y="155" width="14" height="22" fill="url(#u13v2pg_voda)" stroke="#3a4a56" stroke-width="1.2" />

  <!-- Grana 2 (siri, d2 = 80 mm = 2 x d1) -->
  <!-- Vertikalna spojnica gore (lijevo): -->
  <rect x="125" y="303" width="20" height="22" fill="url(#u13v2pg_vodaH)" stroke="#3a4a56" stroke-width="1.2" />
  <!-- Horizontalna grana 2: y=303..331 (debljina 28 = 2x grana 1) -->
  <rect x="142" y="303" width="246" height="28" fill="url(#u13v2pg_vodaH)" stroke="#3a4a56" stroke-width="1.4" />
  <!-- Vertikalna spojnica desno: -->
  <rect x="385" y="303" width="20" height="22" fill="url(#u13v2pg_vodaH)" stroke="#3a4a56" stroke-width="1.2" />

  <!-- =========== CVOR B (desni raspored) =========== -->
  <rect x="388" y="155" width="30" height="170" fill="url(#u13v2pg_vodaH)" stroke="#3a4a56" stroke-width="1.4" />
  <circle cx="403" cy="240" r="9" fill="#ffffff" stroke="#0d47a1" stroke-width="2" />
  <!-- =========== IZLAZNA DIONICA (desno od B) =========== -->
  <rect x="418" y="227" width="60" height="26" fill="url(#u13v2pg_voda)" stroke="#3a4a56" stroke-width="1.4" />
  <line x1="482" y1="240" x2="508" y2="240" stroke="#0d47a1" stroke-width="3" marker-end="url(#u13v2pg_flow)" />
  <!-- =========== Strelice protoka u granama =========== -->
  <!-- Grana 1: brzina v1 = 3,29 m/s (kraca strelica) -->
  <line x1="220" y1="175" x2="265" y2="175" stroke="#0d47a1" stroke-width="2.2" marker-end="url(#u13v2pg_flow)" />
  <!-- Grana 2: brzina v2 = 5,14 m/s (dulja strelica, omjer 1,56) -->
  <line x1="200" y1="317" x2="270" y2="317" stroke="#0d47a1" stroke-width="2.6" marker-end="url(#u13v2pg_flow)" />

  <!-- =========== Oznake grana iznad/ispod cijevi =========== -->
  <!-- Grana 1 oznake: iznad cijevi -->
  <!-- Grana 2 oznake: ispod cijevi -->
  <!-- =========== Brzine v1 i v2 (uz strelice) =========== -->
  <!-- =========== KOTA: duljina L = 36 m (gore, izmedu vertikalnih spojnica grane 1) =========== -->
  <!-- Pomocne linije -->
  <!-- Tik-crte -->
  <!-- Dimenzijska linija -->
  <!-- =========== KOTA: ista duljina L za granu 2 (dolje, simbolicno) =========== -->
  <!-- =========== Kontinuitet i isti pad energije: napomena =========== -->
  <rect x="42" y="438" width="460" height="30" rx="6" fill="#eef5fb" stroke="#cfe0ee" stroke-width="1" />
  <!-- ============================================================ -->
  <!-- =====================  DESNI PANEL  ======================== -->
  <!-- ============================================================ -->

  <!-- Header panel formule -->
  <rect x="546" y="40" width="364" height="30" rx="6" fill="#1565c0" />
  <!-- Korak 1: Povrsine presjeka -->
  <rect x="546" y="82" width="364" height="78" rx="7" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1" />
  <rect x="546" y="82" width="5" height="78" rx="2" fill="#1565c0" />
  <!-- Korak 2: Kontinuitet -->
  <rect x="546" y="170" width="364" height="86" rx="7" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1" />
  <rect x="546" y="170" width="5" height="86" rx="2" fill="#1565c0" />
  <!-- Korak 3: Brzine -->
  <rect x="546" y="266" width="364" height="78" rx="7" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1" />
  <rect x="546" y="266" width="5" height="78" rx="2" fill="#1565c0" />
  <!-- Korak 4: Protoci -->
  <rect x="546" y="354" width="364" height="78" rx="7" fill="#f1f9f3" stroke="#cce7d4" stroke-width="1" />
  <rect x="546" y="354" width="5" height="78" rx="2" fill="#1e8449" />
  <!-- Sazetak ispod panela -->
  <line x1="142" y1="168" x2="142" y2="98" stroke="#b7600c" stroke-width="0.7" />
  <line x1="388" y1="168" x2="388" y2="98" stroke="#b7600c" stroke-width="0.7" />
  <line x1="142" y1="92" x2="142" y2="108" stroke="#b7600c" stroke-width="1.2" />
  <line x1="388" y1="92" x2="388" y2="108" stroke="#b7600c" stroke-width="1.2" />
  <line x1="146" y1="100" x2="384" y2="100" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u13v2pg_dimL)" marker-end="url(#u13v2pg_dim)" />
  <line x1="142" y1="331" x2="142" y2="408" stroke="#b7600c" stroke-width="0.7" />
  <line x1="388" y1="331" x2="388" y2="408" stroke="#b7600c" stroke-width="0.7" />
  <line x1="142" y1="402" x2="142" y2="418" stroke="#b7600c" stroke-width="1.2" />
  <line x1="388" y1="402" x2="388" y2="418" stroke="#b7600c" stroke-width="1.2" />
  <line x1="146" y1="410" x2="384" y2="410" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u13v2pg_dimL)" marker-end="url(#u13v2pg_dim)" />
  <text x="42" y="50" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Shema paralelnih grana</text>
  <text x="42" y="68" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">Isti pad energije između čvorova A i B, različiti promjeri.</text>

  <text x="32" y="222" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#0d47a1"><tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">tot</tspan></text>
  <text x="32.0" y="238.0" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78">= 30 L/s</text>

  <text x="135" y="244" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#0d47a1">A</text>

  <text x="403" y="244" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#0d47a1">B</text>

  <text x="486" y="222" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#0d47a1"><tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">tot</tspan></text>
  <text x="486.0" y="238.0" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78">= 30 L/s</text>

  <text x="265" y="135" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#0d47a1">Grana 1</text>
  <text x="265" y="152" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">d</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> = 40 mm</text>

  <text x="265" y="364" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#0d47a1">Grana 2</text>
  <text x="265" y="381" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">d</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 80 mm</text>

  <text x="275" y="166" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#0d47a1"><tspan font-weight="700">v</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan></text>
  <text x="280" y="299" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#0d47a1"><tspan font-weight="700">v</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan></text>

  <text x="272" y="457" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#1a2530">
    Kontinuitet: <tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">tot</tspan> = <tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> + <tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan>  ·  isti gubitak između A i B → <tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> ≈ 1,56 <tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan>
  </text>

  <text x="728" y="60" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Postupak rješenja</text>

  <text x="728" y="102" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">1. Površine presjeka grana</text>
  <text x="728" y="124" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530">
    <tspan font-style="italic">A</tspan><tspan baseline-shift="sub" font-size="0.7em">i</tspan> = π <tspan font-style="italic">d</tspan><tspan baseline-shift="sub" font-size="0.7em">i</tspan><tspan baseline-shift="super" font-size="0.7em">2</tspan> / 4
  </text>
  <text x="728" y="148" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1565c0">
    <tspan font-style="italic">A</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> ≈ 1,257·10⁻³ m²  ·  <tspan font-style="italic">A</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> ≈ 5,027·10⁻³ m²
  </text>

  <text x="728" y="190" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">2. Kontinuitet uz uvjet jednakog gubitka</text>
  <text x="728" y="212" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530">
    <tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">tot</tspan> = <tspan font-style="italic">A</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> <tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> + <tspan font-style="italic">A</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> <tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan>
  </text>
  <text x="728" y="234" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1a2530">
    0,03 = (<tspan font-style="italic">A</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> + 1,56 <tspan font-style="italic">A</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan>) <tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan>
  </text>
  <text x="728" y="252" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-style="italic" text-anchor="middle" fill="#5a6a78">uz <tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 1,56 <tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan></text>

  <text x="728" y="286" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">3. Brzine u granama</text>
  <text x="728" y="310" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">
    <tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> ≈ 3,29 m/s
  </text>
  <text x="728" y="332" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">
    <tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 1,56 <tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> ≈ 5,14 m/s
  </text>

  <text x="728" y="374" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">4. Protoci u granama</text>
  <text x="728" y="396" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530">
    <tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">i</tspan> = <tspan font-style="italic">A</tspan><tspan baseline-shift="sub" font-size="0.7em">i</tspan> <tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="0.7em">i</tspan>
  </text>
  <text x="728" y="420" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1e8449">
    <tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> ≈ 4,1 L/s  ·  <tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> ≈ 25,9 L/s
  </text>

  <text x="728" y="454" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">Šira grana preuzima veći dio ukupnog protoka.</text>
  <text x="728" y="470" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78"><tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> + <tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> ≈ 30 L/s = <tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">tot</tspan> √</text>
<text x="265" y="91" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">L</tspan> = 36 m</text>

  <text x="265" y="428" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">L</tspan> = 36 m</text>

  </svg>