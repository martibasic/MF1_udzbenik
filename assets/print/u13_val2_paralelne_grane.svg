<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" role="img" aria-labelledby="u13v2pg_title u13v2pg_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u13v2pg_title">U13 Val 2 - paralelne grane</title>
  <desc id="u13v2pg_desc">Minimalna tehnička skica dviju paralelnih cijevi između spremnika s označenim ukupnim protokom, granama Q1 i Q2 te pravilom jednakog gubitka energije medu čvorovima.</desc>
  <rect width="940" height="320" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="272" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>

  <rect x="92" y="126" width="72" height="110" rx="8" fill="#eff6ff" stroke="#173043" stroke-width="3"/>
  <rect x="776" y="126" width="72" height="110" rx="8" fill="#eff6ff" stroke="#173043" stroke-width="3"/>
  <text x="116" y="252" font-family="'Segoe UI',Arial,sans-serif" font-size="16" fill="#173043">A</text>
  <text x="802" y="252" font-family="'Segoe UI',Arial,sans-serif" font-size="16" fill="#173043">B</text>

  <line x1="164" y1="158" x2="252" y2="158" stroke="#173043" stroke-width="4"/>
  <line x1="164" y1="204" x2="252" y2="204" stroke="#173043" stroke-width="4"/>
  <line x1="688" y1="158" x2="776" y2="158" stroke="#173043" stroke-width="4"/>
  <line x1="688" y1="204" x2="776" y2="204" stroke="#173043" stroke-width="4"/>
  <line x1="252" y1="158" x2="252" y2="204" stroke="#173043" stroke-width="4"/>
  <line x1="688" y1="158" x2="688" y2="204" stroke="#173043" stroke-width="4"/>

  <line x1="252" y1="158" x2="688" y2="158" stroke="#3a87ad" stroke-width="6"/>
  <line x1="252" y1="204" x2="688" y2="204" stroke="#3a87ad" stroke-width="12"/>

  <line x1="60" y1="181" x2="92" y2="181" stroke="#0f766e" stroke-width="4" marker-end="url(#u13v2pg_arrowGreen)"/>
  <text x="38" y="170" font-family="'Segoe UI',Arial,sans-serif" font-size="16" fill="#173043">Qtot</text>

  <line x1="338" y1="146" x2="404" y2="146" stroke="#0f766e" stroke-width="4" marker-end="url(#u13v2pg_arrowGreen)"/>
  <line x1="338" y1="220" x2="404" y2="220" stroke="#0f766e" stroke-width="4" marker-end="url(#u13v2pg_arrowGreen)"/>
  <text x="414" y="150" font-family="'Segoe UI',Arial,sans-serif" font-size="16" fill="#173043">Q1</text>
  <text x="414" y="224" font-family="'Segoe UI',Arial,sans-serif" font-size="16" fill="#173043">Q2</text>

  <text x="454" y="146" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">d1 = 40 mm</text>
  <text x="454" y="224" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">d2 = 80 mm</text>
  <text x="718" y="116" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">L = 36 m</text>

  <line x1="720" y1="132" x2="720" y2="230" stroke="#c96c35" stroke-width="3" marker-start="url(#u13v2pg_arrowOrangeSmall)" marker-end="url(#u13v2pg_arrowOrange)"/>
  <text x="732" y="186" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">isti h_w</text>

  <text x="224" y="286" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#516677">U paralelnom spoju grane dijele ukupni protok, ali između istih čvorova moraju imati isti gubitak energije.</text>

  <defs>
    <marker id="u13v2pg_arrowGreen" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#0f766e"/>
    </marker>
    <marker id="u13v2pg_arrowOrange" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#c96c35"/>
    </marker>
    <marker id="u13v2pg_arrowOrangeSmall" markerWidth="10" markerHeight="10" refX="4" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L6,3 z" fill="#c96c35"/>
    </marker>
  </defs>
</svg>