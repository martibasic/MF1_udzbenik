<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
<defs>
  <marker id="u13v2pg_u13v2-ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0f766e"/></marker>
  <marker id="u13v2pg_u13v2-ao" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#b45309"/></marker>
  <marker id="u13v2pg_u13v2-ao2" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0,0 3,8 6" fill="#b45309"/></marker>
  <linearGradient id="u13v2pg_u13v2-water" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d4eef8"/><stop offset="100%" stop-color="#7ec8e8"/></linearGradient>
  <linearGradient id="u13v2pg_u13v2-water2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c5e8f5"/><stop offset="100%" stop-color="#6ab8d6"/></linearGradient>
</defs>
<rect width="940" height="400" fill="#ffffff"/>
<rect x="24" y="24" width="892" height="352" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>
<text x="54" y="55" font-family="'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#173043">Paralelne grane: isti pad energije, različiti protoci</text>
<text x="54" y="76" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#516677">Q_tot = Q₁ + Q₂  ·  h_{w,1} = h_{w,2} između istih čvorova A i B</text>

<!-- Tank A (left, high level): x=44..116, from y=110 to y=300 -->
<rect x="44" y="110" width="72" height="210" rx="6" fill="none" stroke="#2d3a40" stroke-width="2.5"/>
<rect x="46" y="130" width="68" height="188" fill="url(#u13v2pg_u13v2-water)"/>
<line x1="44" y1="130" x2="116" y2="130" stroke="#1565c0" stroke-width="2"/>
<text x="80" y="120" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#173043" text-anchor="middle">A</text>

<!-- Tank B (right, lower level): x=824..896, y=170..300 -->
<rect x="824" y="170" width="72" height="150" rx="6" fill="none" stroke="#2d3a40" stroke-width="2.5"/>
<rect x="826" y="200" width="68" height="118" fill="url(#u13v2pg_u13v2-water2)"/>
<line x1="824" y1="200" x2="896" y2="200" stroke="#1565c0" stroke-width="2"/>
<text x="860" y="188" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#173043" text-anchor="middle">B</text>

<!-- Node C (left junction): x=180, y=210 -->
<circle cx="180" cy="210" r="8" fill="#f59e0b" stroke="#92400e" stroke-width="2"/>
<text x="172" y="240" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#173043">C</text>

<!-- Node D (right junction): x=760, y=210 -->
<circle cx="760" cy="210" r="8" fill="#f59e0b" stroke="#92400e" stroke-width="2"/>
<text x="752" y="240" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#173043">D</text>

<!-- Entry horizontal pipe from Tank A to Node C: y=206..214, x=116..172 -->
<rect x="116" y="205" width="56" height="18" fill="url(#u13v2pg_u13v2-water)" stroke="#2d3a40" stroke-width="2"/>

<!-- Pipe 1 (upper, d1=40mm, thinner): y=174..200, x=188..752 -->
<rect x="188" y="178" width="564" height="28" rx="0" fill="url(#u13v2pg_u13v2-water)" stroke="#2d3a40" stroke-width="2.5"/>
<!-- Pipe 1 flow arrow -->
<line x1="340" y1="192" x2="440" y2="192" stroke="#0f766e" stroke-width="2.5" marker-end="url(#u13v2pg_u13v2-ag)"/>
<text x="390" y="172" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">Q₁</text>
<text x="390" y="158" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677" text-anchor="middle">d₁ = 40 mm · L = 36 m</text>

<!-- Pipe 2 (lower, d2=80mm, thicker): y=216..256, x=188..752 -->
<rect x="188" y="216" width="564" height="44" rx="0" fill="url(#u13v2pg_u13v2-water2)" stroke="#2d3a40" stroke-width="2.5"/>
<!-- Pipe 2 flow arrow -->
<line x1="340" y1="238" x2="440" y2="238" stroke="#0f766e" stroke-width="2.5" marker-end="url(#u13v2pg_u13v2-ag)"/>
<text x="390" y="282" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">Q₂</text>
<text x="390" y="296" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677" text-anchor="middle">d₂ = 80 mm · L = 36 m</text>

<!-- Exit pipe from Node D to Tank B -->
<rect x="768" y="205" width="56" height="18" fill="url(#u13v2pg_u13v2-water)" stroke="#2d3a40" stroke-width="2"/>

<!-- Q_tot arrow into system (before node C) -->
<line x1="54" y1="210" x2="114" y2="210" stroke="#0f766e" stroke-width="3" marker-end="url(#u13v2pg_u13v2-ag)"/>
<text x="68" y="202" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#0f766e">Q_tot</text>

<!-- H level difference (orange bracket between water levels) -->
<line x1="132" y1="130" x2="132" y2="200" stroke="#b45309" stroke-width="2.5" marker-start="url(#u13v2pg_u13v2-ao2)" marker-end="url(#u13v2pg_u13v2-ao)"/>
<text x="144" y="168" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#b45309">H</text>

<!-- "isti h_w" annotation (orange, spanning from C to D at pipe-mid-level) -->
<line x1="190" y1="320" x2="750" y2="320" stroke="#b45309" stroke-width="2" stroke-dasharray="5,3"/>
<text x="470" y="338" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#b45309" text-anchor="middle">h_{w,1} = h_{w,2} = H  (isti energetski pad između C i D)</text>

<!-- Info panel -->
<rect x="44" y="340" width="860" height="36" rx="8" fill="#fffef6" stroke="#c49a0a" stroke-width="1.5"/>
<text x="60" y="358" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1e293b">Pravila: (1) Q_tot = Q₁ + Q₂</text>
<text x="310" y="358" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1e293b">(2) h_{w,1} = h_{w,2}</text>
<text x="500" y="358" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1e293b">(3) Iteracijsko rješenje: K₁Q₁² = K₂Q₂²</text>
</svg>