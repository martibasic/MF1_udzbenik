<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 382 358" role="img" aria-labelledby="u07fpk_title u07fpk_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:420px;height:auto;">
  <title id="u07fpk_title">Uzgon na uronjeno kućište crpke</title>
  <desc id="u07fpk_desc">Hermetičko kućište potpuno je uronjeno, s jasnim razmakom od dna i stijenki. Na kućište djeluju uzgon F-U prema gore i težina F-G prema dolje, u omjeru duljina F-G : F-U = 1,84 (833,9 N : 452,5 N); os z je prema gore. Nema reakcije dna. Sila držanja nije nacrtana: njezin iznos i smjer određuju se iz ravnoteže (bez nje neto sila djeluje prema dolje).</desc>
