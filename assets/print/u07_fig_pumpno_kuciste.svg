<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="u07fpk_title u07fpk_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:860px;height:auto;">
  <title id="u07fpk_title">Uzgon na uronjeno pumpno kućište</title>
  <desc id="u07fpk_desc">Hermetičko kućište potpuno je uronjeno, s jasnim razmakom od dna i stijenki. Na kućište djeluju uzgon prema gore i težina prema dolje. Nema reakcije dna. Bez sile držanja neto sila djeluje prema dolje; za kvazistatičko podizanje dok je tijelo potpuno uronjeno potrebna je dodatna sila 381 N prema gore.</desc>
  <defs>
    <pattern id="u07fpk_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.1" />
    </pattern>
    <marker id="u07fpk_fG" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#356b83" />
    </marker>
    <marker id="u07fpk_fU" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#356b83" />
    </marker>
    <marker id="u07fpk_fN" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#356b83" />
    </marker>
    <marker id="u07fpk_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#356b83" />
    </marker>
    <marker id="u07fpk_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#356b83" />
    </marker>
    <marker id="u07fpk_fix_force" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0 0 L0 5 L6 2.5 Z" fill="#356b83" stroke="none" stroke-width="1.2" />
    </marker>
    <marker id="u07fpk_fix_green" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0 0 L0 5 L6 2.5 Z" fill="#356b83" stroke="none" stroke-width="1.2" />
    </marker>
    <marker id="u07fpk_fix_normal" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0 0 L0 5 L6 2.5 Z" fill="#356b83" stroke="none" stroke-width="1.2" />
    </marker>
    <marker id="u07fpk_fix_axis" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0 0 L0 5 L6 2.5 Z" fill="#3a4a56" stroke="none" stroke-width="1.2" />
    </marker>
    <marker id="u07fpk_fix_dim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0 0 L0 5 L6 2.5 Z" fill="#356b83" stroke="none" stroke-width="1.2" />
    </marker>
    <marker id="u07fpk_fix_dimL" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse">
      <path d="M0 0 L0 5 L6 2.5 Z" fill="#356b83" stroke="none" stroke-width="1.2" />
    </marker>
    <pattern id="u07fpk_fix_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="7" height="7" fill="#d7dee3" stroke="none" stroke-width="1.2" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.1" />
    </pattern>
  </defs>
  <text x="452" y="50" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" fill="#263746">Bilanca sila na uronjeno kućište</text>
  <text x="472" y="88" font-family="Arial, Liberation Sans, sans-serif" font-size="12.5" font-weight="700" fill="#263746">1. Sila uzgona (Arhimed)</text>
  <text x="472" y="110" font-family="Arial, Liberation Sans, sans-serif" font-size="13" fill="#263746">
    <tspan font-style="italic" font-weight="700">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em" font-style="italic" font-weight="700">U</tspan> = ρ g V = 1025 · 9,81 · 0,045</text>
  <text x="472" y="132" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" font-weight="700" fill="#263746">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em" font-style="italic">U</tspan> ≈ 452,5 N ≈ 0,453 kN</text>
  <text x="472" y="176" font-family="Arial, Liberation Sans, sans-serif" font-size="12.5" font-weight="700" fill="#263746">2. Težina kućišta</text>
  <text x="472" y="198" font-family="Arial, Liberation Sans, sans-serif" font-size="13" fill="#263746">
    <tspan font-style="italic" font-weight="700">G</tspan> = m g = 85 · 9,81</text>
  <text x="472" y="220" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" font-weight="700" fill="#263746">
    <tspan font-style="italic">G</tspan> ≈ 833,9 N ≈ 0,834 kN</text>
  <text x="472" y="286" font-family="Arial, Liberation Sans, sans-serif" font-size="13" fill="#263746">
    <tspan font-style="italic" font-weight="700">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em" font-style="italic" font-weight="700">neto</tspan> = G − F<tspan baseline-shift="sub" font-size="0.7em">U</tspan> = 833,9 − 452,5</text>
  <text x="472" y="308" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" font-weight="700" fill="#263746">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em" font-style="italic">neto</tspan> ≈ 381,4 N ↓</text>
  <text x="472" y="352" font-family="Arial, Liberation Sans, sans-serif" font-size="12.5" font-weight="700" fill="#263746">4. Zaključak</text>
  <text x="472" y="374" font-family="Arial, Liberation Sans, sans-serif" font-size="12" fill="#263746">G &gt; F<tspan baseline-shift="sub" font-size="0.7em">U</tspan> → kućište tone; sila prema dolje nije potrebna.</text>
  <text x="468" y="427" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-weight="700" fill="#263746">REZULTATI</text>
  <text x="568" y="427" font-family="Arial, Liberation Sans, sans-serif" font-size="12.5" font-weight="700" fill="#263746">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em" font-style="italic">U</tspan> ≈ 453 N</text>
  <text x="688" y="427" font-family="Arial, Liberation Sans, sans-serif" font-size="12.5" font-weight="700" fill="#263746">
    <tspan font-style="italic">G</tspan> ≈ 834 N</text>
  <text x="800" y="427" font-family="Arial, Liberation Sans, sans-serif" font-size="12.5" font-weight="700" fill="#263746">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em" font-style="italic">neto</tspan> ≈ 381 N</text>
  <text x="472" y="264" font-family="Arial, Liberation Sans, sans-serif" font-size="12.5" font-weight="700" fill="#263746">3. Neto sila (prema dolje)</text>
  <g font-family="Arial, Liberation Sans, sans-serif" />
  <g id="u07fpk_fix_scene">
    <rect x="65" y="115" width="310" height="278" fill="#dcebf1" stroke="none" stroke-width="1.2" />
    <rect x="53" y="97" width="12" height="308" fill="url(#u07fpk_fix_hatch)" stroke="#3a4a56" stroke-width="1.2" />
    <rect x="375" y="97" width="12" height="308" fill="url(#u07fpk_fix_hatch)" stroke="#3a4a56" stroke-width="1.2" />
    <rect x="53" y="393" width="334" height="12" fill="url(#u07fpk_fix_hatch)" stroke="#3a4a56" stroke-width="1.2" />
    <line x1="65" y1="115" x2="375" y2="115" stroke="#356b83" stroke-width="2" />
    <rect x="137" y="255" width="172" height="80" fill="#d7dee3" stroke="#3a4a56" stroke-width="2" rx="7" id="u07fpk_fix_body" />
    <circle cx="223" cy="295" r="4" fill="#356b83" />
    <text x="237" y="297" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="middle">shema sila</text>
    <line x1="223" y1="295" x2="223" y2="217" stroke="#356b83" stroke-width="2.2" marker-end="url(#u07fpk_fix_green)" />
    <text x="234" y="223" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="start">F<tspan baseline-shift="sub" font-size="0.7em">U</tspan> = 453 N</text>
    <line x1="223" y1="295" x2="223" y2="374" stroke="#356b83" stroke-width="2.2" marker-end="url(#u07fpk_fix_force)" />
    <text x="234" y="365" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="start">G = 834 N</text>
    <text x="220" y="55" font-family="Arial, Liberation Sans, sans-serif" font-size="14" fill="#263746" text-anchor="middle" font-weight="700">Kućište potpuno uronjeno, bez oslonca</text>
    <text x="220" y="158" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="middle">morska voda, ρ = 1025 kg/m³</text>
    <text x="220" y="190" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="middle">V = 0,045 m³; m = 85 kg</text>
    <text x="220" y="437" font-family="Arial, Liberation Sans, sans-serif" font-size="10" fill="#263746" text-anchor="middle">Neto sila 381 N ↓; za mirno dizanje treba 381 N ↑.</text>
  </g>
</svg>
