  <rect x="452" y="66" width="396" height="78" rx="9" fill="white" stroke="#cfe0ee" stroke-width="1" stroke-opacity="0.65" />
  <rect x="452" y="66" width="2" height="78" rx="1" fill="#1565c0" />
  <rect x="452" y="154" width="396" height="78" rx="9" fill="white" stroke="#eccac2" stroke-width="1" stroke-opacity="0.65" />
  <rect x="452" y="154" width="2" height="78" rx="1" fill="#c0392b" />
  <rect x="452" y="242" width="396" height="78" rx="9" fill="white" stroke="#ecd9c2" stroke-width="1" stroke-opacity="0.65" />
  <rect x="452" y="330" width="396" height="60" rx="9" fill="white" stroke="#cce7d4" stroke-width="1" stroke-opacity="0.65" />
  <rect x="452" y="330" width="2" height="60" rx="1" fill="#1e8449" />
  <rect x="452" y="402" width="396" height="40" rx="8" fill="white" stroke="#1e8449" stroke-width="1" stroke-opacity="0.55" />
  <rect x="452" y="242" width="2" height="78" rx="1" fill="#b7600c" />
  <text x="452" y="50" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Ravnoteža sila na uronjeno kućište</text>
  <text x="472" y="88" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1565c0">1. Sila uzgona (Arhimed)</text>
  <text x="472" y="110" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1a2530">
    <tspan font-style="italic" font-weight="700">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em" font-style="italic" font-weight="700">U</tspan> = ρ g V = 1025 · 9,81 · 0,045</text>
  <text x="472" y="132" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1e8449">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em" font-style="italic">U</tspan> ≈ 452,5 N ≈ 0,453 kN</text>
  <text x="472" y="176" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#c0392b">2. Težina kućišta</text>
  <text x="472" y="198" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1a2530">
    <tspan font-style="italic" font-weight="700">G</tspan> = m g = 85 · 9,81</text>
  <text x="472" y="220" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#c0392b">
    <tspan font-style="italic">G</tspan> ≈ 833,9 N ≈ 0,834 kN</text>
  <text x="472" y="286" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1a2530">
    <tspan font-style="italic" font-weight="700">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em" font-style="italic" font-weight="700">neto</tspan> = G − F<tspan baseline-shift="sub" font-size="0.7em">U</tspan> = 833,9 − 452,5</text>
  <text x="472" y="308" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#7b2e22">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em" font-style="italic">neto</tspan> ≈ 381,4 N ↓</text>
  <text x="472" y="352" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1e8449">4. Zaključak</text>
  <text x="472" y="374" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530">G &gt; F<tspan baseline-shift="sub" font-size="0.7em">U</tspan> → kućište tone; sila prema dolje nije potrebna.</text>
  <text x="468" y="427" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#5a6a78">REZULTATI</text>
  <text x="568" y="427" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1e8449">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em" font-style="italic">U</tspan> ≈ 453 N</text>
  <text x="688" y="427" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#c0392b">
    <tspan font-style="italic">G</tspan> ≈ 834 N</text>
  <text x="800" y="427" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#7b2e22">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em" font-style="italic">neto</tspan> ≈ 381 N</text>
  <text x="472" y="264" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#b7600c">3. Neto sila (prema dolje)</text>
  <g font-family="'Segoe UI',Arial,sans-serif" />
  <g id="u07fpk_fix_scene">
    <rect x="65" y="115" width="310" height="278" fill="url(#u07fpk_fix_water)" stroke="none" stroke-width="1.2" />
    <rect x="53" y="97" width="12" height="308" fill="url(#u07fpk_fix_hatch)" stroke="#3a4a56" stroke-width="1.2" />
