    <rect x="137" y="255" width="172" height="80" fill="#909fa8" stroke="#3a4a56" stroke-width="2" rx="7" id="u07fpk_fix_body" />
    <circle cx="223" cy="295" r="4" fill="#1e8449" />
    <text x="237" y="297" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#3a4a56" text-anchor="middle">B, G</text>
    <line x1="223" y1="295" x2="223" y2="217" stroke="#1e8449" stroke-width="2.2" marker-end="url(#u07fpk_fix_green)" />
    <text x="234" y="223" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1e8449" text-anchor="start">F<tspan baseline-shift="sub" font-size="0.7em">U</tspan> = 453 N</text>
    <line x1="223" y1="295" x2="223" y2="374" stroke="#c0392b" stroke-width="2.2" marker-end="url(#u07fpk_fix_force)" />
    <text x="234" y="365" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#c0392b" text-anchor="start">G = 834 N</text>
    <text x="220" y="55" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#3a4a56" text-anchor="middle" font-weight="700">Kućište potpuno uronjeno, bez oslonca</text>
    <text x="220" y="158" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1565c0" text-anchor="middle">morska voda, ρ = 1025 kg/m³</text>
    <text x="220" y="190" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#3a4a56" text-anchor="middle">V = 0,045 m³; m = 85 kg</text>
    <text x="220" y="437" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#3a4a56" text-anchor="middle">Neto sila 381 N ↓; za mirno dizanje treba 381 N ↑.</text>
  </g>
</svg>
