<svg xmlns="http://www.w3.org/2000/svg" width="940" height="340" viewBox="0 0 940 340" role="img" aria-labelledby="u07fpk_u7fkT" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u07fpk_u7fkT">U07 WE – Uzgon na potonulo pumpno kućište</title>
  <defs>
    <pattern id="u07fpk_u7fkH" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#8090a0"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#546e7a" stroke-width="1.8"/>
    </pattern>
    <linearGradient id="u07fpk_u7fkWg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cce8f4"/>
      <stop offset="100%" stop-color="#5db8d8"/>
    </linearGradient>
    <marker id="u07fpk_u7fkAG" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
    </marker>
    <marker id="u07fpk_u7fkAR" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#b42318"/>
    </marker>
    <marker id="u07fpk_u7fkAD" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#546e7a"/>
    </marker>
    <marker id="u07fpk_u7fkADR" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L8,3 z" fill="#546e7a"/>
    </marker>
  </defs>
  <rect width="940" height="340" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="292" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>

  <!-- ── BASIN (left panel) ── -->
  <!-- Seawater fill -->
  <rect x="80" y="90" width="400" height="210" fill="url(#u07fpk_u7fkWg)" opacity="0.7"/>
  <!-- Basin floor (srafura) -->
  <rect x="80" y="300" width="400" height="10" fill="url(#u07fpk_u7fkH)"/>
  <!-- Basin walls (srafura left/right) -->
  <rect x="56" y="90" width="24" height="220" fill="url(#u07fpk_u7fkH)"/>
  <rect x="480" y="90" width="24" height="220" fill="url(#u07fpk_u7fkH)"/>
  <!-- Water surface -->
  <line x1="80" y1="90" x2="480" y2="90" stroke="#1565c0" stroke-width="2"/>
  <text x="84" y="86" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1565c0">p.p.</text>
  <!-- Basin floor line -->
  <line x1="80" y1="300" x2="480" y2="300" stroke="#37474f" stroke-width="2"/>

  <!-- Pump housing (on floor): x=168..312 (144px), y=242..300 (58px) -->
  <rect x="168" y="242" width="144" height="58" rx="4" fill="#90a4ae" stroke="#37474f" stroke-width="3"/>
  <!-- Inner detail (cross pattern suggesting machinery) -->
  <line x1="168" y1="271" x2="312" y2="271" stroke="#546e7a" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="240" y1="242" x2="240" y2="300" stroke="#546e7a" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="210" y="263" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#173043">pumpno</text>
  <text x="213" y="277" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#173043">kućište</text>

  <!-- F_U arrow (green, upward from top of housing) -->
  <line x1="240" y1="242" x2="240" y2="100" stroke="#0f766e" stroke-width="4" marker-end="url(#u07fpk_u7fkAG)"/>
  <text x="248" y="120" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#0f766e">F_U = 452,5 N</text>

  <!-- G arrow (red, downward into housing) -->
  <line x1="195" y1="160" x2="195" y2="238" stroke="#b42318" stroke-width="4" marker-end="url(#u07fpk_u7fkAR)"/>
  <text x="136" y="155" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#b42318">G = 833,9 N</text>

  <!-- Net force annotation -->
  <text x="155" y="228" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#b42318">F_neto=381,4N↓</text>
  <text x="155" y="242" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b42318">(kućište tone)</text>

  <!-- Volume annotation -->
  <text x="325" y="270" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043">V=0,045m³</text>
  <text x="325" y="287" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043">m=85 kg</text>

  <!-- ── FORMULA BOX ── -->
  <rect x="532" y="88" width="354" height="210" rx="10" fill="#fffef6" stroke="#c49a0a" stroke-width="1.8"/>
  <text x="554" y="113" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">Ravnoteža sila</text>
  <line x1="554" y1="121" x2="878" y2="121" stroke="#e8d89a" stroke-width="1"/>
  <text x="554" y="141" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">F_U = ρ g V = 1025·9,81·0,045</text>
  <text x="554" y="161" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#0f766e">F_U = 452,5 N</text>
  <line x1="554" y1="171" x2="878" y2="171" stroke="#e8d89a" stroke-width="1"/>
  <text x="554" y="191" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">G = m g = 85 · 9,81</text>
  <text x="554" y="211" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#b42318">G = 833,9 N</text>
  <line x1="554" y1="221" x2="878" y2="221" stroke="#e8d89a" stroke-width="1"/>
  <text x="554" y="241" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">F_neto = G − F_U</text>
  <text x="554" y="261" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">F_neto = 381,4 N  (prema dolje)</text>
  <text x="554" y="283" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#516677">Kućište je teže od istisnine</text>
  <text x="554" y="299" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#516677">→ ne može plutati, tone na dno.</text>
</svg>