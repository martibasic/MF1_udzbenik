<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 382 411" role="img" aria-labelledby="u07fpk_title u07fpk_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:420px;height:auto;">
  <title id="u07fpk_title">Uzgon na uronjeno pumpno kućište</title>
  <desc id="u07fpk_desc">Hermetičko kućište potpuno je uronjeno, s jasnim razmakom od dna i stijenki. Na kućište djeluju uzgon prema gore i težina prema dolje. Nema reakcije dna. Bez sile držanja neto sila djeluje prema dolje; za kvazistatičko podizanje dok je tijelo potpuno uronjeno potrebna je dodatna sila držanja prema gore.</desc>
