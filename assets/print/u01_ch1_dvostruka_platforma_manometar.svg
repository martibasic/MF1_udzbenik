<text x="388" y="567" font-size="11" fill="#3a4a56" text-anchor="middle">Prikazan tlačni potez; ventili i spremnik nisu prikazani. Hodovi imaju zasebne skale.</text>
<text x="490.0" y="593" font-size="11" fill="#3a4a56" text-anchor="middle">Crveno/zeleno: sile na označeno tijelo · Tamno: smjer pomaka · Smeđe: kote i geometrija.</text>
<text x="490.0" y="609" font-size="10" fill="#3a4a56" text-anchor="middle">Ispuna označuje isti fluid, ne polje tlaka. Razmaci, hodovi i duljine sila nisu u istom mjerilu.</text>
