<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="u01ch1_title u01ch1_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
<title id="u01ch1_title">Dvostruka platforma s ručnom pumpom</title><desc id="u01ch1_desc">Jednaki vođeni cilindri nose platformu, a mali pumpni klip tlači povezano ulje. Prikazan je tlačni potez; nepovratni ventili i spremnik su izvan sheme. Jedan puni potez i pomak platforme imaju vlastite početne plohe. Zbroj poteza nije kota cilindra.</desc>
