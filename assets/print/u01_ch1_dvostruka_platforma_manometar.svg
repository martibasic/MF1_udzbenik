  <line x1="767" y1="148" x2="767" y2="198" stroke="#1565c0" stroke-width="4" marker-end="url(#u01c1dpm_c1aBl)"/>
  <text x="782" y="154" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" font-style="italic" fill="#1565c0">F&#8346;</text>
  <text x="782" y="172" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1565c0">= 460 N</text>

  <!-- Kota sp pumpe -->
  <line x1="724" y1="200" x2="724" y2="263" stroke="#b7600c" stroke-width="1.8" marker-start="url(#u01c1dpm_c1aOR)" marker-end="url(#u01c1dpm_c1aO)"/>
  <text x="706" y="236" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" font-style="italic" fill="#b7600c">s&#8346;</text>
  <text x="692" y="252" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#b7600c">= 0,18 m</text>

  <!-- Kota Ap -->
  <line x1="756" y1="244" x2="756" y2="237" stroke="#3a3a3a" stroke-width="1.2"/>
  <line x1="778" y1="244" x2="778" y2="237" stroke="#3a3a3a" stroke-width="1.2"/>
  <line x1="758" y1="240" x2="776" y2="240" stroke="#3a3a3a" stroke-width="1.2" marker-start="url(#u01c1dpm_c1aDimR)" marker-end="url(#u01c1dpm_c1aDim)"/>
  <text x="767" y="234" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#3a3a3a">A&#8346; = 5 cm²</text>

  <!-- n hodova badge desno od pumpe -->
  <rect x="810" y="248" width="148" height="92" rx="8" fill="#e8f5e9" stroke="#1e8449" stroke-width="1.5"/>
  <text x="884" y="272" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" text-anchor="middle" font-weight="700" fill="#1e8449">n = 9 hodova</text>
  <text x="884" y="292" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#3a5a3a">svaki: s&#8342; = 18 cm</text>
  <text x="884" y="310" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#3a5a3a">∑s&#8346; = 1,5 m</text>
  <text x="884" y="328" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#5a6a5a">n = ⌈1,5/0,18⌉ = 9</text>

  <!-- ════════════════════════════════════════════
       REZULTAT BOX (dolje)
  ════════════════════════════════════════════ -->
  <rect x="48" y="440" width="750" height="56" rx="8" fill="#f0f7ff" stroke="#1565c0" stroke-width="1.3"/>
  <text x="66" y="461" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#3a4a5a">Tlak:  <tspan font-weight="700" fill="#1565c0">p = F&#8346;/A&#8346; = 460/(5·10⁻⁴) = 0,92 MPa</tspan>    Opterećenje:  <tspan font-weight="700" fill="#1a2530">G = 2·p·A&#8337; = 27,6 kN</tspan></text>
  <text x="66" y="480" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#3a4a5a">Hod pumpe:  <tspan font-weight="700" fill="#b7600c">A&#8346;·∑s&#8346; = 2·A&#8337;·s&#8337;  →  ∑s&#8346; = 1,5 m</tspan>    Broj hodova:  <tspan font-weight="700" fill="#1e8449">n = ⌈1,5/0,18⌉ = 9</tspan></text>

  <!-- LEGENDA -->
  <rect x="820" y="448" width="12" height="12" fill="#c0392b" rx="2"/>
  <text x="837" y="459" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">težina G</text>
  <rect x="820" y="468" width="12" height="12" fill="#1565c0" rx="2"/>
  <text x="837" y="479" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">tlak p / F&#8346;</text>
  <rect x="912" y="448" width="12" height="12" fill="#1e8449" rx="2"/>
  <text x="929" y="459" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">F&#8337;</text>
  <rect x="912" y="468" width="12" height="12" fill="#b7600c" rx="2"/>
  <text x="929" y="479" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">hodovi</text>
