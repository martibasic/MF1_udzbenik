  <title id="u01c1dpm_c1t">U01 CH1 – Dvostruka hidraulična platforma s ručnom pumpom</title>
  <desc id="u01c1dpm_c1d">Ap=5 cm², Fp=460 N, AL=150 cm², sL=25 mm, sh=180 mm → p=0,92 MPa, G=27,6 kN, sp=1,5 m, n=9 hodova.</desc>
