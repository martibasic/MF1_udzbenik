  <rect x="765" y="330" width="4" height="74" fill="url(#u01c1dpm_c1fl)"/>

  <!-- Cilindar pumpe -->
  <rect x="742" y="248" width="14" height="84" fill="url(#u01c1dpm_c1hatch)" stroke="#4a6070" stroke-width="1.5"/>
  <rect x="778" y="248" width="14" height="84" fill="url(#u01c1dpm_c1hatch)" stroke="#4a6070" stroke-width="1.5"/>
  <rect x="742" y="330" width="50" height="10" rx="2" fill="url(#u01c1dpm_c1hatch)" stroke="#4a6070" stroke-width="1.5"/>
  <!-- Fluid -->
