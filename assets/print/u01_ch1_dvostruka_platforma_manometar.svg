  <rect x="512" y="122" width="18" height="270" fill="url(#u01c1dpm_c1hatch)" stroke="#4a6070" stroke-width="1.5"/>
  <rect x="364" y="392" width="166" height="14" rx="2" fill="url(#u01c1dpm_c1hatch)" stroke="#4a6070" stroke-width="1.5"/>
  <rect x="382" y="170" width="130" height="222" fill="url(#u01c1dpm_c1fl)"/>
