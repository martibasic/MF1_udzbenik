<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="u09fukt_title u09fukt_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:960px;height:auto;">
  <title id="u09fukt_title">Tlačni poremećaj, izentropska sapnica i normalni udarni val</title>
  <desc id="u09fukt_desc">Tri izvorna panela. U mirujućem plinu zvuk putuje u oba smjera. Otvorena konvergentno-divergentna sapnica u prikazanom prigušenom režimu ubrzava plin kroz zvučno grlo u nadzvučni tok. U otvorenom kanalu normalni val okomit je na tok: Machov broj i ukupni tlak padaju, statički tlak raste. Isprekidani val nije kruta stijenka. Boja označuje isti plin, ne gustoću.</desc>
  <defs>
    <pattern id="u09fukt_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.8" />
    </pattern>
    <marker id="u09fukt_v" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
    </marker>
    <marker id="u09fukt_dim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse">
      <path d="M0 0 L6 2.5 L0 5 Z" fill="#356b83" />
    </marker>
    <marker id="u09fukt_dimSmall" markerWidth="3" markerHeight="3" refX="3" refY="1.5" orient="auto-start-reverse">
      <path d="M0 0 L3 1.5 L0 3 Z" fill="#356b83" />
    </marker>
  </defs>
  <g font-family="Arial, Liberation Sans, sans-serif" fill="#3a4a56">
    <defs>
      <marker id="u09fukt_sound" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
        <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
      </marker>
    </defs>
    <g id="u09fukt_acoustic" transform="translate(35 35)">
      <text x="120" y="0" font-size="18" fill="#263746" text-anchor="middle" font-weight="700">Tlačni poremećaj</text>
      <text x="120" y="42" font-size="13" fill="#263746" text-anchor="middle">mirujući plin; v = 0</text>
      <line x1="10" y1="105" x2="230" y2="105" stroke="#657781" stroke-width="1" stroke-dasharray="4 4" />
      <circle cx="120" cy="105" r="6" fill="#356b83" />
      <text x="120" y="132" font-size="12" fill="#263746" text-anchor="middle">O</text>
      <path id="u09fukt_leftwave" d="M98 105 L42 105" fill="none" stroke="#356b83" stroke-width="2.3" marker-end="url(#u09fukt_sound)" />
      <text x="70.0" y="94" font-size="12" fill="#263746" text-anchor="middle">−a</text>
      <path id="u09fukt_rightwave" d="M142 105 L198 105" fill="none" stroke="#356b83" stroke-width="2.3" marker-end="url(#u09fukt_sound)" />
      <text x="170.0" y="94" font-size="12" fill="#263746" text-anchor="middle">+a</text>
      <path d="M76 61 Q52 105 76 149 M164 61 Q188 105 164 149" fill="none" stroke="#356b83" stroke-width="2" />
      <text x="120" y="190" font-size="12" fill="#263746" text-anchor="middle">val se širi relativno prema plinu</text>
    </g>
    <g id="u09fukt_nozzle" transform="translate(335 35)">
      <text x="145" y="0" font-size="18" fill="#263746" text-anchor="middle" font-weight="700">Izentropska sapnica</text>
      <path id="u09fukt_nozzlegas" d="M5 55 C85 55 115 98 145 98 C175 98 205 55 285 55 L285 175 C205 175 175 132 145 132 C115 132 85 175 5 175 Z" fill="#dcebf1" stroke="none" stroke-width="1.8" />
      <path id="u09fukt_nozzletop" d="M5 55 C85 55 115 98 145 98 C175 98 205 55 285 55 L285 48 C205 48 175 91 145 91 C115 91 85 48 5 48 Z" fill="url(#u09fukt_hatch)" stroke="#3a4a56" stroke-width="1.8" />
      <path id="u09fukt_nozzlebottom" d="M5 175 C85 175 115 132 145 132 C175 132 205 175 285 175 L285 182 C205 182 175 139 145 139 C115 139 85 182 5 182 Z" fill="url(#u09fukt_hatch)" stroke="#3a4a56" stroke-width="1.8" />
      <path id="u09fukt_subsonic" d="M28 115 L78 115" fill="none" stroke="#356b83" stroke-width="2.3" marker-end="url(#u09fukt_v)" />
      <text x="53.0" y="106" font-size="12" fill="#263746" text-anchor="middle">Ma &lt; 1</text>
      <path id="u09fukt_supersonic" d="M173 115 L267 115" fill="none" stroke="#356b83" stroke-width="2.3" marker-end="url(#u09fukt_v)" />
      <text x="220.0" y="106" font-size="12" fill="#263746" text-anchor="middle">Ma &gt; 1</text>
      <line id="u09fukt_throat" x1="145" y1="91" x2="145" y2="139" stroke="#356b83" stroke-width="1.2" stroke-dasharray="3 3" />
      <text x="145" y="163" font-size="12" fill="#263746" text-anchor="middle">A*</text>
      <text x="145" y="210" font-size="13" fill="#263746" text-anchor="middle">Ma = 1 u grlu pri prigušenju</text>
    </g>
    <g id="u09fukt_shock" transform="translate(680 35)">
      <text x="120" y="0" font-size="18" fill="#263746" text-anchor="middle" font-weight="700">Normalni udarni val</text>
      <rect id="u09fukt_shockductgas" x="5" y="60" width="230" height="115" rx="0" fill="#dcebf1" stroke="none" stroke-width="1.2" />
      <rect id="u09fukt_shockducttop" x="5" y="53" width="230" height="7" rx="0" fill="url(#u09fukt_hatch)" stroke="#3a4a56" stroke-width="1.2" />
      <rect id="u09fukt_shockductbottom" x="5" y="175" width="230" height="7" rx="0" fill="url(#u09fukt_hatch)" stroke="#3a4a56" stroke-width="1.2" />
      <line id="u09fukt_shockfront" x1="125" y1="60" x2="125" y2="175" stroke="#356b83" stroke-width="2.5" stroke-dasharray="6 4" />
      <text x="125" y="43" font-size="12" fill="#263746" text-anchor="middle">val</text>
      <path id="u09fukt_before" d="M20 117 L104 117" fill="none" stroke="#356b83" stroke-width="2.3" marker-end="url(#u09fukt_v)" />
      <path id="u09fukt_after" d="M158 117 L198 117" fill="none" stroke="#356b83" stroke-width="2.3" marker-end="url(#u09fukt_v)" />
      <text x="62" y="205" font-size="14" fill="#263746" text-anchor="middle">Ma₁ &gt; 1</text>
      <text x="181" y="205" font-size="14" fill="#263746" text-anchor="middle">Ma₂ &lt; 1</text>
      <text x="120" y="230" font-size="12" fill="#263746" text-anchor="middle">p₂ &gt; p₁;  p₀₂ &lt; p₀₁;  T₀₂ = T₀₁</text>
    </g>
  </g>
</svg>
