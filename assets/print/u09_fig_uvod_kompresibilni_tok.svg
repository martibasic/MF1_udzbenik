<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 874 272" role="img" aria-labelledby="u09fukt_title u09fukt_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:874px;height:auto;">
  <title id="u09fukt_title">Tlačni poremećaj, izentropska sapnica i normalni udarni val</title>
  <desc id="u09fukt_desc">Tri izvorna panela. U mirujućem plinu zvuk putuje u oba smjera. Otvorena konvergentno-divergentna sapnica s omjerom površina izlaza i grla Ae/A* = 1,6 (osnosimetrična, omjer promjera 1,26) u prikazanom zagušenom režimu ubrzava plin iz zaustavnog stanja kroz zvučno grlo A*, u kojem je Ma = 1, u nadzvučni tok; protutlak pb djeluje izvan izlaznog presjeka Ae i s njim određuje režim divergentnog dijela. U otvorenom kanalu normalni val okomit je na tok: Machov broj i zaustavni tlak padaju, statički tlak raste. Isprekidani val nije kruta stijenka. Boja označuje isti plin, ne gustoću.</desc>
  <defs>
    <pattern id="u09fukt_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.8" />
    </pattern>
    <marker id="u09fukt_v" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
    </marker>
    <marker id="u09fukt_dim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse">
