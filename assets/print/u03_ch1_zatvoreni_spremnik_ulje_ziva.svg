<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 489" role="img" aria-labelledby="u03c1zsuz_title u03c1zsuz_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:736px;height:auto;">
  <title id="u03c1zsuz_title">Teretni tank s inertnim plinom, uljem i vodenim talogom: ullage otvor, sondiranje i tlačni mjerač na dnu</title>
  <desc id="u03c1zsuz_desc">Presjek teretnog tanka tankera. Iznad ulja je inertni plin pod pretlakom, na dnu tanak sloj morske vode. Ullage otvor na palubi ima referentnu točku 18,60 m iznad dna; ullage vrpca očitava U_m = 2,31 m do površine ulja, a ullage U iz tlaka na dnu je traženi rezultat, a sonda s pastom debljinu vode 0,35 m. Tlačni mjerač razine na dnu pokazuje p_M,dno = 141,0 kPa. Vertikalno mjerilo je 20 jedinica po metru: referentna točka y58, površina ulja y104,2, granica ulja i vode y423, dno y430. Širina tanka je shematska.</desc>
  <defs>
    <pattern id="u03c1zsuz_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.2" />
    </pattern>
    <marker id="u03p3_dim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
