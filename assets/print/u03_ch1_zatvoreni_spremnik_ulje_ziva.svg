     style="display:block;width:100%;max-width:940px;height:auto;">
  <defs>
    <pattern id="u03c1zsuz_u3ch1S" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#8090a0"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#546e7a" stroke-width="1.8"/>
    </pattern>
    <linearGradient id="u03c1zsuz_u3ch1fw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4eef8"/>
      <stop offset="100%" stop-color="#5baece"/>
    </linearGradient>
    <linearGradient id="u03c1zsuz_u3ch1oi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6e1a6"/>
      <stop offset="100%" stop-color="#e8c86d"/>
    </linearGradient>
    <linearGradient id="u03c1zsuz_u3ch1hg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b4c2cc"/>
      <stop offset="100%" stop-color="#728090"/>
    </linearGradient>
    <marker id="u03c1zsuz_u3ch1aF" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#8b5e3c"/>
