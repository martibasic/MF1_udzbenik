    <linearGradient id="u03c1zsuz_voda" x1="0" y1="120" x2="0" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#aed6f1" />
      <stop offset="100%" stop-color="#5b9ec9" />
    </linearGradient>
    <linearGradient id="u03c1zsuz_ulje" x1="0" y1="141.6" x2="0" y2="380" gradientUnits="userSpaceOnUse">
