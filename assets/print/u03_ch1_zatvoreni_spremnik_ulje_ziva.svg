<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="u03c1zsuz_title u03c1zsuz_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="u03c1zsuz_title">Zatvoreni vodeni spremnik s referentnim uljnim spremnikom i živinim U-manometrom</title>
  <desc id="u03c1zsuz_desc">Zatvoreni vodeni i otvoreni uljni spremnik povezani su prohodnim živinim U-manometrom. Točka 2 je 0,13 m iznad točke 1, a površina ulja 0,12 m ispod površine vode. Sve vertikalne kote imaju zajedničko mjerilo. Spojevi su bez poprečnih stijenki i promjene unutarnjeg promjera.</desc>
