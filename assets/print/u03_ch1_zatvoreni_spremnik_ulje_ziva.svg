      <text x="30" y="40" font-size="13" fill="#263746" font-weight="700">Teretni tank (presjek)</text>
      <text x="30" y="57" font-size="11" fill="#263746">A<tspan baseline-shift="sub" font-size="0.7em">t</tspan> = 600 m²</text>
      <text x="225" y="66" font-size="11" fill="#263746" text-anchor="middle">paluba</text>
      <text x="356" y="54" font-size="11" fill="#263746" text-anchor="start">referentna točka ullagea</text>
      <text x="364" y="98" font-size="11" fill="#263746" text-anchor="middle">inertni plin</text>
      <text x="492" y="50" font-size="11" fill="#263746" text-anchor="start">p<tspan baseline-shift="sub" font-size="0.7em">M,pl</tspan> = 3,0 kPa</text>
      <text x="364" y="250" font-size="13" fill="#263746" text-anchor="middle">plinsko ulje</text>
      <text x="364" y="268" font-size="11" fill="#263746" text-anchor="middle">ρ<tspan baseline-shift="sub" font-size="0.7em">u</tspan> = 860 kg/m³</text>
      <text x="440" y="408" font-size="11" fill="#263746" text-anchor="middle">morska voda (talog), ρ<tspan baseline-shift="sub" font-size="0.7em">mv</tspan> = 1025 kg/m³</text>
      <line x1="440" y1="411" x2="440" y2="425" stroke="#657781" stroke-width="0.7" />
