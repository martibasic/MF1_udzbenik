  <text x="825" y="62" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">Hod tlaka kroz manometar</text>
  <text x="825" y="92" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">1) Tlak u točki 2 (ulje, otvoreni)</text>
  <text x="825" y="113" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530">p<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = p<tspan baseline-shift="sub" font-size="0.7em">0</tspan> + ρ<tspan baseline-shift="sub" font-size="0.7em">o</tspan>·g·h<tspan baseline-shift="sub" font-size="0.7em">2</tspan>
  </text>
  <text x="825" y="132" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">≈ 105,9 kPa</text>
  <text x="825" y="164" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">2) Hod 2 → 1 kroz živu</text>
  <text x="825" y="184" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1a2530">p<tspan baseline-shift="sub" font-size="0.7em">1</tspan> = p<tspan baseline-shift="sub" font-size="0.7em">2</tspan> − ρ<tspan baseline-shift="sub" font-size="0.7em">w</tspan>g a + ρ<tspan baseline-shift="sub" font-size="0.7em">Hg</tspan>g Δh + ρ<tspan baseline-shift="sub" font-size="0.7em">o</tspan>g b</text>
  <text x="825" y="204" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">≈ 129,1 kPa</text>
  <text x="825" y="236" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Razlika</text>
  <text x="825" y="256" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530">p<tspan baseline-shift="sub" font-size="0.7em">1</tspan> − p<tspan baseline-shift="sub" font-size="0.7em">2</tspan> ≈ 23,16 kPa</text>
  <text x="825" y="288" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">3) Plinski prostor (uspon kroz vodu)</text>
  <text x="825" y="308" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530">p<tspan baseline-shift="sub" font-size="0.7em">G</tspan> = p<tspan baseline-shift="sub" font-size="0.7em">1</tspan> − ρ<tspan baseline-shift="sub" font-size="0.7em">w</tspan>·g·h<tspan baseline-shift="sub" font-size="0.7em">1</tspan>
  </text>
  <text x="825" y="327" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">≈ 121,2 kPa (apsolutni)</text>
  <text x="825" y="345" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">p<tspan baseline-shift="sub" font-size="0.7em">G,m</tspan> ≈ +19,9 kPa (pretlak)</text>
  <text x="825" y="376" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">4) Točka C (silazak kroz vodu)</text>
  <text x="825" y="396" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530">p<tspan baseline-shift="sub" font-size="0.7em">C</tspan> = p<tspan baseline-shift="sub" font-size="0.7em">G</tspan> + ρ<tspan baseline-shift="sub" font-size="0.7em">w</tspan>·g·h<tspan baseline-shift="sub" font-size="0.7em">C</tspan>
  </text>
  <text x="825" y="415" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">≈ 133,0 kPa (apsolutni)</text>
  <text x="825" y="433" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">p<tspan baseline-shift="sub" font-size="0.7em">C,m</tspan> ≈ +31,7 kPa (pretlak)</text>
  <text x="825" y="460" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">Oba mjesta su pod pretlakom (p<tspan baseline-shift="sub" font-size="0.7em">m</tspan> &gt; 0):</text>
  <text x="825" y="476" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">točka C dublje → veći pretlak.</text>
  <text x="825" y="501" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1e8449">REZULTAT: p<tspan baseline-shift="sub" font-size="0.7em">G,m</tspan> = +19,9 kPa  |  p<tspan baseline-shift="sub" font-size="0.7em">C,m</tspan> = +31,7 kPa</text>
