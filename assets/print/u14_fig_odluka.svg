<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="u14fo_title u14fo_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:900px;height:auto;">
  <title id="u14fo_title">Dijagram za prepoznavanje relevantnih bezdimenzijskih grupa</title>
  <desc id="u14fo_desc">Niz pitanja prepoznaje moguće relevantne grupe: slobodna površina upućuje na Froudeov broj, viskoznost na Reynoldsov, kapljice i mlaz na Weberov i Bondov, kavitacija na kavitacijski broj, periodičnost na Strouhalov, a stlačivost na Machov broj. U istom problemu može biti važno više grupa.</desc>
  <defs>
    <marker id="u14fo_aDown" markerWidth="7" markerHeight="6" refX="3.5" refY="5.5" orient="auto">
      <path d="M0,0 L7,0 L3.5,6 z" fill="#3a4a56" />
    </marker>
    <marker id="u14fo_aG" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#356b83" />
    </marker>
  </defs>
  <text x="450" y="43" font-family="Arial, Liberation Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#263746">Koje grupe treba pratiti? Provjeri sve aktivne mehanizme.</text>
  <line x1="466" y1="97" x2="516" y2="97" stroke="#356b83" stroke-width="2.4" marker-end="url(#u14fo_aG)" />
  <line x1="251" y1="122" x2="251" y2="138" stroke="#3a4a56" stroke-width="1.8" marker-end="url(#u14fo_aDown)" />
  <line x1="466" y1="165" x2="516" y2="165" stroke="#356b83" stroke-width="2.4" marker-end="url(#u14fo_aG)" />
  <line x1="251" y1="190" x2="251" y2="206" stroke="#3a4a56" stroke-width="1.8" marker-end="url(#u14fo_aDown)" />
  <line x1="466" y1="233" x2="516" y2="233" stroke="#356b83" stroke-width="2.4" marker-end="url(#u14fo_aG)" />
  <line x1="251" y1="258" x2="251" y2="274" stroke="#3a4a56" stroke-width="1.8" marker-end="url(#u14fo_aDown)" />
  <line x1="466" y1="301" x2="516" y2="301" stroke="#356b83" stroke-width="2.4" marker-end="url(#u14fo_aG)" />
  <line x1="251" y1="326" x2="251" y2="342" stroke="#3a4a56" stroke-width="1.8" marker-end="url(#u14fo_aDown)" />
  <line x1="466" y1="369" x2="516" y2="369" stroke="#356b83" stroke-width="2.4" marker-end="url(#u14fo_aG)" />
  <line x1="251" y1="394" x2="251" y2="410" stroke="#3a4a56" stroke-width="1.8" marker-end="url(#u14fo_aDown)" />
  <line x1="466" y1="437" x2="516" y2="437" stroke="#356b83" stroke-width="2.4" marker-end="url(#u14fo_aG)" />
  <text x="52" y="103" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" fill="#263746">1. Ima li slobodne površine ili valova?</text>
  <text x="52" y="171" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" fill="#263746">2. Bitan režim / trenje uz stijenku?</text>
  <text x="52" y="239" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" fill="#263746">3. Ima li kapljica, mlaza ili mjehura?</text>
  <text x="52" y="307" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" fill="#263746">4. Može li tlak pasti do isparavanja?</text>
  <text x="52" y="375" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" fill="#263746">5. Periodičke sile / vrtložno otpuštanje?</text>
  <text x="52" y="443" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" fill="#263746">6. Je li brzina plina velika (v → a)?</text>
  <text x="538" y="93" font-family="Arial, Liberation Sans, sans-serif" font-size="13" fill="#263746">
    <tspan font-weight="700" font-style="italic">Fr</tspan> = v / √(gL) — gravitacija</text>
  <text x="538" y="111" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" fill="#263746">brod, kanal, preljev</text>
  <text x="538" y="161" font-family="Arial, Liberation Sans, sans-serif" font-size="13" fill="#263746">
    <tspan font-weight="700" font-style="italic">Re</tspan> = vL / ν — viskoznost</text>
  <text x="538" y="179" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" fill="#263746">prag ovisi o toku; kružna cijev ≈ 2300–4000</text>
  <text x="538" y="229" font-family="Arial, Liberation Sans, sans-serif" font-size="13" fill="#263746">
    <tspan font-weight="700" font-style="italic">We</tspan>, <tspan font-weight="700" font-style="italic">Bo</tspan> — napetost</text>
  <text x="538" y="247" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" fill="#263746">prag raspada ovisi o režimu; usporedi s L<tspan baseline-shift="sub" font-size="0.75em">c</tspan>
  </text>
  <text x="538" y="297" font-family="Arial, Liberation Sans, sans-serif" font-size="13" fill="#263746">σ<tspan baseline-shift="sub" font-size="0.75em">kav</tspan> = (p<tspan baseline-shift="sub" font-size="0.75em">ref</tspan> − p<tspan baseline-shift="sub" font-size="0.75em">v</tspan>)/(½ρv<tspan baseline-shift="sub" font-size="0.75em">ref</tspan>²)</text>
  <text x="538" y="315" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" fill="#263746">usporedi s uređajno definiranim σ<tspan baseline-shift="sub" font-size="0.75em">kr</tspan>
  </text>
  <text x="538" y="365" font-family="Arial, Liberation Sans, sans-serif" font-size="13" fill="#263746">
    <tspan font-weight="700" font-style="italic">St</tspan> = fL / v</text>
  <text x="538" y="383" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" fill="#263746">za cilindar često reda 0,2 u određenom Re</text>
  <text x="538" y="433" font-family="Arial, Liberation Sans, sans-serif" font-size="13" fill="#263746">
    <tspan font-weight="700" font-style="italic">Ma</tspan> = v / a</text>
  <text x="538" y="451" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" fill="#263746">Ma &lt; 0,3 često dopušta ρ ≈ konst.</text>
  <text x="450" y="510" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">Što tražiš kao izlaz?</text>
  <text x="450" y="529" font-family="Arial, Liberation Sans, sans-serif" font-size="12" text-anchor="middle" fill="#263746">otpor tijela → C<tspan baseline-shift="sub" font-size="0.75em">d</tspan>   ·   gubici u cijevi → λ   ·   raspodjela tlaka → C<tspan baseline-shift="sub" font-size="0.75em">p</tspan>
  </text>
</svg>
