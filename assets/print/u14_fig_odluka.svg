<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="u14fo_title u14fo_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:900px;height:auto;">
  <title id="u14fo_title">U14 - Dijagram za prepoznavanje relevantnih bezdimenzijskih grupa</title>
  <desc id="u14fo_desc">Niz pitanja prepoznaje moguce relevantne grupe: slobodna povrsina upucuje na Froudeov broj, viskoznost na Reynoldsov, kapljice i mlaz na Weberov i Bondov, kavitacija na kavitacijski broj, periodicnost na Strouhalov, a stlacivost na Machov broj. U istom problemu moze biti vazno vise grupa.</desc>
  <defs>
    <marker id="u14fo_aDown" markerWidth="7" markerHeight="6" refX="3.5" refY="5.5" orient="auto">
      <path d="M0,0 L7,0 L3.5,6 z" fill="#5d6d7e" />
    </marker>
    <marker id="u14fo_aG" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1e8449" />
    </marker>
  </defs>

  <rect width="900" height="560" fill="#ffffff" />
  <rect x="20" y="20" width="860" height="34" rx="8" fill="#34495e" />
  <text x="450" y="43" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">Koje grupe treba pratiti? Provjeri sve aktivne mehanizme.</text>

  <!-- Pitanja (lijevo) i ishodi (desno) -->
  <!-- Red 1 -->
  <rect x="36" y="72" width="430" height="50" rx="8" fill="#eaf3fb" stroke="#1565c0" stroke-width="1.4" />
  <line x1="466" y1="97" x2="516" y2="97" stroke="#1e8449" stroke-width="2.4" marker-end="url(#u14fo_aG)" />
  <rect x="522" y="72" width="344" height="50" rx="8" fill="#eafaf1" stroke="#1e8449" stroke-width="1.4" />
  <line x1="251" y1="122" x2="251" y2="138" stroke="#5d6d7e" stroke-width="1.8" marker-end="url(#u14fo_aDown)" />

  <!-- Red 2 -->
  <rect x="36" y="140" width="430" height="50" rx="8" fill="#eaf3fb" stroke="#1565c0" stroke-width="1.4" />
  <line x1="466" y1="165" x2="516" y2="165" stroke="#1e8449" stroke-width="2.4" marker-end="url(#u14fo_aG)" />
  <rect x="522" y="140" width="344" height="50" rx="8" fill="#eafaf1" stroke="#1e8449" stroke-width="1.4" />
  <line x1="251" y1="190" x2="251" y2="206" stroke="#5d6d7e" stroke-width="1.8" marker-end="url(#u14fo_aDown)" />

  <!-- Red 3 -->
  <rect x="36" y="208" width="430" height="50" rx="8" fill="#eaf3fb" stroke="#1565c0" stroke-width="1.4" />
  <line x1="466" y1="233" x2="516" y2="233" stroke="#1e8449" stroke-width="2.4" marker-end="url(#u14fo_aG)" />
  <rect x="522" y="208" width="344" height="50" rx="8" fill="#eafaf1" stroke="#1e8449" stroke-width="1.4" />
  <line x1="251" y1="258" x2="251" y2="274" stroke="#5d6d7e" stroke-width="1.8" marker-end="url(#u14fo_aDown)" />

  <!-- Red 4 -->
  <rect x="36" y="276" width="430" height="50" rx="8" fill="#eaf3fb" stroke="#1565c0" stroke-width="1.4" />
  <line x1="466" y1="301" x2="516" y2="301" stroke="#1e8449" stroke-width="2.4" marker-end="url(#u14fo_aG)" />
  <rect x="522" y="276" width="344" height="50" rx="8" fill="#eafaf1" stroke="#1e8449" stroke-width="1.4" />
  <line x1="251" y1="326" x2="251" y2="342" stroke="#5d6d7e" stroke-width="1.8" marker-end="url(#u14fo_aDown)" />

  <!-- Red 5 -->
  <rect x="36" y="344" width="430" height="50" rx="8" fill="#eaf3fb" stroke="#1565c0" stroke-width="1.4" />
  <line x1="466" y1="369" x2="516" y2="369" stroke="#1e8449" stroke-width="2.4" marker-end="url(#u14fo_aG)" />
  <rect x="522" y="344" width="344" height="50" rx="8" fill="#eafaf1" stroke="#1e8449" stroke-width="1.4" />
  <line x1="251" y1="394" x2="251" y2="410" stroke="#5d6d7e" stroke-width="1.8" marker-end="url(#u14fo_aDown)" />

  <!-- Red 6 -->
  <rect x="36" y="412" width="430" height="50" rx="8" fill="#eaf3fb" stroke="#1565c0" stroke-width="1.4" />
  <line x1="466" y1="437" x2="516" y2="437" stroke="#1e8449" stroke-width="2.4" marker-end="url(#u14fo_aG)" />
  <rect x="522" y="412" width="344" height="50" rx="8" fill="#eafaf1" stroke="#1e8449" stroke-width="1.4" />

  <!-- Izlaz -->
  <rect x="36" y="486" width="830" height="56" rx="8" fill="#fdf6ec" stroke="#b7600c" stroke-width="1.4" />

  <!-- Tekst pitanja -->
  <text x="52" y="103" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#163b57">1. Postoji li slobodna površina ili valovi?</text>
  <text x="52" y="171" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#163b57">2. Bitan režim / trenje uz stijenku?</text>
  <text x="52" y="239" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#163b57">3. Ima li kapljica, mlaza ili mjehura?</text>
  <text x="52" y="307" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#163b57">4. Može li tlak pasti do isparavanja?</text>
  <text x="52" y="375" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#163b57">5. Periodičke sile / vrtložno otpuštanje?</text>
  <text x="52" y="443" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#163b57">6. Je li brzina plina velika (v → a)?</text>

  <!-- Tekst ishoda -->
  <text x="538" y="93" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#14532d"><tspan font-weight="700" font-style="italic">Fr</tspan> = v / √(gL) — gravitacija</text>
  <text x="538" y="111" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78">brod, kanal, preljev</text>

  <text x="538" y="161" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#14532d"><tspan font-weight="700" font-style="italic">Re</tspan> = vL / ν — viskoznost</text>
  <text x="538" y="179" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78">prag ovisi o toku; kružna cijev ≈ 2300–4000</text>

  <text x="538" y="229" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#14532d"><tspan font-weight="700" font-style="italic">We</tspan>, <tspan font-weight="700" font-style="italic">Bo</tspan> — napetost</text>
  <text x="538" y="247" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78">prag raspada ovisi o režimu; usporedi s L_c</text>

  <text x="538" y="297" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#14532d"><tspan font-weight="700" font-style="italic">σ</tspan> = (p_ref − p_v)/(½ρv_ref²)</text>
  <text x="538" y="315" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78">usporedi s uređajno definiranim σ_kr</text>

  <text x="538" y="365" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#14532d"><tspan font-weight="700" font-style="italic">St</tspan> = fL / v</text>
  <text x="538" y="383" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78">za cilindar često reda 0,2 u određenom Re</text>

  <text x="538" y="433" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#14532d"><tspan font-weight="700" font-style="italic">Ma</tspan> = v / a</text>
  <text x="538" y="451" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78">Ma &lt; 0,3 često dopušta ρ ≈ konst.</text>

  <text x="450" y="510" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#7a4d10">Što tražiš kao izlaz?</text>
  <text x="450" y="529" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#5a3a0c">otpor tijela → C_d   ·   gubici u cijevi → λ   ·   raspodjela tlaka → C_p</text>
</svg>
