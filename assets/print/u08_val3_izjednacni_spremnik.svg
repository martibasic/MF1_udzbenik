<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="u08v3is_title u08v3is_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:960px;height:auto;">
  <title id="u08v3is_title">Izjednačni spremnik s porastom razine</title>
  <desc id="u08v3is_desc">Jedinstveno područje vode nalazi se ispod h0. Neispunjeni prostor do isprekidane h1 predstavlja budući porast, ne drugi fluid. Ulazna cijev prolazi kroz stvaran otvor i završava uronjenim otvorenim koljenom; odvod je uronjen i otvoren. Kote h0 i h1 mjere se od istog dna. Isprekidana granica označuje nepomični kontrolni volumen.</desc>
