<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 410" role="img" aria-labelledby="u8v3-title u8v3-desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u8v3-title">U08 Val 3 – izjednacni spremnik s akumulacijom</title>
  <desc id="u8v3-desc">Izjednacni spremnik L=3,0m b=1,8m, Qin=22 L/s, Qout=8 L/s, h0=0,45m, h1=1,20m. Razina raste dh/dt=2,59 mm/s, t=289s.</desc>
  <defs>
    <linearGradient id="u8v3-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4eef8"/>
      <stop offset="100%" stop-color="#7ec8e8"/>
    </linearGradient>
    <linearGradient id="u8v3-acc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8dfee" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#5abbd8" stop-opacity="0.6"/>
    </linearGradient>
    <pattern id="u8v3-sraf" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#8090a0"/>
      <line x1="0" y1="4" x2="8" y2="4" stroke="#546e7a" stroke-width="1.8"/>
    </pattern>
    <marker id="u8v3-arrG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#0f766e"/>
    </marker>
    <marker id="u8v3-arrR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#b42318"/>
    </marker>
    <marker id="u8v3-arrGr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#546e7a"/>
    </marker>
    <marker id="u8v3-arrGrRev" markerWidth="9" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <path d="M9,0 L9,7 L0,3.5 z" fill="#546e7a"/>
    </marker>
    <marker id="u8v3-arrUp" markerWidth="10" markerHeight="8" refX="5" refY="0" orient="auto">
      <path d="M0,8 L10,8 L5,0 z" fill="#c96c35"/>
    </marker>
  </defs>
  <!-- Canvas -->
  <rect width="940" height="410" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="362" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>
  <!-- Title -->
  <text x="54" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#173043">Izjednačni spremnik — nestacionarni kontrolni volumen</text>
  <text x="54" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#516677">L = 3,0 m, b = 1,8 m, Q_in = 22 L/s, Q_out = 8 L/s; razina raste od h₀ = 0,45 m do h₁ = 1,20 m</text>

  <!-- ===== TANK ===== -->
  <!-- Tank outer walls (srafura) -->
  <!-- Left wall -->
  <rect x="172" y="100" width="18" height="242" fill="url(#u8v3-sraf)"/>
  <!-- Right wall -->
  <rect x="570" y="100" width="18" height="242" fill="url(#u8v3-sraf)"/>
  <!-- Bottom wall -->
  <rect x="172" y="324" width="416" height="18" fill="url(#u8v3-sraf)"/>
  <!-- Wall outlines -->
  <line x1="172" y1="100" x2="172" y2="342" stroke="#3d4f5a" stroke-width="2.5"/>
  <line x1="588" y1="100" x2="588" y2="342" stroke="#3d4f5a" stroke-width="2.5"/>
  <line x1="172" y1="342" x2="588" y2="342" stroke="#3d4f5a" stroke-width="3"/>

  <!-- Water fill (h0 level = 45% of 1.5m total = 78px, so y=342-78=264) -->
  <!-- h0=0.45m, h1=1.20m, full height shown=1.5m → scale=224px/1.5m=149px/m -->
  <!-- h0*149=67px → water top at y=342-67=275 -->
  <!-- h1*149=179px → target at y=342-179=163 -->
  <!-- Water block from y=275 to y=342 -->
  <rect x="190" y="275" width="380" height="67" fill="url(#u8v3-water)" stroke="none"/>
  <!-- Accumulated zone h0 to h1: y=163 to y=275 -->
  <rect x="190" y="163" width="380" height="112" fill="url(#u8v3-acc)" stroke="none"/>

  <!-- Current water surface line (h0) -->
  <line x1="172" y1="275" x2="588" y2="275" stroke="#2980b9" stroke-width="2.5"/>
  <!-- Target water level line (h1) -->
  <line x1="172" y1="163" x2="588" y2="163" stroke="#2980b9" stroke-width="2" stroke-dasharray="8,5"/>

  <!-- KV dashed boundary -->
  <rect x="162" y="90" width="436" height="262" rx="8" fill="none" stroke="#c96c35" stroke-width="2" stroke-dasharray="10,6"/>
  <text x="170" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#c96c35" font-style="italic">kontrolni volumen</text>

  <!-- Inlet pipe on left (top of tank area) -->
  <rect x="90" y="230" width="82" height="22" fill="url(#u8v3-water)" stroke="none"/>
  <line x1="90" y1="230" x2="172" y2="230" stroke="#3d4f5a" stroke-width="2"/>
  <line x1="90" y1="252" x2="172" y2="252" stroke="#3d4f5a" stroke-width="2"/>
  <line x1="90" y1="230" x2="90" y2="252" stroke="#3d4f5a" stroke-width="2"/>
  <line x1="42" y1="241" x2="88" y2="241" stroke="#0f766e" stroke-width="3.5" marker-end="url(#u8v3-arrG)"/>
  <text x="40" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f766e">Q_in</text>
  <text x="36" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f766e">22 L/s</text>

  <!-- Outlet pipe on right (bottom area) -->
  <rect x="588" y="300" width="80" height="20" fill="url(#u8v3-water)" stroke="none"/>
  <line x1="588" y1="300" x2="668" y2="300" stroke="#3d4f5a" stroke-width="2"/>
  <line x1="588" y1="320" x2="668" y2="320" stroke="#3d4f5a" stroke-width="2"/>
  <line x1="668" y1="300" x2="668" y2="320" stroke="#3d4f5a" stroke-width="2"/>
  <line x1="668" y1="310" x2="710" y2="310" stroke="#b42318" stroke-width="3.5" marker-end="url(#u8v3-arrR)"/>
  <text x="714" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#b42318">Q_out</text>
  <text x="716" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#b42318">8 L/s</text>

  <!-- dh/dt upward arrow -->
  <line x1="380" y1="272" x2="380" y2="168" stroke="#c96c35" stroke-width="3" marker-end="url(#u8v3-arrUp)"/>
  <text x="386" y="226" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#c96c35">dh/dt</text>
  <text x="385" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#c96c35">↑ raste</text>

  <!-- Dimension: h0 (right of tank) -->
  <line x1="608" y1="275" x2="608" y2="342" stroke="#546e7a" stroke-width="1.8" marker-start="url(#u8v3-arrGrRev)" marker-end="url(#u8v3-arrGr)"/>
  <text x="616" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#546e7a">h₀</text>
  <text x="612" y="327" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#546e7a">0,45 m</text>

  <!-- Dimension: h1 (right of tank, above h0) -->
  <line x1="640" y1="163" x2="640" y2="342" stroke="#546e7a" stroke-width="1.8" marker-start="url(#u8v3-arrGrRev)" marker-end="url(#u8v3-arrGr)"/>
  <text x="648" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#546e7a">h₁</text>
  <text x="644" y="273" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#546e7a">1,20 m</text>

  <!-- Dimension: L (bottom) -->
  <line x1="190" y1="364" x2="570" y2="364" stroke="#546e7a" stroke-width="1.8" marker-start="url(#u8v3-arrGrRev)" marker-end="url(#u8v3-arrGr)"/>
  <text x="360" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#546e7a" text-anchor="middle">L = 3,0 m   (b = 1,8 m ⊥ skici)</text>

  <!-- h1 label at dashed line -->
  <text x="190" y="157" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2980b9" font-style="italic">— — ciljana razina h₁</text>
  <!-- h0 label -->
  <text x="195" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2980b9">—— trenutna razina h₀</text>

  <!-- ===== FORMULA BOX ===== -->
  <rect x="54" y="300" width="102" height="60" rx="8" fill="#fffef6" stroke="#c49a0a" stroke-width="1.5"/>
  <text x="64" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#173043">Rezultati</text>
  <text x="62" y="334" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#516677">t ≈ 289 s</text>
  <text x="62" y="349" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#516677">≈ 4,8 min</text>
</svg>