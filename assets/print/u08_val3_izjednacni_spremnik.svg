<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 686 404" role="img" aria-labelledby="u08v3is_title u08v3is_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:686px;height:auto;">
  <title id="u08v3is_title">Zahvatni usis morske vode na brodu u plovidbi</title>
  <desc id="u08v3is_desc">Presjek dna trupa; pramac je desno i brod se giba udesno brzinom broda. Zahvatni usis ima otvor okrenut prema pramcu ispod oplate dna i kanal koji se kroz oplatu uspinje prema rashladnom sustavu. More daleko od broda miruje. Isprekidani kontrolni volumen vezan je uz brod i giba se s njim; prati unutarnju stranu stijenki kanala, a ulazna ploha mu je ravnina otvora, izlazna presjek kanala prema izmjenjivaču. U otvoru je označena brzina vode relativna prema brodu; duljine strelica brzine broda i relativne brzine u omjeru su 9,26 : 1,25. Rešetka je prikazana shematski i ne zatvara otvor.</desc>
  <defs>
    <marker id="u08v3is_vopen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#356b83" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <pattern id="u08v3is_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="7" height="7" fill="#d7dee3" stroke="none" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.1" />
    </pattern>
    <marker id="u08v3is_v" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
    </marker>
    <marker id="u08v3is_dim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse">
      <path d="M0 0 L6 2.5 L0 5 Z" fill="#657781" />
    </marker>
  </defs>
  <g id="u08v3is_title-scene-1" transform="translate(0.0000 0.0000)">
    <g font-family="Arial, Liberation Sans, sans-serif">
      <rect id="u08v3is_sea" x="20" y="210" width="646" height="200" fill="#dcebf1" stroke="none" />
      <path id="u08v3is_duct-fluid" d="M400 215 H370 V60 H330 V255 H400 Z" fill="#dcebf1" stroke="none" />
      <rect id="u08v3is_plating-aft" x="20" y="200" width="310" height="10" fill="url(#u08v3is_hatch)" stroke="#3a4a56" stroke-width="1.2" />
      <rect id="u08v3is_plating-fore" x="370" y="200" width="296" height="10" fill="url(#u08v3is_hatch)" stroke="#3a4a56" stroke-width="1.2" />
      <path id="u08v3is_duct-fore-wall" d="M400 215 H370 V60" fill="none" stroke="#3a4a56" stroke-width="4" stroke-linecap="butt" stroke-linejoin="round" />
      <path id="u08v3is_duct-aft-wall" d="M400 255 H330 V60" fill="none" stroke="#3a4a56" stroke-width="4" stroke-linecap="butt" stroke-linejoin="round" />
      <line id="u08v3is_grating-1" x1="397" y1="223" x2="403" y2="223" stroke="#3a4a56" stroke-width="1.4" />
      <line id="u08v3is_grating-2" x1="397" y1="235" x2="403" y2="235" stroke="#3a4a56" stroke-width="1.4" />
      <line id="u08v3is_grating-3" x1="397" y1="247" x2="403" y2="247" stroke="#3a4a56" stroke-width="1.4" />
      <line id="u08v3is_mouth" x1="400" y1="215" x2="400" y2="255" stroke="#356b83" stroke-width="1.2" stroke-dasharray="3 3" />
      <path id="u08v3is_cv" d="M400 220 H365 V70 H335 V250 H400 Z" fill="none" stroke="#263746" stroke-width="1.8" stroke-dasharray="6 4" data-mf1-role="control-volume" />
      <text x="376" y="64" font-size="11" fill="#263746" text-anchor="start">KV vezan uz brod</text>
      <line id="u08v3is_outlet-velocity" x1="350" y1="112" x2="350" y2="74" stroke="#356b83" stroke-width="1.6" marker-end="url(#u08v3is_vopen)" data-mf1-vector="velocity" />
      <text x="412" y="92" font-size="11" fill="#263746" text-anchor="start"><tspan font-style="italic">Q</tspan> = 180 m³/h</text>
      <text x="412" y="108" font-size="11" fill="#263746" text-anchor="start">prema izmjenjivaču</text>
      <text x="120" y="92" font-size="11" fill="#263746" text-anchor="start">strojarnica</text>
      <text x="150" y="194" font-size="11" fill="#263746" text-anchor="start">dno trupa (oplata)</text>
      <line id="u08v3is_ship-velocity" x1="440" y1="150" x2="640" y2="150" stroke="#356b83" stroke-width="1.6" marker-end="url(#u08v3is_vopen)" data-mf1-vector="velocity" />
      <text x="440" y="140" font-size="12" fill="#263746" text-anchor="start">brod: <tspan font-style="italic" font-weight="700">v</tspan><tspan baseline-shift="sub" font-size="0.7em">s</tspan> = 18 čv (9,26 m/s)</text>
      <text x="640" y="170" font-size="11" fill="#263746" text-anchor="end">pramac</text>
      <line id="u08v3is_rel-velocity" x1="435" y1="235" x2="408" y2="235" stroke="#356b83" stroke-width="1.6" marker-end="url(#u08v3is_vopen)" data-mf1-vector="velocity" />
      <text x="442" y="229" font-size="12" fill="#263746" text-anchor="start"><tspan font-style="italic" font-weight="700">w</tspan> = <tspan font-style="italic">Q</tspan>/<tspan font-style="italic">A</tspan><tspan baseline-shift="sub" font-size="0.7em">u</tspan></text>
      <text x="442" y="250" font-size="11" fill="#263746" text-anchor="start">relativno prema brodu</text>
      <text x="470" y="330" font-size="11" fill="#263746" text-anchor="start">daleko od broda: <tspan font-style="italic">v</tspan> = 0</text>
      <text x="40" y="398" font-size="11" fill="#263746" text-anchor="start">more, <tspan font-style="italic">ρ</tspan> = 1025 kg/m³</text>
      <line x1="404" y1="215" x2="438" y2="215" stroke="#657781" stroke-width="1" />
      <line x1="404" y1="255" x2="438" y2="255" stroke="#657781" stroke-width="1" />
      <line id="u08v3is_Au" x1="432" y1="215" x2="432" y2="255" stroke="#657781" stroke-width="1.2" marker-start="url(#u08v3is_dim)" marker-end="url(#u08v3is_dim)" data-mf1-role="dimension" />
      <text x="408" y="276" font-size="11" fill="#263746" text-anchor="start">otvor <tspan font-style="italic">A</tspan><tspan baseline-shift="sub" font-size="0.7em">u</tspan> = 0,040 m² (okrenut prema pramcu)</text>
      <text x="408" y="308" font-size="11" fill="#263746" text-anchor="start">rešetka: <tspan font-style="italic">ψ</tspan> = 0,55 (shematski)</text>
      <text x="200" y="300" font-size="11" fill="#263746" text-anchor="start">kanal usisa</text>
      <line x1="262" y1="296" x2="328" y2="240" stroke="#657781" stroke-width="1" />
    </g>
  </g>
</svg>
