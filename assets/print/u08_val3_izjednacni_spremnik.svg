<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="title">U08 Val 3 - izjednacni spremnik s akumulacijom</title>
  <desc id="desc">Pravokutni izjednacni spremnik s ulaznim i izlaznim protokom te jasno odvojenim oznakama pocetne i granicne razine, akumulacije i tlocrtne dimenzije.</desc>
  <rect width="980" height="420" fill="#ffffff"/>
  <rect x="28" y="28" width="924" height="364" rx="18" fill="#ffffff" stroke="#c9d2d8" stroke-width="2"/>

  <text x="58" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#173043">U08 - Izjednacni spremnik tijekom ispiranja</text>
  <text x="58" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#516677">Nestacionarni kontrolni volumen čitljiv je tek kad su ulazi, izlazi i akumulacija graficki odvojeni.</text>

  <rect x="146" y="146" width="360" height="190" rx="10" fill="none" stroke="#8b5e3c" stroke-width="3" stroke-dasharray="10 7"/>
  <rect x="182" y="198" width="288" height="138" fill="#dff1f8" stroke="#5b6770" stroke-width="2.5"/>
  <line x1="182" y1="198" x2="470" y2="198" stroke="#3a87ad" stroke-width="4"/>
  <line x1="182" y1="158" x2="470" y2="158" stroke="#8fbfd3" stroke-width="3" stroke-dasharray="8 6"/>

  <rect x="220" y="122" width="128" height="28" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="236" y="141" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">kontrolni volumen</text>

  <line x1="110" y1="178" x2="182" y2="178" stroke="#1565c0" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <rect x="70" y="146" width="74" height="26" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="92" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">Q_in</text>

  <line x1="470" y1="284" x2="558" y2="284" stroke="#1565c0" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <rect x="492" y="250" width="84" height="26" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="514" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">Q_out</text>

  <line x1="324" y1="336" x2="324" y2="122" stroke="#b42318" stroke-width="4.5" marker-end="url(#arrowRed)"/>
  <rect x="336" y="226" width="104" height="28" rx="6" fill="#ffffff" stroke="#d8c7c4" stroke-width="1.5"/>
  <text x="352" y="245" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">akumulacija</text>

  <line x1="486" y1="158" x2="486" y2="198" stroke="#8b5e3c" stroke-width="3" marker-start="url(#arrowBrown)" marker-end="url(#arrowBrown)"/>
  <rect x="498" y="160" width="42" height="26" rx="6" fill="#ffffff" stroke="#d9cdc3" stroke-width="1.5"/>
  <text x="513" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">h_1</text>

  <line x1="520" y1="198" x2="520" y2="336" stroke="#8b5e3c" stroke-width="3" marker-start="url(#arrowBrown)" marker-end="url(#arrowBrown)"/>
  <rect x="532" y="248" width="42" height="26" rx="6" fill="#ffffff" stroke="#d9cdc3" stroke-width="1.5"/>
  <text x="547" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">h_0</text>

  <line x1="182" y1="362" x2="470" y2="362" stroke="#6f7f89" stroke-width="3" marker-start="url(#arrowGray)" marker-end="url(#arrowGray)"/>
  <rect x="310" y="348" width="42" height="26" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="325" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">L</text>

  <rect x="178" y="110" width="168" height="26" rx="6" fill="#ffffff" stroke="#d6dde2" stroke-width="1.5"/>
  <text x="194" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#516677">sirina b je okomita na skicu</text>

  <rect x="622" y="126" width="252" height="176" rx="12" fill="#f8fafb" stroke="#d6dde2" stroke-width="1.5"/>
  <text x="644" y="156" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#173043">Čitanje skice</text>
  <text x="644" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">1. Q_in - Q_out = dV/dt</text>
  <text x="644" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">2. V = A_T h jer je tlocrtna površina stalna</text>
  <text x="644" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">3. Neto protok zato daje dh/dt</text>
  <text x="644" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#516677">Razine, strelice protoka i smjer akumulacije izdvojeni su</text>
  <text x="644" y="294" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#516677">iz geometrije da je clan akumulacije vidljiv na prvi pogled.</text>

  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#1565c0"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#b42318"/>
    </marker>
    <marker id="arrowBrown" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L0,8 L8,4 z" fill="#8b5e3c"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L0,8 L8,4 z" fill="#6f7f89"/>
    </marker>
  </defs>
</svg>