<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="u09egl_title u09egl_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:960px;height:auto;">
<title id="u09egl_title">Energija u horizontalnom konfuzoru</title><desc id="u09egl_desc">Pravokutni zračni vod stalne dubine s otvorenim krajevima sužava se s 0,07 na 0,0185 kvadratnih metara. EGL je stalan. Razmaci do HGL-a odgovaraju stvarnim brzinskim visinama 3,340 i 47,819 metara zraka u zajedničkoj skali. Površine su oznake presjeka, a ne linearne kote.</desc>
