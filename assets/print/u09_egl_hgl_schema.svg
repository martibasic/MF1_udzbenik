<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="u09ehs_title u09ehs_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:900px;height:auto;">
  <title id="u09ehs_title">Staticka zamjena za EGL i HGL u horizontalnom konfuzoru ventilacijskog kanala</title>
  <desc id="u09ehs_desc">Lijevo: horizontalni konfuzor s ulaznim presjekom A1 i izlaznim A2; iznad kanala su crtkani EGL (energetska linija, konstantna) i HGL (piezometricka linija) koji pada kroz suzenje. Visine v kvadrat kroz 2g i p kroz ro g oznacene kotama od EGL do HGL i od HGL do osi kanala. Desno: panel s Bernoullijevom jednadzbom i izracun pada statickog tlaka delta p priblizno 523 Pa.</desc>

  <defs>
    <linearGradient id="u09ehs_zrak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf3fb" />
      <stop offset="1" stop-color="#bcd6ea" />
    </linearGradient>
    <pattern id="u09ehs_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.1" />
    </pattern>
    <!-- Velocity (flow) arrow - green -->
    <marker id="u09ehs_vel" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1e8449" />
    </marker>
    <!-- Kota (dimension) arrows - brown -->
    <marker id="u09ehs_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u09ehs_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
  </defs>

  <!-- pozadina -->
  <rect x="0" y="0" width="960" height="520" fill="#ffffff" />
  <!-- separator izmedju panela -->
  <line x1="640" y1="34" x2="640" y2="486" stroke="#dce7f0" stroke-width="1.2" stroke-dasharray="4,5" />

  <!-- ================================================ -->
  <!-- LIJEVO: SHEMA KONFUZORA S EGL/HGL                -->
  <!-- ================================================ -->
  <!--
       Vertikalna geometrija:
       EGL:                y = 70
       HGL u presjeku 1:   y = 118    (v1^2/(2g) = 48 px)
       HGL u presjeku 2:   y = 240    (v2^2/(2g) = 170 px, ~3.5x veci - skalirano, stvarni omjer 14.3 prevelik)
       Os kanala:          y = 410
       Duct wider (sek 1): top y=370, bottom y=450, sirina 80 px (A1)
       Duct narrow (sek 2): top y=390, bottom y=430, sirina 40 px (A2 ~ 0.265 * A1, skalirano)

       Horizontalna geometrija:
       x = 80   lijevi rub duct-a
       x = 220  presjek 1 (kraj konstantne sirine)
       x = 380  presjek 2 (pocetak konstantne uske sirine)
       x = 590  desni rub duct-a
  -->

  <!-- ===== EGL i HGL (linije pa labele) ===== -->
  <line x1="40" y1="70" x2="620" y2="70" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="9,5" />
  <line x1="40" y1="118" x2="220" y2="118" stroke="#1565c0" stroke-width="2.2" stroke-dasharray="7,4" />
  <line x1="220" y1="118" x2="380" y2="240" stroke="#1565c0" stroke-width="2.2" stroke-dasharray="7,4" />
  <line x1="380" y1="240" x2="620" y2="240" stroke="#1565c0" stroke-width="2.2" stroke-dasharray="7,4" />

  <!-- EGL/HGL labele lijevo -->
  <!-- ===== Konfuzor: stijenke (sa srafurom), zrak unutra ===== -->
  <!-- top wall: vanjski rub na y=362, zatim suzenje 362->382 izmedju x=220..380 -->
  <polygon points="80,360 220,360 380,380 590,380 590,390 380,390 220,370 80,370" fill="url(#u09ehs_hatch)" stroke="#3a4a56" stroke-width="1.4" />
  <!-- bottom wall -->
  <polygon points="80,450 220,450 380,430 590,430 590,440 380,440 220,460 80,460" fill="url(#u09ehs_hatch)" stroke="#3a4a56" stroke-width="1.4" />

  <!-- End caps -->
  <line x1="80" y1="370" x2="80" y2="450" stroke="#3a4a56" stroke-width="1.6" />
  <line x1="590" y1="390" x2="590" y2="430" stroke="#3a4a56" stroke-width="1.6" />

  <!-- Zrak unutar kanala -->
  <polygon points="80,370 220,370 380,390 590,390 590,430 380,430 220,450 80,450" fill="url(#u09ehs_zrak)" />

  <!-- Konturna linija unutarnjeg ruba kanala -->
  <polyline points="80,370 220,370 380,390 590,390" fill="none" stroke="#2d3a40" stroke-width="1.6" />
  <polyline points="80,450 220,450 380,430 590,430" fill="none" stroke="#2d3a40" stroke-width="1.6" />

  <!-- Os kanala (referentna razina z = z1 = z2) -->
  <line x1="40" y1="410" x2="620" y2="410" stroke="#7a8a96" stroke-width="0.9" stroke-dasharray="3,3" />

  <!-- ===== Strelice brzina (zelene) ===== -->
  <!-- v1: ulaz, kratka, u sirokom presjeku -->
  <line x1="100" y1="410" x2="180" y2="410" stroke="#1e8449" stroke-width="2.8" marker-end="url(#u09ehs_vel)" />
  <!-- v2: izlaz, dulja i deblja, u uskom presjeku -->
  <line x1="408" y1="410" x2="582" y2="410" stroke="#1e8449" stroke-width="3.2" marker-end="url(#u09ehs_vel)" />
  <!-- Tocke presjeka 1 i 2 na osi -->
  <circle cx="220" cy="410" r="5" fill="#c0392b" stroke="#ffffff" stroke-width="1.2" />
  <circle cx="380" cy="410" r="5" fill="#c0392b" stroke="#ffffff" stroke-width="1.2" />
  <!-- Vertikalne crte presjeka kroz duct (tanke isprekidane) -->
  <line x1="220" y1="118" x2="220" y2="370" stroke="#a0aab2" stroke-width="0.7" stroke-dasharray="3,3" />
  <line x1="220" y1="410" x2="220" y2="450" stroke="#a0aab2" stroke-width="0.7" stroke-dasharray="3,3" />
  <line x1="380" y1="240" x2="380" y2="390" stroke="#a0aab2" stroke-width="0.7" stroke-dasharray="3,3" />
  <line x1="380" y1="410" x2="380" y2="430" stroke="#a0aab2" stroke-width="0.7" stroke-dasharray="3,3" />

  <!-- ====================================== -->
  <!-- KOTE U PRESJEKU 1 (LIJEVA STRANA)     -->
  <!-- ====================================== -->
  <!-- v1^2/(2g) - desno od presjeka 1, izmedju EGL i HGL -->
  <!-- p1/(rho g) - lijevo od presjeka 1, izmedju HGL i osi (prolazi kroz duct wall - prihvatljivo) -->
  <!-- label u prostoru izmedju HGL i duct topa (y=118..360) -->
  <!-- ====================================== -->
  <!-- KOTE U PRESJEKU 2 (DESNA STRANA)      -->
  <!-- ====================================== -->
  <!-- v2^2/(2g) - desno od presjeka 2, izmedju EGL i HGL -->
  <!-- p2/(rho g) - lijevo od presjeka 2 (u suzenju), izmedju HGL i osi -->
  <!-- label u praznom prostoru iznad ductovog topa, izmedju kote-segmenta y=240 i ductovog topa y=380 -->
  <!-- ====================================== -->
  <!-- Kote presjeka A1 i A2 (izvan ductovog envelopa) -->
  <!-- ====================================== -->
  <!-- A1: lijevo od duct lijevog ruba -->
  <!-- A2: desno od duct desnog ruba -->
  <!-- ====================================== -->
  <!-- Donji opisni tekst                     -->
  <!-- ====================================== -->
  <!-- ================================================ -->
  <!-- DESNO: PANEL S BERNOULLIJEM I RACUNOM           -->
  <!-- ================================================ -->

  <!-- Header bar -->
  <rect x="660" y="40" width="272" height="34" rx="8" fill="#1565c0" />
  <!-- Glavna jednadzba blok -->
  <rect x="660" y="82" width="272" height="80" rx="8" fill="#f4f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <!-- Korak 1: kontinuitet (Q) -->
  <rect x="660" y="170" width="272" height="68" rx="8" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="660" y="170" width="5" height="68" rx="2.5" fill="#1565c0" />
  <!-- Korak 2: brzine -->
  <rect x="660" y="246" width="272" height="82" rx="8" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="660" y="246" width="5" height="82" rx="2.5" fill="#1565c0" />
  <!-- Korak 3: pad statickog tlaka -->
  <rect x="660" y="336" width="272" height="82" rx="8" fill="#fdf6f4" stroke="#ecc7be" stroke-width="1.2" />
  <rect x="660" y="336" width="5" height="82" rx="2.5" fill="#c0392b" />
  <!-- Rezultat badge -->
  <rect x="660" y="426" width="272" height="48" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="1.6" />
  <line x1="220" y1="70" x2="272" y2="70" stroke="#b7600c" stroke-width="0.7" />
  <line x1="220" y1="118" x2="272" y2="118" stroke="#b7600c" stroke-width="0.7" />
  <line x1="267" y1="70" x2="267" y2="118" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u09ehs_dimL)" marker-end="url(#u09ehs_dim)" />
  <line x1="264" y1="70" x2="270" y2="70" stroke="#b7600c" stroke-width="1.2" />
  <line x1="264" y1="118" x2="270" y2="118" stroke="#b7600c" stroke-width="1.2" />
  <line x1="220" y1="118" x2="162" y2="118" stroke="#b7600c" stroke-width="0.7" />
  <line x1="220" y1="410" x2="162" y2="410" stroke="#b7600c" stroke-width="0.7" />
  <line x1="167" y1="118" x2="167" y2="410" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u09ehs_dimL)" marker-end="url(#u09ehs_dim)" />
  <line x1="164" y1="118" x2="170" y2="118" stroke="#b7600c" stroke-width="1.2" />
  <line x1="164" y1="410" x2="170" y2="410" stroke="#b7600c" stroke-width="1.2" />
  <line x1="380" y1="70" x2="436" y2="70" stroke="#b7600c" stroke-width="0.7" />
  <line x1="380" y1="240" x2="436" y2="240" stroke="#b7600c" stroke-width="0.7" />
  <line x1="431" y1="70" x2="431" y2="240" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u09ehs_dimL)" marker-end="url(#u09ehs_dim)" />
  <line x1="428" y1="70" x2="434" y2="70" stroke="#b7600c" stroke-width="1.2" />
  <line x1="428" y1="240" x2="434" y2="240" stroke="#b7600c" stroke-width="1.2" />
  <line x1="380" y1="240" x2="324" y2="240" stroke="#b7600c" stroke-width="0.7" />
  <line x1="380" y1="410" x2="324" y2="410" stroke="#b7600c" stroke-width="0.7" />
  <line x1="329" y1="240" x2="329" y2="410" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u09ehs_dimL)" marker-end="url(#u09ehs_dim)" />
  <line x1="326" y1="240" x2="332" y2="240" stroke="#b7600c" stroke-width="1.2" />
  <line x1="326" y1="410" x2="332" y2="410" stroke="#b7600c" stroke-width="1.2" />
  <line x1="80" y1="370" x2="62" y2="370" stroke="#b7600c" stroke-width="0.7" />
  <line x1="80" y1="450" x2="62" y2="450" stroke="#b7600c" stroke-width="0.7" />
  <line x1="67" y1="370" x2="67" y2="450" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u09ehs_dimL)" marker-end="url(#u09ehs_dim)" />
  <line x1="64" y1="370" x2="70" y2="370" stroke="#b7600c" stroke-width="1.2" />
  <line x1="64" y1="450" x2="70" y2="450" stroke="#b7600c" stroke-width="1.2" />
  <line x1="590" y1="390" x2="608" y2="390" stroke="#b7600c" stroke-width="0.7" />
  <line x1="590" y1="430" x2="608" y2="430" stroke="#b7600c" stroke-width="0.7" />
  <line x1="603" y1="390" x2="603" y2="430" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u09ehs_dimL)" marker-end="url(#u09ehs_dim)" />
  <line x1="600" y1="390" x2="606" y2="390" stroke="#b7600c" stroke-width="1.2" />
  <line x1="600" y1="430" x2="606" y2="430" stroke="#b7600c" stroke-width="1.2" />
  <text x="44" y="62" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#c0392b">EGL</text>
  <text x="80" y="62" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#7a4439">energetska linija (konstantna)</text>

  <text x="44" y="110" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1565c0">HGL</text>
  <text x="80" y="110" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#345877">piezometricka linija (pada u suzenju)</text>

  <text x="140" y="402" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="#1e8449"><tspan font-weight="700">v</tspan>₁ ≈ 8,10 m/s</text>

  <text x="495" y="402" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="#1e8449"><tspan font-weight="700">v</tspan>₂ ≈ 30,63 m/s</text>

  <text x="213" y="430" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#c0392b" text-anchor="end">1</text>
  <text x="388" y="430" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#c0392b">2</text>

  <text x="278" y="90" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1e8449"><tspan font-style="italic">v</tspan>₁²/(2<tspan font-style="italic">g</tspan>)</text>
  <text x="278" y="104" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a6a78">brzinski head 1</text>

  <text x="158" y="260" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" text-anchor="end" fill="#1565c0"><tspan font-style="italic">p</tspan>₁/(ρ<tspan font-style="italic">g</tspan>)</text>
  <text x="158" y="274" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="end" fill="#5a6a78">tlacni head 1</text>

  <text x="442" y="148" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1e8449"><tspan font-style="italic">v</tspan>₂²/(2<tspan font-style="italic">g</tspan>)</text>
  <text x="442" y="162" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a6a78">brzinski head 2</text>
  <text x="442" y="176" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-style="italic" fill="#1e8449">(vidno veci)</text>

  <text x="320" y="306" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" text-anchor="end" fill="#1565c0"><tspan font-style="italic">p</tspan>₂/(ρ<tspan font-style="italic">g</tspan>)</text>
  <text x="320" y="320" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="end" fill="#5a6a78">tlacni head 2</text>
  <text x="320" y="334" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-style="italic" text-anchor="end" fill="#1565c0">(manji)</text>

  <text x="320" y="478" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">
    Horizontalan kanal (<tspan font-style="italic">z</tspan>₁ = <tspan font-style="italic">z</tspan>₂), bez gubitaka → EGL je vodoravna; suzenje ⇒ <tspan font-style="italic">v</tspan>²/(2<tspan font-style="italic">g</tspan>) raste ⇒ <tspan font-style="italic">p</tspan>/(ρ<tspan font-style="italic">g</tspan>) pada (HGL pada).
  </text>
  <text x="320" y="494" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" text-anchor="middle" fill="#7a8a96">
    EGL = <tspan font-style="italic">p</tspan>/(ρ<tspan font-style="italic">g</tspan>) + <tspan font-style="italic">v</tspan>²/(2<tspan font-style="italic">g</tspan>) + <tspan font-style="italic">z</tspan> = konst.
  </text>

  <text x="796" y="62" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Bernoulli za horizontalan kanal</text>

  <text x="796" y="100" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#5a6a78">izjednacavanje ukupne energije 1 = 2</text>
  <text x="796" y="124" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530">
    <tspan font-style="italic">p</tspan>₁/(ρ<tspan font-style="italic">g</tspan>) + <tspan font-style="italic">v</tspan>₁²/(2<tspan font-style="italic">g</tspan>) = <tspan font-style="italic">p</tspan>₂/(ρ<tspan font-style="italic">g</tspan>) + <tspan font-style="italic">v</tspan>₂²/(2<tspan font-style="italic">g</tspan>)
  </text>
  <text x="796" y="150" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">
    Δ<tspan font-style="italic">p</tspan> = <tspan font-style="italic">p</tspan>₁ − <tspan font-style="italic">p</tspan>₂ = (ρ/2)(<tspan font-style="italic">v</tspan>₂² − <tspan font-style="italic">v</tspan>₁²)
  </text>

  <text x="676" y="190" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1565c0">1. Volumenski protok</text>
  <text x="676" y="210" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530"><tspan font-style="italic">Q</tspan> = <tspan font-style="italic">ṁ</tspan>/ρ = 0,68/1,2</text>
  <text x="676" y="228" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1565c0">≈ 0,5667 m³/s</text>

  <text x="676" y="266" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1565c0">2. Brzine iz <tspan font-style="italic">Q</tspan> = <tspan font-style="italic">vA</tspan></text>
  <text x="676" y="287" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530"><tspan font-style="italic">v</tspan>₁ = <tspan font-style="italic">Q</tspan>/<tspan font-style="italic">A</tspan>₁ = 0,5667/0,07 ≈ <tspan font-weight="700">8,10 m/s</tspan></text>
  <text x="676" y="307" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530"><tspan font-style="italic">v</tspan>₂ = <tspan font-style="italic">Q</tspan>/<tspan font-style="italic">A</tspan>₂ = 0,5667/0,0185 ≈ <tspan font-weight="700">30,63 m/s</tspan></text>

  <text x="676" y="356" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#c0392b">3. Pad statickog tlaka</text>
  <text x="676" y="377" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530">Δ<tspan font-style="italic">p</tspan> = (1,2/2)(30,63² − 8,10²)</text>
  <text x="676" y="397" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530">= 0,6 · (938,2 − 65,6) Pa</text>

  <text x="796" y="444" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#5a6a78">REZULTAT</text>
  <text x="796" y="464" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#c0392b">Δ<tspan font-style="italic">p</tspan> ≈ 523 Pa ≈ 0,523 kPa</text>

<text x="58" y="395" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" text-anchor="end" fill="#b7600c"><tspan font-style="italic">A</tspan>₁</text>
  <text x="58.0" y="411.0" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="end" fill="#b7600c">= 0,07 m²</text>

  <text x="612" y="395" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#b7600c"><tspan font-style="italic">A</tspan>₂</text>
  <text x="612.0" y="411.0" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#b7600c">= 0,0185 m²</text>

  </svg>