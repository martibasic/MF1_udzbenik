<path d="M91 410 L119 410" fill="none" stroke="#1e8449" stroke-width="2.3" marker-end="url(#u09egl_v)"/>
<text x="105.0" y="401" font-size="12" fill="#1e8449" text-anchor="middle">v₁</text>
<path d="M425 410 L531 410" fill="none" stroke="#1e8449" stroke-width="2.3" marker-end="url(#u09egl_v)"/>
<text x="478.0" y="401" font-size="12" fill="#1e8449" text-anchor="middle">v₂</text>
<circle cx="156" cy="410" r="3" fill="#c0392b"/>
<text x="156" y="438" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1</text>
<circle cx="373" cy="410" r="3" fill="#c0392b"/>
<text x="373" y="440" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">2</text>
<text x="72" y="356" font-size="12" fill="#1565c0" text-anchor="start">A₁ = 0,070 m²</text>
<text x="437" y="382" font-size="12" fill="#1565c0" text-anchor="start">A₂ = 0,0185 m²</text>
<text x="40" y="482" font-size="11" fill="#1a2530" text-anchor="start">z₁ = z₂; razmaci EGL − HGL: 5 px/m zraka.</text>
<text x="40" y="502" font-size="10" fill="#1a2530" text-anchor="start">Apsolutna visina EGL-a proizvoljna je jer ulazni tlak nije zadan.</text>
<rect x="642" y="42" width="290" height="94" rx="7" fill="white" stroke="#1565c0" stroke-width="1" stroke-opacity="0.65" />
<text x="654" y="62" font-size="13" fill="#1565c0" text-anchor="start" font-weight="700">Bernoulli bez gubitaka</text>
<text x="654" y="85" font-size="12" fill="#1a2530" text-anchor="start">p₁/(ρg) + v₁²/(2g)</text>
<text x="654" y="104" font-size="12" fill="#1a2530" text-anchor="start">= p₂/(ρg) + v₂²/(2g)</text>
<text x="654" y="123" font-size="12" fill="#1a2530" text-anchor="start">Δp = ρ(v₂² − v₁²)/2</text>
<rect x="642" y="150" width="290" height="93" rx="7" fill="white" stroke="#1565c0" stroke-width="1" stroke-opacity="0.65" />
<text x="654" y="170" font-size="13" fill="#1565c0" text-anchor="start" font-weight="700">Kontinuitet</text>
<text x="654" y="193" font-size="12" fill="#1a2530" text-anchor="start">Q = ṁ/ρ = 0,5667 m³/s</text>
<text x="654" y="212" font-size="12" fill="#1a2530" text-anchor="start">v₁ = Q/A₁ = 8,095 m/s</text>
<text x="654" y="231" font-size="12" fill="#1a2530" text-anchor="start">v₂ = Q/A₂ = 30,631 m/s</text>
<rect x="642" y="259" width="290" height="78" rx="7" fill="white" stroke="#c0392b" stroke-width="1" stroke-opacity="0.55" />
<text x="654" y="279" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Pad statičkog tlaka</text>
<text x="654" y="302" font-size="12" fill="#1a2530" text-anchor="start">Δp = 523,62 Pa ≈ 0,524 kPa</text>
<rect x="642" y="355" width="290" height="79" rx="7" fill="white" stroke="#1e8449" stroke-width="1" stroke-opacity="0.55" />
<text x="654" y="375" font-size="13" fill="#1e8449" text-anchor="start" font-weight="700">Fizikalna provjera</text>
<text x="654" y="398" font-size="12" fill="#1a2530" text-anchor="start">v₂ &gt; v₁; HGL₂ &lt; HGL₁</text>
<text x="654" y="417" font-size="12" fill="#1a2530" text-anchor="start">Ukupna mehanička energija je ista.</text>
