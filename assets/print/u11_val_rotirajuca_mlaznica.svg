      <text x="198" y="188" font-size="14" fill="#263746" text-anchor="end">M</text>
      <text x="196" y="265" font-size="12" fill="#263746" text-anchor="end">voda → glava</text>
      <line x1="260" y1="244" x2="260" y2="300" stroke="#657781" stroke-width="1" />
      <line x1="400" y1="268" x2="400" y2="300" stroke="#657781" stroke-width="1" stroke-dasharray="3 3" />
      <path id="u11rot_R" d="M260 300 L400 300" fill="none" stroke="#657781" stroke-width="1.4" marker-start="url(#u11rot_dim)" marker-end="url(#u11rot_dim)" />
      <text x="330" y="318" font-size="13" fill="#263746" text-anchor="middle">R = 0,25 m</text>
      <line x1="409" y1="256" x2="436" y2="256" stroke="#657781" stroke-width="1" />
      <text x="440" y="260" font-size="13" fill="#263746" text-anchor="start">d = 10 mm</text>
      <text x="260" y="352" font-size="13" fill="#263746" text-anchor="middle">glava; n = 60 min⁻¹ (reduktor koči)</text>
      <text x="28" y="394" font-size="13" fill="#263746" text-anchor="start">mlazovi izlaze na atmosferski tlak; os vrtnje u točki dovoda</text>
      <path d="M440 380 L480 380" fill="none" stroke="#3a4a56" stroke-width="2.3" marker-end="url(#u11rot_axisMarker)" />
      <text x="488" y="384" font-size="13" fill="#263746" text-anchor="middle">x</text>
      <path d="M440 380 L440 340" fill="none" stroke="#3a4a56" stroke-width="2.3" marker-end="url(#u11rot_axisMarker)" />
      <text x="440" y="331" font-size="13" fill="#263746" text-anchor="middle">y</text>
