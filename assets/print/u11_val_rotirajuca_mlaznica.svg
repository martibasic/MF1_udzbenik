      <text x="110" y="122" font-size="13" fill="#263746" text-anchor="end">w</text>
      <path id="u11rot_speed" d="M430 229 L430 207" fill="none" stroke="#356b83" stroke-width="2.3" marker-end="url(#u11rot_v)" />
      <text x="440" y="222" font-size="13" fill="#263746" text-anchor="start">u = ωR</text>
