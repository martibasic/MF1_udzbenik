<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-labelledby="u11rot_title u11rot_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:520px;height:auto;">
  <title id="u11rot_title">Rotirajuća mlaznica za pranje tanka</title>
  <desc id="u11rot_desc">Tlocrt glave s dva kraka duljine R od osi vrtnje. Voda se dovodi duž osi, okomito na sliku, i izlazi kroz dvije mlaznice tangencijalno u suprotnim smjerovima, pa se sile ponistavaju, a momenti zbrajaju. Glava se vrti suprotno od mlazova; obodna brzina u suprotna je relativnoj izlaznoj brzini w i znatno manja od nje. Otvori mlaznica su stvarno otvoreni; krute stijenke slijede rub fluida.</desc>
  <defs>
    <pattern id="u11rot_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.8" />
    </pattern>
    <marker id="u11rot_v" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
    </marker>
    <marker id="u11rot_dim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse">
      <path d="M0 0 L6 2.5 L0 5 Z" fill="#657781" />
    </marker>
    <marker id="u11rot_axisMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#3a4a56" />
    </marker>
  </defs>
  <g id="u11rot_title-scene-1" transform="translate(0.0000 0.0000)">
    <g font-family="Arial, Liberation Sans, sans-serif" fill="#3a4a56">
      <text x="28" y="40" font-size="17" fill="#263746" text-anchor="start" font-weight="700">Rotirajuća mlaznica (tlocrt)</text>
      <path id="u11rot_headfluid" d="M288 202 H392 Q408 202 408 218 V262 H392 V218 H288 V228 Q288 238 278 238 H242 Q232 238 232 228 V218 H128 Q112 218 112 202 V158 H128 V202 H232 V192 Q232 182 242 182 H278 Q288 182 288 192 Z" fill="#dcebf1" stroke="none" stroke-width="1.8" />
      <path id="u11rot_headouter0" d="M288 202 H392 Q408 202 408 218 V262" fill="none" stroke="#3a4a56" stroke-width="9" stroke-linecap="butt" stroke-linejoin="round" />
      <path d="M288 202 H392 Q408 202 408 218 V262" fill="none" stroke="url(#u11rot_hatch)" stroke-width="7" stroke-linecap="butt" stroke-linejoin="round" />
      <path id="u11rot_headouter1" d="M392 262 V218 H288 V228 Q288 238 278 238 H242 Q232 238 232 228 V218 H128 Q112 218 112 202 V158" fill="none" stroke="#3a4a56" stroke-width="9" stroke-linecap="butt" stroke-linejoin="round" />
      <path d="M392 262 V218 H288 V228 Q288 238 278 238 H242 Q232 238 232 228 V218 H128 Q112 218 112 202 V158" fill="none" stroke="url(#u11rot_hatch)" stroke-width="7" stroke-linecap="butt" stroke-linejoin="round" />
      <path id="u11rot_headouter2" d="M128 158 V202 H232 V192 Q232 182 242 182 H278 Q288 182 288 192 V202" fill="none" stroke="#3a4a56" stroke-width="9" stroke-linecap="butt" stroke-linejoin="round" />
      <path d="M128 158 V202 H232 V192 Q232 182 242 182 H278 Q288 182 288 192 V202" fill="none" stroke="url(#u11rot_hatch)" stroke-width="7" stroke-linecap="butt" stroke-linejoin="round" />
      <path id="u11rot_headwall0" d="M288 202 H392 Q408 202 408 218 V262" fill="none" stroke="#3a4a56" stroke-width="1.4" />
      <path id="u11rot_headwall1" d="M392 262 V218 H288 V228 Q288 238 278 238 H242 Q232 238 232 228 V218 H128 Q112 218 112 202 V158" fill="none" stroke="#3a4a56" stroke-width="1.4" />
      <path id="u11rot_headwall2" d="M128 158 V202 H232 V192 Q232 182 242 182 H278 Q288 182 288 192 V202" fill="none" stroke="#3a4a56" stroke-width="1.4" />
      <circle id="u11rot_inlet" cx="260" cy="210" r="7" fill="none" stroke="#356b83" stroke-width="1.6" />
      <circle cx="260" cy="210" r="2.2" fill="#356b83" />
      <text x="260" y="150" font-size="13" fill="#263746" text-anchor="middle">dovod Q = 2,80 L/s duž osi (okomito na sliku)</text>
      <path id="u11rot_jetright" d="M400 268 L400 318" fill="none" stroke="#356b83" stroke-width="2.3" marker-end="url(#u11rot_v)" />
      <text x="410" y="300" font-size="13" fill="#263746" text-anchor="start">w</text>
