<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="u09vent_title u09vent_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:920px;height:auto;">
<title id="u09vent_title">Venturi s diferencijalnim manometrom</title><desc id="u09vent_desc">Jedinstveno polje ulja prolazi kroz otvorene presjeke Venturija i ulazi u dva slijepa mjerna voda. Živa u povezanom U-vodu niža je na strani većeg tlaka. Unutarnji promjeri 60 i 30 mm prikazani su u omjeru 2:1. Razlika razina žive iznosi 0,18 m.</desc>
<defs>
<linearGradient id="u09vent_water" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#aed6f1"/><stop offset="100%" stop-color="#5b9ec9"/></linearGradient>
<linearGradient id="u09vent_oil" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#c8a000"/></linearGradient>
<linearGradient id="u09vent_hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1a2e42"/><stop offset="100%" stop-color="#1a3a52"/></linearGradient>
<pattern id="u09vent_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.8"/></pattern>
<marker id="u09vent_v" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#1e8449"/></marker>
<marker id="u09vent_dim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse"><path d="M0 0 L6 2.5 L0 5 Z" fill="#b7600c"/></marker>
<marker id="u09vent_dimSmall" markerWidth="3" markerHeight="3" refX="3" refY="1.5" orient="auto-start-reverse"><path d="M0 0 L3 1.5 L0 3 Z" fill="#b7600c"/></marker>
</defs>
<rect width="920" height="520" fill="white"/>
<g font-family="'Segoe UI',Arial,sans-serif" fill="#1a2530">
<rect x="14" y="14" width="546" height="492" rx="12" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.2"/>
<rect x="574" y="14" width="332" height="492" rx="12" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.2"/>
<defs><linearGradient id="u09vent_field" gradientUnits="userSpaceOnUse" x1="0" y1="144" x2="0" y2="420"><stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#c8a000"/></linearGradient></defs>
<path id="u09vent_oilmain" d="M60 144 H160 L240 159 H310 L390 144 H528 V204 H390 L310 189 H240 L160 204 H60 Z" fill="url(#u09vent_field)" stroke="none" stroke-width="1.8" />
<path id="u09vent_top" d="M60 142 H160 L240 157 H310 L390 142 H528" fill="none" stroke="#3a4a56" stroke-width="4" />
