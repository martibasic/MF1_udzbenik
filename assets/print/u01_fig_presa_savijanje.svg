<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 590" role="img" aria-labelledby="u01fps_title u01fps_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="u01fps_title">U01 - Hidraulicna presa za savijanje cijevi</title>
  <desc id="u01fps_desc">Rucna hidraulicna presa: pumpni klip d_1=32 mm (F_1=320 N) preko Pascalova zakona tlaci radni klip d_2=128 mm. Omjer povrsina A_2/A_1=(d_2/d_1)^2=16. Tlak u ulju p=0,40 MPa daje F_2=16*F_1=5,12 kN. Hod radnog klipa s_2=s_1/16=5,0 mm po jednom ciklusu pumpe (s_1=80 mm).</desc>
  <defs>
    <marker id="u01fps_aR" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#c0392b" />
    </marker>
    <marker id="u01fps_aG" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1e8449" />
    </marker>
    <marker id="u01fps_aB" markerWidth="6" markerHeight="4" refX="5.5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#1565c0" />
    </marker>
    <marker id="u01fps_aDim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L6,2.5 z" fill="#b7600c" />
    </marker>
    <marker id="u01fps_aDimR" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse">
      <path d="M0,0 L0,5 L6,2.5 z" fill="#b7600c" />
    </marker>
    <linearGradient id="u01fps_fluid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aed6f1" />
      <stop offset="100%" stop-color="#5b9ec9" />
    </linearGradient>
    <linearGradient id="u01fps_piston" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#909fa8" />
      <stop offset="100%" stop-color="#5d6d7e" />
    </linearGradient>
    <linearGradient id="u01fps_tool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a01a" />
      <stop offset="100%" stop-color="#a37810" />
    </linearGradient>
    <pattern id="u01fps_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.8" />
    </pattern>
  </defs>

  <rect width="980" height="590" fill="#ffffff" />
