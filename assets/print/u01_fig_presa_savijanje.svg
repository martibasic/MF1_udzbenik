  <rect x="400" y="340" width="240" height="30" rx="3" fill="url(#u01fps_piston)" stroke="#3a4a56" stroke-width="1.6" />
  <line x1="400" y1="348" x2="640" y2="348" stroke="#3a4a56" stroke-width="0.5" opacity="0.5" />
  <rect x="508" y="130" width="24" height="210" fill="#9aaab4" stroke="#5b6770" stroke-width="1.4" />

  <!-- ALAT + CIJEV -->
  <rect x="470" y="100" width="100" height="30" rx="3" fill="url(#u01fps_tool)" stroke="#7a4d10" stroke-width="1.6" />
  <polygon points="510,82 530,82 525,100 515,100" fill="url(#u01fps_tool)" stroke="#7a4d10" stroke-width="1.4" />

  <path d="M 410,60 Q 520,86 630,60" fill="none" stroke="#3a4a56" stroke-width="6" stroke-linecap="round" />
  <path d="M 410,60 Q 520,86 630,60" fill="none" stroke="#7a8a96" stroke-width="2.5" stroke-linecap="round" />
  <rect x="396" y="50" width="20" height="40" fill="url(#u01fps_hatch)" stroke="#4a6070" stroke-width="1.4" />
  <rect x="624" y="50" width="20" height="40" fill="url(#u01fps_hatch)" stroke="#4a6070" stroke-width="1.4" />
  <!-- SILE -->
  <line x1="80" y1="140" x2="80" y2="162" stroke="#c0392b" stroke-width="3" marker-end="url(#u01fps_aR)" />
  <!-- F_2 prema gore (lijevo od alata, tip ispod alat block) -->
  <line x1="450" y1="190" x2="450" y2="130" stroke="#1e8449" stroke-width="3" marker-end="url(#u01fps_aG)" />
  <!-- TLACNE STRELICE -->
  <line x1="80" y1="480" x2="80" y2="382" stroke="#1565c0" stroke-width="1.8" marker-end="url(#u01fps_aB)" />
  <line x1="440" y1="480" x2="440" y2="382" stroke="#1565c0" stroke-width="1.8" marker-end="url(#u01fps_aB)" />
  <line x1="490" y1="480" x2="490" y2="382" stroke="#1565c0" stroke-width="1.8" marker-end="url(#u01fps_aB)" />
  <line x1="540" y1="480" x2="540" y2="382" stroke="#1565c0" stroke-width="1.8" marker-end="url(#u01fps_aB)" />
  <line x1="590" y1="480" x2="590" y2="382" stroke="#1565c0" stroke-width="1.8" marker-end="url(#u01fps_aB)" />
  <!-- KOTE -->
  <!-- FORMULA BOX -->
  <rect x="700" y="60" width="262" height="320" rx="10" fill="#f0f7ff" stroke="#1565c0" stroke-width="1.4" />
  <rect x="700" y="60" width="262" height="32" rx="10" fill="#1565c0" />
  <rect x="700" y="84" width="262" height="8" fill="#1565c0" />
  <line x1="724" y1="170" x2="938" y2="170" stroke="#c8d6e4" stroke-width="1" />

  <line x1="724" y1="246" x2="938" y2="246" stroke="#c8d6e4" stroke-width="1" />

  <line x1="724" y1="322" x2="938" y2="322" stroke="#c8d6e4" stroke-width="1" />

  <!-- Rezultati badge (zaseban) -->
  <rect x="700" y="395" width="262" height="60" rx="8" fill="#e8f5e9" stroke="#1e8449" stroke-width="1.4" />
  <!-- LEGENDA (unutar outer rect-a) -->
  <rect x="40" y="558" width="12" height="12" fill="#c0392b" rx="2" />
  <rect x="220" y="558" width="12" height="12" fill="#1565c0" rx="2" />
  <rect x="340" y="558" width="12" height="12" fill="#1e8449" rx="2" />
  <rect x="498" y="558" width="12" height="12" fill="#aed6f1" stroke="#1565c0" stroke-width="0.8" rx="2" />
  <rect x="680" y="558" width="12" height="12" fill="url(#u01fps_tool)" stroke="#7a4d10" stroke-width="0.8" rx="2" />
  <line x1="50" y1="330" x2="50" y2="320" stroke="#b7600c" stroke-width="1.2" />
  <line x1="110" y1="330" x2="110" y2="320" stroke="#b7600c" stroke-width="1.2" />
  <line x1="53" y1="325" x2="107" y2="325" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u01fps_aDimR)" marker-end="url(#u01fps_aDim)" />
  <line x1="400" y1="330" x2="400" y2="320" stroke="#b7600c" stroke-width="1.2" />
  <line x1="640" y1="330" x2="640" y2="320" stroke="#b7600c" stroke-width="1.2" />
  <line x1="403" y1="325" x2="637" y2="325" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u01fps_aDimR)" marker-end="url(#u01fps_aDim)" />
  <line x1="160" y1="180" x2="160" y2="340" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u01fps_aDimR)" marker-end="url(#u01fps_aDim)" />
  <line x1="670" y1="334" x2="670" y2="346" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u01fps_aDimR)" marker-end="url(#u01fps_aDim)" />
  <text x="520" y="120" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#3a2a08">alat (trn)</text>
  <text x="520" y="44" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">čelična cijev (savija se)</text>

  <text x="100" y="152" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" fill="#c0392b"><tspan font-weight="700">F<tspan baseline-shift="sub" font-size="0.7em">1</tspan></tspan> = 320 N</text>

  <text x="378" y="166" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" text-anchor="end" fill="#1e8449"><tspan font-weight="700">F<tspan baseline-shift="sub" font-size="0.7em">2</tspan></tspan> = 5,12 kN</text>

  <text x="80" y="440" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" font-style="italic" text-anchor="middle" fill="#1565c0">p</text>

  <text x="520" y="440" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" font-style="italic" text-anchor="middle" fill="#1565c0">p</text>

  <text x="255" y="514" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" font-style="italic" text-anchor="middle" fill="#ffffff">p = 0,40 MPa</text>

  <text x="167" y="266" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#7a8a96">(hod pumpe)</text>

  <text x="831" y="82" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Ključne jednadžbe</text>

  <text x="831" y="114" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Omjer površina</text>
  <text x="831" y="136" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530">A<tspan baseline-shift="sub" font-size="0.7em">2</tspan>/A<tspan baseline-shift="sub" font-size="0.7em">1</tspan> = (d<tspan baseline-shift="sub" font-size="0.7em">2</tspan>/d<tspan baseline-shift="sub" font-size="0.7em">1</tspan>)²</text>
  <text x="831" y="156" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530">= 4² = 16</text>
  <text x="831" y="190" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Tlak u ulju</text>
  <text x="831" y="212" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530">p = F<tspan baseline-shift="sub" font-size="0.7em">1</tspan> / A<tspan baseline-shift="sub" font-size="0.7em">1</tspan></text>
  <text x="831" y="232" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">≈ 0,40 MPa</text>
  <text x="831" y="266" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Sila na alat (radni klip)</text>
  <text x="831" y="288" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530">F<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = p · A<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 16·F<tspan baseline-shift="sub" font-size="0.7em">1</tspan></text>
  <text x="831" y="308" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1e8449">= 5,12 kN</text>
  <text x="831" y="342" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">Hod radnog klipa</text>
  <text x="831" y="413" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#5a6a78">REZULTATI</text>
  <text x="752" y="433" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1565c0">p = 0,40 MPa</text>
  <text x="906" y="433" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1e8449">F<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 5,12 kN</text>
  <text x="58" y="568" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#3a4a56">ulazna sila F<tspan baseline-shift="sub" font-size="0.7em">1</tspan> (operater)</text>
  <text x="238" y="568" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#3a4a56">tlak p u ulju</text>
  <text x="358" y="568" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#3a4a56">izlazna sila F<tspan baseline-shift="sub" font-size="0.7em">2</tspan> (na alat)</text>
  <text x="516" y="568" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#3a4a56">ulje (kontinuirani fluid)</text>
  <text x="698" y="568" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#3a4a56">alat (trn za savijanje)</text>
<text x="80" y="316" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#b7600c">d<tspan baseline-shift="sub" font-size="0.75em">1</tspan> = 32 mm</text>

  <text x="520" y="316" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#b7600c">d<tspan baseline-shift="sub" font-size="0.75em">2</tspan> = 128 mm  (d<tspan baseline-shift="sub" font-size="0.75em">2</tspan>/d<tspan baseline-shift="sub" font-size="0.75em">1</tspan> = 4)</text>

  <text x="167" y="252" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#b7600c"><tspan font-weight="700">s<tspan baseline-shift="sub" font-size="0.75em">1</tspan></tspan> = 80 mm</text>
  <text x="678" y="344" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" font-weight="700" fill="#b7600c">s<tspan baseline-shift="sub" font-size="0.75em">2</tspan></text>

  <text x="831" y="360" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#b7600c">s<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = s<tspan baseline-shift="sub" font-size="0.7em">1</tspan>/16 = 5,0 mm</text>

  <text x="831" y="448" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#b7600c">s<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 5,0 mm po ciklusu pumpe</text>

  </svg>