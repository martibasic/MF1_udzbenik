<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="u13fpgv_title u13fpgv_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:900px;height:auto;">
  <title id="u13fpgv_title">Paralelna vodovodna mreza izmedu cvorova A i B</title>
  <desc id="u13fpgv_desc">Dvije paralelne vodovodne dionice izmedu cvorova A i B. Gornja dionica D1=150 mm (celik) nosi Q1=37,0 L/s, donja D2=100 mm (PVC) nosi Q2=13,0 L/s. Ukupni protok Q=0,050 m3/s, zajednicki pad energije h_w=7,5 m. Desno panel s formulama za R_i, raspodjelu protoka i rezultatima.</desc>

  <defs>
    <!-- Voda gradient (vertikalan da spoji s pravilima) -->
    <linearGradient id="u13fpgv_voda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aed6f1" />
      <stop offset="100%" stop-color="#5b9ec9" />
    </linearGradient>
    <!-- Strelica protoka (plava, voda) -->
    <marker id="u13fpgv_aFlow" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1565c0" />
    </marker>
    <!-- Marker kote (smedji) -->
    <marker id="u13fpgv_aDim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L6,2.5 z" fill="#b7600c" />
    </marker>
    <marker id="u13fpgv_aDimL" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse">
      <path d="M0,0 L0,5 L6,2.5 z" fill="#b7600c" />
    </marker>
  </defs>

  <!-- Pozadina -->
  <rect width="900" height="520" fill="#ffffff" />
  <rect x="14" y="14" width="872" height="492" rx="12" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.4" />

  <!-- Tanki vertikalni separator izmedu panela -->
  <line x1="572" y1="40" x2="572" y2="488" stroke="#dce7f0" stroke-width="1.2" stroke-dasharray="4,5" />

  <!-- ============================================================
       LIJEVI PANEL: SHEMA PARALELNE MREZE
       Cvor A: cx=128, Cvor B: cx=520, y=270
       Gornja grana (D1, sirenja - cijev visine 26 px): y=190..216
       Donja grana (D2, uza - cijev visine 18 px): y=320..338
  ============================================================ -->

  <!-- ===== ULAZNA CIJEV (lijevo od cvora A) ===== -->
  <!-- Vanjski okvir cijevi (debela tamna linija) -->
  <rect x="40" y="257" width="78" height="26" fill="url(#u13fpgv_voda)" stroke="#3a4a56" stroke-width="1.6" />

  <!-- ===== GRANA 1 (D1 = 150 mm, gornja, deblja - 26 px) =====
       Curving path: krene gore iz cvora A, ravno, pa dolje u cvor B
       Geometrija: x=128 -> 200 (gore), 200..448 ravno na y=203, 448..520 (dolje)
       Sirina cijevi 26 px, vertikalni centar y=203 -->
  <!-- Lijeva krivina (Y-spoj iz cvora A) -->
  <path d="M 128,257 L 128,283 L 168,283 Q 200,283 200,243 L 200,190 L 226,190 L 226,216 L 200,216 Q 226,216 226,256 L 226,283 L 128,283 Z" fill="none" stroke="none" />
  <!-- Pojednostavljena geometrija: ravna cijev sa zaobljenim Y-spojevima -->
  <!-- Vodena ispuna gornja grana -->
  <path d="M 128,260 Q 160,260 180,230 Q 200,200 230,200 L 442,200 Q 472,200 492,230 Q 512,260 544,260 L 544,280 Q 512,280 492,250 Q 472,220 442,220 L 230,220 Q 200,220 180,250 Q 160,280 128,280 Z" fill="url(#u13fpgv_voda)" />
  <!-- Crni rub gornje grane (gornja kontura) -->
  <path d="M 128,260 Q 160,260 180,230 Q 200,200 230,200 L 442,200 Q 472,200 492,230 Q 512,260 544,260" fill="none" stroke="#3a4a56" stroke-width="1.6" />
  <!-- Crni rub gornje grane (donja kontura) -->
  <path d="M 128,280 Q 160,280 180,250 Q 200,220 230,220 L 442,220 Q 472,220 492,250 Q 512,280 544,280" fill="none" stroke="#3a4a56" stroke-width="1.6" />

  <!-- ===== GRANA 2 (D2 = 100 mm, donja, uza - 18 px) ===== -->
  <!-- Vodena ispuna donja grana -->
  <path d="M 128,260 Q 160,260 180,290 Q 200,320 230,320 L 442,320 Q 472,320 492,290 Q 512,260 544,260 L 544,280 Q 512,280 492,310 Q 472,338 442,338 L 230,338 Q 200,338 180,308 Q 160,280 128,280 Z" fill="url(#u13fpgv_voda)" />
  <!-- Crni rub donje grane (gornja kontura) -->
  <path d="M 128,280 Q 160,280 180,308 Q 200,338 230,338 L 442,338 Q 472,338 492,308 Q 512,280 544,280" fill="none" stroke="#3a4a56" stroke-width="1.6" />
  <!-- Crni rub donje grane (donja - nije potreban jer se preklapa) -->

  <!-- ===== IZLAZNA CIJEV (desno od cvora B) ===== -->
  <rect x="554" y="257" width="0" height="26" fill="none" />

  <!-- Cvor A overlay (krug preko spoja) -->
  <circle cx="128" cy="270" r="14" fill="#ffffff" stroke="#3a4a56" stroke-width="1.8" />
  <circle cx="128" cy="270" r="11" fill="#f5b041" stroke="#a04030" stroke-width="0" />
  <!-- Cvor B overlay -->
  <circle cx="544" cy="270" r="14" fill="#ffffff" stroke="#3a4a56" stroke-width="1.8" />
  <circle cx="544" cy="270" r="11" fill="#f5b041" stroke="#a04030" stroke-width="0" />
  <!-- ===== ULAZNA CIJEV (lijevo od cvora A): re-draw because cvor je sada krug overlay ===== -->
  <!-- (vec nacrtano gore) -->

  <!-- Ulazna strelica protoka Q (plava, u ulaznoj cijevi) -->
  <line x1="50" y1="270" x2="108" y2="270" stroke="#1565c0" stroke-width="2.8" marker-end="url(#u13fpgv_aFlow)" />
  <!-- ===== IZLAZNA CIJEV (desno od cvora B) ===== -->
  <rect x="554" y="257" width="28" height="26" fill="url(#u13fpgv_voda)" stroke="#3a4a56" stroke-width="1.6" />
  <line x1="558" y1="270" x2="578" y2="270" stroke="#1565c0" stroke-width="2.8" marker-end="url(#u13fpgv_aFlow)" />

  <!-- ===== Strelice protoka u svakoj grani ===== -->
  <!-- Q1 - gornja grana, sredina y=210, x=320..360 -->
  <line x1="300" y1="210" x2="370" y2="210" stroke="#1565c0" stroke-width="2.8" marker-end="url(#u13fpgv_aFlow)" />
  <!-- Q2 - donja grana, sredina y=329, x=300..360 -->
  <line x1="310" y1="329" x2="360" y2="329" stroke="#1565c0" stroke-width="2.4" marker-end="url(#u13fpgv_aFlow)" />

  <!-- ===== Oznake grana ===== -->
  <!-- Grana 1 (gore iznad grane) -->
  <!-- Grana 2 (dolje ispod grane) -->
  <!-- ===== KOTA: zajednicki pad energije h_w izmedu A i B ===== -->
  <!-- Pomocne linije od cvorova prema dolje -->
  <!-- Tik-crte -->
  <!-- Dimenzijska linija A..B -->
  <!-- Labela kote: h_w = 7,5 m u maloj plocici na sredini -->
  <!-- Tekst ispod kote (objasnjenje) -->
  <!-- ===== Legenda (mali simboli, donji rub) ===== -->
  <rect x="40" y="486" width="12" height="12" fill="url(#u13fpgv_voda)" stroke="#1565c0" stroke-width="0.8" rx="2" />
  <circle cx="106" cy="492" r="6" fill="#f5b041" stroke="#3a4a56" stroke-width="1" />
  <line x1="232" y1="492" x2="252" y2="492" stroke="#1565c0" stroke-width="2.4" marker-end="url(#u13fpgv_aFlow)" />
  <!-- ============================================================
       DESNI PANEL: FORMULE I REZULTATI
       Panel: x=586..886, y=56..488
  ============================================================ -->

  <!-- Glavni okvir panela -->
  <rect x="586" y="56" width="296" height="370" rx="10" fill="#f0f7ff" stroke="#1565c0" stroke-width="1.4" />
  <!-- Header bar -->
  <rect x="586" y="56" width="296" height="32" rx="10" fill="#1565c0" />
  <rect x="586" y="80" width="296" height="8" fill="#1565c0" />
  <!-- Blok 1: Hidraulicki otpor grane (y=88..168) -->
  <line x1="610" y1="166" x2="858" y2="166" stroke="#c8d6e4" stroke-width="1" />

  <!-- Blok 2: Uvjet paralele (y=168..248) -->
  <line x1="610" y1="246" x2="858" y2="246" stroke="#c8d6e4" stroke-width="1" />

  <!-- Blok 3: Bilanca protoka (y=248..326) -->
  <line x1="610" y1="324" x2="858" y2="324" stroke="#c8d6e4" stroke-width="1" />

  <!-- Blok 4: Zajednicki pad energije (y=324..400) -->
  <!-- Sazetak italic -->
  <!-- Rezultat badge -->
  <rect x="586" y="438" width="296" height="50" rx="8" fill="#e8f5e9" stroke="#1e8449" stroke-width="1.4" />
  <line x1="128" y1="284" x2="128" y2="440" stroke="#b7600c" stroke-width="0.7" />
  <line x1="544" y1="284" x2="544" y2="440" stroke="#b7600c" stroke-width="0.7" />
  <line x1="128" y1="445" x2="128" y2="428" stroke="#b7600c" stroke-width="1.2" />
  <line x1="544" y1="445" x2="544" y2="428" stroke="#b7600c" stroke-width="1.2" />
  <line x1="131" y1="436" x2="541" y2="436" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u13fpgv_aDimL)" marker-end="url(#u13fpgv_aDim)" />
  <rect x="294" y="424" width="84" height="22" rx="5" fill="#fbfdff" stroke="#b7600c" stroke-width="1.2" />
  <rect x="356" y="488" width="14" height="8" fill="none" stroke="#b7600c" stroke-width="1.2" />
  <text x="40" y="56" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#1a2530">Paralelna vodovodna mreža A → B</text>
  <text x="40" y="76" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#5a6a78">Dvije dionice spajaju iste čvorove → isti pad energije h<tspan baseline-shift="sub" font-size="0.7em">w</tspan></text>

  <text x="128" y="275" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>

  <text x="544" y="275" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>

  <text x="79" y="248" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="#1565c0"><tspan font-weight="700">Q</tspan> = 0,050 m³/s</text>

  <text x="336" y="158" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0"><tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> = 37,0 L/s</text>
  <text x="336" y="178" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">D</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> = 150 mm  ·  <tspan font-style="italic">L</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> = 250 m  ·  λ<tspan baseline-shift="sub" font-size="0.7em">1</tspan> = 0,020  ·  čelik</text>

  <text x="336" y="378" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0"><tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 13,0 L/s</text>
  <text x="336" y="396" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">D</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 100 mm  ·  <tspan font-style="italic">L</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 300 m  ·  λ<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 0,018  ·  PVC</text>

  <text x="336" y="466" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" text-anchor="middle" fill="#5a6a78">zajednički pad ukupne energije između čvorova A i B</text>

  <text x="58" y="496" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#3a4a56">voda</text>
  <text x="118" y="496" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#3a4a56">čvor (spoj cijevi)</text>
  <text x="258" y="496" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#3a4a56">smjer protoka</text>
  <text x="376" y="496" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#3a4a56">kota</text>

  <text x="734" y="78" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Ključne jednadžbe</text>

  <text x="734" y="108" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Hidraulički otpor grane</text>
  <text x="734" y="130" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">R</tspan><tspan baseline-shift="sub" font-size="0.7em">i</tspan> = λ<tspan baseline-shift="sub" font-size="0.7em">i</tspan> <tspan font-style="italic">L</tspan><tspan baseline-shift="sub" font-size="0.7em">i</tspan> / (2g <tspan font-style="italic">D</tspan><tspan baseline-shift="sub" font-size="0.7em">i</tspan> <tspan font-style="italic">A</tspan><tspan baseline-shift="sub" font-size="0.7em">i</tspan>²)</text>
  <text x="734" y="152" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1565c0"><tspan font-style="italic">R</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> ≈ 5449    <tspan font-style="italic">R</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> ≈ 44 665   s²/m⁵</text>
  <text x="734" y="186" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Isti pad energije između A i B</text>
  <text x="734" y="208" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">R</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> <tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan>² = <tspan font-style="italic">R</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> <tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan>²</text>
  <text x="734" y="230" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1565c0"><tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan>/<tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> = √(<tspan font-style="italic">R</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan>/<tspan font-style="italic">R</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan>) ≈ 2,863</text>
  <text x="734" y="266" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Bilanca protoka u čvoru A</text>
  <text x="734" y="288" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> + <tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> = <tspan font-style="italic">Q</tspan> = 0,050 m³/s</text>
  <text x="734" y="310" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1565c0"><tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> ≈ 37,0 L/s    <tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> ≈ 13,0 L/s</text>
  <text x="734" y="344" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Zajednički pad energije</text>
  <text x="734" y="366" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">w</tspan> = <tspan font-style="italic">R</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> <tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan>²</text>
  <text x="734" y="388" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e8449">≈ 7,5 m</text>

  <text x="734" y="414" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">Šira dionica 1 nosi 74% protoka</text>

  <text x="734" y="456" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#5a6a78">REZULTATI</text>
  <text x="650" y="476" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1565c0"><tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan>:<tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> ≈ 2,86</text>
  <text x="820" y="476" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1e8449"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">w</tspan> ≈ 7,5 m</text>
<text x="336" y="440" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#b7600c"><tspan font-weight="700">h</tspan><tspan baseline-shift="sub" font-size="0.7em">w</tspan> = 7,5 m</text>

  </svg>