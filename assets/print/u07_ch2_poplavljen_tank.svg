    <text x="311.855137434174" y="464.8160705247101" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b7600c" text-anchor="middle">B = 15 m</text>
    <line x1="91.83886075321388" y1="199.44853426449833" x2="253.45601560879146" y2="188.3177096594541" stroke="#b7600c" stroke-width="1.2" marker-start="url(#u07c2pt_fix_dimL)" marker-end="url(#u07c2pt_fix_dim)" />
    <text x="172.64743818100266" y="211.8831219619762" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b7600c" text-anchor="middle">B<tspan baseline-shift="sub" font-size="0.7em">t</tspan> = 6 m</text>
    <text x="300" y="48" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#3a4a56" text-anchor="middle" font-weight="700">Izolirani puni tank; nagnut trup, mirno more</text>
    <text x="305" y="92" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#3a4a56" text-anchor="middle">L = 80 m; L<tspan baseline-shift="sub" font-size="0.7em">t</tspan> = 15 m; H = 8 m; H<tspan baseline-shift="sub" font-size="0.7em">t</tspan> = 3 m</text>
    <text x="300" y="121" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#3a4a56" text-anchor="middle">θ ≈ 3,94° ulijevo; e<tspan baseline-shift="sub" font-size="0.7em">t</tspan> = 4,5 m u koordinatama trupa</text>
    <text x="318" y="539" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#3a4a56" text-anchor="middle">Vanjska ovojnica i strop tanka nepropusni su.</text>
    <text x="318" y="558" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#3a4a56" text-anchor="middle">B: centar vanjske istisnine; G uključuje vodu u tanku.</text>
  </g>
</svg>
