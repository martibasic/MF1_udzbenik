  <rect x="624" y="502" width="330" height="62" rx="8" fill="#e8f5e9" stroke="#1e8449" stroke-width="1.4" />
  <text x="628" y="42" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Ključne jednadžbe i rezultati</text>
  <text x="789" y="82" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Početna ravnoteža u added-mass modelu</text>
  <text x="789" y="112" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Masa vode u izoliranom tanku</text>
  <text x="789" y="132" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530">
    <tspan font-style="italic">m</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">w</tspan> = ρ<tspan baseline-shift="sub" font-size="0.7em">m</tspan> · L<tspan baseline-shift="sub" font-size="0.7em">t</tspan>B<tspan baseline-shift="sub" font-size="0.7em">t</tspan>H<tspan baseline-shift="sub" font-size="0.7em">t</tspan>
  </text>
  <text x="789" y="150" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">≈ 277 t</text>
  <text x="789" y="180" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Bočni pomak težišta sustava</text>
  <text x="789" y="200" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530">
    <tspan font-style="italic">e</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">G</tspan> = m<tspan baseline-shift="sub" font-size="0.7em">w</tspan>·e<tspan baseline-shift="sub" font-size="0.7em">t</tspan> / (m<tspan baseline-shift="sub" font-size="0.7em">b</tspan> + m<tspan baseline-shift="sub" font-size="0.7em">w</tspan>)</text>
  <text x="789" y="218" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">≈ 0,291 m</text>
  <text x="789" y="248" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Novi srednji gaz</text>
  <text x="789" y="268" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530">
    <tspan font-style="italic">T</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">1</tspan> = (m<tspan baseline-shift="sub" font-size="0.7em">b</tspan> + m<tspan baseline-shift="sub" font-size="0.7em">w</tspan>) / (ρ<tspan baseline-shift="sub" font-size="0.7em">m</tspan> L B)</text>
  <text x="789" y="286" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">≈ 3,48 m   (ΔT ≈ 0,23 m)</text>
  <text x="789" y="316" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Metacentarska visina</text>
  <text x="789" y="334" font-family="'Segoe UI',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a2530">BM = I<tspan baseline-shift="sub" font-size="0.7em">T</tspan>/V = (L B³/12)/V ≈ 5,39 m</text>
  <text x="789" y="352" font-family="'Segoe UI',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a2530">BG = KG′ − KB ≈ 2,90 − 1,74 = 1,16 m</text>
  <text x="789" y="370" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1e8449">GM = BM − BG ≈ 4,23 m   &gt; 0 ✓</text>
  <text x="789" y="400" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Ravnotežni kut nagiba</text>
  <text x="789" y="420" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530">tan θ = e<tspan baseline-shift="sub" font-size="0.7em">G</tspan>/GM = 0,291/4,23</text>
  <text x="789" y="438" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#8e44ad">θ ≈ 3,94°</text>
  <text x="789" y="468" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">GM &gt; 0 daje samo početnu stabilnost</text>
  <text x="789" y="482" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">idealiziranoga trupa; nije provjera oštećene stabilnosti.</text>
  <text x="789" y="520" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#5a6a78">REZULTATI</text>
  <text x="688" y="540" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#c0392b">
    <tspan font-style="italic">e</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">G</tspan> ≈ 0,29 m</text>
  <text x="789" y="540" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1565c0">ΔT ≈ 0,23 m</text>
  <text x="890" y="540" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e8449">GM ≈ 4,23 m</text>
  <text x="789" y="558" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#8e44ad">θ ≈ 3,94°   (geom. dodir ruba pri ≈ 37,1°)</text>
  <g font-family="'Segoe UI',Arial,sans-serif" />
