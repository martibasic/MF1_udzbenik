    <text x="306.770930299372" y="338.2260860734158" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#c0392b" text-anchor="start">G</text>
    <line x1="296.770930299372" y1="299.2260860734158" x2="296.770930299372" y2="342.2260860734158" stroke="#c0392b" stroke-width="2.2" marker-end="url(#u07c2pt_fix_force)" />
    <line x1="296.7632623475194" y1="416.2836163954631" x2="296.7632623475194" y2="373.2836163954631" stroke="#1e8449" stroke-width="2.2" marker-end="url(#u07c2pt_fix_green)" />
    <text x="309.7632623475194" y="402.2836163954631" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1e8449" text-anchor="start">F<tspan baseline-shift="sub" font-size="0.7em">U</tspan>
    </text>
    <line x1="310.0" y1="419.8798780487805" x2="295.1589005266077" y2="204.39033824134373" stroke="#7a8a96" stroke-width="0.8" stroke-dasharray="4,4" />
