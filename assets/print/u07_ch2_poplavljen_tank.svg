<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 591 499" role="img" aria-labelledby="u07c2pt_title u07c2pt_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:591px;height:auto;">
  <title id="u07c2pt_title">Izolirani puni bočni tank: ravnotežni nagib</title>
  <desc id="u07c2pt_desc">Trup je kruti pravokutnik nagnut ulijevo, dok je vanjsko more vodoravno. Unutarnji lijevi tank potpuno je pun do krutog stropa, zatvoren i nema vezu s morem. Njegova voda dodaje se masi cijelog sklopa. B leži u centroidu vanjske istisnine, a ukupno G uključuje dodanu vodu. Sile su vertikalne, ne prate nagib trupa.</desc>
