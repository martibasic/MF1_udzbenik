<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="u14os_title u14os_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:720px;height:auto;">
<title id="u14os_title">Mjerila sila i bezdimenzijski omjeri</title><desc id="u14os_desc">Karakteristične skale nisu vektori sila na pojedinu česticu. Froudeov broj na kvadrat je omjer inercijske i gravitacijske skale. Za Bondov broj uzima se razlika gustoća.</desc>
<defs>
<linearGradient id="u14os_water" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#aed6f1"/><stop offset="100%" stop-color="#5b9ec9"/></linearGradient>
<linearGradient id="u14os_oil" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#c8a000"/></linearGradient>
<linearGradient id="u14os_hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1a2e42"/><stop offset="100%" stop-color="#1a3a52"/></linearGradient>
<pattern id="u14os_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.8"/></pattern>
<marker id="u14os_v" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#1e8449"/></marker>
<marker id="u14os_dim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse"><path d="M0 0 L6 2.5 L0 5 Z" fill="#b7600c"/></marker>
<marker id="u14os_dimSmall" markerWidth="3" markerHeight="3" refX="3" refY="1.5" orient="auto-start-reverse"><path d="M0 0 L3 1.5 L0 3 Z" fill="#b7600c"/></marker>
</defs>
<rect width="720" height="520" fill="white"/>
<g font-family="'Segoe UI',Arial,sans-serif" fill="#1a2530">
<!-- Zadržane neutralne boje i zaglavlja iz postojećih panela.
Jedna prostorna ispuna predstavlja isti fluid; nije mapa tlaka ili brzine.
Strelice imaju značenje iz oznake; izdvojeni vektori sila ne određuju hvatište. -->
<defs>
<marker id="u14os_forceMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#c0392b"/></marker>
<marker id="u14os_pressureMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#1565c0"/></marker>
<marker id="u14os_reactionMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#1e8449"/></marker>
<marker id="u14os_axisMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#3a4a56"/></marker>
</defs>
<rect x="24" y="28" width="312" height="418" rx="10" fill="white" stroke="#c0392b" stroke-width="1" stroke-opacity="0.65" />
<rect x="24" y="28" width="312" height="30" rx="10" fill="white" stroke="none" stroke-width="1.2"/>
<rect x="24" y="50" width="312" height="8" rx="0" fill="white" stroke="none" stroke-width="1.2"/>
<text x="180.0" y="49" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Karakteristična mjerila</text>
<rect x="354" y="28" width="342" height="418" rx="10" fill="white" stroke="#1565c0" stroke-width="1" stroke-opacity="0.65" />
<rect x="354" y="28" width="342" height="30" rx="10" fill="white" stroke="none" stroke-width="1.2"/>
<rect x="354" y="50" width="342" height="8" rx="0" fill="white" stroke="none" stroke-width="1.2"/>
<text x="525.0" y="49" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="700">Omjeri mjerila</text>
<rect x="40" y="76" width="280" height="59" rx="6" fill="white" stroke="#d4e3f0" stroke-width="1" stroke-opacity="0.65" />
<text x="54" y="97" font-size="12" fill="#1a2530" text-anchor="start">Inercijsko</text>
<text x="54" y="121" font-size="18" fill="#c0392b" text-anchor="start">Fᵢ ∼ ρv²L²</text>
<rect x="370" y="76" width="310" height="59" rx="6" fill="white" stroke="#d4e3f0" stroke-width="1" stroke-opacity="0.65" />
<text x="384" y="100" font-size="18" fill="#1565c0" text-anchor="start">Re = ρvL/μ</text>
<text x="384" y="122" font-size="12" fill="#1a2530" text-anchor="start">Re ∼ Fᵢ/Fμ</text>
<rect x="40" y="147" width="280" height="59" rx="6" fill="white" stroke="#d4e3f0" stroke-width="1" stroke-opacity="0.65" />
<text x="54" y="168" font-size="12" fill="#1a2530" text-anchor="start">Viskozno</text>
<text x="54" y="192" font-size="18" fill="#c0392b" text-anchor="start">Fμ ∼ μvL</text>
<rect x="370" y="147" width="310" height="59" rx="6" fill="white" stroke="#d4e3f0" stroke-width="1" stroke-opacity="0.65" />
<text x="384" y="171" font-size="18" fill="#1565c0" text-anchor="start">Fr² = v²/(gL)</text>
<text x="384" y="193" font-size="12" fill="#1a2530" text-anchor="start">Fr² ∼ Fᵢ/Fg</text>
<rect x="40" y="218" width="280" height="59" rx="6" fill="white" stroke="#d4e3f0" stroke-width="1" stroke-opacity="0.65" />
<text x="54" y="239" font-size="12" fill="#1a2530" text-anchor="start">Gravitacijsko</text>
<text x="54" y="263" font-size="18" fill="#c0392b" text-anchor="start">Fg ∼ ρgL³</text>
<rect x="370" y="218" width="310" height="59" rx="6" fill="white" stroke="#d4e3f0" stroke-width="1" stroke-opacity="0.65" />
<text x="384" y="242" font-size="18" fill="#1565c0" text-anchor="start">Eu = Δp/(ρv²)</text>
<text x="384" y="264" font-size="12" fill="#1a2530" text-anchor="start">Eu ∼ Fp/Fᵢ</text>
<rect x="40" y="289" width="280" height="59" rx="6" fill="white" stroke="#d4e3f0" stroke-width="1" stroke-opacity="0.65" />
<text x="54" y="310" font-size="12" fill="#1a2530" text-anchor="start">Tlačno</text>
<text x="54" y="334" font-size="18" fill="#c0392b" text-anchor="start">Fp ∼ ΔpL²</text>
<rect x="370" y="289" width="310" height="59" rx="6" fill="white" stroke="#d4e3f0" stroke-width="1" stroke-opacity="0.65" />
<text x="384" y="313" font-size="18" fill="#1565c0" text-anchor="start">We = ρv²L/σ</text>
<text x="384" y="335" font-size="12" fill="#1a2530" text-anchor="start">We ∼ Fᵢ/Fσ</text>
<rect x="40" y="360" width="280" height="59" rx="6" fill="white" stroke="#d4e3f0" stroke-width="1" stroke-opacity="0.65" />
<text x="54" y="381" font-size="12" fill="#1a2530" text-anchor="start">Kapilarno</text>
<text x="54" y="405" font-size="18" fill="#c0392b" text-anchor="start">Fσ ∼ σL</text>
<rect x="370" y="360" width="310" height="59" rx="6" fill="white" stroke="#d4e3f0" stroke-width="1" stroke-opacity="0.65" />
<text x="384" y="384" font-size="18" fill="#1565c0" text-anchor="start">Bo = ΔρgL²/σ</text>
<text x="384" y="406" font-size="12" fill="#1a2530" text-anchor="start">Bo ∼ Fg/Fσ samo ako Δρ ≈ ρ</text>
<text x="360" y="472" font-size="14" fill="#3a4a56" text-anchor="middle">Fᵢ je inercijska skala, a ne dodatna vanjska sila.</text>
<text x="360" y="495" font-size="12" fill="#3a4a56" text-anchor="middle">L, v i Δp moraju imati ista referentna značenja u svim omjerima.</text>
</g>
</svg>
