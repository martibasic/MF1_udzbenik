<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="u14os_title u14os_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:720px;height:auto;">
  <title id="u14os_title">Mjerila sila i bezdimenzijski omjeri</title>
  <desc id="u14os_desc">Karakteristične skale nisu vektori sila na pojedinu česticu. Froudeov broj na kvadrat je omjer inercijske i gravitacijske skale. Za Bondov broj uzima se razlika gustoća.</desc>
  <defs>
    <pattern id="u14os_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.8" />
    </pattern>
    <marker id="u14os_v" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
    </marker>
    <marker id="u14os_dim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse">
      <path d="M0 0 L6 2.5 L0 5 Z" fill="#356b83" />
    </marker>
    <marker id="u14os_dimSmall" markerWidth="3" markerHeight="3" refX="3" refY="1.5" orient="auto-start-reverse">
      <path d="M0 0 L3 1.5 L0 3 Z" fill="#356b83" />
    </marker>
  </defs>
  <g font-family="Arial, Liberation Sans, sans-serif" fill="#3a4a56">
    <defs>
      <marker id="u14os_forceMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
        <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
      </marker>
      <marker id="u14os_pressureMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
        <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
      </marker>
      <marker id="u14os_reactionMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
        <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
      </marker>
      <marker id="u14os_axisMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
        <path d="M0 0 L7 3 L0 6 Z" fill="#3a4a56" />
      </marker>
    </defs>
    <text x="180.0" y="49" font-size="14" fill="#263746" text-anchor="middle" font-weight="700">Karakteristična mjerila</text>
    <text x="525.0" y="49" font-size="14" fill="#263746" text-anchor="middle" font-weight="700">Omjeri mjerila</text>
    <text x="54" y="97" font-size="12" fill="#263746" text-anchor="start">Inercijsko</text>
    <text x="54" y="121" font-size="18" fill="#263746" text-anchor="start">Fᵢ ∼ ρv²L²</text>
    <text x="384" y="100" font-size="18" fill="#263746" text-anchor="start">Re = ρvL/μ</text>
    <text x="384" y="122" font-size="12" fill="#263746" text-anchor="start">Re ∼ Fᵢ/Fμ</text>
    <text x="54" y="168" font-size="12" fill="#263746" text-anchor="start">Viskozno</text>
    <text x="54" y="192" font-size="18" fill="#263746" text-anchor="start">Fμ ∼ μvL</text>
    <text x="384" y="171" font-size="18" fill="#263746" text-anchor="start">Fr² = v²/(gL)</text>
    <text x="384" y="193" font-size="12" fill="#263746" text-anchor="start">Fr² ∼ Fᵢ/Fg</text>
    <text x="54" y="239" font-size="12" fill="#263746" text-anchor="start">Gravitacijsko</text>
    <text x="54" y="263" font-size="18" fill="#263746" text-anchor="start">Fg ∼ ρgL³</text>
    <text x="384" y="242" font-size="18" fill="#263746" text-anchor="start">Eu = Δp/(ρv²)</text>
    <text x="384" y="264" font-size="12" fill="#263746" text-anchor="start">Eu ∼ Fp/Fᵢ</text>
    <text x="54" y="310" font-size="12" fill="#263746" text-anchor="start">Tlačno</text>
    <text x="54" y="334" font-size="18" fill="#263746" text-anchor="start">Fp ∼ ΔpL²</text>
    <text x="384" y="313" font-size="18" fill="#263746" text-anchor="start">We = ρv²L/σ</text>
    <text x="384" y="335" font-size="12" fill="#263746" text-anchor="start">We ∼ Fᵢ/Fσ</text>
    <text x="54" y="381" font-size="12" fill="#263746" text-anchor="start">Kapilarno</text>
    <text x="54" y="405" font-size="18" fill="#263746" text-anchor="start">Fσ ∼ σL</text>
    <text x="384" y="384" font-size="18" fill="#263746" text-anchor="start">Bo = ΔρgL²/σ</text>
    <text x="384" y="406" font-size="12" fill="#263746" text-anchor="start">Bo ∼ Fg/Fσ samo ako Δρ ≈ ρ</text>
    <text x="360" y="472" font-size="14" fill="#263746" text-anchor="middle">Fᵢ je inercijska skala, a ne dodatna vanjska sila.</text>
    <text x="360" y="495" font-size="12" fill="#263746" text-anchor="middle">L, v i Δp moraju imati ista referentna značenja u svim omjerima.</text>
  </g>
</svg>
