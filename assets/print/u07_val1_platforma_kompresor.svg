<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="u07v1pk_title u07v1pk_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:900px;height:auto;">
  <title id="u07v1pk_title">Platforma s kompresorom: uron i ravnoteža</title>
  <desc id="u07v1pk_desc">Zatvorena kruta platforma nagnuta je ulijevo; more ima vodoravnu površinu i nalazi se izvan tijela. Kompresor je lijevo od osi. Centar uzgona unutar istisnine i vertikalni pravci ukupne težine i uzgona pripadaju cijelom sklopu. Kotirani su rubni gazovi i pomak kompresora; mali kut i podatci prate početni model.</desc>
