<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488 427" role="img" aria-labelledby="u07v1pk_title u07v1pk_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:488px;height:auto;">
  <title id="u07v1pk_title">Platforma s kompresorom: uron i ravnoteža</title>
  <desc id="u07v1pk_desc">Zatvorena kruta platforma širine b = 1,00 m nagnuta je ulijevo (tan phi = 0,12); voda gustoće 998 kg/m3 ima vodoravnu površinu i nalazi se izvan tijela. Kompresor je lijevo od osi simetrije, na udaljenosti e mjerenoj usporedno s palubom. Centar uzgona B unutar istisnine; ukupna težina (m-p + m-k)g i jednako velik uzgon F-U djeluju na cijeli sklop na istom vertikalnom pravcu. Kotirani su rubni gazovi T-L i T-D.</desc>
