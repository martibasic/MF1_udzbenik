  <text x="752" y="40" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">Rješenje korak po korak</text>
  <text x="752" y="86" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">1) Srednji gaz i istisnuti volumen</text>
  <text x="752" y="108" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">m</tspan> = (h<tspan baseline-shift="sub" font-size="0.7em">L</tspan> + h<tspan baseline-shift="sub" font-size="0.7em">D</tspan>) / 2 = 0,28 m</text>
  <text x="752" y="132" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">V</tspan> = L · B · h<tspan baseline-shift="sub" font-size="0.7em">m</tspan> = 3,10 · 1,00 · 0,28 ≈ 0,868 m³</text>
  <text x="752" y="180" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">2) Pomak centra uzgona od osi simetrije</text>
  <text x="752" y="204" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">y</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">B</tspan> = B(h<tspan baseline-shift="sub" font-size="0.7em">L</tspan> − h<tspan baseline-shift="sub" font-size="0.7em">D</tspan>) / (12 h<tspan baseline-shift="sub" font-size="0.7em">m</tspan>)</text>
  <text x="752" y="228" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#263746">= 1,00 · 0,12 / (12 · 0,28) ≈ 0,0357 m</text>
  <text x="752" y="274" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">3) Ekscentar kompresora (iz momenata oko osi)</text>
  <text x="752" y="296" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" text-anchor="middle" fill="#263746">KB ≈ 0,140 m  ·  BM ≈ 0,298 m  ·  KG ≈ 0,193 m</text>
  <text x="752" y="320" font-family="Arial, Liberation Sans, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#263746">GM = KB + BM − KG ≈ 0,245 m</text>
  <text x="752" y="344" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">e</tspan> = (866/190) GM tanθ ≈ 0,134 m ≈ 13,4 cm</text>
  <text x="752" y="390" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">4) Povećanje srednje uronjenosti (od kompresora)</text>
  <text x="752" y="412" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#263746">Δ<tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">m</tspan> = m<tspan baseline-shift="sub" font-size="0.7em">k</tspan> / (ρ L B) = 190 / (998 · 3,10 · 1,00)</text>
  <text x="752" y="436" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">≈ 0,0614 m ≈ 6,14 cm</text>
  <text x="600" y="484" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-weight="700" fill="#263746">REZULTATI</text>
  <text x="704" y="484" font-family="Arial, Liberation Sans, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#263746">V ≈ 0,868 m³</text>
  <text x="808" y="484" font-family="Arial, Liberation Sans, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#263746">e ≈ 0,134 m</text>
  <text x="902" y="484" font-family="Arial, Liberation Sans, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#263746">Δh<tspan baseline-shift="sub" font-size="0.7em">m</tspan> ≈ 6,14 cm</text>
  <g font-family="Arial, Liberation Sans, sans-serif" />
