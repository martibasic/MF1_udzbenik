    <text x="265" y="47" font-family="Arial, Liberation Sans, sans-serif" font-size="14" fill="#263746" text-anchor="middle" font-weight="700">Zatvorena platforma, dublji lijevi rub</text>
    <text x="266" y="464" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" fill="#263746" text-anchor="middle">h<tspan baseline-shift="sub" font-size="0.7em">L</tspan> = 0,34 m; h<tspan baseline-shift="sub" font-size="0.7em">D</tspan> = 0,22 m; L = 3,10 m</text>
    <text x="265" y="484" font-family="Arial, Liberation Sans, sans-serif" font-size="10" fill="#263746" text-anchor="middle">B: centar istisnine; F<tspan baseline-shift="sub" font-size="0.7em">U</tspan> i G<tspan baseline-shift="sub" font-size="0.7em">uk</tspan> sile na cijeli sklop.</text>
