    <text x="73.5862821307444" y="265.78482307215535" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="start">h<tspan baseline-shift="sub" font-size="0.7em">L</tspan>
    </text>
    <line x1="442.4137178692556" y1="210" x2="452.4137178692556" y2="210" stroke="#657781" stroke-width="0.8" />
    <line x1="442.4137178692556" y1="277.2303538556893" x2="452.4137178692556" y2="277.2303538556893" stroke="#657781" stroke-width="0.8" />
    <line x1="447.4137178692556" y1="210" x2="447.4137178692556" y2="277.2303538556893" stroke="#657781" stroke-width="1.2" marker-start="url(#u07v1pk_fix_dimL)" marker-end="url(#u07v1pk_fix_dim)" />
    <text x="455.4137178692556" y="247.61517692784466" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="start">h<tspan baseline-shift="sub" font-size="0.7em">D</tspan>
    </text>
    <line x1="211.25147746672883" y1="148.85574729741964" x2="251.83035385568934" y2="143.98628213074437" stroke="#657781" stroke-width="1.2" marker-start="url(#u07v1pk_fix_dimL)" marker-end="url(#u07v1pk_fix_dim)" />
    <text x="231.54091566120908" y="138.85574729741964" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="middle">e = 0,134 m</text>
