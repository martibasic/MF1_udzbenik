<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" role="img" aria-labelledby="u08v2mt_title u08v2mt_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u08v2mt_title">U08 Val 2 - komora za mjesanje</title>
  <desc id="u08v2mt_desc">Minimalna tehnička skica komore za mjesanje s dva ulaza A i B te jednim izlazom C, s označenim protocima, gustoćama i izlaznim promjerom.</desc>
  <rect width="940" height="320" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="272" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>

  <rect x="332" y="116" width="180" height="104" rx="10" fill="#eef4f7" stroke="#173043" stroke-width="3"/>
  <text x="382" y="172" font-family="'Segoe UI',Arial,sans-serif" font-size="17" fill="#173043">komora</text>

  <line x1="118" y1="146" x2="332" y2="146" stroke="#1976d2" stroke-width="5" marker-end="url(#u08v2mt_arrowBlue)"/>
  <text x="128" y="132" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">A</text>
  <text x="142" y="164" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">Q_A = 0.150 m^3/s</text>
  <text x="142" y="184" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">rho_A = 1000</text>

  <line x1="118" y1="198" x2="332" y2="198" stroke="#c96c35" stroke-width="5" marker-end="url(#u08v2mt_arrowOrange)"/>
  <text x="128" y="214" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">B</text>
  <text x="142" y="236" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">Q_B = 0.030 m^3/s</text>
  <text x="142" y="256" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">rho_B = 800</text>

  <line x1="512" y1="168" x2="750" y2="168" stroke="#0f766e" stroke-width="6" marker-end="url(#u08v2mt_arrowGreen)"/>
  <text x="560" y="154" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">C</text>
  <text x="560" y="188" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">Q_C = Q_A + Q_B</text>
  <text x="560" y="208" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">D_C = 0.30 m</text>

  <rect x="304" y="92" width="476" height="152" rx="12" fill="none" stroke="#be123c" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="602" y="86" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#173043">kontrolni volumen</text>

  <text x="94" y="288" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#516677">Prvo zatvori masu: m_dot_A + m_dot_B = m_dot_C. Tek zatim iz izlaznog protoka dobivaš v_C kroz presjek C.</text>

  <defs>
    <marker id="u08v2mt_arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#1976d2"/>
    </marker>
    <marker id="u08v2mt_arrowOrange" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#c96c35"/>
    </marker>
    <marker id="u08v2mt_arrowGreen" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>