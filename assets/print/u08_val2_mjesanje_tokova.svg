<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" role="img" aria-labelledby="u08v2mt_u8v2-title u08v2mt_u8v2-desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u08v2mt_u8v2-title">U08 Val 2 – komora za miješanje</title>
  <desc id="u08v2mt_u8v2-desc">Komora za mijesanje: voda QA=0,150 m3/s i ulje QB=0,030 m3/s, izlaz QC=0,180 m3/s, vC=2,55 m/s, rhoC=967 kg/m3.</desc>
  <defs>
    <linearGradient id="u08v2mt_u8v2-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4eef8"/>
      <stop offset="100%" stop-color="#7ec8e8"/>
    </linearGradient>
    <linearGradient id="u08v2mt_u8v2-oil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3cc"/>
      <stop offset="100%" stop-color="#e6b84a"/>
    </linearGradient>
    <linearGradient id="u08v2mt_u8v2-mix" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9e8f2"/>
      <stop offset="100%" stop-color="#68b4d4"/>
    </linearGradient>
    <pattern id="u08v2mt_u8v2-sraf" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#8090a0"/>
      <line x1="0" y1="4" x2="8" y2="4" stroke="#546e7a" stroke-width="1.8"/>
    </pattern>
    <marker id="u08v2mt_u8v2-arrG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#0f766e"/>
    </marker>
    <marker id="u08v2mt_u8v2-arrB" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#1565c0"/>
    </marker>
    <marker id="u08v2mt_u8v2-arrA" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#b07000"/>
    </marker>
  </defs>
  <!-- Canvas -->
  <rect width="940" height="390" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="342" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>
  <!-- Title -->
  <text x="54" y="55" font-family="'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#173043">Komora za miješanje — bilanca mase</text>
  <text x="54" y="76" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#516677">Q_A = 0,150 m³/s (voda) + Q_B = 0,030 m³/s (ulje) → izlaz C, D_C = 0,30 m</text>

  <!-- ===== KOMORA ===== -->
  <!-- Central chamber walls -->
  <rect x="354" y="110" width="180" height="220" fill="url(#u08v2mt_u8v2-sraf)" stroke="none"/>
  <rect x="366" y="122" width="156" height="196" fill="url(#u08v2mt_u8v2-mix)" stroke="none"/>
  <!-- Chamber border -->
  <rect x="354" y="110" width="180" height="220" rx="0" fill="none" stroke="#3d4f5a" stroke-width="2.5"/>

  <!-- KV dashed boundary -->
  <rect x="340" y="96" width="210" height="250" rx="10" fill="none" stroke="#c96c35" stroke-width="2" stroke-dasharray="10,6"/>
  <text x="352" y="92" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#c96c35" font-style="italic">KV</text>

  <!-- Label inside chamber -->
  <text x="420" y="212" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043" text-anchor="middle">mješavina</text>
  <text x="420" y="228" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#516677" text-anchor="middle">ρ_C ≈ 967 kg/m³</text>

  <!-- Inlet A — water (upper, wider pipe) -->
  <!-- Pipe walls -->
  <rect x="90" y="148" width="266" height="52" fill="url(#u08v2mt_u8v2-sraf)" stroke="none"/>
  <rect x="102" y="160" width="254" height="28" fill="url(#u08v2mt_u8v2-water)" stroke="none"/>
  <line x1="90" y1="148" x2="354" y2="148" stroke="#3d4f5a" stroke-width="2.5"/>
  <line x1="90" y1="200" x2="354" y2="200" stroke="#3d4f5a" stroke-width="2.5"/>
  <line x1="90" y1="148" x2="90" y2="200" stroke="#3d4f5a" stroke-width="2.5"/>
  <!-- A label and arrow -->
  <line x1="44" y1="174" x2="88" y2="174" stroke="#1565c0" stroke-width="3" marker-end="url(#u08v2mt_u8v2-arrB)"/>
  <text x="32" y="164" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1565c0">A</text>
  <text x="28" y="178" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1565c0">voda</text>
  <text x="28" y="192" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1565c0">0,150 m³/s</text>

  <!-- Inlet B — oil (lower, narrower pipe) -->
  <rect x="130" y="256" width="226" height="38" fill="url(#u08v2mt_u8v2-sraf)" stroke="none"/>
  <rect x="142" y="264" width="214" height="22" fill="url(#u08v2mt_u8v2-oil)" stroke="none"/>
  <line x1="130" y1="256" x2="354" y2="256" stroke="#3d4f5a" stroke-width="2.5"/>
  <line x1="130" y1="294" x2="354" y2="294" stroke="#3d4f5a" stroke-width="2.5"/>
  <line x1="130" y1="256" x2="130" y2="294" stroke="#3d4f5a" stroke-width="2.5"/>
  <!-- B label and arrow -->
  <line x1="80" y1="275" x2="128" y2="275" stroke="#b07000" stroke-width="3" marker-end="url(#u08v2mt_u8v2-arrA)"/>
  <text x="68" y="266" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#b07000">B</text>
  <text x="66" y="280" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b07000">ulje</text>
  <text x="60" y="294" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b07000">0,030 m³/s</text>

  <!-- Outlet C — mixed (pipe to the right) -->
  <rect x="534" y="196" width="210" height="50" fill="url(#u08v2mt_u8v2-sraf)" stroke="none"/>
  <rect x="546" y="208" width="198" height="26" fill="url(#u08v2mt_u8v2-mix)" stroke="none"/>
  <line x1="534" y1="196" x2="744" y2="196" stroke="#3d4f5a" stroke-width="2.5"/>
  <line x1="534" y1="246" x2="744" y2="246" stroke="#3d4f5a" stroke-width="2.5"/>
  <line x1="744" y1="196" x2="744" y2="246" stroke="#3d4f5a" stroke-width="2.5"/>
  <!-- C label and arrow -->
  <line x1="744" y1="221" x2="790" y2="221" stroke="#0f766e" stroke-width="3" marker-end="url(#u08v2mt_u8v2-arrG)"/>
  <text x="796" y="210" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#0f766e">C</text>
  <text x="794" y="226" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#0f766e">D_C = 0,30 m</text>
  <text x="794" y="240" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#0f766e">v_C = 2,55 m/s</text>

  <!-- ===== FORMULA BOX ===== -->
  <rect x="54" y="312" width="760" height="74" rx="10" fill="#fffef6" stroke="#c49a0a" stroke-width="1.8"/>
  <text x="70" y="332" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#173043">Bilanca mase:</text>
  <text x="70" y="352" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">Q_C = Q_A + Q_B = 0,180 m³/s</text>
  <text x="70" y="370" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#516677">v_C = Q_C / A_C = 0,180 / 0,0707 = 2,55 m/s    |    ṁ_C = ρ_A·Q_A + ρ_B·Q_B = 174 kg/s    |    ρ_C = ṁ_C / Q_C ≈ 967 kg/m³</text>
</svg>