<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="u07fpn_title u07fpn_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:880px;height:auto;">
  <title id="u07fpn_title">Privezni ponton s pomaknutom opremom – gaz i bočni nagib</title>
  <desc id="u07fpn_desc">Lijevo: poprečni presjek priveznog pontona širine B=2,40 m, vlastite mase 1800 kg, sa servisnom opremom 600 kg pomaknutom za e=0,60 m od osi simetrije. Ponton je kruto tijelo (pravokutni presjek) blago nagnut prema desnoj strani: lijevi rub zaronjen 13,6 cm, desni 19,8 cm, srednji gaz 16,7 cm. Uronjeni dio presjeka je šrafiran. Težina G prema dolje (crveno) i uzgon F_U prema gore (zeleno) leže na istom pravcu (ravnoteža). Desno: panel s četiri koraka proračuna.</desc>

  <defs>
    <linearGradient id="u07fpn_voda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aed6f1" />
      <stop offset="1" stop-color="#5b9ec9" />
    </linearGradient>
    <pattern id="u07fpn_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.1" />
    </pattern>
    <pattern id="u07fpn_matH" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#cdd6dc" />
      <line x1="0" y1="0" x2="0" y2="6" stroke="#7a8a96" stroke-width="1.4" />
    </pattern>
    <marker id="u07fpn_g" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#c0392b" />
    </marker>
    <marker id="u07fpn_fu" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1e8449" />
    </marker>
    <marker id="u07fpn_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u07fpn_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u07fpn_dh" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L6,2.5 z" fill="#e67e22" />
    </marker>
    <marker id="u07fpn_dhL" markerWidth="6" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
      <path d="M0,0 L0,5 L6,2.5 z" fill="#e67e22" />
    </marker>
  </defs>

  <!-- ===== okvirni paneli ===== -->
  <line x1="500" y1="34" x2="500" y2="436" stroke="#dce7f0" stroke-width="1.2" stroke-dasharray="4,5" />

  <!-- ===================== LIJEVI PANEL: POPRECNI PRESJEK =====================
    Uniformna skala 135 px/m -> pravi rotirani pravokutnik (svi kutevi 90 st.).
    B = 2,40 m -> 324 px;  H = 0,60 m -> 81 px
    Mirna razina vode WL_y = 210;  os simetrije x = 255
    Stvarni nagib (h_R - h_L = 6,2 cm preko B = 2,40 m -> 1,47 st.), bez uvecanja.
    Donji centar pri srednjem gazu 16,7 cm: (255, 210 + 22,5) = (255, 232,5)
      dir(donji rub) = (cos1,47, sin1,47) = (0,99967, 0,02565)  desna strana dublje
      n_gore = (0,02565, -0,99967)
      BL = (93,05, 228,34)   BR = (416,95, 236,66)   [gaz: 18,34 / 26,66 px = 13,6 / 19,8 cm]
      TL = (95,13, 147,37)   TR = (419,03, 155,69)
      WL sijece bokove na (93,52, 210) i (417,64, 210)
  -->

  <!-- zrak iznad vode -->
  <rect x="30" y="76" width="448" height="134" fill="#f6fbfd" />
  <!-- voda -->
  <rect x="30" y="210" width="448" height="156" fill="url(#u07fpn_voda)" />
  <!-- mirna razina vode -->
  <line x1="30" y1="210" x2="478" y2="210" stroke="#1565c0" stroke-width="2" />
  <!-- dno akvatorija -->
  <rect x="30" y="366" width="448" height="14" fill="url(#u07fpn_hatch)" stroke="#3a4a56" stroke-width="1.2" />

  <!-- PONTON: pravi rotirani pravokutnik (kruto tijelo) -->
  <polygon points="93.05,228.34 416.95,236.66 419.03,155.69 95.13,147.37" fill="#cdd6dc" stroke="#3a4a56" stroke-width="1.8" stroke-linejoin="round" />
  <!-- paluba (gornja pruga) -->
  <polygon points="95.13,147.37 419.03,155.69 418.83,163.69 94.93,155.37" fill="#909fa8" stroke="none" />
  <!-- srafura uronjenog dijela presjeka -->
  <polygon points="93.52,210 417.64,210 416.95,236.66 93.05,228.34" fill="url(#u07fpn_matH)" stroke="none" opacity="0.9" />
  <!-- mokra granica (donji rub) naglasena -->
  <line x1="93.05" y1="228.34" x2="416.95" y2="236.66" stroke="#3a4a56" stroke-width="1.6" />

  <!-- srednji gaz dashed na y=232,5 -->
  <line x1="150" y1="232.5" x2="360" y2="232.5" stroke="#1565c0" stroke-width="1.0" stroke-dasharray="3,3" opacity="0.6" />

  <!-- os simetrije -->
  <line x1="255" y1="98" x2="255" y2="250" stroke="#7a8a96" stroke-width="1.2" stroke-dasharray="6,4" />

  <!-- OPREMA na palubi, pomaknuta e=0,60 m desno (centar x=336), na palubi (336,153,6), rotirana 1,47 st. -->
  <g transform="translate(336 153.6) rotate(1.47)">
    <rect x="-33" y="-38" width="66" height="38" rx="2" fill="#e8a23a" stroke="#b7600c" stroke-width="1.6" />
  </g>

  <!-- TEZINA G kroz zajednicko teziste (pomaknuto +0,15 m = +20 px desno od osi -> x=275) -->
  <line x1="275" y1="108" x2="275" y2="200" stroke="#c0392b" stroke-width="2.6" marker-end="url(#u07fpn_g)" />
  <circle cx="275" cy="200" r="2.8" fill="#c0392b" />

  <!-- UZGON F_U na istom pravcu (ravnoteza) prema gore -->
  <line x1="275" y1="302" x2="275" y2="238" stroke="#1e8449" stroke-width="2.6" marker-end="url(#u07fpn_fu)" />
  <circle cx="275" cy="238" r="2.6" fill="#1e8449" />

  <!-- ===== KOTE ===== -->
  <!-- h_L (lijevi gaz) -->
  <line x1="93.52" y1="210" x2="58" y2="210" stroke="#b7600c" stroke-width="0.7" />
  <line x1="93.05" y1="228.34" x2="58" y2="228.34" stroke="#b7600c" stroke-width="0.7" />
  <line x1="64" y1="210" x2="64" y2="228.34" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u07fpn_dimL)" marker-end="url(#u07fpn_dim)" />
  <!-- leader od h_L kote do labele u zraku -->
  <line x1="64" y1="219" x2="110" y2="150" stroke="#b7600c" stroke-width="0.6" stroke-dasharray="3,2" />

  <!-- h_R (desni gaz) -->
  <line x1="417.64" y1="210" x2="454" y2="210" stroke="#b7600c" stroke-width="0.7" />
  <line x1="416.95" y1="236.66" x2="454" y2="236.66" stroke="#b7600c" stroke-width="0.7" />
  <line x1="448" y1="210" x2="448" y2="236.66" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u07fpn_dimL)" marker-end="url(#u07fpn_dim)" />

  <!-- Delta h (orange) na desnoj strani: od razine lijevog gaza (y=228,34) do desnog (y=236,66) -->
  <line x1="416.95" y1="228.34" x2="434" y2="228.34" stroke="#e67e22" stroke-width="0.8" stroke-dasharray="3,3" />
  <line x1="428" y1="228.34" x2="428" y2="236.66" stroke="#e67e22" stroke-width="1.6" marker-start="url(#u07fpn_dhL)" marker-end="url(#u07fpn_dh)" />

  <!-- B (sirina) ispod pontona -->
  <line x1="93.05" y1="228.34" x2="93.05" y2="300" stroke="#b7600c" stroke-width="0.7" />
  <line x1="416.95" y1="236.66" x2="416.95" y2="300" stroke="#b7600c" stroke-width="0.7" />
  <line x1="93.05" y1="296" x2="93.05" y2="284" stroke="#b7600c" stroke-width="1.2" />
  <line x1="416.95" y1="296" x2="416.95" y2="284" stroke="#b7600c" stroke-width="1.2" />
  <line x1="96" y1="290" x2="414" y2="290" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u07fpn_dimL)" marker-end="url(#u07fpn_dim)" />

  <!-- e (pomak opreme od osi) iznad palube -->
  <line x1="255" y1="124" x2="336" y2="124" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u07fpn_dimL)" marker-end="url(#u07fpn_dim)" />
  <line x1="336" y1="124" x2="336" y2="150" stroke="#b7600c" stroke-width="0.7" stroke-dasharray="3,3" />

  <!-- ===================== DESNI PANEL: FORMULE ===================== -->
  <rect x="516" y="40" width="376" height="32" rx="8" fill="#1565c0" />
  <rect x="516" y="82" width="376" height="62" rx="8" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="516" y="82" width="6" height="62" rx="3" fill="#1565c0" />
  <rect x="516" y="152" width="376" height="68" rx="8" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="516" y="152" width="6" height="68" rx="3" fill="#1565c0" />
  <rect x="516" y="228" width="376" height="68" rx="8" fill="#fdf8f2" stroke="#ecd9c2" stroke-width="1.2" />
  <rect x="516" y="228" width="6" height="68" rx="3" fill="#b7600c" />
  <rect x="516" y="304" width="376" height="80" rx="8" fill="#fbf5ec" stroke="#ecd9c2" stroke-width="1.2" />
  <rect x="516" y="304" width="6" height="80" rx="3" fill="#e67e22" />
  <rect x="516" y="396" width="376" height="44" rx="8" fill="#e8f5e9" stroke="#1e8449" stroke-width="1.4" />

  <!-- ===== TEKST (na vrhu) ===== -->
  <text x="40" y="52" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Poprečni presjek pontona (pogled niz uzdužnu os)</text>
  <text x="40" y="70" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" fill="#5a6a78">kruto tijelo, blagi bočni nagib zbog pomaknute opreme</text>

  <text x="36" y="206" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#1565c0">p.p. (mirna razina vode)</text>

  <text x="248" y="108" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="end" fill="#7a8a96">os</text>

  <!-- oprema labela iznad kutije -->
  <text x="336" y="104" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1a2530">oprema 600 kg</text>

  <!-- G labela (iznad strelice, lijevo, da ne dira opremu) -->
  <text x="268" y="90" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" text-anchor="end" fill="#c0392b"><tspan font-weight="700">G</tspan> = (<tspan font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="0.7em">p</tspan> + <tspan font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="0.7em">o</tspan>) g ≈ 23,5 kN</text>

  <!-- F_U labela (u vodi, lijevo, jasno od B kote) -->
  <text x="120" y="345" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" fill="#1e8449"><tspan font-weight="700">F</tspan><tspan baseline-shift="sub" font-size="0.7em">U</tspan> = ρ g V<tspan baseline-shift="sub" font-size="0.7em">ist</tspan> ≈ 23,5 kN</text>

  <!-- kote labele -->
  <text x="112" y="138" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#b7600c"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">L</tspan> = 13,6 cm</text>
  <text x="458" y="228" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#b7600c"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">R</tspan> = 19,8 cm</text>
  <text x="436" y="246" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#e67e22">Δ<tspan font-style="italic">h</tspan> = 6,3 cm</text>
  <text x="255" y="310" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">B</tspan> = 2,40 m</text>
  <text x="292" y="120" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">e</tspan> = 0,60 m</text>

  <text x="448" y="204" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#0d47a1">voda</text>

  <text x="40" y="430" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78"><tspan font-style="italic">L</tspan> = 6,00 m (uzduž pontona)   ·   visina boka <tspan font-style="italic">H</tspan> = 0,60 m   ·   ρ = 998 kg/m³</text>

  <!-- DESNI PANEL TEKST -->
  <text x="704" y="61" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#ffffff">Proračun gaza i bočnog nagiba</text>

  <text x="704" y="102" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">1. Ukupna masa (vertikalna ravnoteža)</text>
  <text x="704" y="124" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">m</tspan> = <tspan font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="0.7em">p</tspan> + <tspan font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="0.7em">o</tspan> = 1800 + 600</text>
  <text x="704" y="140" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">= 2400 kg</text>

  <text x="704" y="172" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">2. Srednji gaz (h<tspan baseline-shift="sub" font-size="0.7em">sr</tspan> = m / (ρ L B))</text>
  <text x="704" y="194" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">sr</tspan> = 2400 / (998 · 6,00 · 2,40)</text>
  <text x="704" y="212" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">≈ 0,167 m = 16,7 cm</text>

  <text x="704" y="248" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">3. Moment opreme oko uzdužne osi</text>
  <text x="704" y="270" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">M</tspan> = <tspan font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="0.7em">o</tspan> g <tspan font-style="italic">e</tspan> = 600 · 9,81 · 0,60</text>
  <text x="704" y="288" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#b7600c">≈ 3531,6 N·m</text>

  <text x="704" y="324" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">4. Razlika urona (linearan nagib, momentna ravnoteža)</text>
  <text x="704" y="346" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530">Δ<tspan font-style="italic">h</tspan> = 6 <tspan font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="0.7em">o</tspan> <tspan font-style="italic">e</tspan> / (ρ L B²)</text>
  <text x="704" y="364" font-family="'Segoe UI',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a2530">= (6 · 600 · 0,60) / (998 · 6,00 · 5,76)</text>
  <text x="704" y="380" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#e67e22">≈ 0,063 m = 6,3 cm</text>

  <text x="704" y="410" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#5a6a78">REZULTATI</text>
  <text x="610" y="430" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">sr</tspan> ≈ 16,7 cm</text>
  <text x="798" y="430" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#e67e22">Δ<tspan font-style="italic">h</tspan> ≈ 6,3 cm</text>
</svg>