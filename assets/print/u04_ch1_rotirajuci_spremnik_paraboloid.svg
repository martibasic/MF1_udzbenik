<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" role="img"
     aria-labelledby="u04c1rsp_u4c1T u04c1rsp_u4c1D" preserveAspectRatio="xMidYMid meet"
     style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u04c1rsp_u4c1T">U04 CH 1 – Rotirajući cilindrični spremnik, granica prelijevanja</title>
  <desc id="u04c1rsp_u4c1D">Aksijalni presjek cilindra (R=0,40 m, H=0,78 m, h₀=0,60 m). Pri ω=5,20 rad/s: Δh=0,221 m, h_C=0,490 m, h_R=0,710 m. Granica prelijevanja: ω_max=6,64 rad/s. Manometarski tlakovi na dnu u C i D.</desc>
  <defs>
    <pattern id="u04c1rsp_u4c1H" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#8090a0"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#546e7a" stroke-width="1.8"/>
    </pattern>
    <linearGradient id="u04c1rsp_u4c1Wg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4eef8"/>
      <stop offset="100%" stop-color="#7ec8e8"/>
    </linearGradient>
    <marker id="u04c1rsp_u4c1aGr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#546e7a"/>
    </marker>
    <marker id="u04c1rsp_u4c1aGrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L0,8 L8,4 z" fill="#546e7a"/>
    </marker>
    <marker id="u04c1rsp_u4c1aRd" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#b42318"/>
    </marker>
    <marker id="u04c1rsp_u4c1aOr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#b7600c"/>
    </marker>
  </defs>

  <!-- Background + border -->
  <rect width="940" height="420" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="372" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>

  <!-- Title + subtitle -->

  <!-- === LEFT PANEL: Cylindrical container (axial cross-section) === -->
  <!-- Scale: 150 px/m. R=0,40m→60px, H=0,78m→117px -->
  <!-- Container: centered at x=290, left x=230, right x=350 (120px = 2R) -->
  <!-- Bottom y=348, top y=231 (open, H=117px) -->

  <!-- Left wall srafura -->
  <rect x="205" y="231" width="25" height="117" fill="url(#u04c1rsp_u4c1H)"/>
  <rect x="205" y="231" width="25" height="117" fill="none" stroke="#546e7a" stroke-width="1.2"/>
  <!-- Right wall srafura -->
  <rect x="350" y="231" width="25" height="117" fill="url(#u04c1rsp_u4c1H)"/>
  <rect x="350" y="231" width="25" height="117" fill="none" stroke="#546e7a" stroke-width="1.2"/>
  <!-- Bottom floor srafura -->
  <rect x="205" y="348" width="170" height="24" fill="url(#u04c1rsp_u4c1H)"/>
  <rect x="205" y="348" width="170" height="24" fill="none" stroke="#546e7a" stroke-width="1.2"/>

  <!-- Water fill with parabolic free surface -->
  <!-- ω=5,20 rad/s: h_C=0,490m→73.5px → z_C=348-73.5=274.5≈275 -->
  <!--              h_R=0,710m→106.5px → z_R=348-106.5=241.5≈242 -->
  <!-- Parabola M230,242 Q290,? 350,242: vertex at (290,275): -->
  <!--   at t=0.5: 0.25*242+0.5*y_ctrl+0.25*242 = 275 → y_ctrl = (275-121)/0.5 = 308 -->
  <path d="M230,242 Q290,308 350,242 L350,348 L230,348 Z" fill="url(#u04c1rsp_u4c1Wg)" opacity="0.9"/>

  <!-- Tank inner wall faces -->
  <line x1="230" y1="231" x2="230" y2="348" stroke="#2d3a40" stroke-width="2.5"/>
  <line x1="350" y1="231" x2="350" y2="348" stroke="#2d3a40" stroke-width="2.5"/>

  <!-- Open top rim (dashed, representing open container top) -->
  <line x1="205" y1="231" x2="375" y2="231" stroke="#2d3a40" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Parabola at ω=5,20 (working state, solid blue) -->
  <path d="M230,242 Q290,308 350,242" fill="none" stroke="#1565c0" stroke-width="2.5"/>

  <!-- Overflow-limit parabola (dashed, ω_max=6,64 rad/s) -->
  <!-- h_C_max=0,420m→63px → z_C_max=348-63=285; h_R_max=H=0,78m=117px → z_R_max=231 -->
  <!-- Parabola M230,231 Q290,? 350,231: vertex at (290,285): y_ctrl=(285-115.5)/0.5=339 -->
  <path d="M230,231 Q290,339 350,231" fill="none" stroke="#b42318" stroke-width="2" stroke-dasharray="8 5"/>

  <!-- Central axis (dashed vertical) -->
  <line x1="290" y1="215" x2="290" y2="348" stroke="#8090a0" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- h₀ dashed reference line (initial level, h₀=0,60m→90px, y=348-90=258) -->
  <line x1="230" y1="258" x2="350" y2="258" stroke="#b7600c" stroke-width="1.5" stroke-dasharray="7 5"/>
  <rect x="354" y="249" width="58" height="20" rx="4" fill="#fffbf5" stroke="#e0c080" stroke-width="1"/>
  <text x="383" y="262" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b7600c" text-anchor="middle">h₀=0,60 m</text>

  <!-- ω rotation symbol (curved arrow above container) -->
  <!-- Arc above centre, from left-ish to right-ish, with arrowhead -->
  <path d="M264,220 A30,16 0 0 1 316,220" fill="none" stroke="#173043" stroke-width="2.5"/>
  <!-- Arrowhead at end of arc: approximate position (316,220) going rightward-downward -->
  <polygon points="316,220 307,217 309,226" fill="#173043"/>
  <rect x="234" y="205" width="60" height="18" rx="4" fill="#fff" stroke="#c9d2d8" stroke-width="1"/>
  <text x="264" y="218" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#173043" text-anchor="middle">ω = 5,20</text>
  <text x="264" y="230" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#516677" text-anchor="middle">rad/s</text>

  <!-- Points C (center bottom) and D (rim bottom) -->
  <circle cx="290" cy="348" r="5" fill="#173043"/>
  <rect x="277" y="356" width="26" height="20" rx="4" fill="#fff" stroke="#c9d2d8" stroke-width="1"/>
  <text x="290" y="370" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#173043" text-anchor="middle">C</text>

  <circle cx="350" cy="348" r="5" fill="#173043"/>
  <rect x="355" y="356" width="26" height="20" rx="4" fill="#fff" stroke="#c9d2d8" stroke-width="1"/>
  <text x="368" y="370" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#173043" text-anchor="middle">D</text>

  <!-- === DIMENSION LINES === -->

  <!-- h_C dim (inside/left, at x=218, from z_C=275 to bottom 348) → 73px -->
  <line x1="218" y1="275" x2="218" y2="348" stroke="#546e7a" stroke-width="1.8" marker-start="url(#u04c1rsp_u4c1aGrL)" marker-end="url(#u04c1rsp_u4c1aGr)"/>
  <line x1="213" y1="275" x2="223" y2="275" stroke="#546e7a" stroke-width="1.3"/>
  <line x1="213" y1="348" x2="223" y2="348" stroke="#546e7a" stroke-width="1.3"/>
  <rect x="140" y="300" width="56" height="32" rx="5" fill="#fff" stroke="#c9d2d8" stroke-width="1"/>
  <text x="168" y="315" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043" text-anchor="middle">h_C</text>
  <text x="168" y="329" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677" text-anchor="middle">0,490 m</text>

  <!-- h_R dim (left, at x=195, from z_R=242 to bottom 348) → 106px -->
  <line x1="195" y1="242" x2="195" y2="348" stroke="#546e7a" stroke-width="1.8" marker-start="url(#u04c1rsp_u4c1aGrL)" marker-end="url(#u04c1rsp_u4c1aGr)"/>
  <line x1="190" y1="242" x2="200" y2="242" stroke="#546e7a" stroke-width="1.3"/>
  <rect x="110" y="281" width="56" height="32" rx="5" fill="#fff" stroke="#c9d2d8" stroke-width="1"/>
  <text x="138" y="296" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043" text-anchor="middle">h_R</text>
  <text x="138" y="310" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677" text-anchor="middle">0,710 m</text>

  <!-- H dim (right side, at x=400, from y=231 to y=348) → 117px -->
  <line x1="400" y1="231" x2="400" y2="348" stroke="#546e7a" stroke-width="1.8" marker-start="url(#u04c1rsp_u4c1aGrL)" marker-end="url(#u04c1rsp_u4c1aGr)"/>
  <line x1="395" y1="231" x2="405" y2="231" stroke="#546e7a" stroke-width="1.3"/>
  <line x1="395" y1="348" x2="405" y2="348" stroke="#546e7a" stroke-width="1.3"/>
  <rect x="407" y="279" width="56" height="34" rx="5" fill="#fff" stroke="#c9d2d8" stroke-width="1"/>
  <text x="435" y="294" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043" text-anchor="middle">H</text>
  <text x="435" y="308" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677" text-anchor="middle">0,78 m</text>

  <!-- Δh dim (between z_R=242 and z_C=275, at x=370, right of container) -->
  <line x1="370" y1="242" x2="370" y2="275" stroke="#546e7a" stroke-width="1.8" marker-start="url(#u04c1rsp_u4c1aGrL)" marker-end="url(#u04c1rsp_u4c1aGr)"/>
  <line x1="365" y1="242" x2="375" y2="242" stroke="#546e7a" stroke-width="1.3"/>
  <line x1="365" y1="275" x2="375" y2="275" stroke="#546e7a" stroke-width="1.3"/>
  <rect x="377" y="250" width="54" height="19" rx="4" fill="#fff" stroke="#c9d2d8" stroke-width="1"/>
  <text x="404" y="263" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043" text-anchor="middle">Δh</text>
  <text x="365" y="288" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#516677">0,221 m</text>

  <!-- R dim (from center x=290 to rim x=350, below bottom, y=385) -->
  <line x1="290" y1="385" x2="350" y2="385" stroke="#546e7a" stroke-width="1.8" marker-start="url(#u04c1rsp_u4c1aGrL)" marker-end="url(#u04c1rsp_u4c1aGr)"/>
  <line x1="290" y1="380" x2="290" y2="390" stroke="#546e7a" stroke-width="1.3"/>
  <line x1="350" y1="380" x2="350" y2="390" stroke="#546e7a" stroke-width="1.3"/>
  <rect x="300" y="390" width="66" height="20" rx="4" fill="#fff" stroke="#c9d2d8" stroke-width="1"/>
  <text x="333" y="404" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043" text-anchor="middle">R = 0,40 m</text>

  <!-- Legend for parabolas -->
  <line x1="105" y1="175" x2="145" y2="175" stroke="#1565c0" stroke-width="2.5"/>
  <text x="150" y="179" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#173043">Radni režim (ω=5,20 rad/s)</text>
  <line x1="105" y1="192" x2="145" y2="192" stroke="#b42318" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="150" y="196" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#173043">Granica prelijevanja (ω_max=6,64 rad/s)</text>

  <!-- p_M,C and p_M,D pressure annotations at C and D -->
  <text x="250" y="401" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#1565c0" text-anchor="middle">p_C≈4,81 kPa</text>
  <text x="350" y="401" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#1565c0" text-anchor="middle">p_D≈6,97 kPa</text>

  <!-- === RIGHT PANEL: Formula box === -->
  <rect x="500" y="88" width="398" height="310" rx="10" fill="#fffef6" stroke="#c49a0a" stroke-width="1.8"/>
  <text x="520" y="113" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#173043">Ključne jednadžbe</text>
  <line x1="520" y1="120" x2="882" y2="120" stroke="#e8d89a" stroke-width="1"/>

  <text x="520" y="140" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">h(r) = h_C + ω²r² / (2g)</text>
  <text x="520" y="158" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">Δh = ω²R² / (2g)</text>
  <text x="520" y="176" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#516677">  = 5,20² · 0,40² / (2·9,81)</text>
  <text x="520" y="194" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#173043">  Δh ≈ 0,221 m</text>
  <line x1="520" y1="202" x2="882" y2="202" stroke="#e8d89a" stroke-width="1"/>

  <text x="520" y="220" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">h_C = h₀ − Δh/2 = 0,60−0,11 = 0,490 m</text>
  <text x="520" y="238" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">h_R = h₀ + Δh/2 = 0,60+0,11 = 0,710 m</text>
  <line x1="520" y1="246" x2="882" y2="246" stroke="#e8d89a" stroke-width="1"/>

  <text x="520" y="264" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">p_M,C = ρg·h_C = 1000·9,81·0,490</text>
  <text x="520" y="281" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1565c0">  p_M,C ≈ 4,81 kPa</text>
  <text x="520" y="298" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">p_M,D = ρg·h_R = 1000·9,81·0,710</text>
  <text x="520" y="315" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1565c0">  p_M,D ≈ 6,97 kPa</text>
  <line x1="520" y1="323" x2="882" y2="323" stroke="#e8d89a" stroke-width="1"/>

  <text x="520" y="341" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">Granica prelijevanja: h_R = H</text>
  <text x="520" y="359" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#516677">  ω_max² = 2g·(H−h₀)·2/R² = 2·9,81·0,36/0,16</text>
  <text x="520" y="376" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#b42318">  ω_max ≈ 6,64 rad/s → n_max ≈ 63 o/min</text>
  <text x="520" y="392" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677">R=0,40 m, H=0,78 m, h₀=0,60 m, ρ=1000 kg/m³</text>

</svg>