<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" role="img" aria-labelledby="u04c1rsp_title u04c1rsp_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:900px;height:auto;">
  <title id="u04c1rsp_title">Rotirajuci cilindricni spremnik s paraboloidnom slobodnom povrsinom</title>
  <desc id="u04c1rsp_desc">Aksijalni presjek otvorenog cilindricnog spremnika polumjera R=0,40 m i visine H=0,78 m. Pri kutnoj brzini omega=5,20 rad/s slobodna povrsina vode postaje paraboloid revolucije: na osi dubina h_C=0,490 m, uz stijenku h_R=0,710 m, razlika Delta h=0,221 m. Tlakovi na dnu: p_M,C=4,80 kPa u tocki C, p_M,D=6,97 kPa u tocki D. Granica prelijevanja: omega_max=6,64 rad/s odnosno n_max=63,4 okr/min.</desc>

  <defs>
    <linearGradient id="u04c1rsp_voda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aed6f1" />
      <stop offset="1" stop-color="#5b9ec9" />
    </linearGradient>
    <pattern id="u04c1rsp_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.1" />
    </pattern>
    <marker id="u04c1rsp_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u04c1rsp_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u04c1rsp_pr" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#1565c0" />
    </marker>
    <marker id="u04c1rsp_om" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#8e44ad" />
    </marker>
    <marker id="u04c1rsp_omL" markerWidth="7" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#8e44ad" />
    </marker>
  </defs>

  <!-- okvirni paneli -->
  <rect x="16" y="16" width="908" height="488" rx="14" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.4" />
  <line x1="500" y1="34" x2="500" y2="486" stroke="#dce7f0" stroke-width="1.2" stroke-dasharray="4,5" />

  <!-- ===================== LIJEVI PANEL: AKSIJALNI PRESJEK ===================== -->
  <!-- Skala 200 px/m: R=0,40 m -> 80 px, H=0,78 m -> 156 px, h0=0,60 m -> 120 px -->
  <!-- Cilindar: cetrina x=260, unutarnji od x=180 do x=340, dno y=380, vrh y=224 -->
  <!-- Mirna razina h0: y = 380-120 = 260 -->
  <!-- Radni rezim: z_C = 380-98 = 282, z_R = 380-142 = 238 -->
  <!-- Granica: z_C_max = 380-84 = 296, z_R_max = 380-156 = 224 -->

  <!-- Panel naslov (deskriptivno, ne figure title) -->
  <!-- Stijenke spremnika (pune visine, otvoreni vrh) -->
  <!-- Lijeva stijenka -->
  <rect x="166" y="224" width="14" height="156" fill="url(#u04c1rsp_hatch)" stroke="#3a4a56" stroke-width="1.3" />
  <!-- Desna stijenka -->
  <rect x="340" y="224" width="14" height="156" fill="url(#u04c1rsp_hatch)" stroke="#3a4a56" stroke-width="1.3" />
  <!-- Dno spremnika -->
  <rect x="166" y="380" width="188" height="14" fill="url(#u04c1rsp_hatch)" stroke="#3a4a56" stroke-width="1.3" />

  <!-- Voda s paraboloidnom slobodnom povrsinom (radni rezim) -->
  <!-- Parabola od (180,238) do (340,238) s vrhom u (260,282); kontrolna tocka y_ctrl=326 -->
  <path d="M180,238 Q260,326 340,238 L340,380 L180,380 Z" fill="url(#u04c1rsp_voda)" />

  <!-- Konturno isticanje slobodne povrsine (radni rezim) -->
  <path d="M180,238 Q260,326 340,238" fill="none" stroke="#1565c0" stroke-width="2.4" />

  <!-- Granicna paraboloidna povrsina (dashed) - omega_max -->
  <!-- Parabola od (180,224) do (340,224) s vrhom u (260,296); y_ctrl=368 -->
  <path d="M180,224 Q260,368 340,224" fill="none" stroke="#8e44ad" stroke-width="1.7" stroke-dasharray="7,4" />

  <!-- Mirna razina h0 (referenca, isprekidana smeda) -->
  <!-- Os simetrije (isprekidana siva, proteze se iznad i ispod cilindra) -->
  <line x1="260" y1="200" x2="260" y2="218" stroke="#7a8a96" stroke-width="1" stroke-dasharray="5,4" />
  <line x1="260" y1="224" x2="260" y2="380" stroke="#7a8a96" stroke-width="1" stroke-dasharray="5,4" />
  <!-- Kutna brzina omega - zakrivljena strelica iznad spremnika -->
  <path d="M222,196 A42,16 0 0 1 298,196" fill="none" stroke="#8e44ad" stroke-width="2.2" marker-end="url(#u04c1rsp_om)" />
  <!-- Tocke C (na osi, na dnu) i D (uz rub, na dnu) - bijeli krug za citljivost -->
  <circle cx="260" cy="380" r="4.5" fill="#ffffff" stroke="#1a2530" stroke-width="1.6" />
  <circle cx="260" cy="380" r="2.2" fill="#1a2530" />
  <circle cx="340" cy="380" r="4.5" fill="#ffffff" stroke="#1a2530" stroke-width="1.6" />
  <circle cx="340" cy="380" r="2.2" fill="#1a2530" />
  <!-- C i D etikete u praznoj zoni izmedu dna spremnika i R-kote -->
  <line x1="260" y1="384" x2="255" y2="400" stroke="#1a2530" stroke-width="0.7" />
  <line x1="340" y1="384" x2="345" y2="400" stroke="#1a2530" stroke-width="0.7" />

  <!-- Tlacne strelice na dnu C i D (plave, smjer dolje na dno) -->
  <line x1="270" y1="362" x2="270" y2="376" stroke="#1565c0" stroke-width="1.8" marker-end="url(#u04c1rsp_pr)" />
  <line x1="330" y1="362" x2="330" y2="376" stroke="#1565c0" stroke-width="1.8" marker-end="url(#u04c1rsp_pr)" />
  <!-- ===================== KOTE ===================== -->

  <!-- Kota H (lijevo od cilindra, od vrha do dna) -->
  <!-- Kota h_C (unutar fluida, od povrsine na osi do dna) - lijevo od osi -->
  <!-- Kota h_R (desno od cilindra, od povrsine uz stijenku do dna) -->
  <!-- Kota Delta h - narancasta, izmedu razine na osi (282) i razine uz stijenku (238), desno od stijenke -->
  <line x1="354" y1="282" x2="374" y2="282" stroke="#e67e22" stroke-width="0.7" />
  <line x1="369" y1="238" x2="369" y2="282" stroke="#e67e22" stroke-width="1.3" marker-start="url(#u04c1rsp_dimL)" marker-end="url(#u04c1rsp_dim)" />
  <line x1="364" y1="282" x2="374" y2="282" stroke="#e67e22" stroke-width="1.2" />
  <!-- Kota R (ispod dna, od osi do desnog ruba unutarnjeg promjera) -->
  <!-- Legenda za paraboloide (donji dio lijevog panela) -->
  <line x1="40" y1="466" x2="78" y2="466" stroke="#1565c0" stroke-width="2.4" />
  <line x1="270" y1="466" x2="308" y2="466" stroke="#8e44ad" stroke-width="1.7" stroke-dasharray="7,4" />
  <!-- h0 oznaka iznad mirne razine, u centralnoj zracnoj zoni (parabola tu je iznad linije) -->
  <!-- ===================== DESNI PANEL: FORMULE ===================== -->

  <!-- Header bar (ljubicasta - rotacija) -->
  <rect x="518" y="46" width="392" height="34" rx="8" fill="#8e44ad" />
  <!-- Glavna jednadzba (oblik povrsine) -->
  <rect x="518" y="90" width="392" height="46" rx="6" fill="#f5eef9" stroke="#d6c2e3" stroke-width="1.1" />
  <!-- Blok 1: Delta h -->
  <rect x="518" y="146" width="392" height="76" rx="8" fill="#fef6ef" stroke="#f0d8b8" stroke-width="1.1" />
  <rect x="518" y="146" width="6" height="76" rx="3" fill="#e67e22" />
  <!-- Blok 2: h_C, h_R -->
  <rect x="518" y="230" width="392" height="76" rx="8" fill="#fef6ef" stroke="#f0d8b8" stroke-width="1.1" />
  <!-- Blok 3: Tlakovi p_M,C i p_M,D -->
  <rect x="518" y="314" width="392" height="76" rx="8" fill="#eaf3fb" stroke="#bcd6ec" stroke-width="1.1" />
  <rect x="518" y="314" width="6" height="76" rx="3" fill="#1565c0" />
  <!-- Blok 4: Granica prelijevanja -->
  <rect x="518" y="398" width="392" height="76" rx="8" fill="#f5eef9" stroke="#d6c2e3" stroke-width="1.1" />
  <rect x="518" y="398" width="6" height="76" rx="3" fill="#8e44ad" />
  <!-- Italic footer -->
  <line x1="180" y1="260" x2="340" y2="260" stroke="#b7600c" stroke-width="1.3" stroke-dasharray="6,4" opacity="0.85" />

  <line x1="166" y1="224" x2="100" y2="224" stroke="#b7600c" stroke-width="0.7" />
  <line x1="166" y1="380" x2="100" y2="380" stroke="#b7600c" stroke-width="0.7" />
  <line x1="105" y1="224" x2="105" y2="380" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u04c1rsp_dimL)" marker-end="url(#u04c1rsp_dim)" />
  <line x1="100" y1="224" x2="110" y2="224" stroke="#b7600c" stroke-width="1.2" />
  <line x1="100" y1="380" x2="110" y2="380" stroke="#b7600c" stroke-width="1.2" />
  <line x1="180" y1="282" x2="142" y2="282" stroke="#b7600c" stroke-width="0.7" stroke-dasharray="3,2" />
  <line x1="147" y1="282" x2="147" y2="380" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u04c1rsp_dimL)" marker-end="url(#u04c1rsp_dim)" />
  <line x1="142" y1="282" x2="152" y2="282" stroke="#b7600c" stroke-width="1.2" />
  <line x1="142" y1="380" x2="152" y2="380" stroke="#b7600c" stroke-width="1.2" />
  <line x1="354" y1="238" x2="404" y2="238" stroke="#b7600c" stroke-width="0.7" />
  <line x1="354" y1="380" x2="404" y2="380" stroke="#b7600c" stroke-width="0.7" />
  <line x1="399" y1="238" x2="399" y2="380" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u04c1rsp_dimL)" marker-end="url(#u04c1rsp_dim)" />
  <line x1="394" y1="238" x2="404" y2="238" stroke="#b7600c" stroke-width="1.2" />
  <line x1="394" y1="380" x2="404" y2="380" stroke="#b7600c" stroke-width="1.2" />
  <line x1="260" y1="394" x2="260" y2="436" stroke="#b7600c" stroke-width="0.7" />
  <line x1="340" y1="394" x2="340" y2="436" stroke="#b7600c" stroke-width="0.7" />
  <line x1="260" y1="431" x2="340" y2="431" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u04c1rsp_dimL)" marker-end="url(#u04c1rsp_dim)" />
  <line x1="260" y1="426" x2="260" y2="436" stroke="#b7600c" stroke-width="1.2" />
  <line x1="340" y1="426" x2="340" y2="436" stroke="#b7600c" stroke-width="1.2" />
  <rect x="518" y="230" width="6" height="76" rx="3" fill="#b7600c" />
  <text x="260" y="50" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530">Aksijalni presjek (paraboloid revolucije)</text>

  <text x="270" y="214" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" font-style="italic" fill="#5a6a78">os vrtnje</text>

  <text x="260" y="184" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" text-anchor="middle" fill="#8e44ad"><tspan font-weight="700">ω</tspan> = 5,20 rad/s</text>

  <text x="251" y="410" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530">C</text>
  <text x="349" y="410" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530">D</text>
  <text x="278" y="370" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" fill="#1565c0">p<tspan baseline-shift="sub" font-size="0.7em">M,C</tspan></text>

  <text x="306" y="370" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" fill="#1565c0">p<tspan baseline-shift="sub" font-size="0.7em">M,D</tspan></text>

  <text x="378" y="258" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#e67e22">Δ<tspan font-style="italic">h</tspan></text>
  <text x="378.0" y="274.0" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#e67e22">= 0,221 m</text>

  <text x="84" y="470" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a2530">radni rezim (ω = 5,20 rad/s)</text>
  <text x="314" y="470" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a2530">granica prelijevanja (ω<tspan baseline-shift="sub" font-size="0.7em">max</tspan>)</text>

  <text x="714" y="68" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#ffffff">Paraboloidna slobodna povrsina − kljucne jednadzbe</text>

  <text x="528" y="108" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78">Oblik slobodne povrsine</text>
  <text x="714" y="128" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">h</tspan>(<tspan font-style="italic">r</tspan>) = <tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">C</tspan> + ω²<tspan font-style="italic">r</tspan>² / (2<tspan font-style="italic">g</tspan>)</text>

  <text x="538" y="166" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#e67e22">1. Razlika razina Δ<tspan font-style="italic">h</tspan></text>
  <text x="714" y="188" font-family="'Segoe UI',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a2530">Δ<tspan font-style="italic">h</tspan> = ω²<tspan font-style="italic">R</tspan>² / (2<tspan font-style="italic">g</tspan>) = 5,20² · 0,40² / (2 · 9,81)</text>
  <text x="714" y="210" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#e67e22">Δ<tspan font-style="italic">h</tspan> ≈ 0,221 m</text>

  <text x="714" y="272" font-family="'Segoe UI',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">C</tspan> = <tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">0</tspan> − Δ<tspan font-style="italic">h</tspan>/2,  <tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">R</tspan> = <tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">0</tspan> + Δ<tspan font-style="italic">h</tspan>/2</text>
  <text x="538" y="334" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1565c0">3. Manometarski tlakovi na dnu</text>
  <text x="714" y="356" font-family="'Segoe UI',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">p</tspan><tspan baseline-shift="sub" font-size="0.7em">M</tspan> = ρ<tspan font-style="italic">g</tspan> <tspan font-style="italic">h</tspan>(<tspan font-style="italic">r</tspan>)</text>
  <text x="714" y="378" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1565c0"><tspan font-style="italic">p</tspan><tspan baseline-shift="sub" font-size="0.7em">M,C</tspan> ≈ 4,80 kPa,  <tspan font-style="italic">p</tspan><tspan baseline-shift="sub" font-size="0.7em">M,D</tspan> ≈ 6,97 kPa</text>

  <text x="538" y="418" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#8e44ad">4. Granica prelijevanja (<tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">R</tspan> = <tspan font-style="italic">H</tspan>)</text>
  <text x="714" y="440" font-family="'Segoe UI',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a2530">ω<tspan baseline-shift="sub" font-size="0.7em">max</tspan> = √[4<tspan font-style="italic">g</tspan>(<tspan font-style="italic">H</tspan> − <tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">0</tspan>) / <tspan font-style="italic">R</tspan>²]</text>
  <text x="714" y="462" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#8e44ad">ω<tspan baseline-shift="sub" font-size="0.7em">max</tspan> ≈ 6,64 rad/s,  <tspan font-style="italic">n</tspan><tspan baseline-shift="sub" font-size="0.7em">max</tspan> ≈ 63,4 okr/min</text>

  <text x="714" y="492" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" text-anchor="middle" fill="#5a6a78">∂<tspan font-style="italic">p</tspan>/∂<tspan font-style="italic">r</tspan> = ρω²<tspan font-style="italic">r</tspan>,  ∂<tspan font-style="italic">p</tspan>/∂<tspan font-style="italic">z</tspan> = −ρ<tspan font-style="italic">g</tspan>  →  <tspan font-style="italic">h</tspan>(<tspan font-style="italic">r</tspan>) paraboloid</text>

<text x="92" y="298" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">H</tspan></text>
  <text x="92.0" y="314.0" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#b7600c">= 0,78 m</text>

  <text x="139" y="328" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">C</tspan></text>
  <text x="139.0" y="344.0" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#b7600c">= 0,490 m</text>

  <text x="416" y="306" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">R</tspan></text>
  <text x="416.0" y="322.0" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#b7600c">= 0,710 m</text>

  <text x="300" y="450" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">R</tspan> = 0,40 m</text>

  <text x="222" y="256" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-style="italic" fill="#b7600c"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">0</tspan> = 0,60 m (mirno)</text>

  <text x="538" y="250" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#b7600c">2. Dubine na osi i uz stijenku</text>
  <text x="714" y="294" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">C</tspan> ≈ 0,490 m,  <tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">R</tspan> ≈ 0,710 m</text>

  </svg>