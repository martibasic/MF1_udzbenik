  <text x="260" y="50" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">Aksijalni presjek (paraboloid revolucije)</text>
  <text x="270" y="214" font-family="Arial, Liberation Sans, sans-serif" font-size="9.5" font-style="italic" fill="#263746">os vrtnje</text>
  <text x="260" y="184" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-style="italic" text-anchor="middle" fill="#263746">
    <tspan font-weight="700">ω</tspan> = 5,20 rad/s</text>
  <text x="251" y="410" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">C</text>
  <text x="349" y="410" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">D</text>
  <text x="226" y="358" font-family="Arial, Liberation Sans, sans-serif" font-size="10" font-style="italic" fill="#263746" text-anchor="middle">p<tspan baseline-shift="sub" font-size="0.7em">M,C</tspan>
  </text>
  <text x="319" y="358" font-family="Arial, Liberation Sans, sans-serif" font-size="10" font-style="italic" fill="#263746" text-anchor="middle">p<tspan baseline-shift="sub" font-size="0.7em">M,D</tspan>
  </text>
  <text x="375" y="209" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-weight="700" fill="#263746">Δh</text>
  <text x="375" y="224" font-family="Arial, Liberation Sans, sans-serif" font-size="10" fill="#263746">≈ 0,221 m</text>
  <text x="84" y="470" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" fill="#263746">radni režim (ω = 5,20 rad/s)</text>
  <text x="314" y="470" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" fill="#263746">granica prelijevanja (ω<tspan baseline-shift="sub" font-size="0.7em">max</tspan>)</text>
  <text x="714" y="68" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#263746">Paraboloidna slobodna površina − ključne jednadžbe</text>
  <text x="528" y="108" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" fill="#263746">Oblik slobodne površine</text>
  <text x="714" y="128" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">h</tspan>(<tspan font-style="italic">r</tspan>) = <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">C</tspan> + ω²<tspan font-style="italic">r</tspan>² / (2<tspan font-style="italic">g</tspan>)</text>
  <text x="538" y="166" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" fill="#263746">1. Razlika razina Δ<tspan font-style="italic">h</tspan>
  </text>
  <text x="714" y="188" font-family="Arial, Liberation Sans, sans-serif" font-size="13" text-anchor="middle" fill="#263746">Δ<tspan font-style="italic">h</tspan> = ω²<tspan font-style="italic">R</tspan>² / (2<tspan font-style="italic">g</tspan>) = 5,20² · 0,40² / (2 · 9,81)</text>
  <text x="714" y="210" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">Δ<tspan font-style="italic">h</tspan> ≈ 0,221 m</text>
  <text x="714" y="272" font-family="Arial, Liberation Sans, sans-serif" font-size="13" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">C</tspan> = <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">0</tspan> − Δ<tspan font-style="italic">h</tspan>/2,  <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">R</tspan> = <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">0</tspan> + Δ<tspan font-style="italic">h</tspan>/2</text>
  <text x="538" y="334" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" fill="#263746">3. Manometarski tlakovi na dnu</text>
  <text x="714" y="356" font-family="Arial, Liberation Sans, sans-serif" font-size="13" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">M</tspan> = ρ<tspan font-style="italic">g</tspan>
    <tspan font-style="italic">h</tspan>(<tspan font-style="italic">r</tspan>)</text>
  <text x="714" y="378" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">M,C</tspan> ≈ 4,80 kPa,  <tspan font-style="italic">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">M,D</tspan> ≈ 6,97 kPa</text>
  <text x="538" y="418" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" fill="#263746">4. Granica prelijevanja (<tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">R</tspan> = <tspan font-style="italic">H</tspan>)</text>
  <text x="714" y="440" font-family="Arial, Liberation Sans, sans-serif" font-size="13" text-anchor="middle" fill="#263746">ω<tspan baseline-shift="sub" font-size="0.7em">max</tspan> = √[4<tspan font-style="italic">g</tspan>(<tspan font-style="italic">H</tspan> − <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">0</tspan>) / <tspan font-style="italic">R</tspan>²]</text>
  <text x="714" y="462" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">ω<tspan baseline-shift="sub" font-size="0.7em">max</tspan> ≈ 6,64 rad/s,  <tspan font-style="italic">n</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">max</tspan> ≈ 63,4 okr/min</text>
  <text x="714" y="492" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" font-style="italic" text-anchor="middle" fill="#263746">∂<tspan font-style="italic">p</tspan>/∂<tspan font-style="italic">r</tspan> = ρω²<tspan font-style="italic">r</tspan>,  ∂<tspan font-style="italic">p</tspan>/∂<tspan font-style="italic">z</tspan> = −ρ<tspan font-style="italic">g</tspan>  →  <tspan font-style="italic">h</tspan>(<tspan font-style="italic">r</tspan>) paraboloid</text>
  <text x="92" y="298" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">H</tspan>
  </text>
  <text x="92.0" y="314.0" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#263746">= 0,78 m</text>
  <text x="421" y="306" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#263746">
    <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">R</tspan>
  </text>
  <text x="421" y="322.0" font-family="Arial, Liberation Sans, sans-serif" font-size="10" text-anchor="start" fill="#263746">= 0,710 m</text>
  <text x="300" y="450" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">R</tspan> = 0,40 m</text>
  <text x="222" y="256" font-family="Arial, Liberation Sans, sans-serif" font-size="10" font-style="italic" fill="#263746">
    <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">0</tspan> = 0,60 m (mirno)</text>
  <text x="538" y="250" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" fill="#263746">2. Dubine na osi i uz stijenku</text>
  <text x="714" y="294" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">C</tspan> ≈ 0,490 m,  <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">R</tspan> ≈ 0,710 m</text>
  <text x="129" y="331" font-family="Arial, Liberation Sans, sans-serif" font-size="10" fill="#263746" text-anchor="middle" transform="rotate(-90 129 331)">h<tspan baseline-shift="sub" font-size="0.7em">C</tspan> ≈ 0,490 m</text>
</svg>
