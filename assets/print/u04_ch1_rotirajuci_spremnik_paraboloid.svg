<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" role="img" aria-labelledby="u04c1rsp_title u04c1rsp_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:900px;height:auto;">
  <title id="u04c1rsp_title">Rotirajući cilindrični spremnik s paraboloidnom slobodnom površinom</title>
  <desc id="u04c1rsp_desc">Aksijalni presjek otvorenog cilindričnog spremnika polumjera R=0,40 m i visine H=0,78 m. Pri kutnoj brzini omega=5,20 rad/s slobodna površina vode postaje paraboloid revolucije: na osi dubina h_C=0,490 m, uz stijenku h_R=0,710 m, razlika Delta h=0,221 m. Tlakovi na dnu: p_M,C=4,80 kPa u točki C, p_M,D=6,97 kPa u točki D. Granica prelijevanja: omega_max=6,64 rad/s odnosno n_max=63,4 okr/min.</desc>
  <defs>
    <pattern id="u04c1rsp_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.1" />
    </pattern>
    <marker id="u04c1rsp_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#657781" />
    </marker>
    <marker id="u04c1rsp_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#657781" />
    </marker>
    <marker id="u04c1rsp_pr" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#356b83" />
    </marker>
    <marker id="u04c1rsp_om" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
