  <text x="40" y="56" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" fill="#263746">Spojene posude – statika</text>
  <text x="40" y="74" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" fill="#263746">isti fluid, ista razina → isti tlak na istoj dubini</text>
  <text x="134" y="272" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#263746">voda</text>
  <text x="347" y="272" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#263746">voda</text>
  <text x="134" y="222" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="#263746">p₀</text>
  <text x="347" y="222" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="#263746">p₀</text>
  <text x="134" y="342" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#263746">A</text>
  <text x="347" y="342" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#263746">B</text>
  <text x="220" y="431" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">p<tspan baseline-shift="sub" font-size="0.7em">A</tspan> = p<tspan baseline-shift="sub" font-size="0.7em">B</tspan> = p₀ + ρ g h</text>
  <text x="40" y="100" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" font-style="italic" fill="#263746">Usp. P3: u zatvorenom spremniku p<tspan baseline-shift="sub" font-size="0.7em">C</tspan> ≈ 133,0 kPa (manom. ≈ 31,7 kPa).</text>
  <text x="492" y="56" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" fill="#263746">Efektivno polje sila – prijelaz prema pog. 4</text>
  <text x="492" y="74" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" fill="#263746">ubrzani spremnik: slobodna površina ⊥ g<tspan baseline-shift="sub" font-size="0.7em">eff</tspan>
  </text>
  <text x="680" y="170" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-style="italic" fill="#263746">p₀</text>
  <text x="710" y="98" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="#263746">
    <tspan font-weight="700">a</tspan> → (ubrzanje)</text>
  <text x="562" y="200" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-style="italic" font-weight="700" fill="#263746">α</text>
  <text x="650" y="320" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-style="italic" font-weight="700" fill="#263746">g</text>
  <text x="624" y="255" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="#263746">
    <tspan font-weight="700">−a</tspan>
  </text>
  <text x="603" y="347" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-style="italic" text-anchor="end" fill="#263746">
    <tspan font-weight="700">g</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">eff</tspan>
  </text>
  <text x="632" y="321" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" fill="#263746">α</text>
  <text x="645" y="431" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">tan α = a / g  ,  g<tspan baseline-shift="sub" font-size="0.7em">eff</tspan> = √(g² + a²)</text>
  <text x="36" y="284" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="#263746">h</text>
</svg>
