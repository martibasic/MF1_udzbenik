    <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">str</tspan> &gt; 0</text>
  <text x="710" y="484" font-family="Arial, Liberation Sans, sans-serif" font-size="10" text-anchor="middle" fill="#263746" transform="translate(0 9)">nema prelijevanja</text>
  <text x="860" y="484" font-family="Arial, Liberation Sans, sans-serif" font-size="10" text-anchor="middle" fill="#263746" transform="translate(0 9)">nema ogoljavanja</text>
