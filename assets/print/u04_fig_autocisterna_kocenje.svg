<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img"
     aria-labelledby="u04fak_u4akT u04fak_u4akD" preserveAspectRatio="xMidYMid meet"
     style="display:block;width:100%;max-width:720px;height:auto;">
  <title id="u04fak_u4akT">Nagib goriva u autocisterni pri kočenju</title>
  <desc id="u04fak_u4akD">Poprečni presjek cisterne za gorivo pri kočenju (L=1,2 m, h₀=0,45 m, a=3,8 m/s²). Δh=aL/g≈0,47 m. h_pred=0,683 m (lijeva/prednja stijenka), h_straz=0,217 m (desna/stražnja stijenka). Gorivo (žuto) s nagnutom slobodnom površinom. Ubrzanje kočenja pokazano strelicom lijevo.</desc>
  <defs>
    <marker id="u04fak_u4akDim" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#b7600c"/></marker>
    <marker id="u04fak_u4akDimL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L8,4 z" fill="#b7600c"/></marker>
    <marker id="u04fak_u4akArR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#c0392b"/></marker>
    <marker id="u04fak_u4akArRL" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#c0392b"/></marker>
    <linearGradient id="u04fak_u4akfuel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
    <pattern id="u04fak_u4akh" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.8"/>
    </pattern>
  </defs>

  <rect width="720" height="380" fill="#f4f7fb" rx="8"/>

  <!-- Naslov -->
  <text x="360" y="28" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2e42" text-anchor="middle">Nagib goriva u autocisterni pri kočenju</text>
  <text x="360" y="46" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#3a5a7a" text-anchor="middle">L = 1,2 m  ·  h₀ = 0,45 m  ·  a = 3,8 m/s²</text>

  <!--
    Cisterna: unutarnja x=120..600, y=70..310
    Visina=240px, L=1,2m → scale_x=400/1.2=333 px/m
    scale_y: max razina h_pred=0.683m, unutar 240px → 0.683/0.8*240=204.9px
    h₀=0.45m → 0.45/0.8*240=135px od dna → y_h0=310-135=175
    h_pred=0.683m → 0.683/0.8*240=204.9px → y_pred=310-205=105
    h_straz=0.217m → 0.217/0.8*240=65.1px → y_straz=310-65=245
    Δh=0.466m → 0.466/0.8*240=139.8px → y_span=140px
  -->

  <!-- Stijenke cisterne -->
  <!-- Lijeva stijenka (prednja pri kočenju ulijevo) -->
  <rect x="104" y="68" width="18" height="244" fill="url(#u04fak_u4akh)" stroke="#4a5a68" stroke-width="1.8"/>
  <!-- Desna stijenka (stražnja) -->
  <rect x="598" y="68" width="18" height="244" fill="url(#u04fak_u4akh)" stroke="#4a5a68" stroke-width="1.8"/>
  <!-- Dno -->
  <rect x="104" y="308" width="512" height="18" fill="url(#u04fak_u4akh)" stroke="#4a5a68" stroke-width="1.8"/>
  <!-- Vrh (tanka linija cisterne) -->
  <rect x="104" y="68" width="512" height="8" fill="url(#u04fak_u4akh)" stroke="#4a5a68" stroke-width="1.4"/>

  <!-- Gorivo (trapez): lijevo visoko (y=105), desno nisko (y=245), dno y=308 -->
  <polygon points="122,105 598,245 598,308 122,308" fill="url(#u04fak_u4akfuel)" opacity="0.90"/>
  <!-- Slobodna površina goriva -->
  <line x1="122" y1="105" x2="598" y2="245" stroke="#c8860a" stroke-width="2.6"/>

  <!-- Mirna razina (h₀, y=175) -->
  <line x1="122" y1="175" x2="598" y2="175" stroke="#7a8a96" stroke-width="1.5" stroke-dasharray="10,6"/>
  <text x="605" y="179" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#7a8a96">h₀ = 0,45 m</text>

  <!-- Ubrzanje kočenja – strelica lijevo -->
  <line x1="310" y1="50" x2="228" y2="50" stroke="#c0392b" stroke-width="3.2" marker-end="url(#u04fak_u4akArRL)"/>
  <text x="318" y="55" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#c0392b">a = 3,8 m/s² (kočenje)</text>

  <!-- Kota h_pred – lijeva stijenka -->
  <!-- h_pred od y=105 (razina) do y=308 (dno) = 203px -->
  <line x1="95" y1="105" x2="101" y2="105" stroke="#b7600c" stroke-width="1.3"/>
  <line x1="95" y1="308" x2="101" y2="308" stroke="#b7600c" stroke-width="1.3"/>
  <line x1="98" y1="107" x2="98" y2="306" stroke="#b7600c" stroke-width="1.6" marker-start="url(#u04fak_u4akDimL)" marker-end="url(#u04fak_u4akDim)"/>
  <text x="87" y="200" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#b7600c" text-anchor="end">h_p</text>
  <text x="87" y="215" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#b7600c" text-anchor="end">0,683 m</text>

  <!-- Kota h_straz – desna stijenka -->
  <!-- h_straz od y=245 do y=308 = 63px -->
  <line x1="619" y1="245" x2="625" y2="245" stroke="#b7600c" stroke-width="1.3"/>
  <line x1="619" y1="308" x2="625" y2="308" stroke="#b7600c" stroke-width="1.3"/>
  <line x1="622" y1="247" x2="622" y2="306" stroke="#b7600c" stroke-width="1.6" marker-start="url(#u04fak_u4akDimL)" marker-end="url(#u04fak_u4akDim)"/>
  <text x="630" y="274" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#b7600c">h_s</text>
  <text x="630" y="288" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#b7600c">0,217 m</text>

  <!-- Kota Δh (ukupna, naznačena na suprotnoj strani) -->
  <!-- od y=105 do y=245 = 140px, na lijevoj strani naznaka -->
  <line x1="60" y1="105" x2="66" y2="105" stroke="#c0392b" stroke-width="1.3"/>
  <line x1="60" y1="245" x2="66" y2="245" stroke="#c0392b" stroke-width="1.3"/>
  <line x1="63" y1="107" x2="63" y2="243" stroke="#c0392b" stroke-width="1.8" marker-start="url(#u04fak_u4akArRL)" marker-end="url(#u04fak_u4akArR)"/>
  <text x="52" y="172" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#c0392b" text-anchor="end">Δh</text>
  <text x="52" y="185" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#c0392b" text-anchor="end">≈0,47 m</text>

  <!-- Kota L (dno) -->
  <line x1="122" y1="332" x2="122" y2="338" stroke="#b7600c" stroke-width="1.3"/>
  <line x1="598" y1="332" x2="598" y2="338" stroke="#b7600c" stroke-width="1.3"/>
  <line x1="124" y1="335" x2="596" y2="335" stroke="#b7600c" stroke-width="1.5" marker-start="url(#u04fak_u4akDimL)" marker-end="url(#u04fak_u4akDim)"/>
  <text x="360" y="350" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#b7600c" text-anchor="middle">L = 1,2 m</text>

  <!-- Formula box -->
  <rect x="120" y="356" width="480" height="18" rx="5" fill="white" stroke="#c49a0a" stroke-width="1.2"/>
  <text x="360" y="369" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a2530" text-anchor="middle">Δh = aL/g = 3,8·1,2/9,81 ≈ 0,465 m  ·  h_p = h₀+Δh/2 = 0,683 m  ·  h_s = h₀−Δh/2 = 0,217 m</text>
</svg>