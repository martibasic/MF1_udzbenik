  <text x="785" y="123" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">Ključne jednadžbe</text>
  <text x="785" y="156" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">Razlika razina slobodne površine</text>
  <text x="785" y="180" font-family="Arial, Liberation Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#263746">Δh = a·L / g</text>
  <text x="785" y="200" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" text-anchor="middle" fill="#263746">= 3,8 · 1,20 / 9,81</text>
  <text x="785" y="218" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#263746">≈ 0,465 m</text>
  <text x="785" y="252" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">Visina uz prednju stijenku</text>
  <text x="785" y="274" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">pr</tspan> = h₀ + Δh/2</text>
  <text x="785" y="294" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">= 0,682 m</text>
  <text x="785" y="326" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">Visina uz stražnju stijenku</text>
  <text x="785" y="348" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">str</tspan> = h₀ − Δh/2</text>
  <text x="785" y="368" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">= 0,218 m</text>
  <text x="785" y="398" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#263746">tanθ = a/g ≈ 0,387  →  θ ≈ 21,2°</text>
  <text x="785" y="414" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#263746">srednja razina h₀ ostaje sačuvana</text>
  <text x="785" y="450" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#263746">PROVJERA GRANICA</text>
  <text x="710" y="470" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">h</tspan>
