<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-labelledby="u08frb_title u08frb_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="u08frb_title">Punjenje retencijskog bazena s dva dotoka i jednim ispustom</title>
  <desc id="u08frb_desc">Lijevo: presjek otvorenog retencijskog bazena tlocrtne povrsine A_b = 120 m2 s pocetnom razinom h_0 = 1,20 m i ciljnom razinom h_0 + 0,50 m = 1,70 m. Dva ulazna kanala Q_ul,1 = 0,35 m3/s i Q_ul,2 = 0,20 m3/s te ispust Q_iz = 0,18 m3/s. Plava strelica dh/dt pokazuje porast razine 18,5 cm/min. Desno: bilanca mase, brzina porasta razine, vrijeme za delta h = 0,50 m i sazetak rezultata.</desc>

  <defs>
    <linearGradient id="u08frb_voda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aed6f1" />
      <stop offset="100%" stop-color="#5b9ec9" />
    </linearGradient>
    <linearGradient id="u08frb_vodaAcc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe7f4" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#aed6f1" stop-opacity="0.55" />
    </linearGradient>
    <pattern id="u08frb_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.1" />
    </pattern>

    <!-- Strelice protoka -->
    <marker id="u08frb_aR" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#c0392b" />
    </marker>
    <marker id="u08frb_aG" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1e8449" />
    </marker>
    <!-- Strelica za dh/dt (plava) -->
    <marker id="u08frb_aB" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1565c0" />
    </marker>
    <!-- Kote (smedje) -->
    <marker id="u08frb_aDim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u08frb_aDimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
  </defs>

  <!-- Pozadina -->
  <rect width="1080" height="520" fill="#ffffff" />
  <!-- ===================== LIJEVI PANEL (presjek bazena) =====================
       Skala vertikalna: 1 m = 110 px.
       Dno bazena (interno): y = 420
       h_0 = 1,20 m -> top vode y = 420 - 132 = 288
       h_max = h_0 + 0,50 = 1,70 m -> y = 420 - 187 = 233
       Bazen interior: x = 110..550 (sirina 440 px), stjenke debljine 18 px.
  ============================================================================= -->

  <!-- Stjenke bazena (concrete - hatched) -->
  <rect x="92" y="130" width="18" height="310" fill="url(#u08frb_hatch)" stroke="#3a4a56" stroke-width="1.3" />
  <rect x="550" y="130" width="18" height="310" fill="url(#u08frb_hatch)" stroke="#3a4a56" stroke-width="1.3" />
  <rect x="92" y="420" width="476" height="20" fill="url(#u08frb_hatch)" stroke="#3a4a56" stroke-width="1.3" />

  <!-- Voda u bazenu na pocetnoj razini h_0 (y_top = 288, dno y = 420) -->
  <rect x="110" y="288" width="440" height="132" fill="url(#u08frb_voda)" />
  <!-- Predvidena zona prirasta delta h = 0,50 m (svjetlija plava, polutransparent) -->
  <rect x="110" y="233" width="440" height="55" fill="url(#u08frb_vodaAcc)" />

  <!-- Slobodna povrsina h_0 -->
  <line x1="110" y1="288" x2="550" y2="288" stroke="#1565c0" stroke-width="2.2" />
  <!-- Ciljna razina h_0 + 0,50 (isprekidana) -->
  <line x1="110" y1="233" x2="550" y2="233" stroke="#1565c0" stroke-width="1.6" stroke-dasharray="8,5" />

  <!-- ===== Ulazni kanal 1 (gornji, veci protok Q_ul,1 = 0,35) =====
       Kanal: x = 16..110, y = 158..194. Ulijeva odozgo u bazen. -->
  <rect x="16" y="158" width="94" height="36" fill="#eef3f7" stroke="#3a4a56" stroke-width="1.3" />
  <!-- Voda u kanalu 1 -->
  <rect x="16" y="170" width="94" height="24" fill="url(#u08frb_voda)" />
  <!-- Port overlay vode kroz lijevu stjenku bazena -->
  <rect x="110" y="170" width="18" height="24" fill="url(#u08frb_voda)" />
  <!-- Mlaz iz izlaza kanala 1 prema povrsini bazena (curek) -->
  <path d="M122,194 Q122,220 122,248 L120,260 L124,272 L122,288" fill="none" stroke="#5b9ec9" stroke-width="2.4" />
  <!-- Strelica protoka u kanalu 1 (crvena = ulazni protok) - duzina ~76 px -->
  <line x1="22" y1="182" x2="98" y2="182" stroke="#c0392b" stroke-width="2.8" marker-end="url(#u08frb_aR)" />
  <!-- Labela kanala 1 -->
  <!-- ===== Ulazni kanal 2 (donji, manji protok Q_ul,2 = 0,20) =====
       Kanal: x = 16..110, y = 244..272. Cijev manje visine - hidraulicki manji presjek. -->
  <rect x="16" y="244" width="94" height="28" fill="#eef3f7" stroke="#3a4a56" stroke-width="1.3" />
  <rect x="16" y="252" width="94" height="20" fill="url(#u08frb_voda)" />
  <rect x="110" y="252" width="18" height="20" fill="url(#u08frb_voda)" />
  <!-- Mlaz kraci jer je razina blize -->
  <path d="M122,272 Q122,278 124,286 L122,288" fill="none" stroke="#5b9ec9" stroke-width="2" />
  <!-- Strelica protoka kanala 2 (crvena) - proporcionalno kraca (0,20/0,35 ~ 0,57 -> 44 px) -->
  <line x1="54" y1="262" x2="98" y2="262" stroke="#c0392b" stroke-width="2.6" marker-end="url(#u08frb_aR)" />
  <!-- Labela kanala 2 - smjestena u prostor IZMEDU dvaju kanala (y=210..240) -->
  <!-- ===== Ispust gravitacijski (desno) =====
       Cijev: x = 568..668, y = 376..404. Izlazi prema desno. -->
  <rect x="568" y="376" width="100" height="28" fill="#eef3f7" stroke="#3a4a56" stroke-width="1.3" />
  <rect x="568" y="384" width="100" height="20" fill="url(#u08frb_voda)" />
  <!-- Port overlay kroz desnu stjenku bazena -->
  <rect x="550" y="384" width="18" height="20" fill="url(#u08frb_voda)" />
  <!-- Strelica izlaznog protoka (zelena = izlaz) - duzina proporcionalno manja (0,18 ~ 36 px) -->
  <line x1="676" y1="394" x2="712" y2="394" stroke="#1e8449" stroke-width="2.8" marker-end="url(#u08frb_aG)" />
  <!-- Labele ispusta -->
  <!-- ===== Kontrolni volumen (KV) - isprekidana smedja granica =====
       Pokriva vodu u bazenu, ali izvan stjenki da se ne mijesa s hatched-om. -->
  <!-- ===== Strelica dh/dt (plava, vertikalna od h_0 do h_max) =====
       Os strelice na sredini bazena x = 330. Y od 285 (tik iznad povrsine) do 237. -->
  <line x1="330" y1="285" x2="330" y2="237" stroke="#1565c0" stroke-width="2.6" marker-end="url(#u08frb_aB)" />
  <!-- Info kutija pored strelice -->
  <rect x="342" y="244" width="130" height="34" rx="5" fill="#eaf3fb" stroke="#1565c0" stroke-width="1.2" />
  <!-- Labela "voda" u donjem dijelu bazena -->
  <!-- ===== Razine - labele desno od bazena ===== -->
  <line x1="550" y1="288" x2="580" y2="288" stroke="#5a6a78" stroke-width="0.7" stroke-dasharray="3,3" />
  <line x1="550" y1="233" x2="580" y2="233" stroke="#5a6a78" stroke-width="0.7" stroke-dasharray="3,3" />
  <!-- ===== Kota vertikalna h_0 (lijevo od bazena) =====
       Dim os: x = 74. Geometrija: top vode y=288, dno y=420. -->
  <!-- ===== Kota vertikalna delta h (desno od labela razina) =====
       Dim os: x = 712. Y: 233..288. -->
  <!-- ===== Kota horizontalna A_b sirina bazena (ispod dna) =====
       Dim os: y = 468. Geometrija interior: x = 110..550. -->
  <!-- Vertikalni separator panela -->
  <line x1="788" y1="40" x2="788" y2="480" stroke="#dde3ea" stroke-width="1.2" />

  <!-- ===================== DESNI PANEL - 4 koraka + REZULTATI =====================
       Panel x = 800..1056. Korak blokovi visine 76 px s ljevim accent barom u boji. -->

  <!-- Header bar formula panela -->
  <rect x="800" y="40" width="256" height="32" rx="6" fill="#1565c0" />
  <!-- ===== Korak 1: Bilanca mase (plava) ===== -->
  <rect x="800" y="82" width="256" height="86" rx="7" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="800" y="82" width="6" height="86" rx="3" fill="#1565c0" />
  <!-- ===== Korak 2: Brzina porasta razine (plava) ===== -->
  <rect x="800" y="178" width="256" height="86" rx="7" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="800" y="178" width="6" height="86" rx="3" fill="#1565c0" />
  <!-- ===== Korak 3: Vrijeme za delta h = 0,50 m (smedja - dimenzijska/vremenska) ===== -->
  <rect x="800" y="274" width="256" height="86" rx="7" fill="#fdf8f2" stroke="#ecd9c2" stroke-width="1.2" />
  <!-- ===== Korak 4: Zakljucak (zelena) ===== -->
  <rect x="800" y="370" width="256" height="62" rx="7" fill="#f1f9f3" stroke="#cce7d4" stroke-width="1.2" />
  <rect x="800" y="370" width="6" height="62" rx="3" fill="#1e8449" />
  <!-- ===== REZULTATI badge ===== -->
  <rect x="800" y="442" width="256" height="42" rx="8" fill="#e8f5e9" stroke="#1e8449" stroke-width="1.4" />
  <rect x="102" y="220" width="456" height="208" fill="none" stroke="#b7600c" stroke-width="1.4" stroke-dasharray="9,5" />
  <line x1="110" y1="288" x2="74" y2="288" stroke="#b7600c" stroke-width="0.7" />
  <line x1="110" y1="420" x2="74" y2="420" stroke="#b7600c" stroke-width="0.7" />
  <line x1="68" y1="288" x2="80" y2="288" stroke="#b7600c" stroke-width="1.2" />
  <line x1="68" y1="420" x2="80" y2="420" stroke="#b7600c" stroke-width="1.2" />
  <line x1="74" y1="292" x2="74" y2="416" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u08frb_aDimL)" marker-end="url(#u08frb_aDim)" />
  <line x1="660" y1="233" x2="718" y2="233" stroke="#b7600c" stroke-width="0.7" />
  <line x1="660" y1="288" x2="718" y2="288" stroke="#b7600c" stroke-width="0.7" />
  <line x1="706" y1="233" x2="718" y2="233" stroke="#b7600c" stroke-width="1.2" />
  <line x1="706" y1="288" x2="718" y2="288" stroke="#b7600c" stroke-width="1.2" />
  <line x1="712" y1="237" x2="712" y2="284" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u08frb_aDimL)" marker-end="url(#u08frb_aDim)" />
  <line x1="110" y1="440" x2="110" y2="472" stroke="#b7600c" stroke-width="0.7" />
  <line x1="550" y1="440" x2="550" y2="472" stroke="#b7600c" stroke-width="0.7" />
  <line x1="110" y1="474" x2="110" y2="462" stroke="#b7600c" stroke-width="1.2" />
  <line x1="550" y1="474" x2="550" y2="462" stroke="#b7600c" stroke-width="1.2" />
  <line x1="114" y1="468" x2="546" y2="468" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u08frb_aDimL)" marker-end="url(#u08frb_aDim)" />
  <rect x="800" y="274" width="6" height="86" rx="3" fill="#b7600c" />
  <text x="20" y="150" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#c0392b"><tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">ul,1</tspan> = 0,35 m³/s</text>

  <text x="14" y="236" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#c0392b"><tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">ul,2</tspan> = 0,20 m³/s</text>

  <text x="676" y="372" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1e8449"><tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">iz</tspan> = 0,18 m³/s</text>
  <text x="676" y="418" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a6a78">(gravitacijski ispust)</text>

  <text x="407" y="260" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">d<tspan font-style="italic">h</tspan>/d<tspan font-style="italic">t</tspan></text>
  <text x="407" y="274" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#1565c0">≈ 18,5 cm/min</text>

  <text x="200" y="380" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#0d47a1">voda</text>

  <text x="586" y="292" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1565c0"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">0</tspan> = 1,20 m</text>
  <text x="586" y="229" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1565c0"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">0</tspan> + Δ<tspan font-style="italic">h</tspan> = 1,70 m</text>

  <text x="928" y="61" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Bilanca mase · KV bazena</text>

  <text x="816" y="103" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1565c0">1. Bilanca mase (nestlačiva)</text>
  <text x="928" y="125" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" text-anchor="middle" fill="#1a2530">d<tspan font-style="italic">V</tspan>/d<tspan font-style="italic">t</tspan> = <tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">ul,1</tspan> + <tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">ul,2</tspan> − <tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="0.7em">iz</tspan></text>
  <text x="928" y="143" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1a2530">= 0,35 + 0,20 − 0,18</text>
  <text x="928" y="161" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">= 0,37 m³/s  (neto dotok)</text>

  <text x="816" y="199" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1565c0">2. Brzina porasta razine</text>
  <text x="928" y="221" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" text-anchor="middle" fill="#1a2530">d<tspan font-style="italic">h</tspan>/d<tspan font-style="italic">t</tspan> = (d<tspan font-style="italic">V</tspan>/d<tspan font-style="italic">t</tspan>) / <tspan font-style="italic">A</tspan><tspan baseline-shift="sub" font-size="0.7em">b</tspan> = 0,37 / 120</text>
  <text x="928" y="240" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1a2530">= 3,08 · 10⁻³ m/s</text>
  <text x="928" y="258" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">≈ 18,5 cm/min</text>

  <text x="928" y="317" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">t</tspan> = Δ<tspan font-style="italic">h</tspan> / (d<tspan font-style="italic">h</tspan>/d<tspan font-style="italic">t</tspan>)</text>
  <text x="928" y="335" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1a2530">= 0,50 / 3,08 · 10⁻³</text>
  <text x="816" y="390" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1e8449">4. Zaključak</text>
  <text x="816" y="408" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a2530">Ulaz (0,55) &gt; izlaz (0,18) → razina raste.</text>
  <text x="816" y="424" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a2530">Treba osigurati nadvišenje iznad 1,70 m.</text>

  <text x="928" y="457" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#5a6a78">REZULTATI</text>
  <text x="864" y="476" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1565c0">d<tspan font-style="italic">h</tspan>/d<tspan font-style="italic">t</tspan> ≈ 18,5 cm/min</text>
  <text x="330" y="215" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#b7600c">kontrolni volumen (KV)</text>

  <text x="56" y="354" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">0</tspan></text>
  <text x="56.0" y="370.0" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#b7600c">= 1,20 m</text>

  <text x="722" y="258" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#b7600c">Δ<tspan font-style="italic">h</tspan></text>
  <text x="722.0" y="274.0" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#b7600c">= 0,50 m</text>

  <text x="330" y="490" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">A</tspan><tspan baseline-shift="sub" font-size="0.7em">b</tspan> = 120 m²  (tlocrtna površina bazena)</text>

  <text x="816" y="295" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#b7600c">3. Vrijeme za Δ<tspan font-style="italic">h</tspan> = 0,50 m</text>
  <text x="928" y="354" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#b7600c">≈ 162 s ≈ 2,7 min</text>

  <text x="996" y="476" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">t</tspan> ≈ 2,7 min</text>

</svg>