    <line x1="850" y1="359" x2="914" y2="359" stroke="#356b83" stroke-width="2.2" marker-end="url(#u08fup_fix_green)" />
    <text x="765" y="353" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="middle">ventilirana komora</text>
    <text x="765" y="376" font-family="Arial, Liberation Sans, sans-serif" font-size="10" fill="#263746" text-anchor="middle">ulaz → izlaz zraka</text>
    <text x="765" y="432" font-family="Arial, Liberation Sans, sans-serif" font-size="10" fill="#263746" text-anchor="middle">Krute stijenke imaju dva otvorena priključka.</text>
    <text x="301" y="327" font-family="Arial, Liberation Sans, sans-serif" font-size="10" fill="#263746" text-anchor="middle">apstraktni uređaj; nije kruta ovojnica</text>
  </g>
</svg>
