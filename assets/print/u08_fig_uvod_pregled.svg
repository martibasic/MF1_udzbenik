<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="u08fup_title u08fup_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:960px;height:auto;">
  <title id="u08fup_title">Kontrolni volumen i bilanca mase</title>
  <desc id="u08fup_desc">Lijevo apstraktni uređaj s ulazom, dvama izlazima i akumulacijom; narančasta isprekidana granica kontrolna je ploha, ne kruta stijenka. Normale su vanjske. Desno su masene jednadžbe, a dolje ventilirana komora s dva stvarna otvorena priključka. Strelice su tokovi, a oznaka akumulacije nije brzina fluida.</desc>
