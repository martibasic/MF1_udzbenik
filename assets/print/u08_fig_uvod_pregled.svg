  <text x="46" y="56" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Kontrolni volumen — odabrani dio prostora</text>
  <text x="46" y="75" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#5a6a78">umjesto praćenja čestice, prati se ulaz, izlaz i akumulacija mase</text>
  <text x="300" y="160" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" font-style="italic" fill="#5a6a78">bilo koji proces / uređaj</text>
  <text x="300" y="200" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#e67e22">akumulacija</text>
  <text x="300" y="222" font-family="'Segoe UI',Arial,sans-serif" font-size="15" text-anchor="middle" fill="#e67e22">d<tspan font-style="italic">m</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">KV</tspan> / d<tspan font-style="italic">t</tspan>
  </text>
  <text x="64" y="208" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" fill="#c0392b">
    <tspan font-weight="700">ṁ</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">ul</tspan>, ρ<tspan baseline-shift="sub" font-size="0.7em">1</tspan>, <tspan font-style="italic">A</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">1</tspan>, <tspan font-style="italic">v</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">1</tspan>
  </text>
  <text x="132" y="254" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="end" font-style="italic" fill="#5a6a78">n̂</text>
  <text x="476" y="190" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#1e8449">
    <tspan font-weight="700">ṁ</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">iz,1</tspan>
  </text>
  <text x="470" y="234" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#5a6a78">n̂</text>
  <text x="476" y="300" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#1e8449">
    <tspan font-weight="700">ṁ</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">iz,2</tspan>
  </text>
  <text x="470" y="344" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#5a6a78">n̂</text>
  <text x="298" y="423" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1a2530">
    Σ <tspan font-style="italic">ṁ</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">ul</tspan>
    − Σ <tspan font-style="italic">ṁ</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">iz</tspan>
    = d<tspan font-style="italic">m</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">KV</tspan> / d<tspan font-style="italic">t</tspan>
  </text>
  <text x="764" y="48" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">Ključne jednadžbe poglavlja</text>
  <text x="764" y="80" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#5a6a78">opća masena bilanca (nestacionarno)</text>
  <text x="764" y="103" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a2530">
    Σ <tspan font-style="italic">ṁ</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">ul</tspan>
    − Σ <tspan font-style="italic">ṁ</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">iz</tspan>
    = d<tspan font-style="italic">m</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">KV</tspan> / d<tspan font-style="italic">t</tspan>
  </text>
  <text x="764" y="138" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#5a6a78">stacionarno strujanje (bez akumulacije)</text>
  <text x="764" y="161" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a2530">
    Σ <tspan font-style="italic">ṁ</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">ul</tspan>
    = Σ <tspan font-style="italic">ṁ</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">iz</tspan>
    ,   <tspan font-style="italic">ṁ</tspan> = ρ <tspan font-style="italic">Q</tspan> = ρ <tspan font-style="italic">A v</tspan>
  </text>
  <text x="764" y="196" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#5a6a78">nestlačiv fluid, jedan ulaz i jedan izlaz</text>
  <text x="764" y="220" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1565c0">
    <tspan font-style="italic">A</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">1</tspan>
    <tspan font-style="italic">v</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">1</tspan>
    = <tspan font-style="italic">A</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">2</tspan>
    <tspan font-style="italic">v</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">2</tspan>
  </text>
  <text x="764" y="246" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">kontinuitet je rubni slučaj šire masene bilance</text>
  <text x="764" y="295" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e8449">Gdje se KV i kontinuitet primjenjuju</text>
  <text x="426" y="161" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#b7600c">KV</text>
  <text x="156" y="386" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" fill="#b7600c">kontrolna ploha KP (granica)</text>
