    <text x="765" y="353" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#3a4a56" text-anchor="middle">ventilirana komora</text>
    <text x="765" y="376" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#3a4a56" text-anchor="middle">ulaz → izlaz zraka</text>
    <text x="765" y="432" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#3a4a56" text-anchor="middle">Krute stijenke imaju dva otvorena priključka.</text>
    <text x="301" y="327" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#3a4a56" text-anchor="middle">apstraktni uređaj; nije kruta ovojnica</text>
  </g>
