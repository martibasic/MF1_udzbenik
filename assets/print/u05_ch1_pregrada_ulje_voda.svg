<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 449 326" role="img" aria-labelledby="u05c1puv_title u05c1puv_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:449px;height:auto;">
  <title id="u05c1puv_title">Zglobna pregrada s uljem iznad vode</title>
  <desc id="u05c1puv_desc">Okomita pregrada širine b = 1,40 m sa zglobom A na slobodnoj površini ulja (h-u = 1,00 m, rho-u = 820 kg/m3) iznad vode (h-v = 1,80 m, rho-v = 1000 kg/m3) i vodoravnom spojnicom na donjem rubu, u mjerilu 80 px/m. Dijagram tlaka je kontinuiran: na razdjelnici iznosi rho-u g h-u, a u vodi raste strmije do dna. Sile F-1 i F-2 djeluju na pregradu u težištima svojih dijelova dijagrama, centar tlaka h-CP označen je točkom; reakcije spojnice F_s i zgloba R-A usmjerene su suprotno. Duljine strelica nisu u mjerilu.</desc>
