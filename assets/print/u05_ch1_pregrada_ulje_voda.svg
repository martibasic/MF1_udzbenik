<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 559" role="img" aria-labelledby="u05c1puv_title u05c1puv_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u05c1puv_title">Zglobna pregrada s uljem iznad vode</title>
  <desc id="u05c1puv_desc">Vertikalna zglobna pregrada visine 2,80 m, širine 1,40 m. Zglob A na slobodnoj površini ulja (rho_o = 820 kg/m3, h_o = 1,00 m), spojnica D na donjem rubu drži pregradu uz pritisak vode (rho_w = 1000 kg/m3, h_w = 1,80 m). Rezultat: F1 = 5,63 kN, F2 = 42,52 kN, F = 48,15 kN, y_CP = 1,89 m, T = 32,58 kN, R_A = 15,57 kN.</desc>
  <defs>
    <pattern id="u05c1puv_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#dcebf1" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.1" />
    </pattern>
    <marker id="u05c1puv_aB" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#356b83" />
    </marker>
    <marker id="u05c1puv_aG" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#356b83" />
    </marker>
    <marker id="u05c1puv_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#657781" />
    </marker>
    <marker id="u05c1puv_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#657781" />
    </marker>
  </defs>
  <rect x="60" y="304" width="200" height="14" fill="url(#u05c1puv_hatch)" stroke="#3a4a56" stroke-width="1.2" />
  <rect x="80" y="80" width="160" height="80" fill="#eadfc5" />
  <rect x="80" y="160" width="160" height="144" fill="#dcebf1" />
  <rect x="74" y="74" width="6" height="234" fill="#3a4a56" stroke="#3a4a56" stroke-width="0.8" />
  <line x1="80" y1="80" x2="240" y2="80" stroke="#356b83" stroke-width="2" />
  <line x1="80" y1="160" x2="240" y2="160" stroke="#356b83" stroke-width="1.3" stroke-dasharray="6,4" />
  <rect x="240" y="76" width="6" height="232" fill="#d7dee3" stroke="#3a4a56" stroke-width="1" />
  <circle cx="243" cy="80" r="6" fill="#3a4a56" />
  <circle cx="243" cy="80" r="3" fill="#ffffff" />
  <circle cx="243" cy="304" r="6" fill="#3a4a56" />
  <circle cx="243" cy="304" r="3" fill="#ffffff" />
  <polygon points="246,80 246,160 271,160" fill="#eadfc5" fill-opacity="0.85" stroke="#356b83" stroke-width="1.2" />
  <polygon points="246,160 271,160 326,304 246,304" fill="#dcebf1" fill-opacity="0.80" stroke="#356b83" stroke-width="1.2" />
  <line x1="271" y1="160" x2="326" y2="304" stroke="#356b83" stroke-width="1.6" />
  <line x1="246" y1="80" x2="271" y2="160" stroke="#356b83" stroke-width="1.6" />
  <line x1="246" y1="133" x2="281" y2="133" stroke="#356b83" stroke-width="2.4" marker-end="url(#u05c1puv_aB)" />
  <line x1="246" y1="245" x2="346" y2="245" stroke="#356b83" stroke-width="2.8" marker-end="url(#u05c1puv_aB)" />
  <circle cx="243" cy="231" r="3.2" fill="#356b83" />
  <line x1="246" y1="231" x2="358" y2="231" stroke="#356b83" stroke-width="0.7" stroke-dasharray="3,3" />
  <line x1="240" y1="304" x2="180" y2="304" stroke="#356b83" stroke-width="2.6" marker-end="url(#u05c1puv_aG)" />
  <line x1="240" y1="80" x2="200" y2="80" stroke="#356b83" stroke-width="2.4" marker-end="url(#u05c1puv_aG)" />
  <line x1="56" y1="365" x2="86" y2="365" stroke="#356b83" stroke-width="2.4" marker-end="url(#u05c1puv_aB)" />
  <line x1="56" y1="385" x2="86" y2="385" stroke="#356b83" stroke-width="2.4" marker-end="url(#u05c1puv_aG)" />
  <circle cx="71" cy="404" r="3.2" fill="#356b83" />
  <line x1="74" y1="80" x2="50" y2="80" stroke="#657781" stroke-width="0.7" />
  <line x1="74" y1="160" x2="50" y2="160" stroke="#657781" stroke-width="0.7" />
  <line x1="50" y1="83" x2="50" y2="157" stroke="#657781" stroke-width="1.3" marker-start="url(#u05c1puv_dimL)" marker-end="url(#u05c1puv_dim)" />
  <line x1="74" y1="160" x2="50" y2="160" stroke="#657781" stroke-width="0.7" />
  <line x1="74" y1="304" x2="50" y2="304" stroke="#657781" stroke-width="0.7" />
  <line x1="50" y1="163" x2="50" y2="301" stroke="#657781" stroke-width="1.3" marker-start="url(#u05c1puv_dimL)" marker-end="url(#u05c1puv_dim)" />
  <line x1="246" y1="80" x2="424" y2="80" stroke="#657781" stroke-width="0.7" stroke-dasharray="2,3" />
  <line x1="246" y1="304" x2="424" y2="304" stroke="#657781" stroke-width="0.7" stroke-dasharray="2,3" />
  <line x1="420" y1="83" x2="420" y2="301" stroke="#657781" stroke-width="1.3" marker-start="url(#u05c1puv_dimL)" marker-end="url(#u05c1puv_dim)" />
  <text x="40" y="44" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" fill="#263746">Zglobna pregrada</text>
  <text x="40" y="60" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746">b = 1,40 m (širina pregrade okomito na ravninu skice)</text>
  <text x="252" y="70" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" fill="#263746" transform="translate(0 22)">A</text>
  <text x="263" y="70" font-family="Arial, Liberation Sans, sans-serif" font-size="9.5" fill="#263746" transform="translate(0 22)">(zglob)</text>
  <text x="252" y="324" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" fill="#263746">D</text>
  <text x="263" y="324" font-family="Arial, Liberation Sans, sans-serif" font-size="9.5" fill="#263746">(spojnica)</text>
  <text x="276" y="156" font-family="Arial, Liberation Sans, sans-serif" font-size="10" fill="#263746">
    <tspan font-style="italic">p</tspan>
    <tspan baseline-shift="sub" font-size="0.75em">1</tspan> = 8,04 kPa</text>
  <text x="332" y="304" font-family="Arial, Liberation Sans, sans-serif" font-size="10" fill="#263746">
    <tspan font-style="italic">p</tspan>
    <tspan baseline-shift="sub" font-size="0.75em">D</tspan> = 25,70 kPa</text>
  <text x="160" y="122" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="#263746">ulje</text>
  <text x="160" y="138" font-family="Arial, Liberation Sans, sans-serif" font-size="10" text-anchor="middle" fill="#263746">ρ<tspan baseline-shift="sub" font-size="0.75em">o</tspan> = 820 kg/m³</text>
  <text x="160" y="228" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="#263746">voda</text>
  <text x="160" y="244" font-family="Arial, Liberation Sans, sans-serif" font-size="10" text-anchor="middle" fill="#263746">ρ<tspan baseline-shift="sub" font-size="0.75em">w</tspan> = 1000 kg/m³</text>
  <text x="285" y="129" font-family="Arial, Liberation Sans, sans-serif" font-size="12" fill="#263746">
    <tspan font-style="italic" font-weight="700">F</tspan>
    <tspan baseline-shift="sub" font-size="0.75em" font-weight="700">1</tspan> = 5,63 kN</text>
  <text x="350" y="241" font-family="Arial, Liberation Sans, sans-serif" font-size="12" fill="#263746" transform="translate(0 10)">
    <tspan font-style="italic" font-weight="700">F</tspan>
    <tspan baseline-shift="sub" font-size="0.75em" font-weight="700">2</tspan> = 42,52 kN</text>
  <text x="360" y="227" font-family="Arial, Liberation Sans, sans-serif" font-size="10" fill="#263746">
    <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.75em">CP</tspan> = 1,89 m</text>
  <text x="174" y="300" font-family="Arial, Liberation Sans, sans-serif" font-size="12" text-anchor="end" fill="#263746">
    <tspan font-style="italic" font-weight="700">T</tspan> = 32,58 kN</text>
  <text x="194" y="76" font-family="Arial, Liberation Sans, sans-serif" font-size="12" text-anchor="end" fill="#263746">
    <tspan font-style="italic" font-weight="700">R</tspan>
    <tspan baseline-shift="sub" font-size="0.75em" font-weight="700">A</tspan> = 15,57 kN</text>
  <text x="92" y="369" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" fill="#263746">hidrostatska sila fluida (F<tspan baseline-shift="sub" font-size="0.75em">1</tspan>, F<tspan baseline-shift="sub" font-size="0.75em">2</tspan>)</text>
  <text x="92" y="389" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" fill="#263746">reakcija oslonca (T u spojnici, R<tspan baseline-shift="sub" font-size="0.75em">A</tspan> u zglobu)</text>
  <text x="92" y="408" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" fill="#263746">centar tlaka (h<tspan baseline-shift="sub" font-size="0.75em">CP</tspan>)</text>
  <text x="40" y="434" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" fill="#263746">Dijagram tlaka p(y) ima lom na granici ulje/voda</text>
  <text x="40" y="448" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" fill="#263746">(različiti nagibi: k<tspan baseline-shift="sub" font-size="0.75em">o</tspan> = 8,04 kPa/m, k<tspan baseline-shift="sub" font-size="0.75em">w</tspan> = 9,81 kPa/m).</text>
  <text x="40" y="470" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" fill="#263746">Strelice F<tspan baseline-shift="sub" font-size="0.75em">1</tspan>, F<tspan baseline-shift="sub" font-size="0.75em">2</tspan> djeluju u hvatištima — duljina je</text>
  <text x="40" y="484" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" fill="#263746" transform="translate(0 8)">simbolična (stvarni omjer F<tspan baseline-shift="sub" font-size="0.75em">2</tspan>/F<tspan baseline-shift="sub" font-size="0.75em">1</tspan> ≈ 7,5).</text>
  <text x="701" y="38" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">Rješenje — dvoslojni fluid (ulje + voda)</text>
  <text x="701" y="80" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">1. Sila na gornje uljno polje (trokut)</text>
  <text x="701" y="102" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.75em">1</tspan> = ½ ρ<tspan baseline-shift="sub" font-size="0.75em">o</tspan>
    <tspan font-style="italic">g</tspan>
    <tspan font-style="italic">b</tspan> h<tspan baseline-shift="sub" font-size="0.75em">o</tspan>² = ½·820·9,81·1,40·1,00²</text>
  <text x="701" y="124" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.75em">1</tspan> ≈ 5 631 N ≈ 5,63 kN  |  y<tspan baseline-shift="sub" font-size="0.75em">1</tspan> = ⅔ h<tspan baseline-shift="sub" font-size="0.75em">o</tspan> = 0,67 m</text>
  <text x="701" y="158" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746" transform="translate(0 8) ">2. Sila na donje vodeno polje (pravokutnik + trokut)</text>
  <text x="701" y="180" font-family="Arial, Liberation Sans, sans-serif" font-size="13" text-anchor="middle" fill="#263746" transform="translate(0 8) ">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.75em">2</tspan> = ρ<tspan baseline-shift="sub" font-size="0.75em">o</tspan>
    <tspan font-style="italic">g</tspan>
    <tspan font-style="italic">b</tspan> h<tspan baseline-shift="sub" font-size="0.75em">o</tspan> h<tspan baseline-shift="sub" font-size="0.75em">w</tspan> + ½ ρ<tspan baseline-shift="sub" font-size="0.75em">w</tspan>
    <tspan font-style="italic">g</tspan>
    <tspan font-style="italic">b</tspan> h<tspan baseline-shift="sub" font-size="0.75em">w</tspan>²</text>
  <text x="701" y="198" font-family="Arial, Liberation Sans, sans-serif" font-size="12" text-anchor="middle" fill="#263746" transform="translate(0 8) translate(0 8)">= 20 271 + 22 249 N</text>
  <text x="701" y="218" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 8) translate(0 9)">
    <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.75em">2</tspan> ≈ 42 520 N ≈ 42,52 kN  |  y<tspan baseline-shift="sub" font-size="0.75em">2</tspan> = 2,06 m</text>
  <text x="701" y="252" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746" transform="translate(0 17) translate(0 9)">3. Ukupna rezultanta i centar tlaka</text>
  <text x="701" y="274" font-family="Arial, Liberation Sans, sans-serif" font-size="13" text-anchor="middle" fill="#263746" transform="translate(0 17) translate(0 9)">
    <tspan font-style="italic">F</tspan> = <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.75em">1</tspan> + <tspan font-style="italic">F</tspan>
    <tspan baseline-shift="sub" font-size="0.75em">2</tspan> = 5,63 + 42,52 kN</text>
  <text x="701" y="294" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 17) translate(0 9)">
    <tspan font-style="italic">F</tspan> ≈ 48,15 kN</text>
  <text x="701" y="314" font-family="Arial, Liberation Sans, sans-serif" font-size="12" text-anchor="middle" fill="#263746" transform="translate(0 17) translate(0 9)">
    <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.75em">CP</tspan> = (F<tspan baseline-shift="sub" font-size="0.75em">1</tspan>·y<tspan baseline-shift="sub" font-size="0.75em">1</tspan> + F<tspan baseline-shift="sub" font-size="0.75em">2</tspan>·y<tspan baseline-shift="sub" font-size="0.75em">2</tspan>) / F ≈ 1,89 m</text>
  <text x="701" y="346" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746" transform="translate(0 29) translate(0 9)">4. Sila spojnice (moment oko zgloba A)</text>
  <text x="701" y="368" font-family="Arial, Liberation Sans, sans-serif" font-size="13" text-anchor="middle" fill="#263746" transform="translate(0 29) translate(0 9)">T = (F₁y₁ + F₂y₂)/H</text>
  <text x="701" y="388" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 29) translate(0 9)">
    <tspan font-style="italic">T</tspan> ≈ 32,58 kN</text>
  <text x="701" y="422" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746" transform="translate(0 31) translate(0 9)">5. Vodoravna reakcija zgloba (ravnoteža sila)</text>
  <text x="701" y="444" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 31) translate(0 9)">
    <tspan font-style="italic">R</tspan>
    <tspan baseline-shift="sub" font-size="0.75em">A</tspan> = <tspan font-style="italic">F</tspan> − <tspan font-style="italic">T</tspan> = 48,15 − 32,58 ≈ 15,57 kN</text>
  <text x="701" y="484" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#263746" transform="translate(0 36) translate(0 9)">Lom u dijagramu tlaka na granici fluida — karakteristika dvoslojnog stratificiranog sustava.</text>
  <text x="43" y="118" font-family="Arial, Liberation Sans, sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#263746">h<tspan baseline-shift="sub" font-size="0.75em">o</tspan>
  </text>
  <text x="43" y="134.0" font-family="Arial, Liberation Sans, sans-serif" font-size="10" text-anchor="middle" fill="#263746">= 1,00 m</text>
  <text x="43" y="228" font-family="Arial, Liberation Sans, sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#263746">h<tspan baseline-shift="sub" font-size="0.75em">w</tspan>
  </text>
  <text x="43" y="244.0" font-family="Arial, Liberation Sans, sans-serif" font-size="10" text-anchor="middle" fill="#263746">= 1,80 m</text>
  <text x="414" y="190" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" text-anchor="end" fill="#263746">H</text>
  <text x="414.0" y="206.0" font-family="Arial, Liberation Sans, sans-serif" font-size="10" text-anchor="end" fill="#263746">= 2,80 m</text>
</svg>
