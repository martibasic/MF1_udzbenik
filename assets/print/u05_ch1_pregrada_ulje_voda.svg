<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img"
     aria-labelledby="u05c1puv_u5ch1T u05c1puv_u5ch1D" preserveAspectRatio="xMidYMid meet"
     style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u05c1puv_u5ch1T">U05 CH 1 – Zglobna pregrada s uljem iznad vode</title>
  <desc id="u05c1puv_u5ch1D">b=1,40 m, h_o=1,00 m (ulje ρ=820), h_w=1,80 m (voda ρ=1000). F₁=5,63 kN, F₂=42,5 kN, F=48,1 kN; y_CP=1,895 m; T=32,5 kN; R_A=15,6 kN.</desc>
  <defs>
    <marker id="u05c1puv_u5ch1aR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#c0392b"/>
    </marker>
    <marker id="u05c1puv_u5ch1aRL" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L0,8 L10,4 z" fill="#c0392b"/>
    </marker>
    <marker id="u05c1puv_u5ch1aB" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#1565c0"/>
    </marker>
    <marker id="u05c1puv_u5ch1aBL" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L0,8 L10,4 z" fill="#1565c0"/>
    </marker>
    <marker id="u05c1puv_u5ch1aDim" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#c96c35"/>
    </marker>
    <marker id="u05c1puv_u5ch1aDimL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L0,8 L8,4 z" fill="#c96c35"/>
    </marker>
    <linearGradient id="u05c1puv_u5ch1fw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8e8f6"/><stop offset="100%" stop-color="#4fa8d0"/>
    </linearGradient>
    <pattern id="u05c1puv_u5ch1wall" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.8"/>
    </pattern>
  </defs>

  <rect width="940" height="440" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="392" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>

  <!-- Naslov -->
  <text x="54" y="87" font-family="'Segoe UI',Arial,sans-serif" font-size="14.5" fill="#516677">h_o=1,00 m (ulje ρ=820 kg/m³) · h_w=1,80 m (voda ρ=1000 kg/m³) · b=1,40 m → F₁+F₂=48,1 kN</text>

  <!-- Mjerilo 80px/m; A(zglob,gore) y=115; ulje/voda y=195; D(spojnica,dno) y=339 -->

  <!-- Sloj ulja (amber) -->
  <rect x="82" y="115" width="226" height="80" fill="#f6e1a6" opacity="0.90"/>

  <!-- Sloj vode (plava) -->
  <rect x="82" y="195" width="226" height="144" fill="url(#u05c1puv_u5ch1fw)" opacity="0.85"/>

  <!-- Lijeva stijenka -->
  <rect x="80" y="108" width="4" height="238" fill="#909fa8"/>

  <!-- Dno -->
  <rect x="80" y="339" width="234" height="8" fill="#909fa8" stroke="#5d6d7e" stroke-width="1"/>

  <!-- Površina ulja (slobodna površina) -->
  <line x1="80" y1="115" x2="310" y2="115" stroke="#b7791f" stroke-width="2.2"/>
  <text x="84" y="108" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#b7791f">slobodna površina</text>

  <!-- Granica ulje/voda -->
  <line x1="80" y1="195" x2="308" y2="195" stroke="#2980b9" stroke-width="1.8" stroke-dasharray="6,3"/>
  <text x="84" y="192" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#2980b9">ulje / voda</text>

  <!-- Pregrada (zid s hatching) -->
  <rect x="308" y="100" width="42" height="248" fill="#909fa8" stroke="#5d6d7e" stroke-width="1.8"/>
  <rect x="308" y="100" width="42" height="248" fill="url(#u05c1puv_u5ch1wall)" opacity="0.50"/>

  <!-- Zglob A (gore) -->
  <circle cx="308" cy="115" r="7" fill="#1a2530" stroke="white" stroke-width="2"/>
  <text x="354" y="119" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1a2530">A</text>
  <text x="365" y="119" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#516677"> (zglob)</text>

  <!-- Spojnica D (dno) -->
  <circle cx="308" cy="339" r="7" fill="#1a2530" stroke="white" stroke-width="2"/>
  <text x="354" y="343" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1a2530">D</text>
  <text x="365" y="343" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#516677"> (spojnica)</text>

  <!-- Dijagram tlaka (na lijevoj stijenci pregrade, x=308) -->
  <!-- Uljni trokut: p=0 na y=115, p_interface=22px širine na y=195 -->
  <polygon points="308,115 286,195 308,195" fill="#f6c24a" opacity="0.55"/>
  <line x1="286" y1="195" x2="308" y2="115" stroke="#b7791f" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Vodeni trapez: p=22px na y=195, p=70px na y=339 (kink u nagibu) -->
  <polygon points="308,195 286,195 238,339 308,339" fill="#1565c0" opacity="0.30"/>
  <line x1="286" y1="195" x2="238" y2="339" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Oznaka loma dijagrama -->
  <circle cx="286" cy="195" r="4" fill="#c0392b" stroke="white" stroke-width="1.5"/>
  <text x="270" y="205" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#c0392b">lom p(y)</text>

  <!-- p_max tekst -->
  <text x="232" y="353" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#1565c0" text-anchor="end">p_max</text>

  <!-- F₁ strelica (ulje): od (308,168) DESNO, y_F1=0,667m→y=115+53=168 -->
  <line x1="308" y1="168" x2="380" y2="168" stroke="#b7791f" stroke-width="3.0" marker-end="url(#u05c1puv_u5ch1aR)"/>
  <text x="384" y="172" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#b7791f">F₁ ≈ 5,63 kN</text>

  <!-- F₂ strelica (voda): od (308,280) DESNO, y_F2=2,057m→y=115+165=280 -->
  <line x1="308" y1="280" x2="400" y2="280" stroke="#c0392b" stroke-width="3.5" marker-end="url(#u05c1puv_u5ch1aR)"/>
  <text x="404" y="284" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#c0392b">F₂ ≈ 42,5 kN</text>

  <!-- T strelica (spojnica D, prema lijevo): od (308,339) LIJEVO -->
  <line x1="308" y1="339" x2="228" y2="339" stroke="#1565c0" stroke-width="3.5" marker-start="url(#u05c1puv_u5ch1aBL)"/>
  <text x="152" y="333" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1565c0">T ≈ 32,5 kN</text>

  <!-- R_A strelica (zglob A, prema lijevo): od (308,115) LIJEVO -->
  <line x1="308" y1="115" x2="248" y2="115" stroke="#1e8449" stroke-width="2.8" marker-start="url(#u05c1puv_u5ch1aBL)"/>
  <text x="152" y="111" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1e8449">R_A ≈ 15,6 kN</text>

  <!-- Kote (lijeva margina) -->
  <!-- h_o: y=115..195 na x=60 -->
  <line x1="80" y1="115" x2="62" y2="115" stroke="#c96c35" stroke-width="1.0"/>
  <line x1="80" y1="195" x2="62" y2="195" stroke="#c96c35" stroke-width="1.0"/>
  <line x1="59" y1="117" x2="59" y2="193" stroke="#c96c35" stroke-width="1.6"
        marker-start="url(#u05c1puv_u5ch1aDimL)" marker-end="url(#u05c1puv_u5ch1aDim)"/>
  <text x="36" y="162" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#92400e" font-style="italic">h_o</text>
  <text x="30" y="174" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#92400e">1,00 m</text>

  <!-- h_w: y=195..339 na x=40 -->
  <line x1="80" y1="339" x2="42" y2="339" stroke="#c96c35" stroke-width="1.0"/>
  <line x1="39" y1="197" x2="39" y2="337" stroke="#c96c35" stroke-width="1.6"
        marker-start="url(#u05c1puv_u5ch1aDimL)" marker-end="url(#u05c1puv_u5ch1aDim)"/>
  <text x="28" y="274" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#92400e" font-style="italic">h_w</text>
  <text x="22" y="286" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#92400e">1,80 m</text>

  <!-- Legende (boje fluida) -->
  <rect x="82" y="358" width="90" height="16" rx="3" fill="#f6e1a6" stroke="#b7791f" stroke-width="1.2"/>
  <text x="177" y="371" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#8b5e00">ulje (ρ=820 kg/m³)</text>
  <rect x="82" y="378" width="90" height="16" rx="3" fill="#4fa8d0" stroke="#1565c0" stroke-width="1.2" opacity="0.75"/>
  <text x="177" y="391" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1565c0">voda (ρ=1000 kg/m³)</text>

  <!-- Kutija rješenja (desno) -->
  <rect x="430" y="108" width="472" height="316" rx="10" fill="#f8fafc" stroke="#cbd5e0" stroke-width="1.8"/>
  <text x="448" y="133" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1a2530">Rješenje — dvoslojni fluid (ulje + voda):</text>
  <line x1="448" y1="141" x2="886" y2="141" stroke="#e2e8f0" stroke-width="1"/>

  <!-- F1 (ulje) -->
  <text x="448" y="160" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">F₁ = ½ρ_o g h_o² b = ½·820·9,81·1,00²·1,40 = 5 631 N</text>
  <text x="448" y="179" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">Hvatište: y₁ = 2/3 · h_o = 0,667 m od A</text>
  <line x1="448" y1="187" x2="886" y2="187" stroke="#e2e8f0" stroke-width="1"/>

  <!-- F2 (voda) -->
  <text x="448" y="206" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">Ekvivalentni tlak na vrhu vode: p₁ = ρ_o g h_o = 8 040 Pa</text>
  <text x="448" y="225" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">F₂ = (p₁ + p₂/2)·b·h_w = (8040+8829)·1,40·1,80 = 42 493 N</text>
  <text x="448" y="244" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">Hvatište: y₂ = h_o + 1,057 = 2,057 m od A</text>
  <line x1="448" y1="252" x2="886" y2="252" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Ukupno -->
  <text x="448" y="271" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#c0392b">F = F₁ + F₂ = 5,63 + 42,5 = 48,1 kN</text>
  <text x="448" y="290" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">y_CP = (F₁·y₁ + F₂·y₂) / F = (3,755+87,43) / 48,1 = 1,895 m</text>
  <line x1="448" y1="298" x2="886" y2="298" stroke="#e2e8f0" stroke-width="1"/>

  <!-- T, R_A -->
  <text x="448" y="317" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1565c0">T = ΣM_A / H = (F₁·y₁+F₂·y₂) / H = 91,2/2,80 ≈ 32,5 kN</text>
  <text x="448" y="336" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1e8449">R_A = F − T = 48,1 − 32,5 = 15,6 kN</text>
  <line x1="448" y1="344" x2="886" y2="344" stroke="#e2e8f0" stroke-width="1"/>
  <text x="448" y="363" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#516677">Dijagram tlaka ima lom pri granici ulje/voda jer se mjenja ρ.</text>
  <text x="448" y="381" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#516677">Nagib p(y) u ulju: k_o = ρ_o g = 8040 Pa/m; u vodi: k_w = ρ_w g = 9810 Pa/m.</text>
  <text x="448" y="399" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#516677">Kontinuitet tlaka je očuvan: p je neprekinuta funkcija dubine.</text>
  <line x1="448" y1="407" x2="886" y2="407" stroke="#e2e8f0" stroke-width="1"/>
  <text x="448" y="420" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677">Sila F₁ (amber) od ulja, F₂ (crveno) od vode. T i R_A prikazane su prema smjeru na pregradi.</text>

  <!-- Napomena dno -->
  <text x="54" y="422" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#516677">Kosi lom u dijagramu tlaka na granici fluida — karakteristika dvoslojnih sustava (more-naftni tanker, termoklina itd.).</text>
</svg>