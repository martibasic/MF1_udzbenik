      </marker>
      <marker id="u01v1km_pressureMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
        <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
      </marker>
      <marker id="u01v1km_reactionMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
        <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
      </marker>
      <marker id="u01v1km_axisMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
        <path d="M0 0 L7 3 L0 6 Z" fill="#3a4a56" />
      </marker>
    </defs>
    <defs />
    <path id="u01v1km_systemouter0" d="M48.0 140 V400 H631.722348605376 V140" fill="none" stroke="#3a4a56" stroke-width="11" stroke-linecap="butt" stroke-linejoin="round" />
