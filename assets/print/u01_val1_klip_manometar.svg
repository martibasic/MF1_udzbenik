<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="u01v1km_title u01v1km_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
<title id="u01v1km_title">Opterećeni klip i tlak</title><desc id="u01v1km_desc">Povezani cilindri imaju otvoren donji spoj, jedinstvenu ispunu ulja i jednake visine tlačnih ploha. Kota d_k mjeri provrt; A2 označuje površinu čela. Crvena sila je opterećenje prvog klipa, zelena sila ulja na drugi klip.</desc>
<defs>
<linearGradient id="u01v1km_water" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#aed6f1"/><stop offset="100%" stop-color="#5b9ec9"/></linearGradient>
<linearGradient id="u01v1km_oil" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#c8a000"/></linearGradient>
<linearGradient id="u01v1km_hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1a2e42"/><stop offset="100%" stop-color="#1a3a52"/></linearGradient>
<pattern id="u01v1km_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.8"/></pattern>
<marker id="u01v1km_v" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#1e8449"/></marker>
