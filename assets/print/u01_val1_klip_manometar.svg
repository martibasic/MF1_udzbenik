<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" role="img"
     aria-labelledby="u01v1km_v1t u01v1km_v1d" preserveAspectRatio="xMidYMid meet"
     style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="u01v1km_v1t">U01 Val 1 – Opterećeni klip i tlak u zatvorenom cilindru</title>
  <desc id="u01v1km_v1d">Klip dk=160 mm, G=3,60 kN stvara tlak p=179 kPa. Isti tlak na radnom klipu A₂=450 cm² daje F₂=8,06 kN. Pascalov zakon.</desc>
  <defs>
    <!-- Markeri za strelice – prefiks v1 -->
    <marker id="u01v1km_v1aR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#c0392b"/>
    </marker>
    <marker id="u01v1km_v1aG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#1e8449"/>
    </marker>
    <marker id="u01v1km_v1aBl" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#1565c0"/>
    </marker>
    <marker id="u01v1km_v1aDim" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#4a4a4a"/>
    </marker>
    <marker id="u01v1km_v1aDimR" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L0,8 L8,4 z" fill="#4a4a4a"/>
    </marker>
    <!-- Fluida gradijent (modra) -->
    <linearGradient id="u01v1km_v1fl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aed6f1"/>
      <stop offset="100%" stop-color="#7fb3d3"/>
    </linearGradient>
    <!-- Klip/čelični gradijent -->
    <linearGradient id="u01v1km_v1ps" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#909fa8"/>
      <stop offset="100%" stop-color="#5d6d7e"/>
    </linearGradient>
    <!-- Hatching za cilindar stjenke -->
    <pattern id="u01v1km_v1hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8a9aa6" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Pozadina -->
  <rect width="980" height="460" fill="#f8f9fa"/>
  <rect x="14" y="14" width="952" height="432" rx="12" fill="#ffffff" stroke="#dde3ea" stroke-width="1.8"/>

  <!-- ════════════════════════════════════════════
       LIJEVI CILINDAR – opterećeni klip
       Unutrašnjost: 104–230 px, visina: 108–380
       Stjenke: lijeva 86–104, desna 230–248
  ════════════════════════════════════════════ -->
  <!-- Stjenke (hatch) -->
  <rect x="86"  y="108" width="18" height="254" fill="url(#u01v1km_v1hatch)" stroke="#4a6070" stroke-width="1.5"/>
  <rect x="230" y="108" width="18" height="254" fill="url(#u01v1km_v1hatch)" stroke="#4a6070" stroke-width="1.5"/>
  <!-- Dno cilindra -->
  <rect x="86" y="360" width="162" height="16" rx="2" fill="url(#u01v1km_v1hatch)" stroke="#4a6070" stroke-width="1.5"/>
  <!-- Fluid od klipa do dna: y 234..360 -->
  <rect x="104" y="234" width="126" height="126" fill="url(#u01v1km_v1fl)"/>
  <!-- Gornji poklopac (zatvoreni cilindar – klipnjača prolazi kroz brtvu) -->
  <rect x="86" y="108" width="162" height="16" fill="url(#u01v1km_v1hatch)" stroke="#4a6070" stroke-width="1.5"/>
  <!-- Brtva (gland) za klipnjaču – uski tamni pravokutnik -->
  <rect x="151" y="108" width="16" height="8" rx="2" fill="#3a4a56" stroke="#222" stroke-width="1"/>

  <!-- Klip: y 210..234 -->
  <rect x="108" y="210" width="122" height="24" rx="4" fill="url(#u01v1km_v1ps)" stroke="#3a4a56" stroke-width="2"/>
  <!-- Klipnjača: od poklopca do vrha klipa y 116..210 -->
  <rect x="151" y="116" width="16" height="96" fill="#9aaab4" stroke="#5b6770" stroke-width="1.5"/>
  <!-- Gornji kraj klipnjače s navrtkom -->
  <rect x="147" y="90" width="24" height="26" rx="3" fill="#7a8a96" stroke="#4a5a66" stroke-width="1.5"/>

  <!-- Sila G prema dolje na vrh klipnjače -->
  <line x1="159" y1="38" x2="159" y2="87" stroke="#c0392b" stroke-width="4" marker-end="url(#u01v1km_v1aR)"/>
  <text x="174" y="42" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" font-style="italic" fill="#c0392b">G</text>
  <text x="174" y="60" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#c0392b">= 3,60 kN</text>

  <!-- Tlačne strelice u fluidu prema klipu gore -->
  <line x1="122" y1="300" x2="122" y2="242" stroke="#1565c0" stroke-width="2.2" marker-end="url(#u01v1km_v1aBl)"/>
  <line x1="159" y1="300" x2="159" y2="242" stroke="#1565c0" stroke-width="2.2" marker-end="url(#u01v1km_v1aBl)"/>
  <line x1="196" y1="300" x2="196" y2="242" stroke="#1565c0" stroke-width="2.2" marker-end="url(#u01v1km_v1aBl)"/>
  <text x="159" y="344" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" font-style="italic" text-anchor="middle" fill="#1565c0">p</text>

  <!-- Kota dk (vodoravno, između klipnih stjenki) -->
  <line x1="108" y1="198" x2="108" y2="191" stroke="#4a4a4a" stroke-width="1.2"/>
  <line x1="230" y1="198" x2="230" y2="191" stroke="#4a4a4a" stroke-width="1.2"/>
  <line x1="111" y1="194" x2="227" y2="194" stroke="#4a4a4a" stroke-width="1.3" marker-start="url(#u01v1km_v1aDimR)" marker-end="url(#u01v1km_v1aDim)"/>
  <text x="169" y="188" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#4a4a4a">d&#8342; = 160 mm</text>

  <!-- Ak ispod -->
  <text x="169" y="396" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">A&#8342; ≈ 201 cm²</text>

  <!-- ════════════════════════════════════════════
       VODORAVNI VOD – prenosi isti tlak p
       y: 368..390; x: 248..475
  ════════════════════════════════════════════ -->
  <rect x="248" y="360" width="264" height="22" rx="3" fill="#8a9aa6" stroke="#4a6070" stroke-width="1.3"/>
  <rect x="258" y="365" width="244" height="12" fill="url(#u01v1km_v1fl)" opacity="0.85"/>
  <!-- Strelica toka tlaka udesno -->
  <line x1="268" y1="371" x2="462" y2="371" stroke="#1565c0" stroke-width="2.5" marker-end="url(#u01v1km_v1aBl)"/>
  <text x="358" y="358" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" font-style="italic" text-anchor="middle" fill="#1565c0">p = 179 kPa</text>

  <!-- ════════════════════════════════════════════
       DESNI CILINDAR – radni klip A2=450 cm²
       Unutrašnjost: 476–672 px (196 px = √2.24 × 130)
       Stjenke: lijeva 458–476, desna 672–690
  ════════════════════════════════════════════ -->
  <rect x="458" y="108" width="18" height="270" fill="url(#u01v1km_v1hatch)" stroke="#4a6070" stroke-width="1.5"/>
  <rect x="672" y="108" width="18" height="270" fill="url(#u01v1km_v1hatch)" stroke="#4a6070" stroke-width="1.5"/>
  <!-- Dno -->
  <rect x="458" y="376" width="232" height="16" rx="2" fill="url(#u01v1km_v1hatch)" stroke="#4a6070" stroke-width="1.5"/>
  <!-- Gornji poklopac otvoreni (klipnjača viri gore) -->
  <rect x="458" y="108" width="232" height="16" fill="url(#u01v1km_v1hatch)" stroke="#4a6070" stroke-width="1.5"/>
  <rect x="566" y="108" width="16" height="8" rx="2" fill="#3a4a56" stroke="#222" stroke-width="1"/>
  <!-- Fluid: y 234..376 -->
  <rect x="476" y="234" width="196" height="142" fill="url(#u01v1km_v1fl)"/>
  <!-- Klip: y 210..234 -->
  <rect x="462" y="210" width="226" height="24" rx="4" fill="url(#u01v1km_v1ps)" stroke="#3a4a56" stroke-width="2"/>
  <!-- Klipnjača: y 116..210 -->
  <rect x="566" y="116" width="16" height="96" fill="#9aaab4" stroke="#5b6770" stroke-width="1.5"/>
  <!-- Vrh klipnjače -->
  <rect x="562" y="90" width="24" height="26" rx="3" fill="#7a8a96" stroke="#4a5a66" stroke-width="1.5"/>

  <!-- Tlačne strelice prema klipu gore (desno) -->
  <line x1="514" y1="296" x2="514" y2="242" stroke="#1565c0" stroke-width="2.2" marker-end="url(#u01v1km_v1aBl)"/>
  <line x1="574" y1="296" x2="574" y2="242" stroke="#1565c0" stroke-width="2.2" marker-end="url(#u01v1km_v1aBl)"/>
  <line x1="634" y1="296" x2="634" y2="242" stroke="#1565c0" stroke-width="2.2" marker-end="url(#u01v1km_v1aBl)"/>
  <text x="574" y="352" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" font-style="italic" text-anchor="middle" fill="#1565c0">p</text>

  <!-- Sila F2 gore (na vrh klipnjače) -->
  <line x1="574" y1="38" x2="574" y2="87" stroke="#1e8449" stroke-width="4.5" marker-end="url(#u01v1km_v1aG)"/>
  <text x="589" y="42" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" font-style="italic" fill="#1e8449">F₂</text>
  <text x="589" y="60" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1e8449">≈ 8,06 kN</text>

  <!-- Kota A2 -->
  <line x1="462" y1="198" x2="462" y2="191" stroke="#4a4a4a" stroke-width="1.2"/>
  <line x1="688" y1="198" x2="688" y2="191" stroke="#4a4a4a" stroke-width="1.2"/>
  <line x1="465" y1="194" x2="685" y2="194" stroke="#4a4a4a" stroke-width="1.3" marker-start="url(#u01v1km_v1aDimR)" marker-end="url(#u01v1km_v1aDim)"/>
  <text x="575" y="188" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#4a4a4a">A₂ = 450 cm²</text>

  <!-- A2/A1 omjer label -->
  <text x="575" y="406" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">A₂/A&#8342; = 450/201 ≈ 2,24  →  F₂ ≈ 2,24 · G</text>

  <!-- ════════════════════════════════════════════
       FORMULA BOX (desno)
  ════════════════════════════════════════════ -->
  <rect x="718" y="90" width="230" height="266" rx="10" fill="#f0f7ff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="736" y="114" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1a2530">Ključne jednadžbe</text>
  <line x1="726" y1="122" x2="938" y2="122" stroke="#c8d6e4" stroke-width="1"/>

  <text x="730" y="142" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#4a5a6a">Površina klipa:</text>
  <text x="730" y="160" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1a2530">A&#8342; = π d&#8342;² / 4</text>
  <text x="730" y="176" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1565c0">    ≈ 201 cm²</text>
  <line x1="726" y1="184" x2="938" y2="184" stroke="#dde8f0" stroke-width="1"/>

  <text x="730" y="203" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#4a5a6a">Tlak ispod klipa:</text>
  <text x="730" y="221" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1a2530">p = G / A&#8342;</text>
  <text x="730" y="237" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1565c0">    = 179 kPa</text>
  <line x1="726" y1="245" x2="938" y2="245" stroke="#dde8f0" stroke-width="1"/>

  <text x="730" y="264" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#4a5a6a">Pascalov zakon – sila F₂:</text>
  <text x="730" y="282" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1a2530">F₂ = p · A₂</text>
  <line x1="726" y1="290" x2="938" y2="290" stroke="#dde8f0" stroke-width="1"/>

  <text x="730" y="309" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#4a5a6a">Isti tlak · veća površina</text>
  <text x="730" y="326" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#4a5a6a">→ veća sila.</text>

  <!-- Rezultat badge -->
  <rect x="718" y="370" width="230" height="58" rx="8" fill="#e8f5e9" stroke="#1e8449" stroke-width="1.5"/>
  <text x="833" y="390" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2530">Rezultati:</text>
  <text x="733" y="408" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#c0392b">p ≈ 179 kPa</text>
  <text x="833" y="408" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1e8449">F₂ ≈ 8,06 kN</text>

  <!-- ── LEGENDA ── -->
  <rect x="48" y="424" width="12" height="12" fill="#c0392b" rx="2"/>
  <text x="65" y="435" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">ulazna sila G</text>
  <rect x="175" y="424" width="12" height="12" fill="#1565c0" rx="2"/>
  <text x="192" y="435" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">tlak p u fluidu</text>
  <rect x="318" y="424" width="12" height="12" fill="#1e8449" rx="2"/>
  <text x="335" y="435" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">izlazna sila F₂</text>
  <rect x="450" y="424" width="12" height="12" fill="#aed6f1" stroke="#1565c0" stroke-width="1" rx="2"/>
  <text x="467" y="435" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">ulje (fluid)</text>
  <rect x="560" y="424" width="12" height="12" fill="#909fa8" rx="2"/>
  <text x="577" y="435" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">klip (čelik)</text>
</svg>
