    <rect x="48.0" y="237" width="3" height="20" rx="0" fill="#3a4a56" stroke="none" stroke-width="1.2" />
    <rect x="185.0" y="237" width="3" height="20" rx="0" fill="#3a4a56" stroke="none" stroke-width="1.2" />
    <rect id="u01v1km_systempiston1" x="422.27765139462394" y="234" width="209.44469721075217" height="26" rx="0" fill="#d7dee3" stroke="#3a4a56" stroke-width="1.2" />
    <rect id="u01v1km_systemrod1" x="517.0" y="85" width="20" height="149" rx="0" fill="#d7dee3" stroke="#3a4a56" stroke-width="1.2" />
