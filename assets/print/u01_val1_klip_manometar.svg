<marker id="u01v1km_dimSmall" markerWidth="3" markerHeight="3" refX="3" refY="1.5" orient="auto-start-reverse"><path d="M0 0 L3 1.5 L0 3 Z" fill="#b7600c"/></marker>
</defs>
<rect width="980" height="520" fill="white"/>
<g font-family="'Segoe UI',Arial,sans-serif" fill="#1a2530">
