    <path d="M188.0 140 V376 H422.27765139462394 V140" fill="none" stroke="url(#u01v1km_hatch)" stroke-width="9" />
    <defs />
    <path id="u01v1km_systemfluid" d="M48.0 260 H188.0 V376 H422.27765139462394 V260 H631.722348605376 V400 H48.0 Z" fill="#dcebf1" stroke="none" stroke-width="1.8" />
    <path id="u01v1km_systemwall0" d="M48.0 140 V400 H631.722348605376 V140" fill="none" stroke="#3a4a56" stroke-width="1.4" />
    <path id="u01v1km_systemwall1" d="M188.0 140 V376 H422.27765139462394 V140" fill="none" stroke="#3a4a56" stroke-width="1.4" />
