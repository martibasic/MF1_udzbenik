<text x="520" y="438" font-size="12" fill="#3a4a56" text-anchor="middle">A₂/Aₖ ≈ 2,24</text>
<g id="u01v1km_formulas" transform="translate(680 100)">
<rect x="0" y="0" width="280" height="310" rx="8" fill="white" stroke="#c8d6e4" stroke-width="1" stroke-opacity="0.65" />
