    <rect x="506" y="70" width="42" height="15" rx="2" fill="#d7dee3" stroke="#3a4a56" stroke-width="1.2" />
    <path id="u01v1km_load" d="M118 29 L118 69" fill="none" stroke="#356b83" stroke-width="2.3" marker-end="url(#u01v1km_forceMarker)" />
    <text x="140" y="49" font-size="14" fill="#263746" text-anchor="start">G = 3,60 kN</text>
    <path id="u01v1km_oilForce" d="M527 348 L527 262" fill="none" stroke="#356b83" stroke-width="2.3" marker-end="url(#u01v1km_reactionMarker)" />
    <text x="544" y="322" font-size="14" fill="#263746" text-anchor="start">F₂ = 8,06 kN</text>
    <line x1="48.0" y1="210" x2="48.0" y2="220" stroke="#657781" stroke-width="1.2" />
    <line x1="188.0" y1="210" x2="188.0" y2="220" stroke="#657781" stroke-width="1.2" />
    <path id="u01v1km_diameter" d="M48.0 215 L188.0 215" fill="none" stroke="#657781" stroke-width="1.4" marker-start="url(#u01v1km_dim)" marker-end="url(#u01v1km_dim)" />
    <text x="118.0" y="232" font-size="11" fill="#263746" text-anchor="middle">dₖ = 160 mm</text>
    <text x="309" y="240" font-size="14" fill="#263746" text-anchor="middle">A₂ = 450 cm²</text>
    <line x1="371" y1="240" x2="434.27765139462394" y2="247" stroke="#657781" stroke-width="1" />
    <text x="118" y="317" font-size="15" fill="#263746" text-anchor="middle" font-weight="700">p</text>
    <text x="311" y="390" font-size="13" fill="#263746" text-anchor="middle" font-weight="700">p ≈ 179 kPa</text>
    <text x="308" y="115" font-size="12" fill="#263746" text-anchor="middle">Vanjske strane klipova: pₐₜₘ</text>
    <text x="120" y="438" font-size="12" fill="#263746" text-anchor="middle">Aₖ ≈ 201 cm²</text>
    <text x="520" y="438" font-size="12" fill="#263746" text-anchor="middle">A₂/Aₖ ≈ 2,24</text>
    <g id="u01v1km_formulas" transform="translate(680 100)">
      <text x="140.0" y="21" font-size="14" fill="#263746" text-anchor="middle" font-weight="700">Ključne jednadžbe</text>
      <text x="140.0" y="55" font-size="11" fill="#263746" text-anchor="middle">Površina prvog klipa</text>
      <text x="140.0" y="79" font-size="15" fill="#263746" text-anchor="middle" font-weight="700">Aₖ = πdₖ² / 4</text>
      <text x="140.0" y="100" font-size="13" fill="#263746" text-anchor="middle" font-weight="700">≈ 201 cm²</text>
      <text x="140.0" y="133" font-size="11" fill="#263746" text-anchor="middle">Pretlak ispod klipova</text>
      <text x="140.0" y="157" font-size="15" fill="#263746" text-anchor="middle" font-weight="700">p = G / Aₖ</text>
      <text x="140.0" y="178" font-size="13" fill="#263746" text-anchor="middle" font-weight="700">≈ 179 kPa</text>
      <text x="140.0" y="211" font-size="11" fill="#263746" text-anchor="middle">Sila ulja na drugi klip</text>
      <text x="140.0" y="235" font-size="15" fill="#263746" text-anchor="middle" font-weight="700">F₂ = pA₂</text>
      <text x="140.0" y="256" font-size="13" fill="#263746" text-anchor="middle" font-weight="700">≈ 8,06 kN</text>
    </g>
    <text x="820" y="445" font-size="12" fill="#263746" text-anchor="middle">Isti tlak · veća površina → veća sila</text>
    <text x="490.0" y="478" font-size="11" fill="#263746" text-anchor="middle">Sile djeluju na označeno tijelo; pomaci i kote imaju zasebne oznake.</text>
    <text x="490.0" y="494" font-size="10" fill="#263746" text-anchor="middle">Ispuna označuje isti fluid, ne polje tlaka. Razmaci, hodovi i duljine sila nisu u istom mjerilu.</text>
  </g>
</svg>
