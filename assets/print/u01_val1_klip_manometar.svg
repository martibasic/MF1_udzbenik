<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="u01v1km_title u01v1km_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="u01v1km_title">U01 Val 1 - Optereceni klip i tlak u zatvorenom cilindru</title>
  <desc id="u01v1km_desc">Optereceni klip d_k=160 mm pod silom G=3,60 kN stvara tlak p=179 kPa u ulju. Spojni vod na dnu cilindara prenosi tlak na radni klip A_2=450 cm^2 → F_2=8,06 kN. Duljine strelica sila proporcionalne su iznosima (F_2 cca 2,24x duza od G).</desc>
  <defs>
    <!-- Manji trokuti strelica (7x5) -->
    <marker id="u01v1km_aR" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#c0392b" />
    </marker>
    <marker id="u01v1km_aG" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1e8449" />
    </marker>
    <marker id="u01v1km_aB" markerWidth="6" markerHeight="4" refX="5.5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#1565c0" />
    </marker>
    <marker id="u01v1km_aDim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L6,2.5 z" fill="#b7600c" />
    </marker>
    <marker id="u01v1km_aDimR" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse">
      <path d="M0,0 L0,5 L6,2.5 z" fill="#b7600c" />
    </marker>
    <linearGradient id="u01v1km_fluid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aed6f1" />
      <stop offset="100%" stop-color="#5b9ec9" />
    </linearGradient>
    <linearGradient id="u01v1km_piston" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#909fa8" />
      <stop offset="100%" stop-color="#5d6d7e" />
    </linearGradient>
    <pattern id="u01v1km_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.8" />
    </pattern>
  </defs>

  <rect width="980" height="520" fill="#ffffff" />
  <rect x="14" y="14" width="952" height="492" rx="12" fill="#ffffff" stroke="#dde3ea" stroke-width="1.5" />

  <!-- ============================================================
       KONTINUIRAN FLUID PUT - vod na DNU cilindara
       Skala: 1 kN = 7 px za sile (G=25 px, F_2=56 px)
  ============================================================ -->
  <!-- Lijevi cilindar fluid -->
  <rect x="48" y="260" width="140" height="140" fill="url(#u01v1km_fluid)" />
  <!-- Port kroz desnu stjenku lijevog cilindra (na dnu) -->
  <rect x="188" y="380" width="18" height="20" fill="url(#u01v1km_fluid)" />
  <!-- Vod fluid -->
  <rect x="206" y="380" width="198" height="20" fill="url(#u01v1km_fluid)" />
  <!-- Port kroz lijevu stjenku desnog cilindra -->
  <rect x="404" y="380" width="18" height="20" fill="url(#u01v1km_fluid)" />
  <!-- Desni cilindar fluid -->
  <rect x="422" y="260" width="210" height="140" fill="url(#u01v1km_fluid)" />

  <!-- ============================================================
       LIJEVI CILINDAR - STJENKE
  ============================================================ -->
  <rect x="30" y="120" width="73" height="20" fill="url(#u01v1km_hatch)" stroke="#4a6070" stroke-width="1.4" />
  <rect x="133" y="120" width="73" height="20" fill="url(#u01v1km_hatch)" stroke="#4a6070" stroke-width="1.4" />
  <rect x="103" y="120" width="30" height="20" fill="#3a4a56" stroke="#4a6070" stroke-width="1" />
  <line x1="106" y1="125" x2="130" y2="125" stroke="#9aaab4" stroke-width="0.8" />
  <line x1="106" y1="135" x2="130" y2="135" stroke="#9aaab4" stroke-width="0.8" />
  <rect x="30" y="140" width="18" height="280" fill="url(#u01v1km_hatch)" stroke="#4a6070" stroke-width="1.4" />
  <!-- Desna stjenka PUNE visine (zatvoren tank) -->
  <rect x="188" y="140" width="18" height="260" fill="url(#u01v1km_hatch)" stroke="#4a6070" stroke-width="1.4" />

  <!-- ============================================================
       VOD - gornja stjenka (donja je zajednicko dno)
  ============================================================ -->
  <rect x="206" y="370" width="198" height="10" fill="url(#u01v1km_hatch)" stroke="#4a6070" stroke-width="1.4" />

  <!-- ============================================================
       DESNI CILINDAR - STJENKE
  ============================================================ -->
  <rect x="404" y="120" width="108" height="20" fill="url(#u01v1km_hatch)" stroke="#4a6070" stroke-width="1.4" />
  <rect x="542" y="120" width="108" height="20" fill="url(#u01v1km_hatch)" stroke="#4a6070" stroke-width="1.4" />
  <rect x="512" y="120" width="30" height="20" fill="#3a4a56" stroke="#4a6070" stroke-width="1" />
  <line x1="515" y1="125" x2="539" y2="125" stroke="#9aaab4" stroke-width="0.8" />
  <line x1="515" y1="135" x2="539" y2="135" stroke="#9aaab4" stroke-width="0.8" />
  <!-- Lijeva stjenka PUNE visine (zatvoren tank) -->
  <rect x="404" y="140" width="18" height="260" fill="url(#u01v1km_hatch)" stroke="#4a6070" stroke-width="1.4" />
  <rect x="632" y="140" width="18" height="280" fill="url(#u01v1km_hatch)" stroke="#4a6070" stroke-width="1.4" />

  <!-- ============================================================
       ZAJEDNICKO DNO
  ============================================================ -->
  <rect x="30" y="400" width="620" height="20" fill="url(#u01v1km_hatch)" stroke="#4a6070" stroke-width="1.4" />

  <!-- ============================================================
       PORT FLUID OVERLAY (preko stjenki, na y=380-400)
  ============================================================ -->
  <rect x="188" y="380" width="18" height="20" fill="url(#u01v1km_fluid)" />
  <rect x="404" y="380" width="18" height="20" fill="url(#u01v1km_fluid)" />

  <!-- ============================================================
       KLIP I KLIPNJACA - LIJEVI (klipnjaca y=84..230)
  ============================================================ -->
  <rect x="48" y="230" width="140" height="30" rx="3" fill="url(#u01v1km_piston)" stroke="#3a4a56" stroke-width="1.6" />
  <line x1="48" y1="238" x2="188" y2="238" stroke="#3a4a56" stroke-width="0.5" opacity="0.5" />
  <rect x="103" y="84" width="30" height="146" fill="#9aaab4" stroke="#5b6770" stroke-width="1.4" />
  <rect x="98" y="70" width="40" height="16" rx="2" fill="#7a8a96" stroke="#4a5a66" stroke-width="1.4" />

  <!-- ============================================================
       KLIP I KLIPNJACA - DESNI
  ============================================================ -->
  <rect x="422" y="230" width="210" height="30" rx="3" fill="url(#u01v1km_piston)" stroke="#3a4a56" stroke-width="1.6" />
  <line x1="422" y1="238" x2="632" y2="238" stroke="#3a4a56" stroke-width="0.5" opacity="0.5" />
  <rect x="512" y="84" width="30" height="146" fill="#9aaab4" stroke="#5b6770" stroke-width="1.4" />
  <rect x="507" y="70" width="40" height="16" rx="2" fill="#7a8a96" stroke="#4a5a66" stroke-width="1.4" />

  <!-- ============================================================
       SILE - duljine proporcionalne iznosima
       Skala: 1 kN = 7 px
       G = 3,60 kN -> 25 px
       F_2 = 8,06 kN -> 56 px
  ============================================================ -->
  <!-- G prema dolje (25 px) -->
  <line x1="118" y1="43" x2="118" y2="68" stroke="#c0392b" stroke-width="3" marker-end="url(#u01v1km_aR)" />
  <!-- F_2 prema gore (56 px) -->
  <line x1="527" y1="68" x2="527" y2="12" stroke="#1e8449" stroke-width="3" marker-end="url(#u01v1km_aG)" />
  <!-- ============================================================
       TLACNE STRELICE u fluidu
  ============================================================ -->
  <line x1="80" y1="360" x2="80" y2="272" stroke="#1565c0" stroke-width="1.8" marker-end="url(#u01v1km_aB)" />
  <line x1="118" y1="360" x2="118" y2="272" stroke="#1565c0" stroke-width="1.8" marker-end="url(#u01v1km_aB)" />
  <line x1="156" y1="360" x2="156" y2="272" stroke="#1565c0" stroke-width="1.8" marker-end="url(#u01v1km_aB)" />
  <line x1="472" y1="360" x2="472" y2="272" stroke="#1565c0" stroke-width="1.8" marker-end="url(#u01v1km_aB)" />
  <line x1="527" y1="360" x2="527" y2="272" stroke="#1565c0" stroke-width="1.8" marker-end="url(#u01v1km_aB)" />
  <line x1="582" y1="360" x2="582" y2="272" stroke="#1565c0" stroke-width="1.8" marker-end="url(#u01v1km_aB)" />
  <!-- Tlak label u vodu -->
  <!-- ============================================================
       KOTE
  ============================================================ -->
  <!-- ============================================================
       NOTES
  ============================================================ -->
  <!-- ============================================================
       FORMULA BOX - centriran layout (x_center=820)
  ============================================================ -->
  <rect x="680" y="100" width="280" height="300" rx="10" fill="#f0f7ff" stroke="#1565c0" stroke-width="1.4" />
  <!-- Naslov panela -->
  <rect x="680" y="100" width="280" height="32" rx="10" fill="#1565c0" />
  <rect x="680" y="124" width="280" height="8" fill="#1565c0" />
  <!-- Blok 1: Površina klipa (y=132..200) -->
  <line x1="710" y1="208" x2="930" y2="208" stroke="#c8d6e4" stroke-width="1" />

  <!-- Blok 2: Tlak ispod klipa (y=208..276) -->
  <line x1="710" y1="284" x2="930" y2="284" stroke="#c8d6e4" stroke-width="1" />

  <!-- Blok 3: Pascalov zakon (y=284..352) -->
  <line x1="710" y1="360" x2="930" y2="360" stroke="#c8d6e4" stroke-width="1" />

  <!-- Sazetak (y=360..400) -->
  <!-- Rezultat badge -->
  <rect x="680" y="412" width="280" height="44" rx="8" fill="#e8f5e9" stroke="#1e8449" stroke-width="1.4" />
  <!-- ============================================================
       LEGENDA
  ============================================================ -->
  <rect x="48" y="468" width="12" height="12" fill="#c0392b" rx="2" />
  <rect x="172" y="468" width="12" height="12" fill="#1565c0" rx="2" />
  <rect x="380" y="468" width="12" height="12" fill="#1e8449" rx="2" />
  <rect x="510" y="468" width="12" height="12" fill="#aed6f1" stroke="#1565c0" stroke-width="0.8" rx="2" />
  <line x1="48" y1="220" x2="48" y2="210" stroke="#b7600c" stroke-width="1.2" />
  <line x1="188" y1="220" x2="188" y2="210" stroke="#b7600c" stroke-width="1.2" />
  <line x1="51" y1="215" x2="185" y2="215" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u01v1km_aDimR)" marker-end="url(#u01v1km_aDim)" />
  <line x1="422" y1="220" x2="422" y2="210" stroke="#b7600c" stroke-width="1.2" />
  <line x1="632" y1="220" x2="632" y2="210" stroke="#b7600c" stroke-width="1.2" />
  <line x1="425" y1="215" x2="629" y2="215" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u01v1km_aDimR)" marker-end="url(#u01v1km_aDim)" />
  <rect x="660" y="468" width="12" height="12" fill="#b7600c" rx="2" />
  <text x="138" y="58" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" fill="#c0392b"><tspan font-weight="700">G</tspan> = 3,60 kN</text>

  <text x="547" y="44" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" fill="#1e8449"><tspan font-weight="700">F₂</tspan> = 8,06 kN</text>

  <text x="118" y="330" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" font-style="italic" text-anchor="middle" fill="#1565c0">p</text>

  <text x="527" y="330" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" font-style="italic" text-anchor="middle" fill="#1565c0">p</text>

  <text x="305" y="394" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" font-style="italic" text-anchor="middle" fill="#ffffff">p = 179 kPa</text>

  <text x="118" y="440" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">A<tspan baseline-shift="sub" font-size="0.75em">k</tspan> ≈ 201 cm²</text>
  <text x="527" y="440" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">A<tspan baseline-shift="sub" font-size="0.75em">2</tspan>/A<tspan baseline-shift="sub" font-size="0.75em">k</tspan> ≈ 2,24  →  F<tspan baseline-shift="sub" font-size="0.75em">2</tspan> ≈ 2,24·G</text>

  <text x="820" y="122" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Ključne jednadžbe</text>

  <text x="820" y="152" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Površina klipa</text>
  <text x="820" y="174" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530">A<tspan baseline-shift="sub" font-size="0.7em">k</tspan> = π d<tspan baseline-shift="sub" font-size="0.7em">k</tspan>² / 4</text>
  <text x="820" y="194" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">≈ 201 cm²</text>
  <text x="820" y="228" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Tlak ispod klipa</text>
  <text x="820" y="250" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530">p = G / A<tspan baseline-shift="sub" font-size="0.7em">k</tspan></text>
  <text x="820" y="270" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">= 179 kPa</text>
  <text x="820" y="304" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Pascalov zakon – sila F₂</text>
  <text x="820" y="326" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530">F<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = p · A<tspan baseline-shift="sub" font-size="0.7em">2</tspan></text>
  <text x="820" y="346" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1e8449">≈ 8,06 kN</text>
  <text x="820" y="380" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">Isti tlak · veća površina</text>
  <text x="820" y="394" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">→ veća sila</text>

  <text x="820" y="430" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#5a6a78">REZULTATI</text>
  <text x="754" y="448" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b">p ≈ 179 kPa</text>
  <text x="888" y="448" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1e8449">F₂ ≈ 8,06 kN</text>

  <text x="66" y="478" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#3a4a56">ulazna sila G</text>
  <text x="190" y="478" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#3a4a56">tlak p u ulju (Pascalov zakon)</text>
  <text x="398" y="478" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#3a4a56">izlazna sila F₂</text>
  <text x="528" y="478" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#3a4a56">ulje (kontinuirani fluid)</text>
  <text x="678" y="478" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#3a4a56">kote</text>
<text x="118" y="206" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#b7600c">d<tspan baseline-shift="sub" font-size="0.75em">k</tspan> = 160 mm</text>

  <text x="527" y="206" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#b7600c">A<tspan baseline-shift="sub" font-size="0.75em">2</tspan> = 450 cm²</text>

  </svg>