<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" role="img" aria-labelledby="u02c1kmk_title u02c1kmk_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u02c1kmk_title">Kapilarni mikrodozator s izlaznom kapljicom</title>
  <desc id="u02c1kmk_desc">Lijevo: spremnik vode s pretlakom p-M, tanka staklena kapilara s kapilarnim usponom h-cap manjim od visine izlaza H i izlaznom kapljicom promjera D. Desno: cetiri koraka rjesenja s kapilarnim usponom, tlacnim skokom kapljice, najmanjim pretlakom i zakljuckom.</desc>

  <defs>
    <linearGradient id="u02c1kmk_voda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aed6f1" />
      <stop offset="1" stop-color="#5b9ec9" />
    </linearGradient>
    <radialGradient id="u02c1kmk_kap" cx="0.38" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#d6ebf8" />
      <stop offset="1" stop-color="#5b9ec9" />
    </radialGradient>
    <pattern id="u02c1kmk_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.1" />
    </pattern>
    <marker id="u02c1kmk_pr" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#1565c0" />
    </marker>
    <marker id="u02c1kmk_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u02c1kmk_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
  </defs>

  <!-- pozadina -->
  <rect x="16" y="16" width="1008" height="488" rx="14" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.4" />
  <line x1="402" y1="40" x2="402" y2="480" stroke="#dce7f0" stroke-width="1.2" stroke-dasharray="4,5" />

  <!-- ===================== LIJEVO: UREDAJ ===================== -->

  <!-- spremnik stijenke (zatvoreni tank) -->
  <rect x="80" y="255" width="170" height="190" fill="url(#u02c1kmk_hatch)" stroke="#3a4a56" stroke-width="1.5" />
  <rect x="86" y="261" width="158" height="178" fill="#ffffff" />
  <!-- voda u spremniku -->
  <rect x="86" y="295" width="158" height="144" fill="url(#u02c1kmk_voda)" />
  <!-- slobodna povrsina -->
  <line x1="86" y1="295" x2="244" y2="295" stroke="#1565c0" stroke-width="2" />

  <!-- kapilara (staklene stijenke + voda) -->
  <rect x="201" y="110" width="22" height="315" fill="#eaf1f6" stroke="#9fb3c0" stroke-width="1.2" />
  <rect x="204" y="182" width="16" height="243" fill="url(#u02c1kmk_voda)" />
  <!-- konkavni meniskus (kvasenje) -->
  <path d="M204,184 Q212,192 220,184" fill="none" stroke="#0d47a1" stroke-width="1.4" />

  <!-- izlazna kapljica D na vrhu -->
  <circle cx="212" cy="96" r="13" fill="url(#u02c1kmk_kap)" stroke="#1565c0" stroke-width="2" />

  <!-- pretlak p_M na slobodnu povrsinu -->
  <line x1="160" y1="270" x2="160" y2="289" stroke="#1565c0" stroke-width="2" marker-end="url(#u02c1kmk_pr)" />
  <!-- voda oznake -->
  <!-- D leader -->
  <line x1="158" y1="92" x2="197" y2="95" stroke="#5a6a78" stroke-width="0.8" />
  <!-- d leader -->
  <line x1="158" y1="130" x2="201" y2="122" stroke="#5a6a78" stroke-width="0.8" />
  <!-- theta leader -->
  <line x1="178" y1="186" x2="203" y2="185" stroke="#5a6a78" stroke-width="0.8" />
  <!-- kota H (lijevo) -->
  <!-- kota h_cap (desno od kapilare) -->
  <!-- kota gap (H - h_cap) -->
  <!-- ===================== DESNO: 4 KORAKA ===================== -->

  <!-- Korak 1 -->
  <rect x="418" y="58" width="600" height="96" rx="9" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="418" y="58" width="6" height="96" rx="3" fill="#1565c0" />
  <!-- Korak 2 -->
  <rect x="418" y="164" width="600" height="96" rx="9" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="418" y="164" width="6" height="96" rx="3" fill="#1565c0" />
  <!-- Korak 3 -->
  <rect x="418" y="270" width="600" height="96" rx="9" fill="#fdf8f2" stroke="#ecd9c2" stroke-width="1.2" />
  <!-- Korak 4 -->
  <rect x="418" y="376" width="600" height="96" rx="9" fill="#f1f9f3" stroke="#cce7d4" stroke-width="1.2" />
  <rect x="418" y="376" width="6" height="96" rx="3" fill="#1e8449" />
  <line x1="201" y1="110" x2="54" y2="110" stroke="#b7600c" stroke-width="0.7" />
  <line x1="80" y1="295" x2="54" y2="295" stroke="#b7600c" stroke-width="0.7" />
  <line x1="54" y1="110" x2="54" y2="295" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u02c1kmk_dimL)" marker-end="url(#u02c1kmk_dim)" />
  <line x1="220" y1="182" x2="300" y2="182" stroke="#b7600c" stroke-width="0.7" />
  <line x1="244" y1="295" x2="300" y2="295" stroke="#b7600c" stroke-width="0.7" />
  <line x1="300" y1="182" x2="300" y2="295" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u02c1kmk_dimL)" marker-end="url(#u02c1kmk_dim)" />
  <line x1="223" y1="110" x2="352" y2="110" stroke="#b7600c" stroke-width="0.7" />
  <line x1="300" y1="182" x2="352" y2="182" stroke="#b7600c" stroke-width="0.7" />
  <line x1="352" y1="110" x2="352" y2="182" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u02c1kmk_dimL)" marker-end="url(#u02c1kmk_dim)" />
  <rect x="418" y="270" width="6" height="96" rx="3" fill="#b7600c" />
  <text x="154" y="283" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" text-anchor="end" fill="#1565c0">p<tspan baseline-shift="sub" font-size="0.7em">M</tspan></text>
  <text x="96" y="283" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5a6a78">(zrak)</text>

  <text x="120" y="360" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#0d47a1">voda</text>
  <text x="96" y="404" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a2530">ρ = 998 kg/m³</text>
  <text x="96" y="420" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a2530">σ = 0,072 N/m</text>

  <text x="154" y="88" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="end" fill="#1a2530"><tspan font-style="italic">D</tspan> = 2,4 mm</text>
  <text x="154" y="134" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="end" fill="#1a2530"><tspan font-style="italic">d</tspan> = 0,8 mm</text>
  <text x="174" y="190" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="end" fill="#1a2530">θ = 0°</text>

  <text x="100" y="470" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a6a78">izlaz na visini H &gt; uspon h<tspan baseline-shift="sub" font-size="0.7em">cap</tspan> → treba pretlak</text>

  <text x="438" y="82" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1565c0">1. Kapilarni uspon (θ = 0°, cos θ = 1)</text>
  <text x="438" y="108" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1a2530"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">cap</tspan> = 4σ / (ρ g d) = 4·0,072 / (998·9,81·0,8·10⁻³)</text>
  <text x="438" y="134" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#c0392b"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">cap</tspan> ≈ 36,8 mm  &lt;  H = 60 mm  → kapilarnost nije dovoljna</text>

  <text x="438" y="188" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1565c0">2. Tlačni skok na kapljici (sfera, D = 2,4 mm)</text>
  <text x="438" y="214" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1a2530">Δp = 4σ / D = 4·0,072 / 2,4·10⁻³ = 120 Pa</text>
  <text x="438" y="240" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1565c0">p<tspan baseline-shift="sub" font-size="0.7em">in</tspan> = p₀ + Δp ≈ 101 445 Pa ≈ 101,45 kPa</text>

  <text x="438" y="320" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1a2530">p<tspan baseline-shift="sub" font-size="0.7em">M,min</tspan> = ρ g (H − h<tspan baseline-shift="sub" font-size="0.7em">cap</tspan>) + Δp</text>
  <text x="438" y="346" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#c0392b">= 227 + 120 = 347 Pa ≈ 0,347 kPa</text>

  <text x="438" y="400" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1e8449">4. Zaključak</text>
  <text x="438" y="426" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">h<tspan baseline-shift="sub" font-size="0.7em">cap</tspan> = 36,8 mm &lt; H = 60 mm → sama kapilarnost ne doseže izlaz.</text>
  <text x="438" y="450" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">Manja kapilara → veći uspon;   manja kapljica → veći Δp.</text>
<text x="46" y="198" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">H</tspan></text>
  <text x="46.0" y="214.0" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#b7600c">= 60 mm</text>

  <text x="306" y="234" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#b7600c"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">cap</tspan></text>
  <text x="306.0" y="250.0" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#b7600c">= 36,8 mm</text>

  <text x="358" y="142" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#b7600c">H−h<tspan baseline-shift="sub" font-size="0.7em">cap</tspan></text>
  <text x="358" y="156" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#b7600c">23,2 mm</text>

  <text x="438" y="294" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#b7600c">3. Najmanji pretlak u spremniku</text>
  </svg>