<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" role="img"
     aria-labelledby="u5v3T u5v3D" preserveAspectRatio="xMidYMid meet"
     style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u5v3T">U05 Val 3 – Kosi inspekcijski poklopac na talozniku</title>
  <desc id="u5v3D">b=0,90 m, L=1,20 m, h_A=0,80 m, θ=60° od vodoravne. F≈13,95 kN na centru tlaka CP (s_R=0,679 m od A); spojnica T≈7,89 kN pri B.</desc>
  <defs>
    <marker id="u5v3aR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#c0392b"/>
    </marker>
    <marker id="u5v3aB" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#1565c0"/>
    </marker>
    <marker id="u5v3aDim" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#c96c35"/>
    </marker>
    <marker id="u5v3aDimL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L0,8 L8,4 z" fill="#c96c35"/>
    </marker>
    <linearGradient id="u5v3fl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8e8f6"/><stop offset="100%" stop-color="#5baece"/>
    </linearGradient>
    <pattern id="u5v3wall" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.8"/>
    </pattern>
  </defs>

  <rect width="940" height="420" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="372" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>

  <!-- Naslov -->
  <text x="54" y="62" font-family="'Segoe UI',Arial,sans-serif" font-size="21" font-weight="700" fill="#173043">U05 Val 3 – Kosi inspekcijski poklopac na talozniku</text>
  <text x="54" y="87" font-family="'Segoe UI',Arial,sans-serif" font-size="14.5" fill="#516677">b=0,90 m · L=1,20 m · h_A=0,80 m · θ=60° od vodoravne → F≈13,95 kN · T≈7,89 kN</text>

  <!--
    Mjerilo: 100 px/m  ·  Slobodna površina y=115
    Stijenka (kosa, θ=60° od horiz.): smjer (0.5, 0.866) u SVG
    W(površina) = (310,115);  A(zglob) = (356,195);  B(spojnica) = (416,299)
    C(centroid) = (386,247);  CP = (390,254)
    Normala prema van (iz fluida) = (0.866, -0.500)
    Normala prema unutra (prema fluidu) = (-0.866, 0.500)
  -->

  <!-- Tijelo fluida (taložnik) -->
  <polygon points="82,115 310,115 416,299 416,330 82,330" fill="url(#u5v3fl)" opacity="0.82"/>

  <!-- Lijeva stijenka -->
  <rect x="80" y="108" width="4" height="228" fill="#909fa8"/>

  <!-- Dno taloznika -->
  <rect x="80" y="330" width="340" height="8" fill="#909fa8" stroke="#5d6d7e" stroke-width="1"/>

  <!-- Slobodna površina -->
  <line x1="80" y1="115" x2="312" y2="115" stroke="#1565c0" stroke-width="2.8"/>
  <text x="84" y="108" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1565c0">slobodna površina  (p = 0)</text>

  <!-- Gornji dio zida (iznad poklopca: W→A), debljina 20 px -->
  <!-- Inner: (300,100)→(356,195); outer offset 20px u smjeru (0.866,-0.500): +17,-10 -->
  <polygon points="300,100 317,90 373,185 356,195" fill="#909fa8" stroke="#5d6d7e" stroke-width="1.4"/>
  <polygon points="300,100 317,90 373,185 356,195" fill="url(#u5v3wall)" opacity="0.45"/>

  <!-- Donji dio zida (ispod poklopca: B→ext) -->
  <polygon points="416,299 433,289 449,319 432,329" fill="#909fa8" stroke="#5d6d7e" stroke-width="1.4"/>
  <polygon points="416,299 433,289 449,319 432,329" fill="url(#u5v3wall)" opacity="0.45"/>

  <!-- Poklopac (inspection cover): A→B, istaknuto metal -->
  <line x1="356" y1="195" x2="416" y2="299" stroke="#2d3748" stroke-width="14" stroke-linecap="round"/>
  <line x1="356" y1="195" x2="416" y2="299" stroke="#718096" stroke-width="8" stroke-linecap="round"/>

  <!-- Zglob A (hinge) -->
  <circle cx="356" cy="195" r="7" fill="#1a2530" stroke="white" stroke-width="2"/>
  <text x="338" y="186" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1a2530">A</text>

  <!-- Spojnica B (bolt) -->
  <circle cx="416" cy="299" r="7" fill="#1a2530" stroke="white" stroke-width="2"/>
  <text x="424" y="304" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1a2530">B</text>

  <!-- Centroid C (386,247) -->
  <circle cx="386" cy="247" r="5.5" fill="#1a2530" stroke="white" stroke-width="1.5"/>
  <line x1="386" y1="247" x2="344" y2="230" stroke="#1a2530" stroke-width="0.9" stroke-dasharray="3,3"/>
  <text x="314" y="227" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530" font-style="italic">C</text>
  <text x="324" y="227" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#516677"> h_C=1,32 m</text>

  <!-- Centar tlaka CP (390,254) -->
  <circle cx="390" cy="254" r="5.5" fill="#c0392b" stroke="white" stroke-width="1.5"/>
  <line x1="390" y1="254" x2="348" y2="271" stroke="#c0392b" stroke-width="0.9" stroke-dasharray="3,3"/>
  <text x="310" y="274" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#c0392b" font-style="italic">CP</text>
  <text x="328" y="274" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#516677"> s_R=0,679 m</text>

  <!-- F strelica od CP u smjeru (0.866, -0.500), 72 px -->
  <line x1="390" y1="254" x2="452" y2="218" stroke="#c0392b" stroke-width="3.5" marker-end="url(#u5v3aR)"/>
  <text x="456" y="213" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#c0392b">F ≈ 13,95 kN</text>

  <!-- T strelica od B u smjeru (-0.866, 0.500), 52 px -->
  <line x1="416" y1="299" x2="371" y2="325" stroke="#1565c0" stroke-width="3.5" marker-end="url(#u5v3aB)"/>
  <text x="350" y="342" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1565c0">T ≈ 7,89 kN</text>

  <!-- Kota h_A (vertikalna: od y=115 do y=195 pri x=320) -->
  <line x1="356" y1="115" x2="356" y2="190" stroke="#c96c35" stroke-width="1.0" stroke-dasharray="4,3"/>
  <line x1="356" y1="115" x2="323" y2="115" stroke="#c96c35" stroke-width="1.0"/>
  <line x1="356" y1="195" x2="323" y2="195" stroke="#c96c35" stroke-width="1.0"/>
  <line x1="320" y1="117" x2="320" y2="193" stroke="#c96c35" stroke-width="1.8"
        marker-start="url(#u5v3aDimL)" marker-end="url(#u5v3aDim)"/>
  <text x="262" y="162" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#92400e" font-style="italic">h_A = 0,80 m</text>

  <!-- Kota L (duž plohe, ofsetnuta za 18 px lijevo-gore od unutarnje stijene) -->
  <!-- Pomak: smer normale prema van rotiran 180° = (-0.866, 0.5), duljina 18: (-15.6, 9) ≈ (-16, 9) -->
  <!-- A-pomak: (356-16, 195+9) = (340, 204); B-pomak: (416-16, 299+9) = (400, 308) -->
  <line x1="356" y1="195" x2="340" y2="204" stroke="#c96c35" stroke-width="1.0"/>
  <line x1="416" y1="299" x2="400" y2="308" stroke="#c96c35" stroke-width="1.0"/>
  <line x1="341" y1="205" x2="401" y2="309" stroke="#c96c35" stroke-width="1.8"
        marker-start="url(#u5v3aDimL)" marker-end="url(#u5v3aDim)"/>
  <text x="295" y="276" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#92400e" font-style="italic" transform="rotate(60,295,276)">L = 1,20 m</text>

  <!-- Kut θ=60° pri W(310,115) -->
  <path d="M 336,115 A 26 26 0 0 1 323,137" fill="none" stroke="#c96c35" stroke-width="1.5"/>
  <text x="341" y="136" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#92400e">θ=60°</text>

  <!-- Kutija rješenja (desno) -->
  <rect x="472" y="108" width="440" height="290" rx="10" fill="#f8fafc" stroke="#cbd5e0" stroke-width="1.8"/>
  <text x="490" y="133" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1a2530">Rješenje:</text>
  <text x="490" y="153" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">A = b·L = 0,90·1,20 = 1,08 m²</text>
  <text x="490" y="172" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">h_C = h_A + (L/2)·sinθ = 0,80 + 0,519 = 1,320 m</text>
  <line x1="490" y1="180" x2="896" y2="180" stroke="#e2e8f0" stroke-width="1"/>
  <text x="490" y="199" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#c0392b">F = ρgAh_C = 998·9,81·1,08·1,320 ≈ 13 950 N</text>
  <text x="490" y="218" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#c0392b">  ⟹  F ≈ 13,95 kN</text>
  <line x1="490" y1="226" x2="896" y2="226" stroke="#e2e8f0" stroke-width="1"/>
  <text x="490" y="245" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">I_G = bL³/12 = 0,90·1,728/12 = 0,1296 m⁴</text>
  <text x="490" y="264" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">s_C = h_A/sinθ + L/2 = 0,924 + 0,600 = 1,524 m  (duž plohe)</text>
  <text x="490" y="283" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">s_R = s_C + I_G/(A·s_C) = 1,524 + 0,079 = 1,603 m od površine</text>
  <text x="490" y="302" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1a2530">     → od zgloba A:  1,603 − 0,924 = 0,679 m</text>
  <line x1="490" y1="310" x2="896" y2="310" stroke="#e2e8f0" stroke-width="1"/>
  <text x="490" y="329" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1565c0">T = F·s_R / L = 13,95·0,679 / 1,20 ≈ 7,89 kN</text>
  <text x="490" y="349" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#516677">Provjera: M_A = F·s_R = 13,95·0,679 ≈ 9,47 kNm = T·L ✓</text>
  <line x1="490" y1="357" x2="896" y2="357" stroke="#e2e8f0" stroke-width="1"/>
  <text x="490" y="377" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#516677">h_CP = s_R · sinθ = 1,603 · 0,866 = 1,389 m (vertikalna dubina CP)</text>
  <text x="490" y="392" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#516677">Kod kosih ploha centar tlaka mjeri se duž plohe, a ne vertikalno!</text>

  <!-- Napomena dno -->
  <text x="54" y="402" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#516677">F (crveno) djeluje okomito na poklopac, van iz fluida. T (plavo) djeluje okomito prema unutra pri spojnici B da zatvori poklopac.</text>
</svg>