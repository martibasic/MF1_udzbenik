<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" role="img" aria-labelledby="u05v3kp_title u05v3kp_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:880px;height:auto;">
  <title id="u05v3kp_title">Kosi inspekcijski poklopac na talozniku</title>
  <desc id="u05v3kp_desc">Lijevo: taloznik s kosom stijenkom pod 60 stupnjeva, pravokutni poklopac (b=0,90 m, L=1,20 m) ovjesen zglobom A na dubini 0,80 m, spojnica T na donjem rubu B. Sila F okomito na poklopac iz fluida, polozaj centra tlaka CP. Desno: stack formula i rezultati F=13,95 kN, s_R=0,68 m, T=7,89 kN.</desc>

  <defs>
    <linearGradient id="u05v3kp_voda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aed6f1" />
      <stop offset="1" stop-color="#5b9ec9" />
    </linearGradient>
    <pattern id="u05v3kp_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#dbe1e6" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.1" />
    </pattern>
    <marker id="u05v3kp_aF" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#c0392b" />
    </marker>
    <marker id="u05v3kp_aT" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1e8449" />
    </marker>
    <marker id="u05v3kp_aP" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#1565c0" />
    </marker>
    <marker id="u05v3kp_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u05v3kp_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
  </defs>

  <!-- okvir -->
  <line x1="488" y1="36" x2="488" y2="464" stroke="#dce7f0" stroke-width="1.2" stroke-dasharray="4,5" />

  <!-- ============================================================ -->
  <!-- ===================== LIJEVO: MODEL ======================== -->
  <!-- ============================================================ -->
  <!--
    Mjerilo: 100 px / m
    Slobodna povrsina:  y = 120
    Zglob A:            (340, 200)   ->  h_A = (200-120)/100 = 0,80 m
    Smjer plohe (A->B): (cos60, sin60) = (0.5, 0.866); L = 120 px = 1,20 m
    B (donji rub):      (400, 304)
    Centroid C (L/2):   (370, 252)
    Centar tlaka CP (s_R = 67,9 px od A): (340 + 33.95, 200 + 58.80) = (374, 259)
    Vanjska normala (iz fluida prema van): (0.866, -0.5)
    Fluid je dolje-lijevo od plohe (taloznik je s lijeve strane).
  -->

  <!-- Voda u talozniku: surface horizontalna do (294,120), pa duz unutarnjeg ruba kose stijenke do A, niz poklopac do B, niz unutarnji rub donjeg dijela kose stijenke do dna, pa do lijevog ruba -->
  <polygon points="60,120 294,120 340,200 400,304 400,394 60,394" fill="url(#u05v3kp_voda)" />

  <!-- dno taloznika (puna debela hatched) -->
  <rect x="48" y="394" width="370" height="14" fill="url(#u05v3kp_hatch)" stroke="#3a4a56" stroke-width="1.4" />

  <!-- lijeva vertikalna stijenka taloznika (puna, hatched) -->
  <rect x="48" y="100" width="12" height="296" fill="url(#u05v3kp_hatch)" stroke="#3a4a56" stroke-width="1.4" />

  <!-- kosa stijenka gornji dio: iznad poklopca, od povrsine zida do A -->
  <!-- vanjski offset stijenke u smjeru vanjske normale (0.866,-0.5) * 14 px = (12.1, -7) -->
  <!-- unutrasnji rub: (294,120) -> (340,200);  vanjski rub: +12,-7 -->
  <polygon points="294,120 340,200 352,193 306,113" fill="url(#u05v3kp_hatch)" stroke="#3a4a56" stroke-width="1.3" />

  <!-- kosa stijenka donji dio: ispod poklopca, od B do dna -->
  <polygon points="400,304 400,394 412,394 412,297" fill="url(#u05v3kp_hatch)" stroke="#3a4a56" stroke-width="1.3" />

  <!-- slobodna povrsina (puna plava linija) -->
  <line x1="60" y1="120" x2="294" y2="120" stroke="#1565c0" stroke-width="2.2" />
  <!-- oznaka voda u sredini fluida -->
  <!-- ============== POKLOPAC (A->B) ============== -->
  <!-- metalni "sandwich" prikaz: tamna podloga + svjetla traka -->
  <line x1="340" y1="200" x2="400" y2="304" stroke="#3a4a56" stroke-width="11" stroke-linecap="butt" />
  <line x1="340" y1="200" x2="400" y2="304" stroke="#909fa8" stroke-width="6" stroke-linecap="butt" />

  <!-- ============== ZGLOB A ============== -->
  <circle cx="340" cy="200" r="6.5" fill="#ffffff" stroke="#1a2530" stroke-width="1.8" />
  <circle cx="340" cy="200" r="2.6" fill="#1a2530" />
  <!-- ============== SPOJNICA B (donji rub) ============== -->
  <circle cx="400" cy="304" r="6.5" fill="#ffffff" stroke="#1a2530" stroke-width="1.8" />
  <circle cx="400" cy="304" r="2.6" fill="#1a2530" />
  <!-- ============== CENTROID C (leader prema fluidnoj strani) ============== -->
  <circle cx="370" cy="252" r="3.4" fill="#ffffff" stroke="#1a2530" stroke-width="1.4" />
  <line x1="368" y1="253" x2="356" y2="248" stroke="#1a2530" stroke-width="0.7" />
  <!-- ============== CENTAR TLAKA CP (oznaka odmaknuta gore-desno, na vanjsku stranu uz F) ============== -->
  <circle cx="374" cy="259" r="4.2" fill="#c0392b" stroke="#ffffff" stroke-width="1.4" />

  <!-- ============== SILA F (crvena, okomito na poklopac, iz fluida van) ============== -->
  <!-- F od CP u smjeru (0.866, -0.5), duljina 70 px; vrh u (434.6, 224) -->
  <line x1="374" y1="259" x2="434.6" y2="224" stroke="#c0392b" stroke-width="2.6" marker-end="url(#u05v3kp_aF)" />
  <!-- CP oznaka uz pocetak strelice -->
  <!-- F oznaka iznad vrha strelice -->
  <!-- ============== SILA T (zelena, okomito na poklopac, prema fluidu - zatvara poklopac) ============== -->
  <!-- T djeluje OD vanjske spojnice prema poklopcu (zatvara). Vrh strelice na B, rep dolje-desno. -->
  <!-- Rep: B + (0.866, -0.5)*52 = (445.0, 278); vrh u B -->
  <line x1="445.0" y1="278" x2="402.5" y2="302.7" stroke="#1e8449" stroke-width="2.6" marker-end="url(#u05v3kp_aT)" />
  <!-- Tlacne strelice uklonjene jer bi se preklapale s kotom L na fluidnoj strani -->
  <!-- Zadrzimo samo malu textnu naznaku porasta tlaka (vidljiva iz kote sˇsinθ) -->


  <!-- ============== KOTA h_A ============== -->
  <!-- vertikalna kota lijevo od A: y od 120 (povrsina) do 200 (A), x = 270 -->
  <!-- ============== KOTA L (duz plohe, na fluidnoj strani) ============== -->
  <!-- offset prema dolje-lijevo (-0.866, 0.5) za 50 px: dA = (-43.3, 25), dB = (-43.3, 25) -->
  <!-- A' = (296.7, 225); B' = (356.7, 329) -->
  <!-- label rotated to follow plate; midpoint segmenta (326.7,276.5), pomaknuti dolje-lijevo (-0.866,0.5)*16 = (-13.9, 8) -->
  <!-- ============== KUT theta = 60 stupnjeva (kod A, na vanjskoj strani plohe) ============== -->
  <!-- Vodoravna referentna kroz A prema desno (van fluida, dashed) -->
  <line x1="340" y1="200" x2="372" y2="200" stroke="#7a8a96" stroke-width="0.9" stroke-dasharray="4,3" />
  <!-- Arc od horizontale-desno do kose plohe, sweep clockwise. Polumjer 16 (kompaktno). -->
  <!-- ============== KOTA b (sirina, izvan ravnine) - napomena ============== -->
  <!-- ============================================================ -->
  <!-- ===================== DESNO: FORMULE ======================= -->
  <!-- ============================================================ -->

  <!-- panel okvir -->
  <rect x="508" y="56" width="404" height="318" rx="10" fill="#f4f9fd" stroke="#1565c0" stroke-width="1.4" />
  <!-- header bar -->
  <rect x="508" y="56" width="404" height="34" rx="10" fill="#1565c0" />
  <rect x="508" y="74" width="404" height="16" fill="#1565c0" />
  <!-- ===== Blok 1: povrsina ===== -->
  <line x1="528" y1="164" x2="892" y2="164" stroke="#c8d6e4" stroke-width="1" />

  <!-- ===== Blok 2: dubina tezista ===== -->
  <line x1="528" y1="232" x2="892" y2="232" stroke="#c8d6e4" stroke-width="1" />

  <!-- ===== Blok 3: rezultantna sila ===== -->
  <line x1="528" y1="300" x2="892" y2="300" stroke="#c8d6e4" stroke-width="1" />

  <!-- ===== Blok 4: centar tlaka i sila spojnice ===== -->
  <!-- footer note italic -->
  <!-- ===== REZULTATI badge ===== -->
  <rect x="508" y="392" width="404" height="60" rx="9" fill="#eaf6ee" stroke="#1e8449" stroke-width="1.5" />
  <line x1="340" y1="120" x2="266" y2="120" stroke="#b7600c" stroke-width="0.7" />
  <line x1="340" y1="200" x2="266" y2="200" stroke="#b7600c" stroke-width="0.7" />
  <line x1="270" y1="120" x2="270" y2="200" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u05v3kp_dimL)" marker-end="url(#u05v3kp_dim)" />
  <line x1="340" y1="200" x2="296.7" y2="225" stroke="#b7600c" stroke-width="0.7" />
  <line x1="400" y1="304" x2="356.7" y2="329" stroke="#b7600c" stroke-width="0.7" />
  <line x1="297.6" y1="224.5" x2="355.8" y2="328.4" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u05v3kp_dimL)" marker-end="url(#u05v3kp_dim)" />
  <path d="M 356,200 A 16 16 0 0 1 348,213.86" fill="none" stroke="#b7600c" stroke-width="1.3" />
  <text x="40" y="56" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Inspekcijski poklopac na kosoj stijenci taloznika</text>

  <text x="68" y="113" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" fill="#1565c0">slobodna povrsina (p = 0)</text>

  <text x="160" y="346" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#0d47a1">voda</text>
  <text x="160" y="362" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#0d47a1">ρ = 998 kg/m³</text>

  <text x="325" y="194" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">A</text>

  <text x="408" y="313" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">B</text>

  <text x="352" y="251" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-style="italic" text-anchor="end" fill="#1a2530">C</text>

  <text x="388" y="265" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" font-weight="700" text-anchor="start" fill="#c0392b">CP</text>
  <text x="410" y="246" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#c0392b" text-anchor="start"><tspan font-weight="700" font-style="italic">F</tspan> ≈ 13,95 kN</text>

  <text x="420" y="325" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e8449" text-anchor="start"><tspan font-weight="700" font-style="italic">T</tspan> ≈ 7,89 kN</text>

  <text x="40" y="430" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78">Sirina poklopca okomito na ravninu skice: <tspan font-style="italic">b</tspan> = 0,90 m</text>
  <text x="40" y="446" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78"><tspan font-style="italic">F</tspan> djeluje okomito na poklopac iz fluida; <tspan font-style="italic">T</tspan> ga drzi zatvorenim.</text>

  <text x="710" y="78" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Hidrostatska sila na ravnu kosu plohu</text>

  <text x="710" y="112" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">povrsina poklopca</text>
  <text x="710" y="132" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">A</tspan> = <tspan font-style="italic">b L</tspan> = 0,90 · 1,20</text>
  <text x="710" y="151" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1565c0">= 1,08 m²</text>
  <text x="710" y="180" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">dubina tezista plohe</text>
  <text x="710" y="200" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">C</tspan> = <tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">A</tspan> + (<tspan font-style="italic">L</tspan>/2) sinθ = 0,80 + 0,60 · 0,866</text>
  <text x="710" y="219" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1565c0">= 1,320 m</text>
  <text x="710" y="248" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">rezultantna hidrostatska sila</text>
  <text x="710" y="268" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">F</tspan> = ρ <tspan font-style="italic">g A h</tspan><tspan baseline-shift="sub" font-size="0.7em">C</tspan> = 998 · 9,81 · 1,08 · 1,320</text>
  <text x="710" y="287" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#c0392b">≈ 13 950 N ≈ 13,95 kN</text>
  <text x="710" y="316" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">centar tlaka (duz plohe od A) i sila spojnice</text>
  <text x="710" y="336" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">s</tspan><tspan baseline-shift="sub" font-size="0.7em">R</tspan> ≈ 0,68 m,  <tspan font-style="italic">T</tspan> = <tspan font-style="italic">F s</tspan><tspan baseline-shift="sub" font-size="0.7em">R</tspan> / <tspan font-style="italic">L</tspan></text>
  <text x="710" y="355" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1e8449">= 13,95 · 0,68 / 1,20 ≈ 7,89 kN</text>

  <text x="710" y="370" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" text-anchor="middle" fill="#5a6a78">Centar tlaka mjeri se duz plohe (s), ne vertikalno.</text>

  <text x="710" y="409" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#5a6a78">REZULTATI</text>
  <text x="582" y="436" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#c0392b"><tspan font-style="italic">F</tspan> ≈ 13,95 kN</text>
  <text x="838" y="436" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1e8449"><tspan font-style="italic">T</tspan> ≈ 7,89 kN</text>
<text x="263" y="164" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="end" fill="#b7600c"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">A</tspan> = 0,80 m</text>

  <text x="312.8" y="284.5" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#b7600c" transform="rotate(60,312.8,284.5)" text-anchor="middle"><tspan font-style="italic">L</tspan> = 1,20 m</text>

  <text x="358" y="216" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#b7600c">θ = 60°</text>

  <text x="710" y="436" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">s</tspan><tspan baseline-shift="sub" font-size="0.7em">R</tspan> ≈ 0,68 m</text>
  </svg>