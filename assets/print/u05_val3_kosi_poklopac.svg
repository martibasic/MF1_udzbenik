<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 512" role="img" aria-labelledby="u05v3kp_title u05v3kp_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:880px;height:auto;">
  <title id="u05v3kp_title">Kosi inspekcijski poklopac na taložniku</title>
  <desc id="u05v3kp_desc">Lijevo: taložnik s kosom stijenkom pod 60 stupnjeva, pravokutni poklopac (b=0,90 m, L=1,20 m) ovješen zglobom A na dubini 0,80 m, spojnica T na donjem rubu B. Sila F okomito na poklopac iz fluida, položaj centra tlaka CP. Desno: pregled formula i rezultati F=13,95 kN, s_R=0,68 m, T=7,89 kN.</desc>
  <defs>
    <pattern id="u05v3kp_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.1" />
    </pattern>
    <marker id="u05v3kp_aF" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#356b83" />
    </marker>
    <marker id="u05v3kp_aT" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#356b83" />
    </marker>
    <marker id="u05v3kp_aP" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#356b83" />
    </marker>
    <marker id="u05v3kp_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#657781" />
    </marker>
    <marker id="u05v3kp_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#657781" />
    </marker>
  </defs>
  <polygon points="60,120 294,120 340,200 400,304 400,394 60,394" fill="#dcebf1" />
  <rect x="48" y="394" width="370" height="14" fill="url(#u05v3kp_hatch)" stroke="#3a4a56" stroke-width="1.4" />
  <rect x="48" y="100" width="12" height="296" fill="url(#u05v3kp_hatch)" stroke="#3a4a56" stroke-width="1.4" />
  <polygon points="294,120 340,200 352,193 306,113" fill="url(#u05v3kp_hatch)" stroke="#3a4a56" stroke-width="1.3" />
  <polygon points="400,304 400,394 412,394 412,297" fill="url(#u05v3kp_hatch)" stroke="#3a4a56" stroke-width="1.3" />
  <line x1="60" y1="120" x2="294" y2="120" stroke="#356b83" stroke-width="2.2" />
  <line x1="340" y1="200" x2="400" y2="304" stroke="#3a4a56" stroke-width="11" stroke-linecap="butt" />
  <line x1="340" y1="200" x2="400" y2="304" stroke="#3a4a56" stroke-width="6" stroke-linecap="butt" />
  <circle cx="340" cy="200" r="6.5" fill="#ffffff" stroke="#3a4a56" stroke-width="1.8" />
  <circle cx="340" cy="200" r="2.6" fill="#3a4a56" />
  <circle cx="400" cy="304" r="6.5" fill="#ffffff" stroke="#3a4a56" stroke-width="1.8" />
  <circle cx="400" cy="304" r="2.6" fill="#3a4a56" />
  <circle cx="370" cy="252" r="3.4" fill="#ffffff" stroke="#3a4a56" stroke-width="1.4" />
  <line x1="368" y1="253" x2="356" y2="248" stroke="#3a4a56" stroke-width="0.7" />
  <circle cx="374" cy="259" r="4.2" fill="#356b83" stroke="#c5cdd3" stroke-width="1.4" />
  <line x1="374" y1="259" x2="434.6" y2="224" stroke="#356b83" stroke-width="2.6" marker-end="url(#u05v3kp_aF)" />
  <line x1="445.0" y1="278" x2="402.5" y2="302.7" stroke="#356b83" stroke-width="2.6" marker-end="url(#u05v3kp_aT)" />
  <line x1="340" y1="200" x2="372" y2="200" stroke="#657781" stroke-width="0.9" stroke-dasharray="4,3" />
  <line x1="340" y1="120" x2="266" y2="120" stroke="#657781" stroke-width="0.7" />
  <line x1="340" y1="200" x2="266" y2="200" stroke="#657781" stroke-width="0.7" />
  <line x1="270" y1="120" x2="270" y2="200" stroke="#657781" stroke-width="1.3" marker-start="url(#u05v3kp_dimL)" marker-end="url(#u05v3kp_dim)" />
  <line x1="340" y1="200" x2="296.7" y2="225" stroke="#657781" stroke-width="0.7" />
  <line x1="400" y1="304" x2="356.7" y2="329" stroke="#657781" stroke-width="0.7" />
  <line x1="297.6" y1="224.5" x2="355.8" y2="328.4" stroke="#657781" stroke-width="1.3" marker-start="url(#u05v3kp_dimL)" marker-end="url(#u05v3kp_dim)" />
  <path d="M 356,200 A 16 16 0 0 1 348,213.86" fill="none" stroke="#657781" stroke-width="1.3" />
  <text x="40" y="56" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" fill="#263746">Inspekcijski poklopac na kosoj stijenci taložnika</text>
  <text x="68" y="113" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" font-style="italic" fill="#263746">slobodna površina (p = 0)</text>
  <text x="160" y="346" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-style="italic" fill="#263746">voda</text>
  <text x="160" y="362" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" fill="#263746">ρ = 998 kg/m³</text>
  <text x="325" y="194" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" fill="#263746">A</text>
  <text x="408" y="313" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" fill="#263746">B</text>
  <text x="352" y="251" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" font-style="italic" text-anchor="end" fill="#263746">C</text>
  <text x="388" y="265" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" font-weight="700" text-anchor="start" fill="#263746">CP</text>
  <text x="410" y="246" font-family="Arial, Liberation Sans, sans-serif" font-size="13" fill="#263746" text-anchor="start">
    <tspan font-weight="700" font-style="italic">F</tspan> ≈ 13,95 kN</text>
  <text x="420" y="325" font-family="Arial, Liberation Sans, sans-serif" font-size="13" fill="#263746" text-anchor="start">
    <tspan font-weight="700" font-style="italic">T</tspan> ≈ 7,89 kN</text>
  <text x="40" y="430" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" fill="#263746">Širina poklopca okomito na ravninu skice: <tspan font-style="italic">b</tspan> = 0,90 m</text>
  <text x="40" y="446" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" fill="#263746">
    <tspan font-style="italic">F</tspan> djeluje okomito na poklopac iz fluida; <tspan font-style="italic">T</tspan> ga drži zatvorenim.</text>
  <text x="710" y="78" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">Hidrostatska sila na ravnu kosu plohu</text>
  <text x="710" y="112" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">površina poklopca</text>
  <text x="710" y="132" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">A</tspan> = <tspan font-style="italic">b L</tspan> = 0,90 · 1,20</text>
  <text x="710" y="151" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#263746">= 1,08 m²</text>
  <text x="710" y="180" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">dubina težišta plohe</text>
  <text x="710" y="200" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">C</tspan> = <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">A</tspan> + (<tspan font-style="italic">L</tspan>/2) sinθ = 0,80 + 0,60 · 0,866</text>
  <text x="710" y="219" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 9)">= 1,320 m</text>
  <text x="710" y="248" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">rezultantna hidrostatska sila</text>
  <text x="710" y="268" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">F</tspan> = ρ <tspan font-style="italic">g A h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">C</tspan> = 998 · 9,81 · 1,08 · 1,320</text>
  <text x="710" y="287" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 9)">≈ 13 950 N ≈ 13,95 kN</text>
  <text x="710" y="316" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">centar tlaka (duž plohe od A) i sila spojnice</text>
  <text x="710" y="336" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-style="italic">s</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">CP</tspan> ≈ 0,68 m,  <tspan font-style="italic">T</tspan> = <tspan font-style="italic">F s</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">CP</tspan> / <tspan font-style="italic">L</tspan>
  </text>
  <text x="710" y="355" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 9)">= 13,95 · 0,68 / 1,20 ≈ 7,89 kN</text>
  <text x="710" y="370" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" font-style="italic" text-anchor="middle" fill="#263746" transform="translate(0 12)">Centar tlaka mjeri se duž plohe (s), ne vertikalno.</text>
  <text x="710" y="409" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 12)">REZULTATI</text>
  <text x="582" y="436" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 12)">
    <tspan font-style="italic">F</tspan> ≈ 13,95 kN</text>
  <text x="838" y="436" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 12)">
    <tspan font-style="italic">T</tspan> ≈ 7,89 kN</text>
  <text x="263" y="164" font-family="Arial, Liberation Sans, sans-serif" font-size="12" text-anchor="end" fill="#263746">
    <tspan font-style="italic">h</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">A</tspan> = 0,80 m</text>
  <text x="312.8" y="284.5" font-family="Arial, Liberation Sans, sans-serif" font-size="12" fill="#263746" transform="rotate(60,312.8,284.5)" text-anchor="middle">
    <tspan font-style="italic">L</tspan> = 1,20 m</text>
  <text x="358" y="216" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" fill="#263746">θ = 60°</text>
  <text x="710" y="436" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 12)">
    <tspan font-style="italic">s</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">CP</tspan> ≈ 0,68 m</text>
</svg>
