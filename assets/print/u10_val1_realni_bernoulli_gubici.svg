<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" role="img" aria-labelledby="u10v1rbg_u10v1-title u10v1-sub" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <defs>
    <linearGradient id="u10v1rbg_u10v1-wg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4eef8"/>
      <stop offset="100%" stop-color="#7ec8e8"/>
    </linearGradient>
    <pattern id="u10v1rbg_u10v1-sraf" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#8090a0"/>
      <line x1="0" y1="8" x2="8" y2="0" stroke="#546e7a" stroke-width="1.8"/>
    </pattern>
    <marker id="u10v1rbg_u10v1-arrG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#0f766e"/>
    </marker>
    <marker id="u10v1rbg_u10v1-arrR" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#b42318"/>
    </marker>
    <marker id="u10v1rbg_u10v1-arrRrev" markerWidth="10" markerHeight="10" refX="4" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L6,3 z" fill="#b42318"/>
    </marker>
    <marker id="u10v1rbg_u10v1-arrO" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#c49a0a"/>
    </marker>
    <marker id="u10v1rbg_u10v1-arrOrev" markerWidth="10" markerHeight="10" refX="4" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L6,3 z" fill="#c49a0a"/>
    </marker>
  </defs>
  <rect width="940" height="400" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="352" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>
  <title id="u10v1rbg_u10v1-title">U10 Val 1 – Gubitci u horizontalnoj cijevi</title>
  <desc id="u10v1rbg_u10v1-desc">Horizontalna cijev D=0,12 m, L=36 m s ventilom: EGL pada u dva linearna odsječka s lokalnim stupnjastim padom na ventilu, HGL paralelan s EGL.</desc>
  <!-- Titles -->
  <!-- Srafura walls -->
  <rect x="110" y="140" width="640" height="46" fill="url(#u10v1rbg_u10v1-sraf)"/>
  <rect x="110" y="222" width="640" height="46" fill="url(#u10v1rbg_u10v1-sraf)"/>
  <!-- Water body -->
  <rect x="110" y="186" width="640" height="36" fill="url(#u10v1rbg_u10v1-wg)" stroke="#546e7a" stroke-width="1.5"/>
  <!-- Gate valve at x=425 -->
  <rect x="415" y="186" width="20" height="36" fill="#fffef6" stroke="#c49a0a" stroke-width="2"/>
  <polygon points="415,186 435,186 425,204" fill="#c49a0a"/>
  <polygon points="415,222 435,222 425,204" fill="#c49a0a"/>
  <!-- Section dashed lines -->
  <line x1="188" y1="120" x2="188" y2="278" stroke="#546e7a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="660" y1="120" x2="660" y2="278" stroke="#546e7a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- Section circles -->
  <circle cx="188" cy="283" r="12" fill="#173043"/>
  <text x="188" y="287" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="white" text-anchor="middle" dominant-baseline="middle">①</text>
  <circle cx="660" cy="283" r="12" fill="#173043"/>
  <text x="660" y="287" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="white" text-anchor="middle" dominant-baseline="middle">②</text>
  <!-- EGL: (188,118)→(425,138) step (425,160)→(660,180), dashed dark red -->
  <polyline points="188,118 425,138" stroke="#b42318" stroke-width="3" fill="none" stroke-dasharray="9 5"/>
  <line x1="425" y1="138" x2="425" y2="160" stroke="#b42318" stroke-width="3"/>
  <polyline points="425,160 660,180" stroke="#b42318" stroke-width="3" fill="none" stroke-dasharray="9 5"/>
  <text x="110" y="115" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#b42318">EGL</text>
  <!-- HGL: 8px below EGL (representing v²/2g=0,294 m) -->
  <polyline points="188,126 425,146" stroke="#6d2694" stroke-width="2.5" fill="none" stroke-dasharray="7 4"/>
  <line x1="425" y1="146" x2="425" y2="168" stroke="#6d2694" stroke-width="2.5" stroke-dasharray="7 4"/>
  <polyline points="425,168 660,188" stroke="#6d2694" stroke-width="2.5" fill="none" stroke-dasharray="7 4"/>
  <text x="110" y="132" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#6d2694">HGL</text>
  <!-- h_w total annotation: reference line at y=97, arrow down to EGL end -->
  <line x1="188" y1="97" x2="660" y2="97" stroke="#b42318" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="188" y1="97" x2="188" y2="118" stroke="#b42318" stroke-width="1.5"/>
  <line x1="660" y1="97" x2="660" y2="180" stroke="#b42318" stroke-width="2" marker-end="url(#u10v1rbg_u10v1-arrR)"/>
  <text x="424" y="92" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#b42318" text-anchor="middle">h_w = 3,82 m</text>
  <!-- v²/2g bracket at section ① -->
  <line x1="158" y1="118" x2="158" y2="126" stroke="#546e7a" stroke-width="1.5" marker-start="url(#u10v1rbg_u10v1-arrRrev)" marker-end="url(#u10v1rbg_u10v1-arrR)"/>
  <text x="72" y="122" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#546e7a" text-anchor="middle">v²/2g</text>
  <text x="72" y="135" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#546e7a" text-anchor="middle">=0,294 m</text>
  <!-- h_loc step annotation -->
  <line x1="445" y1="138" x2="505" y2="138" stroke="#c49a0a" stroke-width="1.2"/>
  <line x1="445" y1="160" x2="505" y2="160" stroke="#c49a0a" stroke-width="1.2"/>
  <line x1="505" y1="138" x2="505" y2="160" stroke="#c49a0a" stroke-width="2" marker-start="url(#u10v1rbg_u10v1-arrOrev)" marker-end="url(#u10v1rbg_u10v1-arrO)"/>
  <text x="514" y="152" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#c49a0a" dominant-baseline="middle">h_loc = 1,35 m</text>
  <!-- h_l annotation (two diagonal sections) -->
  <text x="295" y="158" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#b42318" text-anchor="middle">trenje</text>
  <text x="545" y="170" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#b42318" text-anchor="middle">trenje</text>
  <text x="295" y="173" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b42318" text-anchor="middle">h_l,1 = 1,235 m</text>
  <text x="545" y="185" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b42318" text-anchor="middle">h_l,2 = 1,235 m</text>
  <!-- Flow arrows in pipe -->
  <line x1="130" y1="204" x2="205" y2="204" stroke="#0f766e" stroke-width="3" marker-end="url(#u10v1rbg_u10v1-arrG)"/>
  <line x1="480" y1="204" x2="555" y2="204" stroke="#0f766e" stroke-width="3" marker-end="url(#u10v1rbg_u10v1-arrG)"/>
  <text x="215" y="208" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#0f766e">v = 2,4 m/s</text>
  <!-- Ventil label -->
  <text x="425" y="248" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#c49a0a" text-anchor="middle">ventil</text>
  <text x="425" y="262" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677" text-anchor="middle">Σξ = 4,6</text>
  <!-- Pipe length dimension -->
  <line x1="110" y1="308" x2="750" y2="308" stroke="#546e7a" stroke-width="1.2"/>
  <line x1="110" y1="303" x2="110" y2="313" stroke="#546e7a" stroke-width="1.2"/>
  <line x1="750" y1="303" x2="750" y2="313" stroke="#546e7a" stroke-width="1.2"/>
  <text x="430" y="324" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#546e7a" text-anchor="middle">L = 36 m,  D = 0,12 m</text>
  <!-- Formula box -->
  <rect x="752" y="110" width="152" height="178" rx="10" fill="#fffef6" stroke="#c49a0a" stroke-width="1.8"/>
  <text x="828" y="132" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#173043" text-anchor="middle">Rješenje</text>
  <text x="764" y="152" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043">v²/2g = 0,294 m</text>
  <text x="764" y="170" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#b42318">h_l = 2,47 m</text>
  <text x="764" y="188" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#c49a0a">Σh_loc = 1,35 m</text>
  <line x1="764" y1="196" x2="892" y2="196" stroke="#d3d9de" stroke-width="1"/>
  <text x="764" y="212" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#173043">h_w = 3,82 m</text>
  <text x="764" y="230" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043">Δp = 37,5 kPa</text>
  <text x="764" y="248" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677">= ρg·h_w</text>
  <text x="764" y="274" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677">horizontalna cijev</text>
  <!-- Footer -->
  <text x="54" y="375" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#516677">EGL-HGL razmak = v²/2g = konst. (stalni D). EGL pada → disipacija energije na trenju i ventilu.</text>
</svg>