<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="title">U10 Val 1 - realni Bernoulli i gubici</title>
  <desc id="desc">Minimalna tehnička skica horizontalne cijevi s linijskim i lokalnim gubicima te opadanjem EGL i HGL.</desc>
  <rect width="940" height="320" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="272" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>

  <text x="52" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#173043">U10 - Realni Bernoulli i gubici</text>
  <text x="52" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#516677">Horizontalna cijev s padom energije zbog trenja i lokalnog elementa</text>

  <line x1="112" y1="118" x2="806" y2="172" stroke="#be123c" stroke-width="5"/>
  <line x1="112" y1="154" x2="806" y2="208" stroke="#2563eb" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="110" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#173043">EGL</text>
  <text x="110" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#173043">HGL</text>

  <rect x="126" y="192" width="620" height="34" rx="10" fill="#dff1f8" stroke="#173043" stroke-width="3"/>
  <rect x="458" y="183" width="40" height="52" rx="6" fill="#f7d8c4" stroke="#c96c35" stroke-width="3"/>
  <line x1="478" y1="172" x2="478" y2="246" stroke="#c96c35" stroke-width="3"/>
  <line x1="462" y1="188" x2="494" y2="230" stroke="#c96c35" stroke-width="3"/>

  <line x1="170" y1="246" x2="170" y2="192" stroke="#6b7280" stroke-width="3"/>
  <line x1="714" y1="246" x2="714" y2="192" stroke="#6b7280" stroke-width="3"/>
  <text x="160" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#173043">1</text>
  <text x="706" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#173043">2</text>

  <line x1="760" y1="169" x2="760" y2="205" stroke="#c96c35" stroke-width="3" marker-start="url(#arrowOrangeSmall)" marker-end="url(#arrowOrange)"/>
  <text x="772" y="191" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#173043">v^2 / 2g</text>

  <line x1="196" y1="102" x2="736" y2="102" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="196" y1="102" x2="196" y2="118" stroke="#dc2626" stroke-width="2"/>
  <line x1="736" y1="102" x2="736" y2="172" stroke="#dc2626" stroke-width="2"/>
  <text x="382" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#173043">ukupni pad energije h_w</text>

  <text x="224" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">linijski gubitak h_l</text>
  <text x="432" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">ventil</text>
  <text x="504" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">lokalni gubitak h_loc</text>

  <line x1="150" y1="209" x2="252" y2="209" stroke="#0f766e" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <line x1="620" y1="209" x2="722" y2="209" stroke="#0f766e" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="268" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#173043">v</text>

  <text x="100" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#516677">Pad EGL pokazuje disipaciju, a razmak EGL - HGL predstavlja brzinsku visinu.</text>

  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#c96c35"/>
    </marker>
    <marker id="arrowOrangeSmall" markerWidth="10" markerHeight="10" refX="4" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L6,3 z" fill="#c96c35"/>
    </marker>
  </defs>
</svg>