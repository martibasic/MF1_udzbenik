      <stop offset="0%" stop-color="#aed6f1" />
      <stop offset="100%" stop-color="#5b9ec9" />
    </linearGradient>
    <linearGradient id="u05fup_tlak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0392b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#c0392b" stop-opacity="0.55" />
    </linearGradient>
    <pattern id="u05fup_beton" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.1" />
    </pattern>
    <marker id="u05fup_mFR" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
