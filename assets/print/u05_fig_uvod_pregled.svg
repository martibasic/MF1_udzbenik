  <text x="201" y="45" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">Fizikalni model</text>
  <text x="84" y="113" font-family="Arial, Liberation Sans, sans-serif" font-size="10" fill="#263746">slobodna površina</text>
  <text x="92" y="232" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" fill="#263746">
    <tspan font-weight="700">p</tspan> = ρg·h<tspan baseline-shift="sub" font-size="0.7em">t</tspan>  (vrh)</text>
  <text x="92" y="372" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" fill="#263746">
    <tspan font-weight="700">p</tspan> = ρg·h<tspan baseline-shift="sub" font-size="0.7em">d</tspan>  (dno)</text>
  <text x="92" y="400" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" fill="#263746">voda ρ</text>
  <text x="278" y="280" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" font-weight="700" fill="#263746" text-anchor="end">C</text>
  <text x="278" y="318.5959595959596" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" font-weight="700" fill="#263746" text-anchor="end">CP</text>
  <text x="325" y="299" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-style="italic" fill="#263746">
    <tspan font-weight="700">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">R</tspan>
  </text>
  <text x="178" y="208" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" fill="#263746">
    <tspan font-weight="700">A</tspan> – površina plohe</text>
  <text x="201" y="450" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#263746">Sila je integral linearne raspodjele tlaka po plohi.</text>
  <text x="201" y="467" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#263746">CP je uvijek ispod težišta C jer tlak raste s dubinom.</text>
  <text x="201" y="486" font-family="Arial, Liberation Sans, sans-serif" font-size="10" text-anchor="middle" font-style="italic" fill="#263746">Iznos i hvatište određuju opterećenje zgloba i ukruta.</text>
  <text x="510" y="45" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">Ključne jednadžbe</text>
  <text x="510" y="80" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#263746">Rezultantna sila</text>
  <text x="510" y="112" font-family="Arial, Liberation Sans, sans-serif" font-size="20" font-style="italic" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-weight="700">F</tspan> = ρ g A h<tspan baseline-shift="sub" font-size="0.7em">C</tspan>
  </text>
  <text x="510" y="134" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#263746">tlak u težištu × površina plohe</text>
  <text x="510" y="170" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#263746">Dubina centra tlaka</text>
  <text x="510" y="198" font-family="Arial, Liberation Sans, sans-serif" font-size="17" font-style="italic" font-weight="700" text-anchor="middle" fill="#263746">h<tspan baseline-shift="sub" font-size="0.75em">CP</tspan> = h<tspan baseline-shift="sub" font-size="0.75em">C</tspan> + I<tspan baseline-shift="sub" font-size="0.75em">G</tspan>/(A h<tspan baseline-shift="sub" font-size="0.75em">C</tspan>)</text>
  <text x="510" y="218" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#263746">I<tspan baseline-shift="sub" font-size="0.7em">G</tspan> – aksijalni moment površine oko C</text>
  <text x="510" y="254" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#263746">I<tspan baseline-shift="sub" font-size="0.7em">G</tspan> za tipične ravne plohe</text>
  <text x="416" y="276" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" fill="#263746">Pravokutnik (b×h):</text>
  <text x="604" y="276" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" font-style="italic" text-anchor="end" fill="#263746">b·h³ / 12</text>
  <text x="416" y="294" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" fill="#263746">Trokut (b×h):</text>
  <text x="604" y="294" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" font-style="italic" text-anchor="end" fill="#263746">b·h³ / 36</text>
  <text x="416" y="312" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" fill="#263746">Krug (d):</text>
  <text x="604" y="312" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" font-style="italic" text-anchor="end" fill="#263746">π·d⁴ / 64</text>
  <text x="510" y="350" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#263746">Nagnuta ploha (kut θ)</text>
  <text x="510" y="374" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-style="italic" font-weight="700" text-anchor="middle" fill="#263746">
    <tspan font-weight="700">F</tspan> = ρ g A h<tspan baseline-shift="sub" font-size="0.7em">C</tspan>  (isti oblik)</text>
  <text x="510" y="394" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#263746">sila ne ovisi o nagibu, samo o A i h<tspan baseline-shift="sub" font-size="0.7em">C</tspan>
  </text>
  <text x="510" y="442" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#263746">PROJEKTNI KRITERIJ</text>
  <text x="510" y="461" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">iznos sile → nosivost ploče</text>
  <text x="510" y="476" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">hvatište sile → zglob, vijci, ukrute</text>
  <text x="799" y="45" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">Inženjerska primjena</text>
  <text x="799" y="76" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#263746">Inspekcijski poklopac u stijenci spremnika</text>
  <text x="672" y="103" font-family="Arial, Liberation Sans, sans-serif" font-size="10" fill="#263746">slobodna površina</text>
  <text x="675" y="160" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" fill="#263746">voda</text>
  <text x="672" y="178" font-family="Arial, Liberation Sans, sans-serif" font-size="10" fill="#263746">spremnik</text>
  <text x="800" y="220" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" font-weight="700" fill="#263746">zglob</text>
  <text x="800" y="372" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" font-weight="700" fill="#263746">vijak</text>
  <text x="748" y="291" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" font-weight="700" fill="#263746" text-anchor="end">C</text>
  <text x="748" y="318" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" font-weight="700" fill="#263746" text-anchor="end">CP</text>
  <text x="852" y="308" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-style="italic" fill="#263746">
    <tspan font-weight="700">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">R</tspan>
  </text>
  <text x="852" y="322" font-family="Arial, Liberation Sans, sans-serif" font-size="9.5" fill="#263746" transform="translate(0 9)">rezultanta</text>
  <text x="799" y="408" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#263746">Linearno rastući tlak → zglob nosi manju,</text>
  <text x="799" y="423" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#263746">a vijak veću komponentu reakcije.</text>
  <text x="799" y="442" font-family="Arial, Liberation Sans, sans-serif" font-size="10" text-anchor="middle" font-style="italic" fill="#263746">Pomak CP ispod C ključan je za odabir vijka.</text>
  <text x="799" y="481" font-family="Arial, Liberation Sans, sans-serif" font-size="10" text-anchor="middle" fill="#263746">brodske pregrade • brane • taložnici • servisni poklopci</text>
  <text x="42" y="206" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-style="italic" font-weight="700" fill="#263746" text-anchor="middle">h<tspan baseline-shift="sub" font-size="0.7em">C</tspan>
  </text>
  <text x="370" y="290" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-style="italic" font-weight="700" fill="#263746">H</text>
  <text x="932" y="174" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" font-weight="700" fill="#263746" text-anchor="middle">h<tspan baseline-shift="sub" font-size="0.7em">t</tspan>
  </text>
  <text x="903" y="298" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" font-weight="700" fill="#263746" text-anchor="middle">H</text>
</svg>
