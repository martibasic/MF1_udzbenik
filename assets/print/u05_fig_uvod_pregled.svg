  <text x="201" y="45" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">Fizikalni model</text>
  <text x="84" y="113" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#1565c0">slobodna povrsina</text>
  <text x="92" y="232" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#1565c0">
    <tspan font-weight="700">p</tspan> = ρg·h<tspan baseline-shift="sub" font-size="0.7em">t</tspan>  (vrh)</text>
  <text x="92" y="372" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#1565c0">
    <tspan font-weight="700">p</tspan> = ρg·h<tspan baseline-shift="sub" font-size="0.7em">d</tspan>  (dno)</text>
  <text x="92" y="400" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#0d47a1">voda ρ</text>
  <text x="278" y="280" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" font-weight="700" fill="#1e8449" text-anchor="end">C</text>
  <text x="278" y="318.5959595959596" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" font-weight="700" fill="#c0392b" text-anchor="end">CP</text>
  <text x="325" y="299" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#c0392b">
    <tspan font-weight="700">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">R</tspan>
  </text>
  <text x="178" y="208" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#1a2530">
    <tspan font-weight="700">A</tspan> – povrsina plohe</text>
  <text x="201" y="450" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#3a4a56">Sila je integral linearne raspodjele tlaka po plohi.</text>
  <text x="201" y="467" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#3a4a56">CP je uvijek ispod tezista C jer tlak raste s dubinom.</text>
  <text x="201" y="486" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" font-style="italic" fill="#5a6a78">Iznos i hvatiste odreduju opterecenje zgloba i ukruta.</text>
  <text x="510" y="45" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">Kljucne jednadzbe</text>
  <text x="510" y="80" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#5a6a78">Rezultantna sila</text>
  <text x="510" y="112" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-style="italic" font-weight="700" text-anchor="middle" fill="#1a2530">
    <tspan font-weight="700">F</tspan> = ρ g A h<tspan baseline-shift="sub" font-size="0.7em">C</tspan>
  </text>
  <text x="510" y="134" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#5a6a78">tlak u tezistu × povrsina plohe</text>
  <text x="510" y="170" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#5a6a78">Dubina centra tlaka</text>
  <text x="510" y="198" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-style="italic" font-weight="700" text-anchor="middle" fill="#1a2530">y<tspan baseline-shift="sub" font-size="0.7em">CP</tspan> = h<tspan baseline-shift="sub" font-size="0.7em">C</tspan> + I<tspan baseline-shift="sub" font-size="0.7em">G</tspan> / (A h<tspan baseline-shift="sub" font-size="0.7em">C</tspan>)</text>
  <text x="510" y="218" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#5a6a78">I<tspan baseline-shift="sub" font-size="0.7em">G</tspan> – aksijalni moment povrsine oko C</text>
  <text x="510" y="254" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1565c0">I<tspan baseline-shift="sub" font-size="0.7em">G</tspan> za tipicne ravne plohe</text>
  <text x="416" y="276" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1a2530">Pravokutnik (b×h):</text>
  <text x="604" y="276" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-style="italic" text-anchor="end" fill="#1a2530">b·h³ / 12</text>
  <text x="416" y="294" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1a2530">Trokut (b×h):</text>
  <text x="604" y="294" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-style="italic" text-anchor="end" fill="#1a2530">b·h³ / 36</text>
  <text x="416" y="312" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1a2530">Krug (d):</text>
  <text x="604" y="312" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-style="italic" text-anchor="end" fill="#1a2530">π·d⁴ / 64</text>
  <text x="510" y="350" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#5a6a78">Nagnuta ploha (kut α)</text>
  <text x="510" y="374" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" font-weight="700" text-anchor="middle" fill="#1a2530">
    <tspan font-weight="700">F</tspan> = ρ g A h<tspan baseline-shift="sub" font-size="0.7em">C</tspan>  (isti oblik)</text>
  <text x="510" y="394" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#5a6a78">sila ne ovisi o nagibu, samo o A i h<tspan baseline-shift="sub" font-size="0.7em">C</tspan>
  </text>
  <text x="510" y="442" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1e8449">PROJEKTNI KRITERIJ</text>
  <text x="510" y="461" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#1a2530">iznos sile → nosivost ploce</text>
  <text x="510" y="476" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#1a2530">hvatiste sile → zglob, vijci, ukrute</text>
  <text x="799" y="45" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#8b5e00">Inzenjerska primjena</text>
  <text x="799" y="76" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4a20">Inspekcijski poklopac u stijenci spremnika</text>
  <text x="672" y="103" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#1565c0">slobodna povrsina</text>
  <text x="675" y="160" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#0d47a1">voda</text>
  <text x="672" y="178" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#1a2530">spremnik</text>
  <text x="800" y="220" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" font-weight="700" fill="#3a4a56">zglob</text>
  <text x="800" y="372" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" font-weight="700" fill="#3a4a56">vijak</text>
  <text x="748" y="291" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" font-weight="700" fill="#1e8449" text-anchor="end">C</text>
  <text x="748" y="318" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" font-weight="700" fill="#c0392b" text-anchor="end">CP</text>
  <text x="852" y="308" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" fill="#c0392b">
    <tspan font-weight="700">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">R</tspan>
  </text>
  <text x="852" y="322" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#c0392b" transform="translate(0 9)">rezultanta</text>
  <text x="799" y="408" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#3a4a56">Linearno rastuci tlak → zglob nosi manju,</text>
  <text x="799" y="423" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#3a4a56">a vijak vecu komponentu reakcije.</text>
  <text x="799" y="442" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" font-style="italic" fill="#5a6a78">Pomak CP ispod C kljucan je za odabir vijka.</text>
  <text x="799" y="481" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#5a4a20">brodske pregrade • brane • taloznici • servisni poklopci</text>
  <text x="42" y="206" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" font-weight="700" fill="#b7600c" text-anchor="middle">h<tspan baseline-shift="sub" font-size="0.7em">C</tspan>
  </text>
  <text x="370" y="290" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" font-weight="700" fill="#b7600c">H</text>
  <text x="932" y="174" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" font-weight="700" fill="#b7600c" text-anchor="middle">h<tspan baseline-shift="sub" font-size="0.7em">t</tspan>
  </text>
  <text x="903" y="298" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" font-weight="700" fill="#b7600c" text-anchor="middle">H</text>
</svg>
