      <path d="M0,0 L0,5 L7,2.5 z" fill="#356b83" />
    </marker>
    <marker id="u05fup_mFp" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#356b83" />
    </marker>
