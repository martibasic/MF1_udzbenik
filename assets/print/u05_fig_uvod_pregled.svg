<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="u05fup_title u05fup_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="u05fup_title">Pregled poglavlja: Hidrostatske sile na ravne plohe</title>
  <desc id="u05fup_desc">Tri panela uvodnog bloka. Lijevo: vertikalna uronjena ploha u stijenci spremnika sa slobodnom površinom, linearnom raspodjelom tlaka, težištem C i centrom tlaka CP, rezultantnom silom F-R i kotama h-C i H. Sredina: ključne jednadžbe poglavlja F = ro g A h-C i y-CP = h-C + I-G / (A h-C). Desno: inženjerska primjena - inspekcijski poklopac u stijenci spremnika sa zglobom, vijcima i ukrutom.</desc>
  <defs>
