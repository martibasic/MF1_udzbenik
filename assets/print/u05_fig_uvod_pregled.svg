<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img"
     aria-labelledby="u05fup_u5pvT u05fup_u5pvD" preserveAspectRatio="xMidYMid meet"
     style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="u05fup_u5pvT">Pregled poglavlja U05 – Hidrostatske sile na ravne plohe</title>
  <desc id="u05fup_u5pvD">Tri panela: (1) Vertikalna uronjina ploha s trokutnom raspodjelom tlaka i rezultantom F_R u centru tlaka; (2) Ključne jednadžbe F=ρgAh_C i y_CP=h_C+I_G/(Ah_C); (3) Zasun na vodnoj brani – strojarsko-praktična primjena.</desc>
  <defs>
    <marker id="u05fup_u5pvaR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#c0392b"/>
    </marker>
    <marker id="u05fup_u5pvaDim" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#b7600c"/>
    </marker>
    <marker id="u05fup_u5pvaDimL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L0,8 L8,4 z" fill="#b7600c"/>
    </marker>
    <marker id="u05fup_u5pvaG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#1e8449"/>
    </marker>
    <linearGradient id="u05fup_u5pvfl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8e8f6"/><stop offset="100%" stop-color="#5baece"/>
    </linearGradient>
    <linearGradient id="u05fup_u5pvhdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a2e42"/><stop offset="100%" stop-color="#1a3a52"/>
    </linearGradient>
    <linearGradient id="u05fup_u5pvpres" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9a8a8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#e74c3c" stop-opacity="0.60"/>
    </linearGradient>
    <pattern id="u05fup_u5pvconc" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#9a9080" stroke-width="1.5"/>
    </pattern>
    <pattern id="u05fup_u5pvwall" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.8"/>
    </pattern>
  </defs>

  <!-- Pozadina -->
  <rect width="980" height="500" fill="#eef1f5"/>

  <!-- ═══════════════════ PANEL 1 – FIZIKALNI PRINCIP ═══════════════════ -->
  <rect x="12" y="54" width="356" height="436" rx="10" fill="#eaf4fb" stroke="#1565c0" stroke-width="1.8"/>
  <text x="190" y="75" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1565c0" text-anchor="middle">Fizikalni princip</text>
  <text x="190" y="91" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#3a5a7a" text-anchor="middle" font-style="italic">vertikalna uronjina ploha – raspodjela tlaka</text>

  <!-- Tijelo fluida -->
  <rect x="50" y="130" width="150" height="265" fill="url(#u05fup_u5pvfl)" opacity="0.88"/>
  <!-- Slobodna površina -->
  <line x1="45" y1="130" x2="205" y2="130" stroke="#1565c0" stroke-width="2.2"/>
  <text x="52" y="123" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#1565c0">slobodna površina</text>

  <!-- Trokutna raspodjela tlaka (lijevo od plohe, unutar fluida) -->
  <polygon points="200,130 200,395 90,395" fill="url(#u05fup_u5pvpres)" stroke="none"/>
  <!-- Kontura dijagrama -->
  <line x1="200" y1="130" x2="90" y2="395" stroke="#e74c3c" stroke-width="1.6" stroke-dasharray="5,3"/>

  <!-- Ploha (stijenka) -->
  <rect x="200" y="130" width="17" height="265" fill="#909fa8" stroke="#5d6d7e" stroke-width="1.6"/>

  <!-- p=0 i p=ρgH oznake -->
  <text x="204" y="125" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#c0392b">p = 0</text>
  <text x="90" y="410" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#c0392b">p = ρgH</text>

  <!-- Težište C (centroid) na y=263 = 130+(265/2) -->
  <circle cx="208" cy="263" r="4.5" fill="#1e8449"/>
  <line x1="217" y1="263" x2="258" y2="263" stroke="#1e8449" stroke-width="1.1" stroke-dasharray="3,3"/>
  <text x="262" y="260" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#1e8449" font-style="italic">C  (težište)</text>

  <!-- Centar tlaka CP na y=307 = 263+44 (H/6 pomak) -->
  <circle cx="208" cy="307" r="4.5" fill="#c0392b"/>
  <line x1="217" y1="307" x2="258" y2="307" stroke="#c0392b" stroke-width="1.1" stroke-dasharray="3,3"/>
  <text x="262" y="318" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#c0392b" font-style="italic">CP (centar tlaka)</text>

  <!-- F_R strelica (desna strana = downstream, prema van od plohe) -->
  <line x1="217" y1="307" x2="355" y2="307" stroke="#c0392b" stroke-width="3.0" marker-end="url(#u05fup_u5pvaR)"/>
  <text x="350" y="298" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" font-style="italic" fill="#c0392b" text-anchor="end">F_R</text>

  <!-- h_C kota (slobodna površina → težište) -->
  <line x1="68" y1="130" x2="73" y2="130" stroke="#b7600c" stroke-width="1.2"/>
  <line x1="68" y1="263" x2="73" y2="263" stroke="#b7600c" stroke-width="1.2"/>
  <line x1="70" y1="132" x2="70" y2="261" stroke="#b7600c" stroke-width="1.5"
        marker-start="url(#u05fup_u5pvaDimL)" marker-end="url(#u05fup_u5pvaDim)"/>
  <text x="60" y="202" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#b7600c" text-anchor="end">h_C</text>

  <!-- H kota (ukupna visina plohe) -->
  <line x1="35" y1="130" x2="40" y2="130" stroke="#b7600c" stroke-width="1.2"/>
  <line x1="35" y1="395" x2="40" y2="395" stroke="#b7600c" stroke-width="1.2"/>
  <line x1="37" y1="132" x2="37" y2="393" stroke="#b7600c" stroke-width="1.5"
        marker-start="url(#u05fup_u5pvaDimL)" marker-end="url(#u05fup_u5pvaDim)"/>
  <text x="27" y="266" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#b7600c" text-anchor="end">H</text>

  <!-- Napomene ispod scene -->
  <text x="190" y="432" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#2a3a56" text-anchor="middle" font-style="italic">CP je uvijek ispod težišta C jer dublje zone</text>
  <text x="190" y="446" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#2a3a56" text-anchor="middle" font-style="italic">fluida nose veći tlak i privlače hvatište.</text>
  <text x="190" y="463" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#2a3a56" text-anchor="middle">Pomak CP ispod C ključan je za</text>
  <text x="190" y="477" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#2a3a56" text-anchor="middle">dimenzioniranje zgloba i ukruta.</text>

  <!-- ═══════════════════ PANEL 2 – JEDNADŽBE ═══════════════════ -->
  <rect x="378" y="54" width="232" height="436" rx="10" fill="#eaf9f1" stroke="#1e8449" stroke-width="1.8"/>
  <text x="494" y="75" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1e8449" text-anchor="middle">Ključne jednadžbe</text>

  <!-- F = ρgAh_C -->
  <rect x="390" y="90" width="208" height="62" rx="8" fill="white" stroke="#1e8449" stroke-width="1.5"/>
  <text x="494" y="117" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-style="italic" font-weight="700" fill="#1a2530" text-anchor="middle">F = ρgAh_C</text>
  <text x="494" y="135" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a6a78" text-anchor="middle">A = površina, h_C = dubina težišta</text>
  <text x="494" y="147" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a6a78" text-anchor="middle">rezultantna hidrostatska sila</text>

  <!-- y_CP = h_C + I_G/(Ah_C) -->
  <rect x="390" y="164" width="208" height="60" rx="8" fill="white" stroke="#1565c0" stroke-width="1.5"/>
  <text x="494" y="186" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#1a2530" text-anchor="middle">y_CP = h_C + I_G/(Ah_C)</text>
  <text x="494" y="204" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a6a78" text-anchor="middle">centar tlaka – hvatište rezultante</text>
  <text x="494" y="216" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a6a78" text-anchor="middle">I_G = drugi moment površine oko C</text>

  <!-- I_G za tipične oblike -->
  <rect x="390" y="236" width="208" height="82" rx="8" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="494" y="254" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">I_G za tipične oblike:</text>
  <text x="396" y="273" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#1a2530">Pravokutnik:  I_G = bh³/12</text>
  <text x="396" y="291" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#1a2530">Trokut:        I_G = bh³/36</text>
  <text x="396" y="309" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#1a2530">Krug:           I_G = πd⁴/64</text>

  <!-- Kosa ploha -->
  <rect x="390" y="330" width="208" height="72" rx="8" fill="#fff8e1" stroke="#c49a0a" stroke-width="1.3"/>
  <text x="494" y="348" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#8b5e00" text-anchor="middle">Kosa ploha (kut θ)</text>
  <text x="494" y="364" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#3a4a56" text-anchor="middle">F = ρgAh_C — ista formula!</text>
  <text x="494" y="380" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#3a4a56" text-anchor="middle">s_CP = s_C + I_G/(A·s_C)</text>
  <text x="494" y="394" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a6a78" text-anchor="middle">s = koordinata uz plohu</text>

  <!-- Uvijek vrijedi: y_CP ≥ h_C -->
  <rect x="390" y="414" width="208" height="50" rx="8" fill="#f0e8f8" stroke="#8e44ad" stroke-width="1.3"/>
  <text x="494" y="432" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#6c2e8e" text-anchor="middle">Uvijek vrijedi:</text>
  <text x="494" y="450" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" fill="#1a2530" text-anchor="middle">y_CP ≥ h_C</text>
  <text x="494" y="462" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a4a78" text-anchor="middle">(CP dublje od težišta plohe)</text>

  <!-- ═══════════════════ PANEL 3 – PRIMJENA: ZASUN NA BRANI ═══════════════════ -->
  <rect x="620" y="54" width="352" height="436" rx="10" fill="#fef9e7" stroke="#c49a0a" stroke-width="1.8"/>
  <text x="796" y="75" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#8b5e00" text-anchor="middle">Primjena: zasun na vodnoj brani</text>
  <text x="796" y="91" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a4a20" text-anchor="middle" font-style="italic">pravokutni zasun – sila i hvatište na čepnom zatvoru</text>

  <!-- Uzvodni beton (lijevo od zasuna) -->
  <rect x="636" y="106" width="86" height="306" fill="#c8c0a8" stroke="#8a8060" stroke-width="1.8"/>
  <rect x="636" y="106" width="86" height="306" fill="url(#u05fup_u5pvconc)" opacity="0.45"/>

  <!-- Nizvodni beton (desno od zasuna) -->
  <rect x="836" y="106" width="118" height="306" fill="#c8c0a8" stroke="#8a8060" stroke-width="1.8"/>
  <rect x="836" y="106" width="118" height="306" fill="url(#u05fup_u5pvconc)" opacity="0.45"/>

  <!-- Beton iznad zasuna -->
  <rect x="722" y="106" width="114" height="88" fill="#c8c0a8" stroke="#8a8060" stroke-width="1.8"/>
  <rect x="722" y="106" width="114" height="88" fill="url(#u05fup_u5pvconc)" opacity="0.45"/>

  <!-- Beton ispod zasuna -->
  <rect x="722" y="366" width="114" height="46" fill="#c8c0a8" stroke="#8a8060" stroke-width="1.8"/>
  <rect x="722" y="366" width="114" height="46" fill="url(#u05fup_u5pvconc)" opacity="0.45"/>

  <!-- Voda uzvodno -->
  <rect x="636" y="150" width="86" height="262" fill="url(#u05fup_u5pvfl)" opacity="0.85"/>

  <!-- Slobodna površina -->
  <line x1="636" y1="150" x2="722" y2="150" stroke="#1565c0" stroke-width="2.2"/>
  <text x="638" y="143" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#1565c0">slobodna površina</text>

  <!-- Zasun (metalna ploča) -->
  <rect x="719" y="191" width="120" height="175" fill="#8a9aa8" stroke="#4a5a68" stroke-width="2.8"/>
  <!-- Križ na zasunu -->
  <line x1="719" y1="191" x2="839" y2="366" stroke="#6a7a88" stroke-width="1.3"/>
  <line x1="839" y1="191" x2="719" y2="366" stroke="#6a7a88" stroke-width="1.3"/>
  <!-- Vijci/boltovi -->
  <circle cx="728" cy="201" r="5" fill="#4a5a68"/>
  <circle cx="830" cy="201" r="5" fill="#4a5a68"/>
  <circle cx="728" cy="357" r="5" fill="#4a5a68"/>
  <circle cx="830" cy="357" r="5" fill="#4a5a68"/>
  <text x="779" y="283" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="white" text-anchor="middle">ZASUN</text>

  <!-- CP marker na uzvodnoj strani zasuna -->
  <!-- h₁=41, h₂=216, h_gate=175, h_C=128.5, y_C=278.5→279, offset=175²/(12*128.5)≈20, y_CP≈299 -->
  <circle cx="720" cy="299" r="5" fill="#c0392b"/>
  <text x="712" y="296" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-style="italic">CP</text>

  <!-- F_R strelica (prema nizvodnoj strani, desno) -->
  <line x1="839" y1="299" x2="962" y2="299" stroke="#c0392b" stroke-width="3.0" marker-end="url(#u05fup_u5pvaR)"/>
  <text x="965" y="297" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" font-style="italic" fill="#c0392b">F_R</text>

  <!-- h₁ kota (slobodna površina → gornji rub zasuna) -->
  <line x1="848" y1="150" x2="854" y2="150" stroke="#b7600c" stroke-width="1.2"/>
  <line x1="848" y1="191" x2="854" y2="191" stroke="#b7600c" stroke-width="1.2"/>
  <line x1="851" y1="152" x2="851" y2="189" stroke="#b7600c" stroke-width="1.5"
        marker-start="url(#u05fup_u5pvaDimL)" marker-end="url(#u05fup_u5pvaDim)"/>
  <text x="857" y="176" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#b7600c">h₁</text>

  <!-- h_g kota (visina zasuna) -->
  <line x1="848" y1="191" x2="854" y2="191" stroke="#b7600c" stroke-width="1.2"/>
  <line x1="848" y1="366" x2="854" y2="366" stroke="#b7600c" stroke-width="1.2"/>
  <line x1="851" y1="193" x2="851" y2="364" stroke="#b7600c" stroke-width="1.5"
        marker-start="url(#u05fup_u5pvaDimL)" marker-end="url(#u05fup_u5pvaDim)"/>
  <text x="857" y="284" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#b7600c">h_g</text>

  <!-- Formula box -->
  <rect x="636" y="424" width="328" height="46" rx="7" fill="white" stroke="#c49a0a" stroke-width="1.4"/>
  <text x="800" y="443" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#1a2530" text-anchor="middle">F_R = ρg·b·(h₂² − h₁²) / 2 = ρg·A·h_C</text>
  <text x="800" y="461" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a6a78" text-anchor="middle">h₂ = dubina dna zasuna, h₁ = dubina vrha zasuna</text>

  <!-- Strojarski kontekst -->
  <text x="636" y="484" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#3a4a56">Strojarski kontekst:</text>
  <text x="740" y="484" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a6a78">brane, ustave, brodske pregrade, servisni poklopci</text>
</svg>
