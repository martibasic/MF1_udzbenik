  <text x="100" y="318" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#516677">Koljeno 90°: D=100 mm, Q=26 L/s, p&#x2081;=180 kPa, p&#x2082;=150 kPa</text>
