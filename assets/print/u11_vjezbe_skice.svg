  <line x1="695" y1="420" x2="695" y2="368" stroke="#0f766e" stroke-width="2.5" marker-end="url(#u11vs-ag)"/>
  <text x="704" y="398" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#173043">v&#x2083;</text>
  <line x1="740" y1="455" x2="800" y2="455" stroke="#0f766e" stroke-width="2.5" marker-end="url(#u11vs-ag)"/>
  <text x="752" y="444" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#173043">v&#x2082;</text>
