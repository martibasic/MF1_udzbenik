  <line x1="100" y1="680" x2="54" y2="680" stroke="#b42318" stroke-width="2.5" marker-end="url(#u11vs-ar)"/>
  <text x="102" y="685" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b42318">R = ? (vlak)</text>
  <!-- Panel 6 (row3 col2): Z6 T3 - Y-raccva 60deg -->
  <rect x="484" y="524" width="416" height="190" rx="8" fill="#f8fafc" stroke="#c8d3da" stroke-width="1.5"/>
