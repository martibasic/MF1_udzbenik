  <text x="544" y="108" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#516677">Mlaz na plocu: F=310 N, d=42 mm  &#x2192;  v=? Q=?</text>
  <!-- Nozzle+jet -->
  <rect x="500" y="138" width="88" height="22" fill="#c8d6df" stroke="#2d3a40" stroke-width="1.5" rx="2"/>
