  </defs>
  <rect width="940" height="730" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="682" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>
  <!-- ===== PANEL GRID ===== -->
  <!-- Panel 1 (row1 col1): Z1 T1 - mlaz na plocu, d=38mm, v=22 m/s -->
  <rect x="40" y="92" width="416" height="196" rx="8" fill="#f8fafc" stroke="#c8d3da" stroke-width="1.5"/>
  <rect x="40" y="92" width="50" height="22" rx="5" fill="#173043"/>
  <text x="56" y="108" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">Z1 T1</text>
  <text x="100" y="108" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#516677">Slobodni mlaz na plocu: d=38 mm, v=22 m/s  &#x2192;  m&#x2D9;=? F=?</text>
  <!-- Nozzle+jet -->
