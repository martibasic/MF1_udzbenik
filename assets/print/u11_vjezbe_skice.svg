  <text x="500" y="540" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">Z6 T3</text>
  <text x="544" y="540" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#516677">Y-raccva 60°: D&#x2081;=140 mm, Q&#x2081;=40 L/s, p&#x2081;=185 kPa</text>
  <!-- Inlet pipe -->
