  <text x="162" y="660" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#173043">1</text>
  <text x="330" y="660" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#173043">2 (atm)</text>
