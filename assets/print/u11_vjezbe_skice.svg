  <text x="840" y="632" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#173043">2</text>
  <text x="726" y="524" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#173043">3</text>
