<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 730" width="940" role="img" aria-labelledby="u11vs-title" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <defs>
    <linearGradient id="u11vs-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4eef8"/>
      <stop offset="100%" stop-color="#7ec8e8"/>
    </linearGradient>
    <pattern id="u11vs-hatch" patternUnits="userSpaceOnUse" width="7" height="7">
      <rect width="7" height="7" fill="#8090a0"/>
      <line x1="0" y1="7" x2="7" y2="0" stroke="#546e7a" stroke-width="1.6"/>
    </pattern>
    <marker id="u11vs-ag" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0f766e"/>
    </marker>
    <marker id="u11vs-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#b42318"/>
    </marker>
    <marker id="u11vs-agr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#546e7a"/>
