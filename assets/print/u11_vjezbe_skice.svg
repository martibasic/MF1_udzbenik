  <text x="56" y="540" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">Z5 T3</text>
  <text x="100" y="540" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#516677">Mlaznica s vijcima: D&#x2081;=110, d=45 mm, Q=18 L/s, p&#x2081;=240 kPa</text>
