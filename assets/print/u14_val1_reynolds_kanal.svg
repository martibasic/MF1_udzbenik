    <text x="440" y="395" font-size="12" fill="#263746" text-anchor="middle">Parabolični profil brzine; strelice su lokalne brzine, a ne strujnice.</text>
    <text x="440" y="440" font-size="12" fill="#263746" text-anchor="middle">Usporedni crteži imaju isti unutarnji promjer. Debljina stijenke je shematska.</text>
