      <marker id="u14re_pressureMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
        <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
      </marker>
      <marker id="u14re_reactionMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
        <path d="M0 0 L7 3 L0 6 Z" fill="#356b83" />
      </marker>
      <marker id="u14re_axisMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
        <path d="M0 0 L7 3 L0 6 Z" fill="#3a4a56" />
      </marker>
    </defs>
    <text x="440" y="32" font-size="19" fill="#263746" text-anchor="middle" font-weight="700">Ista geometrija · različiti režimi strujanja</text>
    <rect id="u14re_p1top" x="150" y="97" width="600" height="9" rx="0" fill="url(#u14re_hatch)" stroke="#3a4a56" stroke-width="1.2" />
