<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="title">U13 Val 1 - cjevovod, Reynolds i gubici</title>
  <desc id="desc">Minimalna tehnička skica postupka za jednu dionicu cjevovoda: iz protoka se dobiva brzina, zatim Reynoldsov broj, koeficijent trenja i ukupni gubitak energije.</desc>
  <rect width="940" height="320" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="272" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>

  <text x="52" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#173043">U13 - Cjevovodi</text>
  <text x="52" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#516677">Redoslijed: Q -> v -> Re -> lambda -> h_w</text>

  <rect x="96" y="190" width="360" height="28" rx="10" fill="#dff1f8" stroke="#173043" stroke-width="3"/>
  <line x1="70" y1="204" x2="150" y2="204" stroke="#0f766e" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="76" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#173043">Q</text>
  <line x1="136" y1="168" x2="416" y2="168" stroke="#6b7280" stroke-width="2" marker-start="url(#arrowGray)" marker-end="url(#arrowGray)"/>
  <text x="264" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#173043">L</text>
  <line x1="472" y1="188" x2="472" y2="220" stroke="#c96c35" stroke-width="3" marker-start="url(#arrowOrangeSmall)" marker-end="url(#arrowOrange)"/>
  <text x="482" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#173043">D</text>
  <text x="232" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#173043">eps, sum xi</text>

  <rect x="148" y="108" width="126" height="38" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="314" y="108" width="126" height="38" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="480" y="108" width="146" height="38" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="666" y="108" width="146" height="38" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="184" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#173043">v = Q / A</text>
  <text x="348" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#173043">Re = vD / nu</text>
  <text x="516" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#173043">Moody -> lambda</text>
  <text x="706" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#173043">h_w = h_l + h_loc</text>
  <line x1="274" y1="127" x2="314" y2="127" stroke="#93c5fd" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="440" y1="127" x2="480" y2="127" stroke="#93c5fd" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="626" y1="127" x2="666" y2="127" stroke="#93c5fd" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <path d="M612 206 L650 178 L650 194 L776 194 L776 218 L650 218 L650 234 Z" fill="#eef7ff" stroke="#173043" stroke-width="3"/>
  <path d="M612 206 L650 152 L650 168 L776 168" fill="none" stroke="#173043" stroke-width="3"/>
  <path d="M650 244 L650 228 L776 228" fill="none" stroke="#173043" stroke-width="3"/>
  <text x="804" y="174" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">Q1</text>
  <text x="804" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">Q2</text>
  <text x="622" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#516677">paralela: isti h_w između čvorova</text>

  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#c96c35"/>
    </marker>
    <marker id="arrowOrangeSmall" markerWidth="10" markerHeight="10" refX="4" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L6,3 z" fill="#c96c35"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L6,3 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>