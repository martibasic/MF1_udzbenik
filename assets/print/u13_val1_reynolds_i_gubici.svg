<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="u13v1rig_title u13v1rig_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:880px;height:auto;">
  <title id="u13v1rig_title">Cjevovodna dionica Reynolds i ukupni gubici energije</title>
  <desc id="u13v1rig_desc">Lijevo: vodoravna dionica cijevi promjera D = 0,09 m i duljine L = 42 m s protokom Q = 0,018 m^3/s, apsolutnom hrapavoscu epsilon = 0,15 mm i lokalnim otporima koljena i ventila ciji je zbroj koeficijenata sigma ksi = 5,2. Desno: stog formula za povrsinu presjeka A, srednju brzinu v, Reynoldsov broj Re, brzinsku visinu v^2/2g, linijski gubitak h_l i lokalni gubitak sigma h_loc, sa zavrsnim ukupnim gubitkom h_w priblizno 7,3 m i badge rezultata.</desc>

  <defs>
    <linearGradient id="u13v1rig_voda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aed6f1" />
      <stop offset="1" stop-color="#5b9ec9" />
    </linearGradient>
    <pattern id="u13v1rig_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.1" />
    </pattern>
    <marker id="u13v1rig_flow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1e8449" />
    </marker>
    <marker id="u13v1rig_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u13v1rig_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u13v1rig_eps" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L6,2.5 z" fill="#b7600c" />
    </marker>
  </defs>

  <!-- okviri panela -->
  <line x1="478" y1="40" x2="478" y2="430" stroke="#dce7f0" stroke-width="1.2" stroke-dasharray="4,5" />

  <!-- ===================== LIJEVI PANEL: fizicki model ===================== -->
  <!-- vanjska kota L iznad cijevi -->
  <!-- cijev: 60..430 x, 172..238 y (visina 66 px) -->
  <!-- vanjski plast cijevi (stjenke) -->
  <rect x="60" y="166" width="370" height="8" fill="#909fa8" stroke="#3a4a56" stroke-width="1" />
  <rect x="60" y="236" width="370" height="8" fill="#5d6d7e" stroke="#3a4a56" stroke-width="1" />
  <!-- unutrasnjost cijevi - voda -->
  <rect x="60" y="174" width="370" height="62" fill="url(#u13v1rig_voda)" />
  <!-- prirubnice na krajevima -->
  <rect x="54" y="158" width="10" height="94" fill="#5d6d7e" stroke="#3a4a56" stroke-width="1" />
  <rect x="426" y="158" width="10" height="94" fill="#5d6d7e" stroke="#3a4a56" stroke-width="1" />

  <!-- ulazna strelica Q -->
  <line x1="26" y1="205" x2="52" y2="205" stroke="#1e8449" stroke-width="2.6" marker-end="url(#u13v1rig_flow)" />
  <!-- izlazna strelica -->
  <line x1="442" y1="205" x2="468" y2="205" stroke="#1e8449" stroke-width="2.6" marker-end="url(#u13v1rig_flow)" />

  <!-- strelica brzine v u sredini cijevi -->
  <line x1="120" y1="205" x2="220" y2="205" stroke="#1e8449" stroke-width="2.2" marker-end="url(#u13v1rig_flow)" />
  <!-- lokalni otpori: koljeno (oznaceno kao luk + ksi_1) na x=270 i ventil (kruzic s X i ksi_2) na x=370 -->
  <!-- koljeno simbol: nije pravo koljeno (cijev je ravna), nego shema lokalnog otpora kao "rebro" preko cijevi -->
  <!-- Lokalni otpor 1: zatvarac (kvadrat sa kosom plocom) -->
  <rect x="263" y="160" width="14" height="92" fill="#eaf1f6" stroke="#3a4a56" stroke-width="1.2" />
  <line x1="263" y1="174" x2="277" y2="236" stroke="#3a4a56" stroke-width="1.5" />
  <!-- Lokalni otpor 2: ventil (kruzic s X) na cijevi -->
  <circle cx="370" cy="205" r="14" fill="#eaf1f6" stroke="#3a4a56" stroke-width="1.4" />
  <line x1="360" y1="195" x2="380" y2="215" stroke="#3a4a56" stroke-width="1.4" />
  <line x1="380" y1="195" x2="360" y2="215" stroke="#3a4a56" stroke-width="1.4" />
  <!-- kota promjera D (desno od cijevi, izvan prirubnice) -->
  <!-- hrapavost epsilon - mikro zubaste linije na donjoj unutrasnjoj stjenci, smeda strelica -->
  <!-- legenda lokalnih otpora -->
  <!-- legenda fluida -->
  <rect x="60" y="320" width="408" height="100" rx="9" fill="#f4f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <!-- ===================== DESNI PANEL: 4 koraka + rezultati ===================== -->
  <!-- Korak 1: A i v -->
  <rect x="498" y="88" width="372" height="68" rx="9" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="498" y="88" width="6" height="68" rx="3" fill="#1565c0" />
  <!-- Korak 2: Re -->
  <rect x="498" y="164" width="372" height="68" rx="9" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="498" y="164" width="6" height="68" rx="3" fill="#1565c0" />
  <!-- Korak 3: brzinska visina + linijski gubitak -->
  <rect x="498" y="240" width="372" height="84" rx="9" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="498" y="240" width="6" height="84" rx="3" fill="#1565c0" />
  <!-- Korak 4: lokalni gubitak + ukupni -->
  <rect x="498" y="332" width="372" height="68" rx="9" fill="#fdf7f3" stroke="#e8c8b6" stroke-width="1.2" />
  <rect x="498" y="332" width="6" height="68" rx="3" fill="#c0392b" />
  <!-- REZULTATI badge -->
  <rect x="498" y="408" width="372" height="38" rx="8" fill="#e8f5e9" stroke="#1e8449" stroke-width="1.4" />
  <line x1="60" y1="172" x2="60" y2="120" stroke="#b7600c" stroke-width="0.7" />
  <line x1="430" y1="172" x2="430" y2="120" stroke="#b7600c" stroke-width="0.7" />
  <line x1="60" y1="116" x2="60" y2="132" stroke="#b7600c" stroke-width="1.2" />
  <line x1="430" y1="116" x2="430" y2="132" stroke="#b7600c" stroke-width="1.2" />
  <line x1="63" y1="124" x2="427" y2="124" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u13v1rig_dimL)" marker-end="url(#u13v1rig_dim)" />
  <line x1="438" y1="174" x2="466" y2="174" stroke="#b7600c" stroke-width="0.7" />
  <line x1="438" y1="236" x2="466" y2="236" stroke="#b7600c" stroke-width="0.7" />
  <line x1="461" y1="174" x2="461" y2="236" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u13v1rig_dimL)" marker-end="url(#u13v1rig_dim)" />
  <path d="M86,236 l4,-4 l4,4 l4,-4 l4,4 l4,-4 l4,4 l4,-4 l4,4" fill="none" stroke="#b7600c" stroke-width="1.1" />
  <line x1="98" y1="270" x2="98" y2="240" stroke="#b7600c" stroke-width="1.3" marker-end="url(#u13v1rig_eps)" />
  <text x="40" y="58" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Vodoravna dionica cjevovoda</text>
  <text x="40" y="75" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">Geometrija, protok i lokalni otpori</text>

  <text x="22" y="196" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1e8449"><tspan font-style="italic">Q</tspan></text>
  <text x="22.0" y="212.0" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1e8449">= 0,018 m³/s</text>

  <text x="170" y="198" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#1e8449">v</text>

  <text x="270" y="152" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#1a2530">ξ<tspan baseline-shift="sub" font-size="0.7em">1</tspan></text>

  <text x="370" y="152" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#1a2530">ξ<tspan baseline-shift="sub" font-size="0.7em">2</tspan></text>

  <text x="270" y="295" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a2530" text-anchor="middle">lokalni otpori: Σξ = 5,2</text>

  <text x="76" y="340" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1565c0">Zadano</text>
  <text x="76" y="360" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1a2530"><tspan font-style="italic">D</tspan> = 0,09 m  ·  <tspan font-style="italic">L</tspan> = 42 m  ·  <tspan font-style="italic">Q</tspan> = 0,018 m³/s</text>
  <text x="76" y="378" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1a2530">ε = 0,15 mm  ·  Σξ = 5,2  ·  ν = 1,0·10⁻⁶ m²/s</text>
  <text x="76" y="396" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1a2530">Moodyjev dijagram → λ ≈ 0,027  (za <tspan font-style="italic">Re</tspan>, ε/<tspan font-style="italic">D</tspan>)</text>
  <text x="76" y="414" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" fill="#5a6a78">Traci: srednja brzina v, Reynoldsov broj Re, ukupni gubitak energije h<tspan baseline-shift="sub" font-size="0.7em">w</tspan></text>

  <text x="500" y="58" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Redoslijed proracuna</text>
  <text x="500" y="75" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">A → v → Re → λ (Moody) → h<tspan baseline-shift="sub" font-size="0.7em">w</tspan></text>

  <text x="516" y="108" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1565c0">1. Površina presjeka i srednja brzina</text>
  <text x="516" y="127" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530"><tspan font-style="italic">A</tspan> = π<tspan font-style="italic">D</tspan>²/4 = π·0,09²/4 ≈ 6,36·10⁻³ m²</text>
  <text x="516" y="145" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1565c0"><tspan font-style="italic">v</tspan> = <tspan font-style="italic">Q</tspan>/<tspan font-style="italic">A</tspan> = 0,018 / 6,36·10⁻³ ≈ 2,83 m/s</text>

  <text x="516" y="184" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1565c0">2. Reynoldsov broj i režim strujanja</text>
  <text x="516" y="203" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530"><tspan font-style="italic">Re</tspan> = <tspan font-style="italic">vD</tspan>/ν = (2,83·0,09) / (1,0·10⁻⁶)</text>
  <text x="516" y="221" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1565c0"><tspan font-style="italic">Re</tspan> ≈ 2,55·10⁵  ≫ 2300 → turbulentno</text>

  <text x="516" y="260" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1565c0">3. Brzinska visina i linijski gubitak</text>
  <text x="516" y="279" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530"><tspan font-style="italic">v</tspan>²/(2<tspan font-style="italic">g</tspan>) = 2,83² / (2·9,81) ≈ 0,408 m</text>
  <text x="516" y="297" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">l</tspan> = λ·(<tspan font-style="italic">L</tspan>/<tspan font-style="italic">D</tspan>)·<tspan font-style="italic">v</tspan>²/(2<tspan font-style="italic">g</tspan>) = 0,027·(42/0,09)·0,408</text>
  <text x="516" y="315" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1565c0"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">l</tspan> ≈ 5,14 m</text>

  <text x="516" y="352" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#c0392b">4. Lokalni gubitak i ukupni</text>
  <text x="516" y="371" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530">Σ<tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">loc</tspan> = Σξ·<tspan font-style="italic">v</tspan>²/(2<tspan font-style="italic">g</tspan>) = 5,2·0,408 ≈ 2,12 m</text>
  <text x="516" y="389" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#c0392b"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">w</tspan> = <tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">l</tspan> + Σ<tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">loc</tspan> ≈ 5,14 + 2,12 ≈ 7,26 m</text>

  <text x="514" y="431" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#5a6a78">REZULTATI</text>
  <text x="592" y="431" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1565c0"><tspan font-style="italic">v</tspan> ≈ 2,83 m/s</text>
  <text x="690" y="431" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1565c0"><tspan font-style="italic">Re</tspan> ≈ 2,55·10⁵</text>
  <text x="861" y="431" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1e8449" text-anchor="end"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">w</tspan> ≈ 7,3 m</text>
<text x="245" y="116" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">L</tspan> = 42 m</text>

  <text x="462" y="208" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#b7600c"><tspan font-style="italic">D</tspan></text>
  <text x="462.0" y="224.0" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#b7600c">= 0,09 m</text>

  <text x="105" y="275" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#b7600c">ε = 0,15 mm</text>
  <text x="105" y="288" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#b7600c">(apsolutna hrapavost)</text>

  </svg>