<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
<defs>
  <linearGradient id="u11fvm_u11vm-wg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#d4eef8"/>
    <stop offset="100%" stop-color="#7ec8e8"/>
  </linearGradient>
  <linearGradient id="u11fvm_u11vm-noz" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#c8d6df"/>
    <stop offset="100%" stop-color="#8fa8b8"/>
  </linearGradient>
  <marker id="u11fvm_u11vm-ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#0f766e"/>
  </marker>
  <marker id="u11fvm_u11vm-ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#b42318"/>
  </marker>
  <marker id="u11fvm_u11vm-al" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="10 0,0 3.5,10 7" fill="#b42318"/>
  </marker>
  <marker id="u11fvm_u11vm-ap" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#6d2694"/>
  </marker>
  <pattern id="u11fvm_u11vm-hatch" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#8090a0"/>
    <line x1="0" y1="8" x2="8" y2="0" stroke="#546e7a" stroke-width="1.8"/>
  </pattern>
</defs>

<!-- Background -->
<rect width="940" height="380" fill="#ffffff"/>
<rect x="24" y="24" width="892" height="332" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>

<!-- Title -->

<!-- === SUPPORT WALL (nosač) === -->
<rect x="54" y="115" width="36" height="200" fill="url(#u11fvm_u11vm-hatch)" stroke="#2d3a40" stroke-width="2"/>

<!-- === SUPPLY PIPE (D1=100mm, wide) === -->
<!-- Pipe walls (outer) -->
<rect x="90" y="155" width="240" height="80" rx="4" fill="#c8d6df" stroke="#2d3a40" stroke-width="1.8"/>
<!-- Fluid interior -->
<rect x="93" y="160" width="234" height="70" rx="2" fill="url(#u11fvm_u11vm-wg)"/>

<!-- Section 1 label -->
<line x1="140" y1="147" x2="140" y2="243" stroke="#516677" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="135" y="142" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043" text-anchor="middle">①</text>

<!-- v1 arrow -->
<line x1="163" y1="195" x2="215" y2="195" stroke="#0f766e" stroke-width="2.5" marker-end="url(#u11fvm_u11vm-ag)"/>
<text x="155" y="252" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#0f766e">v₁ = 3,50 m/s</text>

<!-- D1 dimension -->
<line x1="86" y1="160" x2="86" y2="230" stroke="#546e7a" stroke-width="1"/>
<line x1="80" y1="160" x2="92" y2="160" stroke="#546e7a" stroke-width="1"/>
<line x1="80" y1="230" x2="92" y2="230" stroke="#546e7a" stroke-width="1"/>
<text x="50" y="198" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#546e7a" text-anchor="middle">D₁=</text>
<text x="50" y="210" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#546e7a" text-anchor="middle">100 mm</text>

<!-- === CONVERGING NOZZLE === -->
<!-- Nozzle body: converging trapezoid from D1 to d2 -->
<polygon points="330,155 330,235 490,210 490,180" fill="url(#u11fvm_u11vm-noz)" stroke="#2d3a40" stroke-width="1.8"/>
<!-- Fluid inside nozzle -->
<polygon points="333,161 333,229 487,208 487,182" fill="url(#u11fvm_u11vm-wg)"/>

<!-- Section 2 label -->
<line x1="490" y1="172" x2="490" y2="218" stroke="#516677" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="503" y="200" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">②</text>

<!-- d2 dimension -->
<line x1="494" y1="180" x2="494" y2="210" stroke="#546e7a" stroke-width="1"/>
<line x1="488" y1="180" x2="500" y2="180" stroke="#546e7a" stroke-width="1"/>
<line x1="488" y1="210" x2="500" y2="210" stroke="#546e7a" stroke-width="1"/>
<text x="520" y="198" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#546e7a">d₂=50 mm</text>

<!-- === FREE JET === -->
<!-- Jet stream (tapered blue stream) -->
<rect x="490" y="185" width="160" height="20" fill="url(#u11fvm_u11vm-wg)" rx="3"/>
<!-- Velocity arrow -->
<line x1="498" y1="195" x2="600" y2="195" stroke="#0f766e" stroke-width="2.8" marker-end="url(#u11fvm_u11vm-ag)"/>
<text x="612" y="190" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#0f766e">v₂ = 28 m/s</text>

<!-- === REACTION FORCE ARROWS === -->

<!-- F_nosac: reaction force on nosac pointing LEFT (← ) -->
<line x1="320" y1="290" x2="105" y2="290" stroke="#b42318" stroke-width="3.2" marker-end="url(#u11fvm_u11vm-ar)"/>
<rect x="135" y="298" width="180" height="22" rx="5" fill="#fff0ee"/>
<text x="225" y="314" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#b42318" text-anchor="middle">F_nosač = 3 560 N = 3,56 kN</text>

<!-- Decomposition arrows (smaller, show p1A and mv components) -->
<line x1="320" y1="260" x2="155" y2="260" stroke="#d97706" stroke-width="2" marker-end="url(#u11fvm_u11vm-al)" stroke-dasharray="6,3"/>
<text x="236" y="254" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#92400e" text-anchor="middle">p₁A₁ = 4 712 N</text>

<line x1="340" y1="260" x2="432" y2="260" stroke="#0f766e" stroke-width="2" marker-end="url(#u11fvm_u11vm-ag)" stroke-dasharray="6,3"/>
<text x="386" y="254" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#0f766e" text-anchor="middle">ṁΔv = 1 152 N</text>

<!-- === RIGHT PANEL: formula box === -->
<rect x="610" y="115" width="306" height="220" rx="10" fill="#fffef6" stroke="#c49a0a" stroke-width="1.8"/>
<text x="763" y="138" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Jednadžba x-smjera</text>
<line x1="620" y1="144" x2="908" y2="144" stroke="#c49a0a" stroke-width="1" stroke-dasharray="3,2"/>

<text x="622" y="163" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#173043">p₁A₁ − F_nosač = ṁ(v₂ − v₁)</text>
<text x="622" y="182" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#173043">F_nosač = p₁A₁ − ṁ(v₂ − v₁)</text>

<line x1="620" y1="190" x2="908" y2="190" stroke="#e5e7eb" stroke-width="1"/>

<text x="622" y="208" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#173043">A₁ = π(0,10)²/4 = 7,854 × 10⁻³ m²</text>
<text x="622" y="226" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#173043">ṁ = ρQ = 1000 · 0,02749 = 27,49 kg/s</text>
<text x="622" y="244" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#173043">p₁A₁ = 600 000 · 7,854×10⁻³ = 4 712 N</text>
<text x="622" y="262" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#173043">ṁ(v₂−v₁) = 27,49·(28−3,50) = 1 152 N</text>

<line x1="620" y1="270" x2="908" y2="270" stroke="#c49a0a" stroke-width="1.2"/>
<text x="763" y="290" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#6d2694" text-anchor="middle">F_nosač = 4 712 − 1 152 = 3 560 N</text>
<text x="763" y="310" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#6d2694" text-anchor="middle">≈ 3,56 kN</text>

<!-- Dominira tlak note -->
<text x="622" y="350" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677">Dominira tlačni doprinos (4,71 kN) nad impulsnim (1,15 kN)</text>

</svg>
