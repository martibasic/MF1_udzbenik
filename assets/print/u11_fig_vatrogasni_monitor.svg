<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="u11fvm_title u11fvm_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:900px;height:auto;">
  <title id="u11fvm_title">Vatrogasni monitor - mlaznica i sila na nosac</title>
  <desc id="u11fvm_desc">Horizontalni vatrogasni monitor na celicnom nosacu. Ulazna cijev D1=100 mm s p1=600 kPa i v1=7,0 m/s; konvergentna mlaznica zavrsava izlazom d=50 mm i v2=28 m/s u atmosferu. Reakcijska sila na nosac F_nosac=3,56 kN djeluje u -x smjeru. Tlacni doprinos p1A1=4,71 kN dominira nad impulsnim m_dot(v2-v1)=1,15 kN.</desc>

  <defs>
    <!-- Vodeni gradient (vertikalan) za fluid u cijevi -->
    <linearGradient id="u11fvm_voda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aed6f1" />
      <stop offset="100%" stop-color="#5b9ec9" />
    </linearGradient>
    <!-- Mlaznica (cijevni metal) -->
    <linearGradient id="u11fvm_metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8c4cc" />
      <stop offset="100%" stop-color="#7d8b95" />
    </linearGradient>
    <!-- Srafura za nosac/temelj -->
    <pattern id="u11fvm_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.6" />
    </pattern>

    <!-- Strelica sile crvena (ulaz) -->
    <marker id="u11fvm_aR" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#c0392b" />
    </marker>
    <!-- Strelica sile zelena (izlaz/reakcija) -->
    <marker id="u11fvm_aG" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1e8449" />
    </marker>
    <!-- Strelica tlaka plava -->
    <marker id="u11fvm_aB" markerWidth="6" markerHeight="4" refX="5.5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#1565c0" />
    </marker>
    <!-- Strelica brzine plava (tamnija) -->
    <marker id="u11fvm_aV" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#0d47a1" />
    </marker>
    <!-- Kota smeda -->
    <marker id="u11fvm_aDim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L6,2.5 z" fill="#b7600c" />
    </marker>
    <marker id="u11fvm_aDimL" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse">
      <path d="M0,0 L0,5 L6,2.5 z" fill="#b7600c" />
    </marker>
  </defs>

  <!-- pozadina + okvir -->
  <rect width="960" height="540" fill="#ffffff" />
  <rect x="14" y="14" width="932" height="512" rx="12" fill="#ffffff" stroke="#dde3ea" stroke-width="1.5" />

  <!-- ============================================================
       LIJEVI PANEL: fizicki model (x=14..620)
  ============================================================ -->
  <!-- razdjelnica panela -->
  <line x1="620" y1="32" x2="620" y2="508" stroke="#dce7f0" stroke-width="1.2" stroke-dasharray="4,5" />

  <!-- ========== NOSAC (celicni stupac fiksiran u temelj) ========== -->
  <!-- Temelj (beton) -->
  <rect x="34" y="430" width="160" height="28" fill="url(#u11fvm_hatch)" stroke="#3a4a56" stroke-width="1.4" />
  <line x1="34" y1="458" x2="194" y2="458" stroke="#3a4a56" stroke-width="2" />
  <!-- Tlo (srafura ispod) -->
  <line x1="34" y1="466" x2="46" y2="478" stroke="#7a8a96" stroke-width="1" />
  <line x1="54" y1="466" x2="66" y2="478" stroke="#7a8a96" stroke-width="1" />
  <line x1="74" y1="466" x2="86" y2="478" stroke="#7a8a96" stroke-width="1" />
  <line x1="94" y1="466" x2="106" y2="478" stroke="#7a8a96" stroke-width="1" />
  <line x1="114" y1="466" x2="126" y2="478" stroke="#7a8a96" stroke-width="1" />
  <line x1="134" y1="466" x2="146" y2="478" stroke="#7a8a96" stroke-width="1" />
  <line x1="154" y1="466" x2="166" y2="478" stroke="#7a8a96" stroke-width="1" />
  <line x1="174" y1="466" x2="186" y2="478" stroke="#7a8a96" stroke-width="1" />

  <!-- Vertikalni stupac nosaca (od temelja do cijevi) -->
  <rect x="90" y="232" width="48" height="198" fill="url(#u11fvm_metal)" stroke="#3a4a56" stroke-width="1.6" />
  <!-- Prirubnica na vrhu stupca + kolijevka za cijev -->
  <rect x="78" y="220" width="72" height="14" rx="2" fill="#7d8b95" stroke="#3a4a56" stroke-width="1.4" />
  <!-- Vijci na prirubnici -->
  <circle cx="92" cy="227" r="2.2" fill="#3a4a56" />
  <circle cx="114" cy="227" r="2.2" fill="#3a4a56" />
  <circle cx="136" cy="227" r="2.2" fill="#3a4a56" />

  <!-- ========== ULAZNA CIJEV (D1=100mm, horizontalna) ========== -->
  <!-- Vanjska stijenka cijevi -->
  <rect x="80" y="186" width="220" height="34" fill="url(#u11fvm_metal)" stroke="#3a4a56" stroke-width="1.6" />
  <!-- Fluid u cijevi (puni cijelu unutrasnjost) -->
  <rect x="80" y="190" width="220" height="26" fill="url(#u11fvm_voda)" />
  <!-- Donja stjenka (preko fluida za vizualnu liniju) -->
  <line x1="80" y1="190" x2="300" y2="190" stroke="#3a4a56" stroke-width="0.8" />
  <line x1="80" y1="216" x2="300" y2="216" stroke="#3a4a56" stroke-width="0.8" />

  <!-- Lijevi rub cijevi (prirubnica za ulaz - simbolicki) -->
  <rect x="74" y="180" width="10" height="46" fill="#7d8b95" stroke="#3a4a56" stroke-width="1.4" />

  <!-- ========== KONVERGENTNA MLAZNICA ========== -->
  <!-- Vanjski obris (trapez) -->
  <polygon points="300,186 380,196 380,210 300,220" fill="url(#u11fvm_metal)" stroke="#3a4a56" stroke-width="1.6" />
  <!-- Fluid unutar mlaznice (trapez) -->
  <polygon points="300,190 380,198 380,208 300,216" fill="url(#u11fvm_voda)" />

  <!-- ========== SLOBODNI MLAZ (d=50mm) ========== -->
  <!-- Mlaz se nastavlja desno od mlaznice -->
  <rect x="380" y="198" width="180" height="10" fill="url(#u11fvm_voda)" />
  <!-- Tanka konturna linija mlaza -->
  <line x1="380" y1="198" x2="560" y2="198" stroke="#1565c0" stroke-width="0.9" />
  <line x1="380" y1="208" x2="560" y2="208" stroke="#1565c0" stroke-width="0.9" />
  <!-- Spray/kapljice na vrhu mlaza za vizualnu naznaku -->
  <circle cx="570" cy="200" r="1.6" fill="#5b9ec9" />
  <circle cx="576" cy="204" r="1.4" fill="#5b9ec9" />
  <circle cx="580" cy="208" r="1.2" fill="#5b9ec9" />
  <circle cx="572" cy="210" r="1.0" fill="#5b9ec9" />
  <circle cx="586" cy="202" r="1.0" fill="#5b9ec9" />

  <!-- ========== PRESJECI 1 i 2 ========== -->
  <!-- Presjek 1 (ulaz u cijev / ispred mlaznice) -->
  <line x1="200" y1="172" x2="200" y2="232" stroke="#5a6a78" stroke-width="1.2" stroke-dasharray="5,4" />
  <circle cx="200" cy="168" r="9" fill="#ffffff" stroke="#1565c0" stroke-width="1.4" />
  <!-- Presjek 2 (izlaz iz mlaznice) -->
  <line x1="380" y1="184" x2="380" y2="232" stroke="#5a6a78" stroke-width="1.2" stroke-dasharray="5,4" />
  <circle cx="380" cy="168" r="9" fill="#ffffff" stroke="#1565c0" stroke-width="1.4" />
  <!-- ========== TLAK p1 u cijevi (plave strelice prema stjenkama) ========== -->
  <!-- Premjesteno na x=170 da ne bude preko stupca/prirubnice -->
  <line x1="170" y1="203" x2="170" y2="193" stroke="#1565c0" stroke-width="1.6" marker-end="url(#u11fvm_aB)" />
  <line x1="170" y1="203" x2="170" y2="213" stroke="#1565c0" stroke-width="1.6" marker-end="url(#u11fvm_aB)" />
  <line x1="123" y1="172" x2="160" y2="195" stroke="#1565c0" stroke-width="0.7" />

  <!-- ========== BRZINA v1 (plava strelica, kratka, u cijevi) ========== -->
  <line x1="220" y1="203" x2="252" y2="203" stroke="#0d47a1" stroke-width="2.2" marker-end="url(#u11fvm_aV)" />
  <line x1="236" y1="218" x2="236" y2="237" stroke="#0d47a1" stroke-width="0.6" />

  <!-- ========== BRZINA v2 (plava strelica, duga, na mlazu - skala 4x) ========== -->
  <!-- v1 = 32 px, v2 = 28/7 * 32 = 128 px -->
  <line x1="395" y1="203" x2="523" y2="203" stroke="#0d47a1" stroke-width="2.8" marker-end="url(#u11fvm_aV)" />
  <!-- ========== ATMOSFERA OZNAKA ========== -->
  <!-- ========== REAKCIJSKA SILA F_nosac (zelena, prema lijevo, lijevo od stupca) ========== -->
  <!-- Sila djeluje na nosac u smjeru -x. Strelica zapocinje na lijevoj strani stupca (x=88), izlazi lijevo do x=22 (slobodni prostor lijevo od stupca). -->
  <!-- Skala 22 px/kN -> 3,56 kN cca 70 px -->
  <line x1="88" y1="332" x2="22" y2="332" stroke="#1e8449" stroke-width="3" marker-end="url(#u11fvm_aG)" />
  <!-- ========== KOTA D1 (vertikalna, lijevo od cijevi) ========== -->
  <!-- ========== KOTA d (vertikalna, na izlazu mlaznice) ========== -->
  <!-- ========== KOORDINATNI SUSTAV (mali, dolje desno) ========== -->
  <line x1="490" y1="408" x2="530" y2="408" stroke="#3a4a56" stroke-width="1.6" marker-end="url(#u11fvm_aDim)" />
  <line x1="490" y1="408" x2="490" y2="378" stroke="#3a4a56" stroke-width="1.6" marker-end="url(#u11fvm_aDim)" />
  <!-- ========== KONTROLNI VOLUMEN (isprekidana kutija oko mlaznice) ========== -->
  <rect x="196" y="180" width="190" height="58" rx="3" fill="none" stroke="#8e44ad" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.7" />
  <!-- ========== OPIS SCENE (donji rub lijevog panela) ========== -->
  <!-- ========== LEGENDA (lijevi panel, dolje) ========== -->
  <rect x="34" y="384" width="11" height="11" fill="#1565c0" rx="2" />
  <rect x="34" y="402" width="11" height="11" fill="#0d47a1" rx="2" />
  <rect x="244" y="384" width="11" height="11" fill="#1e8449" rx="2" />
  <!-- ============================================================
       DESNI PANEL: formula panel (x=636..946)
  ============================================================ -->
  <!-- Glavni panel -->
  <rect x="636" y="40" width="296" height="396" rx="10" fill="#f4f9fd" stroke="#1565c0" stroke-width="1.4" />
  <!-- Header bar -->
  <rect x="636" y="40" width="296" height="34" rx="10" fill="#1565c0" />
  <rect x="636" y="64" width="296" height="10" fill="#1565c0" />
  <!-- Blok 1: A1 i A2 -->
  <line x1="654" y1="142" x2="914" y2="142" stroke="#c8d6e4" stroke-width="1" />

  <!-- Blok 2: Q i v1 -->
  <line x1="654" y1="210" x2="914" y2="210" stroke="#c8d6e4" stroke-width="1" />

  <!-- Blok 3: m_dot -->
  <line x1="654" y1="278" x2="914" y2="278" stroke="#c8d6e4" stroke-width="1" />

  <!-- Blok 4: Zakon kolicine gibanja -->
  <line x1="654" y1="348" x2="914" y2="348" stroke="#c8d6e4" stroke-width="1" />

  <!-- Blok 5: doprinosi -->
  <!-- Sazetak -->
  <!-- Rezultat badge -->
  <rect x="636" y="450" width="296" height="60" rx="8" fill="#e8f5e9" stroke="#1e8449" stroke-width="1.6" />
  <line x1="80" y1="186" x2="56" y2="186" stroke="#b7600c" stroke-width="0.7" />
  <line x1="80" y1="220" x2="56" y2="220" stroke="#b7600c" stroke-width="0.7" />
  <line x1="62" y1="186" x2="62" y2="220" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u11fvm_aDimL)" marker-end="url(#u11fvm_aDim)" />
  <line x1="380" y1="198" x2="412" y2="138" stroke="#b7600c" stroke-width="0.7" />
  <line x1="380" y1="208" x2="412" y2="180" stroke="#b7600c" stroke-width="0.7" />
  <line x1="406" y1="138" x2="418" y2="138" stroke="#b7600c" stroke-width="1.2" />
  <line x1="406" y1="180" x2="418" y2="180" stroke="#b7600c" stroke-width="1.2" />
  <line x1="412" y1="143" x2="412" y2="175" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u11fvm_aDimL)" marker-end="url(#u11fvm_aDim)" />
  <rect x="244" y="402" width="11" height="11" fill="#b7600c" rx="2" />
  <text x="200" y="172" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1565c0">1</text>

  <text x="380" y="172" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1565c0">2</text>

  <text x="100" y="172" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#1565c0"><tspan font-weight="700">p</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> = 600 kPa</text>
  <text x="236" y="248" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#0d47a1"><tspan font-weight="700">v</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> = 7,0 m/s</text>
  <text x="459" y="184" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="#0d47a1"><tspan font-weight="700">v</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 28 m/s</text>

  <text x="540" y="232" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" text-anchor="middle" fill="#5a6a78"><tspan font-weight="700">p</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 0 (atm.)</text>

  <text x="86" y="322" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="end" fill="#1e8449"><tspan font-weight="700">F</tspan><tspan baseline-shift="sub" font-size="0.7em">nosač</tspan> = 3,56 kN</text>
  <text x="86" y="350" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" text-anchor="end" fill="#5a6a78">reakcija u smjeru −x</text>

  <text x="536" y="412" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#3a4a56">x</text>
  <text x="486" y="374" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="end" fill="#3a4a56">y</text>

  <text x="291" y="282" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" text-anchor="middle" fill="#8e44ad">kontrolni volumen (mlaznica)</text>

  <text x="317" y="488" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Horizontalni vatrogasni monitor: ulaz iz cjevovoda, mlaznica suzava do</text>
  <text x="317" y="502" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78"><tspan font-style="italic">d</tspan> = 50 mm, slobodni mlaz u atmosferu; nosač preuzima reakciju u −x.</text>

  <text x="50" y="394" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#3a4a56">tlak <tspan font-style="italic">p</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan></text>

  <text x="50" y="412" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#3a4a56">brzina <tspan font-style="italic">v</tspan></text>

  <text x="260" y="394" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#3a4a56">reakcija <tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">nosač</tspan></text>

  <text x="260" y="412" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#3a4a56">kote</text>

  <text x="784" y="62" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Zakon količine gibanja (x)</text>

  <text x="784" y="92" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Površine presjeka</text>
  <text x="784" y="112" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530">A<tspan baseline-shift="sub" font-size="0.7em">1</tspan> = π D<tspan baseline-shift="sub" font-size="0.7em">1</tspan>²/4,  A<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = π d²/4</text>
  <text x="784" y="130" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1565c0">A<tspan baseline-shift="sub" font-size="0.7em">1</tspan> = 7,854·10⁻³ m²  A<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 1,963·10⁻³ m²</text>
  <text x="784" y="160" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Protok i brzina u cjevovodu</text>
  <text x="784" y="180" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530">Q = A<tspan baseline-shift="sub" font-size="0.7em">2</tspan>·v<tspan baseline-shift="sub" font-size="0.7em">2</tspan>,  v<tspan baseline-shift="sub" font-size="0.7em">1</tspan> = Q/A<tspan baseline-shift="sub" font-size="0.7em">1</tspan></text>
  <text x="784" y="198" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1565c0">Q = 54,97 L/s  v<tspan baseline-shift="sub" font-size="0.7em">1</tspan> = 7,0 m/s</text>
  <text x="784" y="228" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Maseni protok</text>
  <text x="784" y="248" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530">ṁ = ρ Q = 998 · 0,05497</text>
  <text x="784" y="266" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1565c0">ṁ = 54,86 kg/s</text>
  <text x="784" y="296" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Bilanca u smjeru x (kontrolni volumen)</text>
  <text x="784" y="316" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530">p<tspan baseline-shift="sub" font-size="0.7em">1</tspan>A<tspan baseline-shift="sub" font-size="0.7em">1</tspan> − R<tspan baseline-shift="sub" font-size="0.7em">x</tspan> = ṁ(v<tspan baseline-shift="sub" font-size="0.7em">2</tspan> − v<tspan baseline-shift="sub" font-size="0.7em">1</tspan>)</text>
  <text x="784" y="336" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530">R<tspan baseline-shift="sub" font-size="0.7em">x</tspan> = p<tspan baseline-shift="sub" font-size="0.7em">1</tspan>A<tspan baseline-shift="sub" font-size="0.7em">1</tspan> − ṁ(v<tspan baseline-shift="sub" font-size="0.7em">2</tspan> − v<tspan baseline-shift="sub" font-size="0.7em">1</tspan>)</text>
  <text x="784" y="366" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">Tlačni i impulsni doprinos</text>
  <text x="784" y="384" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">p<tspan baseline-shift="sub" font-size="0.7em">1</tspan>A<tspan baseline-shift="sub" font-size="0.7em">1</tspan> = 600 000 · 7,854·10⁻³ = 4 712 N</text>
  <text x="784" y="402" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1565c0">ṁ(v<tspan baseline-shift="sub" font-size="0.7em">2</tspan> − v<tspan baseline-shift="sub" font-size="0.7em">1</tspan>) = 54,86 · 21 = 1 152 N</text>

  <text x="784" y="422" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#5a6a78">Tlačni član dominira (~4× veći od impulsnog)</text>

  <text x="784" y="468" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#5a6a78">REZULTAT</text>
