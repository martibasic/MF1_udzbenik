<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 800" role="img" aria-labelledby="u01vs_title u01vs_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:760px;height:auto;">
  <title id="u01vs_title">Sheme hidrauličnih zadataka za vježbu</title>
  <desc id="u01vs_desc">Gore dva povezana klipa prenose silu i istisnuti volumen u Z2, Z3 i Z5. U sredini dovedeni dodatni volumen pomiče vodoravni klip nepoznate površine u Z4. Dolje pumpa napaja tri jednaka cilindra pod mehanički vođenim stolom u Z6. Skice nisu u mjerilu; povratni ventili pumpe nisu prikazani.</desc>
  <defs>
    <marker id="u01vs_in" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/></marker>
    <marker id="u01vs_out" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1e8449"/></marker>
    <marker id="u01vs_vol" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1565c0"/></marker>
    <marker id="u01vs_dim" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 Z" fill="#b7600c"/></marker>
  </defs>
  <g font-family="'Segoe UI',Arial,sans-serif" font-size="19" fill="#3a4a56">
