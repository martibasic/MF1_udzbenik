<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img"
     aria-labelledby="u3puT u3puD" preserveAspectRatio="xMidYMid meet"
     style="display:block;width:100%;max-width:520px;height:auto;">
  <title id="u3puT">Tlak na usisu pumpe za cirkulaciju ulja</title>
  <desc id="u3puD">Pumpa za ulje (ρ=870 kg/m³) smještena H=2,4 m iznad razine ulja u otvorenom spremniku. Na usisu vlada podtlak p_man=−20,5 kPa. Maksimalna teorijska usisna visina bez kavitacije: H_max≈11,8 m.</desc>
  <defs>
    <marker id="u3puaR"  markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#c0392b"/></marker>
    <marker id="u3puaG"  markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#1e8449"/></marker>
    <marker id="u3puaO"  markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#c8860a"/></marker>
    <marker id="u3puaDim"  markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#b7600c"/></marker>
    <marker id="u3puaDimL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L8,4 z" fill="#b7600c"/></marker>
    <linearGradient id="u3puoil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e090"/><stop offset="100%" stop-color="#e8c040"/>
    </linearGradient>
    <linearGradient id="u3puoilpipe" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#f5e090" stop-opacity="0.7"/><stop offset="100%" stop-color="#f0c060" stop-opacity="0.4"/>
    </linearGradient>
    <pattern id="u3puhatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8a9aa6" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="520" height="520" fill="#f8f9fa"/>
  <rect x="10" y="10" width="500" height="500" rx="12" fill="#ffffff" stroke="#dde3ea" stroke-width="1.5"/>

  <!-- Naslov -->
  <text x="260" y="34" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530" text-anchor="middle">Usisni vod pumpe za ulje – podtlak na usisu</text>
  <text x="260" y="50" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78" text-anchor="middle">ρ = 870 kg/m³,  H = 2,4 m,  p_atm = 101,3 kPa,  p_v ≈ 200 Pa</text>

  <!-- ══ OTVORENI SPREMNIK (dolje, x=60..340, y=350..450) ══ -->
  <!-- Dno -->
  <rect x="60" y="440" width="280" height="12" fill="url(#u3puhatch)" stroke="#4a6070" stroke-width="1.2"/>
  <!-- Lijeva stijenka -->
  <rect x="60" y="340" width="12" height="100" fill="url(#u3puhatch)" stroke="#4a6070" stroke-width="1.2"/>
  <!-- Desna stijenka -->
  <rect x="328" y="340" width="12" height="100" fill="url(#u3puhatch)" stroke="#4a6070" stroke-width="1.2"/>
  <!-- Ulje u spremniku -->
  <rect x="72" y="380" width="256" height="60" fill="url(#u3puoil)" opacity="0.85"/>
  <!-- Razina ulja -->
  <line x1="58" y1="380" x2="342" y2="380" stroke="#c8860a" stroke-width="1.8"/>
  <!-- p_atm oznaka -->
  <text x="348" y="377" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78">p_atm</text>
  <!-- Tekst ulje -->
  <text x="200" y="415" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#7d4e00" text-anchor="middle" font-style="italic">ulje (ρ = 870 kg/m³)</text>

  <!-- ══ USISNI VOD (vertikalna cijev) ══ -->
  <!-- Vanjska cijev x=182..218, od y=200 do y=380 -->
  <rect x="182" y="200" width="36" height="180" fill="none" stroke="#4a6070" stroke-width="2.0"/>
  <!-- Ulje u cijevi (kretanje gore) -->
  <rect x="188" y="202" width="24" height="178" fill="#f0c060" fill-opacity="0.55"/>
  <!-- Strelice kretanja gore u cijevi -->
  <line x1="200" y1="360" x2="200" y2="338" stroke="#c8860a" stroke-width="1.8" marker-end="url(#u3puaO)"/>
  <line x1="200" y1="300" x2="200" y2="278" stroke="#c8860a" stroke-width="1.8" marker-end="url(#u3puaO)"/>
  <line x1="200" y1="248" x2="200" y2="226" stroke="#c8860a" stroke-width="1.8" marker-end="url(#u3puaO)"/>

  <!-- ══ PUMPA (x=120..280, y=140..200) ══ -->
  <rect x="120" y="140" width="160" height="60" rx="10" fill="#7f8c8d" stroke="#3a4a56" stroke-width="2.0"/>
  <text x="200" y="168" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">PUMPA</text>
  <text x="200" y="186" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#d0dde6" text-anchor="middle">→ tlačni vod (izlaz)</text>
  <!-- Tlačni vod (vodoravno desno) -->
  <rect x="280" y="154" width="80" height="18" fill="url(#u3puoilpipe)" stroke="#4a6070" stroke-width="1.5"/>
  <line x1="305" y1="163" x2="352" y2="163" stroke="#c8860a" stroke-width="1.8" marker-end="url(#u3puaO)"/>

  <!-- ══ KOTA H ══ -->
  <line x1="350" y1="200" x2="356" y2="200" stroke="#b7600c" stroke-width="1"/>
  <line x1="350" y1="380" x2="356" y2="380" stroke="#b7600c" stroke-width="1"/>
  <line x1="353" y1="202" x2="353" y2="378" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u3puaDimL)" marker-end="url(#u3puaDim)"/>
  <text x="364" y="294" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" font-weight="700" fill="#b7600c">H</text>
  <text x="364" y="310" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a2530">= 2,4 m</text>

  <!-- ══ PODTLAK BOX na usisu pumpe ══ -->
  <rect x="30" y="148" width="84" height="56" rx="7" fill="#fde8e8" stroke="#c0392b" stroke-width="1.3"/>
  <text x="72" y="166" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">usis pumpe</text>
  <text x="72" y="181" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">p_man =</text>
  <text x="72" y="196" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">−20,5 kPa</text>
  <!-- Strelica od boxa prema usisu pumpe -->
  <line x1="114" y1="172" x2="122" y2="172" stroke="#c0392b" stroke-width="1.5" marker-end="url(#u3puaR)"/>

  <!-- ══ REZULTATI (dolje desno) ══ -->
  <rect x="30" y="460" width="460" height="38" rx="8" fill="#eaf4fb" stroke="#c8d8e8" stroke-width="1.3"/>
  <text x="260" y="476" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#3a4a56" text-anchor="middle">p_man = −ρgH = −870·9,81·2,4 ≈ −20,5 kPa  |  p_abs ≈ 80,8 kPa</text>
  <text x="260" y="492" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1e8449" text-anchor="middle">H_max (kavitacija) = (p_atm − p_v)/(ρg) ≈ 11,8 m</text>

  <!-- ══ NAPOMENA KAVITACIJA ══ -->
  <rect x="380" y="140" width="116" height="66" rx="7" fill="#fff8e8" stroke="#e0c870" stroke-width="1.2"/>
  <text x="438" y="156" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5c3d00" text-anchor="middle" font-weight="700">Kavitacija</text>
  <text x="438" y="172" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5c3d00" text-anchor="middle">ako p_abs &lt; p_v</text>
  <text x="438" y="186" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5c3d00" text-anchor="middle">mjehurići paru!</text>
  <text x="438" y="200" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5c3d00" text-anchor="middle">H_max ≈ 11,8 m</text>
</svg>
