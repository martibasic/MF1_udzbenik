  <circle cx="290" cy="132" r="16" fill="#3a4a56" stroke="#3a4a56" stroke-width="1.4" />
  <line x1="278" y1="132" x2="302" y2="132" stroke="#c5cdd3" stroke-width="1.6" />
  <line x1="290" y1="120" x2="290" y2="144" stroke="#c5cdd3" stroke-width="1.6" />
  <rect x="330" y="120" width="70" height="22" fill="#eadfc5" stroke="#3a4a56" stroke-width="1.4" />
  <circle cx="203" cy="162" r="4" fill="#356b83" stroke="#356b83" stroke-width="1" />
  <line x1="207" y1="162" x2="244" y2="186" stroke="#356b83" stroke-width="0.9" />
  <circle cx="100" cy="458" r="4" fill="#356b83" stroke="#356b83" stroke-width="1" />
