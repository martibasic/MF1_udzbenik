  <text x="40" y="46" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Pumpa iznad otvorenog spremnika ulja</text>
  <text x="40" y="64" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">Idealni statički stupac ulja: Q = 0</text>
  <text x="320" y="426" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-style="italic" text-anchor="middle" fill="#5a6a78">
    <tspan font-weight="700">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">atm</tspan> = 101,3 kPa</text>
  <text x="300" y="492" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#7d4e00">ulje</text>
  <text x="300" y="507" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#7d4e00">ρ = 870 kg/m³</text>
  <text x="225" y="138" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">PUMPA (simbol)</text>
  <text x="368" y="113" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" text-anchor="middle" fill="#5a6a78">tlačni vod</text>
  <text x="248" y="190" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#c0392b">
    <tspan font-weight="700">U</tspan> – usis</text>
  <text x="142" y="446" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#1565c0">
    <tspan font-weight="700">0</tspan> – slob. površina</text>
  <text x="86" y="102" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#c0392b">PODTLAK</text>
  <text x="86" y="116" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#c0392b">na usisu pumpe</text>
  <text x="86" y="140" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#c0392b">
    <tspan font-weight="700">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">man</tspan> = −20,5 kPa</text>
  <text x="86" y="156" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#c0392b" transform="translate(0 8)">
    <tspan font-weight="700">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">aps</tspan> ≈ 80,8 kPa</text>
  <text x="356" y="191" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#3a4a56">Q = 0</text>
  <text x="720" y="55" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1565c0">Hidrostatski izvod tlaka na usisu</text>
  <text x="514" y="102" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1565c0">1. Manometarski tlak na usisu (uspon kroz fluid)</text>
  <text x="720" y="128" font-family="'Segoe UI',Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1a2530">
    <tspan font-style="italic" font-weight="700">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">man</tspan> = −ρ g H = −870 · 9,81 · 2,40</text>
  <text x="720" y="156" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#c0392b">
    <tspan font-style="italic">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">man</tspan> ≈ −20,48 kPa ≈ −20,5 kPa</text>
  <text x="514" y="204" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1565c0">2. Apsolutni tlak na usisu</text>
  <text x="720" y="228" font-family="'Segoe UI',Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1a2530">
    <tspan font-style="italic" font-weight="700">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">aps</tspan> = p<tspan baseline-shift="sub" font-size="0.7em">atm</tspan> + p<tspan baseline-shift="sub" font-size="0.7em">man</tspan> = 101 300 − 20 483 Pa</text>
  <text x="720" y="254" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1565c0">
    <tspan font-style="italic">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">aps</tspan> ≈ 80 817 Pa ≈ 80,8 kPa</text>
  <text x="720" y="324" font-family="'Segoe UI',Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1a2530">
    <tspan font-style="italic" font-weight="700">H</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">max</tspan> = (p<tspan baseline-shift="sub" font-size="0.7em">atm</tspan> − p<tspan baseline-shift="sub" font-size="0.7em">v</tspan>) / (ρ g)</text>
  <text x="720" y="346" font-family="'Segoe UI',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#5a6a78">= (101 300 − 200) / (870 · 9,81) = 101 100 / 8534,7</text>
  <text x="720" y="409" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1e8449">REZULTATI</text>
  <text x="582" y="430" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b">
    <tspan font-style="italic">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">man</tspan> ≈ −20,5 kPa</text>
  <text x="722" y="430" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">
    <tspan font-style="italic">p</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">aps</tspan> ≈ 80,8 kPa</text>
  <text x="862" y="430" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1e8449">
    <tspan font-style="italic">H</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">max</tspan> ≈ 11,8 m</text>
  <text x="510" y="476" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#7a5c00">Kavitacija</text>
  <text x="510" y="494" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a2530">Ako p<tspan baseline-shift="sub" font-size="0.7em">aps</tspan> padne ispod tlaka pare p<tspan baseline-shift="sub" font-size="0.7em">v</tspan>, ulje isparava u mjehuriće (kavitacija).</text>
  <text x="510" y="510" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a2530">Pri Q = 0: p<tspan baseline-shift="sub" font-size="0.7em">aps</tspan> = 80,8 kPa ≫ 0,2 kPa; statička granica nije dosegnuta.</text>
  <text x="510" y="524" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" fill="#5a6a78" transform="translate(0 8)">U radu uključiti brzinu i gubitke te provjeriti NPSH<tspan baseline-shift="sub" font-size="0.7em">A</tspan> &gt; NPSH<tspan baseline-shift="sub" font-size="0.7em">R</tspan>.</text>
  <text x="442" y="306" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-style="italic" font-weight="700" fill="#b7600c">H</text>
  <text x="442.0" y="322.0" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#b7600c">= 2,40 m</text>
  <text x="514" y="300" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#b7600c">3. Statička gornja granica (Q = 0; p<tspan baseline-shift="sub" font-size="0.7em">v</tspan> ≈ 200 Pa)</text>
  <text x="720" y="370" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#b7600c">
    <tspan font-style="italic">H</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">max</tspan> ≈ 11,8 m</text>
