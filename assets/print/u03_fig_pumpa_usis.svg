  <line x1="44" y1="124" x2="128" y2="124" stroke="#356b83" stroke-width="0.8" opacity="0.5" />
  <path d="M 140 140 Q 165 152 197 162" fill="none" stroke="#356b83" stroke-width="1.2" stroke-dasharray="4,3" />
  <line x1="216" y1="162" x2="430" y2="162" stroke="#657781" stroke-width="0.7" />
