<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="u03fpu_title u03fpu_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:900px;height:auto;">
  <title id="u03fpu_title">Tlak na usisu pumpe za cirkulaciju ulja</title>
  <desc id="u03fpu_desc">Idealni statički stupac ulja pri nultom protoku. Usis je otvoren i uronjen, s razmakom od dna; spoj s pumpom nije zatvoren poprečnom trakom. Kota H mjeri se od površine ulja do tlačne točke U. Pumpa je označena simbolom; račun ne prikazuje radni protok.</desc>
  <defs>
    <pattern id="u03fpu_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.1" />
    </pattern>
    <marker id="u03fpu_atm" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#657781" />
    </marker>
    <marker id="u03fpu_flow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#356b83" />
    </marker>
    <marker id="u03fpu_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#657781" />
    </marker>
    <marker id="u03fpu_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#657781" />
    </marker>
  </defs>
