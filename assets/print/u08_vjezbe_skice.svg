<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 700" role="img" aria-labelledby="u8vs-title u8vs-desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u8vs-title">U08 – skice zadataka T1 do T6</title>
  <desc id="u8vs-desc">Sest minimalnih grayscale tehnickih skica za U08 zadatke T1 do T6: cijev koja se siri, sapnica, komora za mijesanje, razdjelna glava, cilindricki spremnik, mijesajuci spremnik.</desc>
  <defs>
    <marker id="u8vs-arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#1f2933"/>
    </marker>
    <marker id="u8vs-arrRev" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M10,0 L10,8 L0,4 z" fill="#1f2933"/>
    </marker>
    <marker id="u8vs-arrUp" markerWidth="8" markerHeight="8" refX="4" refY="0" orient="auto">
      <path d="M0,8 L8,8 L4,0 z" fill="#555"/>
    </marker>
    <marker id="u8vs-arrDown" markerWidth="8" markerHeight="8" refX="4" refY="8" orient="auto">
      <path d="M0,0 L8,0 L4,8 z" fill="#555"/>
    </marker>
  </defs>
  <!-- Canvas -->
  <rect width="940" height="700" fill="#ffffff"/>
  <rect x="22" y="22" width="896" height="656" rx="16" fill="#ffffff" stroke="#d4d9de" stroke-width="2"/>
  <text x="54" y="57" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2933">U08 — Skice zadataka T1–T6</text>
  <text x="54" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5b6670">Minimalne tehničke skice za razumijevanje kontrolnog volumena, presjeka i smjera toka.</text>

  <!-- ======================================================= -->
  <!-- ROW 1: T1 (left) and T2 (right) -->
  <!-- Panel dims: col1 x=42..474(w432), col2 x=492..924(w432), rows each h=176 -->
  <!-- Row 1: y=96..272 -->

  <!-- T1: Cijev koja se širi -->
  <rect x="42" y="96" width="432" height="176" rx="12" fill="#fbfbfb" stroke="#d4dde4" stroke-width="1.6"/>
  <rect x="60" y="108" width="40" height="22" rx="5" fill="#e8ecf0" stroke="#c0c8d0" stroke-width="1.2"/>
  <text x="72" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">T1</text>
  <text x="112" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2933">Cijev koja se širi</text>
  <!-- Pipe expanding left to right -->
  <polygon points="72,158 72,210 200,210 280,230 400,230 400,230" fill="none"/>
  <!-- Top wall taper: (80,148) → (180,148) → (300,130) → (408,130) -->
  <path d="M80,148 L198,148 L308,128 L408,128" fill="none" stroke="#3f4750" stroke-width="9" stroke-linecap="round"/>
  <!-- Bottom wall: (80,200) → (198,200) → (308,220) → (408,220) -->
  <path d="M80,200 L198,200 L308,220 L408,220" fill="none" stroke="#3f4750" stroke-width="9" stroke-linecap="round"/>
  <!-- Inlet arrow -->
  <line x1="46" y1="174" x2="78" y2="174" stroke="#1f2933" stroke-width="2.5" marker-end="url(#u8vs-arr)"/>
  <!-- Outlet arrow -->
  <line x1="408" y1="174" x2="450" y2="174" stroke="#1f2933" stroke-width="2.5" marker-end="url(#u8vs-arr)"/>
  <!-- Labels -->
  <text x="100" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1f2933">D₁ = 100 mm</text>
  <text x="316" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1f2933">D₂ = 160 mm</text>
  <text x="48" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1f2933">v₁</text>
  <text x="452" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1f2933">v₂</text>
  <!-- KV dashed -->
  <rect x="72" y="136" width="348" height="76" rx="6" fill="none" stroke="#c96c35" stroke-width="1.5" stroke-dasharray="7,4"/>

  <!-- T2: Sapnica -->
  <rect x="492" y="96" width="432" height="176" rx="12" fill="#fbfbfb" stroke="#d4dde4" stroke-width="1.6"/>
  <rect x="510" y="108" width="40" height="22" rx="5" fill="#e8ecf0" stroke="#c0c8d0" stroke-width="1.2"/>
  <text x="522" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">T2</text>
  <text x="562" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2933">Sapnica</text>
  <!-- Nozzle: wide left → narrow right -->
  <path d="M530,138 L640,138 L740,158 L840,158" fill="none" stroke="#3f4750" stroke-width="9" stroke-linecap="round"/>
  <path d="M530,210 L640,210 L740,190 L840,190" fill="none" stroke="#3f4750" stroke-width="9" stroke-linecap="round"/>
  <line x1="496" y1="174" x2="528" y2="174" stroke="#1f2933" stroke-width="2.5" marker-end="url(#u8vs-arr)"/>
  <line x1="840" y1="174" x2="876" y2="174" stroke="#1f2933" stroke-width="2.5" marker-end="url(#u8vs-arr)"/>
  <text x="548" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1f2933">D₁ = 120 mm</text>
  <text x="748" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1f2933">D₂ = 50 mm</text>
  <text x="498" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1f2933">v₁</text>
  <text x="878" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1f2933">v₂↑</text>
  <rect x="522" y="126" width="336" height="96" rx="6" fill="none" stroke="#c96c35" stroke-width="1.5" stroke-dasharray="7,4"/>

  <!-- ======================================================= -->
  <!-- ROW 2: T3 (left) and T4 (right), y=284..460 -->

  <!-- T3: Komora za miješanje -->
  <rect x="42" y="284" width="432" height="176" rx="12" fill="#fbfbfb" stroke="#d4dde4" stroke-width="1.6"/>
  <rect x="60" y="296" width="40" height="22" rx="5" fill="#e8ecf0" stroke="#c0c8d0" stroke-width="1.2"/>
  <text x="72" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">T3</text>
  <text x="112" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2933">Komora za miješanje</text>
  <!-- Central mixing chamber -->
  <rect x="196" y="334" width="96" height="92" rx="4" fill="#eaeff3" stroke="#3f4750" stroke-width="2"/>
  <!-- Inlet 1 (upper) -->
  <line x1="88" y1="364" x2="196" y2="364" stroke="#3f4750" stroke-width="8" stroke-linecap="round"/>
  <line x1="52" y1="364" x2="86" y2="364" stroke="#1f2933" stroke-width="2.5" marker-end="url(#u8vs-arr)"/>
  <!-- Inlet 2 (lower) -->
  <line x1="96" y1="404" x2="196" y2="404" stroke="#3f4750" stroke-width="8" stroke-linecap="round"/>
  <line x1="60" y1="404" x2="94" y2="404" stroke="#1f2933" stroke-width="2.5" marker-end="url(#u8vs-arr)"/>
  <!-- Outlet -->
  <line x1="292" y1="380" x2="400" y2="380" stroke="#3f4750" stroke-width="8" stroke-linecap="round"/>
  <line x1="400" y1="380" x2="444" y2="380" stroke="#1f2933" stroke-width="2.5" marker-end="url(#u8vs-arr)"/>
  <!-- Labels -->
  <text x="54" y="357" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1f2933">Q₁</text>
  <text x="62" y="398" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1f2933">Q₂</text>
  <text x="410" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1f2933">Q₃</text>
  <text x="214" y="396" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#516677" text-anchor="middle">miješ.</text>
  <!-- KV -->
  <rect x="184" y="322" width="124" height="116" rx="6" fill="none" stroke="#c96c35" stroke-width="1.5" stroke-dasharray="7,4"/>

  <!-- T4: Razdjelna glava -->
  <rect x="492" y="284" width="432" height="176" rx="12" fill="#fbfbfb" stroke="#d4dde4" stroke-width="1.6"/>
  <rect x="510" y="296" width="40" height="22" rx="5" fill="#e8ecf0" stroke="#c0c8d0" stroke-width="1.2"/>
  <text x="522" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">T4</text>
  <text x="562" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2933">Razdjelna glava</text>
  <!-- T-junction (splitting) -->
  <!-- Inlet horizontal -->
  <line x1="524" y1="372" x2="668" y2="372" stroke="#3f4750" stroke-width="10" stroke-linecap="round"/>
  <line x1="494" y1="372" x2="522" y2="372" stroke="#1f2933" stroke-width="2.5" marker-end="url(#u8vs-arr)"/>
  <!-- Upper branch -->
  <line x1="668" y1="372" x2="750" y2="332" stroke="#3f4750" stroke-width="8" stroke-linecap="round"/>
  <line x1="750" y1="332" x2="800" y2="332" stroke="#1f2933" stroke-width="2.5" marker-end="url(#u8vs-arr)"/>
  <!-- Lower branch -->
  <line x1="668" y1="372" x2="750" y2="412" stroke="#3f4750" stroke-width="8" stroke-linecap="round"/>
  <line x1="750" y1="412" x2="800" y2="412" stroke="#1f2933" stroke-width="2.5" marker-end="url(#u8vs-arr)"/>
  <!-- Labels -->
  <text x="494" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1f2933">Q</text>
  <text x="804" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1f2933">Q₂</text>
  <text x="804" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1f2933">Q₃</text>
  <text x="680" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#516677">v₂=2v₃</text>
  <!-- KV -->
  <rect x="656" y="316" width="32" height="116" rx="4" fill="none" stroke="#c96c35" stroke-width="1.5" stroke-dasharray="7,4"/>

  <!-- ======================================================= -->
  <!-- ROW 3: T5 (left) and T6 (right), y=472..648 -->

  <!-- T5: Cilindrični spremnik s akumulacijom -->
  <rect x="42" y="472" width="432" height="176" rx="12" fill="#fbfbfb" stroke="#d4dde4" stroke-width="1.6"/>
  <rect x="60" y="484" width="40" height="22" rx="5" fill="#e8ecf0" stroke="#c0c8d0" stroke-width="1.2"/>
  <text x="72" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">T5</text>
  <text x="112" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2933">Cilindrični spremnik (akumulacija)</text>
  <!-- Cylindrical tank (2D rect) -->
  <rect x="152" y="524" width="180" height="106" fill="none" stroke="#3f4750" stroke-width="2.5"/>
  <!-- Water fill line -->
  <rect x="152" y="572" width="180" height="58" fill="#d4eef8" stroke="none"/>
  <line x1="152" y1="572" x2="332" y2="572" stroke="#2980b9" stroke-width="2"/>
  <line x1="152" y1="546" x2="332" y2="546" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Inlet from left -->
  <line x1="72" y1="548" x2="152" y2="548" stroke="#3f4750" stroke-width="7" stroke-linecap="round"/>
  <line x1="44" y1="548" x2="70" y2="548" stroke="#1f2933" stroke-width="2.5" marker-end="url(#u8vs-arr)"/>
  <!-- Outlet from bottom -->
  <line x1="242" y1="630" x2="242" y2="664" stroke="#3f4750" stroke-width="7" stroke-linecap="round"/>
  <line x1="242" y1="664" x2="242" y2="672" stroke="#1f2933" stroke-width="2.5" marker-end="url(#u8vs-arrDown)"/>
  <!-- dh/dt arrow up -->
  <line x1="350" y1="570" x2="350" y2="548" stroke="#555" stroke-width="2" marker-end="url(#u8vs-arrUp)"/>
  <!-- Labels -->
  <text x="44" y="540" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1f2933">Q_in</text>
  <text x="248" y="672" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1f2933">Q_out</text>
  <text x="356" y="564" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#555">h(t)</text>
  <text x="156" y="542" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#516677">D = 1,60 m</text>
  <!-- KV -->
  <rect x="142" y="514" width="200" height="126" rx="6" fill="none" stroke="#c96c35" stroke-width="1.5" stroke-dasharray="7,4"/>

  <!-- T6: Miješajući spremnik -->
  <rect x="492" y="472" width="432" height="176" rx="12" fill="#fbfbfb" stroke="#d4dde4" stroke-width="1.6"/>
  <rect x="510" y="484" width="40" height="22" rx="5" fill="#e8ecf0" stroke="#c0c8d0" stroke-width="1.2"/>
  <text x="522" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">T6</text>
  <text x="562" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2933">Miješajući spremnik</text>
  <!-- Tank -->
  <rect x="616" y="518" width="162" height="110" fill="none" stroke="#3f4750" stroke-width="2.5"/>
  <rect x="616" y="558" width="162" height="70" fill="#d4eef8" stroke="none"/>
  <line x1="616" y1="558" x2="778" y2="558" stroke="#2980b9" stroke-width="2"/>
  <line x1="616" y1="534" x2="778" y2="534" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Two inlets from left (different positions) -->
  <line x1="530" y1="534" x2="616" y2="534" stroke="#3f4750" stroke-width="7" stroke-linecap="round"/>
  <line x1="530" y1="562" x2="616" y2="562" stroke="#3f4750" stroke-width="5" stroke-linecap="round"/>
  <line x1="502" y1="534" x2="528" y2="534" stroke="#1f2933" stroke-width="2.5" marker-end="url(#u8vs-arr)"/>
  <line x1="502" y1="562" x2="528" y2="562" stroke="#1f2933" stroke-width="2.5" marker-end="url(#u8vs-arr)"/>
  <!-- Outlet right -->
  <line x1="778" y1="582" x2="864" y2="582" stroke="#3f4750" stroke-width="7" stroke-linecap="round"/>
  <line x1="864" y1="582" x2="896" y2="582" stroke="#1f2933" stroke-width="2.5" marker-end="url(#u8vs-arr)"/>
  <!-- dh/dt -->
  <line x1="796" y1="556" x2="796" y2="536" stroke="#555" stroke-width="2" marker-end="url(#u8vs-arrUp)"/>
  <!-- Labels -->
  <text x="502" y="526" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1f2933">Q_A</text>
  <text x="502" y="556" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1f2933">Q_B</text>
  <text x="872" y="575" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1f2933">Q₃</text>
  <text x="800" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#555">h(t)</text>
  <!-- KV -->
  <rect x="606" y="508" width="182" height="130" rx="6" fill="none" stroke="#c96c35" stroke-width="1.5" stroke-dasharray="7,4"/>
</svg>