<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="u06c1ps_title u06c1ps_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:920px;height:auto;">
  <title id="u06c1ps_title">Četvrtcilindrični poklopac s vodoravnom spojnicom</title>
  <desc id="u06c1ps_desc">Četvrtkružni poklopac sa središtem kružnice O, zglobom A gore lijevo i spojnicom D dolje desno. Voda je na konveksnoj lijevoj i donjoj strani; sile vode su desno i gore. Vstar je jedinstven četvrtcilindrični pomoćni volumen na suhoj strani. Zglob je vezan uz gornju stijenku. Spojnica djeluje ulijevo u D izvan širine presjeka. Krak FV mjeri se od A, a ne od O.</desc>
