    </marker>
    <marker id="u05p6_dimL" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse">
      <path d="M0 0 L0 5 L6 2.5 Z" fill="#657781" stroke="none" stroke-width="1.2" />
    </marker>
    <pattern id="u05p6_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="7" height="7" fill="#d7dee3" stroke="none" stroke-width="1.2" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.1" />
    </pattern>
  </defs>
  <text x="720" y="62" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">Postupak (R = 1,10 m, b = 1,40 m, ρ = 998 kg/m³)</text>
  <text x="524" y="102" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" fill="#263746">1. Horizontalna komponenta</text>
  <text x="524" y="122" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746">A<tspan baseline-shift="sub" font-size="0.75em">x</tspan> = R·b = 1,54 m²,  h<tspan baseline-shift="sub" font-size="0.75em">Cx</tspan> = R/2 = 0,55 m</text>
  <text x="524" y="142" font-family="Arial, Liberation Sans, sans-serif" font-size="13" fill="#263746">
    <tspan font-weight="700">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em" font-weight="700">H</tspan> = ρ g A<tspan baseline-shift="sub" font-size="0.75em">x</tspan> h<tspan baseline-shift="sub" font-size="0.75em">Cx</tspan> ≈ <tspan font-weight="700" fill="#263746">8,29 kN</tspan>
  </text>
  <text x="524" y="160" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746">pravac sile na dubini h<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">H</tspan> = 2R/3 ≈ 0,733 m</text>
  <text x="524" y="198" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" fill="#263746">2. Vertikalna komponenta (težina V*)</text>
  <text x="524" y="218" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746">V* = πR²b / 4 = 1,331 m³</text>
  <text x="524" y="238" font-family="Arial, Liberation Sans, sans-serif" font-size="13" fill="#263746">
    <tspan font-weight="700">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em" font-weight="700">V</tspan> = ρ g V* ≈ <tspan font-weight="700" fill="#263746">13,03 kN</tspan> (prema gore)</text>
  <text x="524" y="256" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746">krak od A: x<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">V</tspan> = R−4R/(3π) ≈ 0,633 m</text>
  <text x="524" y="314" font-family="Arial, Liberation Sans, sans-serif" font-size="13" fill="#263746">
    <tspan font-weight="700">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em" font-weight="700">R</tspan> = √(F<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">H</tspan>² + F<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">V</tspan>²) ≈ <tspan font-weight="700" fill="#263746">15,44 kN</tspan>
  </text>
  <text x="524" y="334" font-family="Arial, Liberation Sans, sans-serif" font-size="12" fill="#263746">α = arctan(F<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">V</tspan> / F<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">H</tspan>) ≈ <tspan font-weight="700" fill="#263746">57,5°</tspan> (prema gore)</text>
  <text x="524" y="382" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" fill="#263746">4. Sila spojnice iz ΣM<tspan baseline-shift="sub" font-size="0.7em">A</tspan> = 0</text>
  <text x="524" y="402" font-family="Arial, Liberation Sans, sans-serif" font-size="12" fill="#263746">T · R = F<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">H</tspan> · h<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">H</tspan> + F<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">V</tspan> · x<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">V</tspan>
  </text>
  <text x="524" y="422" font-family="Arial, Liberation Sans, sans-serif" font-size="12" fill="#263746">T = (F<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">H</tspan> · h<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">H</tspan> + F<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">V</tspan> · x<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">V</tspan>) / R</text>
  <text x="524" y="444" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" fill="#263746">T ≈ 13,03 kN  (prema lijevo)</text>
  <text x="720" y="484" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#263746">REZULTATI</text>
  <text x="556" y="503" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" font-weight="700" fill="#263746">F<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">H</tspan> = 8,29 kN</text>
  <text x="660" y="503" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" font-weight="700" fill="#263746">F<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">V</tspan> = 13,03 kN</text>
  <text x="864" y="503" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" font-weight="700" fill="#263746">T = 13,03 kN</text>
  <text x="524" y="294" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" fill="#263746">3. Rezultanta i kut prema horizontali</text>
  <text x="772" y="503" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" font-weight="700" fill="#263746">F<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">R</tspan> = 15,44 kN</text>
  <g font-family="Arial, Liberation Sans, sans-serif" />
