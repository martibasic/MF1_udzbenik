      <path d="M0,0 L0,6 L7,3 z" fill="#356b83" />
    </marker>
    <marker id="u05p6_force" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0 0 L0 5 L6 2.5 Z" fill="#356b83" stroke="none" stroke-width="1.2" />
    </marker>
    <marker id="u05p6_green" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0 0 L0 5 L6 2.5 Z" fill="#356b83" stroke="none" stroke-width="1.2" />
    </marker>
    <marker id="u05p6_normal" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
