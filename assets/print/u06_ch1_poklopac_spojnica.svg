  <text x="720" y="62" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1565c0">Postupak (R = 1,10 m, b = 1,40 m, ρ = 998 kg/m³)</text>
  <text x="524" y="102" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#c0392b">1. Horizontalna komponenta</text>
  <text x="524" y="122" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">A<tspan baseline-shift="sub" font-size="0.75em">x</tspan> = R·b = 1,54 m²,  h<tspan baseline-shift="sub" font-size="0.75em">Cx</tspan> = R/2 = 0,55 m</text>
  <text x="524" y="142" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1a2530">
    <tspan font-weight="700">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em" font-weight="700">H</tspan> = ρ g A<tspan baseline-shift="sub" font-size="0.75em">x</tspan> h<tspan baseline-shift="sub" font-size="0.75em">Cx</tspan> ≈ <tspan font-weight="700" fill="#c0392b">8,29 kN</tspan>
  </text>
  <text x="524" y="160" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">pravac sile na dubini h<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">H</tspan> = 2R/3 ≈ 0,733 m</text>
  <text x="524" y="198" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#c0392b">2. Vertikalna komponenta (težina V*)</text>
  <text x="524" y="218" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">V* = πR²b / 4 = 1,331 m³</text>
  <text x="524" y="238" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1a2530">
    <tspan font-weight="700">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em" font-weight="700">V</tspan> = ρ g V* ≈ <tspan font-weight="700" fill="#c0392b">13,03 kN</tspan> (prema gore)</text>
  <text x="524" y="256" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">krak od A: x<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">V</tspan> = R−4R/(3π) ≈ 0,633 m</text>
  <text x="524" y="314" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1a2530">
    <tspan font-weight="700">F</tspan>
    <tspan baseline-shift="sub" font-size="0.7em" font-weight="700">R</tspan> = √(F<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">H</tspan>² + F<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">V</tspan>²) ≈ <tspan font-weight="700" fill="#b7600c">15,44 kN</tspan>
  </text>
  <text x="524" y="334" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530">α = arctan(F<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">V</tspan> / F<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">H</tspan>) ≈ <tspan font-weight="700" fill="#b7600c">57,5°</tspan> (prema gore)</text>
  <text x="524" y="382" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1e8449">4. Sila spojnice iz ΣM<tspan baseline-shift="sub" font-size="0.7em">A</tspan> = 0</text>
  <text x="524" y="402" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530">T · R = F<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">H</tspan> · h<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">H</tspan> + F<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">V</tspan> · x<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">V</tspan>
  </text>
  <text x="524" y="422" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a2530">T = (F<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">H</tspan> · h<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">H</tspan> + F<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">V</tspan> · x<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">V</tspan>) / R</text>
  <text x="524" y="444" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e8449">T ≈ 13,03 kN  (prema lijevo)</text>
  <text x="720" y="484" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#5a6a78">REZULTATI</text>
  <text x="556" y="503" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#c0392b">F<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">H</tspan> = 8,29 kN</text>
  <text x="660" y="503" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#c0392b">F<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">V</tspan> = 13,03 kN</text>
  <text x="864" y="503" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1e8449">T = 13,03 kN</text>
  <text x="524" y="294" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#b7600c">3. Rezultanta i kut prema horizontali</text>
  <text x="772" y="503" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#b7600c">F<tspan baseline-shift="sub" font-size="0.7em" font-weight="700">R</tspan> = 15,44 kN</text>
