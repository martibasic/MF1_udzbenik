<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 475" role="img" aria-labelledby="u08v1dk_title u08v1dk_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:880px;height:auto;">
  <title id="u08v1dk_title">Difuzor i kontinuitet</title>
  <desc id="u08v1dk_desc">Difuzor s ulaznim promjerom D1 = 120 mm i izlaznim promjerom D2 = 180 mm. Voda ulazi brzinom v1 = 36 m/s, izlazi brzinom v2 = 16 m/s. Kontrolni volumen obuhvaća cijeli difuzor. Desno: izvod kontinuiteta A1 v1 = A2 v2, volumenski protok Q i maseni protok.</desc>
  <defs>
    <pattern id="u08v1dk_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#d7dee3" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.1" />
    </pattern>
    <marker id="u08v1dk_vR" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#356b83" />
    </marker>
    <marker id="u08v1dk_vG" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#356b83" />
    </marker>
    <marker id="u08v1dk_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#657781" />
    </marker>
    <marker id="u08v1dk_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#657781" />
    </marker>
    <marker id="u08v1dk_strm" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#356b83" />
    </marker>
  </defs>
  <polygon points="60,200 160,200 340,180 460,180 460,300 340,300 160,280 60,280" fill="#dcebf1" />
  <polygon points="60,180 160,180 340,160 460,160 460,180 340,180 160,200 60,200" fill="url(#u08v1dk_hatch)" />
  <polygon points="60,280 160,280 340,300 460,300 460,320 340,320 160,300 60,300" fill="url(#u08v1dk_hatch)" />
  <line x1="60" y1="180" x2="160" y2="180" stroke="#3a4a56" stroke-width="1.6" />
  <line x1="160" y1="180" x2="340" y2="160" stroke="#3a4a56" stroke-width="1.6" />
  <line x1="340" y1="160" x2="460" y2="160" stroke="#3a4a56" stroke-width="1.6" />
  <line x1="60" y1="300" x2="160" y2="300" stroke="#3a4a56" stroke-width="1.6" />
  <line x1="160" y1="300" x2="340" y2="320" stroke="#3a4a56" stroke-width="1.6" />
  <line x1="340" y1="320" x2="460" y2="320" stroke="#3a4a56" stroke-width="1.6" />
  <line x1="60" y1="200" x2="160" y2="200" stroke="#356b83" stroke-width="1.2" opacity="0.55" />
  <line x1="160" y1="200" x2="340" y2="180" stroke="#356b83" stroke-width="1.2" opacity="0.55" />
  <line x1="340" y1="180" x2="460" y2="180" stroke="#356b83" stroke-width="1.2" opacity="0.55" />
  <line x1="60" y1="280" x2="160" y2="280" stroke="#356b83" stroke-width="1.2" opacity="0.55" />
  <line x1="160" y1="280" x2="340" y2="300" stroke="#356b83" stroke-width="1.2" opacity="0.55" />
  <line x1="340" y1="300" x2="460" y2="300" stroke="#356b83" stroke-width="1.2" opacity="0.55" />
  <line x1="40" y1="240" x2="478" y2="240" stroke="#657781" stroke-width="0.8" stroke-dasharray="6,5" />
  <line x1="135" y1="200" x2="135" y2="280" stroke="#356b83" stroke-width="1.4" stroke-dasharray="5,4" />
  <line x1="400" y1="180" x2="400" y2="300" stroke="#356b83" stroke-width="1.4" stroke-dasharray="5,4" />
  <line x1="62" y1="240" x2="132" y2="240" stroke="#356b83" stroke-width="3" marker-end="url(#u08v1dk_vR)" />
  <line x1="408" y1="240" x2="439" y2="240" stroke="#356b83" stroke-width="3" marker-end="url(#u08v1dk_vG)" />
  <rect x="130" y="135" width="275" height="215" fill="none" stroke="#657781" stroke-width="1.6" stroke-dasharray="9,5" rx="6" />
  <circle cx="135" cy="120" r="11" fill="#ffffff" stroke="#356b83" stroke-width="1.5" />
  <circle cx="400" cy="120" r="11" fill="#ffffff" stroke="#356b83" stroke-width="1.5" />
  <g opacity="0.55" stroke="#356b83" stroke-width="1.3" fill="none">
    <line x1="200" y1="222" x2="240" y2="218" marker-end="url(#u08v1dk_strm)" stroke="#356b83" />
    <line x1="200" y1="258" x2="240" y2="262" marker-end="url(#u08v1dk_strm)" stroke="#356b83" />
    <line x1="270" y1="212" x2="310" y2="206" marker-end="url(#u08v1dk_strm)" stroke="#356b83" />
    <line x1="270" y1="268" x2="310" y2="274" marker-end="url(#u08v1dk_strm)" stroke="#356b83" />
    <line x1="345" y1="200" x2="385" y2="198" marker-end="url(#u08v1dk_strm)" stroke="#356b83" />
    <line x1="345" y1="280" x2="385" y2="282" marker-end="url(#u08v1dk_strm)" stroke="#356b83" />
  </g>
  <line x1="60" y1="200" x2="42" y2="200" stroke="#657781" stroke-width="0.7" />
  <line x1="60" y1="280" x2="42" y2="280" stroke="#657781" stroke-width="0.7" />
  <line x1="46" y1="204" x2="46" y2="276" stroke="#657781" stroke-width="1.3" marker-start="url(#u08v1dk_dimL)" marker-end="url(#u08v1dk_dim)" />
  <line x1="400" y1="180" x2="470" y2="180" stroke="#657781" stroke-width="0.7" />
  <line x1="400" y1="300" x2="470" y2="300" stroke="#657781" stroke-width="0.7" />
  <line x1="465" y1="184" x2="465" y2="296" stroke="#657781" stroke-width="1.3" marker-start="url(#u08v1dk_dimL)" marker-end="url(#u08v1dk_dim)" />
  <text x="40" y="50" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" fill="#263746">Difuzor s kontrolnim volumenom</text>
  <text x="142" y="270" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-style="italic" fill="#263746">A<tspan baseline-shift="sub" font-size="0.7em">1</tspan>
  </text>
  <text x="378" y="290" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-style="italic" fill="#263746">A<tspan baseline-shift="sub" font-size="0.7em">2</tspan>
  </text>
  <text x="97" y="222" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="#263746">
    <tspan font-weight="700">v</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">1</tspan> = 36 m/s</text>
  <text x="408" y="222" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-style="italic" fill="#263746" transform="translate(-36 0)">
    <tspan font-weight="700">v</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 16 m/s</text>
  <text x="268" y="370" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#263746">kontrolni volumen (KV)</text>
  <text x="135" y="124" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#263746">1</text>
  <text x="400" y="124" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#263746">2</text>
  <text x="40" y="408" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-style="italic" fill="#263746">voda:  ρ = 998 kg/m³ (nestlačiva, stacionarno)</text>
  <text x="40" y="430" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" fill="#263746">Presjek raste → brzina pada; isti Q prolazi kroz oba presjeka.</text>
  <text x="706" y="42" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#263746">Kontinuitet:  A·v = const.</text>
  <text x="706" y="92" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">1. Površine presjeka  A = π D² / 4</text>
  <text x="706" y="114" font-family="Arial, Liberation Sans, sans-serif" font-size="13" text-anchor="middle" fill="#263746">A<tspan baseline-shift="sub" font-size="0.7em">1</tspan> = π · 0,12²/4 ≈ 0,01131 m²</text>
  <text x="706" y="134" font-family="Arial, Liberation Sans, sans-serif" font-size="13" text-anchor="middle" fill="#263746">A<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = π · 0,18²/4 ≈ 0,02545 m²</text>
  <text x="706" y="180" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">2. Ulazna brzina iz A<tspan baseline-shift="sub" font-size="0.7em">1</tspan>v<tspan baseline-shift="sub" font-size="0.7em">1</tspan> = A<tspan baseline-shift="sub" font-size="0.7em">2</tspan>v<tspan baseline-shift="sub" font-size="0.7em">2</tspan>
  </text>
  <text x="706" y="202" font-family="Arial, Liberation Sans, sans-serif" font-size="13" text-anchor="middle" fill="#263746">v<tspan baseline-shift="sub" font-size="0.7em">1</tspan> = (D<tspan baseline-shift="sub" font-size="0.7em">2</tspan>/D<tspan baseline-shift="sub" font-size="0.7em">1</tspan>)² · v<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = (0,18/0,12)² · 16</text>
  <text x="706" y="226" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">v<tspan baseline-shift="sub" font-size="0.7em">1</tspan> = 36 m/s</text>
  <text x="706" y="268" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">3. Volumenski protok</text>
  <text x="706" y="290" font-family="Arial, Liberation Sans, sans-serif" font-size="13" text-anchor="middle" fill="#263746">Q = A<tspan baseline-shift="sub" font-size="0.7em">2</tspan>v<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 0,02545 · 16</text>
  <text x="706" y="307" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 9)">Q ≈ 0,407 m³/s</text>
  <text x="706" y="342" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746" transform="translate(0 15)">4. Maseni protok</text>
  <text x="706" y="364" font-family="Arial, Liberation Sans, sans-serif" font-size="13" text-anchor="middle" fill="#263746" transform="translate(0 15)">ṁ = ρ Q = 998 · 0,407</text>
  <text x="706" y="381" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 15)">ṁ ≈ 406 kg/s</text>
  <text x="706" y="412" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 15)">REZULTATI</text>
  <text x="606" y="430" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 15)">v₁ = 36 m/s</text>
  <text x="706" y="430" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 15)">Q ≈ 0,407 m³/s</text>
  <text x="806" y="430" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 15)">ṁ ≈ 406 kg/s</text>
  <text x="51" y="262" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" fill="#263746">
    <tspan font-weight="700">D</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">1</tspan>
  </text>
  <text x="51.0" y="278.0" font-family="Arial, Liberation Sans, sans-serif" font-size="10" fill="#263746">= 120 mm</text>
  <text x="472" y="234" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" fill="#263746">
    <tspan font-weight="700">D</tspan>
    <tspan baseline-shift="sub" font-size="0.7em">2</tspan>
  </text>
  <text x="472.0" y="250.0" font-family="Arial, Liberation Sans, sans-serif" font-size="10" fill="#263746">= 180 mm</text>
</svg>
