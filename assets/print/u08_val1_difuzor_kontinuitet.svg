<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 71 525 350" role="img" aria-labelledby="u08v1dk_title u08v1dk_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:525px;height:auto;">
  <title id="u08v1dk_title">Difuzor i kontinuitet</title>
  <desc id="u08v1dk_desc">Difuzor s ulaznim promjerom D1 = 120 mm i izlaznim promjerom D2 = 180 mm. Ulazna brzina je nepoznata, izlazna zadana; duljine strelica u omjeru 3,6 : 1,6 slijede kontinuitet, a kratke sive strelice smjera strujnica skraćuju se prema izlazu. Kontrolni volumen obuhvaća cijeli difuzor i presijeca presjeke 1 i 2.</desc>
