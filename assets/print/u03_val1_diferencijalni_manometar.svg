<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" role="img"
     aria-labelledby="u03v1dm_u3v1T u03v1dm_u3v1D" preserveAspectRatio="xMidYMid meet"
     style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u03v1dm_u3v1T">Diferencijalni manometar — slatka voda, morska voda, ziva, zrak (Z23)</title>
  <desc id="u03v1dm_u3v1D">Dvostruki U-manometar (W-oblik) s cetiri fluida: slatka voda h1, razlika razina zive h2, zrak h3, morska voda h4. Rezultat: p1-p2 = 3,39 kPa.</desc>
  <defs>
    <marker id="u03v1dm_u3v1aF" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#92400e"/>
    </marker>
    <marker id="u03v1dm_u3v1aR" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L0,8 L8,4 z" fill="#92400e"/>
    </marker>
    <linearGradient id="u03v1dm_u3v1fw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d6eef9"/>
      <stop offset="100%" stop-color="#7ec8e8"/>
    </linearGradient>
    <linearGradient id="u03v1dm_u3v1sw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a96cc"/>
      <stop offset="100%" stop-color="#1a5f8a"/>
    </linearGradient>
    <linearGradient id="u03v1dm_u3v1hg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b4c2cc"/>
      <stop offset="100%" stop-color="#728090"/>
    </linearGradient>
  </defs>
  <!-- Pozadina i okvir -->
  <rect width="940" height="420" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="372" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="1.8"/>
  <!-- ── ZIDOVI CIJEVI (tamno sivi pravokutnici, crtani PRVI) ── -->
  <!-- Cijev 1 (vod 1, slatka voda) -->
  <rect x="36" y="108" width="164" height="40" rx="4" fill="#546e7a"/>
  <!-- Lijevi vanjski krak -->
  <rect x="192" y="108" width="40" height="266" fill="#546e7a"/>
  <!-- Lijevo dno U -->
  <rect x="192" y="360" width="178" height="38" fill="#546e7a"/>
  <!-- Lijevi unutarnji krak -->
  <rect x="338" y="148" width="40" height="212" fill="#546e7a"/>
  <!-- Mostic (bridge) -->
  <rect x="338" y="140" width="122" height="24" fill="#546e7a"/>
  <!-- Desni unutarnji krak -->
  <rect x="460" y="148" width="40" height="212" fill="#546e7a"/>
  <!-- Desno dno U -->
  <rect x="460" y="360" width="88" height="38" fill="#546e7a"/>
  <!-- Desni vanjski krak -->
  <rect x="526" y="108" width="40" height="266" fill="#546e7a"/>
  <!-- Cijev 2 (vod 2, morska voda) -->
  <rect x="562" y="108" width="68" height="40" rx="4" fill="#546e7a"/>
  <!-- ── PUNJENJE FLUIDIMA (unutar cijevi, 4 px inset) ── -->
  <!-- Slatka voda - unutar cijevi 1 -->
  <rect x="40" y="112" width="156" height="32" fill="url(#u03v1dm_u3v1fw)"/>
  <!-- Slatka voda - lijevi vanjski krak (h1 zona) -->
  <rect x="196" y="126" width="32" height="68" fill="url(#u03v1dm_u3v1fw)"/>
  <!-- Ziva - lijevi vanjski krak (ispod slatke vode) -->
  <rect x="196" y="194" width="32" height="170" fill="url(#u03v1dm_u3v1hg)"/>
  <!-- Ziva - lijevo dno U -->
  <rect x="196" y="362" width="170" height="32" fill="url(#u03v1dm_u3v1hg)"/>
  <!-- Zrak - lijevi unutarnji krak (h3 zona, iznad zive) -->
  <rect x="342" y="152" width="32" height="68" fill="#f0ece4"/>
  <!-- Ziva - lijevi unutarnji krak (ispod zraka, povrsina na y=220) -->
  <rect x="342" y="220" width="32" height="140" fill="url(#u03v1dm_u3v1hg)"/>
  <!-- Zrak - mostic -->
  <rect x="342" y="144" width="114" height="16" fill="#f0ece4"/>
  <!-- Zrak - desni unutarnji krak (iznad zive, povrsina na y=202) -->
  <rect x="464" y="152" width="32" height="50" fill="#f0ece4"/>
  <!-- Ziva - desni unutarnji krak (h2 visi od lijevog) -->
  <rect x="464" y="202" width="32" height="158" fill="url(#u03v1dm_u3v1hg)"/>
  <!-- Ziva - desno dno U -->
  <rect x="464" y="362" width="80" height="32" fill="url(#u03v1dm_u3v1hg)"/>
  <!-- Morska voda - desni vanjski krak (h4 zona) -->
  <rect x="530" y="126" width="32" height="54" fill="url(#u03v1dm_u3v1sw)"/>
  <!-- Ziva - desni vanjski krak (ispod morske vode) -->
  <rect x="530" y="180" width="32" height="184" fill="url(#u03v1dm_u3v1hg)"/>
  <!-- Morska voda - unutar cijevi 2 -->
  <rect x="566" y="112" width="60" height="32" fill="url(#u03v1dm_u3v1sw)"/>
  <!-- ── GRANICZNE LINIJE FLUIDA (isprekinane) ── -->
  <line x1="192" y1="194" x2="232" y2="194" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="338" y1="220" x2="378" y2="220" stroke="#909fa8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="460" y1="202" x2="500" y2="202" stroke="#909fa8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="526" y1="180" x2="566" y2="180" stroke="#1a5f8a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- ── KOTNE LINIJE ── -->
  <!-- h1: slatka voda (y=126..194) lijeva strana lijevog vanjskog kraka -->
  <line x1="183" y1="126" x2="183" y2="194" stroke="#92400e" stroke-width="1.6"
        marker-start="url(#u03v1dm_u3v1aR)" marker-end="url(#u03v1dm_u3v1aF)"/>
  <line x1="183" y1="126" x2="193" y2="126" stroke="#92400e" stroke-width="1"/>
  <line x1="183" y1="194" x2="193" y2="194" stroke="#92400e" stroke-width="1"/>
  <text x="170" y="165" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic"
        fill="#92400e" text-anchor="middle">h&#x2081;</text>
  <!-- h2: razlika razina zive izm. unutarnjih krakova (y=220 i y=202) -->
  <line x1="412" y1="220" x2="412" y2="202" stroke="#92400e" stroke-width="1.6"
        marker-start="url(#u03v1dm_u3v1aR)" marker-end="url(#u03v1dm_u3v1aF)"/>
  <line x1="378" y1="220" x2="413" y2="220" stroke="#92400e" stroke-width="0.9" stroke-dasharray="3,2"/>
  <line x1="500" y1="202" x2="413" y2="202" stroke="#92400e" stroke-width="0.9" stroke-dasharray="3,2"/>
  <text x="428" y="214" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic"
        fill="#92400e">h&#x2082;</text>
  <!-- h3: visina zraka u lijevom unutarnjem kraku (y=152..220) -->
  <line x1="332" y1="152" x2="332" y2="220" stroke="#92400e" stroke-width="1.6"
        marker-start="url(#u03v1dm_u3v1aR)" marker-end="url(#u03v1dm_u3v1aF)"/>
  <line x1="332" y1="152" x2="342" y2="152" stroke="#92400e" stroke-width="1"/>
  <line x1="332" y1="220" x2="342" y2="220" stroke="#92400e" stroke-width="1"/>
  <text x="316" y="191" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic"
        fill="#92400e" text-anchor="middle">h&#x2083;</text>
  <!-- h4: morska voda desni vanjski krak (y=126..180) -->
  <line x1="570" y1="126" x2="570" y2="180" stroke="#92400e" stroke-width="1.6"
        marker-start="url(#u03v1dm_u3v1aR)" marker-end="url(#u03v1dm_u3v1aF)"/>
  <line x1="562" y1="126" x2="571" y2="126" stroke="#92400e" stroke-width="1"/>
  <line x1="562" y1="180" x2="571" y2="180" stroke="#92400e" stroke-width="1"/>
  <text x="583" y="158" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic"
        fill="#92400e">h&#x2084;</text>
  <!-- ── NATPISI ── -->
  <circle cx="195" cy="128" r="4.5" fill="#c0392b"/>
  <text x="36" y="101" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700"
        fill="#546e7a">vod 1 (slatka voda)</text>
  <text x="44" y="160" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-style="italic"
        font-weight="700" fill="#c0392b">p&#x2081;</text>
  <circle cx="529" cy="128" r="4.5" fill="#c0392b"/>
  <text x="562" y="101" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700"
        fill="#546e7a">vod 2 (morska)</text>
  <text x="562" y="160" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-style="italic"
        font-weight="700" fill="#c0392b">p&#x2082;</text>
  <!-- Etikete fluida (mali tekst unutar cijevi) -->
  <text x="212" y="165" font-family="'Segoe UI',Arial,sans-serif" font-size="10"
        fill="#1e5a7a" text-anchor="middle">sl. voda</text>
  <text x="546" y="150" font-family="'Segoe UI',Arial,sans-serif" font-size="10"
        fill="#0d3557" text-anchor="middle">mor. voda</text>
  <text x="212" y="300" font-family="'Segoe UI',Arial,sans-serif" font-size="10"
        fill="#4a5560" text-anchor="middle">ziva</text>
  <text x="546" y="296" font-family="'Segoe UI',Arial,sans-serif" font-size="10"
        fill="#4a5560" text-anchor="middle">ziva</text>
  <text x="358" y="194" font-family="'Segoe UI',Arial,sans-serif" font-size="10"
        fill="#7a6a20" text-anchor="middle">zrak</text>
  <text x="478" y="177" font-family="'Segoe UI',Arial,sans-serif" font-size="10"
        fill="#7a6a20" text-anchor="middle">zrak</text>
  <text x="400" y="158" font-family="'Segoe UI',Arial,sans-serif" font-size="10"
        fill="#7a6a20" text-anchor="middle">zrak</text>
  <!-- ── KUTIJA FORMULE (desna strana) ── -->
  <rect x="612" y="32" width="294" height="356" rx="10"
        fill="#fffef6" stroke="#c49a0a" stroke-width="1.5"/>
  <text x="759" y="56" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700"
        fill="#1a2530" text-anchor="middle">Putanja tlaka p&#x2081; &#x2192; p&#x2082;</text>
  <line x1="622" y1="63" x2="896" y2="63" stroke="#ddd090" stroke-width="1"/>
  <text x="626" y="82" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#546e7a">Jednadžba (bez zraka):</text>
  <text x="626" y="99" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#1a2530">p&#x2081; + &#x03C1;&#x1D65;&#xB7;g&#xB7;h&#x2081; &#x2212; &#x03C1;Hg&#xB7;g&#xB7;h&#x2082; + &#x03C1;mv&#xB7;g&#xB7;h&#x2084; = p&#x2082;</text>
  <text x="626" y="118" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#546e7a">Sa stupcem zraka (h&#x2083;):</text>
  <text x="626" y="135" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" fill="#1a2530">p&#x2081; + &#x03C1;&#x1D65;&#xB7;g&#xB7;h&#x2081; &#x2212; &#x03C1;Hg&#xB7;g&#xB7;h&#x2082; &#x2212; &#x03C1;zr&#xB7;g&#xB7;h&#x2083; + &#x03C1;mv&#xB7;g&#xB7;h&#x2084; = p&#x2082;</text>
  <line x1="622" y1="145" x2="896" y2="145" stroke="#ddd090" stroke-width="0.8"/>
  <text x="626" y="163" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#546e7a">Gustoce fluida:</text>
  <text x="626" y="180" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#2c3e50">&#x03C1;&#x1D65; = 1 000 kg/m&#xB3;  (slatka voda)</text>
  <text x="626" y="196" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#2c3e50">&#x03C1;mv = 1 035 kg/m&#xB3;  (morska voda)</text>
  <text x="626" y="212" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#2c3e50">&#x03C1;Hg = 13 600 kg/m&#xB3;  (ziva)</text>
  <text x="626" y="228" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#2c3e50">&#x03C1;zr = 1,2 kg/m&#xB3;  (zrak)</text>
  <line x1="622" y1="238" x2="896" y2="238" stroke="#ddd090" stroke-width="0.8"/>
  <text x="626" y="255" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#546e7a">Visine:</text>
  <text x="626" y="271" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#2c3e50">h&#x2081; = 0,6 m    h&#x2082; = 0,1 m</text>
  <text x="626" y="287" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#2c3e50">h&#x2083; = 0,7 m    h&#x2084; = 0,4 m</text>
  <line x1="622" y1="296" x2="896" y2="296" stroke="#ddd090" stroke-width="0.8"/>
  <text x="626" y="313" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#546e7a">Numericko (bez zraka):</text>
  <text x="626" y="329" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#2c3e50">p&#x2081;&#x2212;p&#x2082; = 9,81&#xB7;(13600&#xB7;0,1&#x2212;1035&#xB7;0,4&#x2212;1000&#xB7;0,6)</text>
  <text x="626" y="345" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#2c3e50">= 9,81 &#xB7; 346 = 3 394 Pa</text>
  <rect x="622" y="355" width="274" height="26" rx="6"
        fill="#fde8e8" stroke="#c0392b" stroke-width="1.2"/>
  <text x="759" y="373" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700"
        fill="#c0392b" text-anchor="middle">p&#x2081; &#x2212; p&#x2082; &#x2248; 3,39 kPa</text>
</svg>