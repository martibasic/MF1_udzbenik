<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="u03v1dm_title u03v1dm_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:900px;height:auto;">
  <title id="u03v1dm_title">Diferencijalni manometar izmedu vodova sa slatkom i morskom vodom</title>
  <desc id="u03v1dm_desc">W-manometar s zivom u dvije U-cijevi i zracnim mostom izmedu unutarnjih krakova. Slatka voda u lijevom vodu silazi h1=0,60 m do zive; uspon kroz zivu izmedu unutarnjeg i vanjskog kraka h2=0,10 m; stupac zraka h3=0,70 m izmedu dviju razina zive u unutarnjim krakovima; morska voda u desnom vodu silazi h4=0,40 m. Rezultat: p1 - p2 priblizno 3,39 kPa.</desc>

  <defs>
    <linearGradient id="u03v1dm_voda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aed6f1" />
      <stop offset="1" stop-color="#5b9ec9" />
    </linearGradient>
    <linearGradient id="u03v1dm_mor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb8d6" />
      <stop offset="1" stop-color="#2f6f95" />
    </linearGradient>
    <linearGradient id="u03v1dm_hg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b0b8c0" />
      <stop offset="1" stop-color="#808890" />
    </linearGradient>
    <linearGradient id="u03v1dm_wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#909fa8" />
      <stop offset="1" stop-color="#5d6d7e" />
    </linearGradient>
    <pattern id="u03v1dm_zrak" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#fbf7ec" />
      <circle cx="5" cy="5" r="0.8" fill="#d8c98a" />
    </pattern>

    <marker id="u03v1dm_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u03v1dm_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u03v1dm_pr" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#1565c0" />
    </marker>
    <marker id="u03v1dm_grayarrow" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#5d6d7e" />
    </marker>
    <marker id="u03v1dm_airarrow" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#a08540" />
    </marker>
  </defs>

  <!-- okvirni paneli -->
  <rect x="14" y="18" width="556" height="468" rx="14" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.4" />
  <rect x="582" y="18" width="364" height="468" rx="14" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.4" />

  <!-- =================================================== -->
  <!-- ============ LIJEVI PANEL: GEOMETRIJA ============= -->
  <!-- =================================================== -->

  <!-- ===== ZIDOVI / STIJENKE (PRVI SLOJ) ===== -->

  <!-- Vod 1 (horizontalna cijev, slatka voda) -->
  <rect x="40" y="227" width="130" height="34" fill="url(#u03v1dm_wall)" stroke="#3a4a56" stroke-width="1.2" />
  <!-- Vod 2 (horizontalna cijev, morska voda) -->
  <rect x="440" y="185" width="130" height="34" fill="url(#u03v1dm_wall)" stroke="#3a4a56" stroke-width="1.2" />

  <!-- Vertikalni krakovi (outer-L, inner-L, inner-R, outer-R) -->
  <rect x="130" y="227" width="40" height="195" fill="url(#u03v1dm_wall)" stroke="#3a4a56" stroke-width="1.2" />
  <rect x="240" y="85" width="40" height="337" fill="url(#u03v1dm_wall)" stroke="#3a4a56" stroke-width="1.2" />
  <rect x="330" y="85" width="40" height="337" fill="url(#u03v1dm_wall)" stroke="#3a4a56" stroke-width="1.2" />
  <rect x="440" y="185" width="40" height="237" fill="url(#u03v1dm_wall)" stroke="#3a4a56" stroke-width="1.2" />

  <!-- Bridge (gornji povezni dio izmedu unutarnjih krakova) -->
  <rect x="280" y="85" width="50" height="34" fill="url(#u03v1dm_wall)" stroke="#3a4a56" stroke-width="1.2" />

  <!-- Donji dijelovi U-cijevi -->
  <rect x="130" y="395" width="150" height="34" fill="url(#u03v1dm_wall)" stroke="#3a4a56" stroke-width="1.2" />
  <rect x="330" y="395" width="150" height="34" fill="url(#u03v1dm_wall)" stroke="#3a4a56" stroke-width="1.2" />

  <!-- ===== UNUTRASNJI ZRAK U BRIDGE-U (vidi se kao open shape) ===== -->
  <!-- Zrak ispunjava bridge interior + gornje dijelove unutarnjih krakova iznad zive -->

  <!-- Mercury - left U (kontinuirana ziva: outer-L stupac, U-bottom, inner-L stupac) -->
  <rect x="136" y="297" width="28" height="123" fill="url(#u03v1dm_hg)" />
  <rect x="136" y="395" width="138" height="25" fill="url(#u03v1dm_hg)" />
  <rect x="246" y="290" width="28" height="130" fill="url(#u03v1dm_hg)" />

  <!-- Mercury - right U (kontinuirana ziva u desnoj U-cijevi) -->
  <rect x="336" y="241" width="28" height="179" fill="url(#u03v1dm_hg)" />
  <rect x="336" y="395" width="138" height="25" fill="url(#u03v1dm_hg)" />
  <rect x="446" y="241" width="28" height="179" fill="url(#u03v1dm_hg)" />

  <!-- Zrak (kontinuiran kroz bridge i gornje dijelove unutarnjih krakova; konekcijski overlay preko zidova) -->
  <rect x="246" y="91" width="28" height="199" fill="url(#u03v1dm_zrak)" />
  <rect x="274" y="91" width="62" height="28" fill="url(#u03v1dm_zrak)" />
  <rect x="336" y="91" width="28" height="150" fill="url(#u03v1dm_zrak)" />

  <!-- Slatka voda u outer-L i vod 1 (L-oblik) -->
  <rect x="46" y="233" width="118" height="22" fill="url(#u03v1dm_voda)" />
  <rect x="136" y="233" width="28" height="64" fill="url(#u03v1dm_voda)" />

  <!-- Morska voda u outer-R i vod 2 -->
  <rect x="446" y="191" width="118" height="22" fill="url(#u03v1dm_mor)" />
  <rect x="446" y="213" width="28" height="28" fill="url(#u03v1dm_mor)" />

  <!-- Kape (zatvaranja) na slobodnim krajevima vodova (lijevi kraj vod 1, desni kraj vod 2) -->
  <rect x="40" y="227" width="6" height="34" fill="#3a4a56" />
  <rect x="564" y="185" width="6" height="34" fill="#3a4a56" />

  <!-- ====== GRANICNE LINIJE (mercury surfaces) ====== -->
  <!-- outer-L Hg surface y=297, inner-L Hg surface y=290 -->
  <line x1="136" y1="297" x2="164" y2="297" stroke="#3a4a56" stroke-width="1.4" />
  <line x1="246" y1="290" x2="274" y2="290" stroke="#3a4a56" stroke-width="1.4" />
  <!-- inner-R i outer-R Hg surfaces y=241 -->
  <line x1="336" y1="241" x2="364" y2="241" stroke="#3a4a56" stroke-width="1.4" />
  <line x1="446" y1="241" x2="474" y2="241" stroke="#3a4a56" stroke-width="1.4" />
  <!-- slatka voda - ziva interface (na y=297 outer-L) je vec gornja linija; granica vod1 / arm interior unutar slatke vode -->
  <!-- morska voda - ziva interface (na y=241 outer-R) je vec gornja linija -->

  <!-- ====== REFERENTNE ISPREKINUTE LINIJE ZA KOTE ====== -->
  <!-- isprekinuta linija inner-L Hg surface produzena lijevo i desno -->
  <line x1="220" y1="290" x2="246" y2="290" stroke="#909fa8" stroke-width="0.9" stroke-dasharray="4,3" />
  <line x1="274" y1="290" x2="395" y2="290" stroke="#909fa8" stroke-width="0.9" stroke-dasharray="4,3" />
  <!-- inner-R Hg surface produzena -->
  <line x1="305" y1="241" x2="336" y2="241" stroke="#909fa8" stroke-width="0.9" stroke-dasharray="4,3" />
  <line x1="364" y1="241" x2="395" y2="241" stroke="#909fa8" stroke-width="0.9" stroke-dasharray="4,3" />
  <!-- outer-L Hg surface produzena lijevo -->
  <line x1="86" y1="297" x2="136" y2="297" stroke="#909fa8" stroke-width="0.9" stroke-dasharray="4,3" />
  <!-- outer-R Hg surface produzena desno -->
  <line x1="474" y1="241" x2="524" y2="241" stroke="#909fa8" stroke-width="0.9" stroke-dasharray="4,3" />

  <!-- ====== KOTE ====== -->

  <!-- h1: od osi vod 1 (y=244 sredina) do outer-L Hg surface (y=297). Lijevo od arm-a (x=110). -->
  <!-- h2: razlika razina zive izmedu outer-L (y=297) i inner-L (y=290). Kota desno od outer-L, s detail-callout-om. -->
  <line x1="200" y1="290" x2="246" y2="290" stroke="#909fa8" stroke-width="0.7" stroke-dasharray="3,2" />
  <!-- Leader linija do labele iznad -->
  <!-- h3: stupac zraka - od inner-L Hg surface (y=290) do inner-R Hg surface (y=241). Smjesteno izmedu inner krakova (x=305). -->
  <!-- h4: od osi vod 2 (y=202) do outer-R Hg surface (y=241). Desno od outer-R (x=524). -->
  <!-- ====== OZNAKE TLAKOVA p1, p2 ====== -->
  <!-- p1: lijevi kraj vod 1 -->
  <circle cx="50" cy="244" r="3.6" fill="#c0392b" />
  <!-- p2: desni kraj vod 2 -->
  <circle cx="560" cy="202" r="3.6" fill="#c0392b" />
  <!-- ====== OZNAKE FLUIDA (UNUTAR KRAKOVA) ====== -->
  <!-- ====== KOMPAKTNE STRELICE PUTANJE (smjer prolaza kroz svaki fluid) ====== -->
  <!-- 1) dolje kroz slatku vodu (unutar outer-L) -->
  <line x1="150" y1="263" x2="150" y2="290" stroke="#1565c0" stroke-width="1.8" marker-end="url(#u03v1dm_pr)" opacity="0.85" />
  <!-- 2) gore u inner-L (zrak smjer prema bridge-u) -->
  <line x1="260" y1="285" x2="260" y2="125" stroke="#a08540" stroke-width="1.6" marker-end="url(#u03v1dm_airarrow)" opacity="0.75" />
  <!-- 3) dolje u inner-R (zrak nastavlja prema desnoj zivinoj povrsini) -->
  <line x1="350" y1="125" x2="350" y2="236" stroke="#a08540" stroke-width="1.6" marker-end="url(#u03v1dm_airarrow)" opacity="0.75" />
  <!-- 4) dolje kroz morsku vodu (unutar outer-R) -->
  <line x1="460" y1="217" x2="460" y2="236" stroke="#2f6f95" stroke-width="1.8" marker-end="url(#u03v1dm_pr)" opacity="0.85" />

  <!-- caption ispod -->
  <!-- =================================================== -->
  <!-- ============ DESNI PANEL: FORMULE ================= -->
  <!-- =================================================== -->

  <!-- Header bar -->
  <rect x="582" y="18" width="364" height="38" rx="14" fill="#1565c0" />
  <rect x="582" y="40" width="364" height="16" fill="#1565c0" />
  <!-- Blok 1: Gustoce -->
  <line x1="600" y1="128" x2="928" y2="128" stroke="#c8d6e4" stroke-width="1" />

  <!-- Blok 2: Visine -->
  <line x1="600" y1="194" x2="928" y2="194" stroke="#c8d6e4" stroke-width="1" />

  <!-- Blok 3: Jednadzba (bez zraka) -->
  <line x1="600" y1="300" x2="928" y2="300" stroke="#c8d6e4" stroke-width="1" />

  <!-- Blok 4: Sa zrakom -->
  <line x1="600" y1="388" x2="928" y2="388" stroke="#c8d6e4" stroke-width="1" />

  <!-- Blok 5: Pogreska -->
  <!-- Result badge -->
  <rect x="600" y="438" width="328" height="38" rx="8" fill="#fde8e8" stroke="#c0392b" stroke-width="1.4" />
  <line x1="170" y1="244" x2="110" y2="244" stroke="#b7600c" stroke-width="0.7" />
  <line x1="170" y1="297" x2="110" y2="297" stroke="#b7600c" stroke-width="0.7" />
  <line x1="110" y1="244" x2="110" y2="297" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u03v1dm_dimL)" marker-end="url(#u03v1dm_dim)" />
  <line x1="164" y1="297" x2="205" y2="297" stroke="#b7600c" stroke-width="0.7" />
  <line x1="205" y1="297" x2="205" y2="290" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u03v1dm_dimL)" marker-end="url(#u03v1dm_dim)" />
  <line x1="205" y1="293" x2="225" y2="335" stroke="#b7600c" stroke-width="0.7" />
  <line x1="280" y1="290" x2="305" y2="290" stroke="#b7600c" stroke-width="0.7" />
  <line x1="305" y1="290" x2="305" y2="241" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u03v1dm_dimL)" marker-end="url(#u03v1dm_dim)" />
  <line x1="480" y1="202" x2="524" y2="202" stroke="#b7600c" stroke-width="0.7" />
  <line x1="480" y1="241" x2="524" y2="241" stroke="#b7600c" stroke-width="0.7" />
  <line x1="524" y1="202" x2="524" y2="241" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u03v1dm_dimL)" marker-end="url(#u03v1dm_dim)" />
  <text x="42" y="46" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Diferencijalni (W) manometar sa zivom i zracnim mostom</text>

  <text x="58" y="222" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" font-style="italic" fill="#c0392b">p<tspan baseline-shift="sub" font-size="0.7em">1</tspan></text>
  <text x="78" y="222" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#1a2530">vod 1 — slatka voda</text>

  <text x="554" y="180" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" font-style="italic" fill="#c0392b" text-anchor="end">p<tspan baseline-shift="sub" font-size="0.7em">2</tspan></text>
  <text x="538" y="180" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#1a2530" text-anchor="end">vod 2 — morska voda</text>

  <text x="150" y="365" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-style="italic" fill="#3a4a56" text-anchor="middle">ziva</text>
  <text x="150" y="377" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5a6a78" text-anchor="middle">(Hg)</text>

  <text x="460" y="365" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-style="italic" fill="#3a4a56" text-anchor="middle">ziva</text>

  <text x="305" y="178" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#7a6620" text-anchor="middle">zrak</text>
  <text x="305" y="192" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#7a6620" text-anchor="middle">(stupac)</text>

  <text x="290" y="465" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" fill="#5a6a78" text-anchor="middle">Putanja p₁ → p₂: dolje kroz slatku vodu, gore kroz živu, gore kroz zrak, dolje kroz morsku vodu.</text>

  <text x="764" y="44" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">Putanja tlaka p₁ → p₂</text>

  <text x="764" y="80" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">GUSTOČE FLUIDA</text>
  <text x="604" y="100" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1a2530">ρ<tspan baseline-shift="sub" font-size="0.7em">v</tspan> = 1000 kg/m³</text>
  <text x="780" y="100" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1a2530">ρ<tspan baseline-shift="sub" font-size="0.7em">mv</tspan> = 1035 kg/m³</text>
  <text x="604" y="116" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1a2530">ρ<tspan baseline-shift="sub" font-size="0.7em">Hg</tspan> = 13 600 kg/m³</text>
  <text x="780" y="116" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1a2530">ρ<tspan baseline-shift="sub" font-size="0.7em">zr</tspan> = 1,2 kg/m³</text>
  <text x="764" y="146" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">VISINE STUPACA</text>
  <text x="604" y="166" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1a2530">h<tspan baseline-shift="sub" font-size="0.7em">1</tspan> = 0,60 m  (slatka voda ↓)</text>
  <text x="604" y="182" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1a2530">h<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 0,10 m  (živa ↑)</text>
  <text x="780" y="166" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1a2530">h<tspan baseline-shift="sub" font-size="0.7em">3</tspan> = 0,70 m  (zrak ↑)</text>
  <text x="780" y="182" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1a2530">h<tspan baseline-shift="sub" font-size="0.7em">4</tspan> = 0,40 m  (morska ↓)</text>
  <text x="764" y="214" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">1) BEZ STUPCA ZRAKA</text>
  <text x="764" y="234" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-style="italic" text-anchor="middle" fill="#1a2530">p₁ + ρ<tspan baseline-shift="sub" font-size="0.7em">v</tspan>gh₁ − ρ<tspan baseline-shift="sub" font-size="0.7em">Hg</tspan>gh₂ + ρ<tspan baseline-shift="sub" font-size="0.7em">mv</tspan>gh₄ = p₂</text>
  <text x="764" y="252" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#1a2530">p₁ − p₂ = g (ρ<tspan baseline-shift="sub" font-size="0.7em">Hg</tspan>h₂ − ρ<tspan baseline-shift="sub" font-size="0.7em">mv</tspan>h₄ − ρ<tspan baseline-shift="sub" font-size="0.7em">v</tspan>h₁)</text>
  <text x="764" y="270" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#1a2530">= 9,81 · (13 600 · 0,10 − 1035 · 0,40 − 1000 · 0,60)</text>
  <text x="764" y="288" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">p₁ − p₂ = 3394 Pa ≈ 3,39 kPa</text>
  <text x="764" y="320" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">2) SA STUPCEM ZRAKA</text>
  <text x="764" y="340" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#1a2530">p₁ − p₂ = g (ρ<tspan baseline-shift="sub" font-size="0.7em">Hg</tspan>h₂ + ρ<tspan baseline-shift="sub" font-size="0.7em">zr</tspan>h₃ − ρ<tspan baseline-shift="sub" font-size="0.7em">mv</tspan>h₄ − ρ<tspan baseline-shift="sub" font-size="0.7em">v</tspan>h₁)</text>
  <text x="764" y="358" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#1a2530">= 9,81 · (1360 + 1,2·0,70 − 414 − 600)</text>
  <text x="764" y="376" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">p₁ − p₂ = 3402 Pa ≈ 3,40 kPa</text>
  <text x="764" y="406" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">POGREŠKA ZBOG ZANEMARENJA ZRAKA</text>
  <text x="764" y="424" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#1a2530">Δp = 3402 − 3394 = 8 Pa  →  δ = 8 / 3402 ≈ 0,24 %</text>

  <text x="638" y="455" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#5a6a78">REZULTAT</text>
  <text x="638" y="469" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#5a6a78">(bez zraka)</text>
  <text x="764" y="465" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#c0392b">p₁ − p₂ ≈ 3,39 kPa</text>
  <text x="890" y="455" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#5a6a78">POGREŠKA</text>
