    <line x1="460" y1="180" x2="510" y2="180" stroke="#909fa8" stroke-width="0.8" stroke-dasharray="4,3" />
    <line x1="520" y1="260" x2="502" y2="260" stroke="#909fa8" stroke-width="0.8" stroke-dasharray="4,3" />
    <line x1="100" y1="220" x2="110" y2="220" stroke="#b7600c" stroke-width="0.8" />
    <line x1="100" y1="340" x2="110" y2="340" stroke="#b7600c" stroke-width="0.8" />
    <line x1="105" y1="220" x2="105" y2="340" stroke="#b7600c" stroke-width="1.2" marker-start="url(#u03p2_dimL)" marker-end="url(#u03p2_dim)" />
    <text x="25" y="285" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b7600c" text-anchor="start">h<tspan baseline-shift="sub" font-size="0.7em">1</tspan> = 0,60 m</text>
    <line x1="210" y1="320" x2="220" y2="320" stroke="#b7600c" stroke-width="0.8" />
    <line x1="210" y1="340" x2="220" y2="340" stroke="#b7600c" stroke-width="0.8" />
    <line x1="215" y1="320" x2="215" y2="340" stroke="#b7600c" stroke-width="1.2" marker-start="url(#u03p2_dimL)" marker-end="url(#u03p2_dim)" />
    <text x="182" y="365" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b7600c" text-anchor="start">h<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 0,10 m</text>
    <line x1="331" y1="180" x2="341" y2="180" stroke="#b7600c" stroke-width="0.8" />
    <line x1="331" y1="320" x2="341" y2="320" stroke="#b7600c" stroke-width="0.8" />
    <line x1="336" y1="180" x2="336" y2="320" stroke="#b7600c" stroke-width="1.2" marker-start="url(#u03p2_dimL)" marker-end="url(#u03p2_dim)" />
    <text x="348" y="246" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b7600c" text-anchor="start">h<tspan baseline-shift="sub" font-size="0.7em">3</tspan> = 0,70 m</text>
    <line x1="497" y1="180" x2="507" y2="180" stroke="#b7600c" stroke-width="0.8" />
    <line x1="497" y1="260" x2="507" y2="260" stroke="#b7600c" stroke-width="0.8" />
    <line x1="502" y1="180" x2="502" y2="260" stroke="#b7600c" stroke-width="1.2" marker-start="url(#u03p2_dimL)" marker-end="url(#u03p2_dim)" />
    <text x="517" y="211" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#b7600c" text-anchor="start">h<tspan baseline-shift="sub" font-size="0.7em">4</tspan>
    </text>
    <text x="521" y="228" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#b7600c" text-anchor="middle">0,40 m</text>
    <text x="290" y="450" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#3a4a56" text-anchor="middle">Hod tlaka p₁ → p₂: voda dolje, živa gore, zrak neto gore,</text>
    <text x="290" y="468" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#3a4a56" text-anchor="middle">morska voda dolje. Fluidi miruju; vertikalne kote imaju zajedničko mjerilo.</text>
  </g>
</svg>
