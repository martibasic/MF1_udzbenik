    <path d="M450 180 V260 H530" fill="none" stroke="url(#u03v1dm_mor)" stroke-width="20" stroke-linejoin="round" />
    <line x1="140" y1="340" x2="160" y2="340" stroke="#3a4a56" stroke-width="1.2" />
    <line x1="265" y1="320" x2="285" y2="320" stroke="#3a4a56" stroke-width="1.2" />
    <line x1="440" y1="180" x2="460" y2="180" stroke="#3a4a56" stroke-width="1.2" />
    <circle cx="70" cy="220" r="3.5" fill="#c0392b" />
    <text x="67" y="200" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">p<tspan baseline-shift="sub" font-size="0.7em">1</tspan>
    </text>
    <circle cx="520" cy="260" r="3.5" fill="#c0392b" />
    <text x="515" y="240" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700" transform="translate(25 26)">p<tspan baseline-shift="sub" font-size="0.7em">2</tspan>
    </text>
    <text x="95" y="192" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1565c0" text-anchor="middle" transform="translate(0 -12)">slatka voda</text>
    <text x="487" y="294" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#2f6f95" text-anchor="middle">morska voda</text>
    <text x="361" y="150" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#8b6914" text-anchor="middle">zrak</text>
    <text x="212" y="419" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#3a4a56" text-anchor="middle">živa, ρ<tspan baseline-shift="sub" font-size="0.7em">Hg</tspan>
    </text>
