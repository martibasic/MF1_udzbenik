    <line x1="160" y1="340" x2="224" y2="340" stroke="#909fa8" stroke-width="0.8" stroke-dasharray="4,3" />
    <line x1="265" y1="320" x2="215" y2="320" stroke="#909fa8" stroke-width="0.8" stroke-dasharray="4,3" />
    <line x1="285" y1="320" x2="346" y2="320" stroke="#909fa8" stroke-width="0.8" stroke-dasharray="4,3" />
