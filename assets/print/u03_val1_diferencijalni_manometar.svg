<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="u03v1dm_title u03v1dm_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:900px;height:auto;">
  <title id="u03v1dm_title">Diferencijalni manometar između vodova sa slatkom i morskom vodom</title>
  <desc id="u03v1dm_desc">Jedan živin U-manometar, zračni most i silazni krak morske vode. Hod p1 prema p2 silazi 0,60 m kroz vodu, penje se 0,10 m kroz živu i neto 0,70 m kroz zrak, pa silazi 0,40 m kroz morsku vodu. Presjek cijevi je ujednačen; nema pregrada na spojevima.</desc>
  <defs>
    <linearGradient id="u03v1dm_voda" x1="0" y1="220" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#aed6f1" />
      <stop offset="1" stop-color="#5b9ec9" />
    </linearGradient>
    <linearGradient id="u03v1dm_mor" x1="0" y1="180" x2="0" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7fb8d6" />
      <stop offset="1" stop-color="#2f6f95" />
    </linearGradient>
    <linearGradient id="u03v1dm_hg" x1="0" y1="320" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b0b8c0" />
      <stop offset="1" stop-color="#808890" />
    </linearGradient>
    <linearGradient id="u03v1dm_wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#909fa8" />
      <stop offset="1" stop-color="#5d6d7e" />
    </linearGradient>
    <pattern id="u03v1dm_zrak" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#fbf7ec" />
      <circle cx="5" cy="5" r="0.8" fill="#d8c98a" />
    </pattern>
    <marker id="u03v1dm_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u03v1dm_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u03v1dm_pr" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#1565c0" />
    </marker>
    <marker id="u03v1dm_grayarrow" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#5d6d7e" />
    </marker>
    <marker id="u03v1dm_airarrow" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#a08540" />
    </marker>
    <marker id="u03p2_dim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0 0 L0 5 L6 2.5 Z" fill="#b7600c" stroke="none" stroke-width="1.2" />
    </marker>
    <marker id="u03p2_dimL" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse">
      <path d="M0 0 L0 5 L6 2.5 Z" fill="#b7600c" stroke="none" stroke-width="1.2" />
    </marker>
    <pattern id="u03p2_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.1" />
    </pattern>
  </defs>
  <rect x="582" y="18" width="364" height="468" rx="14" fill="white" stroke="#d4e3f0" stroke-width="1" stroke-opacity="0.65" />
  <rect x="582" y="18" width="364" height="38" rx="14" fill="white" stroke="none" />
  <rect x="582" y="40" width="364" height="16" fill="white" stroke="none" />
  <line x1="600" y1="128" x2="928" y2="128" stroke="#c8d6e4" stroke-width="1" />
  <line x1="600" y1="194" x2="928" y2="194" stroke="#c8d6e4" stroke-width="1" />
  <line x1="600" y1="300" x2="928" y2="300" stroke="#c8d6e4" stroke-width="1" />
  <line x1="600" y1="388" x2="928" y2="388" stroke="#c8d6e4" stroke-width="1" />
  <rect x="600" y="438" width="328" height="38" rx="8" fill="white" stroke="#c0392b" stroke-width="1" stroke-opacity="0.55" />
  <text x="764" y="44" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1565c0">Putanja tlaka p₁ → p₂</text>
  <text x="764" y="80" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">GUSTOĆE FLUIDA</text>
  <text x="604" y="100" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1a2530">ρ<tspan baseline-shift="sub" font-size="0.7em">v</tspan> = 1000 kg/m³</text>
  <text x="780" y="100" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1a2530">ρ<tspan baseline-shift="sub" font-size="0.7em">mv</tspan> = 1035 kg/m³</text>
  <text x="604" y="116" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1a2530" transform="translate(0 8)">ρ<tspan baseline-shift="sub" font-size="0.7em">Hg</tspan> = 13 600 kg/m³</text>
  <text x="780" y="116" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1a2530" transform="translate(0 8)">ρ<tspan baseline-shift="sub" font-size="0.7em">zr</tspan> = 1,2 kg/m³</text>
  <text x="764" y="146" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">VISINE STUPACA</text>
  <text x="604" y="166" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1a2530">h<tspan baseline-shift="sub" font-size="0.7em">1</tspan> = 0,60 m  (slatka voda ↓)</text>
  <text x="604" y="182" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1a2530" transform="translate(0 8)">h<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 0,10 m  (živa ↑)</text>
  <text x="780" y="166" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1a2530">h<tspan baseline-shift="sub" font-size="0.7em">3</tspan> = 0,70 m  (zrak ↑)</text>
  <text x="780" y="182" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#1a2530" transform="translate(0 8)">h<tspan baseline-shift="sub" font-size="0.7em">4</tspan> = 0,40 m  (morska ↓)</text>
  <text x="764" y="214" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">1) BEZ STUPCA ZRAKA</text>
  <text x="764" y="234" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-style="italic" text-anchor="middle" fill="#1a2530">p₁ + ρ<tspan baseline-shift="sub" font-size="0.7em">v</tspan>gh₁ − ρ<tspan baseline-shift="sub" font-size="0.7em">Hg</tspan>gh₂ + ρ<tspan baseline-shift="sub" font-size="0.7em">mv</tspan>gh₄ = p₂</text>
  <text x="764" y="252" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#1a2530">p₁ − p₂ = g (ρ<tspan baseline-shift="sub" font-size="0.7em">Hg</tspan>h₂ − ρ<tspan baseline-shift="sub" font-size="0.7em">mv</tspan>h₄ − ρ<tspan baseline-shift="sub" font-size="0.7em">v</tspan>h₁)</text>
  <text x="764" y="270" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#1a2530">= 9,81 · (13 600 · 0,10 − 1035 · 0,40 − 1000 · 0,60)</text>
  <text x="764" y="288" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">p₁ − p₂ = 3394,26 Pa ≈ 3,39 kPa</text>
  <text x="764" y="320" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">2) SA STUPCEM ZRAKA</text>
  <text x="764" y="340" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#1a2530">p₁ − p₂ = g (ρ<tspan baseline-shift="sub" font-size="0.7em">Hg</tspan>h₂ + ρ<tspan baseline-shift="sub" font-size="0.7em">zr</tspan>h₃ − ρ<tspan baseline-shift="sub" font-size="0.7em">mv</tspan>h₄ − ρ<tspan baseline-shift="sub" font-size="0.7em">v</tspan>h₁)</text>
  <text x="764" y="358" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#1a2530">= 9,81 · (1360 + 1,2·0,70 − 414 − 600)</text>
  <text x="764" y="376" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">p₁ − p₂ = 3402,50 Pa ≈ 3,40 kPa</text>
  <text x="764" y="406" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">POGREŠKA ZBOG ZANEMARENJA ZRAKA</text>
  <text x="764" y="424" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#1a2530">Δp = 3402,50 − 3394,26 = 8,24 Pa  →  δ = 8,24 / 3402,50 ≈ 0,24 %</text>
  <text x="638" y="455" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#5a6a78">REZULTAT</text>
  <text x="638" y="469" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#5a6a78">(bez zraka)</text>
  <text x="764" y="465" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#c0392b">p₁ − p₂ ≈ 3,39 kPa</text>
  <text x="890" y="455" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#5a6a78">POGREŠKA</text>
  <text x="890" y="469" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1e8449">≈ 0,24 %</text>
  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="14" y="18" width="556" height="468" fill="white" stroke="#d4e3f0" stroke-width="1" rx="14" stroke-opacity="0.65" />
    <text x="290" y="46" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#3a4a56" text-anchor="middle" font-weight="700">Diferencijalni manometar sa živom i zračnim mostom</text>
