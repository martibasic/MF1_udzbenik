<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="u03v1dm_title u03v1dm_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:900px;height:auto;">
  <title id="u03v1dm_title">Diferencijalni manometar između vodova sa slatkom i morskom vodom</title>
  <desc id="u03v1dm_desc">Jedan živin U-manometar, zračni most i silazni krak morske vode. Hod p1 prema p2 silazi 0,60 m kroz vodu, penje se 0,10 m kroz živu i neto 0,70 m kroz zrak, pa silazi 0,40 m kroz morsku vodu. Presjek cijevi je ujednačen; nema pregrada na spojevima.</desc>
  <defs>
    <pattern id="u03v1dm_zrak" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#eadfc5" />
      <circle cx="5" cy="5" r="0.8" fill="#eadfc5" />
    </pattern>
    <marker id="u03v1dm_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#356b83" />
    </marker>
    <marker id="u03v1dm_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#356b83" />
    </marker>
    <marker id="u03v1dm_pr" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#356b83" />
    </marker>
    <marker id="u03v1dm_grayarrow" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#3a4a56" />
    </marker>
    <marker id="u03v1dm_airarrow" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#356b83" />
    </marker>
    <marker id="u03p2_dim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0 0 L0 5 L6 2.5 Z" fill="#657781" stroke="none" stroke-width="1.2" />
    </marker>
    <marker id="u03p2_dimL" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse">
      <path d="M0 0 L0 5 L6 2.5 Z" fill="#657781" stroke="none" stroke-width="1.2" />
    </marker>
    <pattern id="u03p2_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#657781" stroke-width="1.1" />
    </pattern>
  </defs>
  <text x="764" y="44" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#263746">Putanja tlaka p₁ → p₂</text>
  <text x="764" y="80" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">GUSTOĆE FLUIDA</text>
  <text x="604" y="100" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" fill="#263746">ρ<tspan baseline-shift="sub" font-size="0.7em">v</tspan> = 1000 kg/m³</text>
  <text x="780" y="100" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" fill="#263746">ρ<tspan baseline-shift="sub" font-size="0.7em">mv</tspan> = 1035 kg/m³</text>
  <text x="604" y="116" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" fill="#263746" transform="translate(0 8)">ρ<tspan baseline-shift="sub" font-size="0.7em">Hg</tspan> = 13 600 kg/m³</text>
  <text x="780" y="116" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" fill="#263746" transform="translate(0 8)">ρ<tspan baseline-shift="sub" font-size="0.7em">zr</tspan> = 1,2 kg/m³</text>
  <text x="764" y="146" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">VISINE STUPACA</text>
  <text x="604" y="166" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" fill="#263746">h<tspan baseline-shift="sub" font-size="0.7em">1</tspan> = 0,60 m  (slatka voda ↓)</text>
  <text x="604" y="182" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" fill="#263746" transform="translate(0 8)">h<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 0,10 m  (živa ↑)</text>
  <text x="780" y="166" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" fill="#263746">h<tspan baseline-shift="sub" font-size="0.7em">3</tspan> = 0,70 m  (zrak ↑)</text>
  <text x="780" y="182" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" fill="#263746" transform="translate(0 8)">h<tspan baseline-shift="sub" font-size="0.7em">4</tspan> = 0,40 m  (morska ↓)</text>
  <text x="764" y="214" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">1) BEZ STUPCA ZRAKA</text>
  <text x="764" y="234" font-family="Arial, Liberation Sans, sans-serif" font-size="12.5" font-style="italic" text-anchor="middle" fill="#263746">p₁ + ρ<tspan baseline-shift="sub" font-size="0.7em">v</tspan>gh₁ − ρ<tspan baseline-shift="sub" font-size="0.7em">Hg</tspan>gh₂ + ρ<tspan baseline-shift="sub" font-size="0.7em">mv</tspan>gh₄ = p₂</text>
  <text x="764" y="252" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#263746">p₁ − p₂ = g (ρ<tspan baseline-shift="sub" font-size="0.7em">Hg</tspan>h₂ − ρ<tspan baseline-shift="sub" font-size="0.7em">mv</tspan>h₄ − ρ<tspan baseline-shift="sub" font-size="0.7em">v</tspan>h₁)</text>
  <text x="764" y="270" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">= 9,81 · (13 600 · 0,10 − 1035 · 0,40 − 1000 · 0,60)</text>
  <text x="764" y="288" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">p₁ − p₂ = 3394,26 Pa ≈ 3,39 kPa</text>
  <text x="764" y="320" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">2) SA STUPCEM ZRAKA</text>
  <text x="764" y="340" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#263746">p₁ − p₂ = g (ρ<tspan baseline-shift="sub" font-size="0.7em">Hg</tspan>h₂ + ρ<tspan baseline-shift="sub" font-size="0.7em">zr</tspan>h₃ − ρ<tspan baseline-shift="sub" font-size="0.7em">mv</tspan>h₄ − ρ<tspan baseline-shift="sub" font-size="0.7em">v</tspan>h₁)</text>
  <text x="764" y="358" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">= 9,81 · (1360 + 1,2·0,70 − 414 − 600)</text>
  <text x="764" y="376" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">p₁ − p₂ = 3402,50 Pa ≈ 3,40 kPa</text>
  <text x="764" y="406" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">POGREŠKA ZBOG ZANEMARENJA ZRAKA</text>
  <text x="764" y="424" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" text-anchor="middle" fill="#263746">Δp = 3402,50 − 3394,26 = 8,24 Pa  →  δ = 8,24 / 3402,50 ≈ 0,24 %</text>
  <text x="638" y="455" font-family="Arial, Liberation Sans, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#263746">REZULTAT</text>
  <text x="638" y="469" font-family="Arial, Liberation Sans, sans-serif" font-size="10" text-anchor="middle" fill="#263746">(bez zraka)</text>
  <text x="764" y="465" font-family="Arial, Liberation Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#263746">p₁ − p₂ ≈ 3,39 kPa</text>
  <text x="890" y="455" font-family="Arial, Liberation Sans, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#263746">POGREŠKA</text>
  <text x="890" y="469" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#263746">≈ 0,24 %</text>
  <g font-family="Arial, Liberation Sans, sans-serif">
    <text x="290" y="46" font-family="Arial, Liberation Sans, sans-serif" font-size="14" fill="#263746" text-anchor="middle" font-weight="700">Diferencijalni manometar sa živom i zračnim mostom</text>
    <path d="M60 220 H150 V390 H275 V120 H450 V260 H530" fill="none" stroke="#3a4a56" stroke-width="29" stroke-linejoin="round" />
    <path d="M60 220 H150 V390 H275 V120 H450 V260 H530" fill="none" stroke="#c5cdd3" stroke-width="28" stroke-linejoin="round" />
    <path d="M60 220 H150 V390 H275 V120 H450 V260 H530" fill="none" stroke="url(#u03p2_hatch)" stroke-width="28" stroke-linejoin="round" />
    <path d="M60 220 H150 V340" fill="none" stroke="#dcebf1" stroke-width="20" stroke-linejoin="round" />
    <path d="M150 340 V390 H275 V320" fill="none" stroke="#a9b2b9" stroke-width="20" stroke-linejoin="round" />
    <path d="M275 320 V120 H450 V180" fill="none" stroke="url(#u03v1dm_zrak)" stroke-width="20" stroke-linejoin="round" />
    <path d="M450 180 V260 H530" fill="none" stroke="#dcebf1" stroke-width="20" stroke-linejoin="round" />
    <line x1="140" y1="340" x2="160" y2="340" stroke="#3a4a56" stroke-width="1.2" />
    <line x1="265" y1="320" x2="285" y2="320" stroke="#3a4a56" stroke-width="1.2" />
    <line x1="440" y1="180" x2="460" y2="180" stroke="#3a4a56" stroke-width="1.2" />
    <circle cx="70" cy="220" r="3.5" fill="#356b83" />
    <text x="67" y="200" font-family="Arial, Liberation Sans, sans-serif" font-size="12" fill="#263746" text-anchor="start" font-weight="700">p<tspan baseline-shift="sub" font-size="0.7em">1</tspan>
    </text>
    <circle cx="520" cy="260" r="3.5" fill="#356b83" />
    <text x="515" y="240" font-family="Arial, Liberation Sans, sans-serif" font-size="12" fill="#263746" text-anchor="start" font-weight="700" transform="translate(25 26)">p<tspan baseline-shift="sub" font-size="0.7em">2</tspan>
    </text>
    <text x="95" y="192" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="middle" transform="translate(0 -12)">slatka voda</text>
    <text x="487" y="294" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="middle">morska voda</text>
    <text x="361" y="150" font-family="Arial, Liberation Sans, sans-serif" font-size="12" fill="#263746" text-anchor="middle">zrak</text>
    <text x="212" y="419" font-family="Arial, Liberation Sans, sans-serif" font-size="12" fill="#263746" text-anchor="middle">živa, ρ<tspan baseline-shift="sub" font-size="0.7em">Hg</tspan>
    </text>
    <line x1="70" y1="220" x2="115" y2="220" stroke="#3a4a56" stroke-width="0.8" stroke-dasharray="4,3" />
    <line x1="140" y1="340" x2="105" y2="340" stroke="#3a4a56" stroke-width="0.8" stroke-dasharray="4,3" />
    <line x1="160" y1="340" x2="224" y2="340" stroke="#3a4a56" stroke-width="0.8" stroke-dasharray="4,3" />
    <line x1="265" y1="320" x2="215" y2="320" stroke="#3a4a56" stroke-width="0.8" stroke-dasharray="4,3" />
    <line x1="285" y1="320" x2="346" y2="320" stroke="#3a4a56" stroke-width="0.8" stroke-dasharray="4,3" />
    <line x1="440" y1="180" x2="336" y2="180" stroke="#3a4a56" stroke-width="0.8" stroke-dasharray="4,3" />
    <line x1="460" y1="180" x2="510" y2="180" stroke="#3a4a56" stroke-width="0.8" stroke-dasharray="4,3" />
    <line x1="520" y1="260" x2="502" y2="260" stroke="#3a4a56" stroke-width="0.8" stroke-dasharray="4,3" />
    <line x1="100" y1="220" x2="110" y2="220" stroke="#657781" stroke-width="0.8" />
    <line x1="100" y1="340" x2="110" y2="340" stroke="#657781" stroke-width="0.8" />
    <line x1="105" y1="220" x2="105" y2="340" stroke="#657781" stroke-width="1.2" marker-start="url(#u03p2_dimL)" marker-end="url(#u03p2_dim)" />
    <text x="25" y="285" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="start">h<tspan baseline-shift="sub" font-size="0.7em">1</tspan> = 0,60 m</text>
    <line x1="210" y1="320" x2="220" y2="320" stroke="#657781" stroke-width="0.8" />
    <line x1="210" y1="340" x2="220" y2="340" stroke="#657781" stroke-width="0.8" />
    <line x1="215" y1="320" x2="215" y2="340" stroke="#657781" stroke-width="1.2" marker-start="url(#u03p2_dimL)" marker-end="url(#u03p2_dim)" />
    <text x="182" y="365" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="start">h<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 0,10 m</text>
    <line x1="331" y1="180" x2="341" y2="180" stroke="#657781" stroke-width="0.8" />
    <line x1="331" y1="320" x2="341" y2="320" stroke="#657781" stroke-width="0.8" />
    <line x1="336" y1="180" x2="336" y2="320" stroke="#657781" stroke-width="1.2" marker-start="url(#u03p2_dimL)" marker-end="url(#u03p2_dim)" />
    <text x="348" y="246" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="start">h<tspan baseline-shift="sub" font-size="0.7em">3</tspan> = 0,70 m</text>
    <line x1="497" y1="180" x2="507" y2="180" stroke="#657781" stroke-width="0.8" />
    <line x1="497" y1="260" x2="507" y2="260" stroke="#657781" stroke-width="0.8" />
    <line x1="502" y1="180" x2="502" y2="260" stroke="#657781" stroke-width="1.2" marker-start="url(#u03p2_dimL)" marker-end="url(#u03p2_dim)" />
    <text x="517" y="211" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="start">h<tspan baseline-shift="sub" font-size="0.7em">4</tspan>
    </text>
    <text x="521" y="228" font-family="Arial, Liberation Sans, sans-serif" font-size="10" fill="#263746" text-anchor="middle">0,40 m</text>
    <text x="290" y="450" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" fill="#263746" text-anchor="middle">Hod tlaka p₁ → p₂: voda dolje, živa gore, zrak neto gore,</text>
    <text x="290" y="468" font-family="Arial, Liberation Sans, sans-serif" font-size="10.5" fill="#263746" text-anchor="middle">morska voda dolje. Fluidi miruju; vertikalne kote imaju zajedničko mjerilo.</text>
  </g>
</svg>
