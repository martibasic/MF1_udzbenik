  <line x1="520" y1="112" x2="580" y2="112" stroke="#0f766e" stroke-width="4" marker-end="url(#u13v3si_arrowGreen)"/>
  <text x="586" y="116" font-family="'Segoe UI',Arial,sans-serif" font-size="16" fill="#173043">Qp</text>

  <line x1="202" y1="170" x2="278" y2="170" stroke="#0f766e" stroke-width="4" marker-end="url(#u13v3si_arrowGreen)"/>
  <text x="286" y="174" font-family="'Segoe UI',Arial,sans-serif" font-size="16" fill="#173043">Q_C</text>

