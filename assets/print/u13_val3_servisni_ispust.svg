<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
<defs>
  <marker id="u13v3si_u13v3-ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0f766e"/></marker>
  <marker id="u13v3si_u13v3-ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#b42318"/></marker>
  <marker id="u13v3si_u13v3-ao" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#b45309"/></marker>
  <marker id="u13v3si_u13v3-ao2" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0,0 3,8 6" fill="#b45309"/></marker>
  <marker id="u13v3si_u13v3-ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#1d4ed8"/></marker>
  <linearGradient id="u13v3si_u13v3-water" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d4eef8"/><stop offset="100%" stop-color="#7ec8e8"/></linearGradient>
  <linearGradient id="u13v3si_u13v3-water2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c5e8f5"/><stop offset="100%" stop-color="#6ab8d6"/></linearGradient>
</defs>
<rect width="940" height="400" fill="#ffffff"/>
<rect x="24" y="24" width="892" height="352" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>
<text x="54" y="55" font-family="'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#173043">Nezatvoreni servisni ispust na razvodu</text>
<text x="54" y="76" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#516677">Čvor C dijeli protok: Q_{1} (ulaz) = Q_{2} (prema spremniku 2) + Q_p (ispust)</text>

<!-- Tank 1 (left, high level): x=44..116, y=100..300 -->
<rect x="44" y="100" width="72" height="214" rx="6" fill="none" stroke="#2d3a40" stroke-width="2.5"/>
<rect x="46" y="118" width="68" height="194" fill="url(#u13v3si_u13v3-water)"/>
<line x1="44" y1="118" x2="116" y2="118" stroke="#1565c0" stroke-width="2"/>
<text x="80" y="110" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043" text-anchor="middle">1</text>

<!-- Tank 2 (right, lower level): x=824..896, y=165..300 -->
<rect x="824" y="165" width="72" height="149" rx="6" fill="none" stroke="#2d3a40" stroke-width="2.5"/>
<rect x="826" y="198" width="68" height="114" fill="url(#u13v3si_u13v3-water2)"/>
<line x1="824" y1="198" x2="896" y2="198" stroke="#1565c0" stroke-width="2"/>
<text x="860" y="185" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043" text-anchor="middle">2</text>

<!-- Main horizontal pipe: y=216..242, connecting tank1 to tank2 -->
<rect x="116" y="218" width="708" height="24" fill="url(#u13v3si_u13v3-water)" stroke="#2d3a40" stroke-width="2.5"/>

<!-- Node C (center, x=470) -->
<circle cx="470" cy="230" r="8" fill="#f59e0b" stroke="#92400e" stroke-width="2"/>
<text x="455" y="214" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">C</text>

<!-- Q1 flow arrow (left of C) -->
<line x1="180" y1="230" x2="250" y2="230" stroke="#0f766e" stroke-width="3" marker-end="url(#u13v3si_u13v3-ag)"/>
<text x="212" y="216" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">Q₁</text>

<!-- Q2 flow arrow (right of C) -->
<line x1="620" y1="230" x2="700" y2="230" stroke="#0f766e" stroke-width="3" marker-end="url(#u13v3si_u13v3-ag)"/>
<text x="660" y="216" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">Q₂</text>

<!-- Qp branch (upward from C) -->
<rect x="462" y="118" width="16" height="112" fill="url(#u13v3si_u13v3-water)" stroke="#2d3a40" stroke-width="2"/>
<!-- Qp arrow upward -->
<line x1="470" y1="210" x2="470" y2="138" stroke="#b42318" stroke-width="3" marker-end="url(#u13v3si_u13v3-ar)"/>
<text x="488" y="175" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#b42318">Q_p</text>
<text x="488" y="192" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677">(ispust)</text>
<!-- Service outlet end (top of branch) -->
<line x1="453" y1="118" x2="487" y2="118" stroke="#2d3a40" stroke-width="3"/>

<!-- H level difference: tank1 level (y=118) to pipe centerline (y=230) -->
<line x1="130" y1="118" x2="130" y2="230" stroke="#b45309" stroke-width="2.5" marker-start="url(#u13v3si_u13v3-ao2)" marker-end="url(#u13v3si_u13v3-ao)"/>
<text x="142" y="178" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#b45309">H</text>

<!-- p_C/γ annotation: piezometric height at C (from pipe to pressure level in C) -->
<!-- piezometric height = H - losses from 1 to C -->
<!-- Show as small blue bracket from pipe top (y=218) up by some amount (~40px) -->
<line x1="496" y1="218" x2="496" y2="178" stroke="#1d4ed8" stroke-width="2" marker-start="url(#u13v3si_u13v3-ab)" marker-end="url(#u13v3si_u13v3-ab)"/>
<text x="508" y="200" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1d4ed8">p_C/γ</text>

<!-- L1C dimension (left section) -->
<line x1="136" y1="262" x2="460" y2="262" stroke="#546e7a" stroke-width="1.5"/>
<line x1="136" y1="256" x2="136" y2="268" stroke="#546e7a" stroke-width="1.5"/>
<line x1="460" y1="256" x2="460" y2="268" stroke="#546e7a" stroke-width="1.5"/>
<text x="298" y="278" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677" text-anchor="middle">L₁C</text>

<!-- LC2 dimension (right section) -->
<line x1="480" y1="262" x2="812" y2="262" stroke="#546e7a" stroke-width="1.5"/>
<line x1="480" y1="256" x2="480" y2="268" stroke="#546e7a" stroke-width="1.5"/>
<line x1="812" y1="256" x2="812" y2="268" stroke="#546e7a" stroke-width="1.5"/>
<text x="646" y="278" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677" text-anchor="middle">L_C2</text>

<!-- Info panel bottom -->
<rect x="44" y="292" width="860" height="72" rx="8" fill="#fffef6" stroke="#c49a0a" stroke-width="1.5"/>
<text x="60" y="312" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#173043">Jednadžbe čvora C:</text>
<text x="60" y="330" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1e293b">Kontinuitet: Q₁ = Q₂ + Q_p    ·    Energija 1→C: H = h_{w,1C} + p_C/γ    ·    Energija C→2: p_C/γ = h_{w,C2} + Δz</text>
<text x="60" y="354" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#516677" font-style="italic">Uredni režim: Q₁ prolazi do 2. Oštećeni režim: Q_p uzrokuje piezometarski pad u C → procjena otvora A_p iz Q_p = C_d A_p √(2g p_C/γ)</text>
</svg>