  <text x="356" y="226" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#516677">L_1C</text>
  <text x="610" y="226" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#516677">L_C2</text>

  <text x="468" y="288" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#516677">Uredni rezim daje lambda, osteceni rezim daje Q_C, Q_p i otvor Ap.</text>

