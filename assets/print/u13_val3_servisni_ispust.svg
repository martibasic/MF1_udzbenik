<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" role="img" aria-labelledby="u13v3si_title u13v3si_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u13v3si_title">U13 Val 3 - nezatvoreni servisni ispust na rashladnom cjevovodu</title>
  <desc id="u13v3si_desc">Shema dvaju spremnika povezanih cjevovodom s nezeljenim servisnim ispustom u točki C, s označenim protocima, razinom H i piezometarskom visinom tlaka u točki C.</desc>
