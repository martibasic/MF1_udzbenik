<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 570" role="img" aria-labelledby="u07c1puvo_u07c1pluvo_title u07c1puvo_u07c1pluvo_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u07c1puvo_u07c1pluvo_title">Platforma na granici ulja i vode</title>
  <desc id="u07c1puvo_u07c1pluvo_desc">Nepropusna platforma presijeca vodoravnu slobodnu površinu ulja i vodoravnu granicu ulja i vode. Dublji je lijevi rub pod ormarom. Nijedan fluid ne ispunjava unutrašnjost trupa. B je uzgonski težinjen centroid dviju istisnina; ukupna težina i uzgon djeluju vertikalno na cijeli sklop. Skica prati početni model za male kutove.</desc>
  <defs>
    <marker id="u07c1puvo_u07c1pluvo_aR" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#356b83" />
    </marker>
    <marker id="u07c1puvo_u07c1pluvo_aG" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#356b83" />
    </marker>
