<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" role="img" aria-labelledby="u07c1puvo_u7c1T" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u07c1puvo_u7c1T">U07 CH 1 – Plutajuća platforma na granici ulja i vode s ormarom</title>
  <defs>
    <linearGradient id="u07c1puvo_u7c1Wg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4eef8"/>
      <stop offset="100%" stop-color="#7ec8e8"/>
    </linearGradient>
    <linearGradient id="u07c1puvo_u7c1Og" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <marker id="u07c1puvo_u7c1AG" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
    </marker>
    <marker id="u07c1puvo_u7c1AR" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#b42318"/>
    </marker>
    <marker id="u07c1puvo_u7c1AD" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#546e7a"/>
    </marker>
    <marker id="u07c1puvo_u7c1ADR" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L8,3 z" fill="#546e7a"/>
    </marker>
    <marker id="u07c1puvo_u7c1AB" markerWidth="9" markerHeight="9" refX="4" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1565c0"/>
    </marker>
    <marker id="u07c1puvo_u7c1ABR" markerWidth="9" markerHeight="9" refX="4" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L8,3 z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="940" height="430" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="382" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>

  <!-- ── FLUID LAYERS (left panel) ── -->
  <!-- Oil layer: surface y=185 to boundary y=202 (17px = 0.10m×167px/m) -->
  <rect x="40" y="185" width="490" height="17" fill="url(#u07c1puvo_u7c1Og)" opacity="0.85"/>
  <!-- Oil surface line -->
  <line x1="40" y1="185" x2="530" y2="185" stroke="#1565c0" stroke-width="2"/>
  <text x="44" y="180" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1565c0">p.p.</text>
  <!-- Oil/water boundary -->
  <line x1="40" y1="202" x2="530" y2="202" stroke="#92400e" stroke-width="1.8" stroke-dasharray="8 5"/>
  <text x="44" y="215" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#92400e">ulje/voda granica</text>
  <!-- Water layer: y=202 to y=400 -->
  <rect x="40" y="202" width="490" height="195" fill="url(#u07c1puvo_u7c1Wg)" opacity="0.55"/>

  <!-- Platform (tilted): B=200px (1.20m×167px/m), centered at x=270
       h_L=50px (0.30m), h_D=33px (0.20m), thickness=18px
       Waterline at y=185 (oil surface)
       Left bottom:  x=170, y=185+50=235
       Right bottom: x=370, y=185+33=218
       Left top:     x=170, y=217
       Right top:    x=370, y=200 -->
  <polygon points="170,217 370,200 370,218 170,235" fill="#b0bec5" stroke="#37474f" stroke-width="2.5"/>

  <!-- Ormar (cabinet) on top of platform, at e=33px LEFT of axis (x=270 → x=237)
       Platform top at x=237: approx y=217-(237-170)*(217-200)/200 = 217-67*17/200 ≈ 217-6 = 211
       Ormar box: x=214..260, y=185..211 (26px tall) -->
  <rect x="212" y="183" width="50" height="28" rx="3" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <text x="222" y="200" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#173043">ormar</text>

  <!-- Axis of symmetry (dashed) at x=270 -->
  <line x1="270" y1="120" x2="270" y2="310" stroke="#8090a0" stroke-width="1.5" stroke-dasharray="8 5"/>

  <!-- G_platforma arrow (red, down) at x=270 -->
  <line x1="270" y1="145" x2="270" y2="188" stroke="#b42318" stroke-width="3" marker-end="url(#u07c1puvo_u7c1AR)"/>
  <text x="276" y="160" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#b42318">G_p</text>

  <!-- G_ormar arrow (red, smaller) at x=237 -->
  <line x1="237" y1="148" x2="237" y2="183" stroke="#b42318" stroke-width="2.5" marker-end="url(#u07c1puvo_u7c1AR)"/>
  <text x="200" y="148" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#b42318">G_o</text>

  <!-- F_U arrow (green, up) at center of buoyancy x=263 (7px left of axis) -->
  <line x1="263" y1="248" x2="263" y2="179" stroke="#0f766e" stroke-width="3.5" marker-end="url(#u07c1puvo_u7c1AG)"/>
  <text x="268" y="256" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#0f766e">F_U</text>

  <!-- ── DIMENSION LINES ── -->
  <!-- h_L (left side) -->
  <line x1="155" y1="185" x2="155" y2="235" stroke="#546e7a" stroke-width="1.5" marker-start="url(#u07c1puvo_u7c1ADR)" marker-end="url(#u07c1puvo_u7c1AD)"/>
  <text x="74" y="216" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#546e7a">h_L=0,30m</text>
  <!-- h_D (right side) -->
  <line x1="386" y1="185" x2="386" y2="218" stroke="#546e7a" stroke-width="1.5" marker-start="url(#u07c1puvo_u7c1ADR)" marker-end="url(#u07c1puvo_u7c1AD)"/>
  <text x="392" y="207" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#546e7a">h_D=0,20m</text>
  <!-- δ (oil thickness, left outer) -->
  <line x1="132" y1="185" x2="132" y2="202" stroke="#92400e" stroke-width="1.5" marker-start="url(#u07c1puvo_u7c1ADR)" marker-end="url(#u07c1puvo_u7c1AD)"/>
  <text x="56" y="197" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#92400e">δ=0,10m</text>
  <!-- B width -->
  <line x1="170" y1="255" x2="370" y2="255" stroke="#546e7a" stroke-width="1.5" marker-start="url(#u07c1puvo_u7c1ADR)" marker-end="url(#u07c1puvo_u7c1AD)"/>
  <text x="244" y="270" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#546e7a">B = 1,20 m</text>
  <!-- e: horizontal arrow from axis (270) to ormar center (237) at y=290 -->
  <line x1="270" y1="290" x2="237" y2="290" stroke="#1565c0" stroke-width="1.8" marker-start="url(#u07c1puvo_u7c1ABR)" marker-end="url(#u07c1puvo_u7c1AB)"/>
  <text x="228" y="305" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1565c0">e=0,20m</text>
  <line x1="270" y1="284" x2="270" y2="296" stroke="#1565c0" stroke-width="1"/>
  <line x1="237" y1="284" x2="237" y2="296" stroke="#1565c0" stroke-width="1"/>

  <!-- Fluid zone labels -->
  <text x="410" y="196" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#92400e" font-weight="700">ulje δ=0,10m</text>
  <text x="410" y="230" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1565c0">voda ρ=1000</text>

  <!-- ── FORMULA BOX ── -->
  <rect x="532" y="88" width="354" height="310" rx="10" fill="#fffef6" stroke="#c49a0a" stroke-width="1.8"/>
  <text x="554" y="113" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">Ključni rezultati</text>
  <line x1="554" y1="121" x2="878" y2="121" stroke="#e8d89a" stroke-width="1"/>
  <text x="554" y="141" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">h_m = 0,25 m</text>
  <text x="554" y="161" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">V = L·B·h_m = 0,900 m³</text>
  <line x1="554" y1="171" x2="878" y2="171" stroke="#e8d89a" stroke-width="1"/>
  <text x="554" y="191" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">V_o = 0,360 m³  (u ulju)</text>
  <text x="554" y="211" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">V_w = 0,540 m³  (u vodi)</text>
  <line x1="554" y1="221" x2="878" y2="221" stroke="#e8d89a" stroke-width="1"/>
  <text x="554" y="241" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#516677">y_B = (ρ_w·V_w·y_B_w − ρ_o·V_o·y_B_o) / (F_U/g)</text>
  <text x="554" y="261" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">y_B = 4,35 cm  (prema lijevoj strani)</text>
  <line x1="554" y1="271" x2="878" y2="271" stroke="#e8d89a" stroke-width="1"/>
  <text x="554" y="291" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#516677">Iz ravnoteže momenta (ormar):</text>
  <text x="554" y="311" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">e = 20,0 cm</text>
  <line x1="554" y1="321" x2="878" y2="321" stroke="#e8d89a" stroke-width="1"/>
  <text x="554" y="341" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">Δh_m = m_o / (ρ_ef · L · B)</text>
  <text x="554" y="361" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#173043">Δh_m = 5,0 cm</text>
  <text x="554" y="380" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#8090a0">L = 3,00 m (⊥ na skicu)</text>
</svg>