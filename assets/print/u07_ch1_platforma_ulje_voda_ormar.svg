  <title id="u07c1puvo_title">U07 CH 1 - plutajuća platforma na granici ulja i vode</title>
  <desc id="u07c1puvo_desc">Plutajuća pravokutna platforma naginje se zbog bocno pomaknutog ormara, dok istodobno pluta na granici ulja i vode. Skica razdvaja urone, debljinu uljnog sloja, pomak tezista tereta i pomak centra uzgona.</desc>
