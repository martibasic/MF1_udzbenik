  <text x="780" y="82" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746">Ključne jednadžbe i rezultati</text>
  <text x="780" y="112" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">1. Srednji uron i istisnina</text>
  <text x="780" y="132" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#263746">h<tspan baseline-shift="sub" font-size="0.7em">m</tspan> = (h<tspan baseline-shift="sub" font-size="0.7em">L</tspan> + h<tspan baseline-shift="sub" font-size="0.7em">D</tspan>) / 2 = 0,25 m</text>
  <text x="780" y="150" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 8)">V = L · B · h<tspan baseline-shift="sub" font-size="0.7em">m</tspan> = 0,900 m³</text>
  <text x="780" y="184" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">2. Podjela istisnine po fluidima</text>
  <text x="780" y="204" font-family="Arial, Liberation Sans, sans-serif" font-size="13" text-anchor="middle" fill="#263746">V<tspan baseline-shift="sub" font-size="0.7em">o</tspan> = L B δ = 0,360 m³    V<tspan baseline-shift="sub" font-size="0.7em">w</tspan> = L B(h<tspan baseline-shift="sub" font-size="0.7em">m</tspan>−δ) = 0,540 m³</text>
  <text x="780" y="220" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#263746" transform="translate(0 8)">ρₒV<tspan baseline-shift="sub" font-size="0.7em">o</tspan> + ρₙV<tspan baseline-shift="sub" font-size="0.7em">w</tspan> = 828 kg = m<tspan baseline-shift="sub" font-size="0.7em">p</tspan> + m<tspan baseline-shift="sub" font-size="0.7em">k</tspan>  ✓</text>
  <text x="780" y="250" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">3. Bočni pomak centra uzgona</text>
  <text x="780" y="268" font-family="Arial, Liberation Sans, sans-serif" font-size="12" text-anchor="middle" fill="#263746">y<tspan baseline-shift="sub" font-size="0.7em">B,w</tspan> = B(h<tspan baseline-shift="sub" font-size="0.7em">w,L</tspan>−h<tspan baseline-shift="sub" font-size="0.7em">w,D</tspan>) / (12 h<tspan baseline-shift="sub" font-size="0.7em">w,m</tspan>) ≈ 0,0667 m</text>
  <text x="780" y="286" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 8)">y<tspan baseline-shift="sub" font-size="0.7em">B</tspan> = (ρₙV<tspan baseline-shift="sub" font-size="0.7em">w</tspan>/ΣρV) · y<tspan baseline-shift="sub" font-size="0.7em">B,w</tspan> ≈ 4,35 cm</text>
  <text x="780" y="322" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">4. Početna stabilnost i položaj ormara</text>
  <text x="780" y="340" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" text-anchor="middle" fill="#263746">KB<tspan baseline-shift="sub" font-size="0.7em">eq</tspan> ≈ 0,118 m · BM<tspan baseline-shift="sub" font-size="0.7em">eq</tspan> ≈ 0,522 m · KG ≈ 0,211 m</text>
  <text x="780" y="358" font-family="Arial, Liberation Sans, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#263746">GM<tspan baseline-shift="sub" font-size="0.7em">eq</tspan> ≈ 0,429 m · e = (828/180) GM<tspan baseline-shift="sub" font-size="0.7em">eq</tspan> tanθ ≈ 16,4 cm</text>
  <text x="780" y="390" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746">5. Povećanje srednjeg urona (zbog ormara)</text>
  <text x="780" y="408" font-family="Arial, Liberation Sans, sans-serif" font-size="12" text-anchor="middle" fill="#263746">h₀ = 0,20 m (bez ormara)  →  Δh<tspan baseline-shift="sub" font-size="0.7em">m</tspan> = h<tspan baseline-shift="sub" font-size="0.7em">m</tspan> − h₀</text>
  <text x="780" y="426" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 8)">Δh<tspan baseline-shift="sub" font-size="0.7em">m</tspan> = 5,0 cm</text>
  <text x="780" y="448" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#263746" transform="translate(0 10)">yB = BMeq tanθ nije GZ; zaključak vrijedi samo za mali nagib.</text>
  <text x="780" y="486" font-family="Arial, Liberation Sans, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 10)">REZULTATI</text>
  <text x="668" y="506" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 10)">h<tspan baseline-shift="sub" font-size="0.7em">m</tspan> = 0,25 m</text>
  <text x="780" y="506" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 10)">e ≈ 16,4 cm</text>
  <text x="892" y="506" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#263746" transform="translate(0 10)">Δh<tspan baseline-shift="sub" font-size="0.7em">m</tspan> = 5,0 cm</text>
  <text x="780" y="520" font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#263746" transform="translate(0 10) translate(0 10)">V = 0,900 m³ (V<tspan baseline-shift="sub" font-size="0.7em">o</tspan> = 0,360  ·  V<tspan baseline-shift="sub" font-size="0.7em">w</tspan> = 0,540)</text>
  <g font-family="Arial, Liberation Sans, sans-serif" />
