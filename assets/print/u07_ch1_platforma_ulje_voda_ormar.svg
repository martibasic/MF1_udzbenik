    <text x="290" y="505" font-family="Arial, Liberation Sans, sans-serif" font-size="11" fill="#263746" text-anchor="middle">h<tspan baseline-shift="sub" font-size="0.7em">L</tspan> = 0,30 m; h<tspan baseline-shift="sub" font-size="0.7em">D</tspan> = 0,20 m; δ = 0,10 m</text>
    <text x="290" y="524" font-family="Arial, Liberation Sans, sans-serif" font-size="10" fill="#263746" text-anchor="middle">B: uzgonski težinjen centar istisnine, unutar trupa.</text>
