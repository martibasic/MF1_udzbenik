<text x="150.0" y="21" font-size="14" fill="white" text-anchor="middle" font-weight="700">2. Osnovne veličine fluida</text>
<text x="150" y="56" font-size="11" fill="#3a4a56" text-anchor="middle">Jednak volumen, različita masa i težina</text>
<defs><linearGradient id="u01fup_property0" gradientUnits="userSpaceOnUse" x1="0" y1="118" x2="0" y2="242"><stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#c8a000"/></linearGradient></defs>
<rect x="48" y="118" width="60" height="124" rx="0" fill="url(#u01fup_property0)" stroke="none" stroke-width="1.2"/>
<line x1="48" y1="118" x2="108" y2="118" stroke="#1565c0" stroke-width="2"/>
<rect x="40" y="88" width="8" height="162" rx="0" fill="url(#u01fup_hatch)" stroke="#3a4a56" stroke-width="1.2"/>
<rect x="108" y="88" width="8" height="162" rx="0" fill="url(#u01fup_hatch)" stroke="#3a4a56" stroke-width="1.2"/>
<rect x="40" y="242" width="76" height="8" rx="0" fill="url(#u01fup_hatch)" stroke="#3a4a56" stroke-width="1.2"/>
<text x="78" y="182" font-size="14" fill="#b7600c" text-anchor="middle">ulje</text>
<text x="78" y="207" font-size="11" fill="#3a4a56" text-anchor="middle">V = 1 L</text>
<text x="78" y="272" font-size="10" fill="#3a4a56" text-anchor="middle">ρ = 860 kg/m³</text>
<defs><linearGradient id="u01fup_property1" gradientUnits="userSpaceOnUse" x1="0" y1="118" x2="0" y2="242"><stop offset="0%" stop-color="#aed6f1"/><stop offset="100%" stop-color="#5b9ec9"/></linearGradient></defs>
<rect x="196" y="118" width="60" height="124" rx="0" fill="url(#u01fup_property1)" stroke="none" stroke-width="1.2"/>
<line x1="196" y1="118" x2="256" y2="118" stroke="#1565c0" stroke-width="2"/>
<rect x="188" y="88" width="8" height="162" rx="0" fill="url(#u01fup_hatch)" stroke="#3a4a56" stroke-width="1.2"/>
<rect x="256" y="88" width="8" height="162" rx="0" fill="url(#u01fup_hatch)" stroke="#3a4a56" stroke-width="1.2"/>
<rect x="188" y="242" width="76" height="8" rx="0" fill="url(#u01fup_hatch)" stroke="#3a4a56" stroke-width="1.2"/>
<text x="226" y="182" font-size="14" fill="#1565c0" text-anchor="middle">voda</text>
<text x="226" y="207" font-size="11" fill="#3a4a56" text-anchor="middle">V = 1 L</text>
<text x="226" y="272" font-size="10" fill="#3a4a56" text-anchor="middle">ρ = 1000 kg/m³</text>
<rect x="121" y="145" width="59" height="53" rx="5" fill="#fff0ed" stroke="#c0392b" stroke-width="1.2"/>
<text x="150" y="166" font-size="11" fill="#c0392b" text-anchor="middle">ΔG ≈</text>
<text x="150" y="184" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1,37 N</text>
<rect x="10" y="296" width="280" height="23" rx="4" fill="#fffdf3" stroke="#b7600c" stroke-width="1.2"/>
<text x="150" y="312" font-size="12" fill="#b7600c" text-anchor="middle" font-weight="700">ρ = m / V (gustoća)</text>
<rect x="10" y="322" width="280" height="23" rx="4" fill="#fffdf3" stroke="#1e8449" stroke-width="1.2"/>
<text x="150" y="338" font-size="12" fill="#1e8449" text-anchor="middle" font-weight="700">γ = ρg (specifična težina)</text>
<rect x="10" y="348" width="280" height="23" rx="4" fill="#fffdf3" stroke="#8e44ad" stroke-width="1.2"/>
<text x="150" y="364" font-size="12" fill="#8e44ad" text-anchor="middle" font-weight="700">sᵣ = ρ / ρᵥ (relativna gustoća)</text>
<text x="150" y="388" font-size="10" fill="#3a4a56" text-anchor="middle">sᵣ nema jedinicu; γ ima jedinicu N/m³.</text>
</g>
