<path id="u01fup_elementForce2" d="M145 153 L145 177" fill="none" stroke="#1565c0" stroke-width="2.3" marker-end="url(#u01fup_pressureMarker)"/>
<path id="u01fup_elementForce3" d="M145 239 L145 215" fill="none" stroke="#1565c0" stroke-width="2.3" marker-end="url(#u01fup_pressureMarker)"/>
<text x="145" y="200" font-size="13" fill="#1565c0" text-anchor="middle" font-weight="700">p</text>
<text x="145" y="291" font-size="10" fill="#3a4a56" text-anchor="middle">Strelice: sile okoline na mali element.</text>
<text x="18" y="313" font-size="11" fill="#3a4a56" text-anchor="start">• tlak u točki jednak je u svim smjerovima</text>
<text x="18" y="333" font-size="11" fill="#3a4a56" text-anchor="start">• p je skalarno polje p(x, y, z)</text>
<text x="18" y="353" font-size="11" fill="#3a4a56" text-anchor="start">• izotropnost ne znači jednak tlak svugdje</text>
<rect x="18" y="370" width="254" height="23" rx="4" fill="#eef6ff" stroke="#1565c0" stroke-width="1.2"/>
<text x="145" y="386" font-size="12" fill="#1565c0" text-anchor="middle" font-weight="700">Jednolik tlak na plohi: p = Fₙ / A</text>
</g>
<g id="u01fup_properties" transform="translate(340 30)">
<rect x="0" y="0" width="300" height="400" rx="8" fill="#fffbee" stroke="#c8d6e4" stroke-width="1.2"/>
