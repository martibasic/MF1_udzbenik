<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" role="img" aria-labelledby="u01fup_title u01fup_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="u01fup_title">U01 - Pregled poglavlja: Osnove fluida i Pascalov zakon</title>
  <desc id="u01fup_desc">Tri panela uvodnog bloka: (1) kontinuumski model fluida i tlak kao skalarno polje, (2) osnovne velicine - gustoca ρ, specificna tezina γ, relativna gustoca s_r za ulje i vodu, (3) Pascalov zakon i prijenos tlaka u zatvorenom fluidu kroz hidraulicku presu.</desc>
  <defs>
    <marker id="u01fup_aR" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#c0392b" />
    </marker>
    <marker id="u01fup_aG" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1e8449" />
    </marker>
    <marker id="u01fup_aB" markerWidth="6" markerHeight="4" refX="5.5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#1565c0" />
    </marker>
    <linearGradient id="u01fup_water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aed6f1" />
      <stop offset="100%" stop-color="#5b9ec9" />
    </linearGradient>
    <linearGradient id="u01fup_oil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#c8a000" />
    </linearGradient>
    <linearGradient id="u01fup_piston" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#909fa8" />
      <stop offset="100%" stop-color="#5d6d7e" />
    </linearGradient>
    <pattern id="u01fup_hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#7a8a96" stroke-width="1.5" />
    </pattern>
  </defs>

  <rect width="980" height="460" fill="#ffffff" />
  <rect x="14" y="14" width="952" height="432" rx="12" fill="#ffffff" stroke="#dde3ea" stroke-width="1.5" />

  <!-- ============================================================
       PANEL 1: KONTINUUMSKI MODEL — TLAK KAO POLJE
  ============================================================ -->
  <rect x="30" y="30" width="290" height="400" rx="8" fill="#fafcff" stroke="#c8d6e4" stroke-width="1.4" />
  <rect x="30" y="30" width="290" height="30" rx="8" fill="#1565c0" />
  <rect x="30" y="52" width="290" height="8" fill="#1565c0" />
  <!-- Posuda s fluidom -->
  <rect x="60" y="100" width="14" height="200" fill="url(#u01fup_hatch)" stroke="#4a6070" stroke-width="1.3" />
  <rect x="276" y="100" width="14" height="200" fill="url(#u01fup_hatch)" stroke="#4a6070" stroke-width="1.3" />
  <rect x="60" y="300" width="230" height="14" fill="url(#u01fup_hatch)" stroke="#4a6070" stroke-width="1.3" />
  <rect x="74" y="140" width="202" height="160" fill="url(#u01fup_water)" />
  <line x1="74" y1="140" x2="276" y2="140" stroke="#1565c0" stroke-width="2" />

  <!-- Tocka P u fluidu s istog tlaka u svim smjerovima -->
  <circle cx="175" cy="220" r="4" fill="#173043" stroke="#1565c0" stroke-width="1.5" />
  <!-- 8 strelica iz tocke P (isotropan tlak) -->
  <line x1="175" y1="220" x2="175" y2="195" stroke="#1565c0" stroke-width="1.4" marker-end="url(#u01fup_aB)" />
  <line x1="175" y1="220" x2="200" y2="220" stroke="#1565c0" stroke-width="1.4" marker-end="url(#u01fup_aB)" />
  <line x1="175" y1="220" x2="175" y2="245" stroke="#1565c0" stroke-width="1.4" marker-end="url(#u01fup_aB)" />
  <line x1="175" y1="220" x2="150" y2="220" stroke="#1565c0" stroke-width="1.4" marker-end="url(#u01fup_aB)" />
  <line x1="175" y1="220" x2="193" y2="202" stroke="#1565c0" stroke-width="1.4" marker-end="url(#u01fup_aB)" />
  <line x1="175" y1="220" x2="193" y2="238" stroke="#1565c0" stroke-width="1.4" marker-end="url(#u01fup_aB)" />
  <line x1="175" y1="220" x2="157" y2="238" stroke="#1565c0" stroke-width="1.4" marker-end="url(#u01fup_aB)" />
  <line x1="175" y1="220" x2="157" y2="202" stroke="#1565c0" stroke-width="1.4" marker-end="url(#u01fup_aB)" />

  <!-- Manje strelice tlaka na stijenkama (svuda iste duljine na istoj dubini) -->
  <line x1="74" y1="180" x2="86" y2="180" stroke="#1565c0" stroke-width="1.2" marker-end="url(#u01fup_aB)" />
  <line x1="276" y1="180" x2="264" y2="180" stroke="#1565c0" stroke-width="1.2" marker-end="url(#u01fup_aB)" />
  <line x1="74" y1="270" x2="92" y2="270" stroke="#1565c0" stroke-width="1.4" marker-end="url(#u01fup_aB)" />
  <line x1="276" y1="270" x2="258" y2="270" stroke="#1565c0" stroke-width="1.4" marker-end="url(#u01fup_aB)" />
  <line x1="120" y1="300" x2="120" y2="288" stroke="#1565c0" stroke-width="1.4" marker-end="url(#u01fup_aB)" />
  <line x1="175" y1="300" x2="175" y2="288" stroke="#1565c0" stroke-width="1.4" marker-end="url(#u01fup_aB)" />
  <line x1="230" y1="300" x2="230" y2="288" stroke="#1565c0" stroke-width="1.4" marker-end="url(#u01fup_aB)" />

  <!-- Sazetak ispod -->
  <rect x="50" y="402" width="250" height="20" rx="4" fill="#e6effa" stroke="#1565c0" stroke-width="1" />
  <!-- ============================================================
       PANEL 2: OSNOVNE VELIČINE — ρ, γ, s_r
  ============================================================ -->
  <rect x="340" y="30" width="300" height="400" rx="8" fill="#fffbef" stroke="#c8a000" stroke-width="1.4" />
  <rect x="340" y="30" width="300" height="30" rx="8" fill="#c8a000" />
  <rect x="340" y="52" width="300" height="8" fill="#c8a000" />
  <!-- Mali spremnik ulje + mali spremnik voda -->
  <!-- Ulje -->
  <rect x="378" y="120" width="10" height="160" fill="url(#u01fup_hatch)" stroke="#4a6070" stroke-width="1.2" />
  <rect x="448" y="120" width="10" height="160" fill="url(#u01fup_hatch)" stroke="#4a6070" stroke-width="1.2" />
  <rect x="378" y="280" width="80" height="12" fill="url(#u01fup_hatch)" stroke="#4a6070" stroke-width="1.2" />
  <rect x="388" y="148" width="60" height="132" fill="url(#u01fup_oil)" />
  <line x1="388" y1="148" x2="448" y2="148" stroke="#7a4d10" stroke-width="2" />
  <!-- Voda -->
  <rect x="522" y="120" width="10" height="160" fill="url(#u01fup_hatch)" stroke="#4a6070" stroke-width="1.2" />
  <rect x="592" y="120" width="10" height="160" fill="url(#u01fup_hatch)" stroke="#4a6070" stroke-width="1.2" />
  <rect x="522" y="280" width="80" height="12" fill="url(#u01fup_hatch)" stroke="#4a6070" stroke-width="1.2" />
  <rect x="532" y="148" width="60" height="132" fill="url(#u01fup_water)" />
  <line x1="532" y1="148" x2="592" y2="148" stroke="#1565c0" stroke-width="2" />
  <!-- ΔG indikator izmedu -->
  <rect x="468" y="170" width="44" height="42" rx="4" fill="#fdedec" stroke="#c0392b" stroke-width="1.2" />
  <!-- Jednadzbe -->
  <rect x="350" y="328" width="280" height="22" rx="4" fill="#fef7e0" stroke="#c8a000" stroke-width="1" />
  <rect x="350" y="354" width="280" height="22" rx="4" fill="#eafaf1" stroke="#1e8449" stroke-width="1" />
  <rect x="350" y="380" width="280" height="22" rx="4" fill="#f3eafa" stroke="#7d3c98" stroke-width="1" />
  <!-- ============================================================
       PANEL 3: PASCALOV ZAKON — HIDRAULIČNA PREŠA
  ============================================================ -->
  <rect x="660" y="30" width="290" height="400" rx="8" fill="#fafcff" stroke="#c8d6e4" stroke-width="1.4" />
  <rect x="660" y="30" width="290" height="30" rx="8" fill="#1565c0" />
  <rect x="660" y="52" width="290" height="8" fill="#1565c0" />
  <!-- Mini preša s dva klipa, vodom na dnu, kontinuiran fluid -->
  <!-- Fluid (kontinuiran preko mali + vod + veliki) -->
  <rect x="690" y="170" width="40" height="80" fill="url(#u01fup_water)" />
  <rect x="730" y="240" width="12" height="10" fill="url(#u01fup_water)" />
  <rect x="742" y="240" width="76" height="10" fill="url(#u01fup_water)" />
  <rect x="818" y="240" width="12" height="10" fill="url(#u01fup_water)" />
  <rect x="830" y="170" width="80" height="80" fill="url(#u01fup_water)" />
  <!-- Mali cilindar stjenke -->
  <rect x="680" y="130" width="10" height="120" fill="url(#u01fup_hatch)" stroke="#4a6070" stroke-width="1.2" />
  <rect x="730" y="130" width="12" height="110" fill="url(#u01fup_hatch)" stroke="#4a6070" stroke-width="1.2" />
  <!-- Veliki cilindar stjenke -->
  <rect x="818" y="130" width="12" height="110" fill="url(#u01fup_hatch)" stroke="#4a6070" stroke-width="1.2" />
  <rect x="910" y="130" width="10" height="120" fill="url(#u01fup_hatch)" stroke="#4a6070" stroke-width="1.2" />
  <!-- Vod stjenka gornja -->
  <rect x="742" y="232" width="76" height="8" fill="url(#u01fup_hatch)" stroke="#4a6070" stroke-width="1.2" />
  <!-- Zajednicko dno -->
  <rect x="680" y="250" width="240" height="14" fill="url(#u01fup_hatch)" stroke="#4a6070" stroke-width="1.2" />
  <!-- Brtve -->
  <rect x="700" y="130" width="20" height="10" fill="#3a4a56" stroke="#4a6070" stroke-width="1" />
  <rect x="860" y="130" width="20" height="10" fill="#3a4a56" stroke="#4a6070" stroke-width="1" />
  <!-- Klipovi -->
  <rect x="690" y="150" width="40" height="20" rx="2" fill="url(#u01fup_piston)" stroke="#3a4a56" stroke-width="1.2" />
  <rect x="830" y="150" width="80" height="20" rx="2" fill="url(#u01fup_piston)" stroke="#3a4a56" stroke-width="1.2" />
  <!-- Klipnjace -->
  <rect x="706" y="106" width="8" height="44" fill="#9aaab4" stroke="#5b6770" stroke-width="0.8" />
  <rect x="866" y="106" width="8" height="44" fill="#9aaab4" stroke="#5b6770" stroke-width="0.8" />
  <!-- F_1 dolje (kraca, ulazna sila) -->
  <line x1="710" y1="90" x2="710" y2="106" stroke="#c0392b" stroke-width="2.5" marker-end="url(#u01fup_aR)" />
  <!-- F_2 gore (dulja, izlazna sila) -->
  <line x1="870" y1="106" x2="870" y2="70" stroke="#1e8449" stroke-width="2.5" marker-end="url(#u01fup_aG)" />
  <!-- A1, A2 labele i tlak p u vodu -->
  <!-- Jednadzbe -->
  <rect x="670" y="280" width="270" height="22" rx="4" fill="#e6effa" stroke="#1565c0" stroke-width="1" />
  <rect x="670" y="308" width="270" height="22" rx="4" fill="#eafaf1" stroke="#1e8449" stroke-width="1" />
  <rect x="670" y="364" width="270" height="22" rx="4" fill="#f3eafa" stroke="#7d3c98" stroke-width="1" />
  <rect x="670" y="336" width="270" height="22" rx="4" fill="#fdf3e6" stroke="#b7600c" stroke-width="1" />
  <text x="175" y="51" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">1. Kontinuumski model</text>
  <text x="175" y="84" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#5a6a78">Fluid kao kontinuirano polje tlaka</text>

  <text x="190" y="218" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" font-weight="700" fill="#1565c0">P</text>
  <text x="175" y="338" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#3a4a56">• fluid = kontinuirani medij (ρ neprekidno)</text>
  <text x="175" y="354" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#3a4a56">• tlak p djeluje jednako u svim smjerovima</text>
  <text x="175" y="370" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#3a4a56">• p je skalarno polje p(x, y, z)</text>
  <text x="175" y="386" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#3a4a56">• raste s dubinom u gravitacijskom polju</text>
  <text x="175" y="417" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1565c0">p = F / A   (skalarno polje)</text>

  <text x="490" y="51" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">2. Osnovne veličine fluida</text>
  <text x="490" y="84" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#5a6a78">Gustoća, specifična težina i relativna gustoća</text>

  <text x="418" y="220" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" text-anchor="middle" fill="#7a4d10">ulje</text>
  <text x="418" y="244" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#7a4d10">V = 1 L</text>
  <text x="418" y="304" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#7a4d10">ρ = 860 kg/m³</text>

  <text x="562" y="220" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" text-anchor="middle" fill="#1565c0">voda</text>
  <text x="562" y="244" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#1565c0">V = 1 L</text>
  <text x="562" y="304" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#1565c0">ρ = 1000 kg/m³</text>

  <text x="490" y="186" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#c0392b">ΔG</text>
  <text x="506.4" y="186.0" font-family="'Segoe UI',Arial,sans-serif" font-size="9" text-anchor="middle" fill="#c0392b">≈ 14%</text>

  <text x="490" y="343" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#7a4d10">ρ = m / V   (gustoća)</text>

  <text x="490" y="369" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1e8449">γ = ρ · g   (specifična težina)</text>

  <text x="490" y="395" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#7d3c98">s<tspan baseline-shift="sub" font-size="0.7em">r</tspan> = ρ / ρ<tspan baseline-shift="sub" font-size="0.7em">H₂O</tspan>   (relativna gustoća)</text>

  <text x="490" y="420" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#5a6a78">s<tspan baseline-shift="sub" font-size="0.7em">r</tspan> &lt; 1 → fluid pluta na vodi (npr. ulje, s<tspan baseline-shift="sub" font-size="0.7em">r</tspan> = 0,86)</text>

  <text x="805" y="51" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">3. Pascalov zakon</text>
  <text x="805" y="84" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#5a6a78">Tlak se prenosi jednako</text>

  <text x="722" y="100" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#c0392b"><tspan font-weight="700">F<tspan baseline-shift="sub" font-size="0.7em">1</tspan></tspan></text>
  <text x="882" y="86" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#1e8449"><tspan font-weight="700">F<tspan baseline-shift="sub" font-size="0.7em">2</tspan></tspan></text>

  <text x="780" y="248" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" font-style="italic" text-anchor="middle" fill="#ffffff">p</text>

  <text x="805" y="295" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1565c0">p = F<tspan baseline-shift="sub" font-size="0.7em">1</tspan>/A<tspan baseline-shift="sub" font-size="0.7em">1</tspan> = F<tspan baseline-shift="sub" font-size="0.7em">2</tspan>/A<tspan baseline-shift="sub" font-size="0.7em">2</tspan></text>

  <text x="805" y="323" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1e8449">F<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = (A<tspan baseline-shift="sub" font-size="0.7em">2</tspan>/A<tspan baseline-shift="sub" font-size="0.7em">1</tspan>) · F<tspan baseline-shift="sub" font-size="0.7em">1</tspan>   (pojačanje)</text>

  <text x="805" y="379" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#7d3c98">F<tspan baseline-shift="sub" font-size="0.7em">1</tspan>·s<tspan baseline-shift="sub" font-size="0.7em">1</tspan> = F<tspan baseline-shift="sub" font-size="0.7em">2</tspan>·s<tspan baseline-shift="sub" font-size="0.7em">2</tspan>   (rad jednak)</text>

  <text x="805" y="404" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#5a6a78">Hidraulika: hidraulična preša, dizalica,</text>
  <text x="805" y="420" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#5a6a78">stega, kočni sustav, podizanje mostova</text>
<text x="710" y="145" font-family="'Segoe UI',Arial,sans-serif" font-size="9" text-anchor="middle" fill="#b7600c">A<tspan baseline-shift="sub" font-size="0.75em">1</tspan></text>
  <text x="870" y="145" font-family="'Segoe UI',Arial,sans-serif" font-size="9" text-anchor="middle" fill="#b7600c">A<tspan baseline-shift="sub" font-size="0.75em">2</tspan></text>
  <text x="805" y="351" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#b7600c">A<tspan baseline-shift="sub" font-size="0.7em">1</tspan>·s<tspan baseline-shift="sub" font-size="0.7em">1</tspan> = A<tspan baseline-shift="sub" font-size="0.7em">2</tspan>·s<tspan baseline-shift="sub" font-size="0.7em">2</tspan>   (volumna bilanca)</text>

  </svg>