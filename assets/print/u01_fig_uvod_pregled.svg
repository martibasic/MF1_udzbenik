<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" role="img" aria-labelledby="u01fup_title u01fup_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
<title id="u01fup_title">Osnove fluida i Pascalov zakon</title><desc id="u01fup_desc">Tri postojeća panela: kontinuum i tlačne sile na mali element, gustoća pri jednakim volumenima te povezani klipovi Pascalove preše. Tlak je skalar; strelice su sile na označeno tijelo.</desc>
<defs>
<linearGradient id="u01fup_water" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#aed6f1"/><stop offset="100%" stop-color="#5b9ec9"/></linearGradient>
<linearGradient id="u01fup_oil" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#c8a000"/></linearGradient>
<linearGradient id="u01fup_hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1a2e42"/><stop offset="100%" stop-color="#1a3a52"/></linearGradient>
<pattern id="u01fup_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.8"/></pattern>
<marker id="u01fup_v" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#1e8449"/></marker>
<marker id="u01fup_dim" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto-start-reverse"><path d="M0 0 L6 2.5 L0 5 Z" fill="#b7600c"/></marker>
<marker id="u01fup_dimSmall" markerWidth="3" markerHeight="3" refX="3" refY="1.5" orient="auto-start-reverse"><path d="M0 0 L3 1.5 L0 3 Z" fill="#b7600c"/></marker>
</defs>
<rect width="980" height="460" fill="white"/>
<g font-family="'Segoe UI',Arial,sans-serif" fill="#1a2530">
<!-- Zadržane neutralne boje i zaglavlja iz postojećih panela.
Jedna prostorna ispuna predstavlja isti fluid; nije mapa tlaka ili brzine.
Strelice imaju značenje iz oznake; izdvojeni vektori sila ne određuju hvatište. -->
<defs>
<marker id="u01fup_forceMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#c0392b"/></marker>
<marker id="u01fup_pressureMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#1565c0"/></marker>
<marker id="u01fup_reactionMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#1e8449"/></marker>
<marker id="u01fup_axisMarker" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#3a4a56"/></marker>
</defs>
<defs><linearGradient id="u01fup_metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#909fa8"/><stop offset="100%" stop-color="#5d6d7e"/></linearGradient></defs>
<g id="u01fup_continuum" transform="translate(30 30)">
<rect x="0" y="0" width="290" height="400" rx="8" fill="#fafcff" stroke="#c8d6e4" stroke-width="1.2"/>
<rect x="0" y="0" width="290" height="30" rx="8" fill="#1565c0" stroke="#1565c0" stroke-width="1.2"/>
<rect x="0" y="21" width="290" height="9" rx="0" fill="#1565c0" stroke="none" stroke-width="1.2"/>
<text x="145.0" y="21" font-size="14" fill="white" text-anchor="middle" font-weight="700">1. Kontinuumski model</text>
<text x="145" y="56" font-size="11" fill="#1565c0" text-anchor="middle">Fluid kao kontinuirano polje tlaka</text>
<defs><linearGradient id="u01fup_tankfield" gradientUnits="userSpaceOnUse" x1="0" y1="110" x2="0" y2="270"><stop offset="0%" stop-color="#aed6f1"/><stop offset="100%" stop-color="#5b9ec9"/></linearGradient></defs>
