    <text x="325" y="503" font-size="11" fill="#263746" text-anchor="middle">Isprekidano: početna tlačna ploha istoga klipa.</text>
    <g id="u01v2hd_formulas" transform="translate(700 60)">
      <text x="130.0" y="21" font-size="14" fill="#263746" text-anchor="middle" font-weight="700">Ključne jednadžbe</text>
      <text x="130.0" y="55" font-size="11" fill="#263746" text-anchor="middle">Pretlak u ulju</text>
      <text x="130.0" y="79" font-size="15" fill="#263746" text-anchor="middle" font-weight="700">p = F₁ / A₁</text>
      <text x="130.0" y="100" font-size="13" fill="#263746" text-anchor="middle" font-weight="700">= 250 kPa</text>
      <text x="130.0" y="133" font-size="11" fill="#263746" text-anchor="middle">Izlazna sila</text>
      <text x="130.0" y="157" font-size="15" fill="#263746" text-anchor="middle" font-weight="700">F₂ = 35 F₁</text>
      <text x="130.0" y="178" font-size="13" fill="#263746" text-anchor="middle" font-weight="700">= 5,25 kN</text>
      <text x="130.0" y="211" font-size="11" fill="#263746" text-anchor="middle">Volumna bilanca</text>
      <text x="130.0" y="235" font-size="15" fill="#263746" text-anchor="middle" font-weight="700">s₂ = s₁ / 35</text>
      <text x="130.0" y="256" font-size="13" fill="#263746" text-anchor="middle" font-weight="700">≈ 5,1 mm</text>
    </g>
    <text x="830" y="412" font-size="14" fill="#263746" text-anchor="middle" font-weight="700">W₁ = W₂ = 27 J</text>
    <text x="830" y="435" font-size="10" fill="#263746" text-anchor="middle">Rad izračunan bez ranog zaokruživanja.</text>
    <text x="830" y="482" font-size="10" fill="#263746" text-anchor="middle">Hodovi i promjeri imaju zasebne skale.</text>
