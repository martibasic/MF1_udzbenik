<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" role="img" aria-labelledby="u01v2hd_title u01v2hd_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="u01v2hd_title">Servisna hidraulična dizalica</title>
  <desc id="u01v2hd_desc">Točan omjer promjera odgovara omjeru površina 35. Kote hodova povezuju početnu i konačnu istu plohu; njihova skala zasebna je od promjera. Jedinstveni spoj ulja nema pregrada ni umetnutih polja boje.</desc>
