<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="u07fbp_title u07fbp_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:880px;height:auto;">
  <title id="u07fbp_title">Bocni pomak centra uzgona pravokutne plivajuce platforme</title>
  <desc id="u07fbp_desc">Lijevo: poprecni presjek pravokutne plivajuce platforme sirine B = 1,20 m s uronom lijevog ruba h_L = 0,32 m i desnog ruba h_D = 0,24 m. Srednji gaz h_m = 0,28 m. Centar uzgona pomaknut je za y_B priblizno 2,86 cm prema dublje uronjenoj lijevoj strani. Desno: izvod h_m i y_B s numerickom supstitucijom.</desc>

  <defs>
    <linearGradient id="u07fbp_voda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aed6f1" />
      <stop offset="1" stop-color="#5b9ec9" />
    </linearGradient>
    <pattern id="u07fbp_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#e5ebef" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#909fa8" stroke-width="1.0" />
    </pattern>
    <marker id="u07fbp_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u07fbp_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <!-- Hatch materijala (srafura presjeka) — 45°, tamnosiva -->
    <pattern id="u07fbp_matH" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#cdd6dc" />
      <line x1="0" y1="0" x2="0" y2="6" stroke="#7a8a96" stroke-width="1.4" />
    </pattern>
    <marker id="u07fbp_yarr" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L6,2.5 z" fill="#1e8449" />
    </marker>
    <marker id="u07fbp_yarrL" markerWidth="6" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
      <path d="M0,0 L0,5 L6,2.5 z" fill="#1e8449" />
    </marker>
  </defs>

  <!-- okvirni paneli -->
  <line x1="500" y1="34" x2="500" y2="436" stroke="#dce7f0" stroke-width="1.2" stroke-dasharray="4,5" />

  <!-- ===================== LIJEVO: POPRECNI PRESJEK ===================== -->
  <!--
       Skala: 1 m = 200 px
       B = 1,20 m -> 240 px
       h_L = 0,32 m -> 64 px (lijevo, dublji uron)
       h_D = 0,24 m -> 48 px (desno, plici uron)
       h_m = 0,28 m -> 56 px
       y_B = 0,0286 m -> ~5,7 px (vizualno pojacano radi citljivosti, vidi napomenu)

       Vodoravna geometrija:
         Os simetrije platforme: x = 240
         Lijevi rub platforme:   x = 120
         Desni rub platforme:    x = 360

       Vertikalna geometrija (waterline / mirna povrsina):
         WL_y = 200
         Donji lijevi rub:  y = 200 + 64 = 264
         Donji desni rub:   y = 200 + 48 = 248
         Debljina palube ~16 px -> gornji rubovi:
            Gornji lijevi:  y = 264 - 80 = 184  (zelimo bok H = 0,40 m -> 80 px)
            Gornji desni:   y = 248 - 80 = 168
         To je nagnuti pravokutnik (cetverokut sa cetiri vrha):
            LL (120, 264)  LR (360, 248)  TR (360, 168)  TL (120, 184)
  -->

  <!-- pozadina (zrak iznad vode) -->
  <rect x="34" y="76" width="436" height="124" fill="#f6fbfd" />

  <!-- voda ispod waterline -->
  <rect x="34" y="200" width="436" height="158" fill="url(#u07fbp_voda)" />

  <!-- waterline (mirna slobodna povrsina) -->
  <line x1="34" y1="200" x2="470" y2="200" stroke="#1565c0" stroke-width="2.0" />
  <!-- dno spremnika (hatched, dovoljno daleko da ne smeta) -->
  <rect x="34" y="358" width="436" height="14" fill="url(#u07fbp_hatch)" stroke="#3a4a56" stroke-width="1.2" />

  <!-- istisnuti volumen ispod nagnutog dna platforme: trapezno plavo deblje -->
  <!-- (vec je voda iza, ali platforma "skida" dio fluida; ostavljamo vodu netaknutu) -->

  <!-- nagnuta platforma (PRAVI rotirani pravokutnik — sve stranice okomite jedna na drugu)
       Okomiti smjer gore: n = (-16,-240)/|240,-16| = (-0.0665, -0.9978)
       TL = BL + 80*n = (120-5.3, 264-79.8) = (114.7, 184.2) ≈ (115, 184)
       TR = BR + 80*n = (360-5.3, 248-79.8) = (354.7, 168.2) ≈ (355, 168) -->
  <polygon points="120,264 360,248 355,168 115,184" fill="#cdd6dc" stroke="#3a4a56" stroke-width="1.8" stroke-linejoin="round" />
  <!-- gornja paluba (8 px dubine u smjeru normale prema unutra) -->
  <polygon points="115,184 355,168 355.5,176 115.5,192" fill="#909fa8" stroke="none" />
  <!-- srafura uronjenog dijela presjeka platforme
       WL intersects left side at (116,200), right side at (357,200) -->
  <polygon points="116,200 357,200 360,248 120,264" fill="url(#u07fbp_matH)" stroke="none" opacity="0.9" />

  <!-- mokra povrsina (donja granica platforme) izrazena malo deblje radi jasnoce -->
  <line x1="120" y1="264" x2="360" y2="248" stroke="#3a4a56" stroke-width="1.6" />

  <!-- os simetrije platforme (vertikalna isprekidana) -->
  <line x1="240" y1="92" x2="240" y2="300" stroke="#7a8a96" stroke-width="1.2" stroke-dasharray="6,4" />
  <!-- srednji gaz h_m: vodoravna pomocna linija na dubini h_m = 56 px ispod WL = y=256
       Linija prolazi tocno kroz srediste mokrog presjeka (tocku na osi simetrije
       gdje nagnuti donji rub presjeca os): donji rub spaja (120,264) i (360,248),
       parametarska na x=240: y = 264 + (248-264) * (240-120)/(360-120) = 264 - 16*0,5 = 256.
       Dakle h_m linija (y=256) prolazi upravo kroz tu tocku - ilustrira da je h_m
       srednji uron na osi simetrije. -->
  <line x1="120" y1="256" x2="360" y2="256" stroke="#1565c0" stroke-width="1.0" stroke-dasharray="3,3" opacity="0.7" />

  <!-- Centar uzgona B' (pomaknut prema dublje uronjenoj LIJEVOJ strani) -->
  <!-- Geometrijska tocka B' na pola h_m ispod waterline na osi simetrije bi bila (240, 228).
       Pomak y_B = 0,0286 m ~ 5,7 px PREMA LIJEVO (negativni x)
       -> realni piksel pomak je premalen za vizualnu citljivost; pojacavamo na ~22 px
       i to JASNO oznacavamo simbolicki u kotaci ("oznaka pojacana radi citljivosti"). -->
  <!-- Y kordinata: pola h_m ispod WL: y = 200 + 56/2 = 228 -->
  <circle cx="218" cy="228" r="5.5" fill="#1e8449" stroke="#0d4824" stroke-width="1.2" />
  <!-- Referentna tocka B_0 na osi simetrije (gdje bi centar uzgona bio kod simetricnog urona) -->
  <circle cx="240" cy="228" r="3.2" fill="none" stroke="#5a6a78" stroke-width="1.2" />

  <!-- Strelica y_B (od osi simetrije prema B'), VODORAVNA, zelena -->
  <line x1="240" y1="240" x2="218" y2="240" stroke="#1e8449" stroke-width="2.0" marker-start="url(#u07fbp_yarrL)" marker-end="url(#u07fbp_yarr)" />
  <!-- ============= KOTE ============= -->

  <!-- Kota h_L (lijevo, vertikalna): od WL do donjeg lijevog ruba -->
  <!-- Kota h_D (desno, vertikalna): od WL do donjeg desnog ruba; smjestena blize platformi -->
  <!-- Kota h_m (srednji gaz, na osi simetrije, malo desno od osi, kratka indikacija) -->
  <!-- Vrijednost h_m oznacavamo kao malu kotu uz desnu stranu izmedu h_D i osi -->
  <!-- h_m kota: kompaktna kota od WL do h_m dashed linije (y=256), smjestena uz desni rub platforme
       Pomicemo h_D kotu malo dalje desno (radi mjesta), a h_m stoji blize platformi -->
  <!-- Kota B (sirina platforme, ispod presjeka) -->
  <!-- Mali komentar ispod -->
  <!-- Oznaka L (lijevo) i D (desno) iznad platforme -->
  <!-- Oznaka 'voda' u vodenom prostoru, desno ispod platforme -->
  <!-- ===================== DESNO: IZVOD ===================== -->
  <!-- Korak 1: srednji gaz h_m -->
  <rect x="524" y="78" width="346" height="96" rx="9" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="524" y="78" width="6" height="96" rx="3" fill="#1565c0" />
  <!-- Korak 2: opca formula za y_B -->
  <rect x="524" y="184" width="346" height="96" rx="9" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="524" y="184" width="6" height="96" rx="3" fill="#1e8449" />
  <!-- Korak 3: numericka supstitucija -->
  <rect x="524" y="290" width="346" height="96" rx="9" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="524" y="290" width="6" height="96" rx="3" fill="#1e8449" />
  <!-- REZULTATI badge -->
  <rect x="524" y="398" width="346" height="44" rx="8" fill="#e8f5e9" stroke="#1e8449" stroke-width="1.4" />
  <line x1="120" y1="200" x2="78" y2="200" stroke="#b7600c" stroke-width="0.7" />
  <line x1="120" y1="264" x2="78" y2="264" stroke="#b7600c" stroke-width="0.7" />
  <line x1="86" y1="200" x2="86" y2="264" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u07fbp_dimL)" marker-end="url(#u07fbp_dim)" />
  <line x1="360" y1="200" x2="395" y2="200" stroke="#b7600c" stroke-width="0.7" />
  <line x1="360" y1="248" x2="395" y2="248" stroke="#b7600c" stroke-width="0.7" />
  <line x1="388" y1="200" x2="388" y2="248" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u07fbp_dimL)" marker-end="url(#u07fbp_dim)" />
  <line x1="240" y1="200" x2="455" y2="200" stroke="#b7600c" stroke-width="0.0" />
  <line x1="240" y1="256" x2="455" y2="256" stroke="#b7600c" stroke-width="0.0" />
  <line x1="360" y1="200" x2="464" y2="200" stroke="#b7600c" stroke-width="0.7" opacity="0" />

  <line x1="360" y1="200" x2="448" y2="200" stroke="#b7600c" stroke-width="0.7" />
  <line x1="360" y1="256" x2="448" y2="256" stroke="#b7600c" stroke-width="0.7" />
  <line x1="442" y1="200" x2="442" y2="256" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u07fbp_dimL)" marker-end="url(#u07fbp_dim)" />
  <line x1="120" y1="264" x2="120" y2="328" stroke="#b7600c" stroke-width="0.7" />
  <line x1="360" y1="248" x2="360" y2="328" stroke="#b7600c" stroke-width="0.7" />
  <line x1="120" y1="324" x2="120" y2="312" stroke="#b7600c" stroke-width="1.3" />
  <line x1="360" y1="324" x2="360" y2="312" stroke="#b7600c" stroke-width="1.3" />
  <line x1="123" y1="318" x2="357" y2="318" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u07fbp_dimL)" marker-end="url(#u07fbp_dim)" />
  <text x="40" y="56" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Poprecni presjek nagnute platforme</text>

  <text x="40" y="195" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1565c0">p.p. (mirna razina)</text>

  <text x="244" y="98" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#7a8a96">os simetrije</text>

  <text x="206" y="222" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" font-weight="700" text-anchor="end" fill="#1e8449">B′</text>

  <text x="218" y="256" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-style="italic" font-weight="700" text-anchor="middle" fill="#1e8449">y<tspan baseline-shift="sub" font-size="0.75em">B</tspan></text>
  <text x="236.3" y="256.0" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#1e8449">≈ 2,86 cm</text>

  <text x="40" y="395" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78">Linearan nagib presjeka → centar uzgona <tspan font-style="italic">B</tspan>′ pomice se prema dublje uronjenoj strani.</text>
  <text x="40" y="412" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" font-style="italic" fill="#5a6a78">(Pomak <tspan font-style="italic">y</tspan><tspan baseline-shift="sub" font-size="0.75em">B</tspan> na slici simbolicki je uvecan radi citljivosti; stvarna vrijednost je 2,86 cm.)</text>

  <text x="124" y="178" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#3a4a56">L</text>
  <text x="350" y="162" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#3a4a56">D</text>

  <text x="420" y="298" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#0d47a1">voda</text>


  <text x="524" y="56" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Izvod srednjeg gaza i bocnog pomaka</text>

  <text x="544" y="102" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1565c0">1. Srednji gaz</text>
  <text x="697" y="128" font-family="'Segoe UI',Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">m</tspan> = (<tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">L</tspan> + <tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">D</tspan>) / 2 = (0,32 + 0,24) / 2</text>
  <text x="697" y="156" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1565c0"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">m</tspan> = 0,28 m</text>

  <text x="544" y="208" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1e8449">2. Bocni pomak centra uzgona</text>
  <text x="697" y="236" font-family="'Segoe UI',Arial,sans-serif" font-size="15" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">y</tspan><tspan baseline-shift="sub" font-size="0.7em">B</tspan> = <tspan font-style="italic">B</tspan> (<tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">L</tspan> − <tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">D</tspan>) / (12 <tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">m</tspan>)</text>
  <text x="697" y="262" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-style="italic" text-anchor="middle" fill="#5a6a78">(pravokutna platforma, linearan nagib)</text>

  <text x="544" y="314" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1e8449">3. Numericka supstitucija</text>
  <text x="697" y="340" font-family="'Segoe UI',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">y</tspan><tspan baseline-shift="sub" font-size="0.7em">B</tspan> = 1,20 · (0,32 − 0,24) / (12 · 0,28)</text>
  <text x="697" y="362" font-family="'Segoe UI',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a2530">= 1,20 · 0,08 / 3,36 ≈ 0,0286 m</text>

  <text x="544" y="416" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#5a6a78">REZULTATI</text>
  <text x="640" y="430" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">m</tspan> = 0,28 m</text>
  <text x="790" y="430" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1e8449"><tspan font-style="italic">y</tspan><tspan baseline-shift="sub" font-size="0.7em">B</tspan> ≈ 2,86 cm</text>
<text x="68" y="228" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">L</tspan></text>
  <text x="68.0" y="244.0" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#b7600c">= 0,32 m</text>

  <text x="402" y="218" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#b7600c"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">D</tspan></text>
  <text x="402.0" y="234.0" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#b7600c">= 0,24 m</text>

  <text x="458" y="222" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#b7600c"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">m</tspan></text>
  <text x="458.0" y="238.0" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#b7600c">= 0,28 m</text>

  <text x="240" y="344" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">B</tspan> = 1,20 m</text>

  </svg>