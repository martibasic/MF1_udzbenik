<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img"
     aria-labelledby="u04fvc_u4vcT u04fvc_u4vcD" preserveAspectRatio="xMidYMid meet"
     style="display:block;width:100%;max-width:720px;height:auto;">
  <title id="u04fvc_u4vcT">Vodena cisterna vatrogasnog vozila pri zaustavljanju</title>
  <desc id="u04fvc_u4vcD">Poprečni presjek vodene cisterne pri zaustavljanju (L=2,4 m, h₀=1,2 m, a=4,5 m/s²). Δh=aL/g≈1,101 m. h_pred=1,751 m (lijeva/prednja stijenka), h_straz=0,650 m (desna/stražnja stijenka). tanα=a/g=0,459 → θ≈24,7°. Voda (plava) s nagnutom slobodnom površinom. Ubrzanje zaustavljanja prikazano strelicom lijevo.</desc>
  <defs>
    <marker id="u04fvc_u4vcDim" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#b7600c"/></marker>
    <marker id="u04fvc_u4vcDimL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L8,4 z" fill="#b7600c"/></marker>
    <marker id="u04fvc_u4vcArR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#c0392b"/></marker>
    <linearGradient id="u04fvc_u4vcwater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8e8f6"/><stop offset="100%" stop-color="#5baece"/>
    </linearGradient>
    <pattern id="u04fvc_u4vch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.8"/>
    </pattern>
  </defs>

  <rect width="720" height="400" fill="#f4f7fb" rx="8"/>

  <!-- Naslov -->
  <text x="360" y="28" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2e42" text-anchor="middle">Vodena cisterna vatrogasnog vozila pri zaustavljanju</text>
  <text x="360" y="46" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#3a5a7a" text-anchor="middle">L = 2,4 m  ·  h₀ = 1,2 m  ·  a = 4,5 m/s²</text>

  <!--
    Cisterna: unutarnja x=122..598, y=70..330
    Unutarnja visina=260px, L=2,4m → scale: max h_pred=1.751m
    Koristimo 260px za 2.0m (malo prikazan raspon) → scale_y=130 px/m
    h₀=1,2m → 1.2*130=156px od dna → y_h0=330-156=174
    h_pred=1.751m → 1.751*130=227.6px → y_pred=330-228=102
    h_straz=0.650m → 0.650*130=84.5px → y_straz=330-85=245
    Δh=1.101m → 1.101*130=143.1px
  -->

  <!-- Stijenke cisterne -->
  <rect x="106" y="68" width="18" height="264" fill="url(#u04fvc_u4vch)" stroke="#4a5a68" stroke-width="1.8"/>
  <rect x="596" y="68" width="18" height="264" fill="url(#u04fvc_u4vch)" stroke="#4a5a68" stroke-width="1.8"/>
  <rect x="106" y="328" width="508" height="18" fill="url(#u04fvc_u4vch)" stroke="#4a5a68" stroke-width="1.8"/>
  <rect x="106" y="68" width="508" height="8" fill="url(#u04fvc_u4vch)" stroke="#4a5a68" stroke-width="1.4"/>

  <!-- Voda (trapez): lijevo y=102, desno y=245, dno y=328 -->
  <polygon points="124,102 596,245 596,328 124,328" fill="url(#u04fvc_u4vcwater)" opacity="0.90"/>
  <!-- Slobodna površina -->
  <line x1="124" y1="102" x2="596" y2="245" stroke="#1565c0" stroke-width="2.8"/>

  <!-- Mirna razina -->
  <line x1="124" y1="174" x2="596" y2="174" stroke="#7a8a96" stroke-width="1.5" stroke-dasharray="10,6"/>
  <text x="604" y="178" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#7a8a96">h₀ = 1,2 m</text>

  <!-- Kut θ na sredini slobodne površine -->
  <!-- Sredina: x=(124+596)/2=360, y=(102+245)/2=173.5≈174 -->
  <!-- Kut slobodne površine: tan α = (245-102)/(596-124) = 143/472 = 0.303
       Ovo odgovara a/g = 4.5/9.81 = 0.459 → α = arctan(0.459) ≈ 24.7°
       Kut između vodoravnice i slobodne površine na sredini: -->
  <!-- Lukovi: od mirne razine prema slobodnoj površini, na sredini -->
  <path d="M 410,174 A 50,50 0 0 0 384,157" fill="none" stroke="#8e44ad" stroke-width="1.8"/>
  <text x="418" y="168" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#8e44ad">θ ≈ 24,7°</text>

  <!-- Ubrzanje zaustavljanja -->
  <line x1="310" y1="53" x2="228" y2="53" stroke="#c0392b" stroke-width="3.2" marker-end="url(#u04fvc_u4vcArR)"/>
  <text x="318" y="58" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#c0392b">a = 4,5 m/s² (zaustavljanje)</text>

  <!-- Kota h_pred -->
  <line x1="97" y1="102" x2="103" y2="102" stroke="#b7600c" stroke-width="1.3"/>
  <line x1="97" y1="328" x2="103" y2="328" stroke="#b7600c" stroke-width="1.3"/>
  <line x1="100" y1="104" x2="100" y2="326" stroke="#b7600c" stroke-width="1.6" marker-start="url(#u04fvc_u4vcDimL)" marker-end="url(#u04fvc_u4vcDim)"/>
  <text x="89" y="210" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#b7600c" text-anchor="end">h_p</text>
  <text x="89" y="225" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#b7600c" text-anchor="end">1,751 m</text>

  <!-- Kota h_straz -->
  <line x1="617" y1="245" x2="623" y2="245" stroke="#b7600c" stroke-width="1.3"/>
  <line x1="617" y1="328" x2="623" y2="328" stroke="#b7600c" stroke-width="1.3"/>
  <line x1="620" y1="247" x2="620" y2="326" stroke="#b7600c" stroke-width="1.6" marker-start="url(#u04fvc_u4vcDimL)" marker-end="url(#u04fvc_u4vcDim)"/>
  <text x="628" y="283" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#b7600c">h_s</text>
  <text x="628" y="297" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#b7600c">0,650 m</text>

  <!-- Kota Δh -->
  <line x1="62" y1="102" x2="68" y2="102" stroke="#c0392b" stroke-width="1.3"/>
  <line x1="62" y1="245" x2="68" y2="245" stroke="#c0392b" stroke-width="1.3"/>
  <line x1="65" y1="104" x2="65" y2="243" stroke="#c0392b" stroke-width="1.8" marker-start="url(#u04fvc_u4vcDimL)" marker-end="url(#u04fvc_u4vcArR)"/>
  <defs><marker id="u04fvc_u4vcArRL" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#c0392b"/></marker></defs>
  <text x="54" y="168" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#c0392b" text-anchor="end">Δh</text>
  <text x="54" y="182" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#c0392b" text-anchor="end">1,101 m</text>

  <!-- Kota L -->
  <line x1="124" y1="352" x2="124" y2="358" stroke="#b7600c" stroke-width="1.3"/>
  <line x1="596" y1="352" x2="596" y2="358" stroke="#b7600c" stroke-width="1.3"/>
  <line x1="126" y1="355" x2="594" y2="355" stroke="#b7600c" stroke-width="1.5" marker-start="url(#u04fvc_u4vcDimL)" marker-end="url(#u04fvc_u4vcDim)"/>
  <text x="360" y="370" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" fill="#b7600c" text-anchor="middle">L = 2,4 m</text>

  <!-- Formula box -->
  <rect x="100" y="377" width="520" height="18" rx="5" fill="white" stroke="#1565c0" stroke-width="1.2"/>
  <text x="360" y="390" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a2530" text-anchor="middle">tan α = a/g = 4,5/9,81 = 0,459 → θ ≈ 24,7°  ·  Δh = aL/g = 1,101 m  ·  h_p = 1,751 m  ·  h_s = 0,650 m</text>
</svg>