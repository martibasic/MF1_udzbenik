  <text x="790" y="62" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Hidrostatika - ključne jednadžbe</text>
  <text x="790" y="92" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">1. Vanjski tlak na dnu tanka</text>
  <text x="790" y="114" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1a2530">p<tspan baseline-shift="sub" font-size="0.7em">ext,dno</tspan> = ρ<tspan baseline-shift="sub" font-size="0.7em">m</tspan> · g · T<tspan baseline-shift="sub" font-size="0.7em">g</tspan>
  </text>
  <text x="790" y="134" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#5a6a78">= 1025 · 9,81 · 8,5</text>
  <text x="790" y="152" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">≈ 85,5 kPa</text>
  <text x="790" y="186" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">2. Unutarnji tlak (stanje A, pun)</text>
  <text x="790" y="208" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1a2530">p<tspan baseline-shift="sub" font-size="0.7em">int,dno</tspan>
    <tspan baseline-shift="super" font-size="0.7em">A</tspan> = ρ<tspan baseline-shift="sub" font-size="0.7em">b</tspan> · g · H<tspan baseline-shift="sub" font-size="0.7em">t</tspan> = 1000 · 9,81 · 5,0</text>
  <text x="790" y="228" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0d47a1">≈ 49,1 kPa</text>
  <text x="790" y="264" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">3. Neto tlak na dno (vani &gt; unutra → prema unutra)</text>
  <text x="790" y="286" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1a2530">Δp<tspan baseline-shift="sub" font-size="0.7em">dno</tspan>
    <tspan baseline-shift="super" font-size="0.7em">A</tspan> = 85,5 − 49,1 ≈ 36,4 kPa</text>
  <text x="790" y="308" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1a2530">Δp<tspan baseline-shift="sub" font-size="0.7em">dno</tspan>
    <tspan baseline-shift="super" font-size="0.7em">B</tspan> = 85,5 − 0 ≈ 85,5 kPa</text>
  <text x="790" y="344" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">4. Neto tlak na prozor (stanje A)</text>
  <text x="790" y="366" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1a2530">Δp<tspan baseline-shift="sub" font-size="0.7em">proz</tspan>
    <tspan baseline-shift="super" font-size="0.7em">A</tspan> = ρ<tspan baseline-shift="sub" font-size="0.7em">m</tspan>g(T<tspan baseline-shift="sub" font-size="0.7em">g</tspan>−h<tspan baseline-shift="sub" font-size="0.7em">p</tspan>) − ρ<tspan baseline-shift="sub" font-size="0.7em">b</tspan>g(H<tspan baseline-shift="sub" font-size="0.7em">t</tspan>−h<tspan baseline-shift="sub" font-size="0.7em">p</tspan>)</text>
  <text x="790" y="386" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" text-anchor="middle" fill="#5a6a78">≈ 65,36 − 29,43</text>
  <text x="790" y="404" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">≈ 35,9 kPa</text>
  <text x="790" y="450" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#5a6a78">REZULTATI - neto tlak na stijenku</text>
  <text x="708" y="472" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">stanje A, dno</text>
  <text x="708" y="490" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b">36,4 kPa ↑</text>
  <text x="872" y="472" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">stanje B, dno</text>
  <text x="872" y="490" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b">85,5 kPa ↑</text>
  <text x="790" y="514" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#5a6a78">stanje A, prozor: <tspan font-weight="700" fill="#c0392b">35,9 kPa →</tspan>   (smjer: prema unutra)</text>
