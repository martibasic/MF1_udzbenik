<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 644 529" role="img" aria-labelledby="u03fbt_title u03fbt_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:644px;height:auto;">
  <title id="u03fbt_title">Balastni tank u trupu broda - vanjska morska voda i unutarnja balastna voda</title>
  <desc id="u03fbt_desc">Tank dijeli lijevu oplatu i dno s vanjskim trupom: more izravno kvasi vanjsku stranu prozora i dna, a balast unutarnju. Tlačne sile na dno su okomite: izvana prema gore, iznutra prema dolje. Odzračnik je otvoren iznad palube. Vertikalno mjerilo je 36 jedinica po metru; more y80, voda u punom tanku y206, prozor y314, dno y386.</desc>
