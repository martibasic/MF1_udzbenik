      <stop offset="0%" stop-color="#9ecadf" />
      <stop offset="100%" stop-color="#3e7fa0" />
    </linearGradient>
    <linearGradient id="u03fbt_balast" x1="0" y1="206" x2="0" y2="386" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cfe6f3" />
      <stop offset="100%" stop-color="#7fb0cd" />
    </linearGradient>
    <linearGradient id="u03fbt_hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a8a96" />
      <stop offset="100%" stop-color="#3a4a56" />
    </linearGradient>
    <pattern id="u03fbt_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
