<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" role="img" aria-labelledby="u11v3kr_title u11v3kr_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:900px;height:auto;">
  <title id="u11v3kr_title">Horizontalno koljeno 90 stupnjeva i reakcija sidrenog nosaca</title>
  <desc id="u11v3kr_desc">Tlocrt horizontalnog koljena: ulaz D1 180 mm s pretlakom 52 kPa i brzinom 1,77 m/s, izlaz D2 120 mm s pretlakom 18 kPa i brzinom 3,98 m/s. Sila fluida na koljeno: Fx = 1402 N udesno, Fy = 383 N prema dolje, rezultanta 1,45 kN. Desno panel s jednadzbama kolicine gibanja.</desc>

  <defs>
    <linearGradient id="u11v3kr_voda_h" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aed6f1" />
      <stop offset="1" stop-color="#5b9ec9" />
    </linearGradient>
    <linearGradient id="u11v3kr_voda_v" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aed6f1" />
      <stop offset="1" stop-color="#5b9ec9" />
    </linearGradient>

    <!-- Marker: sila (crvena) -->
    <marker id="u11v3kr_fmark" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#c0392b" />
    </marker>
    <!-- Marker: rezultanta (ljubicasta) -->
    <marker id="u11v3kr_rmark" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#6c3082" />
    </marker>
    <!-- Marker: brzina (zelena) -->
    <marker id="u11v3kr_vmark" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#1e8449" />
    </marker>
    <!-- Marker: tlak (plava) -->
    <marker id="u11v3kr_pmark" markerWidth="6" markerHeight="4" refX="5.5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#1565c0" />
    </marker>
    <!-- Marker: kota -->
    <marker id="u11v3kr_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u11v3kr_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <!-- Marker: os (siva) -->
    <marker id="u11v3kr_axis" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#5a6a78" />
    </marker>
  </defs>

  <!-- pozadina -->
  <rect x="0" y="0" width="940" height="520" fill="#ffffff" />

  <!-- ===================== LIJEVI PANEL: TLOCRT KOLJENA ===================== -->
  <rect x="16" y="20" width="500" height="484" rx="12" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.4" />
  <!-- =====================
       GEOMETRIJA KOLJENA (pomaknuta nize radi naslova)
       Ulazni cjevovod (D1 = 180 mm => 80 px): horizontalno, centar y = 300
         vanjske stijenke: y = 260 i y = 340; unutarnji fluid od y = 260..340
         x: od 60 do 320 (zatim koljeno)
       Izlazni cjevovod (D2 = 120 mm => 54 px): vertikalno, centar x = 346
         vanjske stijenke: x = 319 i x = 373; unutarnji fluid od x = 319..373
         y: od 110 do 340 (preklapa kut)
       ===================== -->

  <!-- Fluid plava: dvije rect koje zajedno tvore "L" kontinuitet -->
  <rect x="60" y="260" width="263" height="80" fill="url(#u11v3kr_voda_h)" />
  <rect x="319" y="110" width="54" height="232" fill="url(#u11v3kr_voda_v)" />

  <!-- Vanjske stijenke -->
  <!-- Gornja stijenka ulaza (proteze se do unutarnjeg ruba izlazne cijevi x=319) -->
  <line x1="60" y1="260" x2="319" y2="260" stroke="#3a4a56" stroke-width="2.4" />
  <!-- Donja stijenka ulaza (proteze se do desnog vanjskog ruba izlazne cijevi x=373 - to je vanjski kut) -->
  <line x1="60" y1="340" x2="373" y2="340" stroke="#3a4a56" stroke-width="2.4" />
  <!-- Lijeva stijenka izlazne cijevi: x=319, od y=260 (unutarnji kut) prema gore do y=110 -->
  <line x1="319" y1="260" x2="319" y2="110" stroke="#3a4a56" stroke-width="2.4" />
  <!-- Desna stijenka izlazne cijevi: x=373, od y=340 (vanjski kut) prema gore do y=110 -->
  <line x1="373" y1="340" x2="373" y2="110" stroke="#3a4a56" stroke-width="2.4" />

  <!-- Otvoreni krajevi (presjeci) - tankim isprekidanim -->
  <line x1="60" y1="260" x2="60" y2="340" stroke="#3a4a56" stroke-width="2.0" stroke-dasharray="2,3" />
  <line x1="319" y1="110" x2="373" y2="110" stroke="#3a4a56" stroke-width="2.0" stroke-dasharray="2,3" />

  <!-- ===== KONTROLNI VOLUMEN (isprekidana siva) ===== -->
  <path d="M 60 250 L 309 250 L 309 110 L 383 110 L 383 350 L 60 350 Z" fill="none" stroke="#7a8a96" stroke-width="1.4" stroke-dasharray="8,5" />
  <!-- ===== PRESJEK 1 (ulaz, lijevo) ===== -->
  <line x1="86" y1="252" x2="86" y2="348" stroke="#1a2530" stroke-width="1.4" stroke-dasharray="4,3" />
  <circle cx="86" cy="300" r="3" fill="#1a2530" />
  <!-- ===== PRESJEK 2 (izlaz, gore) ===== -->
  <line x1="312" y1="140" x2="380" y2="140" stroke="#1a2530" stroke-width="1.4" stroke-dasharray="4,3" />
  <circle cx="346" cy="140" r="3" fill="#1a2530" />
  <!-- ===== STRELICE BRZINA (zelena) ===== -->
  <!-- v1: udesno -->
  <line x1="106" y1="300" x2="194" y2="300" stroke="#1e8449" stroke-width="2.6" marker-end="url(#u11v3kr_vmark)" />
  <!-- v2: prema gore -->
  <line x1="346" y1="226" x2="346" y2="156" stroke="#1e8449" stroke-width="2.6" marker-end="url(#u11v3kr_vmark)" />
  <!-- ===== STRELICE PRETLAKA (plava) ===== -->
  <!-- p_M1 na presjeku 1: dvije strelice prema +x -->
  <line x1="62" y1="278" x2="80" y2="278" stroke="#1565c0" stroke-width="2" marker-end="url(#u11v3kr_pmark)" />
  <line x1="62" y1="322" x2="80" y2="322" stroke="#1565c0" stroke-width="2" marker-end="url(#u11v3kr_pmark)" />
  <!-- p_M2 na presjeku 2: dvije strelice prema dolje (na izlaz) -->
  <line x1="328" y1="120" x2="328" y2="138" stroke="#1565c0" stroke-width="2" marker-end="url(#u11v3kr_pmark)" />
  <line x1="364" y1="120" x2="364" y2="138" stroke="#1565c0" stroke-width="2" marker-end="url(#u11v3kr_pmark)" />
  <!-- ===== KOTE PROMJERA ===== -->
  <!-- D1 (vertikalna kota lijevo od ulaza) -->
  <!-- D2 (horizontalna kota iznad izlaza) -->
  <!-- ===== KOORDINATNI SUSTAV (x, y) ===== -->
  <line x1="410" y1="450" x2="470" y2="450" stroke="#5a6a78" stroke-width="1.8" marker-end="url(#u11v3kr_axis)" />
  <line x1="410" y1="450" x2="410" y2="390" stroke="#5a6a78" stroke-width="1.8" marker-end="url(#u11v3kr_axis)" />
  <circle cx="410" cy="450" r="2.5" fill="#5a6a78" />
  <!-- ===== SILE FLUIDA NA KOLJENO (od cvora u unutarnjem kutu/centru elbow-a) ===== -->
  <circle cx="346" cy="300" r="3.5" fill="#1a2530" />

  <!-- F_x = 1402 N: prema desno - duza -->
  <line x1="346" y1="300" x2="474" y2="300" stroke="#c0392b" stroke-width="2.8" marker-end="url(#u11v3kr_fmark)" />
  <!-- F_y = 383 N: prema dolje, kraca (proporcionalno) -->
  <line x1="346" y1="300" x2="346" y2="370" stroke="#c0392b" stroke-width="2.8" marker-end="url(#u11v3kr_fmark)" />
  <!-- F_R rezultanta: kut ~15.3 deg (atan(383/1402)) - dijagonala -->
  <line x1="346" y1="300" x2="474" y2="335" stroke="#6c3082" stroke-width="2.6" marker-end="url(#u11v3kr_rmark)" />
  <!-- ===== TEKSTUALNI BLOK NA DNU LIJEVOG PANELA ===== -->
  <!-- Podaci -->
  <line x1="36" y1="478" x2="496" y2="478" stroke="#d4e3f0" stroke-width="1" />
  <!-- ===================== DESNI PANEL: JEDNADZBE ===================== -->
  <rect x="528" y="20" width="396" height="484" rx="12" fill="#fbfdff" stroke="#d4e3f0" stroke-width="1.4" />

  <!-- header bar -->
  <rect x="528" y="20" width="396" height="34" rx="12" fill="#1565c0" />
  <rect x="528" y="40" width="396" height="14" fill="#1565c0" />
  <!-- KORAK 1: povrsine i brzine -->
  <rect x="544" y="68" width="364" height="76" rx="8" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1" />
  <rect x="544" y="68" width="5" height="76" rx="2" fill="#1565c0" />
  <!-- KORAK 2: maseni protok -->
  <rect x="544" y="152" width="364" height="58" rx="8" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1" />
  <rect x="544" y="152" width="5" height="58" rx="2" fill="#1565c0" />
  <!-- KORAK 3: Smjer x -->
  <rect x="544" y="218" width="364" height="84" rx="8" fill="#fdeff0" stroke="#e7b9bd" stroke-width="1" />
  <rect x="544" y="218" width="5" height="84" rx="2" fill="#c0392b" />
  <!-- KORAK 4: Smjer y -->
  <rect x="544" y="310" width="364" height="84" rx="8" fill="#fdeff0" stroke="#e7b9bd" stroke-width="1" />
  <rect x="544" y="310" width="5" height="84" rx="2" fill="#c0392b" />
  <!-- KORAK 5: rezultanta -->
  <rect x="544" y="402" width="364" height="58" rx="8" fill="#f3ecf6" stroke="#c9b3d4" stroke-width="1" />
  <rect x="544" y="402" width="5" height="58" rx="2" fill="#6c3082" />
  <!-- Sazetak (italic) -->
  <line x1="60" y1="260" x2="36" y2="260" stroke="#b7600c" stroke-width="0.7" />
  <line x1="60" y1="340" x2="36" y2="340" stroke="#b7600c" stroke-width="0.7" />
  <line x1="42" y1="260" x2="42" y2="340" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u11v3kr_dimL)" marker-end="url(#u11v3kr_dim)" />
  <line x1="319" y1="110" x2="319" y2="86" stroke="#b7600c" stroke-width="0.7" />
  <line x1="373" y1="110" x2="373" y2="86" stroke="#b7600c" stroke-width="0.7" />
  <line x1="319" y1="94" x2="373" y2="94" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u11v3kr_dimL)" marker-end="url(#u11v3kr_dim)" />
  <text x="36" y="46" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Tlocrt koljena 90° (horizontalna ravnina)</text>

  <text x="100" y="380" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#5a6a78">granica kontrolnog volumena (KV)</text>

  <text x="80" y="246" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1a2530">1</text>

  <text x="386" y="145" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1a2530">2</text>

  <text x="116" y="293" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e8449"><tspan font-style="italic" font-weight="700">v</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> = 1,77 m/s</text>

  <text x="252" y="195" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e8449"><tspan font-style="italic" font-weight="700">v</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 3,98 m/s</text>

  <text x="106" y="246" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="start" fill="#1565c0"><tspan font-style="italic" font-weight="700">p</tspan><tspan baseline-shift="sub" font-size="0.7em">M1</tspan> = 52 kPa</text>

  <text x="396" y="125" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1565c0"><tspan font-style="italic" font-weight="700">p</tspan><tspan baseline-shift="sub" font-size="0.7em">M2</tspan> = 18 kPa</text>

  <text x="476" y="454" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#5a6a78">x</text>
  <text x="398" y="388" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#5a6a78">y</text>
  <text x="416" y="468" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a6a78">(horizontalna ravnina)</text>

  <text x="390" y="293" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#c0392b"><tspan font-style="italic" font-weight="700">F</tspan><tspan baseline-shift="sub" font-size="0.7em">x</tspan> = 1402 N</text>

  <text x="352" y="358" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#c0392b"><tspan font-style="italic" font-weight="700">F</tspan><tspan baseline-shift="sub" font-size="0.7em">y</tspan> = 383 N</text>

  <text x="478" y="353" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#6c3082" text-anchor="end"><tspan font-style="italic" font-weight="700">F</tspan><tspan baseline-shift="sub" font-size="0.7em">R</tspan> ≈ 1,45 kN</text>

  <text x="40" y="448" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78">Sila fluida na koljeno: <tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">x</tspan> udesno (+<tspan font-style="italic">x</tspan>) i <tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">y</tspan> prema dolje (−<tspan font-style="italic">y</tspan>).</text>
  <text x="40" y="466" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78">Sidreni nosač preuzima jednaku i suprotnu silu (ulijevo i prema gore).</text>

  <text x="40" y="494" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a2530"><tspan font-weight="700">Zadano:</tspan>  ρ = 998 kg/m³,  <tspan font-style="italic">Q</tspan> = 0,045 m³/s,  <tspan font-style="italic">D</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> = 180 mm,  <tspan font-style="italic">D</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 120 mm</text>

  <text x="726" y="42" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Jednadžba količine gibanja po osima</text>

  <text x="558" y="88" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1565c0">1. Površine i brzine iz kontinuiteta</text>
  <text x="726" y="110" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">A</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> = π<tspan font-style="italic">D</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan>²/4 = 2,545·10⁻² m²,  <tspan font-style="italic">A</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 1,131·10⁻² m²</text>
  <text x="726" y="132" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1e8449"><tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> = <tspan font-style="italic">Q</tspan>/<tspan font-style="italic">A</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> = 1,77 m/s,  <tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> = <tspan font-style="italic">Q</tspan>/<tspan font-style="italic">A</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 3,98 m/s</text>

  <text x="558" y="172" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1565c0">2. Maseni protok</text>
  <text x="726" y="196" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">m</tspan>̇ = ρ<tspan font-style="italic">Q</tspan> = 998·0,045 = 44,9 kg/s</text>

  <text x="558" y="238" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#c0392b">3. Smjer x — izlaz nema komponentu po x</text>
  <text x="726" y="260" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">p</tspan><tspan baseline-shift="sub" font-size="0.7em">M1</tspan>·<tspan font-style="italic">A</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> + <tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">st,x</tspan> = <tspan font-style="italic">m</tspan>̇(0 − <tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan>)</text>
  <text x="726" y="288" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">x</tspan> = +1402 N  (fluid → koljeno, udesno)</text>

  <text x="558" y="330" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#c0392b">4. Smjer y — ulaz nema komponentu po y</text>
  <text x="726" y="352" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" text-anchor="middle" fill="#1a2530">−<tspan font-style="italic">p</tspan><tspan baseline-shift="sub" font-size="0.7em">M2</tspan>·<tspan font-style="italic">A</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> + <tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">st,y</tspan> = <tspan font-style="italic">m</tspan>̇(<tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> − 0)</text>
  <text x="726" y="380" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">y</tspan> = −383 N  (fluid → koljeno, prema dolje)</text>

  <text x="558" y="422" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#6c3082">5. Rezultanta sile fluida na koljeno</text>
  <text x="726" y="446" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#6c3082"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="0.7em">R</tspan> = √(1402² + 383²) ≈ 1453 N ≈ 1,45 kN</text>

  <text x="726" y="486" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" text-anchor="middle" fill="#5a6a78">Nosač preuzima istu silu u suprotnom smjeru (ulijevo i prema gore).</text>
<text x="42" y="358" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">D</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan></text>
  <text x="42.0" y="374.0" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" fill="#b7600c">= 180 mm</text>

  <text x="346" y="80" font-family="'Segoe UI',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">D</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 120 mm</text>

  </svg>