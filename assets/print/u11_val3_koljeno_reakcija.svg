<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" role="img" aria-labelledby="u11v3-title" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <defs>
    <linearGradient id="u11v3-wh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4eef8"/>
      <stop offset="100%" stop-color="#7ec8e8"/>
    </linearGradient>
    <linearGradient id="u11v3-wv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4eef8"/>
      <stop offset="100%" stop-color="#7ec8e8"/>
    </linearGradient>
    <marker id="u11v3-ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0f766e"/>
    </marker>
    <marker id="u11v3-ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#b42318"/>
    </marker>
    <marker id="u11v3-ap" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d2694"/>
    </marker>
    <marker id="u11v3-agr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#546e7a"/>
    </marker>
    <marker id="u11v3-agr-rev" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#546e7a"/>
    </marker>
  </defs>
  <rect width="940" height="450" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="402" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>
  <text id="u11v3-title" x="54" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#173043">U11 – Servisno koljeno na sidrenom nosacu (90°)</text>
  <text x="54" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#516677">D&#x2081;=180 mm, D&#x2082;=120 mm, Q=0,045 m³/s  &#x21D2;  F&#x2093;=1402 N, F&#x1D67;=383 N, F&#x209C;=1453 N &#x2248; 1,45 kN</text>
  <!-- ===== PIPE GEOMETRY ===== -->
  <!-- Horizontal inlet pipe wall (D1=180mm -> 58px) -->
  <rect x="54" y="268" width="338" height="58" rx="3" fill="#c8d6df" stroke="#2d3a40" stroke-width="2.5"/>
  <!-- Fluid in horizontal pipe -->
  <rect x="57" y="273" width="332" height="48" fill="url(#u11v3-wh)" stroke="none"/>
  <!-- Vertical outlet pipe wall (D2=120mm -> 40px), going UP -->
  <rect x="350" y="96" width="40" height="232" rx="3" fill="#c8d6df" stroke="#2d3a40" stroke-width="2.5"/>
  <!-- Fluid in vertical pipe -->
  <rect x="354" y="99" width="32" height="228" fill="url(#u11v3-wv)" stroke="none"/>
  <!-- Elbow corner fill (fluid connecting piece) -->
  <rect x="350" y="268" width="42" height="58" fill="url(#u11v3-wh)" stroke="none"/>
  <!-- Elbow corner wall border (just the corners) -->
  <line x1="350" y1="268" x2="350" y2="326" stroke="#2d3a40" stroke-width="2.5"/>
  <line x1="54" y1="268" x2="352" y2="268" stroke="none"/>
  <line x1="54" y1="326" x2="354" y2="326" stroke="none"/>
  <!-- ===== SECTIONS ===== -->
  <!-- Section 1 (inlet) -->
  <line x1="130" y1="260" x2="130" y2="338" stroke="#173043" stroke-width="2"/>
  <circle cx="130" cy="297" r="5" fill="#173043"/>
  <text x="122" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#173043">1</text>
  <!-- Section 2 (outlet top) -->
  <line x1="342" y1="96" x2="400" y2="96" stroke="#173043" stroke-width="2"/>
  <circle cx="370" cy="96" r="5" fill="#173043"/>
  <text x="400" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#173043">2</text>
  <!-- ===== VELOCITIES ===== -->
  <!-- v1 (rightward, green) -->
  <line x1="162" y1="297" x2="296" y2="297" stroke="#0f766e" stroke-width="3.5" marker-end="url(#u11v3-ag)"/>
  <text x="194" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f766e">v&#x2081; = 1,77 m/s</text>
  <!-- v2 (upward, green) -->
  <line x1="370" y1="178" x2="370" y2="114" stroke="#0f766e" stroke-width="3.5" marker-end="url(#u11v3-ag)"/>
  <text x="380" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f766e">v&#x2082; = 3,98 m/s</text>
  <!-- ===== PRESSURE LABELS ===== -->
  <rect x="54" y="338" width="120" height="26" rx="6" fill="#f0f7ff" stroke="#93afc8" stroke-width="1.5"/>
  <text x="70" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#173043">p&#x2098;&#x2081; = 52 kPa</text>
  <rect x="410" y="80" width="116" height="26" rx="6" fill="#f0f7ff" stroke="#93afc8" stroke-width="1.5"/>
  <text x="426" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#173043">p&#x2098;&#x2082; = 18 kPa</text>
  <!-- ===== CONTROL VOLUME ===== -->
  <rect x="100" y="88" width="348" height="252" rx="10" fill="none" stroke="#8090a0" stroke-width="1.8" stroke-dasharray="10 5"/>
  <text x="444" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8090a0">KV</text>
  <!-- ===== REACTION FORCES on koljeno (fluid->koljeno) ===== -->
  <!-- Fx = 1402 N, pointing right (+x) -->
  <line x1="540" y1="360" x2="700" y2="360" stroke="#b42318" stroke-width="4" marker-end="url(#u11v3-ar)"/>
  <text x="582" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#b42318">F&#x2093; = 1402 N</text>
  <!-- Fy = 383 N, pointing down (-y) -->
  <line x1="620" y1="360" x2="620" y2="420" stroke="#b42318" stroke-width="4" marker-end="url(#u11v3-ar)"/>
  <text x="630" y="402" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#b42318">F&#x1D67; = 383 N</text>
  <!-- FR resultant -->
  <line x1="540" y1="360" x2="668" y2="413" stroke="#6d2694" stroke-width="3.5" marker-end="url(#u11v3-ap)"/>
  <text x="596" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#6d2694">F&#x209C; = 1453 N</text>
  <!-- Origin dot for force vectors -->
  <circle cx="540" cy="360" r="5" fill="#173043"/>
  <!-- ===== DIMENSION LABELS ===== -->
  <text x="54" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#546e7a">D&#x2081;=180 mm</text>
  <text x="412" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#546e7a">D&#x2082;=120 mm</text>
  <!-- ===== COORD AXES ===== -->
  <line x1="490" y1="310" x2="548" y2="310" stroke="#546e7a" stroke-width="2" marker-end="url(#u11v3-agr)"/>
  <text x="552" y="315" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#546e7a">x</text>
  <line x1="490" y1="310" x2="490" y2="252" stroke="#546e7a" stroke-width="2" marker-end="url(#u11v3-agr)"/>
  <text x="494" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#546e7a">y</text>
  <!-- ===== FORMULA BOX ===== -->
  <rect x="532" y="148" width="376" height="96" rx="10" fill="#fffef6" stroke="#c49a0a" stroke-width="1.8"/>
  <text x="548" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#173043">m&#x2D9; = &#x03C1;Q = 44,9 kg/s</text>
  <text x="548" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#173043">Smjer x: p&#x2098;&#x2081;&#xB7;A&#x2081; + F&#x209C;&#x2093; = m&#x2D9;(0 &#x2212; v&#x2081;)  &#x21D2;  F&#x209C;&#x2093; = &#x2212;1402 N</text>
  <text x="548" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#173043">Smjer y: &#x2212;p&#x2098;&#x2082;&#xB7;A&#x2082; + F&#x209C;&#x1D67; = m&#x2D9;(v&#x2082; &#x2212; 0)  &#x21D2;  F&#x209C;&#x1D67; = +383 N</text>
  <text x="548" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#6d2694">F&#x209C; = &#x221A;(1402&#xB2;+383&#xB2;) = 1453 N &#x2248; 1,45 kN</text>
  <!-- Force decomp note -->
  <text x="54" y="418" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#516677">Fluid na koljeno: F&#x2093;=+1402 N (&#x2192;), F&#x1D67;=&#x2212;383 N (&#x2193;)  &#x2014;  nosac preuzima suprotnu silu: &#x2190; i &#x2191;.</text>
</svg>