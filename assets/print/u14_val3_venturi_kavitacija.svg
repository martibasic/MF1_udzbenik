<title id="u14vent_title">Venturi: geometrija i granica jednofaznog modela</title><desc id="u14vent_desc">Otvoreno osnosimetrično suženje s promjerima u omjeru tri prema jedan. Izračun tlaka za zadani protok prikazan je na numeričkoj osi: dio ispod tlaka pare je isprekidan i nije fizički tlak jednofazne vode.</desc>
