<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" role="img" aria-labelledby="u05fip_title u05fip_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:900px;height:auto;">
  <title id="u05fip_title">Hidrostatska sila na inspekcijski poklopac ventiliranoga spremnika</title>
  <desc id="u05fip_desc">Lijevo: presjek ventiliranoga procesnog spremnika sa zrakom iznad slobodne povrsine vode i vertikalnim pravokutnim inspekcijskim poklopcem na bocnoj stijenci (sirina b=0,40 m, visina h=0,60 m, gornji rub na dubini h1=1,50 m). Atmosferski tlak djeluje s obje strane i ponistava se. Trapezni dijagram hidrostatskog pretlaka djeluje na poklopac od p1 na vrhu do p2 na dnu; centroid C je na dubini h_C=1,80 m, a centar tlaka CP 16,7 mm nize. Rezultantna sila F priblizno 4,23 kN djeluje vodoravno prema van.</desc>

  <defs>
    <linearGradient id="u05fip_voda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aed6f1" />
      <stop offset="1" stop-color="#5b9ec9" />
    </linearGradient>
    <linearGradient id="u05fip_para" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7f9" />
      <stop offset="1" stop-color="#dbe4ec" />
    </linearGradient>
    <linearGradient id="u05fip_prgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1565c0" stop-opacity="0.12" />
      <stop offset="1" stop-color="#1565c0" stop-opacity="0.55" />
    </linearGradient>
    <pattern id="u05fip_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a8a96" stroke-width="1.4" />
    </pattern>
    <marker id="u05fip_pr" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#1565c0" />
    </marker>
    <marker id="u05fip_f" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#c0392b" />
    </marker>
    <marker id="u05fip_dim" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
    <marker id="u05fip_dimL" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L7,3 z" fill="#b7600c" />
    </marker>
  </defs>

  <!-- Pozadina i okviri -->
  <line x1="500" y1="40" x2="500" y2="480" stroke="#dce7f0" stroke-width="1.2" stroke-dasharray="4,5" />

  <!-- ===================== LIJEVO: PRESJEK KOTLA ===================== -->
  <!-- Mjerilo: 1 m = 120 px; slobodna povrsina vode na y=140 -->
  <!-- h1 = 1,50 m -> 180 px -> gornji rub poklopca na y = 140 + 180 = 320 -->
  <!-- h  = 0,60 m -> 72 px -> donji rub poklopca na y = 320 + 72 = 392 -->
  <!-- h_C = 1,80 m -> 216 px -> centroid C na y = 140 + 216 = 356 -->
  <!-- Kotao interior x: 130..360 -->

  <!-- Kotao: zatvoreni pressure vessel -->
  <!-- Lijeva stijenka (puna visina) -->
  <rect x="116" y="80" width="14" height="340" fill="url(#u05fip_hatch)" stroke="#3a4a56" stroke-width="1.4" />
  <!-- Desna stijenka (puna visina) -->
  <rect x="360" y="80" width="20" height="340" fill="url(#u05fip_hatch)" stroke="#3a4a56" stroke-width="1.4" />
  <!-- Gornja stijenka -->
  <rect x="116" y="72" width="264" height="14" fill="url(#u05fip_hatch)" stroke="#3a4a56" stroke-width="1.4" />
  <!-- Donja stijenka -->
  <rect x="116" y="414" width="264" height="14" fill="url(#u05fip_hatch)" stroke="#3a4a56" stroke-width="1.4" />

  <!-- Zrak iznad vode -->
  <rect x="130" y="86" width="230" height="54" fill="url(#u05fip_para)" />
  <!-- Voda u spremniku -->
  <rect x="130" y="140" width="230" height="274" fill="url(#u05fip_voda)" />
  <!-- Slobodna povrsina -->
  <line x1="130" y1="140" x2="360" y2="140" stroke="#1565c0" stroke-width="2.2" />
  <!-- Inspekcijski poklopac na desnoj stjenki -->
  <rect x="360" y="320" width="20" height="72" fill="#b9c4cb" stroke="#3a4a56" stroke-width="1.0" />
  <rect x="360" y="320" width="20" height="72" fill="url(#u05fip_voda)" opacity="0.95" />
  <!-- Sam poklopac (vanjska ploca) -->
  <rect x="380" y="320" width="6" height="72" fill="#909fa8" stroke="#3a4a56" stroke-width="1.4" />
  <!-- Vijci -->
  <circle cx="383" cy="326" r="2.2" fill="#3a4a56" />
  <circle cx="383" cy="386" r="2.2" fill="#3a4a56" />

  <!-- Trapezni dijagram tlaka -->
  <polygon points="386,320 426,320 442,392 386,392" fill="url(#u05fip_prgrad)" stroke="#1565c0" stroke-width="1.2" />
  <!-- Tlacne strelice (4 unutar dijagrama) -->
  <line x1="386" y1="332" x2="416" y2="332" stroke="#1565c0" stroke-width="1.6" marker-end="url(#u05fip_pr)" />
  <line x1="386" y1="350" x2="424" y2="350" stroke="#1565c0" stroke-width="1.6" marker-end="url(#u05fip_pr)" />
  <line x1="386" y1="368" x2="432" y2="368" stroke="#1565c0" stroke-width="1.6" marker-end="url(#u05fip_pr)" />
  <line x1="386" y1="384" x2="440" y2="384" stroke="#1565c0" stroke-width="1.6" marker-end="url(#u05fip_pr)" />

  <!-- p1 i p2 labele -->
  <!-- Centroid C i centar tlaka CP (na sredini poklopca y=356) -->
  <circle cx="383" cy="356" r="3.2" fill="#1a2530" stroke="#ffffff" stroke-width="1.0" />
  <!-- leader iznad u prostor pare (clean - krace, do labela u gornjem desnom dijelu vode) -->
  <line x1="382" y1="356" x2="306" y2="194" stroke="#1a2530" stroke-width="0.7" />
  <!-- Sila F (crvena, ulazno opterecenje na poklopac, vodoravno iz centra tlaka prema van) -->
  <line x1="383" y1="356" x2="498" y2="356" stroke="#c0392b" stroke-width="2.8" marker-end="url(#u05fip_f)" />
  <!-- Kota h1 (lijevo izvan spremnika od slobodne povrsine do vrha poklopca) -->
  <!-- Kota h_C (od slobodne povrsine do C, krajnje lijevo, dalje od h1) -->
  <!-- Mini prikaz lica poklopca (b x h) na dnu lijevog panela -->
  <rect x="170" y="442" width="80" height="56" fill="#e6eef3" stroke="#5d6d7e" stroke-width="1.2" />
  <!-- kota b iznad -->
  <!-- kota h desno -->
  <!-- Napomena desno od mini prikaza -->
  <!-- ===================== DESNO: KORACI RJESENJA ===================== -->

  <!-- Header bar -->
  <rect x="516" y="44" width="396" height="32" rx="7" fill="#1565c0" />
  <!-- Korak 1: povrsina i dubina centroida -->
  <rect x="516" y="86" width="396" height="78" rx="9" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="516" y="86" width="6" height="78" rx="3" fill="#1565c0" />
  <!-- Korak 2: rezultantna sila -->
  <rect x="516" y="174" width="396" height="90" rx="9" fill="#f1f9f3" stroke="#cce7d4" stroke-width="1.2" />
  <rect x="516" y="174" width="6" height="90" rx="3" fill="#1e8449" />
  <!-- Korak 3: drugi moment -->
  <rect x="516" y="274" width="396" height="76" rx="9" fill="#fdf8f2" stroke="#ecd9c2" stroke-width="1.2" />
  <!-- Korak 4: centar tlaka -->
  <rect x="516" y="360" width="396" height="100" rx="9" fill="#f5f9fd" stroke="#cfe0ee" stroke-width="1.2" />
  <rect x="516" y="360" width="6" height="100" rx="3" fill="#1565c0" />
  <!-- REZULTATI badge -->
  <rect x="516" y="470" width="396" height="34" rx="8" fill="#e8f5e9" stroke="#1e8449" stroke-width="1.4" />
  <line x1="116" y1="140" x2="86" y2="140" stroke="#b7600c" stroke-width="0.7" />
  <line x1="116" y1="320" x2="86" y2="320" stroke="#b7600c" stroke-width="0.7" />
  <line x1="90" y1="140" x2="90" y2="320" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u05fip_dimL)" marker-end="url(#u05fip_dim)" />
  <line x1="382" y1="356" x2="70" y2="356" stroke="#b7600c" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.55" />
  <line x1="116" y1="140" x2="70" y2="140" stroke="#b7600c" stroke-width="0.7" />
  <line x1="74" y1="140" x2="74" y2="356" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u05fip_dimL)" marker-end="url(#u05fip_dim)" />
  <line x1="170" y1="442" x2="170" y2="430" stroke="#b7600c" stroke-width="0.7" />
  <line x1="250" y1="442" x2="250" y2="430" stroke="#b7600c" stroke-width="0.7" />
  <line x1="173" y1="436" x2="247" y2="436" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u05fip_dimL)" marker-end="url(#u05fip_dim)" />
  <line x1="250" y1="442" x2="266" y2="442" stroke="#b7600c" stroke-width="0.7" />
  <line x1="250" y1="498" x2="266" y2="498" stroke="#b7600c" stroke-width="0.7" />
  <line x1="262" y1="442" x2="262" y2="498" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u05fip_dimL)" marker-end="url(#u05fip_dim)" />
  <rect x="516" y="274" width="6" height="76" rx="3" fill="#b7600c" />
  <text x="44" y="56" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530">Ventilirani spremnik s inspekcijskim poklopcem</text>

  <text x="245" y="107" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#5a6a78">zrak</text>
  <text x="245" y="125" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#5a6a78">(atmosferski tlak <tspan font-style="italic">p</tspan><tspan baseline-shift="sub" font-size="0.7em">0</tspan>)</text>

  <text x="136" y="156" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" fill="#0d47a1">slobodna površina</text>
  <text x="170" y="240" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" fill="#0d47a1">voda</text>
  <text x="170" y="258" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1a2530">ρ = 998 kg/m³</text>

  <text x="426" y="313" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" fill="#1565c0"><tspan font-weight="700">p</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> = <tspan font-style="italic">ρgh</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan></text>
  <text x="442" y="405" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-style="italic" fill="#1565c0"><tspan font-weight="700">p</tspan><tspan baseline-shift="sub" font-size="0.7em">2</tspan> = <tspan font-style="italic">ρg</tspan>(<tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan>+<tspan font-style="italic">h</tspan>)</text>

  <text x="312" y="200" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#1a2530">C ≈ CP</text>
  <text x="312" y="214" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#5a6a78">(Δ = 16,7 mm)</text>

  <text x="474" y="346" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic" text-anchor="middle" fill="#c0392b"><tspan font-weight="700">F</tspan> ≈ 4,23 kN</text>

  <text x="44" y="450" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#1a2530">lice poklopca (b × h):</text>
  <text x="320" y="455" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a6a78">Isti <tspan font-style="italic">p</tspan><tspan baseline-shift="sub" font-size="0.7em">0</tspan> djeluje s obje strane poklopca</text>
  <text x="320" y="470" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a6a78">→ poništava se; ostaje samo</text>
  <text x="320" y="485" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a6a78">hidrostatski pretlak <tspan font-style="italic">ρgh</tspan>.</text>

  <text x="714" y="65" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Rezultantna sila i centar tlaka</text>

  <text x="534" y="106" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">1. Površina poklopca i dubina težišta</text>
  <text x="714" y="128" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">A</tspan> = <tspan font-style="italic">b·h</tspan> = 0,40·0,60 = 0,240 m²</text>
  <text x="714" y="152" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">C</tspan> = <tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan> + <tspan font-style="italic">h</tspan>/2 = 1,50 + 0,30 = 1,80 m</text>

  <text x="534" y="194" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">2. Rezultantna hidrostatska sila</text>
  <text x="714" y="218" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">F</tspan> = <tspan font-style="italic">ρgA h</tspan><tspan baseline-shift="sub" font-size="0.7em">C</tspan></text>
  <text x="714" y="238" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" text-anchor="middle" fill="#1a2530">= 998·9,81·0,240·1,80</text>
  <text x="714" y="258" font-family="'Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="700" text-anchor="middle" fill="#1e8449"><tspan font-style="italic">F</tspan> ≈ 4 232 N ≈ 4,23 kN</text>

  <text x="534" y="294" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">3. Drugi moment površine oko vlastite osi</text>
  <text x="714" y="316" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">I</tspan><tspan baseline-shift="sub" font-size="0.7em">G</tspan> = <tspan font-style="italic">bh</tspan>³/12 = 0,40·0,60³/12</text>
  <text x="534" y="380" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5a6a78">4. Dubina centra tlaka</text>
  <text x="714" y="402" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1a2530"><tspan font-style="italic">y</tspan><tspan baseline-shift="sub" font-size="0.7em">CP</tspan> = <tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">C</tspan> + <tspan font-style="italic">I</tspan><tspan baseline-shift="sub" font-size="0.7em">G</tspan>/(<tspan font-style="italic">A h</tspan><tspan baseline-shift="sub" font-size="0.7em">C</tspan>)</text>
  <text x="714" y="424" font-family="'Segoe UI',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1a2530">= 1,80 + 7,20·10⁻³/(0,240·1,80) = 1,80 + 0,0167</text>
  <text x="714" y="448" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1565c0"><tspan font-style="italic">y</tspan><tspan baseline-shift="sub" font-size="0.7em">CP</tspan> = 1,817 m   →   Δ = 16,7 mm ispod C</text>

  <text x="534" y="492" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#5a6a78">REZULTATI</text>
  <text x="650" y="492" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e8449"><tspan font-style="italic">F</tspan> ≈ 4,23 kN</text>
  <text x="775" y="492" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1565c0"><tspan font-style="italic">y</tspan><tspan baseline-shift="sub" font-size="0.7em">CP</tspan> = 1,817 m</text>
  <text x="80" y="226" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="end" fill="#b7600c"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">1</tspan></text>
  <text x="80.0" y="242.0" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="end" fill="#b7600c">= 1,50 m</text>

  <text x="64" y="253" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="end" fill="#b7600c"><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="0.7em">C</tspan></text>
  <text x="64.0" y="269.0" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="end" fill="#b7600c">= 1,80 m</text>

  <text x="210" y="426" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">b</tspan> = 0,40 m</text>
  <text x="270" y="473" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="#b7600c"><tspan font-style="italic">h</tspan> = 0,60 m</text>

  <text x="714" y="338" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#b7600c"><tspan font-style="italic">I</tspan><tspan baseline-shift="sub" font-size="0.7em">G</tspan> = 7,20·10⁻³ m⁴</text>

  <text x="880" y="492" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#b7600c">Δ = 16,7 mm</text>
</svg>
