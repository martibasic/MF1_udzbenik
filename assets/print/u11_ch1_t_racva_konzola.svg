<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 579 469" role="img" aria-labelledby="u11ch1_title u11ch1_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:579px;height:auto;">
  <title id="u11ch1_title">Otvorena T-račva s tri presjeka</title>
  <desc id="u11ch1_desc">Tlocrt vodoravne T-račve. Promjeri 180, 90 i 80 milimetara u istom su mjerilu. Fluid ima jednu povezanu ispunu kroz tri otvorena presjeka. Pozitivan y označuje poprečni vodoravni smjer. Izlazne brzine v2 i v3 jednake su i veće od v1. Sila fluida na račvu usmjerena je udesno i dolje na listu. Isprekidana granica označuje odabrani kontrolni volumen fluida; uz krutu stijenku granice se podudaraju.</desc>
