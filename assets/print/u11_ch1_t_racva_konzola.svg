<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
  <title id="title">U11 CH 1 - T-račva na sidrenoj konzoli</title>
  <desc id="desc">Vodoravna T-račva s jednim ulazom i dva izlaza, s jasno označenim presjecima, pretlakom na ulazu, protocima u granama i rezultantnom silom na sidrenu konzolu.</desc>
  <rect width="980" height="420" fill="#ffffff"/>
  <rect x="28" y="28" width="924" height="364" rx="18" fill="#ffffff" stroke="#c9d2d8" stroke-width="2"/>

  <text x="58" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#173043">U11 CH - T-račva na sidrenoj konzoli</text>
  <text x="58" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#516677">Integrativni zadatak: Bernoulli za grane, kontinuitet za podjelu protoka i momentum za silu na konzolu.</text>

  <path d="M118 250 L388 250 L388 146 L458 146" fill="none" stroke="#2d3a40" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M118 250 L388 250 L388 146 L458 146" fill="none" stroke="#d9edf4" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M118 250 L388 250 L388 146 L458 146" fill="none" stroke="#5b6770" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="388" y1="250" x2="520" y2="250" stroke="#2d3a40" stroke-width="28" stroke-linecap="round"/>
  <line x1="388" y1="250" x2="520" y2="250" stroke="#d9edf4" stroke-width="18" stroke-linecap="round"/>
  <line x1="388" y1="250" x2="520" y2="250" stroke="#5b6770" stroke-width="2.5" stroke-linecap="round"/>

  <rect x="166" y="196" width="160" height="116" rx="10" fill="none" stroke="#8b5e3c" stroke-width="3" stroke-dasharray="10 7"/>
  <rect x="190" y="170" width="132" height="28" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="206" y="189" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">kontrolni volumen</text>

  <line x1="70" y1="250" x2="118" y2="250" stroke="#1565c0" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <rect x="58" y="214" width="102" height="28" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="76" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">Q_1, v_1</text>

  <line x1="458" y1="146" x2="526" y2="146" stroke="#1565c0" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <rect x="468" y="108" width="102" height="28" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="486" y="127" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">Q_3, v_3</text>

  <line x1="520" y1="250" x2="600" y2="250" stroke="#1565c0" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <rect x="528" y="214" width="102" height="28" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="546" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">Q_2, v_2</text>

  <circle cx="118" cy="250" r="5" fill="#111827"/>
  <rect x="128" y="266" width="52" height="26" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="148" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#173043">1</text>

  <circle cx="520" cy="250" r="5" fill="#111827"/>
  <rect x="532" y="266" width="52" height="26" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="552" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#173043">2</text>

  <circle cx="458" cy="146" r="5" fill="#111827"/>
  <rect x="470" y="156" width="52" height="26" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="490" y="174" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#173043">3</text>

  <rect x="160" y="214" width="82" height="26" rx="6" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
  <text x="178" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">p_M1</text>

  <line x1="260" y1="250" x2="420" y2="250" stroke="#b42318" stroke-width="5" marker-end="url(#arrowRed)"/>
  <rect x="322" y="214" width="56" height="26" rx="6" fill="#ffffff" stroke="#d8c7c4" stroke-width="1.5"/>
  <text x="338" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#b42318">F_x</text>

  <line x1="260" y1="250" x2="260" y2="348" stroke="#b42318" stroke-width="5" marker-end="url(#arrowRed)"/>
  <rect x="272" y="292" width="56" height="26" rx="6" fill="#ffffff" stroke="#d8c7c4" stroke-width="1.5"/>
  <text x="288" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#b42318">F_y</text>

  <line x1="260" y1="250" x2="408" y2="334" stroke="#8e24aa" stroke-width="4.5" marker-end="url(#arrowMagenta)"/>
  <rect x="362" y="316" width="62" height="26" rx="6" fill="#ffffff" stroke="#d8c7e2" stroke-width="1.5"/>
  <text x="378" y="334" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#8e24aa">F_R</text>

  <line x1="630" y1="326" x2="630" y2="274" stroke="#6f7f89" stroke-width="3" marker-end="url(#arrowGray)"/>
  <line x1="578" y1="326" x2="630" y2="326" stroke="#6f7f89" stroke-width="3" marker-end="url(#arrowGray)"/>
  <text x="640" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">y</text>
  <text x="636" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">x</text>

  <rect x="656" y="118" width="246" height="184" rx="12" fill="#f8fafb" stroke="#d6dde2" stroke-width="1.5"/>
  <text x="678" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#173043">Čitanje skice</text>
  <text x="678" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">1. Bernoulli daje izlazne brzine u granama</text>
  <text x="678" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">2. Kontinuitet zatvara Q_1 = Q_2 + Q_3</text>
  <text x="678" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">3. Momentum daje F_x i F_y na racvi</text>
  <text x="678" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#173043">4. Konzola preuzima suprotnu rezultantu</text>
  <text x="678" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#516677">Sile, tlak i protoci izdvojeni su od geometrije tako da je</text>
  <text x="678" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#516677">redoslijed Bernoulli -> kontinuitet -> momentum odmah čitljiv.</text>

  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#1565c0"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#b42318"/>
    </marker>
    <marker id="arrowMagenta" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#8e24aa"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#6f7f89"/>
    </marker>
  </defs>
</svg>