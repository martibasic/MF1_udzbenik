  <rect x="54" y="452" width="870" height="52" rx="10" fill="#fffef6" stroke="#c49a0a" stroke-width="1.8"/>
  <text x="72" y="474" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043">Bernoulli (1&#x2192;2,3): v&#x2082;=v&#x2083;=10,0 m/s; v&#x2081;=4,49 m/s; Q&#x2081;=0,114 m&#xB3;/s</text>
  <text x="72" y="494" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#516677">F&#x2093;: p&#x2098;&#x2081;A&#x2081;+F&#x209C;&#x2093;=m&#x2D9;&#x2082;v&#x2082;&#x2212;m&#x2D9;&#x2081;v&#x2081;  &#x21D2;  F&#x209C;&#x2093;=&#x2212;892 N (stijenka na fluid)  &#x21D2;  fluid na raccvu: +892 N (&#x2192;)</text>
