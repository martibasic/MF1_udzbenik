<text x="75" y="389" font-size="12" fill="#c0392b" text-anchor="start">Fluid → račva</text>
<text x="224" y="414" font-size="13" fill="#c0392b" text-anchor="start">Fₓ &gt; 0, Fᵧ &lt; 0</text>
<text x="224" y="438" font-size="13" fill="#1e8449" text-anchor="start">Reakcija nosača: R = −F</text>
<text x="55" y="519" font-size="13" fill="#1a2530" text-anchor="start">Otvoreni izlazi: jednake brzine, različiti protoci.</text>
<text x="55" y="544" font-size="13" fill="#1a2530" text-anchor="start">Gubitci zanemareni; z₁ = z₂ = z₃.</text>
<rect x="609" y="28" width="321" height="34" rx="7" fill="white" stroke="none" stroke-width="1.2"/>
<text x="769.5" y="51" font-size="15" fill="#1565c0" text-anchor="middle" font-weight="700">Povezane bilance</text>
<rect x="609" y="77" width="321" height="58" rx="7" fill="white" stroke="#d4e3f0" stroke-width="1" stroke-opacity="0.65" />
<rect x="609" y="77" width="2" height="58" rx="1" fill="#1e8449" stroke="none" stroke-width="1.2"/>
<text x="624" y="98" font-size="13" fill="#1e8449" text-anchor="start" font-weight="700">Kontinuitet</text>
<text x="624" y="122" font-size="13" fill="#1a2530" text-anchor="start">A₁v₁ = A₂v₂ + A₃v₃</text>
<rect x="609" y="147" width="321" height="80" rx="7" fill="white" stroke="#d4e3f0" stroke-width="1" stroke-opacity="0.65" />
<rect x="609" y="147" width="2" height="80" rx="1" fill="#1565c0" stroke="none" stroke-width="1.2"/>
<text x="624" y="168" font-size="13" fill="#1565c0" text-anchor="start" font-weight="700">Energija do otvorenih izlaza</text>
<text x="624" y="192" font-size="13" fill="#1a2530" text-anchor="start">v₂ = v₃ ≈ 10,03 m/s</text>
<text x="624" y="214" font-size="13" fill="#1a2530" text-anchor="start">Q₁ ≈ 114 L/s</text>
<rect x="609" y="239" width="321" height="80" rx="7" fill="white" stroke="#d4e3f0" stroke-width="1" stroke-opacity="0.65" />
<rect x="609" y="239" width="2" height="80" rx="1" fill="#c0392b" stroke="none" stroke-width="1.2"/>
<text x="624" y="260" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Sila fluida na račvu</text>
<text x="624" y="284" font-size="13" fill="#1a2530" text-anchor="start">Fₓ = pM1 A₁ + ρ Q₁v₁ − ρ Q₂v₂</text>
<text x="624" y="306" font-size="13" fill="#1a2530" text-anchor="start">Fᵧ = −ρ Q₃v₃</text>
<rect x="609" y="331" width="321" height="80" rx="7" fill="white" stroke="#d4e3f0" stroke-width="1" stroke-opacity="0.65" />
<rect x="609" y="331" width="2" height="80" rx="1" fill="#c0392b" stroke="none" stroke-width="1.2"/>
<text x="624" y="352" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Rezultat</text>
<text x="624" y="376" font-size="13" fill="#1a2530" text-anchor="start">Fₓ ≈ +892 N; Fᵧ ≈ −505 N</text>
<text x="624" y="398" font-size="13" fill="#1a2530" text-anchor="start">|F| ≈ 1,03 kN</text>
