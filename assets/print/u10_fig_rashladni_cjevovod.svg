<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380" role="img" aria-labelledby="u10frc_u10rc-title u10frc_u10rc-desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:940px;height:auto;">
  <defs>
    <linearGradient id="u10frc_u10rc-wg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd5b8"/>
      <stop offset="100%" stop-color="#ff9966"/>
    </linearGradient>
    <pattern id="u10frc_u10rc-sraf" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#8090a0"/>
      <line x1="0" y1="8" x2="8" y2="0" stroke="#546e7a" stroke-width="1.8"/>
    </pattern>
    <marker id="u10frc_u10rc-arrG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#c2440c"/>
    </marker>
    <marker id="u10frc_u10rc-arrO" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#c49a0a"/>
    </marker>
    <marker id="u10frc_u10rc-arrOrev" markerWidth="10" markerHeight="10" refX="4" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L6,3 z" fill="#c49a0a"/>
    </marker>
  </defs>
  <rect width="940" height="380" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="332" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="2"/>
  <title id="u10frc_u10rc-title">U10 T2 – Rashladni cjevovod motora</title>
  <desc id="u10frc_u10rc-desc">Rashladni cjevovod motora: smjesa glikola ρ=1060 kg/m³, D=28 mm, L=1,20 m, v=2,8 m/s, Σξ=4,2 (ulaz, izlaz, 2 koljena). h_w=2,075 m, Δp=21,57 kPa.</desc>
  <!-- Titles -->
  <!-- === Engine block schematic === -->
  <!-- Engine body -->
  <rect x="350" y="120" width="240" height="140" rx="10" fill="#e8ecef" stroke="#546e7a" stroke-width="2.5"/>
  <text x="470" y="186" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#173043" text-anchor="middle">Motor</text>
  <text x="470" y="208" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#516677" text-anchor="middle">ρ=1060 kg/m³ (glikol)</text>
  <!-- === Cooling circuit: entry left (350,190), exit right (590,190) === -->
  <!-- Entry pipe: x=44..350, y=182..202 (coolant hot on left/inlet) -->
  <!-- Actually flow: pump (left) pushes through engine (right) and returns -->
  <!-- Inlet pipe to engine: x=44..350 -->
  <rect x="52" y="176" width="298" height="18" fill="url(#u10frc_u10rc-sraf)"/>
  <rect x="52" y="218" width="298" height="18" fill="url(#u10frc_u10rc-sraf)"/>
  <rect x="52" y="194" width="298" height="24" fill="url(#u10frc_u10rc-wg)" stroke="#546e7a" stroke-width="1.5"/>
  <!-- Exit pipe from engine: x=590..890 -->
  <rect x="590" y="176" width="298" height="18" fill="url(#u10frc_u10rc-sraf)"/>
  <rect x="590" y="218" width="298" height="18" fill="url(#u10frc_u10rc-sraf)"/>
  <rect x="590" y="194" width="298" height="24" fill="url(#u10frc_u10rc-wg)" stroke="#546e7a" stroke-width="1.5"/>
  <!-- Flow arrows (orange-red for hot coolant) -->
  <line x1="80" y1="206" x2="160" y2="206" stroke="#c2440c" stroke-width="3.5" marker-end="url(#u10frc_u10rc-arrG)"/>
  <line x1="680" y1="206" x2="760" y2="206" stroke="#c2440c" stroke-width="3.5" marker-end="url(#u10frc_u10rc-arrG)"/>
  <!-- Local loss symbols (elbows/fittings) -->
  <!-- Entry fitting ξ₁ = ulaz 0.5 -->
  <circle cx="100" cy="194" r="9" fill="#c49a0a" opacity="0.8"/>
  <text x="100" y="175" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#c49a0a" text-anchor="middle">ulaz</text>
  <text x="100" y="188" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#c49a0a" text-anchor="middle">ξ₁</text>
  <!-- Elbow at entry to engine: ξ₂ = koljeno 0.9 -->
  <circle cx="250" cy="194" r="9" fill="#c49a0a" opacity="0.8"/>
  <text x="250" y="175" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#c49a0a" text-anchor="middle">koljeno</text>
  <text x="250" y="188" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#c49a0a" text-anchor="middle">ξ₂</text>
  <!-- Exit elbow: ξ₃ -->
  <circle cx="700" cy="194" r="9" fill="#c49a0a" opacity="0.8"/>
  <text x="700" y="175" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#c49a0a" text-anchor="middle">koljeno</text>
  <text x="700" y="188" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#c49a0a" text-anchor="middle">ξ₃</text>
  <!-- Exit fitting: ξ₄ = izlaz -->
  <circle cx="840" cy="194" r="9" fill="#c49a0a" opacity="0.8"/>
  <text x="840" y="175" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#c49a0a" text-anchor="middle">izlaz</text>
  <text x="840" y="188" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#c49a0a" text-anchor="middle">ξ₄</text>
  <!-- Pipe label -->
  <text x="175" y="248" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#173043" text-anchor="middle">D=28 mm, v=2,8 m/s</text>
  <!-- === FORMULA BOX === -->
  <rect x="44" y="268" width="840" height="78" rx="12" fill="#fffef6" stroke="#c49a0a" stroke-width="1.8"/>
  <text x="464" y="290" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#173043" text-anchor="middle">Rješenje – Bernoulli duž rashladnog kruga</text>
  <text x="54" y="313" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#173043">v²/(2g) = 0,399 m    h_l = λ(L/D)·v²/(2g) = 0,028·(1,20/0,028)·0,399 = 0,399 m    h_loc = 4,2·0,399 = 1,676 m</text>
  <text x="54" y="333" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#0f766e">h_w = 2,075 m    Δp = ρg·h_w = 1060·9,81·2,075 = 21 570 Pa ≈ 21,6 kPa</text>
</svg>