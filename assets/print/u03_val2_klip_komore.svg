<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" role="img"
     aria-labelledby="u3v2T u3v2D" preserveAspectRatio="xMidYMid meet"
     style="display:block;width:100%;max-width:940px;height:auto;">
  <title id="u3v2T">Ravnoteza klipa i tlak u komorama A i B (Z25)</title>
  <desc id="u3v2D">Klip mase G_k na vodenom stupcu. Komora A (dublja, h1) i komora B (pliea, h2) spojene istim fluidom. Tlak raste s dubinom: pA veci od pB.</desc>
  <defs>
    <marker id="u3v2aF" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#92400e"/>
    </marker>
    <marker id="u3v2aR" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L0,8 L8,4 z" fill="#92400e"/>
    </marker>
    <marker id="u3v2gk" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L0,9 L9,4.5 z" fill="#c0392b"/>
    </marker>
    <linearGradient id="u3v2wa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4eef8"/>
      <stop offset="100%" stop-color="#5baece"/>
    </linearGradient>
    <pattern id="u3v2sp" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#8090a0"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#546e7a" stroke-width="1.8"/>
    </pattern>
  </defs>
  <!-- Pozadina i okvir -->
  <rect width="940" height="420" fill="#ffffff"/>
  <rect x="24" y="24" width="892" height="372" rx="16" fill="#ffffff" stroke="#d3d9de" stroke-width="1.8"/>

  <!-- ── KLIP (piston) i CILINDAR ── -->
  <!-- Lijevi zid cilindra (srafura) -->
  <rect x="376" y="106" width="16" height="196" fill="url(#u3v2sp)"/>
  <!-- Desni zid cilindra (srafura) -->
  <rect x="514" y="106" width="16" height="196" fill="url(#u3v2sp)"/>
  <!-- Dno cilindra -->
  <rect x="376" y="296" width="154" height="14" fill="url(#u3v2sp)"/>
  <!-- Voda unutar cilindra -->
  <rect x="392" y="124" width="122" height="172" fill="url(#u3v2wa)"/>
  <!-- Klip (sivi metalni pravokutnik) -->
  <rect x="372" y="106" width="162" height="22" rx="3" fill="#7b8d99" stroke="#4a5568" stroke-width="1.5"/>
  <!-- Crtkinasta linija na dnu klipa (granica klip/voda) -->
  <line x1="392" y1="128" x2="514" y2="128" stroke="#1a5f8a" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ── SILA G_k (strelica prema dolje na klip) ── -->
  <line x1="453" y1="56" x2="453" y2="105" stroke="#c0392b" stroke-width="2.5" marker-end="url(#u3v2gk)"/>
  <text x="462" y="78" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-style="italic" font-weight="700" fill="#c0392b">G</text>
  <text x="473" y="82" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#c0392b">k</text>
  <text x="396" y="100" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#546e7a" text-anchor="middle">A</text>
  <text x="411" y="100" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#546e7a">k</text>

  <!-- ── LIJEVA GRANA — komora A (dublja, h1) ── -->
  <!-- Zid horizontalne cijevi (lijevo) -->
  <rect x="148" y="232" width="242" height="20" fill="#546e7a"/>
  <!-- Voda u horizontalnoj cijevi (lijevo) -->
  <rect x="152" y="236" width="240" height="12" fill="url(#u3v2wa)"/>
  <!-- Komora A (kutija) - vanjski zid -->
  <rect x="70" y="220" width="86" height="72" rx="4" fill="#546e7a"/>
  <!-- Komora A - voda unutra -->
  <rect x="74" y="224" width="78" height="64" fill="url(#u3v2wa)"/>
  <!-- Oznaka A u komori -->
  <text x="113" y="265" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700"
        fill="#1a2530" text-anchor="middle">A</text>
  <!-- p_A oznaka -->
  <text x="64" y="216" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-style="italic"
        font-weight="700" fill="#c0392b">p</text>
  <text x="74" y="220" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#c0392b">A</text>
  <circle cx="113" cy="248" r="4" fill="#c0392b"/>

  <!-- ── DESNA GRANA — komora B (pliea, h2) ── -->
  <!-- Zid horizontalne cijevi (desno) -->
  <rect x="514" y="186" width="224" height="20" fill="#546e7a"/>
  <!-- Voda u horizontalnoj cijevi (desno) -->
  <rect x="518" y="190" width="220" height="12" fill="url(#u3v2wa)"/>
  <!-- Komora B (kutija) - vanjski zid -->
  <rect x="730" y="174" width="86" height="72" rx="4" fill="#546e7a"/>
  <!-- Komora B - voda unutra -->
  <rect x="734" y="178" width="78" height="64" fill="url(#u3v2wa)"/>
  <!-- Oznaka B u komori -->
  <text x="773" y="219" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700"
        fill="#1a2530" text-anchor="middle">B</text>
  <!-- p_B oznaka -->
  <text x="820" y="170" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-style="italic"
        font-weight="700" fill="#c0392b">p</text>
  <text x="830" y="174" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#c0392b">B</text>
  <circle cx="773" cy="202" r="4" fill="#c0392b"/>

  <!-- ── VEZA HORIZONTALNA GRANA — CILINDAR ── -->
  <!-- Lijeva grana prikeys na cilindar: cilindar lijevi zid probijen na y=236-248 -->
  <!-- Desna grana prikeys: desni zid probijen na y=190-202 -->
  <!-- Naznaka razine prikeys (isprekinana referentna linija) -->
  <line x1="156" y1="242" x2="392" y2="242" stroke="#1a5f8a" stroke-width="0.8" stroke-dasharray="5,4"/>
  <line x1="518" y1="196" x2="514" y2="196" stroke="#1a5f8a" stroke-width="0.8" stroke-dasharray="5,4"/>

  <!-- Referentna linija visine h2 (desno, isprekinana horizontalna) -->
  <line x1="526" y1="196" x2="600" y2="196" stroke="#b08040" stroke-width="0.8" stroke-dasharray="4,3"/>
  <!-- Referentna linija visine h1 (lijevo, isprekinana horizontalna) -->
  <line x1="300" y1="242" x2="370" y2="242" stroke="#b08040" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- ── KOTNE LINIJE ── -->
  <!-- h1: od dna klipa (y=128) do razine grane A (y=242), lijeva strana cilindra x=366 -->
  <line x1="366" y1="128" x2="366" y2="242" stroke="#92400e" stroke-width="1.6"
        marker-start="url(#u3v2aR)" marker-end="url(#u3v2aF)"/>
  <line x1="366" y1="128" x2="376" y2="128" stroke="#92400e" stroke-width="1"/>
  <line x1="366" y1="242" x2="376" y2="242" stroke="#92400e" stroke-width="1"/>
  <text x="348" y="190" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic"
        fill="#92400e" text-anchor="middle">h&#x2081;</text>

  <!-- h2: od dna klipa (y=128) do razine grane B (y=196), desna strana cilindra x=540 -->
  <line x1="540" y1="128" x2="540" y2="196" stroke="#92400e" stroke-width="1.6"
        marker-start="url(#u3v2aR)" marker-end="url(#u3v2aF)"/>
  <line x1="530" y1="128" x2="541" y2="128" stroke="#92400e" stroke-width="1"/>
  <line x1="530" y1="196" x2="541" y2="196" stroke="#92400e" stroke-width="1"/>
  <text x="556" y="167" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-style="italic"
        fill="#92400e">h&#x2082;</text>

  <!-- Natpis "voda" unutar cilindra -->
  <text x="453" y="220" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1a5f8a"
        text-anchor="middle">voda</text>
  <text x="453" y="235" font-family="'Segoe UI',Arial,sans-serif" font-size="10"
        fill="#4a8aaa" text-anchor="middle">(&#x03C1;, g)</text>

  <!-- ── KUTIJA FORMULE (desna strana) ── -->
  <rect x="612" y="32" width="294" height="356" rx="10"
        fill="#fffef6" stroke="#c49a0a" stroke-width="1.5"/>
  <text x="759" y="56" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700"
        fill="#1a2530" text-anchor="middle">Tlak pod klipom i u komorama</text>
  <line x1="622" y1="63" x2="896" y2="63" stroke="#ddd090" stroke-width="1"/>

  <text x="626" y="82" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#546e7a">Ravnoteza klipa (Newtonov 2. zakon):</text>
  <text x="626" y="99" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#1a2530">G&#x2096; = p&#x2098;&#x2097;&#x2097; &#xB7; A&#x2096;   &#x21D2;   p&#x2098;&#x2097;&#x2097; = G&#x2096; / A&#x2096;</text>

  <line x1="622" y1="108" x2="896" y2="108" stroke="#ddd090" stroke-width="0.8"/>
  <text x="626" y="126" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#546e7a">Hidrostatski tlak u komorama:</text>
  <text x="626" y="143" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#1a2530">p&#x2090; = p&#x2098;&#x2097;&#x2097; + &#x03C1;&#xB7;g&#xB7;h&#x2081;</text>
  <text x="626" y="161" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#1a2530">p&#x1D2E; = p&#x2098;&#x2097;&#x2097; + &#x03C1;&#xB7;g&#xB7;h&#x2082;</text>

  <line x1="622" y1="170" x2="896" y2="170" stroke="#ddd090" stroke-width="0.8"/>
  <text x="626" y="188" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#546e7a">Buduci da je h&#x2081; &gt; h&#x2082;:</text>
  <text x="626" y="206" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#1a2530">p&#x2090; &gt; p&#x1D2E;   (A dublje = veci tlak)</text>

  <line x1="622" y1="216" x2="896" y2="216" stroke="#ddd090" stroke-width="0.8"/>
  <text x="626" y="234" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#546e7a">Razlika tlakova:</text>
  <text x="626" y="251" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-style="italic" fill="#1a2530">p&#x2090; &#x2212; p&#x1D2E; = &#x03C1;&#xB7;g&#xB7;(h&#x2081; &#x2212; h&#x2082;)</text>

  <line x1="622" y1="260" x2="896" y2="260" stroke="#ddd090" stroke-width="0.8"/>
  <text x="626" y="278" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#546e7a">Dimenzije klipa i visine:</text>
  <text x="626" y="295" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#2c3e50">A&#x2096; — povrsina klipa [m&#xB2;]</text>
  <text x="626" y="311" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#2c3e50">h&#x2081; — dubina komore A ispod dna klipa</text>
  <text x="626" y="327" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#2c3e50">h&#x2082; — dubina komore B ispod dna klipa</text>
  <text x="626" y="343" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#2c3e50">&#x03C1; — gustoca fluida (voda)</text>

  <rect x="622" y="355" width="274" height="26" rx="6"
        fill="#e8f5e9" stroke="#1e8449" stroke-width="1.2"/>
  <text x="759" y="373" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="700"
        fill="#1e5c33" text-anchor="middle">p&#x2090; = p&#x2096; + &#x03C1;gh&#x2081;,  p&#x1D2E; = p&#x2096; + &#x03C1;gh&#x2082;</text>
</svg>