<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" role="img"
     aria-labelledby="u3vtT u3vtD" preserveAspectRatio="xMidYMid meet"
     style="display:block;width:100%;max-width:660px;height:auto;">
  <title id="u3vtT">Distribucijska mreža iz vodotornja – tlak u kućnom priključku</title>
  <desc id="u3vtD">Vodotoranj (Z_t=84 m) opskrbljuje vodovodom stambenu zgradu (Z_k=68 m). Visinska razlika ΔH=16 m daje manometarski tlak p_man≈156,7 kPa u kućnom priključku K.</desc>
  <defs>
    <marker id="u3vtaR"  markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#c0392b"/></marker>
    <marker id="u3vtaG"  markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#1e8449"/></marker>
    <marker id="u3vtaBlu" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#1565c0"/></marker>
    <marker id="u3vtaDim"  markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#b7600c"/></marker>
    <marker id="u3vtaDimL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L8,4 z" fill="#b7600c"/></marker>
    <linearGradient id="u3vtfl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aed6f1"/><stop offset="100%" stop-color="#7fb3d3"/>
    </linearGradient>
    <linearGradient id="u3vttower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8d0d5"/><stop offset="100%" stop-color="#7f8c8d"/>
    </linearGradient>
    <pattern id="u3vthatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8a9aa6" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="660" height="440" fill="#f8f9fa"/>
  <rect x="10" y="10" width="640" height="420" rx="12" fill="#ffffff" stroke="#dde3ea" stroke-width="1.5"/>

  <!-- Naslov -->
  <text x="330" y="33" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2530" text-anchor="middle">Distribucijska mreža vodotornja – tlak u kućnom priključku</text>
  <text x="330" y="49" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#5a6a78" text-anchor="middle">Z_t = 84 m n.m.,  Z_k = 68 m n.m.,  ΔH = 16 m,  ρ = 998 kg/m³</text>

  <!-- Tlo (linija, hatch ispod) -->
  <line x1="30" y1="360" x2="630" y2="360" stroke="#8b6914" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="30" y="360" width="600" height="14" fill="url(#u3vthatch)" opacity="0.45"/>
  <text x="40" y="373" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#5c4a00">tlo</text>

  <!-- ══ VODOTORANJ (lijevo) ══ -->
  <!-- Trup stupa -->
  <rect x="65" y="230" width="46" height="130" fill="url(#u3vttower)" stroke="#4a6070" stroke-width="1.8"/>
  <!-- Posuda vodotornja -->
  <rect x="45" y="160" width="86" height="70" rx="4" fill="url(#u3vttower)" stroke="#4a6070" stroke-width="1.8"/>
  <!-- Voda u posudi -->
  <rect x="52" y="168" width="72" height="46" fill="url(#u3vtfl)"/>
  <!-- Razina vode (Z_t=84m) -->
  <line x1="42" y1="168" x2="134" y2="168" stroke="#1565c0" stroke-width="2.0" stroke-dasharray="5,3"/>
  <!-- p_atm oznaka -->
  <text x="138" y="165" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5a6a78">p_atm</text>
  <!-- Z_t oznaka -->
  <text x="88" y="152" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1565c0" text-anchor="middle">Z_t = 84 m n.m.</text>
  <text x="88" y="420" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#4a6070" text-anchor="middle">vodotoranj</text>

  <!-- ══ DISTRIBUCIJSKI VOD (zakopan) ══ -->
  <!-- Vodovod: zakopan, od baze tornja (x~111) do baze zgrade (x~440), y~344 -->
  <line x1="111" y1="344" x2="440" y2="344" stroke="#1565c0" stroke-width="4.0"/>
  <text x="275" y="338" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#1565c0" text-anchor="middle">distribucijski vodovod (zakopan)</text>
  <!-- Strelica smjera toka -->
  <line x1="250" y1="344" x2="290" y2="344" stroke="#1565c0" stroke-width="3.0" marker-end="url(#u3vtaBlu)"/>
  <!-- Vertikalni priključni vod do zgrade -->
  <line x1="440" y1="344" x2="440" y2="290" stroke="#1565c0" stroke-width="3.5"/>

  <!-- ══ STAMBENA ZGRADA (desno) ══ -->
  <!-- Temelj -->
  <rect x="420" y="348" width="160" height="12" fill="#909fa8" stroke="#4a6070" stroke-width="1.2"/>
  <!-- Zidovi zgrade -->
  <rect x="430" y="228" width="140" height="120" fill="none" stroke="#4a6070" stroke-width="2.0"/>
  <!-- Horizontale katova -->
  <line x1="430" y1="268" x2="570" y2="268" stroke="#d0d8e0" stroke-width="0.9"/>
  <line x1="430" y1="308" x2="570" y2="308" stroke="#d0d8e0" stroke-width="0.9"/>
  <!-- Krov (trokut) -->
  <polygon points="415,228 500,188 585,228" fill="#c0392b" fill-opacity="0.35" stroke="#922b21" stroke-width="1.8"/>
  <text x="500" y="420" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#4a6070" text-anchor="middle">stambena zgrada</text>

  <!-- Priključak K (na visini Z_k=68m → y=290 apsolutno; pozicija: x=440, y=290) -->
  <circle cx="440" cy="290" r="9" fill="#c0392b" stroke="#922b21" stroke-width="1.5"/>
  <text x="427" y="286" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#c0392b" text-anchor="end">K</text>
  <text x="454" y="287" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#3a4a56">Z_k = 68 m n.m.</text>

  <!-- ══ KOTA ΔH (desno od svega) ══ -->
  <!-- Horizontalne linije za kotu: razina vodotornja y=168, razina priključka y=290 -->
  <line x1="592" y1="168" x2="598" y2="168" stroke="#b7600c" stroke-width="1"/>
  <line x1="592" y1="290" x2="598" y2="290" stroke="#b7600c" stroke-width="1"/>
  <line x1="595" y1="170" x2="595" y2="288" stroke="#b7600c" stroke-width="1.3" marker-start="url(#u3vtaDimL)" marker-end="url(#u3vtaDim)"/>
  <text x="606" y="225" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-style="italic" font-weight="700" fill="#b7600c">ΔH</text>
  <text x="606" y="241" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1a2530">= 16 m</text>

  <!-- Piezometrijska linija (vodoravna od razine vodotornja prema desno) -->
  <line x1="134" y1="168" x2="600" y2="168" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="8,5" opacity="0.5"/>
  <text x="320" y="163" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#1565c0" text-anchor="middle" font-style="italic">piezometarska linija (razina vodotornja)</text>

  <!-- ══ REZULTAT BOX ══ -->
  <rect x="240" y="376" width="300" height="46" rx="8" fill="#eaf9f1" stroke="#1e8449" stroke-width="1.3"/>
  <text x="390" y="395" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#3a4a56" text-anchor="middle">p_man = ρ·g·ΔH = 998·9,81·16</text>
  <text x="390" y="413" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e8449" text-anchor="middle">p_man ≈ 156,7 kPa  ✓  (zahtjev: 100 kPa)</text>
</svg>
