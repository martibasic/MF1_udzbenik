<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" role="img" aria-labelledby="u14ma_title u14ma_desc" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:980px;height:auto;">
<title id="u14ma_title">Machov broj u vodu i Strouhalov broj dimnjaka</title><desc id="u14ma_desc">Otvoren plinski vod i tlocrt kružnog dimnjaka. Promjer je normalan na tok. Vrtlozi imaju naizmjenične suprotne smjerove vrtnje; razmaci su shematski, a frekvencija slijedi iz zadanoga Strouhalova broja.</desc>
