  </defs><g font-family="Arial, Liberation Sans, sans-serif"><g transform="translate(0 0)"><g transform="translate(223.937 13.5)"><text data-source-text="1" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(38, 55, 70)">Putanja tlaka p₁ → p₂</text></g><g transform="translate(223.937 28.5)"><text data-source-text="2" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">GUSTOĆE FLUIDA</text></g><g transform="translate(223.937 43.5)"><text data-source-text="3" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">ρ<tspan font-size="9" font-weight="400" font-style="normal" fill="rgb(38, 55, 70)" baseline-shift="-2">v</tspan> = 1000 kg/m³</text></g><g transform="translate(223.937 59.167)"><text data-source-text="4" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">ρ<tspan font-size="9" font-weight="400" font-style="normal" fill="rgb(38, 55, 70)" baseline-shift="-2">mv</tspan> = 1035 kg/m³</text></g><g transform="translate(223.937 74.833)"><text data-source-text="5" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">ρ<tspan font-size="9" font-weight="400" font-style="normal" fill="rgb(38, 55, 70)" baseline-shift="-2">Hg</tspan> = 13 600 kg/m³</text></g><g transform="translate(223.937 90.5)"><text data-source-text="6" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">ρ<tspan font-size="9" font-weight="400" font-style="normal" fill="rgb(38, 55, 70)" baseline-shift="-2">zr</tspan> = 1,2 kg/m³</text></g><g transform="translate(223.937 106.167)"><text data-source-text="7" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">VISINE STUPACA</text></g><g transform="translate(223.937 121.167)"><text data-source-text="8" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">h<tspan font-size="9" font-weight="400" font-style="normal" fill="rgb(38, 55, 70)" baseline-shift="-2">1</tspan> = 0,60 m (slatka voda ↓)</text></g><g transform="translate(223.937 136.833)"><text data-source-text="10" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">h<tspan font-size="9" font-weight="400" font-style="normal" fill="rgb(38, 55, 70)" baseline-shift="-2">3</tspan> = 0,70 m (zrak ↑)</text></g><g transform="translate(223.937 152.5)"><text data-source-text="9" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">h<tspan font-size="9" font-weight="400" font-style="normal" fill="rgb(38, 55, 70)" baseline-shift="-2">2</tspan> = 0,10 m (živa ↑)</text></g><g transform="translate(223.937 168.167)"><text data-source-text="11" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">h<tspan font-size="9" font-weight="400" font-style="normal" fill="rgb(38, 55, 70)" baseline-shift="-2">4</tspan> = 0,40 m (morska ↓)</text></g><g transform="translate(223.937 183.833)"><text data-source-text="12" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">1) BEZ STUPCA ZRAKA</text></g><g transform="translate(223.937 198.833)"><text data-source-text="13" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">p₁ + ρ<tspan font-size="9" font-weight="400" font-style="italic" fill="rgb(38, 55, 70)" baseline-shift="-2">v</tspan>gh₁ − ρ<tspan font-size="9" font-weight="400" font-style="italic" fill="rgb(38, 55, 70)" baseline-shift="-2">Hg</tspan>gh₂ + ρ<tspan font-size="9" font-weight="400" font-style="italic" fill="rgb(38, 55, 70)" baseline-shift="-2">mv</tspan>gh₄ = p₂</text></g><g transform="translate(223.937 214.5)"><text data-source-text="14" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">p₁ − p₂ = g (ρ<tspan font-size="9" font-weight="400" font-style="italic" fill="rgb(38, 55, 70)" baseline-shift="-2">Hg</tspan>h₂ − ρ<tspan font-size="9" font-weight="400" font-style="italic" fill="rgb(38, 55, 70)" baseline-shift="-2">mv</tspan>h₄ − ρ<tspan font-size="9" font-weight="400" font-style="italic" fill="rgb(38, 55, 70)" baseline-shift="-2">v</tspan>h₁)</text></g><g transform="translate(223.937 230.167)"><text data-source-text="15" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">= 9,81 · (13 600 · 0,10 − 1035 · 0,40 − 1000 · 0,60)</text></g><g transform="translate(223.937 245.167)"><text data-source-text="16" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(38, 55, 70)">p₁ − p₂ = 3394,26 Pa ≈ 3,39 kPa</text></g><g transform="translate(223.937 260.167)"><text data-source-text="17" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">2) SA STUPCEM ZRAKA</text></g><g transform="translate(223.937 275.167)"><text data-source-text="18" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">p₁ − p₂ = g (ρ<tspan font-size="9" font-weight="400" font-style="italic" fill="rgb(38, 55, 70)" baseline-shift="-2">Hg</tspan>h₂ + ρ<tspan font-size="9" font-weight="400" font-style="italic" fill="rgb(38, 55, 70)" baseline-shift="-2">zr</tspan>h₃ − ρ<tspan font-size="9" font-weight="400" font-style="italic" fill="rgb(38, 55, 70)" baseline-shift="-2">mv</tspan>h₄ − ρ<tspan font-size="9" font-weight="400" font-style="italic" fill="rgb(38, 55, 70)" baseline-shift="-2">v</tspan>h₁)</text></g><g transform="translate(223.937 290.833)"><text data-source-text="19" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">= 9,81 · (1360 + 1,2·0,70 − 414 − 600)</text></g><g transform="translate(223.937 305.833)"><text data-source-text="20" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(38, 55, 70)">p₁ − p₂ = 3402,50 Pa ≈ 3,40 kPa</text></g><g transform="translate(223.937 320.833)"><text data-source-text="21" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">POGREŠKA ZBOG ZANEMARENJA ZRAKA</text></g><g transform="translate(223.937 335.833)"><text data-source-text="22" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">Δp = 3402,50 − 3394,26 = 8,24 Pa → δ = 8,24 / 3402,50 ≈ 0,24 %</text></g><g transform="translate(223.937 350.833)"><text data-source-text="23" x="0" y="0" text-anchor="middle" font-size="9" font-weight="600" fill="rgb(38, 55, 70)">REZULTAT</text></g><g transform="translate(223.937 365.833)"><text data-source-text="26" x="0" y="0" text-anchor="middle" font-size="9" font-weight="600" fill="rgb(38, 55, 70)">POGREŠKA</text></g><g transform="translate(223.937 380.833)"><text data-source-text="25" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(38, 55, 70)">p₁ − p₂ ≈ 3,39 kPa</text></g><g transform="translate(223.937 395.833)"><text data-source-text="24" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">(bez zraka)</text></g><g transform="translate(223.937 410.833)"><text data-source-text="27" x="0" y="0" text-anchor="middle" font-size="9" font-weight="600" fill="rgb(38, 55, 70)">≈ 0,24 %</text></g></g></g></svg>
