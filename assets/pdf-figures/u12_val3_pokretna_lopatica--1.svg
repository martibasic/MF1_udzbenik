<text data-source-text="6" x="0" y="12" text-anchor="start" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">= 15 m/s</text></g><g transform="translate(59.804 81.799)"><text data-source-text="5" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">c</text></g><g transform="translate(175.624 86.537)"><text data-source-text="9" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">c₂</text></g><g transform="translate(4 127.074)"><text data-source-text="8" x="0" y="0" text-anchor="start" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">d = 40 mm</text></g><g transform="translate(75.861 136.55)"><text data-source-text="7" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">c₁ = 24 m/s</text></g><g transform="translate(183.521 136.55)"><text data-source-text="11" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">u = 9 m/s</text></g><g transform="translate(187.206 182.878)"><text data-source-text="12" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">Fₓ ≈ 282 N</text></g><g transform="translate(175.624 215.519)"><text data-source-text="10" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">c₂</text></g><g transform="translate(108.469 234.019)"><text data-source-text="13" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">c₂x = u; relativni izlaz prati prednju stranu ploče.</text></g><g transform="translate(108.469 249.019)"><text data-source-text="14" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">Debljina razlijevanja je shematska.</text></g><g transform="translate(108.469 264.019)"><text data-source-text="15" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">c: apsolutna; c<tspan font-size="9" font-weight="400" font-style="normal" fill="rgb(38, 55, 70)" baseline-shift="-2">r</tspan>: relativna; u: brzina ploče.</text></g><g transform="translate(108.469 279.019)"><text data-source-text="16" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">Trokut ulaza: 5 px za 1 m/s.</text></g><g transform="translate(230.937 0)"><g transform="translate(108.469 13.5)"><text data-source-text="17" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(38, 55, 70)">Rješenje — pokretni kontrolni volumen</text></g><g transform="translate(108.469 28.5)"><text data-source-text="18" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(38, 55, 70)">Ulazni presjek</text></g><g transform="translate(108.469 43.5)"><text data-source-text="19" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">d = 40 mm; ρ = 998 kg/m³</text></g><g transform="translate(108.469 58.5)"><text data-source-text="20" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">A = πd²/4</text></g><g transform="translate(108.469 73.5)"><text data-source-text="21" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(38, 55, 70)">Relativni ulaz</text></g><g transform="translate(108.469 88.5)"><text data-source-text="22" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">c<tspan font-size="9" font-weight="400" font-style="normal" fill="rgb(38, 55, 70)" baseline-shift="-2">r</tspan> = c₁ − u = 15 m/s</text></g><g transform="translate(108.469 104.5)"><text data-source-text="23" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">ṁrel = ρA(c₁ − u)</text></g><g transform="translate(108.469 119.5)"><text data-source-text="24" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(38, 55, 70)">Sila fluida i snaga</text></g><g transform="translate(108.469 134.5)"><text data-source-text="25" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">ṁrel ≈ 18,81 kg/s</text></g><g transform="translate(108.469 149.5)"><text data-source-text="26" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">Fₓ = ṁrel(c₁ − u) ≈ 282 N</text></g><g transform="translate(108.469 164.5)"><text data-source-text="27" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(38, 55, 70)">Rad samo u smjeru gibanja</text></g><g transform="translate(108.469 179.5)"><text data-source-text="28" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">P = Fₓu ≈ 2,540 kW</text></g><g transform="translate(108.469 194.5)"><text data-source-text="29" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">Usporedi granice u = 0 i u = c₁.</text></g></g></g></svg>
