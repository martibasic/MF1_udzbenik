= 47,819 m</text></g><g transform="translate(15.649 150.469)"><text data-source-text="11" x="0" y="0" text-anchor="start" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">A₁ = 0,070 m²</text></g><g transform="translate(149.316 160.239)"><text data-source-text="12" x="0" y="0" text-anchor="start" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">A₂ = 0,0185 m²</text></g><g transform="translate(28.426 167.379)"><text data-source-text="7" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">v₁</text></g><g transform="translate(168.594 173.379)"><text data-source-text="8" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">v₂</text></g><g transform="translate(47.591 181.283)"><text data-source-text="9" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(38, 55, 70)">1</text></g><g transform="translate(129.137 182.035)"><text data-source-text="10" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(38, 55, 70)">2</text></g><g transform="translate(108.469 203.796)"><text data-source-text="13" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">z₁ = z₂; razmaci EGL − HGL: 5 px/m zraka.</text></g><g transform="translate(108.469 218.796)"><text data-source-text="14" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">Apsolutna visina EGL-a proizvoljna je jer ulazni tlak</text>
