ll="rgb(38, 55, 70)">Δp = 523,62 Pa ≈ 0,524 kPa</text></g><g transform="translate(108.469 163.5)"><text data-source-text="25" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(38, 55, 70)">Fizikalna provjera</text></g><g transform="translate(108.469 178.5)"><text data-source-text="26" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">v₂ > v₁; HGL₂ &lt; HGL₁</text></g><g transform="translate(108.469 193.5)"><text data-source-text="27" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">Ukupna mehanička energija je ista.</text></g></g></g></svg>
