  </defs><g font-family="Arial, Liberation Sans, sans-serif"><g transform="translate(223.937 13.5)"><text data-source-text="61" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">Tlakovi su skalarne oznake; dvostrane strelice su kote. Skice nisu u mjerilu.</text></g></g></svg>
