iddle" font-size="9" font-weight="600" fill="rgb(38, 55, 70)">We = ρv²L / σ</text></g><g transform="translate(69.979 170.67)"><text data-source-text="8" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">Parovi su shematski prikaz,</text></g><g transform="translate(69.979 185.67)"><text data-source-text="9" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">bez numeričkog mjerila.</text></g></g><g transform="translate(153.958 0)"><g transform="translate(69.979 13.5)"><text data-source-text="10" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(38, 55, 70)">Ključni brojevi</text></g><g transform="translate(69.979 28.5)"><text data-source-text="11" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(38, 55, 70)">Re = vL / ν</text></g><g transform="translate(69.979 43.5)"><text data-source-text="12" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">inercija / viskoznost</text></g><g transform="translate(69.979 58.5)"><text data-source-text="13" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(38, 55, 70)">Fr = v / √(gL)</text></g><g transform="translate(69.979 73.5)"><text data-source-text="14" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">slobodna površina</text></g><g transform="translate(69.979 88.5)"><text data-source-text="15" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(38, 55, 70)">Eu = Δp / (ρv²)</text></g><g transform="translate(69.979 103.5)"><text data-source-text="16" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">tlak, kavitacija</text></g><g transform="translate(69.979 118.5)"><text data-source-text="17" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(38, 55, 70)">We = ρv²L / σ</text></g><g transform="translate(69.979 133.5)"><text data-source-text="18" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">kapljice, mlaz</text></g><g transform="translate(69.979 148.5)"><text data-source-text="19" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(38, 55, 70)">Ma = v / a</text></g><g transform="translate(69.979 163.5)"><text data-source-text="20" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">stlačivost; prag je uvjetan</text></g></g><g transform="translate(307.916 0)"><g transform="translate(69.979 13.5)"><text data-source-text="21" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(38, 55, 70)">Model ↔ prototip (aerotunel)</text></g><g transform="translate(-346.513 -58.319) scale(0.515)"><g transform="matrix(1 0 0 1 0 0)"><rect xmlns="http://www.w3.org/2000/svg" x="680" y="150" width="256" height="140" fill="rgb(206, 222, 224)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" stroke-dasharray="none" fill-opacity="1" stroke-opacity="1" opacity="1" marker-start="none" marker-mid="none" marker-end="none" data-source-geometry="27"/></g></g><g transform="translate(-346.513 -58.319) scale(0.515)"><g transform="matrix(1 0 0 1 0 0)"><path xmlns="http://www.w3.org/2000/svg" d="M680 150 H936 M680 290 H936" fill="none" stroke="rgb(58, 74, 86)" stroke-width="2.263" stroke-linecap="butt" stroke-linejoin="miter" stroke-dasharray="none" fill-opacity="1" stroke-opacity="1" opacity="1" marker-start="none" marker-mid="none" marker-end="none" data-source-geometry="28"/></g></g><defs><marker xmlns="http://www.w3.org/2000/svg" id="u14fup_aR-print-2-29-marker-end" markerWidth="7.76" markerHeight="5.543" refX="6.5" refY="2.5" orient="auto" viewBox="0 0 7 5" markerUnits="userSpaceOnUse">
