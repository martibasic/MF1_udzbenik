ze="9.5" font-weight="600" fill="rgb(58, 74, 86)">ρ = 900 kg/m³</text></g><g transform="translate(108.469 58.5)"><text data-source-text="13" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(21, 101, 192)">ν = 0,18/900</text></g><g transform="translate(108.469 73.5)"><text data-source-text="14" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(30, 132, 73)">ν = 2,00·10⁻⁴ m²/s = 200 cSt</text></g><g transform="translate(108.469 88.5)"><text data-source-text="15" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(21, 101, 192)">1 cSt = 10⁻⁶ m²/s</text></g></g></g></svg>
