x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">F<tspan font-size="9" font-weight="400" font-style="normal" fill="rgb(38, 55, 70)" baseline-shift="-2">h</tspan>/b = ½ ρ g<tspan font-size="9" font-weight="400" font-style="normal" fill="rgb(38, 55, 70)" baseline-shift="-2">eff</tspan> s² ≈ 1689 N/m</text></g><g transform="translate(138.841 150.5)"><text data-source-text="18" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(38, 55, 70)">F<tspan font-size="9" font-weight="700" font-style="normal" fill="rgb(38, 55, 70)" baseline-shift="-2">R</tspan>/b ≈ 11,00 kN/m</text></g><g transform="translate(138.841 166.5)"><text data-source-text="19" x="0" y="0" text-anchor="middle" font-size="9" font-weight="600" fill="rgb(38, 55, 70)">4. Hvatište od ruba A (mjereno po stijenci)</text></g><g transform="translate(138.841 181.5)"><text data-source-text="20" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)"><tspan font-size="9" font-weight="400" font-style="italic" fill="rgb(38, 55, 70)">y</tspan> <tspan font-size="9" font-weight="400" font-style="normal" fill="rgb(38, 55, 70)" baseline-shift="-2">R</tspan> = [F<tspan font-size="9" font-weight="400" font-style="normal" fill="rgb(38, 55, 70)" baseline-shift="-2">0</tspan>(s/2) + F<tspan font-size="9" font-weight="400" font-style="normal" fill="rgb(38, 55, 70)" baseline-shift="-2">h</tspan>(2s/3)] / F<tspan font-size="9" font-weight="400" font-style="normal" fill="rgb(38, 55, 70)" baseline-shift="-2">R</tspan> → <tspan font-size="9" font-weight="700" font-style="normal" fill="rgb(38, 55, 70)">y</tspan><tspan font-size="9" font-weight="700" font-style="normal" fill="rgb(38, 55, 70)" baseline-shift="-2">R</tspan><tspan font-size="9" font-weight="700" font-style="normal" fill="rgb(38, 55, 70)"> ≈ 0,31 m</tspan></text></g><g transform="translate(138.841 197.5)"><text data-source-text="21" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">stijenka okomita na slobodnu površinu → jednolika + trokutasta</text>
<text data-source-text="21" x="0" y="12" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">raspodjela tlaka</text></g><g transform="translate(138.841 224.5)"><text data-source-text="22" x="0" y="0" text-anchor="middle" font-size="9" font-weight="600" fill="rgb(38, 55, 70)">REZULTATI</text></g><g transform="translate(138.841 239.5)"><text data-source-text="23" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(38, 55, 70)">α ≈ 70,9°</text></g><g transform="translate(138.841 254.5)"><text data-source-text="35" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(38, 55, 70)">s ≈ 0,582 m</text></g><g transform="translate(138.841 269.5)"><text data-source-text="24" x="0" y="0" text-anchor="middle" font-size="9" font-weight="600" fill="rgb(38, 55, 70)">F<tspan font-size="9" font-weight="700" font-style="normal" fill="rgb(38, 55, 70)" baseline-shift="-2">R</tspan>/b ≈ 11,0 kN/m</text></g><g transform="translate(138.841 284.5)"><text data-source-text="25" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(38, 55, 70)">y<tspan font-size="9" font-weight="700" font-style="normal" fill="rgb(38, 55, 70)" baseline-shift="-2">R</tspan> ≈ 0,31 m</text></g></g></svg>
