<text data-source-text="6" x="0" y="12" text-anchor="start" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">w₁ = 14 m/s</text></g><g transform="translate(56.776 104.217)"><text data-source-text="5" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">c</text></g><g transform="translate(174.346 108.92)"><text data-source-text="9" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">c₂</text></g><g transform="translate(4 149.155)"><text data-source-text="8" x="0" y="0" text-anchor="start" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">d = 38 mm</text></g><g transform="translate(75.326 158.56)"><text data-source-text="7" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">c₁ = 22 m/s</text></g><g transform="translate(182.184 158.56)"><text data-source-text="11" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">u = 8 m/s</text></g><g transform="translate(174.346 236.94)"><text data-source-text="10" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">c₂</text></g><g transform="translate(108.469 255.44)"><text data-source-text="12" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">c₂x = u; relativni izlaz prati prednju stranu ploče.</text></g><g transform="translate(108.469 270.44)"><text data-source-text="13" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">Debljina razlijevanja je shematska.</text></g><g transform="translate(108.469 285.44)"><text data-source-text="14" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">c: apsolutna; w: relativna; u: brzina ploče.</text></g><g transform="translate(108.469 300.44)"><text data-source-text="15" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">Trokut ulaza: 5 px za 1 m/s.</text></g><g transform="translate(230.937 0)"><g transform="translate(108.469 13.5)"><text data-source-text="16" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(38, 55, 70)">Rješenje — pokretni kontrolni volumen</text></g><g transform="translate(108.469 28.5)"><text data-source-text="17" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(38, 55, 70)">Ulazni presjek</text></g><g transform="translate(108.469 43.5)"><text data-source-text="18" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">d = 38 mm; ρ = 998 kg/m³</text></g><g transform="translate(108.469 58.5)"><text data-source-text="19" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">A = πd²/4</text></g><g transform="translate(108.469 73.5)"><text data-source-text="20" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(38, 55, 70)">Relativni ulaz</text></g><g transform="translate(108.469 88.5)"><text data-source-text="21" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">w₁ = c₁ − u = 14 m/s</text></g><g transform="translate(108.469 103.5)"><text data-source-text="22" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">ṁrel = ρA(c₁ − u)</text></g><g transform="translate(108.469 118.5)"><text data-source-text="23" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(38, 55, 70)">Protok kroz pokretni KV</text></g><g transform="translate(108.469 133.5)"><text data-source-text="24" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">ṁrel ≈ 15,85 kg/s</text></g><g transform="translate(108.469 148.5)"><text data-source-text="25" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">ṁsapnica ≈ 24,90 kg/s</text></g><g transform="translate(108.469 163.5)"><text data-source-text="26" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(38, 55, 70)">Usporedba</text></g><g transform="translate(108.469 178.5)"><text data-source-text="27" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">ṁrel / ṁsapnica = 14/22 ≈ 0,636</text></g><g transform="translate(108.469 193.5)"><text data-source-text="28" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">oko 63,6 % sapničkog protoka</text></g></g></g></svg>
