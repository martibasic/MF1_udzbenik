<text data-source-text="6" x="0" y="12" text-anchor="start" font-size="9" font-weight="400" fill="rgb(26, 37, 48)">= 14 m/s</text></g><g transform="translate(56.514 105.116)"><text data-source-text="5" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(21, 101, 192)">c</text></g><g transform="translate(173.499 109.796)"><text data-source-text="9" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(21, 101, 192)">c₂</text></g><g transform="translate(4 149.831)"><text data-source-text="8" x="0" y="0" text-anchor="start" font-size="9" font-weight="400" fill="rgb(183, 96, 12)">d = 38 mm</text></g><g transform="translate(74.971 159.19)"><text data-source-text="7" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(21, 101, 192)">c₁ = 22 m/s</text></g><g transform="translate(181.298 159.19)"><text data-source-text="11" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(183, 96, 12)">u = 8 m/s</text></g><g transform="translate(173.499 237.18)"><text data-source-text="10" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(21, 101, 192)">c₂</text></g><g transform="translate(108.469 255.68)"><text data-source-text="12" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(26, 37, 48)">c₂x = u; relativni izlaz prati prednju stranu ploče.</text></g><g transform="translate(108.469 270.68)"><text data-source-text="13" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(26, 37, 48)">Debljina razlijevanja je shematska.</text></g><g transform="translate(108.469 285.68)"><text data-source-text="14" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(26, 37, 48)">c: apsolutna; w: relativna; u: brzina ploče.</text></g><g transform="translate(108.469 300.68)"><text data-source-text="15" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(26, 37, 48)">Trokut ulaza: 5 px za 1 m/s.</text></g><g transform="translate(230.937 0)"><g transform="translate(108.469 13.5)"><text data-source-text="16" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(21, 101, 192)">Rješenje — pokretni kontrolni volumen</text></g><g transform="translate(108.469 28.5)"><text data-source-text="17" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(21, 101, 192)">Ulazni presjek</text></g><g transform="translate(108.469 43.5)"><text data-source-text="18" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(26, 37, 48)">d = 38 mm; ρ = 998 kg/m³</text></g><g transform="translate(108.469 58.5)"><text data-source-text="19" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(26, 37, 48)">A = πd²/4</text></g><g transform="translate(108.469 73.5)"><text data-source-text="20" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(21, 101, 192)">Relativni ulaz</text></g><g transform="translate(108.469 88.5)"><text data-source-text="21" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(26, 37, 48)">w₁ = c₁ − u = 14 m/s</text></g><g transform="translate(108.469 103.5)"><text data-source-text="22" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(26, 37, 48)">ṁrel = ρA(c₁ − u)</text></g><g transform="translate(108.469 118.5)"><text data-source-text="23" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(30, 132, 73)">Protok kroz pokretni KV</text></g><g transform="translate(108.469 133.5)"><text data-source-text="24" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(26, 37, 48)">ṁrel ≈ 15,85 kg/s</text></g><g transform="translate(108.469 148.5)"><text data-source-text="25" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(26, 37, 48)">ṁsapnica ≈ 24,90 kg/s</text></g><g transform="translate(108.469 163.5)"><text data-source-text="26" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(30, 132, 73)">Usporedba</text></g><g transform="translate(108.469 178.5)"><text data-source-text="27" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(26, 37, 48)">ṁrel / ṁsapnica = 14/22 ≈ 0,636</text></g><g transform="translate(108.469 193.5)"><text data-source-text="28" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(26, 37, 48)">oko 63,6 % sapničkog protoka</text></g></g></g></svg>
