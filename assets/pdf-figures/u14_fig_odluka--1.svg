    </marker></defs><g transform="translate(-29.244 -32.784) scale(0.639)"><g transform="matrix(1 0 0 1 0 0)"><line xmlns="http://www.w3.org/2000/svg" x1="466" y1="437" x2="516" y2="437" stroke="rgb(53, 107, 131)" stroke-width="2.19" marker-end="url(#u14fo_aG-print-0-11-marker-end)" fill="rgb(0, 0, 0)" stroke-linecap="butt" stroke-linejoin="miter" stroke-dasharray="none" fill-opacity="1" stroke-opacity="1" opacity="1" marker-start="none" marker-mid="none" data-source-geometry="11"/></g></g><g transform="translate(314.705 26.672)"><text data-source-text="8" x="0" y="0" text-anchor="start" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)"><tspan font-size="9" font-weight="700" font-style="italic" fill="rgb(38, 55, 70)">Fr</tspan> = v / √(gL) — gravitacija</text></g><g transform="translate(4 33.065)"><text data-source-text="2" x="0" y="0" text-anchor="start" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">1. Ima li slobodne površine ili valova?</text></g><g transform="translate(314.705 38.179)"><text data-source-text="9" x="0" y="0" text-anchor="start" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">brod, kanal, preljev</text></g><g transform="translate(314.705 70.145)"><text data-source-text="10" x="0" y="0" text-anchor="start" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)"><tspan font-size="9" font-weight="700" font-style="italic" fill="rgb(38, 55, 70)">Re</tspan> = vL / ν — viskoznost</text></g><g transform="translate(4 76.538)"><text data-source-text="3" x="0" y="0" text-anchor="start" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">2. Bitan režim / trenje uz stijenku?</text></g><g transform="translate(314.705 81.652)"><text data-source-text="11" x="0" y="0" text-anchor="start" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">prag ovisi o toku; kružna cijev ≈</text>
<text data-source-text="11" x="0" y="12" text-anchor="start" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">2300–4000</text></g><g transform="translate(314.705 113.618)"><text data-source-text="12" x="0" y="0" text-anchor="start" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)"><tspan font-size="9" font-weight="700" font-style="italic" fill="rgb(38, 55, 70)">We</tspan>, <tspan font-size="9" font-weight="700" font-style="italic" fill="rgb(38, 55, 70)">Bo</tspan> — napetost</text></g><g transform="translate(4 120.011)"><text data-source-text="4" x="0" y="0" text-anchor="start" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">3. Ima li kapljica, mlaza ili mjehura?</text></g><g transform="translate(314.705 125.126)"><text data-source-text="13" x="0" y="0" text-anchor="start" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">prag raspada ovisi o režimu;</text>
<text data-source-text="13" x="0" y="12" text-anchor="start" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">usporedi s L<tspan font-size="9" font-weight="400" font-style="normal" fill="rgb(38, 55, 70)" baseline-shift="-2">c</tspan></text></g><g transform="translate(314.705 157.091)"><text data-source-text="14" x="0" y="0" text-anchor="start" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">σ<tspan font-size="9" font-weight="400" font-style="normal" fill="rgb(38, 55, 70)" baseline-shift="-2">kav</tspan> = (p<tspan font-size="9" font-weight="400" font-style="normal" fill="rgb(38, 55, 70)" baseline-shift="-2">ref</tspan> − p<tspan font-size="9" font-weight="400" font-style="normal" fill="rgb(38, 55, 70)" baseline-shift="-2">v</tspan>)/(½ρv<tspan font-size="9" font-weight="400" font-style="normal" fill="rgb(38, 55, 70)" baseline-shift="-2">ref</tspan>²)</text></g><g transform="translate(4 163.484)"><text data-source-text="5" x="0" y="0" text-anchor="start" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">4. Može li tlak pasti do isparavanja?</text></g><g transform="translate(314.705 171.599)"><text data-source-text="15" x="0" y="0" text-anchor="start" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">usporedi s uređajno definiranim</text>
<text data-source-text="15" x="0" y="12" text-anchor="start" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">σ<tspan font-size="9" font-weight="400" font-style="normal" fill="rgb(38, 55, 70)" baseline-shift="-2">kr</tspan></text></g><g transform="translate(314.705 200.564)"><text data-source-text="16" x="0" y="0" text-anchor="start" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)"><tspan font-size="9" font-weight="700" font-style="italic" fill="rgb(38, 55, 70)">St</tspan> = fL / v</text></g><g transform="translate(4 206.957)"><text data-source-text="6" x="0" y="0" text-anchor="start" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">5. Periodičke sile / vrtložno otpuštanje?</text></g><g transform="translate(314.066 212.072)"><text data-source-text="17" x="0" y="0" text-anchor="start" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">za cilindar često reda 0,2 u</text>
<text data-source-text="17" x="0" y="12" text-anchor="start" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">određenom Re</text></g><g transform="translate(314.705 244.037)"><text data-source-text="18" x="0" y="0" text-anchor="start" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)"><tspan font-size="9" font-weight="700" font-style="italic" fill="rgb(38, 55, 70)">Ma</tspan> = v / a</text></g><g transform="translate(4 250.43)"><text data-source-text="7" x="0" y="0" text-anchor="start" font-size="9.5" font-weight="400" fill="rgb(38, 55, 70)">6. Je li brzina plina velika (v → a)?</text></g><g transform="translate(314.705 255.545)"><text data-source-text="19" x="0" y="0" text-anchor="start" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">Ma &lt; 0,3 često dopušta ρ ≈</text>
<text data-source-text="19" x="0" y="12" text-anchor="start" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">konst.</text></g><g transform="translate(223.937 286.045)"><text data-source-text="20" x="0" y="0" text-anchor="middle" font-size="9" font-weight="600" fill="rgb(38, 55, 70)">Što tražiš kao izlaz?</text></g><g transform="translate(223.937 301.045)"><text data-source-text="21" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(38, 55, 70)">otpor tijela → C<tspan font-size="9" font-weight="400" font-style="normal" fill="rgb(38, 55, 70)" baseline-shift="-2">d</tspan> · gubici u cijevi → λ · raspodjela tlaka → C<tspan font-size="9" font-weight="400" font-style="normal" fill="rgb(38, 55, 70)" baseline-shift="-2">p</tspan></text></g></g></svg>
