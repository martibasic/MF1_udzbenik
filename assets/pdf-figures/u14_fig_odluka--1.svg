<text data-source-text="11" x="0" y="12" text-anchor="start" font-size="9" font-weight="400" fill="rgb(90, 106, 120)">2300–4000</text></g><g transform="translate(315.423 114.921)"><text data-source-text="12" x="0" y="0" text-anchor="start" font-size="9.5" font-weight="400" fill="rgb(20, 83, 45)"><tspan font-size="9" font-weight="700" font-style="italic" fill="rgb(20, 83, 45)">We</tspan>, <tspan font-size="9" font-weight="700" font-style="italic" fill="rgb(20, 83, 45)">Bo</tspan> — napetost</text></g><g transform="translate(4.639 121.316)"><text data-source-text="4" x="0" y="0" text-anchor="start" font-size="9.5" font-weight="400" fill="rgb(22, 59, 87)">3. Ima li kapljica, mlaza ili mjehura?</text></g><g transform="translate(315.423 126.431)"><text data-source-text="13" x="0" y="0" text-anchor="start" font-size="9" font-weight="400" fill="rgb(90, 106, 120)">prag raspada ovisi o režimu;</text>
<text data-source-text="13" x="0" y="12" text-anchor="start" font-size="9" font-weight="400" fill="rgb(90, 106, 120)">usporedi s L_c</text></g><g transform="translate(315.423 158.405)"><text data-source-text="14" x="0" y="0" text-anchor="start" font-size="9.5" font-weight="400" fill="rgb(20, 83, 45)"><tspan font-size="9" font-weight="700" font-style="italic" fill="rgb(20, 83, 45)">σ</tspan> = (p_ref − p_v)/(½ρv_ref²)</text></g><g transform="translate(4 164.8)"><text data-source-text="5" x="0" y="0" text-anchor="start" font-size="9.5" font-weight="400" fill="rgb(22, 59, 87)">4. Može li tlak pasti do isparavanja?</text></g><g transform="translate(315.423 169.915)"><text data-source-text="15" x="0" y="0" text-anchor="start" font-size="9" font-weight="400" fill="rgb(90, 106, 120)">usporedi s uređajno definiranim</text>
<text data-source-text="15" x="0" y="12" text-anchor="start" font-size="9" font-weight="400" fill="rgb(90, 106, 120)">σ_kr</text></g><g transform="translate(314.784 201.889)"><text data-source-text="16" x="0" y="0" text-anchor="start" font-size="9.5" font-weight="400" fill="rgb(20, 83, 45)"><tspan font-size="9" font-weight="700" font-style="italic" fill="rgb(20, 83, 45)">St</tspan> = fL / v</text></g><g transform="translate(4.639 208.284)"><text data-source-text="6" x="0" y="0" text-anchor="start" font-size="9.5" font-weight="400" fill="rgb(22, 59, 87)">5. Periodičke sile / vrtložno otpuštanje?</text></g><g transform="translate(314.784 213.4)"><text data-source-text="17" x="0" y="0" text-anchor="start" font-size="9" font-weight="400" fill="rgb(90, 106, 120)">za cilindar često reda 0,2 u</text>
<text data-source-text="17" x="0" y="12" text-anchor="start" font-size="9" font-weight="400" fill="rgb(90, 106, 120)">određenom Re</text></g><g transform="translate(315.423 245.373)"><text data-source-text="18" x="0" y="0" text-anchor="start" font-size="9.5" font-weight="400" fill="rgb(20, 83, 45)"><tspan font-size="9" font-weight="700" font-style="italic" fill="rgb(20, 83, 45)">Ma</tspan> = v / a</text></g><g transform="translate(4.639 251.768)"><text data-source-text="7" x="0" y="0" text-anchor="start" font-size="9.5" font-weight="400" fill="rgb(22, 59, 87)">6. Je li brzina plina velika (v → a)?</text></g><g transform="translate(315.423 256.884)"><text data-source-text="19" x="0" y="0" text-anchor="start" font-size="9" font-weight="400" fill="rgb(90, 106, 120)">Ma &lt; 0,3 često dopušta ρ ≈</text>
<text data-source-text="19" x="0" y="12" text-anchor="start" font-size="9" font-weight="400" fill="rgb(90, 106, 120)">konst.</text></g><g transform="translate(223.937 287.384)"><text data-source-text="20" x="0" y="0" text-anchor="middle" font-size="9" font-weight="600" fill="rgb(122, 77, 16)">Što tražiš kao izlaz?</text></g><g transform="translate(223.937 302.384)"><text data-source-text="21" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(90, 58, 12)">otpor tijela → C_d · gubici u cijevi → λ · raspodjela tlaka → C_p</text></g></g></svg>
