, 43)">Fσ ∼ σL</text></g><g transform="translate(230.937 0)"><g transform="translate(108.469 13.5)"><text data-source-text="2" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(21, 101, 192)">Omjeri mjerila</text></g><g transform="translate(108.469 28.5)"><text data-source-text="5" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(21, 101, 192)">Re = ρvL/μ</text></g><g transform="translate(108.469 43.5)"><text data-source-text="6" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(26, 37, 48)">Re ∼ Fᵢ/Fμ</text></g><g transform="translate(108.469 58.5)"><text data-source-text="9" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(21, 101, 192)">Fr² = v²/(gL)</text></g><g transform="translate(108.469 73.5)"><text data-source-text="10" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(26, 37, 48)">Fr² ∼ Fᵢ/Fg</text></g><g transform="translate(108.469 88.5)"><text data-source-text="13" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(21, 101, 192)">Eu = Δp/(ρv²)</text></g><g transform="translate(108.469 103.5)"><text data-source-text="14" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(26, 37, 48)">Eu ∼ Fp/Fᵢ</text></g><g transform="translate(108.469 118.5)"><text data-source-text="17" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(21, 101, 192)">We = ρv²L/σ</text></g><g transform="translate(108.469 133.5)"><text data-source-text="18" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(26, 37, 48)">We ∼ Fᵢ/Fσ</text></g><g transform="translate(108.469 148.5)"><text data-source-text="21" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(21, 101, 192)">Bo = ΔρgL²/σ</text></g><g transform="translate(108.469 163.5)"><text data-source-text="22" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(26, 37, 48)">Bo ∼ Fg/Fσ samo ako Δρ ≈ ρ</text></g></g></g></svg>
