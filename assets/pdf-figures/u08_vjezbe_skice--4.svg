<text data-source-text="52" x="0" y="12" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgb(58, 74, 86)">protok − izlazni maseni protok</text></g><g transform="translate(76.139 55.5)"><text data-source-text="53" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(21, 101, 192)">Nepomična ploha: Q = ∫ v · n dA</text></g><g transform="translate(76.139 70.5)"><text data-source-text="54" x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(30, 132, 73)">Gibajuća ploha: Q<tspan font-size="9" font-weight="400" font-style="normal" fill="rgb(30, 132, 73)" baseline-shift="-2">rel</tspan> = ∫ (v − v<tspan font-size="9" font-weight="400" font-style="normal" fill="rgb(30, 132, 73)" baseline-shift="-2">KP</tspan>)</text>
<text data-source-text="54" x="0" y="12" text-anchor="middle" font-size="9.5" font-weight="400" fill="rgb(30, 132, 73)">· n dA</text></g><g transform="translate(76.139 97.5)"><text data-source-text="55" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(58, 74, 86)">Z2: puna ljubičasta crta jest</text>
<text data-source-text="55" x="0" y="12" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(58, 74, 86)">zamišljena ploha.</text></g><g transform="translate(76.139 124.5)"><text data-source-text="56" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(58, 74, 86)">Z5: klip je krut, osim središnjega</text>
<text data-source-text="56" x="0" y="12" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(58, 74, 86)">otvora.</text></g><g transform="translate(76.139 151.5)"><text data-source-text="57" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(58, 74, 86)">Isprekidana granica KV nije kruta</text>
<text data-source-text="57" x="0" y="12" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(58, 74, 86)">stijenka.</text></g><g transform="translate(76.139 178.5)"><text data-source-text="58" x="0" y="0" text-anchor="middle" font-size="9" font-weight="400" fill="rgb(58, 74, 86)">Z6: nakon dosezanja ruba nastaje</text>
